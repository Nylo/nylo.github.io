<!DOCTYPE html>
<html lang="it" data-home-inline>
<head>
<script src="/auth-gate.js"></script>
<script src="/home-btn.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Must-Follow is in the Cauldron</title>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#fdeed6;
  --surface:#fff8ec;
  --surface-raised:#f6e2c2;
  --accent:#5a2a8f;
  --accent-soft:rgba(90,42,143,0.14);
  --text:#2a1a3d;
  --text-soft:#6f5a85;
  --danger:#c0392b;
  --success:#1f8f58;
  --border:#e3cba6;
  --radius:10px;
  --gold:#f6c744;
  --s0:#35b98a; --s1:#e5262e; --s2:#1f5fd0; --s3:#f2b01e;
  --cw:46px; --ch:66px;
}
html,body{min-height:100%;color:var(--text);font-family:'Inter',sans-serif;font-size:14px}
body{background:radial-gradient(ellipse at 50% -20%,#fffaf0 0%,var(--bg) 62%,#f3d9b3 100%) fixed;background-color:var(--bg)}
.app{max-width:980px;margin:0 auto;padding:0 12px 48px}

.topbar{display:flex;align-items:center;gap:10px;padding:14px 0;margin-bottom:10px;flex-wrap:wrap}
.logo{font-family:'Fredoka',sans-serif;font-size:26px;font-weight:700;line-height:1.1;flex:1;min-width:190px;color:#3b1a66;letter-spacing:0.01em}
.logo em{color:#d4731d;font-style:normal}
.badge{background:var(--accent);color:#fff;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700;white-space:nowrap}
.btn{border-radius:7px;padding:8px 14px;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;cursor:pointer;background:transparent;color:var(--text-soft);border:1px solid var(--border)}
.btn:hover{background:var(--surface-raised)}
.btn-sm{padding:5px 10px;font-size:12px}
.opt-toggle{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-soft);cursor:pointer;border:0;border-radius:20px;padding:4px 10px;user-select:none}
.opt-toggle input{accent-color:var(--accent);cursor:pointer}
.menu-wrap{position:relative;margin-left:auto}
.hamb{display:inline-flex;align-items:center;justify-content:center;width:34px;height:30px;border-radius:7px;background:transparent;color:var(--text-soft);border:1px solid var(--border);cursor:pointer}
.hamb:hover{background:var(--surface-raised);color:var(--text)}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);z-index:30;min-width:220px;display:flex;flex-direction:column;gap:4px;padding:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 10px 24px rgba(40,20,70,0.3)}
.menu-pop .opt-toggle{border:0;border-radius:6px;padding:9px 10px;font-size:13px;color:var(--text);white-space:nowrap}
.menu-pop .opt-toggle:hover{background:var(--accent-soft)}
.flag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;vertical-align:middle;white-space:nowrap}
.flag.first{background:var(--gold);color:#2a2000}
.flag.lead{background:#fff;color:#2a1a3d;border:1px solid rgba(0,0,0,0.35)}
.log{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-top:12px;margin-bottom:12px;font-size:12px;color:var(--text-soft);line-height:1.6}
.log summary{cursor:pointer;font-weight:600;letter-spacing:0.05em}
.logbody{margin-top:8px;max-height:260px;overflow-y:auto;padding-right:6px}
.logbody div{border-bottom:1px solid var(--border);padding:1px 0}
.name-modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(20,10,40,0.6);padding:16px}
.name-box{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:20px;width:min(340px,100%);display:flex;flex-direction:column;gap:12px;box-shadow:0 14px 40px rgba(20,10,40,0.5)}
.name-box h3{font-family:'Fredoka',sans-serif;font-size:19px}
.name-box p{font-size:12px;color:var(--text-soft)}
.name-box input{padding:9px 11px;border-radius:7px;border:1px solid var(--border);background:#fff;color:var(--text);font-size:14px;font-family:inherit;outline:none}
.name-box input:focus{border-color:var(--accent)}

.dock{position:sticky;top:0;z-index:10;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 18px rgba(60,30,90,0.18)}
.dock-msg{font-size:13px;line-height:1.5}
.dock-title{font-size:11px;font-weight:600;color:var(--text-soft);letter-spacing:0.05em}
.opts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.opt{background:var(--surface-raised);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px 12px;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.12s;text-align:left}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{opacity:0.35;cursor:not-allowed}
.hint{font-size:12px;color:var(--text-soft)}
.mv{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-soft)}
table.score{border-collapse:collapse;font-size:12px;width:100%}
table.score td,table.score th{padding:5px 8px;border-bottom:1px solid var(--border);text-align:right;vertical-align:middle}
table.score td:first-child,table.score th:first-child{text-align:left}
table.score td.det{font-size:11px;color:var(--text-soft);white-space:normal;min-width:110px}
table.score .neg{color:var(--danger)}
table.score .pos{color:var(--success)}

.table{display:grid;grid-template-columns:1fr 1.3fr 1fr;grid-template-areas:". top ." "left center right" "bottom bottom bottom";gap:10px;background:radial-gradient(ellipse at center,#4a2a78 0%,#1d0f33 100%);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:12px;min-height:560px;color:#f6eefc}
.table.n3{grid-template-areas:"left center right" "bottom bottom bottom"}
.seat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;border-radius:10px;border:1px solid transparent;text-align:center;min-width:0}
.seat.top{grid-area:top}
.seat.left{grid-area:left;justify-content:center} .seat.right{grid-area:right;justify-content:center}
.seat.bottom{grid-area:bottom}
.seat.leader{border-color:rgba(246,199,68,0.55);background:rgba(255,255,255,0.07)}
.seat.active{border-color:var(--gold);background:rgba(246,199,68,0.16)}
.seat.winner{border-color:#88e8bd;background:rgba(136,232,189,0.18)}
.seat-name{font-weight:600;font-size:13px}
.seat-meta{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center;font-size:11px}
.tag{background:rgba(0,0,0,0.42);border-radius:4px;padding:2px 6px;color:#fff;display:inline-flex;align-items:center;gap:4px}
.tag b{color:var(--gold)}
.backs{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:230px}
.seat.top .backs,.seat.left .backs,.seat.right .backs{max-width:130px}
.bn{width:20px;height:28px;border:1px solid #d9c6f1;border-radius:4px;background:linear-gradient(145deg,#8b5fc4,#3b1a66);display:inline-block}
.tableau{display:flex;gap:4px;align-items:center;justify-content:center;min-height:74px;padding:4px 6px;border-radius:8px;background:rgba(255,255,255,0.08);min-width:56px}
.tableau .empty{width:46px;height:64px;border:1px dashed rgba(255,255,255,0.4);border-radius:6px}

/* carte: il colore e l'icona indicano il seme, il piccolo cerchio in basso la briscola se quel seme è di mano */
.pc{width:var(--cw);height:var(--ch);border-radius:7px;border:2px solid rgba(255,255,255,0.92);position:relative;flex-shrink:0;padding:0;box-shadow:0 2px 5px rgba(0,0,0,0.45);color:#fff;font-family:'Fredoka',sans-serif;display:inline-block;overflow:hidden}
.pc b{position:absolute;left:0;right:0;top:50%;transform:translateY(-54%);text-align:center;font-size:26px;font-weight:700;line-height:1}
.pc i.su{position:absolute;left:4px;top:3px;font-size:14px;line-height:1;font-style:normal}
.pc small.tr{position:absolute;right:3px;bottom:3px;width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,0.93);display:grid;place-items:center;font-size:11px;line-height:1}
.pc small.tr i{font-style:normal;line-height:1}
.t0{color:var(--s0)} .t1{color:var(--s1)} .t2{color:var(--s2)} .t3{color:#d99a0b}
.pc em.x{position:absolute;right:3px;top:3px;font-style:normal;font-family:'Inter',sans-serif;font-size:9px;font-weight:700;background:#fff;color:var(--accent);border-radius:6px;padding:0 3px;line-height:13px}
.pc small.lt{display:none;position:absolute;left:3px;bottom:3px;font-family:'Inter',sans-serif;font-size:9px;font-weight:700}
.pc em.cp{position:absolute;left:2px;bottom:2px;font-style:normal;font-size:11px;background:rgba(0,0,0,0.55);color:#fff;border-radius:50%;width:15px;height:15px;display:grid;place-items:center}
.pc.mini{width:42px;height:60px}
.pc.mini b{font-size:23px}
.pc.mini small.tr{width:14px;height:14px;font-size:9px}
.s0{background-color:var(--s0);color:#0b2a1f}
.s1{background-color:var(--s1)}
.s2{background-color:var(--s2)}
.s3{background-color:var(--s3);color:#3a2800}
body.a11y .s0.pc,body.a11y .s0.sw{background-image:repeating-linear-gradient(90deg,rgba(0,0,0,0.2) 0 2px,transparent 2px 6px)}
body.a11y .s1.pc,body.a11y .s1.sw{background-image:radial-gradient(rgba(255,255,255,0.4) 22%,transparent 24%);background-size:8px 8px}
body.a11y .s2.pc,body.a11y .s2.sw{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,0.3) 0 2px,transparent 2px 7px)}
body.a11y .s3.pc,body.a11y .s3.sw{background-image:repeating-linear-gradient(0deg,rgba(0,0,0,0.2) 0 2px,transparent 2px 6px)}
.pc.win{box-shadow:0 0 0 3px #88e8bd}
button.pc{cursor:pointer;transition:transform 0.12s}
button.pc:hover:not(:disabled){transform:translateY(-6px)}
button.pc:disabled{cursor:default}
.pc.dim{opacity:0.4;filter:saturate(0.5)}
.pc.legal{box-shadow:0 0 0 3px var(--gold)}
.pc.sel{transform:translateY(-12px);box-shadow:0 0 0 3px #fff,0 0 0 6px var(--gold)}
.pot .pc.sel{transform:translateY(-3px)}
.pc.fresh{box-shadow:0 0 0 3px #88e8bd}
.hand{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.sw{display:inline-flex;align-items:center;gap:3px;padding:1px 8px;border-radius:5px;font-weight:700;font-size:11px;border:1px solid rgba(0,0,0,0.3);color:#fff}
.sw.s0{color:#0b2a1f} .sw.s3{color:#3a2800}
.sw i{font-style:normal}

.center{grid-area:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;font-size:12px;line-height:1.5;min-width:0}
.center b{color:var(--gold)}
.pot{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 12px 14px;border:3px solid #8a8a99;border-radius:12px 12px 48px 48px;background:radial-gradient(ellipse at 50% 15%,#55556a 0%,#24242d 100%);max-width:100%}
.pot-t{font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#dcdce6;display:flex;align-items:center;gap:6px}
.pot-cards{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.cyc{display:flex;align-items:center;gap:3px;flex-wrap:wrap;justify-content:center}
.cyc .ar{opacity:0.8;font-size:12px}

.recap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.recap h3{font-size:12px;font-weight:600;letter-spacing:0.05em;color:var(--text-soft)}
.recap-row{display:block;font-size:12px;line-height:1.7}
.recap-row > *{margin-right:6px}
.recap-row .lbl{font-weight:600;color:var(--text-soft)}
.recap-row .sw,.recap-row .ar{vertical-align:middle}
.recap-row b{margin-right:0}
.recap-row .cyc{display:inline-flex;vertical-align:middle}
details.rules{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
details.rules summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--text-soft);letter-spacing:0.05em}
details.recap{display:block;padding:14px 16px}
details.recap>summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--text-soft);letter-spacing:0.05em}
details.recap[open]>summary{margin-bottom:10px}
details.recap[open]>:not(summary)+*{margin-top:10px}
.rtext h4{font-family:'Fredoka',sans-serif;font-size:15px;color:#5a2a8f;margin:14px 0 4px}
.rtext p,.rtext li{font-size:12px;line-height:1.6;color:var(--text-soft);margin-bottom:6px}
.rtext ul{padding-left:18px}
.rtext a{color:#5a2a8f}

@media(max-width:600px){
  :root{--cw:32px;--ch:48px}
  .pc b{font-size:19px}
  .pc{border-width:1px;border-radius:5px}
  .pc i.su{font-size:10px;left:2px;top:2px}
  .pc small.tr{width:12px;height:12px;font-size:8px;right:2px;bottom:2px}
  .pc em.x{font-size:7px;line-height:10px;right:2px;top:2px}
  .pc.mini{width:30px;height:44px}
  .pc.mini b{font-size:16px}
  .pc.mini small.tr{width:11px;height:11px;font-size:7px}
  .pc em.cp{width:11px;height:11px;font-size:8px}
  .tableau .empty{width:30px;height:44px}
  .table{padding:8px;gap:6px;grid-template-columns:1fr 1.25fr 1fr}
  .pot{padding:6px 6px 12px}
  .bn{width:15px;height:22px}
  .seat.top .backs,.seat.left .backs,.seat.right .backs{max-width:100px}
  .hand{gap:3px}
  .logo{font-size:21px}
}
</style>

<body>
<div class="app" id="app"></div>

<script>
// ═════════════════════════ COSTANTI ═════════════════════════
// i semi formano un ciclo: Verde → Rosso → Blu → Giallo → Verde. La briscola è il seme che segue quello di mano.
const SUITS = [
  {n:'Verde', icon:'leaf',      lt:'Ve'},
  {n:'Rosso', icon:'fire',      lt:'Ro'},
  {n:'Blu',   icon:'drop',      lt:'Bl'},
  {n:'Giallo',icon:'lightning', lt:'Gi'}
];
const TRICKS = 11;
const TARGET = {3:4, 4:3};                // prese per 2 punti (una in più: 1 punto)
const WINSCORE = 3;
const POS = {3:['bottom','left','right'], 4:['bottom','left','top','right']};
const NAMES = ['Tu','AI Morgana','AI Circe','AI Ecate'];
const HUM = 0;
const ico = n => `<i class="ph-fill ph-${n}"></i>`;
const trumpOf = s => (s+1)%4;
const CARDS = SUITS.map((_,s)=>Array.from({length:13},(_,r)=>({s,r})));      // CARDS[seme][rango 1..12]

// ═════════════════════════ UTILITÀ ═════════════════════════
const rnd = n => Math.floor(Math.random()*n);
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const ABORT = {abort:true};
let G = null, PR = null;
const OPT = {undo:true,a11y:false};
try{ const s=localStorage.getItem('cauldron-undo'); if(s!==null) OPT.undo=s==='1'; OPT.a11y=localStorage.getItem('cauldron-a11y')==='1'; }catch(e){}
const delay = ms => new Promise(r=>setTimeout(r,ms));
async function sleep(ms){ const g=G; await delay(ms); if(g!==G) throw ABORT; }
const P = i => G.pl[i];
function logMsg(t){ G.log.unshift(t); if(G.log.length>800) G.log.pop(); render(); }
function status(t){ G.msg=t; render(); }
const cname = c => `${SUITS[c.s].n} ${c.r}`;

// ═════════════════════════ INTERAZIONE ═════════════════════════
function askChoose(title,options){
  const g=G;
  return new Promise((res,rej)=>{ PR={type:'choose',title,options,res,rej}; render(); }).then(v=>{ if(g!==G) throw ABORT; return v; });
}
// scelta della carta da giocare: dalla mano o dal calderone
function askMove(legal,hint){
  const g=G;
  return new Promise((res,rej)=>{ PR={type:'move',legal:{hand:new Set(legal.hand),caul:new Set(legal.caul)},hint,sel:null,res,rej}; render(); }).then(v=>{ if(g!==G) throw ABORT; return v; });
}
// scelta della carta della mano da mettere nel calderone al posto di quella giocata (-1 = indietro)
function askRepl(ci){
  const g=G;
  return new Promise((res,rej)=>{ PR={type:'repl',ci,sel:null,res,rej}; render(); }).then(v=>{ if(g!==G) throw ABORT; return v; });
}
function answer(i){
  if(!PR||PR.type!=='choose') return;
  const o=PR.options[i]; if(!o||o.disabled) return;
  const r=PR.res; PR=null; render(); r(o.value);
}
function pickMove(src,idx){
  if(!PR||PR.type!=='move') return;
  if(!(src==='h'?PR.legal.hand:PR.legal.caul).has(idx)) return;
  const v={src,idx};
  if(OPT.undo){ PR.sel=v; render(); return; }
  const r=PR.res; PR=null; render(); r(v);
}
function confirmMove(ok){
  if(!PR||PR.type!=='move'||PR.sel==null) return;
  if(!ok){ PR.sel=null; render(); return; }
  const v=PR.sel, r=PR.res; PR=null; render(); r(v);
}
function pickRepl(idx){
  if(!PR||PR.type!=='repl') return;
  if(OPT.undo){ PR.sel=idx; render(); return; }
  const r=PR.res; PR=null; render(); r(idx);
}
function confirmRepl(ok){
  if(!PR||PR.type!=='repl'||PR.sel==null) return;
  if(!ok){ PR.sel=null; render(); return; }
  const v=PR.sel, r=PR.res; PR=null; render(); r(v);
}
function backRepl(){
  if(!PR||PR.type!=='repl') return;
  const r=PR.res; PR=null; render(); r(-1);
}

// ═════════════════════════ REGOLE (funzioni pure) ═════════════════════════
// 4 giocatori: 48 carte (1–12 in 4 semi); 3 giocatori: solo i ranghi 4–12 (36 carte)
function makeDeck(n){
  const d=[];
  for(let s=0;s<4;s++) for(let r=n===3?4:1;r<=12;r++) d.push(CARDS[s][r]);
  return d;
}
const sortHand = h => h.sort((a,b)=>a.s-b.s||a.r-b.r);
const leadOf = S => S.trick.length?S.trick[0].card.s:-1;
// l'obbligo di risposta guarda il CALDERONE, non la mano:
// 1) nel calderone c'è il seme di mano → si gioca quel seme; 2) altrimenti, se c'è la briscola → seme di mano o briscola; 3) altrimenti carta libera
function allowFn(caul,lead){
  if(lead<0) return ()=>true;
  if(caul.some(c=>c.s===lead)) return c=>c.s===lead;
  const tr=trumpOf(lead);
  if(caul.some(c=>c.s===tr)) return c=>c.s===lead||c.s===tr;
  return ()=>true;
}
function legalMoves(S,p){
  const ok=allowFn(S.cauldron,leadOf(S)), hand=[], caul=[];
  S.pl[p].hand.forEach((c,i)=>{ if(ok(c)) hand.push(i); });
  S.cauldron.forEach((c,i)=>{ if(ok(c)) caul.push(i); });
  return {hand,caul};
}
// mv = {src:'h',idx} oppure {src:'c',idx,repl}: dal calderone si gioca la carta idx e al suo posto si mette la carta repl della mano
function applyMove(S,p,mv){
  const pl=S.pl[p];
  let card, repl=null;
  if(mv.src==='h') card=pl.hand.splice(mv.idx,1)[0];
  else{ card=S.cauldron[mv.idx]; repl=pl.hand.splice(mv.repl,1)[0]; S.cauldron[mv.idx]=repl; }
  S.trick.push({p,card,fromC:mv.src==='c',repl});
  return card;
}
// vince la briscola più alta; senza briscole, il seme di mano più alto
function trickWinner(trick){
  const lead=trick[0].card.s, tr=trumpOf(lead);
  let best=trick[0], bk=-1;
  for(const x of trick){
    const c=x.card, k=c.s===tr?100+c.r:(c.s===lead?c.r:0);
    if(k>bk){ bk=k; best=x; }
  }
  return best.p;
}
// ogni 12 nella presa vale una presa in più per chi la vince
const trickGain = trick => 1+trick.reduce((a,x)=>a+(x.card.r===12?1:0),0);
const ptsFor = (cnt,n) => { const T=TARGET[n]; return cnt===T?2:(cnt===T+1?1:0); };
function gameWinners(scores){
  const mx=Math.max(...scores);
  return scores.map((s,i)=>s===mx?i:-1).filter(i=>i>=0);
}

// ═════════════════════════ AI ═════════════════════════
// Le AI simulano il resto del round (Monte Carlo): distribuiscono a caso le carte che non vedono,
// finiscono la partita con una regola semplice e scelgono la mossa col punteggio atteso migliore.
const MC = {r1:10,r2:26,top:8};
// regola semplice usata nelle simulazioni: vince solo se serve a centrare il numero di prese giusto
function heurMove(S,p){
  const pl=S.pl[p], hand=pl.hand, caul=S.cauldron, n=S.n, T=TARGET[n];
  const lead=leadOf(S), ok=allowFn(caul,lead);
  const c=pl.won, rem=TRICKS-S.trickNo+1, m=n-S.trick.length-1, need=T-c;
  const want=need<=0?0:Math.min(1,need/rem);
  let tw=0; for(const x of S.trick) if(x.card.r===12) tw++;
  // carta di rimpiazzo se si gioca dal calderone: quella che serve meno
  let ri=0;
  for(let i=1;i<hand.length;i++){ if(want>0.5?hand[i].r<hand[ri].r:hand[i].r>hand[ri].r) ri=i; }
  const replR=hand.length?hand[ri].r:0;
  let best=null, bs=Infinity;
  const test=(card,src,idx)=>{
    const L=lead<0?card.s:lead, tr=trumpOf(L);
    const kc=card.s===tr?100+card.r:(card.s===L?card.r:0);
    let win=true;
    for(const x of S.trick){ const k=x.card.s===tr?100+x.card.r:(x.card.s===L?x.card.r:0); if(k>kc){ win=false; break; } }
    let pWin=0;
    const gain=1+tw+(card.r===12?1:0);
    if(win){
      let p1;
      if(card.s===tr) p1=(12-card.r)/12*0.5;
      else if(caul.some(z=>z.s===L)) p1=(12-card.r)/12*0.6;
      else p1=0.2+(12-card.r)/12*0.4;
      pWin=Math.pow(1-Math.min(0.85,p1),m);
    }
    const hs=src==='h'?card.r:replR;
    let cost=Math.abs(pWin-want)*4+(want>0.5?hs*0.05:-hs*0.08)+Math.random()*0.03;
    if(win){
      const after=c+gain;
      if(after>T+1) cost+=3*pWin; else if(after>T) cost+=1.2*pWin; else if(need>0) cost-=0.25*pWin*(gain-1);
    }
    if(cost<bs){ bs=cost; best={src,idx,repl:ri}; }
  };
  hand.forEach((cd,i)=>{ if(ok(cd)) test(cd,'h',i); });
  caul.forEach((cd,i)=>{ if(ok(cd)) test(cd,'c',i); });
  return best;
}
// gioca fino alla fine del round (la presa in corso è già impostata in S.trick)
function playOutS(S){
  for(;;){
    while(S.trick.length<S.n){ const q=(S.leader+S.trick.length)%S.n; applyMove(S,q,heurMove(S,q)); }
    const w=trickWinner(S.trick); S.pl[w].won+=trickGain(S.trick);
    if(S.trickNo>=TRICKS) return;
    S.trickNo++; S.leader=w; S.trick=[];
  }
}
function cloneForSim(hands){
  return {n:G.n,cauldron:G.cauldron.slice(),trick:G.trick.map(x=>({p:x.p,card:x.card})),trickNo:G.trickNo,leader:G.leader,
          pl:G.pl.map((x,q)=>({id:q,hand:hands[q].slice(),won:x.won}))};
}
// carte che l'AI non vede: sono tutte e sole quelle nelle mani degli avversari
function unseenCards(p){
  const seen=new Set();
  G.pl[p].hand.forEach(c=>seen.add(c)); G.cauldron.forEach(c=>seen.add(c));
  G.played.forEach(c=>seen.add(c)); G.trick.forEach(x=>seen.add(x.card));
  return G.deck.filter(c=>!seen.has(c));
}
function candidateMoves(S,p){
  const lm=legalMoves(S,p), hand=S.pl[p].hand, out=[];
  lm.hand.forEach(i=>out.push({src:'h',idx:i}));
  lm.caul.forEach(ci=>{ for(let r=0;r<hand.length;r++) out.push({src:'c',idx:ci,repl:r}); });
  return out;
}
function aiMove(p){
  const cands=candidateMoves(G,p);
  if(cands.length===1) return cands[0];
  const un=unseenCards(p), n=G.n, T=TARGET[n];
  const sum=cands.map(()=>0), cnt=cands.map(()=>0);
  const rounds=(ixs,R)=>{
    for(let r=0;r<R;r++){
      const pool=shuffle(un.slice()), hands=[]; let k=0;
      for(let q=0;q<n;q++){
        if(q===p) hands.push(G.pl[q].hand);
        else{ const len=G.pl[q].hand.length; hands.push(pool.slice(k,k+len)); k+=len; }
      }
      for(const ix of ixs){
        const S=cloneForSim(hands);
        applyMove(S,p,cands[ix]);
        playOutS(S);
        const w=S.pl[p].won;
        sum[ix]+=ptsFor(w,n)-0.05*Math.abs(w-T); cnt[ix]++;
      }
    }
  };
  const all=cands.map((_,i)=>i);
  rounds(all,MC.r1);
  const top=all.sort((a,b)=>sum[b]/cnt[b]-sum[a]/cnt[a]).slice(0,MC.top);
  rounds(top,MC.r2);
  let best=top[0];
  for(const ix of top) if(sum[ix]/cnt[ix]>sum[best]/cnt[best]) best=ix;
  return cands[best];
}

// ═════════════════════════ PARTITA ═════════════════════════
function toSetup(){ if(PR){ const r=PR.rej; PR=null; r(ABORT); } G=null; render(); }
function newMatch(n){
  if(PR){ const r=PR.rej; PR=null; r(ABORT); }
  G={n,round:0,msg:'',log:[],over:null,show:null,phase:'idle',leader:rnd(n),first:-1,turn:-1,win:-1,trickNo:0,trick:[],
     deck:[],played:[],cauldron:[],cNew:-1,
     pl:Array.from({length:n},(_,i)=>({id:i,name:NAMES[i],hand:[],won:0,bonus:0,score:0,hist:[]}))};
  run();
}
function deal(){
  const n=G.n, deck=shuffle(makeDeck(n));
  G.deck=makeDeck(n); G.played=[]; G.trick=[]; G.trickNo=0; G.win=-1; G.turn=-1; G.show=null; G.cNew=-1;
  G.pl.forEach((p,i)=>{ p.hand=sortHand(deck.slice(i*TRICKS,(i+1)*TRICKS)); p.won=0; p.bonus=0; });
  G.cauldron=sortHand(deck.slice(n*TRICKS));
}
function humanHint(){
  const lead=leadOf(G);
  if(lead<0) return 'sei di mano: puoi giocare qualsiasi carta, dalla mano o dal calderone. Il seme della carta decide la briscola.';
  const tr=trumpOf(lead), L=SUITS[lead].n, T=SUITS[tr].n;
  if(G.cauldron.some(c=>c.s===lead)) return `nel calderone c'è ${L} (seme di mano): devi giocare ${L}, dalla mano o dal calderone.`;
  if(G.cauldron.some(c=>c.s===tr)) return `nel calderone non c'è ${L} ma c'è ${T} (briscola): devi giocare ${L} o ${T}.`;
  return `nel calderone non ci sono né ${L} né ${T} (briscola): puoi giocare qualsiasi carta.`;
}
async function humanMove(){
  for(;;){
    const r=await askMove(legalMoves(G,HUM),humanHint());
    if(r.src==='h') return r;
    if(P(HUM).hand.length===1) return {src:'c',idx:r.idx,repl:0};
    const rp=await askRepl(r.idx);
    if(rp>=0) return {src:'c',idx:r.idx,repl:rp};
  }
}
async function playTrick(){
  G.trick=[]; G.win=-1;
  for(let k=0;k<G.n;k++){
    const p=(G.leader+k)%G.n, pl=P(p); G.turn=p;
    status(`Presa ${G.trickNo}/${TRICKS} · tocca a ${pl.name}.`);
    let mv;
    if(p===HUM) mv=await humanMove();
    else{ await sleep(550); mv=aiMove(p); }
    const card=applyMove(G,p,mv), x=G.trick[G.trick.length-1];
    G.cNew=mv.src==='c'?mv.idx:-1;
    logMsg(`${pl.name} gioca ${cname(card)}${x.fromC?` dal calderone e al suo posto mette ${cname(x.repl)}`:''}.`);
    await sleep(p===HUM?250:300);
  }
  G.turn=-1;
  const w=trickWinner(G.trick), pw=P(w), gain=trickGain(G.trick);
  pw.won+=gain; pw.bonus+=gain-1; G.win=w;
  G.trick.forEach(x=>G.played.push(x.card));
  const txt=`${pw.name} vince la presa ${G.trickNo}${gain>1?` e ${gain} prese (con ${gain-1} ${gain===2?'carta 12':'carte 12'})`:''}: ora ha ${pw.won} ${pw.won===1?'presa':'prese'}.`;
  logMsg(txt); status(txt);
  await sleep(1500);
  G.leader=w;
}
async function playRound(){
  G.phase='play';
  for(let t=0;t<TRICKS;t++){
    G.trickNo=t+1;
    await playTrick();
  }
  G.trick=[]; G.win=-1; G.turn=-1; G.cNew=-1;
}
async function scoreRound(){
  G.phase='score';
  const rows=G.pl.map(p=>{
    const d=ptsFor(p.won,G.n);
    p.score+=d; p.hist.push(d);
    return {p:p.id,won:p.won,bonus:p.bonus,d,score:p.score};
  });
  G.show={rows};
  logMsg(`Round ${G.round+1} concluso: `+rows.map(r=>`${P(r.p).name} ${r.won} prese, +${r.d} (${r.score})`).join(' · ')+'.');
  const ended=G.pl.some(p=>p.score>=WINSCORE);
  status(ended?'Round concluso: qualcuno ha raggiunto 3 punti.':'Round concluso: ecco i punteggi.');
  await askChoose('Risultato del round',[{label:ended?'Mostra risultato finale':'Round successivo',value:1}]);
  if(!ended) G.show=null;
  return ended;
}
async function run(){
  const g=G;
  try{
    await askChoose(`Buona partita a Must-Follow is in the Cauldron, ${P(HUM).name}!`,[{label:'Ok, si parte',value:1}]);
    for(let r=0;;r++){
      g.round=r; g.first=g.leader;
      deal();
      logMsg(`— Round ${r+1}: ${P(g.leader).name} apre la prima presa; nel calderone ci sono ${g.cauldron.length} carte scoperte —`);
      status(`Round ${r+1}: carte distribuite, ${P(g.leader).name} apre.`);
      await sleep(600);
      await playRound();
      if(await scoreRound()) break;
    }
    g.over={winners:gameWinners(g.pl.map(p=>p.score))};
    g.phase='over';
    render();
  }catch(e){
    if(e===ABORT||g!==G) return;
    console.error(e); G.log.unshift('Errore: '+e.message); render();
  }
}

function cardHtml(c,extra='',tag='span',attrs=''){
  const su=SUITS[c.s], t=trumpOf(c.s);
  return `<${tag} class="pc s${c.s} ${extra}" ${attrs} title="${su.n} ${c.r}${c.r===12?' (vale una presa in più)':''}"><i class="ph-fill ph-${su.icon} su"></i><b>${c.r}</b>${c.r===12?'<em class="x" title="Vale una presa in più">+1</em>':''}<small class="tr t${t}" title="Se ${su.n} è il seme di mano, la briscola è ${SUITS[t].n}"><i class="ph-fill ph-${SUITS[t].icon}"></i></small><small class="lt">${su.lt}</small></${tag}>`;
}
function swHtml(s){ return `<span class="sw s${s}">${ico(SUITS[s].icon)} ${SUITS[s].n}</span>`; }
function cycleHtml(){
  return `<div class="cyc">${SUITS.map((_,s)=>swHtml(s)+`<span class="ar">${ico('arrow-right')}</span>`).join('')}<span class="ar" title="poi di nuovo dal primo">${ico('arrows-clockwise')}</span></div>`;
}
function handHtml(p){
  const pl=P(p);
  if(G.phase==='idle') return '';
  if(p===HUM){
    return `<div class="hand">${pl.hand.map((c,i)=>{
      if(PR&&PR.type==='move'){
        const lg=PR.legal.hand.has(i);
        return cardHtml(c,`${lg?'legal':'dim'} ${PR.sel&&PR.sel.src==='h'&&PR.sel.idx===i?'sel':''}`,'button',`${lg?'':'disabled'} data-p="${i}"`);
      }
      if(PR&&PR.type==='repl') return cardHtml(c,`legal ${PR.sel===i?'sel':''}`,'button',`data-r="${i}"`);
      return cardHtml(c);
    }).join('')}</div>`;
  }
  return `<div class="backs">${pl.hand.map(()=>`<span class="bn" title="Carta coperta"></span>`).join('')}</div>`;
}
function tableauHtml(p){
  const x=G.trick.find(t=>t.p===p);
  if(!x) return '<div class="tableau"><span class="empty"></span></div>';
  const cp=x.fromC?`<em class="cp" title="Giocata dal calderone">${ico('cooking-pot')}</em>`:'';
  return `<div class="tableau">${cardHtml(x.card,`mini ${G.win===p&&G.turn<0?'win':''}`).replace('</span>',cp+'</span>')}</div>`;
}
function flagHtml(p){
  if(!G||G.over) return '';
  let f='';
  if(G.phase==='play'&&G.first===p) f+='<span class="flag first">Primo giocatore</span>';
  if(G.phase==='play'&&G.turn>=0&&G.leader===p) f+='<span class="flag lead">Di mano</span>';
  return f;
}
function seatHtml(p,pos){
  const pl=P(p);
  const isLeader=G.phase==='play'&&G.turn>=0&&G.leader===p, active=G.turn===p, winner=G.win===p&&G.turn<0&&G.phase==='play';
  let meta=`<div class="seat-meta"><span class="tag" title="Punteggio">${ico('star')} <b>${pl.score}</b></span>`;
  if(G.phase==='play'||G.phase==='score'||G.phase==='over'){
    meta+=`<span class="tag" title="Prese vinte in questo round (ogni 12 vale una presa in più): per 2 punti ne servono ${TARGET[G.n]}, per 1 punto ${TARGET[G.n]+1}">prese <b>${pl.won}</b>/<b>${TARGET[G.n]}</b></span>`;
  }
  meta+='</div>';

  const hand=handHtml(p), tab=tableauHtml(p);

}
function potHtml(){
  const cards=G.cauldron.map((c,i)=>{

<div class="rtext">
<h4>Idea del gioco</h4>
<p>È un gioco di prese con l'obbligo di rispondere al seme (Must-Follow), ma l'obbligo non dipende dalle carte che hai in mano: dipende da quelle presenti nel <b>Calderone</b>, le carte scoperte al centro del tavolo. Per vincere non serve prendere più prese degli altri: bisogna calibrarle per centrarne un numero esatto e guadagnare punti.</p>
<h4>Preparazione</h4>
<p>Il mazzo ha 48 carte: 4 semi (Verde, Rosso, Blu, Giallo) con valori da 1 a 12. In 3 giocatori si tolgono le carte di valore 1, 2 e 3. Si mescola e si danno 11 carte a testa; le rimanenti (tante quanti sono i giocatori) si mettono scoperte al centro e formano il Calderone. Il primo giocatore si sceglie a caso.</p>
<h4>Le prese</h4>
<p>Un round ha 11 prese. Il giocatore di mano apre con una carta: il suo seme è il <b>seme di mano</b>. Poi, in senso orario, ognuno gioca una carta scegliendo tra: una carta della propria mano <b>oppure</b> una carta scoperta del Calderone. Chi sceglie il Calderone deve subito rimpiazzare la carta presa con una qualsiasi carta della propria mano, in modo che il Calderone abbia sempre lo stesso numero di carte. La carta di rimpiazzo è libera e non è soggetta all'obbligo di seme. Anche chi apre la presa può giocare una carta del Calderone.</p>
<h4>Briscola</h4>
<p>I semi formano un ciclo: Verde → Rosso → Blu → Giallo → Verde. La briscola di ogni presa è il seme che segue il seme di mano (se è uscito Rosso, la briscola è Blu). Cambia a ogni presa, in base alla carta che la apre; sotto al valore di ogni carta c'è il simbolo della sua briscola.</p>
<h4>Obbligo di risposta</h4>
<p>L'obbligo non guarda la mano ma solo il Calderone, nello stato in cui si trova quando tocca a te:</p>
<ul>
<li>Se nel Calderone c'è il seme di mano, devi giocare una carta di quel seme (dalla mano o dal Calderone).</li>
<li>Se non c'è il seme di mano ma c'è la briscola, devi giocare una carta del seme di mano o della briscola (dalla mano o dal Calderone).</li>
<li>Se non c'è né l'uno né l'altra, puoi giocare qualsiasi carta (dalla mano o dal Calderone).</li>
</ul>
<p>Non importa se hai o meno il seme di mano in mano.</p>
<h4>Vincere la presa</h4>
<p>Vince la carta più alta del seme di briscola; se non ci sono briscole, la più alta del seme di mano. Il vincitore prende le carte e apre la presa successiva. Ogni carta di valore <b>12</b> nella presa aggiunge una presa in più a chi la vince, indipendentemente da chi l'abbia giocata: se vinci una presa con due 12, conta come 3 prese.</p>
<h4>Fine del round e punteggio</h4>
<p>Dopo 11 prese ogni giocatore conta le prese vinte (12 inclusi). In 4 giocatori: esattamente 3 prese = 2 punti, esattamente 4 = 1 punto. In 3 giocatori: esattamente 4 prese = 2 punti, esattamente 5 = 1 punto. Qualsiasi altro numero vale 0 punti. Poi tutte le carte (anche quelle nel Calderone) si rimescolano e si prepara un nuovo round; apre chi ha vinto l'ultima presa.</p>
<h4>Fine della partita</h4>
<p>La partita termina quando uno o più giocatori raggiungono 3 punti alla fine di un round. Vince il punteggio più alto; in caso di parità la vittoria è condivisa. Il trucco è non vincere troppe prese!</p>
<p>Gioco di Iizuka (Game Market 2026 Primavera), titolo originale «マストフォローは釜の中».</p>
</div></details>`;

let LOGOPEN=false;
function logHtml(){
  return `<details class="log" ${LOGOPEN?'open':''}><summary>LOG DELLA PARTITA (${G.log.length})</summary><div class="logbody">${G.log.map(l=>`<div>${esc(l)}</div>`).join('')}</div></details>`;
}
document.getElementById('app').addEventListener('toggle',e=>{ if(e.target.matches&&e.target.matches('details.log')) LOGOPEN=e.target.open; },true);
let MENUOPEN=false;
function menuHtml(){
  return `<div class="menu-wrap"><button class="hamb" type="button" data-menu="1" aria-label="Opzioni" aria-expanded="${MENUOPEN}"><svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 1h16M1 7h16M1 13h16"/></svg></button>
    ${MENUOPEN?`<div class="menu-pop">
      <label class="opt-toggle" title="Chiede conferma e permette di annullare le carte giocate"><input type="checkbox" id="optUndo" ${OPT.undo?'checked':''}> Abilita annulla</label>
      <label class="opt-toggle" title="Aggiunge una filigrana ai colori per distinguerli senza i colori"><input type="checkbox" id="optA11y" ${OPT.a11y?'checked':''}> Modalità accessibile</label>
    </div>`:''}</div>`;
}
function render(){
  document.body.classList.toggle('a11y',OPT.a11y);
  const app=document.getElementById('app');
  const top=`<div class="topbar"><div class="logo">Must-Follow is in the <em>Cauldron</em></div>
    ${window.nyloBackBtn?nyloBackBtn():""}${nyloHomeBtn()}
    ${G&&!G.over?`<span class="badge">Round ${G.round+1}</span>`:''}
    ${G?`<button class="btn btn-sm" data-new="1">Nuova partita</button>`:''}
    ${menuHtml()}</div>`;
  let body='';
  if(G){
    body=`<div class="table n${G.n}">${G.pl.map((p,i)=>seatHtml(i,POS[G.n][i])).join('')}${centerHtml()}</div>
      <div class="dock" style="position:static">${scoreTable()}</div>
      ${logHtml()}
      ${recapHtml()}
      ${RULES_HTML}`;
  }
  app.innerHTML=top+`<div class="dock">${dockHtml()}</div>`+body;
}

function askName(n){
  try{ if(localStorage.getItem('nylo-skip-name')==='1'){ NAMES[0]=localStorage.getItem('nylo-player-name')||'Nylo'; newMatch(n); return; } }catch(e){}
  let ov=document.getElementById('nameModal');
  if(!ov){ ov=document.createElement('div'); ov.id='nameModal'; ov.className='name-modal'; document.body.appendChild(ov); }
  let saved=''; try{ saved=localStorage.getItem('nylo-player-name')||''; }catch(e){}
  ov.innerHTML='<form class="name-box"><h3>Come ti chiami?</h3><p>Il tuo nome sostituirà «Tu» al tavolo.</p><input id="nameInput" maxlength="16" placeholder="Il tuo nome" autocomplete="off" value="'+esc(saved)+'"><div class="opts"><button class="opt" type="submit">Inizia la partita</button><button class="opt" type="button" data-cancel="1">Annulla</button></div></form>';
  ov.style.display='flex';
  const closeName=()=>{ ov.style.display='none'; };
  ov.onclick=e=>{ if(e.target===ov||e.target.hasAttribute('data-cancel')) closeName(); };
  ov.onkeydown=e=>{ if(e.key==='Escape') closeName(); };
  const f=ov.firstChild, inp=f.querySelector('input'); inp.focus(); inp.select();
  f.onsubmit=e=>{
    e.preventDefault();
    const v=inp.value.trim().slice(0,16)||'Tu';
    try{ localStorage.setItem('nylo-player-name',v); }catch(x){}
    NAMES[0]=v; ov.style.display='none'; newMatch(n);
  };
}
document.getElementById('app').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||b.disabled) return;
  if(b.dataset.menu){ MENUOPEN=!MENUOPEN; render(); return; }
  if(b.dataset.n){ const n=Number(b.dataset.n); if(G) newMatch(n); else askName(n); }
  else if(b.dataset.new){ if(confirm('Iniziare una nuova partita?')) toSetup(); }
  else if(b.dataset.i!==undefined) answer(Number(b.dataset.i));
  else if(b.dataset.p!==undefined) pickMove('h',Number(b.dataset.p));
  else if(b.dataset.c!==undefined) pickMove('c',Number(b.dataset.c));
  else if(b.dataset.cf!==undefined) confirmMove(b.dataset.cf==='1');
  else if(b.dataset.r!==undefined) pickRepl(Number(b.dataset.r));
  else if(b.dataset.rf!==undefined) confirmRepl(b.dataset.rf==='1');
  else if(b.dataset.rb!==undefined) backRepl();
});
document.getElementById('app').addEventListener('change',e=>{
  if(e.target.id==='optA11y'){
    OPT.a11y=e.target.checked;
    try{ localStorage.setItem('cauldron-a11y',OPT.a11y?'1':'0'); }catch(err){}
    render(); return;
  }
  if(e.target.id!=='optUndo') return;
  OPT.undo=e.target.checked;
  try{ localStorage.setItem('cauldron-undo',OPT.undo?'1':'0'); }catch(err){}
  if(!OPT.undo&&PR&&PR.sel!=null&&(PR.type==='move'||PR.type==='repl')){ const v=PR.sel, r=PR.res; PR=null; render(); r(v); return; }
  render();
});
document.addEventListener('click',e=>{ if(MENUOPEN&&!e.target.closest('.menu-wrap')){ MENUOPEN=false; render(); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&MENUOPEN){ MENUOPEN=false; render(); } });
render();

</script>
</body>
</html>
