<!DOCTYPE html>
<html lang="it" data-home-inline>
<head>
<script src="/auth-gate.js"></script>
<script src="/home-btn.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatlat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,800&family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#3a2024;
  --ink:#2a1517;
  --surface:#fbf1e6;
  --surface-raised:#f1dccb;
  --accent:#a3243b;
  --accent-soft:rgba(163,36,59,0.12);
  --teal:#3d8a95;
  --text:#2c1a1a;
  --text-soft:#6b4a46;
  --danger:#b3261e;
  --success:#1b7a3a;
  --border:rgba(42,21,23,0.3);
  --radius:12px;
  --cw:48px; --ch:70px;
}
html,body{min-height:100%;color:var(--text);font-family:'Inter',sans-serif;font-size:14px}
body{background-color:var(--bg);background-image:radial-gradient(ellipse at 12% 0%,rgba(255,200,170,0.16),transparent 45%),radial-gradient(ellipse at 90% 80%,rgba(180,50,80,0.22),transparent 50%);background-attachment:fixed}
.app{max-width:960px;margin:0 auto;padding:0 12px 48px}

.topbar{display:flex;align-items:center;gap:10px;padding:14px 0;margin-bottom:10px;flex-wrap:wrap}
.logo{font-family:'Playfair Display','Fredoka',serif;font-style:italic;font-size:42px;font-weight:800;line-height:1;flex:1;color:#fff4e6;letter-spacing:.01em;min-width:0;text-shadow:2px 3px 0 rgba(0,0,0,0.35)}
.logo .jp{font-family:'Fredoka',sans-serif;font-style:normal;font-size:14px;margin-left:10px;text-shadow:none;letter-spacing:.14em;color:#e9c9b3;font-weight:500}
.badge{background:var(--accent);color:#fff;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700;white-space:nowrap}
.btn{border-radius:7px;padding:8px 14px;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;cursor:pointer;background:#fff;color:var(--text);border:1px solid var(--ink)}
.btn:hover{background:var(--surface-raised)}
.btn-sm{padding:5px 10px;font-size:12px}
.opt-toggle{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-soft);cursor:pointer;border:0;border-radius:20px;padding:4px 10px;user-select:none}
.opt-toggle input[type=checkbox]{appearance:none;-webkit-appearance:none;position:relative;width:34px;height:19px;flex:0 0 34px;margin:0;border:1px solid var(--border);border-radius:999px;background:var(--surface-raised);cursor:pointer;transition:background .15s,border-color .15s}
.opt-toggle input[type=checkbox]::before{content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--text-soft);transition:transform .15s,background .15s}
.opt-toggle input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
.opt-toggle input[type=checkbox]:checked::before{transform:translateX(15px);background:#fff}
.opt-toggle input[type=checkbox]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.menu-wrap{position:relative;margin-left:auto}
.hamb{display:inline-flex;align-items:center;justify-content:center;width:34px;height:30px;border-radius:7px;background:#fff;color:var(--text);border:1px solid var(--ink);cursor:pointer}
.hamb:hover{background:var(--surface-raised)}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);z-index:30;min-width:240px;display:flex;flex-direction:column;gap:4px;padding:8px;background:var(--surface);border:2px solid var(--ink);border-radius:var(--radius);box-shadow:0 10px 24px rgba(0,0,0,0.45)}
.menu-pop .opt-toggle{border:0;border-radius:6px;padding:9px 10px;font-size:13px;color:var(--text);white-space:normal;line-height:1.35;text-align:left;width:100%}
.menu-pop .opt-toggle:hover{background:var(--accent-soft)}
/* nel menu le voci sono azioni a testo (home-btn.js): l'interruttore stilizzato deve restare nascosto e non occupare spazio */
.menu-pop .opt-toggle.nylo-menu-action input[type=checkbox]{position:absolute;width:1px;height:1px;flex:none;margin:0;border:0;opacity:0;pointer-events:none}
.menu-pop button.opt-toggle{appearance:none;-webkit-appearance:none;font-family:inherit;font-size:13px;font-weight:500;color:var(--text);text-align:left;background:transparent;border:0;box-shadow:none;cursor:pointer}
.flag{display:inline-block;margin-left:5px;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;vertical-align:middle;white-space:nowrap}
.flag.lead{background:var(--accent);color:#fff}
.flag.win{background:var(--success);color:#fff}
.log{background:var(--surface);border:2px solid var(--ink);border-radius:var(--radius);padding:10px 14px;margin-top:12px;margin-bottom:12px;font-size:12px;color:var(--text-soft);line-height:1.6}
.log summary{cursor:pointer;font-weight:600;letter-spacing:0.05em}
.logbody{margin-top:8px;max-height:260px;overflow-y:auto;padding-right:6px}
.logbody div{border-bottom:1px solid var(--border);padding:1px 0}
.name-modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(30,10,14,0.65);padding:16px}
.name-box{background:var(--surface);color:var(--text);border:2px solid var(--ink);border-radius:var(--radius);padding:20px;width:min(340px,100%);display:flex;flex-direction:column;gap:12px;box-shadow:0 14px 40px rgba(0,0,0,0.4)}
.name-box h3{font-family:'Fredoka',sans-serif;font-weight:600;font-size:20px}
.name-box p{font-size:12px;color:var(--text-soft)}
.name-box input{padding:9px 11px;border-radius:7px;border:1px solid var(--border);background:#fff;color:var(--text);font-size:14px;font-family:inherit;outline:none}
.name-box input:focus{border-color:var(--accent)}

.dock{position:sticky;top:0;z-index:10;background:var(--surface);border:2px solid var(--ink);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 18px rgba(0,0,0,0.4)}
.dock.tall{position:static}
.dock-msg{font-size:13px;line-height:1.5}
.dock-title{font-size:11px;font-weight:600;color:var(--text-soft);letter-spacing:0.05em}
.opts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:grid}.stack>*{grid-area:1/1}
.opt{background:#fff;border:1px solid var(--ink);color:var(--text);border-radius:8px;padding:8px 12px;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.12s;text-align:left}
.opt:hover:not(:disabled){background:var(--accent);border-color:var(--accent);color:#fff}
.opt:disabled{opacity:0.35;cursor:not-allowed}
.hint{font-size:12px;color:var(--text-soft);line-height:1.5}
.hint b{color:var(--text)}
.scroll-x{overflow-x:auto;max-width:100%}
table.score{border-collapse:collapse;font-size:12px;width:100%}
table.score td,table.score th{padding:5px 8px;border-bottom:1px solid var(--border);text-align:right;vertical-align:middle}
table.score td:first-child,table.score th:first-child{text-align:left}
table.score td.l,table.score th.l{text-align:left}
table.score .neg{color:var(--danger)}
table.score .pos{color:var(--success)}
table.score tr.me td{background:var(--accent-soft)}
.chips{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
table.score td.l .chips{justify-content:flex-start}

/* carte cioccolato: cornice scura, pannello colorato con tacche, numero e simbolo agli angoli, cioccolatini al centro */
.cc{--kc:#888;--kd:#333;width:var(--cw);height:var(--ch);border-radius:7px;background:#2a1517;display:inline-block;position:relative;overflow:hidden;flex-shrink:0;padding:0;border:0;box-shadow:0 2px 5px rgba(0,0,0,0.45)}
.cc .pan{position:absolute;inset:0;background:var(--kc);clip-path:polygon(23% 2%,77% 2%,77% 30%,96% 30%,96% 70%,77% 70%,77% 98%,23% 98%,23% 70%,4% 70%,4% 30%,23% 30%)}
.cc .pn{position:absolute;display:flex;flex-direction:column;align-items:center;gap:1px;width:calc(var(--cw)*.2);color:#f6e8d6;font-family:'Fredoka',sans-serif;font-weight:700;font-size:calc(var(--cw)*.2);line-height:1}
.cc .pn svg{width:calc(var(--cw)*.15);height:calc(var(--cw)*.15);color:var(--kc);display:block}
.cc .pn.a{left:calc(var(--cw)*.015);top:calc(var(--cw)*.03)}
.cc .pn.b{right:calc(var(--cw)*.015);top:calc(var(--cw)*.03)}
.cc .pn.c{left:calc(var(--cw)*.015);bottom:calc(var(--cw)*.03);transform:rotate(180deg)}
.cc .pn.d{right:calc(var(--cw)*.015);bottom:calc(var(--cw)*.03);transform:rotate(180deg)}
.cc .bl{position:absolute;left:22%;right:22%;top:14%;bottom:14%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2%}
.cc .bl svg{display:block;width:100%;height:auto}
.cc .bl.k1 svg{width:100%}
.cc .bl.k2 svg{width:84%}
.cc .bl.k3 svg{width:70%}
.cc .mn{position:absolute;left:50%;transform:translateX(-50%);width:calc(var(--cw)*.2);height:calc(var(--cw)*.2);border-radius:50%;background:#1c0e10;border:1px solid rgba(255,255,255,0.35)}
.cc .mn::after{content:'+';position:absolute;right:-30%;bottom:-30%;width:70%;height:70%;border-radius:50%;background:#3fb950;color:#fff;font-size:calc(var(--cw)*.14);line-height:1;font-weight:800;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif}
.cc .mn.t{top:6%}
.cc .mn.u{bottom:6%}
.cc.mini{--cw:40px;--ch:58px}
.cc.fresh{box-shadow:0 0 0 3px #ffd54a,0 2px 5px rgba(0,0,0,0.45)}
.cc.win{box-shadow:0 0 0 3px var(--success),0 2px 5px rgba(0,0,0,0.45)}
.cc.lose{box-shadow:0 0 0 3px var(--teal),0 2px 5px rgba(0,0,0,0.45)}
.cc.legal{box-shadow:0 0 0 2px var(--ink),0 0 0 4px rgba(255,213,74,0.95)}
.cc.dim{opacity:0.4;filter:saturate(0.5)}
.cc.sel{transform:translateY(-12px);box-shadow:0 0 0 2px #fff,0 0 0 5px var(--accent)}
button.cc{cursor:pointer;transition:transform 0.12s}
button.cc:hover:not(:disabled){transform:translateY(-6px)}
button.cc.sel:hover:not(:disabled){transform:translateY(-12px)}
button.cc:disabled{cursor:default}
.hand{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;padding-top:14px}
.back{width:9px;height:14px;border-radius:2px;background:linear-gradient(135deg,#4b2a2c,#2a1517);border:1px solid #e9c9b3;box-shadow:0 0 0 1px rgba(42,21,23,0.5)}
.backs{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:230px}
.seat.top .backs,.seat.left .backs,.seat.right .backs{display:grid;grid-template-columns:repeat(6,9px);max-width:none}
.cchip{display:inline-flex;align-items:center;justify-content:center;gap:2px;min-width:24px;height:20px;padding:0 5px;border-radius:5px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:12px;line-height:1;background:var(--kc);color:var(--tx);border:1px solid rgba(42,21,23,0.45)}
.cchip svg{width:10px;height:10px;display:block}
.cchip sup{font-size:9px;font-weight:600;opacity:.85;vertical-align:baseline}
.cupchip{display:inline-flex;align-items:center;gap:3px;height:20px;padding:0 6px;border-radius:5px;background:#3a2024;color:#f6e8d6;font-family:'Fredoka',sans-serif;font-weight:600;font-size:12px;border:1px solid rgba(42,21,23,0.45)}
.cupchip svg{width:11px;height:11px;display:block}

.table{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(0,1fr);gap:8px;background:var(--surface);border:2px solid var(--ink);border-radius:var(--radius);padding:12px;margin:0 0 12px}
.table.n3{grid-template-areas:"left center right" "bottom bottom bottom"}
.table.n4{grid-template-areas:". top ." "left center right" "bottom bottom bottom"}
.seat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;border-radius:10px;border:1px solid transparent;text-align:center;min-width:0}
.seat.top{grid-area:top} .seat.left{grid-area:left;justify-content:center} .seat.right{grid-area:right;justify-content:center} .seat.bottom{grid-area:bottom}
.seat.leader{border:1px dashed rgba(163,36,59,0.7);background:rgba(163,36,59,0.05)}
.seat.active{border:2px solid var(--accent);background:rgba(255,213,74,0.35);box-shadow:0 0 0 2px #ffd54a}
.seat.winner{border:2px solid var(--success);background:rgba(27,122,58,0.12)}
.seat-name{font-weight:600;font-size:13px;overflow-wrap:anywhere}
.seat-name .nm{display:inline-block;padding:2px 10px;border-radius:999px;color:#2c1a1a;font-weight:700}
.seat-meta{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;align-items:center;font-size:11px}
.tag{background:rgba(42,21,23,0.09);border-radius:4px;padding:2px 6px;color:var(--text)}
.tag b{color:var(--accent)}
.coll{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:100%;min-height:20px}
.tableau{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:62px;min-width:44px;padding:3px;border-radius:8px;background:rgba(42,21,23,0.05)}
.slot{display:inline-block;width:40px;height:58px;border:1px dashed rgba(42,21,23,0.4);border-radius:6px}
.cap{font-size:10px;color:var(--text-soft);line-height:1.2}
.center{grid-area:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;font-size:12px;line-height:1.45;color:var(--text-soft);min-width:0}
.center b{color:var(--accent)}

/* tabellone: dal più alto (in cima) al più basso; il disco segna la riga più debole, la più forte è quella sotto di lei */
.track{display:flex;flex-direction:column;gap:2px;width:100%;max-width:150px;padding:4px;border-radius:8px;background:#2a1517}
.tr{--kc:#888;--tx:#fff;display:flex;align-items:center;gap:4px;height:20px;padding:0 6px;border-radius:4px;background:var(--kc);color:var(--tx);font-family:'Fredoka',sans-serif;font-weight:600;font-size:11px;line-height:1;position:relative;white-space:nowrap}
.tr .ts svg{width:11px;height:11px;display:block}
.tr .tn{flex:1;text-align:left}
.tr em{font-style:normal;font-size:9px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:1px 4px;border-radius:3px;background:rgba(0,0,0,0.35);color:#fff}
.tr.strong em{background:var(--success)}
.tr.weak{box-shadow:0 0 0 2px #ffd54a}
.disc{display:inline-block;width:13px;height:13px;border-radius:50%;flex:0 0 13px;background:radial-gradient(circle at 50% 40%,#f3d9a8 0 38%,#c79a54 40% 70%,#8a5f2a 72%);border:1px solid #fff}
.tr.c0{--kc:#d9a92f;--tx:#3a2a00} .tr.c1{--kc:#3a8a99} .tr.c2{--kc:#9a5468} .tr.c3{--kc:#eba77c;--tx:#5a2a0c} .tr.c4{--kc:#c93a73} .tr.c5{--kc:#6c9a35} .tr.c6{--kc:#d1793f} .tr.c7{--kc:#efe6c8;--tx:#4a3f20} .tr.c8{--kc:#7d5848}
.cc.c0,.cchip.c0{--kc:#d9a92f;--tx:#3a2a00} .cc.c1,.cchip.c1{--kc:#3a8a99;--tx:#fff} .cc.c2,.cchip.c2{--kc:#9a5468;--tx:#fff} .cc.c3,.cchip.c3{--kc:#eba77c;--tx:#5a2a0c} .cc.c4,.cchip.c4{--kc:#c93a73;--tx:#fff} .cc.c5,.cchip.c5{--kc:#6c9a35;--tx:#fff} .cc.c6,.cchip.c6{--kc:#d1793f;--tx:#fff} .cc.c7,.cchip.c7{--kc:#efe6c8;--tx:#4a3f20} .cc.c8,.cchip.c8{--kc:#7d5848;--tx:#fff}

.scorebox{background:var(--surface);border:2px solid var(--ink);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px}
.scorebox h3{font-size:11px;font-weight:600;color:var(--text-soft);letter-spacing:0.05em;margin-bottom:8px}
.unseen{display:flex;flex-direction:column;gap:6px}
.unseen .ur{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.unseen .ur .l{width:78px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.unseen .ur .l svg{width:11px;height:11px;display:block}
.cchip.gone{opacity:.2;text-decoration:line-through}
.cchip.own{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--ink)}
.recap{background:var(--surface);border:2px solid var(--ink);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.recap-row{display:block;font-size:12px;line-height:1.7}
.recap-row > *{margin-right:6px}
.recap-row .lbl{font-weight:600;color:var(--text-soft)}
.recap-row .rv{color:var(--text-soft);margin-left:0 !important;margin-right:0}
details.rules{background:var(--surface);border:2px solid var(--ink);border-radius:var(--radius);padding:14px 16px}
details.rules summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--text-soft);letter-spacing:0.05em}
details.recap{display:block;padding:14px 16px}
details.recap>summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--text-soft);letter-spacing:0.05em}
details.recap[open]>summary{margin-bottom:10px}
details.recap[open]>:not(summary)+*{margin-top:10px}
.rtext h4{font-family:'Fredoka',sans-serif;font-weight:600;font-size:16px;color:var(--accent);margin:14px 0 4px}
.rtext p,.rtext li{font-size:12px;line-height:1.6;color:var(--text-soft);margin-bottom:6px}
.rtext ul,.rtext ol{padding-left:20px}
.rtext b{color:var(--text)}

@media(max-width:600px){
  .logo{font-size:34px}
  :root{--cw:36px;--ch:53px}
  .cc{border-radius:5px}
  .cc.mini{--cw:34px;--ch:50px}
  .slot{width:34px;height:50px}
  .table{padding:8px;gap:6px}
  .back{width:7px;height:11px}
  .seat.top .backs,.seat.left .backs,.seat.right .backs{grid-template-columns:repeat(6,7px)}
  .hand{gap:3px}
  .seat{padding:6px 3px}
  table.score td,table.score th{padding:5px 4px}
  .tr{padding:0 4px;gap:3px;font-size:10px}
}
@media(max-width:380px){.topbar{gap:6px}.logo{font-size:28px}.badge{padding:4px 9px}}
</style>

<script src="/tt/shared/core.js"></script>
<script>
// ═════════════════════════ COSTANTI ═════════════════════════
// 48 carte cioccolato in 9 tipi (max = numero più alto, porta il simbolo «Min:»). L'ordine dei tipi è quello del tabellone, dall'alto in basso.
const COLS = [
  {n:'Oro',      sym:'crown',  max:2,bl:'#c8283a',ey:'#2a1517'},
  {n:'Turchese', sym:'star',   max:4,bl:'#f4b43a',ey:'#2a1517'},
  {n:'Prugna',   sym:'ring',   max:4,bl:'#3b2420',ey:'#e8cbbb'},
  {n:'Pesca',    sym:'slash',  max:4,bl:'#a8724f',ey:'#2a1517'},
  {n:'Rosa',     sym:'drop',   max:6,bl:'#f4a0bb',ey:'#2a1517'},
  {n:'Verde',    sym:'leaf',   max:6,bl:'#b4d58a',ey:'#2a1517'},
  {n:'Arancio',  sym:'nut',    max:6,bl:'#8a5237',ey:'#2a1517'},
  {n:'Panna',    sym:'square', max:8,bl:'#f5f1ee',ey:'#2a1517'},
  {n:'Cacao',    sym:'diamond',max:8,bl:'#4a2d24',ey:'#e8cbbb'}
];
// cioccolatini raffigurati: il numero più alto ne ha 1 (e il simbolo Min), l'1 ne ha 3, il 2 ne ha 2, gli altri 1
const CARDS = []; COLS.forEach((co,c)=>{ for(let n=1;n<=co.max;n++) CARDS.push({id:CARDS.length,c,n,min:n===co.max,k:n===co.max?1:(n===1?3:(n===2?2:1))}); });
const PER = {3:14,4:12}, DISC = {3:2,4:1};
const NAMES = ['Tu','AI Rex','AI Luna','AI Pippo'];
const SEATC = ['#ffd7a8','#cfe8c0','#b9e0ea','#f3c3d6'];
const HUM = 0;
const POS = {3:['bottom','left','right'],4:['bottom','left','top','right']};
const TRK = n => n===3?[0,1,2,3,4,5,7,8]:[0,1,2,3,4,5,6,7,8];
const POP = (()=>{ const a=[]; for(let i=0;i<512;i++){ let x=i,c=0; while(x){ c+=x&1; x>>=1; } a.push(c); } return a; })();

// ═════════════════════════ UTILITÀ ═════════════════════════
const rnd = n => Math.floor(Math.random()*n);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
let G = null, PR = null;
const OPT = {undo:true, memo:false};
try{ const s=localStorage.getItem('ch-undo'); if(s!==null) OPT.undo=s==='1'; OPT.memo=localStorage.getItem('ch-memo')==='1'; }catch(e){}
const cname = c => `${c.n} ${COLS[c.c].n}`;
const sortHand = h => h.sort((a,b)=>a.c-b.c||a.n-b.n);
const plural = (n,a,b) => n===1?a:b;
const sgn = v => v>0?'+'+v:String(v);
const shortName = p => P(p).name.replace(/^AI /,'');

// ═════════════════════════ REGOLE (funzioni pure) ═════════════════════════
// forza di ogni tipo: 0 = riga col disco (la più debole); si sale verso l'alto in cerchio, quindi la più forte è la riga subito sotto il disco
function strMap(n,disc){
  const t=TRK(n), m=t.length, pd=t.indexOf(disc), a=new Array(9).fill(-1);
  t.forEach((c,i)=>{ a[c]=(pd-i+m)%m; });
  return a;
}
const keyOf = (str,c) => str[c.c]*10+c.n;
// la carta più forte prende il cioccolato (scoperto), la più debole la coppetta (coperta; con «Min» una coppetta in più dalle carte usate)
function judge(plays,str){
  let s=null, w=null;
  for(const x of plays){ const k=keyOf(str,x.c); if(!s||k>s.k) s={p:x.p,c:x.c,k}; if(!w||k<w.k) w={p:x.p,c:x.c,k}; }
  return {sp:s.p,sc:s.c,wp:w.p,wc:w.c};
}
function calc(ch,D,cu){
  if(!ch||!cu) return {s:0,t:0,bonus:0,pts:0};
  const s=Math.min(ch,cu), t=Math.min(D,s), bonus=ch===cu?10:0;
  return {s,t,bonus,pts:s*t+bonus};
}
function pstat(p){
  const cards=G.choc[p];
  return {ch:cards.reduce((a,c)=>a+c.k,0), D:new Set(cards.map(c=>c.c)).size, cu:G.cu[p], n:cards.length};
}
function giftOf(){
  const cs=G.discAll, ch=cs.reduce((a,c)=>a+c.k,0), t=new Set(cs.map(c=>c.c)).size;
  return {ch,t,pts:ch*t};
}
// punteggio del round di un giocatore (con regalo se non ha preso nessuna carta)
function roundCalc(p){
  const st=pstat(p);
  if(!st.n&&!st.cu){ const g=giftOf(); return {...st,s:0,t:0,bonus:0,gift:g,pts:g.pts}; }
  return {...st,...calc(st.ch,st.D,st.cu),gift:null};
}
// applica l'esito di una presa allo stato reale
function settleTrick(res){
  G.choc[res.sp].push(res.sc);
  G.cu[res.wp]+=res.wc.min?2:1;
  G.used+=G.n-2-(res.wc.min?1:0);
  G.disc=res.sc.c; G.leader=res.sp;
}

// ═════════════════════════ AI ═════════════════════════
// Euristica: per ogni carta stima la probabilità di essere la più forte o la più debole della presa (contro le carte non ancora viste) e il valore
// di un cioccolato / una coppetta in più, proiettando il round a fine mano. Il Monte Carlo campiona le mani nascoste (carte non viste, tipi non risposti)
// e simula il resto del round con questa stessa euristica.
const AIP = {ms:160, minW:6, maxW:260};
function Vproj(ch,ty,cu,R,n,nt){
  const f=R/n, ch2=ch+1.3*f, cu2=cu+1.0*f, d0=POP[ty], d2=d0+f*0.9*(nt-d0)/nt;
  const s=Math.min(ch2,cu2), t=Math.min(d2,s);
  return s*t+4*Math.max(0,1-Math.abs(ch2-cu2)/2);
}
function scoreOf(ch,ty,cu){ if(!ch||!cu) return 0; const s=Math.min(ch,cu); return s*Math.min(POP[ty],s)+(ch===cu?10:0); }
function polCard(S,p,plays,noise){
  const hand=S.hands[p], lc=plays.length?plays[0].c.c:-1;
  let L=hand; if(lc>=0){ const f=hand.filter(c=>c.c===lc); if(f.length) L=f; }
  if(L.length===1) return L[0];
  const cnt=S.kc, pre=S.pre, rem=S.rem, mine=S.mine[p], str=S.str; cnt.fill(0); let tot=0;
  for(let id=0;id<48;id++) if(rem[id]&&!mine[id]){ const c=CARDS[id]; cnt[str[c.c]*10+c.n]++; tot++; }
  let a=0; for(let k=0;k<100;k++){ a+=cnt[k]; pre[k]=a; }
  let pmin=1e9, pmax=-1; for(const x of plays){ const k=keyOf(str,x.c); if(k<pmin) pmin=k; if(k>pmax) pmax=k; }
  const r=S.n-plays.length-1, R=hand.length-1, nz=noise===undefined?0.3:noise;
  const ch=S.ch[p], ty=S.ty[p], cu=S.cu[p], v0=Vproj(ch,ty,cu,R,S.n,S.nt);
  let best=L[0], bu=-1e9;
  for(const c of L){
    const kc=keyOf(str,c), lower=kc>0?pre[kc-1]:0, higher=tot-pre[kc];
    const pw=(plays.length===0||kc>pmax)?(r?Math.pow(lower/Math.max(1,tot),r):1):0;
    const pl=(plays.length===0||kc<pmin)?(r?Math.pow(higher/Math.max(1,tot),r):1):0;
    const dW=Vproj(ch+c.k,ty|(1<<c.c),cu,R,S.n,S.nt)-v0;
    const dL=Vproj(ch,ty,cu+(c.min?2:1),R,S.n,S.nt)-v0;
    const u=pw*dW+pl*dL+(Math.random()-0.5)*nz;
    if(u>bu){ bu=u; best=c; }
  }
  return best;
}
function cloneS(S){
  return {n:S.n,nt:S.nt,hands:S.hands.map(h=>h.slice()),ch:S.ch.slice(),ty:S.ty.slice(),cu:S.cu.slice(),disc:S.disc,leader:S.leader,rem:S.rem.slice(),mine:S.mine,str:S.str,kc:S.kc,pre:S.pre,noise:S.noise};
}
function playTrick(S,plays,forced){
  const k0=plays.length;
  for(let k=k0;k<S.n;k++){
    const p=(S.leader+k)%S.n;
    const c=(forced&&k===k0)?forced:polCard(S,p,plays,S.noise);
    S.hands[p]=S.hands[p].filter(x=>x!==c); S.rem[c.id]=0; plays.push({p,c});
  }
  const res=judge(plays,S.str);
  S.ch[res.sp]+=res.sc.k; S.ty[res.sp]|=1<<res.sc.c; S.cu[res.wp]+=res.wc.min?2:1;
  S.disc=res.sc.c; S.str=strMap(S.n,S.disc); S.leader=res.sp;
}
function simRest(S){
  while(S.hands[0].length) playTrick(S,[],null);
  return S.ch.map((c,i)=>scoreOf(c,S.ty[i],S.cu[i]));
}
function sampleWorld(p){
  const n=G.n, known=new Set(), deck=G.deckIds;
  G.hands[p].forEach(c=>known.add(c.id)); G.myDisc[p].forEach(c=>known.add(c.id)); G.played.forEach(c=>known.add(c.id));
  const U=shuffle(deck.filter(id=>!known.has(id)).map(id=>CARDS[id])), hands=Array.from({length:n},()=>[]), used=new Uint8Array(U.length);
  hands[p]=G.hands[p].slice();
  for(const q of shuffle([...Array(n).keys()].filter(x=>x!==p))){
    const need=G.hands[q].length, take=[];
    for(let i=0;i<U.length&&take.length<need;i++) if(!used[i]&&!G.void[q][U[i].c]) take.push(i);
    if(take.length<need) for(let i=0;i<U.length&&take.length<need;i++) if(!used[i]&&take.indexOf(i)<0) take.push(i);
    take.forEach(i=>{ used[i]=1; }); hands[q]=take.map(i=>U[i]);
  }
  const rest=[]; for(let i=0;i<U.length;i++) if(!used[i]) rest.push(U[i]);
  // scarti degli altri: le carte rimaste (servono solo a sapere cosa è ancora «nascosto»)
  const dsc=Array.from({length:n},()=>[]); dsc[p]=G.myDisc[p].slice();
  let ri=0; for(let q=0;q<n;q++) if(q!==p){ dsc[q]=rest.slice(ri,ri+DISC[n]); ri+=DISC[n]; }
  return {hands,dsc};
}
function baseSim(w){
  const n=G.n, S={n,nt:TRK(n).length,hands:w.hands,ch:[],ty:[],cu:G.cu.slice(),disc:G.disc,leader:G.leader,rem:new Uint8Array(48),mine:[],str:strMap(n,G.disc),kc:new Int16Array(100),pre:new Int16Array(100),noise:0.05};
  G.deckIds.forEach(id=>{ S.rem[id]=1; }); G.played.forEach(c=>{ S.rem[c.id]=0; });
  for(let q=0;q<n;q++){
    const cards=G.choc[q]; S.ch[q]=cards.reduce((a,c)=>a+c.k,0); S.ty[q]=cards.reduce((a,c)=>a|(1<<c.c),0);
    const m=new Uint8Array(48); w.hands[q].forEach(c=>{ m[c.id]=1; }); w.dsc[q].forEach(c=>{ m[c.id]=1; }); S.mine.push(m);
  }
  return S;
}
function aiCard(p,L0,plays){
  let L=L0;
  if(L.length===1) return L[0];
  // si valutano solo le 4 carte migliori secondo l'euristica; il valore euristico entra come a-priori per ridurre il rumore delle simulazioni
  const rs=baseSim(sampleWorld(p)); rs.noise=0.3;
  const pri=L.map(c=>({c,u:heurU(rs,p,c,plays)})).sort((a,b)=>b.u-a.u).slice(0,4);
  L=pri.map(x=>x.c);
  const tot=L.map(()=>0), t0=performance.now(), ms=window.CH_AIMS||AIP.ms, n=G.n; let nW=0;
  while(nW<AIP.minW||(performance.now()-t0<ms&&nW<AIP.maxW)){
    const base=baseSim(sampleWorld(p));
    L.forEach((c,i)=>{
      const S=cloneS(base);
      playTrick(S,G.plays.map(x=>({p:x.p,c:x.c})),c);
      const sc=simRest(S); let o=0,mx=-1e9;
      for(let q=0;q<n;q++) if(q!==p){ o+=sc[q]; if(sc[q]>mx) mx=sc[q]; }
      tot[i]+=sc[p]-(o/(n-1)+mx)/2;
    });
    nW++;
  }
  const pw=window.CH_PRI===undefined?0.3:window.CH_PRI;
  let bi=0, bv=-1e9; tot.forEach((v,i)=>{ const x=v/nW+pw*pri[i].u; if(x>bv){ bv=x; bi=i; } });
  return L[bi];
}
// utilità euristica di una carta (stessa formula di polCard, senza rumore): serve a scegliere le candidate e come a-priori
function heurU(S,p,c,plays){
  const cnt=S.kc, pre=S.pre, rem=S.rem, mine=S.mine[p], str=S.str; cnt.fill(0); let tot=0;
  for(let id=0;id<48;id++) if(rem[id]&&!mine[id]){ const d=CARDS[id]; cnt[str[d.c]*10+d.n]++; tot++; }
  let a=0; for(let k=0;k<100;k++){ a+=cnt[k]; pre[k]=a; }
  let pmin=1e9, pmax=-1; for(const x of plays){ const k=keyOf(str,x.c); if(k<pmin) pmin=k; if(k>pmax) pmax=k; }
  const r=S.n-plays.length-1, R=S.hands[p].length-1, ch=S.ch[p], ty=S.ty[p], cu=S.cu[p], v0=Vproj(ch,ty,cu,R,S.n,S.nt);
  const kc=keyOf(str,c), lower=kc>0?pre[kc-1]:0, higher=tot-pre[kc];
  const pw=(plays.length===0||kc>pmax)?(r?Math.pow(lower/Math.max(1,tot),r):1):0;
  const pl=(plays.length===0||kc<pmin)?(r?Math.pow(higher/Math.max(1,tot),r):1):0;
  return pw*(Vproj(ch+c.k,ty|(1<<c.c),cu,R,S.n,S.nt)-v0)+pl*(Vproj(ch,ty,cu+(c.min?2:1),R,S.n,S.nt)-v0);
}
// scarti: si tolgono le carte dei tipi con meno carte in mano (per avere più «vuoti» e giocare più liberi), preferendo i numeri medi
function aiDiscard(p,k){
  const h=G.hands[p], cc=new Array(9).fill(0); h.forEach(c=>{ cc[c.c]++; });
  const sc=h.map(c=>({c,u:(cc[c.c]<=1?1.2:cc[c.c]<=2?0.6:0)-Math.abs(c.n-(COLS[c.c].max+1)/2)*0.25+Math.random()*0.6}));
  sc.sort((a,b)=>b.u-a.u);
  return sc.slice(0,k).map(x=>x.c);
}

// ═════════════════════════ PARTITA ═════════════════════════
function newMatch(n){
  if(PR){ const r=PR.rej; PR=null; r(ABORT); }
  G={n,round:0,rounds:n,msg:'',log:[],over:null,show:null,phase:'',turn:-1,
     deckIds:CARDS.filter(c=>n!==3||c.c!==6).map(c=>c.id),
     hands:[],choc:[],cu:[],myDisc:[],discAll:[],played:[],void:[],plays:[],disc:8,used:0,leader:0,start:0,trickNo:0,tricks:0,res:null,fresh:-1,
     pl:Array.from({length:n},(_,i)=>({id:i,name:NAMES[i],total:0,hist:[]}))};
  G.start=rnd(n); NYLO_CK=null;
  run();
}
function dealRound(){
  const n=G.n, deck=shuffle(G.deckIds.map(id=>CARDS[id])), per=PER[n];
  G.hands=G.pl.map((_,i)=>sortHand(deck.slice(i*per,(i+1)*per)));
  G.choc=G.pl.map(()=>[]); G.cu=G.pl.map(()=>0); G.myDisc=G.pl.map(()=>[]); G.discAll=[]; G.void=G.pl.map(()=>new Array(9).fill(false));
  G.plays=[]; G.played=[]; G.res=null; G.trickNo=0; G.fresh=-1; G.disc=8; G.used=0; G.leader=G.start; G.phase='discard';
}
function askMulti(k,hint){
  const g=G;
  return new Promise((res,rej)=>{ PR={type:'multi',k,sel:new Set(),hint,res,rej}; render(); }).then(v=>{ if(g!==G) throw ABORT; return v; });
}
function toggleM(i){
  if(!PR||PR.type!=='multi') return;
  if(PR.sel.has(i)) PR.sel.delete(i); else if(PR.sel.size<PR.k) PR.sel.add(i);
  render();
}
function confirmM(){ if(!PR||PR.type!=='multi'||PR.sel.size!==PR.k) return; const r=PR.res, v=[...PR.sel]; PR=null; render(); r(v); }
function resetM(){ if(PR&&PR.type==='multi'){ PR.sel.clear(); render(); } }
async function discardPhase(){
  const n=G.n, k=DISC[n];
  status(`Round ${G.round}: scegli ${k} ${plural(k,'carta','carte')} da scartare dalla tua mano (restano coperte fino a fine round).`);
  const idx=await askMulti(k,`scegli ${k} ${plural(k,'carta','carte')} da scartare. Tocca di nuovo per togliere la scelta.`);
  const disc=[];
  disc[HUM]=idx.map(i=>G.hands[HUM][i]);
  for(let q=1;q<n;q++){ await sleep(120); disc[q]=aiDiscard(q,k); }
  for(let q=0;q<n;q++){ G.hands[q]=G.hands[q].filter(c=>disc[q].indexOf(c)<0); G.myDisc[q]=disc[q].slice(); G.discAll.push(...disc[q]); }
  logMsg(`Scarti di ${P(HUM).name}: ${disc[HUM].map(cname).join(', ')}. In tutto ${G.discAll.length} carte da parte, coperte fino a fine round.`);
  G.phase='play'; G.tricks=G.hands[0].length;
  status(`Scarti fatti (${G.discAll.length} carte coperte). Si gioca: ${G.tricks} prese, apre ${P(G.start).name}.`);
  await sleep(1200);
}
function turnHint(){
  const L=G.plays.length?G.plays[0].c.c:-1, h=G.hands[HUM];
  let s;
  if(L<0) s='sei di mano: gioca una carta qualsiasi.';
  else if(h.some(c=>c.c===L)) s=`devi rispondere al tipo ${COLS[L].n}.`;
  else s=`non hai carte ${COLS[L].n}: puoi giocare qualsiasi carta.`;
  return `La carta più <b>forte</b> prende il cioccolato, la più <b>debole</b> la coppetta. Conta il tipo sul tabellone (il disco segna il più debole), poi il numero. Tocca a te: ${s}`;
}
function previewText(c){
  const str=strMap(G.n,G.disc), kc=keyOf(str,c), plays=G.plays, r=G.n-plays.length-1;
  const ks=plays.map(x=>keyOf(str,x.c)), above=ks.some(k=>k>kc), below=ks.some(k=>k<kc);
  let st;
  if(!plays.length) st=`sei di mano: ${r} ${plural(r,'giocatore deve','giocatori devono')} ancora giocare`;
  else if(!above) st=r?`al momento è la <b>più forte</b>, ma ${r} ${plural(r,'giocatore può','giocatori possono')} ancora batterla`:'è la <b>più forte</b>: prendi il cioccolato';
  else if(!below) st=r?`al momento è la <b>più debole</b>, ma ${r} ${plural(r,'giocatore può','giocatori possono')} ancora far peggio`:'è la <b>più debole</b>: prendi la coppetta';
  else st=r?'al momento è in mezzo: finirebbe tra le carte usate, ma può cambiare':'è in mezzo: finisce tra le carte usate';
  const nw=!G.choc[HUM].some(x=>x.c===c.c);
  return `Con ${esc(cname(c))} (${c.k} ${plural(c.k,'cioccolatino','cioccolatini')}) ${st}. Se vinci: +${c.k} ${plural(c.k,'cioccolatino','cioccolatini')}${nw?' e un tipo nuovo':''}. Se perdi: ${c.min?'2 coppette (simbolo Min)':'1 coppetta'}.`;
}
function humanTurn(){
  const g=G, L=G.hands[HUM].filter(c=>!G.plays.length||c.c===G.plays[0].c.c);
  const lg=L.length?L:G.hands[HUM];
  if(lg.length===1){ status(`Presa ${G.trickNo}/${G.tricks}: hai una sola carta giocabile, ${cname(lg[0])}.`); return sleep(1000).then(()=>lg[0]); }
  return new Promise((res,rej)=>{ PR={type:'turn',legal:new Set(lg.map(c=>c.id)),sel:null,res,rej}; render(); }).then(v=>{ if(g!==G) throw ABORT; return v; });
}
function tapCard(id){
  if(!PR||PR.type!=='turn'||!PR.legal.has(id)) return;
  const c=G.hands[HUM].find(x=>x.id===id);
  if(!OPT.undo){ const r=PR.res; PR=null; render(); r(c); return; }
  PR.sel=PR.sel===id?null:id; render();
}
function goTurn(kind){
  if(!PR||PR.type!=='turn'||PR.sel==null) return;
  if(kind==='x'){ PR.sel=null; render(); return; }
  const c=G.hands[HUM].find(x=>x.id===PR.sel), r=PR.res; PR=null; render(); r(c);
}
const legalFor = (hand,plays) => { const lc=plays.length?plays[0].c.c:-1; if(lc<0) return hand; const f=hand.filter(c=>c.c===lc); return f.length?f:hand; };
async function oneTrick(){
  const n=G.n; G.trickNo++; G.plays=[]; G.res=null; G.fresh=-1;
  logMsg(`Presa ${G.trickNo}/${G.tricks}: di mano ${P(G.leader).name}. Disco su ${COLS[G.disc].n} (la più debole).`);
  status(`Presa ${G.trickNo}/${G.tricks}: di mano ${P(G.leader).name}.`);
  await sleep(700);
  for(let k=0;k<n;k++){
    const p=(G.leader+k)%n, pl=P(p), lc=G.plays.length?G.plays[0].c.c:-1;
    G.turn=p; status(`Presa ${G.trickNo}/${G.tricks} · tocca a ${pl.name}.`);
    let c;
    if(p===HUM) c=await humanTurn();
    else{ await sleep(600); c=aiCard(p,legalFor(G.hands[p],G.plays),G.plays); }
    if(lc>=0&&c.c!==lc) G.void[p][lc]=true;
    G.hands[p]=G.hands[p].filter(x=>x!==c); G.plays.push({p,c}); G.played.push(c); G.fresh=p;
    logMsg(`${pl.name} gioca ${cname(c)}${lc<0?' (di mano)':c.c!==lc?` (non ha ${COLS[lc].n})`:''}.`);
  }
  G.turn=-1;
  const res=judge(G.plays,strMap(n,G.disc)), old=G.disc;
  settleTrick(res); G.res=res; ckpt();   // punto sicuro anche subito dopo la presa (stato = inizio presa successiva), prima della pausa di visualizzazione
  let m=`${P(res.sp).name} prende il cioccolato (${cname(res.sc)}: +${res.sc.k}) · ${P(res.wp).name} prende la coppetta (${cname(res.wc)}${res.wc.min?' con Min: 2 coppette':''}).`;
  if(res.sc.c!==old) m+=` Il disco passa su ${COLS[res.sc.c].n}.`;
  status(m); logMsg(m);
  await sleep(2300);
}
async function scoring(rs){
  if(!rs){
    const rc=G.pl.map(p=>roundCalc(p.id)), sc=rc.map(x=>x.pts);
    G.pl.forEach(p=>{ p.total+=sc[p.id]; p.hist.push(sc[p.id]); });
    logMsg(`Round ${G.round} concluso: ${G.pl.map(p=>`${p.name} ${sgn(sc[p.id])} (totale ${p.total})`).join(' · ')}.`);
    const last=G.round===G.rounds;
    if(!last){
      // di mano nel prossimo round: il punteggio totale più basso; a parità chi ha fatto meno in questo round
      const mt=Math.min(...G.pl.map(p=>p.total)); let c=G.pl.filter(p=>p.total===mt);
      if(c.length>1){ const mr=Math.min(...c.map(p=>sc[p.id])); c=c.filter(p=>sc[p.id]===mr); }
      G.start=c[rnd(c.length)].id;
    }
    G.show={rc,last,next:last?-1:G.start}; ckpt();
  }
  const last=G.show.last;
  status(last?'Partita conclusa: ecco il risultato.':`Round ${G.round} concluso.`);
  await ask(HUM,'Punteggio del round',[{label:last?'Mostra risultato finale':'Prossimo round',value:1}]);
  G.show=null;
}
async function run(rs){
  const g=G;
  try{
    let res=!!rs&&g.round>0;
    if(!res){
      status(`Buona partita a Chatlat, ${P(HUM).name}!`);
      await ask(HUM,`Primo di mano: ${P(g.start).name}`,[{label:'Ok, si parte',value:1}]);
    }
    for(let r=res?g.round:1;r<=g.rounds;r++){
      const ph=res?g.phase:'';
      if(res){ res=false; status(`Partita ripresa: round ${r}/${g.rounds}.`); }
      if(!ph){
        g.round=r; dealRound();
        logMsg(`— Round ${r}/${g.rounds}: di mano ${P(g.start).name} —`);
        ckpt();
      }
      if(!ph||ph==='discard') await discardPhase();
      if(ph!=='end'){
        while(g.hands[0].length){ ckpt(); await oneTrick(); }
        g.plays=[]; g.res=null; g.phase='end';
      }
      await scoring(ph==='end');
    }
    const m=Math.max(...g.pl.map(p=>p.total));
    g.over={winners:g.pl.filter(p=>p.total===m).map(p=>p.id)};
    g.turn=-1; g.show=null; render();
  }catch(e){
    if(e===ABORT||g!==G) return;
    console.error(e); G.log.unshift('Errore: '+e.message); render();
  }
}

const RULES_HTML = `
<details class="rules"><summary>REGOLAMENTO</summary>
<div class="rtext">
<h4>Che gioco è</h4>
<p>Chatlat (シャトラ) è un gioco di prese per 3–4 giocatori: nella famosa cioccolateria «Chatlat» tutti si contendono i cioccolatini più richiesti, che finiscono presto. L'obiettivo è raccogliere <b>cioccolatini</b> e <b>coppette</b> per formare più <b>set</b> possibile con tanti tipi diversi. Si gioca un round per ogni giocatore; vince il totale più alto.</p>
<h4>Componenti</h4>
<ul><li><b>48 carte cioccolato</b> in 9 tipi: Cacao 1–8, Panna 1–8, Arancio 1–6, Verde 1–6, Rosa 1–6, Pesca 1–4, Prugna 1–4, Turchese 1–4, Oro 1–2. Il numero più alto di ogni tipo ha il simbolo <b>Min</b>.</li>
<li><b>Il tabellone</b> con i 9 tipi in fila (8 con 3 giocatori) e il <b>disco</b>, che indica il tipo più debole.</li></ul>
<h4>Preparazione della partita</h4>
<p>Con 3 giocatori si tolgono le 6 carte Arancio (42 carte, 8 tipi); con 4 si usano tutte. Il disco parte accanto all'ultimo tipo del tabellone (Cacao).</p>
<h4>Preparazione del round</h4>
<ol><li>Si mescolano le carte e si danno a ciascuno: 3 giocatori 14 carte, 4 giocatori 12.</li>
<li>Ognuno guarda la mano e scarta <b>coperte</b> 2 carte (3 giocatori) o 1 carta (4). Gli scarti restano da parte, senza rivelarli fino a fine round: possono servire per il punteggio.</li></ol>
<p>Di mano nel primo round: a caso; poi chi ha il <b>totale più basso</b> (a parità, chi ha fatto meno nel round appena concluso).</p>
<h4>La presa</h4>
<ol><li>Chi è di mano gioca una carta scoperta.</li>
<li>Gli altri, in senso orario, devono rispondere con una carta dello <b>stesso tipo</b> se ce l'hanno; altrimenti giocano qualsiasi carta.</li>
<li>Poi si decide la forza di ogni carta.</li></ol>
<h4>Forza delle carte</h4>
<p>Sul tabellone il tipo dove c'è il disco è il <b>più debole</b>; salendo verso l'alto, e riprendendo dal fondo, i tipi diventano via via più forti (il più forte è quello subito sotto il disco). A parità di tipo vince il numero più alto. Il colore della carta di mano non conta: una carta fuori tipo può vincere.</p>
<h4>Chi prende le carte</h4>
<ul><li><b>La più forte</b> (1° posto): il giocatore la mette scoperta davanti a sé come <b>cioccolato</b>.</li>
<li><b>La più debole</b> (ultimo posto): il giocatore la mette coperta davanti a sé come <b>coppetta</b>. Se ha il simbolo <b>Min</b> (è il numero più alto del suo tipo), prende in più una carta coperta dalle <b>carte usate</b> (2 coppette in tutto).</li>
<li><b>Le altre carte</b> vanno coperte da parte tra le «carte usate»; non si possono guardare durante il round.</li></ul>
<p>Poi il <b>disco si sposta sul tipo della carta più forte</b> (se già lì, resta), e chi ha preso il cioccolato apre la presa successiva.</p>
<h4>Fine del round e punteggio</h4>
<p>Il round finisce quando le mani sono vuote. Ogni giocatore forma i <b>set</b>: un cioccolatino raffigurato su una carta scoperta più una coppetta (carta coperta) formano un set. Su una carta possono esserci più cioccolatini; si possono contare anche solo in parte. Punti del round: <b>numero di set × numero di tipi diversi nei set</b>.</p>
<ul><li>Se i <b>cioccolatini e le coppette</b> sono esattamente lo stesso numero: <b>+10 punti</b>.</li>
<li>Se non hai preso <b>nessuna carta</b>: ricevi un <b>regalo</b>: si rivelano gli scarti iniziali e prendi punti pari al numero di cioccolatini × il numero di tipi diversi negli scarti.</li>
<li>Se hai solo cioccolato o solo coppette: 0 punti, senza regalo.</li></ul>
<p>Esempio: 3 cioccolatini (2 tipi) e 3 coppette = 3 × 2 = 6, più 10 di bonus = 16. Esempio: 4 coppette e 7 cioccolatini di 5 tipi = 4 set × 4 tipi = 16 (nessun bonus: i numeri non coincidono).</p>
<h4>Fine della partita</h4>
<p>Dopo tanti round quanti sono i giocatori vince il totale più alto; in caso di parità la vittoria è condivisa.</p>
<p><i>Nell'app:</i> non avendo le foto di tutte le carte ho dedotto i cioccolatini raffigurati: l'1 di ogni tipo ne ha 3, il 2 ne ha 2, il numero più alto (Min) e gli altri 1. Gli scarti per il regalo sono quelli di tutti i giocatori. La coppetta in più (Min) viene da una carta usata a caso (conta solo il numero). Il bonus +10 si applica quando i cioccolatini raffigurati sulle carte scoperte sono tanti quante le coppette. L'AI conosce la propria mano, le carte giocate e i tipi che un giocatore non ha (non ha risposto), non le mani altrui. Nel menu ci sono «Abilita annulla» e «Mostra le carte uscite» (carte giocate nel round e tuoi scarti sbarrati, le tue in contorno).</p>
</div></details>`;

let LOGOPEN=false;
document.getElementById('app').addEventListener('toggle',e=>{ if(e.target.matches&&e.target.matches('details.log')) LOGOPEN=e.target.open; },true);
let MENUOPEN=false;
function render(){
  const app=document.getElementById('app');
  const top=`<div class="topbar"><div class="logo">Chatlat<span class="jp">シャトラ</span></div>
    ${window.nyloBackBtn?nyloBackBtn():""}${nyloHomeBtn()}
    ${G&&!G.over&&G.round?`<span class="badge">Round ${G.round}/${G.rounds}</span>`:''}
    ${G?`<button class="btn btn-sm" data-new="1">Nuova partita</button>`:''}
    ${menuHtml()}</div>`;
  let body='';
  if(G){
    const ready=G.hands.length>0;
    body=`${ready?`<div class="table n${G.n}">${G.pl.map((p,i)=>seatHtml(i,POS[G.n][i])).join('')}${centerHtml()}</div>`:''}
      ${ready&&!G.over&&G.phase==='play'?statusTable():''}
      ${ready&&OPT.memo&&!G.over&&(G.phase==='play'||G.phase==='discard')?memoHtml():''}
      ${G.pl[0].hist.length&&!G.over?`<div class="scorebox"><h3>PUNTEGGI</h3>${scoreTable()}</div>`:''}
      ${logHtml()}
      ${recapHtml()}
      ${RULES_HTML}`;
  }
  const lb=app.querySelector('.logbody'), lbTop=lb?lb.scrollTop:0;
  app.innerHTML=top+`<div class="dock${G&&(G.show||G.over)?' tall':''}">${dockHtml()}</div>`+body;
  if(lbTop){ const nb=app.querySelector('.logbody'); if(nb) nb.scrollTop=lbTop; }
}

document.getElementById('app').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||b.disabled) return;
  if(b.dataset.menu){ MENUOPEN=!MENUOPEN; render(); return; }
  if(b.dataset.n){ MENUOPEN=false; const n=Number(b.dataset.n); if(G) newMatch(n); else askName(n); }
  else if(b.dataset.new){ if(confirm('Iniziare una nuova partita?')){ MENUOPEN=false; toSetup(); } }
  else if(b.dataset.i!==undefined) answer(Number(b.dataset.i));
  else if(b.dataset.t!==undefined) tapCard(Number(b.dataset.t));
  else if(b.dataset.go!==undefined) goTurn(b.dataset.go);
  else if(b.dataset.m!==undefined) toggleM(Number(b.dataset.m));
  else if(b.dataset.mc!==undefined) confirmM();
  else if(b.dataset.mr!==undefined) resetM();
});
document.getElementById('app').addEventListener('change',e=>{
  if(e.target.id==='optMemo'){
    OPT.memo=e.target.checked;
    try{ localStorage.setItem('ch-memo',OPT.memo?'1':'0'); }catch(err){}
    render(); return;
  }
  if(e.target.id!=='optUndo') return;
  OPT.undo=e.target.checked;
  try{ localStorage.setItem('ch-undo',OPT.undo?'1':'0'); }catch(err){}
  if(!OPT.undo&&PR&&PR.type==='turn'&&PR.sel!=null) PR.sel=null;
  render();
});
document.addEventListener('click',e=>{ if(MENUOPEN&&!e.target.closest('.menu-wrap')){ MENUOPEN=false; render(); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&MENUOPEN){ MENUOPEN=false; render(); } });
render();
nyloSaveInit('chatlat',snap=>{ G=snap; PR=null; render(); run(true); });

</script>
</body>
</html>
