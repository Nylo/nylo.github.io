.score-strip{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.score{padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:12px;display:flex;justify-content:space-between;gap:8px}.score b{font-size:14px}.log{margin:12px 0;padding:10px 13px}.log summary,details.rules summary{cursor:pointer;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}.logbody{max-height:180px;overflow:auto;margin-top:8px;color:var(--muted);font-size:12px;line-height:1.65}.logbody div{border-top:1px solid #eee8da;padding:3px 0}details.rules{padding:13px 15px;margin-top:12px}details.rules .rules-body{color:var(--muted);font-size:12px;line-height:1.6;padding-top:10px}details.rules h3{font:700 14px 'Kalam',cursive;color:#5a4a15;margin:12px 0 4px}details.rules ul{padding-left:18px}details.rules li{margin:3px 0}
@media(max-width:640px){:root{--cw:43px;--ch:62px}.app{padding:6px 9px 26px}.logo{font-size:25px}.board{min-height:320px;grid-template-columns:.7fr 1.6fr .7fr;grid-template-areas:'. top .' 'left center right' 'bottom bottom bottom';padding:7px;gap:3px}.seat{padding:4px 2px}.seat-name{font-size:12px}.back{width:14px;height:20px}.groups{grid-template-columns:1fr}.card{font-size:20px}.card .suit{font-size:20px}.setup{margin:4vh auto;padding:20px}.battle-grid{grid-template-columns:1fr}.score{padding:8px}.cards{gap:4px}}

<body>
<main class="app" id="app"></main>
<script>
const SUITS=[{name:'Giallo',mark:'♦',css:0},{name:'Rosso',mark:'♥',css:1},{name:'Verde',mark:'♣',css:2},{name:'Viola',mark:'♠',css:3}];
const PLAYER_NAMES=['Tu','AI Formica'];
const rnd=n=>Math.floor(Math.random()*n);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let G=null,PENDING=null,MENUOPEN=false,LOGOPEN=false;
const OPT={undo:true,a11y:false};
try{const u=localStorage.getItem('ants-undo');if(u!==null)OPT.undo=u==='1';OPT.a11y=localStorage.getItem('ants-a11y')==='1'}catch(e){}
function note(text){G.log.unshift(text);if(G.log.length>120)G.log.pop()}
function later(fn,ms){const match=G;setTimeout(()=>{if(G===match)fn()},ms)}
const P=i=>G.players[i];

function startMatch(){
  PENDING=null;
  const ants=[];let serial=0;
  for(let s=0;s<4;s++)for(let v=1;v<=5;v++)ants.push({id:`a${serial++}`,kind:'ant',s,v});
  for(let i=0;i<4;i++)ants.push({id:`p${i}`,kind:'pig'});
  shuffle(ants);
  const players=[0,1].map(id=>({id,name:PLAYER_NAMES[id],ants:ants.slice(id*10,id*10+10).filter(c=>c.kind==='ant'),pigs:ants.slice(id*10,id*10+10).filter(c=>c.kind==='pig'),queen:{id:`q${id}`,kind:'queen',used:false},score:0}));
  players.forEach(p=>{p.ants.sort((a,b)=>a.s-b.s||a.v-b.v);p.ants.forEach((c,i)=>c.side=i%2?'attack':'defense')});
  const reserve=ants.slice(20),turned=reserve.shift();
  G={players,phase:'formation',trumpCard:turned,trump:turned.kind==='ant'?turned.s:null,trumpPig:turned.kind==='pig',reserve,attacker:-1,step:'',lead:null,response:null,log:[],trick:0,winner:-1,reason:'',formationReady:false};
  formAi();note(`Briscola rivelata: ${turned.kind==='pig'?'Porcellino di Terra':SUITS[turned.s].name}.`);render();
}
function formAi(){
  const cards=P(1).ants.slice().sort((a,b)=>strength(b)-strength(a));
  const defenseCount=Math.ceil(cards.length/2);
  cards.forEach((c,i)=>c.side=i<defenseCount?'defense':'attack');
}
function strength(card){return card.v+(card.s===G.trump?2.4:0)}
function toggleSide(id){if(G.phase!=='formation')return;const c=P(0).ants.find(x=>x.id===id);if(c)c.side=c.side==='attack'?'defense':'attack';render()}
function sideCards(player,side){return P(player).ants.filter(c=>c.side===side)}
function total(player,side){return sideCards(player,side).reduce((a,c)=>a+c.v,0)}
function confirmFormation(){
  if(G.phase!=='formation')return;
  G.phase='battle';
  const d0=total(0,'defense'),d1=total(1,'defense'),a0=total(0,'attack'),a1=total(1,'attack');
  if(d0!==d1)G.attacker=d0>d1?0:1;
  else if(a0!==a1)G.attacker=a0>a1?0:1;
  else G.attacker=rnd(2);
  const why=d0!==d1?'difesa':a0!==a1?'attacco':'spareggio casuale';
  note(`${P(G.attacker).name} attacca per primo (${why}).`);render();
}
function beginTrick(){
  if(G.phase==='over')return;
  G.phase='trick';G.step='attack';G.lead=null;G.response=null;G.trick++;
  render();runAi();
}
function available(player,role){return [...sideCards(player,role),...P(player).pigs]}
function legalMoves(player,role){
  const p=P(player), ants=sideCards(player,role), pigs=p.pigs;
  if(role==='attack')return ants.length||pigs.length?[...ants,...pigs]:[p.queen];
  if(G.lead&&G.lead.kind==='queen')return ants.length||pigs.length?[...ants,...pigs]:[p.queen];
  if(G.lead&&G.lead.kind==='ant'){
    const must=ants.filter(c=>c.s===G.lead.s);
    const choices=must.length?[...must,...pigs]:[...ants,...pigs];
    return choices.length?choices:[p.queen];
  }
  return ants.length||pigs.length?[...ants,...pigs]:[p.queen];
}
function isHumanTurn(){return G.phase==='trick'&&G.step!=='wait'&&(G.step==='attack'?G.attacker:1-G.attacker)===0}
function outcome(attackerCard,defenderCard){
  if(attackerCard.kind==='queen')return defenderCard.kind==='queen'?G.attacker:1-G.attacker;
  if(defenderCard.kind==='queen')return G.attacker;
  const aPig=attackerCard.kind==='pig',dPig=defenderCard.kind==='pig';
  if(G.trumpPig){if(aPig&&dPig)return G.attacker;if(aPig)return G.attacker;if(dPig)return 1-G.attacker}
  else{if(aPig&&dPig)return G.attacker;if(aPig)return 1-G.attacker;if(dPig)return G.attacker}
  if(attackerCard.s===defenderCard.s)return attackerCard.v>=defenderCard.v?G.attacker:1-G.attacker;
  if(G.trump!==null){if(attackerCard.s===G.trump)return G.attacker;if(defenderCard.s===G.trump)return 1-G.attacker}
  return G.attacker;
}
function removeCard(player,card){
  const p=P(player),pile=card.kind==='pig'?p.pigs:p.ants,index=pile.findIndex(c=>c.id===card.id);
  if(index>=0)pile.splice(index,1);
  if(card.kind==='queen')p.queen.used=true;
}
function playMove(player,card){
  if(G.phase!=='trick'||!isValidTurn(player,card))return;
  PENDING=null;
  const role=G.step;removeCard(player,card);
  if(role==='attack'){
    G.lead=card;G.step='defense';note(`${P(player).name} attacca con ${cardName(card)}.`);render();runAi();return;
  }
  G.response=card;note(`${P(player).name} difende con ${cardName(card)}.`);resolveTrick();
}
function isValidTurn(player,card){
  const active=G.step==='attack'?G.attacker:1-G.attacker;
  return player===active&&legalMoves(player,G.step).some(c=>c.id===card.id);
}
function cardName(c){return c.kind==='pig'?'Porcellino di Terra':c.kind==='queen'?'Regina':`${c.v} di ${SUITS[c.s].name}`}
function resolveTrick(){
  const winner=outcome(G.lead,G.response);
  if(G.lead.kind==='queen'){
    endGame(winner,G.response.kind==='queen'?'Regina contro Regina: vince l’Ultimo Attacco.':'Ultimo Attacco: la risposta normale protegge la Regina.');return;
  }
  if(G.response.kind==='queen'){
    endGame(winner,'Il difensore è costretto a giocare la Regina.');return;
  }
  G.winner=winner;G.step='wait';note(`${P(winner).name} vince la presa e attaccherà la prossima.`);render();
  later(()=>{G.attacker=winner;beginTrick()},850);
}
function endGame(winner,reason){G.phase='over';G.winner=winner;G.reason=reason;P(winner).score=1;note(`${P(winner).name} vince la partita. ${reason}`);render()}
function runAi(){
  if(G.phase!=='trick'||isHumanTurn())return;
  const role=G.step,player=role==='attack'?G.attacker:1-G.attacker;
  if(player===0)return;
  later(()=>{if(G.phase==='trick'&&!isHumanTurn())playMove(player,chooseAiMove(player,role))},500);
}
function chooseAiMove(player,role){
  const moves=legalMoves(player,role);
  if(moves.length===1)return moves[0];
  if(role==='attack'){
    const ranked=moves.map(c=>({c,score:c.kind==='ant'?strength(c):G.trumpPig?10:1}));
    ranked.sort((a,b)=>b.score-a.score||a.c.id.localeCompare(b.c.id));
    return ranked[0].c;
  }
  const ranked=moves.map(c=>({c,wins:outcome(G.lead,c)===player,cost:c.kind==='ant'?strength(c):G.trumpPig?8:0}));
  const winners=ranked.filter(x=>x.wins).sort((a,b)=>a.cost-b.cost);
  if(winners.length)return winners[0].c;
  ranked.sort((a,b)=>a.cost-b.cost);
  return ranked[0].c;
}
function cardHtml(c,{button=false,disabled=false,small=false,side=''}={}){
  const pig=c.kind==='pig',queen=c.kind==='queen',cls=queen?'queen':pig?'pig':`s${c.s}`;
  const mark=pig?'<i class="ph-fill ph-bug"></i>':queen?'<i class="ph-fill ph-crown"></i>':SUITS[c.s].mark;
  const value=pig?'P':queen?'Q':c.v;
  const face=`<span class="corner">${value}</span><span class="suit">${mark}</span><span class="tiny">${pig?'PILL BUG':queen?'QUEEN':SUITS[c.s].name.toUpperCase()}</span>`;
  if(button)return `<button class="card ${cls} ${small?'minicard':''} ${disabled?'':'legal'} ${PENDING===c.id?'selected':''}" data-play="${esc(c.id)}" aria-label="Gioca ${esc(cardName(c))}" ${disabled?'disabled':''}>${face}</button>`;
  return `<span class="card ${cls} ${small?'minicard':''}">${face}${side?`<button class="side-btn ${side}" data-toggle="${esc(c.id)}">${side==='attack'?'Attacco':'Difesa'}</button>`:''}</span>`;
}
function cardBacks(count){return Array.from({length:Math.max(0,count)},()=>'<span class="back">♟</span>').join('')}
function playerPanel(player,position){
  const p=P(player),human=player===0,active=G.phase==='trick'&&(G.step==='attack'?G.attacker:1-G.attacker)===player;
  if(human)return `<div class="seat human ${active?'active':''}"><div class="seat-name">Tu ${player===G.attacker&&G.phase==='trick'?'<span class="tag">Attacco</span>':''}</div><div class="seat-meta"><span class="tag">Regina ${p.queen.used?'giocata':'in riserva'}</span><span class="tag">Porcellini ${p.pigs.length}</span></div></div>`;
  const attack=sideCards(player,'attack').length,defense=sideCards(player,'defense').length;
  return `<div class="seat ${position} ${active?'active':''}"><div class="seat-name">AI Formica ${G.phase==='trick'&&player===G.attacker?'<span class="tag">Attacco</span>':''}</div><div class="seat-meta"><span class="tag">Attacco ${attack}</span><span class="tag">Difesa ${defense}</span><span class="tag">Porcellini ${p.pigs.length}</span><span class="tag">Regina ${p.queen.used?'giocata':'in riserva'}</span></div><div class="backs">${cardBacks(attack+defense)}</div></div>`;
}
function formationPanel(){
  const p=P(0),attack=sideCards(0,'attack'),defense=sideCards(0,'defense');
  return `<section class="hand-panel"><div class="hand-title">La tua formazione <small>La Regina divide Attacco e Difesa. Tocca una carta per spostarla da un lato all’altro.</small></div><div class="groups"><div class="group"><h3>Difesa · ${defense.length} carte · valore ${total(0,'defense')}</h3><div class="cards">${defense.map(c=>`<div class="formation-card">${cardHtml(c,{small:true,side:'defense'})}</div>`).join('')||'<small>Nessuna carta</small>'}</div></div><div class="group"><h3>Attacco · ${attack.length} carte · valore ${total(0,'attack')}</h3><div class="cards">${attack.map(c=>`<div class="formation-card">${cardHtml(c,{small:true,side:'attack'})}</div>`).join('')||'<small>Nessuna carta</small>'}</div></div></div><div class="queen-marker"><i class="ph-fill ph-crown"></i> Regina · divisore della mano</div><div class="pigs-row"><span class="pigs-label">Porcellini di Terra · fuori dalla formazione</span>${p.pigs.map(c=>cardHtml(c,{small:true})).join('')||'<small>Nessuno</small>'}</div></section>`;
}
function battlePanel(){
  if(G.phase!=='battle')return '';
  const d0=total(0,'defense'),d1=total(1,'defense'),a0=total(0,'attack'),a1=total(1,'attack');
  return `<section class="battle-panel"><h2>Fase di Battaglia</h2><div class="battle-grid"><div class="battle-side"><b>${d0}</b> · tua Difesa<br><b>${a0}</b> · tuo Attacco</div><div class="battle-side"><b>${d1}</b> · Difesa AI<br><b>${a1}</b> · Attacco AI</div></div><p style="margin:8px 0">${esc(P(G.attacker).name)} inizia all’attacco: ${d0===d1?(a0===a1?'pareggio completo, decisione casuale':'ha il valore d’Attacco più alto'):'ha il valore di Difesa più alto'}.</p></section>`;
}
function humanPlayPanel(){
  if(G.phase!=='trick'||G.step==='wait')return '';
  const role=G.step,humanTurn=isHumanTurn(),moves=humanTurn?legalMoves(0,role):[];
  const legal=new Set(moves.map(c=>c.id));
  const title=role==='attack'?'Le tue carte d’Attacco':'Le tue carte di Difesa';
  const group=sideCards(0,role),other=sideCards(0,role==='attack'?'defense':'attack');
  const groupHtml=cards=>cards.map(c=>cardHtml(c,{button:true,small:true,disabled:!legal.has(c.id)})).join('')||'<small>Nessuna</small>';
  return `<section class="hand-panel"><div class="hand-title">${humanTurn?'Tocca a te · ':''}${title}<small>${role==='defense'&&G.lead?.kind==='ant'?'Obbligo di rispondere al colore se puoi.':''}${humanTurn?' Seleziona una carta legale.':''}</small></div><div class="groups"><div class="group"><h3>${role==='attack'?'Attacco':'Difesa'} · ${group.length}</h3><div class="cards">${groupHtml(group)}</div></div><div class="group"><h3>${role==='attack'?'Difesa':'Attacco'} · non giocabili ora · ${other.length}</h3><div class="cards">${other.map(c=>cardHtml(c,{small:true})).join('')||'<small>Nessuna</small>'}</div></div></div><div class="pigs-row"><span class="pigs-label">Porcellini · giocabili in qualsiasi momento · ${P(0).pigs.length}</span>${P(0).pigs.map(c=>cardHtml(c,{button:true,small:true,disabled:!legal.has(c.id)})).join('')||'<small>Nessuno</small>'}</div>${moves.length===1&&moves[0].kind==='queen'?`<div class="pigs-row"><span class="pigs-label">Non hai altre carte in questo lato: Ultimo Attacco</span>${cardHtml(moves[0],{button:true,small:true})}</div>`:''}</section>`;
}
function centerCards(){
  const cards=[];
  if(G.lead)cards.push(`<div class="played">${cardHtml(G.lead,{small:true})}<span>${esc(P(G.attacker).name)} · attacco</span></div>`);
  if(G.response)cards.push(`<div class="played">${cardHtml(G.response,{small:true})}<span>${esc(P(1-G.attacker).name)} · difesa</span></div>`);
  const text=G.phase==='formation'?'Prepara la tua formazione':G.phase==='battle'?'Confronto delle formazioni':G.phase==='over'?G.reason:G.step==='attack'?`${P(G.attacker).name} attacca`: `${P(1-G.attacker).name} difende`;
  return `<div class="center"><div class="trump-card">${cardHtml(G.trumpCard,{small:true})}<span>Briscola<br><b>${G.trumpPig?'Porcellino di Terra':SUITS[G.trump].name}</b></span></div><div class="table-cards">${cards.join('')||'<span class="turn-note">Regina in posizione · pronta a proteggere la colonia</span>'}</div><div class="turn-note">${esc(text)}</div></div>`;
}
function menuHtml(){return `<div class="menu-wrap"><button class="hamb" type="button" data-menu="1" aria-label="Opzioni" aria-expanded="${MENUOPEN}"><svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 1h16M1 7h16M1 13h16"/></svg></button>${MENUOPEN?`<div class="menu-pop"><label class="opt-toggle" title="Conferma una carta prima di giocarla"><input type="checkbox" id="optUndo" ${OPT.undo?'checked':''}> Abilita annulla</label><label class="opt-toggle" title="Aggiunge trame per distinguere i semi senza affidarsi ai colori"><input type="checkbox" id="optA11y" ${OPT.a11y?'checked':''}> Modalità accessibile</label></div>`:''}</div>`}
function topbar(){return `<header class="topbar"><div class="logo"><small>Gioco di prese per 2</small>ants</div>${window.nyloBackBtn?nyloBackBtn():''}${nyloHomeBtn()}${G?`<span class="badge">${G.phase==='over'?'Partita conclusa':G.phase==='trick'?`Presa ${G.trick}`:G.phase==='battle'?'Battaglia':'Formazione'}</span><button class="btn btn-sm" data-new="1">Nuova partita</button>`:''}${menuHtml()}</header>`}
function render(){
  const app=document.getElementById('app');document.body.classList.toggle('a11y',OPT.a11y);
  const topHtml=topbar();
  if(!G){app.innerHTML=topHtml+`<div class="dock"><div class="dock-msg">Proteggi la Regina. Forma unità di Attacco e Difesa, usa i Porcellini di Terra e guida la colonia alla vittoria.</div><div class="opts"><button class="opt primary" data-start="1">Nuova partita</button></div></div>${rulesHtml()}`;return}
  let dock='';
  if(PENDING){const card=[...P(0).ants,...P(0).pigs,P(0).queen].find(c=>c.id===PENDING);dock=`<strong>Conferma la mossa</strong><p>Giocare ${esc(card?cardName(card):'questa carta')}?</p><div class="opts"><button class="opt primary" data-confirm-move="1">Conferma</button><button class="opt" data-cancel-move="1">Annulla</button></div>`}
  else if(G.phase==='formation')dock=`<strong>Fase di Formazione</strong><p>Sposta le formiche tra Attacco e Difesa. Il lato Difesa più forte decide chi attacca per primo; un pareggio si risolve confrontando gli Attacchi.</p><div class="opts"><button class="opt primary" id="formationDone">Conferma formazione</button></div>`;
  else if(G.phase==='battle')dock=`<strong>Fase di Battaglia</strong><p>Le somme delle unità sono rivelate. Premi per iniziare la prima presa.</p><div class="opts"><button class="opt primary" id="beginTrick">Inizia le prese</button></div>`;
  else if(G.phase==='trick')dock=`<strong>Fase Prese · presa ${G.trick}</strong><p>${G.step==='attack'?`${esc(P(G.attacker).name)} gioca dal lato Attacco.`:`${esc(P(1-G.attacker).name)} risponde dal lato Difesa.`} I Porcellini possono essere giocati da entrambi i lati.</p>`;
  else dock=`<strong>Partita conclusa</strong><p>${esc(P(G.winner).name)} vince. ${esc(G.reason)}</p>`;
  const center=centerCards();
  const formation=G.phase==='formation'?formationPanel():'';
  const hand=humanPlayPanel();
  app.innerHTML=topHtml+`<section class="dock">${dock}</section><div class="board">${playerPanel(1,'top')}${center}${playerPanel(0,'bottom')}</div>${formation}${battlePanel()}${hand}<details class="log" ${LOGOPEN?'open':''}><summary>LOG DELLA PARTITA (${G.log.length})</summary><div class="logbody">${G.log.map(x=>`<div>${esc(x)}</div>`).join('')}</div></details>${rulesHtml()}`;
}
function rulesHtml(){return `<details class="rules"><summary>Regolamento</summary><div class="rules-body"><h3>Componenti e preparazione</h3><ul><li>24 carte da gioco: 20 Formiche (valori 1–5 in quattro colori) e 4 Porcellini di Terra; più 2 Regine e 2 carte Giocatore.</li><li>Ogni giocatore riceve 10 carte. Le 4 rimanenti formano il mazzo coperto; la prima rivela il seme di briscola. I Porcellini in mano si mettono scoperti davanti a sé.</li><li>In questa versione digitale le carte Giocatore sono rappresentate dai gruppi Attacco e Difesa; la Regina è il divisore tra i due gruppi.</li></ul><h3>Formazione e battaglia</h3><ul><li>Distribuisci liberamente le Formiche tra Attacco e Difesa. Una volta confermata la formazione non può più essere modificata.</li><li>Confrontate la somma dei valori in Difesa: il totale più alto attacca per primo. In caso di parità si confronta la somma in Attacco; ulteriore parità risolta casualmente.</li></ul><h3>Prese</h3><ul><li>L’attaccante gioca una carta d’Attacco. Il difensore risponde dalla Difesa: deve seguire il colore se possibile. Vince la carta più alta dello stesso colore; tra colori diversi vince la briscola, altrimenti vince l’attaccante.</li><li>I Porcellini si possono giocare sempre. Di norma perdono contro una Formica; se la briscola rivelata è un Porcellino, tutti i Porcellini diventano le carte più forti. Due Porcellini nella stessa presa danno la vittoria all’attaccante.</li><li>Il vincitore della presa attacca per primo nella successiva.</li></ul><h3>Regina e fine partita</h3><ul><li>Se non restano carte giocabili dal lato richiesto e non ci sono Porcellini, si gioca la Regina. Se la Regina è giocata in difesa, vince l’attaccante.</li><li>La Regina giocata in Attacco avvia l’Ultimo Attacco: Regina contro Regina vince l’attaccante; una risposta normale dà la vittoria al difensore.</li></ul></div></details>`}

document.getElementById('app').addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t||t.disabled)return;
  if(t.dataset.menu){MENUOPEN=!MENUOPEN;render();return}
  if(t.dataset.start){startMatch();return}
  if(t.dataset.new){if(confirm('Iniziare una nuova partita?'))startMatch();return}
  if(t.dataset.confirmMove){const card=[...P(0).ants,...P(0).pigs,P(0).queen].find(c=>c.id===PENDING);if(card){PENDING=null;playMove(0,card)}return}
  if(t.dataset.cancelMove){PENDING=null;render();return}
  if(t.id==='formationDone'){confirmFormation();return}
  if(t.id==='beginTrick'){beginTrick();return}
  if(t.dataset.toggle){toggleSide(t.dataset.toggle);return}
  if(t.dataset.play){const card=legalMoves(0,G.step).find(c=>c.id===t.dataset.play);if(card){if(OPT.undo){PENDING=card.id;render()}else playMove(0,card)}}
});
document.getElementById('app').addEventListener('change',e=>{
  if(e.target.id==='optA11y'){OPT.a11y=e.target.checked;try{localStorage.setItem('ants-a11y',OPT.a11y?'1':'0')}catch(err){}render();return}
  if(e.target.id!=='optUndo')return;
  OPT.undo=e.target.checked;try{localStorage.setItem('ants-undo',OPT.undo?'1':'0')}catch(err){}
  if(!OPT.undo&&PENDING){const card=[...P(0).ants,...P(0).pigs,P(0).queen].find(c=>c.id===PENDING);PENDING=null;if(card){playMove(0,card);return}}
  render();
});
document.getElementById('app').addEventListener('toggle',e=>{if(e.target.matches&&e.target.matches('details.log'))LOGOPEN=e.target.open},true);
document.addEventListener('click',e=>{if(MENUOPEN&&!e.target.closest('.menu-wrap')){MENUOPEN=false;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&MENUOPEN){MENUOPEN=false;render()}});
render();
</script>
</body>
</html>
