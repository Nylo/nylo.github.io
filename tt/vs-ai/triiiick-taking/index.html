<style>

.recap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}

.rchip.k0{background-color:var(--k0)} .rchip.k1{background-color:var(--k1)} .rchip.k2{background-color:var(--k2)} .rchip.k3{background-color:var(--k3)}
details.rules{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
details.rules summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--text-soft);letter-spacing:0.05em}

@media(max-width:600px){
  :root{--cw:30px;--ch:44px}

  .fc.mini i{font-size:10px}

<body>
<div class="app" id="app"></div>

<script>
// ═════════════════════════ COSTANTI ═════════════════════════
const SUITS = [
  {n:'Rosso', icon:'circle'},
  {n:'Blu',   icon:'square'},
  {n:'Verde', icon:'triangle'},
  {n:'Nero',  icon:'moon'}
];
const BLACK = 3;
const POS = {3:['bottom','left','right'], 4:['bottom','left','top','right']};
const NAMES = ['Tu','AI Corvo','AI Gufo','AI Merlo'];
const SEATC = ['#ffd166','#ff8fb8','#6ee7b7','#8ecbff'];
const HUM = 0;
const HAND = 8;
const ico = n => `<i class="ph-fill ph-${n}"></i>`;
function deckFor(n){ const d=[]; for(let s=0;s<4;s++){ if(n===3&&s===2) continue; for(let v=1;v<=8;v++) d.push({s,v}); } return d; }
function tokensFor(n,rider){
  const t=(n===3?[1,2,2,3,3,4]:[1,2,2,2,3,3]).slice();
  if(rider){ t[t.indexOf(2)]='R'; }
  return t;
}

// ═════════════════════════ UTILITÀ ═════════════════════════
const rnd = n => Math.floor(Math.random()*n);
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const ABORT = {abort:true};
let G = null, PR = null;
const OPT = {undo:true,a11y:false};
try{ const s=localStorage.getItem('tk-undo'); if(s!==null) OPT.undo=s==='1'; OPT.a11y=localStorage.getItem('tk-a11y')==='1'; }catch(e){}
const delay = ms => new Promise(r=>setTimeout(r,ms));
async function sleep(ms){ const g=G; await delay(ms); if(g!==G) throw ABORT; }
const P = i => G.pl[i];
function logMsg(t){ G.log.unshift(t); if(G.log.length>900) G.log.pop(); render(); }
function status(t){ G.msg=t; render(); }
const cname = c => `${SUITS[c.s].n} ${c.v}`;
const plu = (n,s,p) => `${n} ${n===1?s:p}`;
const sortHand = h => h.sort((a,b)=>a.s-b.s||a.v-b.v);
const key = c => c.s+'-'+c.v;
const cnt = p => G.S.priv[p].length+G.S.pub[p].length;
const tokStr = t => t==='R'?'Rider':String(t);

// ═════════════════════════ INTERAZIONE ═════════════════════════
async function ask(p,title,options){
  const ok=options.filter(x=>!x.disabled);
  if(!ok.length) return null;
  if(p!==HUM) return ok[rnd(ok.length)].value;
  const g=G;
  return new Promise((res,rej)=>{ PR={type:'choose',title,options,res,rej}; render(); }).then(v=>{ if(g!==G) throw ABORT; return v; });
}
function answer(i){
  if(!PR||PR.type!=='choose') return;
  const o=PR.options[i]; if(!o||o.disabled) return;
  const r=PR.res; PR=null; render(); r(o.value);
}

// ═════════════════════════ PRESE (funzioni pure) ═════════════════════════
const ks = c => c.s===BLACK?100+c.v:c.v;
// a batte b? (lead = seme di apertura)
function beat(a,b,lead){
  if(a.s===BLACK) return b.s!==BLACK||a.v>b.v;
  if(b.s===BLACK) return false;
  if(a.s===lead) return b.s!==lead||a.v>b.v;
  return false;
}
function winIdx(tr){
  const lead=tr[0].c.s; let bi=0;
  for(let i=1;i<tr.length;i++) if(beat(tr[i].c,tr[bi].c,lead)) bi=i;
  return bi;
}
function legalOf(hand,trick){
  if(!trick.length) return hand.slice();
  const f=hand.filter(c=>c.s===trick[0].c.s);
  return f.length?f:hand.slice();
}
// stima della probabilità che una carta vinca una presa
function pw(c,n){
  if(c.s===BLACK) return 0.1+0.8*Math.pow((c.v-1)/7,1.5);
  return (n===3?0.5:0.4)*Math.pow((c.v-1)/7,3);
}
const avgP = n => { const d=deckFor(n); return d.reduce((a,c)=>a+pw(c,n),0)/d.length; };
const AVG = {3:avgP(3),4:avgP(4)};
function estOf(cards,n){ return cards.reduce((a,c)=>a+pw(c,n),0)+(HAND-cards.length)*AVG[n]; }
function scoreRound(tok,won){
  const n=tok.length, pts=Array(n).fill(0);
  let succ=0;
  for(let p=0;p<n;p++) if(tok[p]!=='R'){ pts[p]=-Math.abs(tok[p]-won[p]); if(pts[p]===0) succ++; }
  for(let p=0;p<n;p++) if(tok[p]==='R') pts[p]=-succ;
  return pts;
}

// ═════════════════════════ AI: PRESE (determinizzazione + rollout) ═════════════════════════
function pol(X,p){
  const h=X.hands[p], L=legalOf(h,X.trick);
  if(L.length===1) return L[0];
  if(X.tg[p]==null) return L[rnd(L.length)];
  const need=X.tg[p]-X.won[p], r=h.length;
  const want=need>0&&(need>=r||Math.random()<need/r);
  L.sort((a,b)=>ks(a)-ks(b));
  if(!X.trick.length) return want?L[L.length-1]:L[0];
  const lead=X.trick[0].c.s, best=X.trick[winIdx(X.trick)].c;
  const wins=L.filter(c=>beat(c,best,lead)), loses=L.filter(c=>!beat(c,best,lead));
  if(want) return wins.length?wins[0]:loses[0];
  return loses.length?loses[loses.length-1]:wins[0];
}
function simRest(X){
  for(;;){
    while(X.trick.length<X.n){
      const p=X.next, c=pol(X,p);
      X.hands[p]=X.hands[p].filter(x=>x!==c);
      X.trick.push({p,c}); X.next=(p+1)%X.n;
    }
    const w=X.trick[winIdx(X.trick)].p; X.won[w]++; X.trick=[]; X.next=w;
    if(X.hands.every(h=>!h.length)) break;
  }
}
function tokenPool(p){
  const S=G.S, pool=tokensFor(G.n,G.rider);
  const rm=t=>{ const i=pool.indexOf(t); if(i>=0) pool.splice(i,1); };
  rm(S.tok[p]); S.removed.forEach(rm);
  return pool;
}
function sampleWorld(p,pool){
  const S=G.S, n=G.n;
  const unknown=deckFor(n).filter(c=>{
    if(S.priv[p].concat(S.pub[p]).some(x=>x.s===c.s&&x.v===c.v)) return false;
    for(let q=0;q<n;q++) if(q!==p&&S.pub[q].some(x=>x.s===c.s&&x.v===c.v)) return false;
    return !S.played.some(x=>x.s===c.s&&x.v===c.v);
  });
  const opp=[]; for(let q=0;q<n;q++) if(q!==p) opp.push(q);
  let hands=null;
  for(let att=0;att<40&&!hands;att++){
    const U=shuffle(unknown.slice()), hs=[], strict=att<30;
    shuffle(opp);
    let ok=true;
    for(const q of opp){
      const need=S.priv[q].length, take=[];
      for(let i=0;i<U.length&&take.length<need;i++) if(!strict||!S.void[q].has(U[i].s)) take.push(i);
      if(take.length<need){ ok=false; break; }
      hs[q]=take.map(i=>U[i]); take.slice().reverse().forEach(i=>U.splice(i,1));
    }
    if(ok) hands=hs;
  }
  const H=[]; for(let q=0;q<n;q++) H[q]=q===p?S.priv[p].concat(S.pub[p]):S.pub[q].concat(hands[q]);
  const tg=Array(n).fill(null), tp=shuffle(pool.slice());
  tg[p]=S.tok[p]==='R'?null:S.tok[p];
  for(const q of opp){ const t=tp.pop(); tg[q]=t==='R'?null:t; }
  return {H,tg};
}
function aiPlay(p){
  const S=G.S, n=G.n, mine=S.priv[p].concat(S.pub[p]), L=legalOf(mine,S.trick);
  if(L.length===1) return L[0];
  const pool=tokenPool(p), NS=n===3?70:50, sums=L.map(()=>0);
  for(let s=0;s<NS;s++){
    const w=sampleWorld(p,pool);
    L.forEach((c,i)=>{
      const X={n,hands:w.H.map(h=>h.slice()),tg:w.tg,won:S.won.slice(),trick:S.trick.slice(),next:p};
      X.hands[p]=X.hands[p].filter(x=>x!==c&&!(x.s===c.s&&x.v===c.v));
      X.trick.push({p,c}); X.next=(p+1)%n;
      simRest(X);
      const pts=scoreRound(w.tg.map((t,q)=>q===p?S.tok[p]:(t===null?'R':t)),X.won);
      sums[i]+=pts[p];
    });
  }
  let bi=0; sums.forEach((v,i)=>{ if(v>sums[bi]+1e-9) bi=i; });
  return L[bi];
}

// ═════════════════════════ AI: PIANIFICAZIONE ═════════════════════════
function handAll(p){ return G.S.priv[p].concat(G.S.pub[p]); }
function wantDir(p){ // +1 vuole carte forti, −1 vuole carte deboli
  const S=G.S, t=S.tok[p];
  if(t==='R') return 1;
  return t>=estOf(handAll(p),G.n)?1:-1;
}
function aiKeep(p,c){
  const d=wantDir(p), a=AVG[G.n], x=pw(c,G.n);
  return d>0?x>=a:x<=a;
}
function aiDraftAct(p){
  const S=G.S, n=G.n, d=wantDir(p), a=AVG[n];
  let bi=-1, bg=-1e9;
  S.market.forEach((c,i)=>{ const g=d*(pw(c,n)-a); if(g>bg){ bg=g; bi=i; } });
  if(!S.deck.length) return {t:'B',i:bi};
  if(bi>=0&&bg>0.07) return {t:'B',i:bi};
  return {t:'A'};
}
function aiNeg(p){
  const S=G.S, t=S.tok[p];
  if(S.neg||t==='R'||!S.aside.length) return false;
  const est=estOf(handAll(p),G.n);
  const pool=tokenPool(p).filter(x=>x!=='R');
  if(!pool.length) return false;
  const cur=-Math.abs(t-est), exp=pool.reduce((a,x)=>a-Math.abs(x-est),0)/pool.length;
  return exp-cur>0.4;
}

// ═════════════════════════ PARTITA ═════════════════════════
function toSetup(){ if(PR){ const r=PR.rej; PR=null; r(ABORT); } G=null; render(); }
function newMatch(n,rider){
  if(PR){ const r=PR.rej; PR=null; r(ABORT); }
  G={n,rider:!!rider,round:0,first0:rnd(n),first:0,msg:'',log:[],over:null,show:null,turn:-1,S:null,
     pl:Array.from({length:n},(_,i)=>({id:i,name:NAMES[i],total:0,hist:[]}))};
  run();
}
function deal(){
  const n=G.n, d=shuffle(deckFor(n));
  let t=shuffle(tokensFor(n,G.rider));
  if(G.rider){ const ri=t.indexOf('R'); if(ri>=n){ const j=rnd(n); [t[ri],t[j]]=[t[j],t[ri]]; } }
  const S={tok:t.slice(0,n),aside:t.slice(n),removed:[],neg:false,deck:d,market:[],
    priv:Array.from({length:n},()=>[]),pub:Array.from({length:n},()=>[]),trick:[],lead:G.first,won:Array(n).fill(0),
    void:Array.from({length:n},()=>new Set()),played:[],phase:'draft',started:false,done:0};
  for(let p=0;p<n;p++) S.priv[p]=sortHand(d.splice(0,2));
  G.S=S;
}
async function draftTurn(p){
  const S=G.S, N=cnt(p), nm=P(p).name;
  let act;
  if(p===HUM) act=await humanDraft(); else { await sleep(750); act=aiDraftAct(p); }
  if(act.t==='B'){
    const c=S.market.splice(act.i,1)[0]; S.pub[p].push(c);
    logMsg(`${nm} prende ${cname(c)} dal Mercato e lo mette nella Mano Pubblica.`);
  }else{
    const c=S.deck.shift();
    const canRej=N<=6&&S.deck.length>=2;
    let keep=true;
    if(canRej) keep=p===HUM?await humanKeep(c):aiKeep(p,c);
    if(keep){ S.priv[p].push(c); logMsg(p===HUM?`Peschi ${cname(c)} e lo tieni nella Mano Privata.`:`${nm} pesca una carta e la tiene nella Mano Privata.`); }
    else{
      S.market.push(c);
      const a=S.deck.shift(), b=S.deck.shift();
      let pv,pb;
      if(p===HUM){ pv=await humanSplit(a,b); pb=pv===a?b:a; }
      else{ const d=wantDir(p); pv=d*pw(a,G.n)>=d*pw(b,G.n)?a:b; pb=pv===a?b:a; }
      S.priv[p].push(pv); S.pub[p].push(pb);
      logMsg(p===HUM?`Scarti ${cname(c)} nel Mercato, pesci ${cname(pv)} (privata) e ${cname(pb)} (pubblica).`
        :`${nm} scarta ${cname(c)} nel Mercato, pesca altre 2 carte: una nella Mano Privata e ${cname(pb)} nella Mano Pubblica.`);
    }
  }
  sortHand(S.priv[p]); sortHand(S.pub[p]);
  if(N<HAND&&cnt(p)===HAND) await negotiate(p);
}
async function negotiate(p){
  const S=G.S;
  if(S.neg||S.tok[p]==='R'||!S.aside.length) return;
  let yes;
  if(p===HUM) yes=await ask(HUM,`Hai raggiunto 8 carte: Negoziazione con i Dirigenti? (obiettivo attuale: ${tokStr(S.tok[HUM])} prese)`,[
    {label:'Negozia: rivela il segnalino e pescane uno nuovo',value:true},{label:'Tieni la Direttiva',value:false}]);
  else yes=aiNeg(p);
  if(!yes) return;
  S.neg=true;
  const old=S.tok[p]; S.removed.push(old);
  S.tok[p]=S.aside.splice(rnd(S.aside.length),1)[0];
  logMsg(`${P(p).name} negozia: rivela il segnalino ${tokStr(old)} (rimosso dal gioco) e ne pesca uno nuovo${p===HUM?`: il tuo obiettivo è ora ${tokStr(S.tok[HUM])}`:''}.`);
}
async function draft(){
  const S=G.S, n=G.n;
  S.phase='draft';
  while(P(0)&&Array.from({length:n},(_,p)=>cnt(p)).some(c=>c<HAND)){
    for(let k=0;k<n;k++){
      const p=(G.first+k)%n;
      if(cnt(p)>=HAND) continue;
      G.turn=p; status(p===HUM?'Tocca a te: pianificazione.':`Tocca a ${P(p).name}.`);
      await draftTurn(p);
    }
  }
  G.turn=-1;
}
function playCard(p,c){
  const S=G.S;
  let i=S.priv[p].findIndex(x=>x.s===c.s&&x.v===c.v);
  if(i>=0) S.priv[p].splice(i,1); else { i=S.pub[p].findIndex(x=>x.s===c.s&&x.v===c.v); S.pub[p].splice(i,1); }
  if(S.trick.length&&c.s!==S.trick[0].c.s) S.void[p].add(S.trick[0].c.s);
  S.trick.push({p,c}); S.played.push(c);
}
async function playRound(){
  const S=G.S, n=G.n;
  S.phase='play'; S.started=true;
  while(S.done<HAND){
    S.trick=[]; S.lastWin=-1;
    logMsg(`Presa ${S.done+1}: apre ${P(S.lead).name}.`);
    for(let k=0;k<n;k++){
      const p=(S.lead+k)%n; G.turn=p;
      status(p===HUM?'Tocca a te: gioca una carta.':`Tocca a ${P(p).name}.`);
      let c;
      if(p===HUM) c=await humanPlay(); else { await sleep(800); c=aiPlay(p); }
      playCard(p,c);
      logMsg(`${P(p).name} gioca ${cname(c)}.`);
    }
    G.turn=-1;
    const wi=winIdx(S.trick), w=S.trick[wi].p;
    S.won[w]++; S.lastWin=wi;
    logMsg(`${P(w).name} vince la presa ${S.done+1} con ${cname(S.trick[wi].c)}.`);
    status(`${P(w).name} vince la presa e apre la prossima.`);
    await sleep(1500);
    S.done++; S.lead=w;
  }
  S.trick=[]; S.lastWin=-1;
}
async function scoring(){
  const S=G.S, pts=scoreRound(S.tok,S.won);
  const rows=pts.map((v,p)=>({p,tok:S.tok[p],won:S.won[p],pts:v}));
  rows.forEach(r=>{ P(r.p).total+=r.pts; P(r.p).hist.push(r.pts); });
  G.show={rows};
  rows.forEach(r=>logMsg(`Round ${G.round+1}: ${P(r.p).name} — Direttiva ${tokStr(r.tok)}${r.tok==='R'?'':`, prese ${r.won}`}: ${r.pts} punti.`));
  status(`Round ${G.round+1} concluso: ecco i rapporti.`);
  const last=G.round===G.n-1;
  await ask(HUM,'Rapporto del round',[{label:last?'Vedi il risultato finale':'Avanti',value:1}]);
  G.show=null;
}
async function run(){
  const g=G;
  try{
    for(let r=0;r<g.n;r++){
      g.round=r; g.first=(g.first0+r)%g.n;
      deal();
      logMsg(`— Round ${r+1}/${g.n}: primo giocatore ${P(g.first).name} —`);
      const t=g.S.tok[HUM];
      status(t==='R'?'Sei il RIDER: nessun obiettivo, sabota gli altri.':`La tua Direttiva: vincere ${t} ${t===1?'presa':'prese'}.`);
      await ask(HUM,t==='R'?'Sei il Rider! Ottieni −1 per ogni avversario che completa la sua Direttiva':`Il tuo obiettivo: ${plu(t,'presa','prese')}. Primo giocatore: ${P(g.first).name}`,[{label:'Ok, si parte',value:1}]);
      await draft();
      await playRound();
      await scoring();
    }
    const m=Math.max(...g.pl.map(p=>p.total));
    g.over={winners:g.pl.filter(p=>p.total===m).map(p=>p.id)};
    render();
  }catch(e){
    if(e===ABORT||g!==G) return;
    console.error(e); G.log.unshift('Errore: '+e.message); render();
  }
}

const mini = c => kface(c,'mini');
function humanDraft(){
  const S=G.S, N=cnt(HUM), opts=[];
  opts.push({html:`${ico('stack')} Pesca dal mazzo (${S.deck.length})`,value:{t:'A'},disabled:!S.deck.length});
  S.market.forEach((c,i)=>opts.push({html:`${mini(c)} Prendi dal Mercato (Mano Pubblica)`,value:{t:'B',i}}));
  return ask(HUM,`Pianificazione (${N}/8 carte): pesca dal mazzo oppure prendi dal Mercato`,opts);
}
function humanKeep(c){
  return ask(HUM,'Hai pescato questa carta',[
    {html:`${mini(c)} Tienila nella Mano Privata`,value:true},
    {html:`${mini(c)} Mettila nel Mercato e pesca altre 2 carte`,value:false}]);
}
function humanSplit(a,b){
  return ask(HUM,'Hai pescato 2 carte: una va nella Mano Privata, l\'altra nella Mano Pubblica',[
    {html:`${mini(a)} Privata (e ${cname(b)} pubblica)`,value:a},
    {html:`${mini(b)} Privata (e ${cname(a)} pubblica)`,value:b}]);
}
function humanPlay(){
  const S=G.S, g=G, L=legalOf(handAll(HUM),S.trick);
  return new Promise((res,rej)=>{ PR={type:'play',legal:new Set(L.map(key)),sel:null,res,rej}; render(); }).then(v=>{ if(g!==G) throw ABORT; return v; });
}
function pickCard(k){
  if(!PR||PR.type!=='play'||!PR.legal.has(k)) return;
  if(!OPT.undo){ finishPlay(k); return; }
  PR.sel=PR.sel===k?null:k; render();
}
function finishPlay(k){
  if(!PR||PR.type!=='play'||!PR.legal.has(k)) return;
  const c=handAll(HUM).find(x=>key(x)===k), r=PR.res; PR=null; render(); r(c);
}

<p>Una volta per round, solo 1 giocatore (il primo che ci arriva), nel momento esatto in cui raggiunge 8 carte, può cambiare la sua Direttiva: rivela il segnalino attuale, lo rimuove dal gioco e ne pesca uno a caso tra quelli messi da parte.</p>
<h4>Fase 4 · Esecuzione</h4>
<p>Il primo giocatore apre la prima presa; chi vince la presa apre la successiva. Si può giocare da Mano Privata e Pubblica. Devi rispondere al seme di apertura se puoi, altrimenti giochi qualsiasi carta. Si giocano 8 prese. Se c'è almeno una carta Nera (<b>briscola permanente</b>) vince la Nera più alta; altrimenti vince la carta più alta del seme d'apertura. Le prese vinte formano pile coperte, visibili a tutti.</p>
<h4>Fase 5 · Rapporto</h4>
<p>Si rivelano i segnalini e si confrontano con le prese vinte: <b>−1 punto per ogni presa di differenza</b>, in più o in meno. Si continua finché ognuno è stato primo giocatore una volta. Vince chi ha il punteggio più vicino a 0; in caso di pareggio la vittoria è condivisa.</p>
<h4>Mini-espansione: «I giocatori di prese vogliono essere dei Rider» (4 giocatori)</h4>
<p>Un segnalino «2» è sostituito dal Rider. Chi lo riceve non può negoziare e non ha un obiettivo di prese: ottiene −1 punto per ogni avversario che completa con successo la sua Direttiva. Le sue prese non contano.</p>
<p><i>Interpretazioni nell'app:</i> il segnalino Rider viene sempre assegnato a un giocatore (mai messo da parte). Le AI non vedono le tue carte private né la tua Direttiva; deducono i segnalini possibili da quelli rimossi con la Negoziazione e dai vuoti di seme.</p>
</div></details>`;

let LOGOPEN=false;
function logHtml(){
  return `<details class="log" ${LOGOPEN?'open':''}><summary>LOG DELLA PARTITA (${G.log.length})</summary><div class="logbody">${G.log.map(l=>`<div>${esc(l)}</div>`).join('')}</div></details>`;
}
document.getElementById('app').addEventListener('toggle',e=>{ if(e.target.matches&&e.target.matches('details.log')) LOGOPEN=e.target.open; },true);
let MENUOPEN=false;
function menuHtml(){
  return `<div class="menu-wrap"><button class="hamb" type="button" data-menu="1" aria-label="Opzioni" aria-expanded="${MENUOPEN}"><svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 1h16M1 7h16M1 13h16"/></svg></button>
    ${MENUOPEN?`<div class="menu-pop">
      <label class="opt-toggle" title="Chiede conferma prima di giocare la carta"><input type="checkbox" id="optUndo" ${OPT.undo?'checked':''}> Abilita annulla</label>
      <label class="opt-toggle" title="Aggiunge una filigrana ai colori per distinguerli senza i colori"><input type="checkbox" id="optA11y" ${OPT.a11y?'checked':''}> Modalità accessibile</label>
    </div>`:''}</div>`;
}
function render(){
  document.body.classList.toggle('a11y',OPT.a11y);
  const app=document.getElementById('app');
  const top=`<div class="topbar"><div class="logo">Triiiick Taking</div>
    ${window.nyloBackBtn?nyloBackBtn():""}${nyloHomeBtn()}
    ${G&&!G.over?`<span class="badge">Round ${Math.min(G.round+1,G.n)}/${G.n}</span>`:''}
    ${G?`<button class="btn btn-sm" data-new="1">Nuova partita</button>`:''}
    ${menuHtml()}</div>`;
  let body='';
  if(G&&G.S){
    const pos=POS[G.n];
    body=`${goalHtml()}
      <div class="table">${centerHtml()}${G.pl.map((p,i)=>seatHtml(i,pos[i])).join('')}</div>
      ${G.pl.some(p=>p.hist.length)?`<div class="dock" style="position:static">${scoreTable()}</div>`:''}
      ${logHtml()}
      ${recapHtml()}
      ${RULES_HTML}`;
  }
  app.innerHTML=top+`<div class="dock">${dockHtml()}</div>`+body;
}

function askName(n,rider){
  try{ if(localStorage.getItem('nylo-skip-name')==='1'){ NAMES[0]=localStorage.getItem('nylo-player-name')||'Nylo'; newMatch(n,rider); return; } }catch(e){}
  let ov=document.getElementById('nameModal');
  if(!ov){ ov=document.createElement('div'); ov.id='nameModal'; ov.className='name-modal'; document.body.appendChild(ov); }
  let saved=''; try{ saved=localStorage.getItem('nylo-player-name')||''; }catch(e){}
  ov.innerHTML='<form class="name-box"><h3>Come ti chiami?</h3><p>Il tuo nome sostituirà «Tu» al tavolo.</p><input id="nameInput" maxlength="16" placeholder="Il tuo nome" autocomplete="off" value="'+esc(saved)+'"><div class="opts"><button class="opt" type="submit">Inizia la partita</button><button class="opt" type="button" data-cancel="1">Annulla</button></div></form>';
  ov.style.display='flex';
  const closeName=()=>{ ov.style.display='none'; };
  ov.onclick=e=>{ if(e.target===ov||e.target.hasAttribute('data-cancel')) closeName(); };
  ov.onkeydown=e=>{ if(e.key==='Escape') closeName(); };
  const f=ov.firstChild, inp=f.querySelector('input'); inp.focus(); inp.select();
  f.onsubmit=e=>{
    e.preventDefault();
    const v=inp.value.trim().slice(0,16)||'Tu';
    try{ localStorage.setItem('nylo-player-name',v); }catch(x){}
    NAMES[0]=v; ov.style.display='none'; newMatch(n,rider);
  };
}
document.getElementById('app').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||b.disabled) return;
  if(b.dataset.menu){ MENUOPEN=!MENUOPEN; render(); return; }
  if(b.dataset.n){ const n=Number(b.dataset.n), r=!!b.dataset.r; if(G) newMatch(n,r); else askName(n,r); }
  else if(b.dataset.new){ if(confirm('Iniziare una nuova partita?')) toSetup(); }
  else if(b.dataset.i!==undefined) answer(Number(b.dataset.i));
  else if(b.dataset.k!==undefined) pickCard(b.dataset.k);
  else if(b.dataset.ok!==undefined){ if(PR&&PR.type==='play'&&PR.sel) finishPlay(PR.sel); }
  else if(b.dataset.no!==undefined){ if(PR&&PR.type==='play'){ PR.sel=null; render(); } }
});
document.getElementById('app').addEventListener('change',e=>{
  if(e.target.id==='optA11y'){
    OPT.a11y=e.target.checked;
    try{ localStorage.setItem('tk-a11y',OPT.a11y?'1':'0'); }catch(err){}
    render(); return;
  }
  if(e.target.id!=='optUndo') return;
  OPT.undo=e.target.checked;
  try{ localStorage.setItem('tk-undo',OPT.undo?'1':'0'); }catch(err){}
  render();
});
document.addEventListener('click',e=>{ if(MENUOPEN&&!e.target.closest('.menu-wrap')){ MENUOPEN=false; render(); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&MENUOPEN){ MENUOPEN=false; render(); } });
render();

</script>
</body>
</html>
