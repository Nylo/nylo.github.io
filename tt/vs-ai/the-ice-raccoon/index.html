<!DOCTYPE html>
<html lang="it" data-home-inline>
<head>
<script src="/auth-gate.js"></script>
<script src="/home-btn.js"></script>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Ice Raccoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#e6f4f4;--surface:#f9ffff;--raised:#d8ebed;--ink:#172e37;--muted:#4b6870;--line:#b6d2d6;--ice:#1f8490;--ice-soft:#d0eeee;--violet:#8b59aa;--yellow:#e2af32;--gray:#59636a;--blue:#3985c1;--radius:9px;--cw:48px;--ch:68px}
html,body{min-height:100%;background:radial-gradient(ellipse at 50% -20%,#fff 0%,var(--bg) 62%,#d1e6e9 100%) fixed;color:var(--ink);font:14px 'Inter',sans-serif}
button{font:inherit;color:inherit}.app{max-width:980px;margin:0 auto;padding:10px 14px 40px}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 0 16px;flex-wrap:wrap}.logo{font:700 25px 'Playfair Display',serif;color:#205d68;flex:1;min-width:190px}.logo em{color:var(--violet);font-style:normal}
.btn{border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer;transition:background .15s,transform .12s}.btn:hover{background:var(--ice-soft)}.btn:active{transform:translateY(1px)}.btn.primary{background:var(--ice);color:white;border-color:var(--ice)}.btn.primary:hover{background:#176d77}.btn:disabled{opacity:.45;cursor:not-allowed}.btn-sm{padding:5px 10px;font-size:12px}.badge{background:var(--ice);color:#fff;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600;white-space:nowrap}
.opt-toggle{display:flex;align-items:center;gap:8px;padding:9px 10px;border:0;border-radius:6px;background:transparent;text-align:left;font-size:13px;font-weight:500;cursor:pointer}.opt-toggle:hover{background:var(--ice-soft)}.opt-toggle input{accent-color:var(--ice)}.menu-wrap{position:relative;margin-left:auto}.hamb{display:inline-flex;align-items:center;justify-content:center;width:34px;height:30px;border-radius:7px;background:transparent;color:var(--muted);border:1px solid var(--line);cursor:pointer}.hamb:hover{background:var(--ice-soft);color:var(--ink)}.menu-pop{position:absolute;right:0;top:calc(100% + 6px);z-index:30;min-width:220px;display:flex;flex-direction:column;gap:4px;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 10px 24px rgba(0,0,0,.2)}
.opts{display:flex;gap:8px;flex-wrap:wrap}.opt{background:var(--raised);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:8px 12px;font:600 12px 'Inter',sans-serif;cursor:pointer;text-align:left;transition:background .12s,border-color .12s}.opt:hover:not(:disabled){background:var(--ice-soft);border-color:var(--ice)}.opt:disabled{opacity:.4;cursor:not-allowed}.opt.primary{background:var(--ice);border-color:var(--ice);color:#fff}.opt.primary:hover:not(:disabled){background:#176d77}
.setup,.dock,.scoreboard,.table,.hand-panel,.log,details.rules{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 6px 20px rgba(37,89,97,.08)}
.setup{max-width:520px;margin:7vh auto;padding:26px;display:grid;gap:18px}.setup h1{font:700 28px 'Playfair Display',serif}.setup p{color:var(--muted);line-height:1.55}.setup label{font-size:12px;font-weight:700;color:var(--muted)}.setup select{display:block;width:100%;margin-top:7px;padding:10px;border:1px solid var(--line);border-radius:6px;background:white;color:var(--ink);font:inherit}
.dock{padding:12px 14px;margin-bottom:12px;border-top:4px solid var(--ice);display:flex;flex-direction:column;gap:8px}.dock strong{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}.dock p{line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap}
.scoreboard{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;overflow:hidden;margin-bottom:12px;background:var(--line)}.score{background:var(--surface);padding:10px 12px;min-width:0}.score.current{box-shadow:inset 0 3px var(--ice)}.score-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.score-data{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:5px;font-size:11px;color:var(--muted)}.score-data b{color:var(--ink);font-size:14px}
.table{position:relative;min-height:390px;padding:12px;margin-bottom:12px;display:grid;grid-template-columns:1fr 1.5fr 1fr;grid-template-areas:'. top .' 'left center right' 'bottom bottom bottom';gap:8px;align-items:center;background:radial-gradient(ellipse at center,#287d86 0%,#174b58 100%);border:0;color:white;overflow:hidden}
.seat{min-width:0;min-height:88px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-align:center;border:1px solid transparent;border-radius:8px}.seat.top{grid-area:top}.seat.left{grid-area:left}.seat.right{grid-area:right}.seat.bottom{grid-area:bottom}.seat.active{border-color:#f6d96a;background:rgba(255,255,255,.11)}.seat.winner{border-color:#88e8bd;background:rgba(136,232,189,.16)}.seat-name{font-weight:700;font-size:13px}.seat-info{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;align-items:center;font-size:11px}.tag{padding:2px 6px;border-radius:4px;background:rgba(0,0,0,.24);white-space:nowrap}.back-row{max-width:220px;display:flex;gap:3px;justify-content:center;flex-wrap:wrap}.back-card{width:20px;height:26px;border:1px solid #d5faff;border-radius:4px;background:linear-gradient(145deg,#8dd5d9,#286c7a);color:white;font-size:11px;font-weight:700;display:grid;place-items:center}.back-card.pick{cursor:pointer;box-shadow:0 0 0 2px #f6d96a}.back-card.pick:hover{transform:translateY(-3px);background:#ab7bc7}.forecast{font-size:11px;color:#fff4b1;font-weight:700}
.center{grid-area:center;min-height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}.center-note{font-size:11px;line-height:1.45;color:#d4eeee}.trick{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:70px;align-items:center}.card{width:var(--cw);height:var(--ch);border:2px solid rgba(255,255,255,.9);border-radius:7px;display:inline-flex;flex-direction:column;justify-content:center;align-items:center;position:relative;flex-shrink:0;color:#fff;font:700 23px 'Playfair Display',serif;box-shadow:0 3px 8px #082a32a0}.card small{position:absolute;top:3px;left:5px;font:700 10px 'Inter',sans-serif}.card .suit{font:14px 'Inter',sans-serif}.c0{background:var(--yellow);color:#322609}.c1{background:var(--violet)}.c2{background:var(--gray)}.c3{background:var(--blue)}button.card{cursor:pointer;transition:transform .12s,box-shadow .12s}button.card:hover:not(:disabled){transform:translateY(-7px)}button.card:disabled{cursor:default;opacity:.5}.card.legal{box-shadow:0 0 0 3px #f6d96a,0 3px 8px #082a32a0}.card.selected{transform:translateY(-6px);box-shadow:0 0 0 3px var(--ice)}body.a11y .card.c0{background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.17) 0 2px,transparent 2px 6px)}body.a11y .card.c1{background-image:radial-gradient(rgba(255,255,255,.38) 22%,transparent 24%);background-size:8px 8px}body.a11y .card.c2{background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.28) 0 2px,transparent 2px 6px)}body.a11y .card.c3{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.28) 0 2px,transparent 2px 7px)}.hand-panel{padding:12px;margin-bottom:12px}.hand-heading{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}.hand{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;min-height:var(--ch)}.chips{display:flex;gap:5px;flex-wrap:wrap}.chip{width:25px;height:25px;border:1px solid #9abac1;border-radius:50%;display:grid;place-items:center;background:#f9ffff;color:#33555d;font-size:11px;font-weight:700}.chip.used{opacity:.25;text-decoration:line-through}
.log{margin:12px 0;padding:10px 13px}.log summary,details.rules summary{cursor:pointer;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}.logbody{max-height:180px;overflow:auto;margin-top:8px;color:var(--muted);font-size:12px;line-height:1.65}.logbody div{border-top:1px solid #e3eeee;padding:3px 0}details.rules{padding:13px 15px;margin-top:12px}details.rules .rules-body{color:var(--muted);font-size:12px;line-height:1.6;padding-top:10px}details.rules h3{margin:12px 0 4px;color:#24636c;font-size:12px}details.rules ul{padding-left:18px}details.rules li{margin:3px 0}a{color:#216e9b}
@media(max-width:620px){:root{--cw:34px;--ch:50px}.app{padding:6px 9px 26px}.logo{font-size:21px}.table{min-height:335px;grid-template-columns:.9fr 1.3fr .9fr;padding:6px;gap:3px}.seat{padding:4px 2px;min-height:72px}.seat-name{font-size:11px}.back-card{width:16px;height:22px;font-size:10px}.center{min-height:112px}.card{font-size:17px;border-width:1px}.card small{font-size:8px}.card .suit{font-size:11px}.scoreboard{grid-template-columns:repeat(2,minmax(0,1fr))}.score{padding:8px}.hand{gap:3px}.setup{margin:4vh auto;padding:20px}}
button.back-card.selected{background:#a879c0;outline:2px solid #fff}
</style>
</head>
<body>
<main class="app" id="app"></main>
<script>
const SUITS=[{name:'Giallo',icon:'●',color:0},{name:'Viola',icon:'✿',color:1},{name:'Grigio',icon:'✦',color:2},{name:'Azzurro',icon:'◆',color:3}];
const NAMES=['Tu','AI Volpe','AI Gufo','AI Lupo'];
const POS={3:['bottom','left','right'],4:['bottom','left','top','right']};
const rnd=n=>Math.floor(Math.random()*n);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let G=null,PENDING=null,MENUOPEN=false,LOGOPEN=false;
const OPT={undo:true,a11y:false};
try{const u=localStorage.getItem('ice-raccoon-undo');if(u!==null)OPT.undo=u==='1';OPT.a11y=localStorage.getItem('ice-raccoon-a11y')==='1'}catch(e){}
function log(t){G.log.unshift(t);if(G.log.length>120)G.log.pop()}
const P=i=>G.players[i];

function startMatch(n){
  PENDING=null;
  G={n,round:0,dealer:rnd(n),phase:'piles',players:Array.from({length:n},(_,i)=>({id:i,name:NAMES[i],score:3,hand:[],forecast:null,chip:null,won:0})),log:[],piles:[],draw:[],chips:[],discardedChip:null,chooser:0,bidOrder:[],bidAt:0,leader:0,turn:0,trick:[],trickNo:0,roundRows:[]};
  beginRound();
}
function beginRound(){
  PENDING=null;
  const max=G.n===3?7:9,deck=[];
  for(let c=0;c<4;c++)for(let n=0;n<=max;n++)deck.push({c,n});
  shuffle(deck);
  G.piles=Array.from({length:G.n+1},(_,i)=>deck.slice(i*8,(i+1)*8));
  G.trick=[];G.trickNo=0;G.lastWinner=-1;
  G.players.forEach(p=>{p.hand=[];p.forecast=null;p.chip=null;p.won=0});
  let chips=G.n===3?[1,2,4]:[1,2,3,4];
  G.discardedChip=chips.splice(rnd(chips.length),1)[0];G.chips=chips.sort((a,b)=>a-b);
  G.chooser=0;G.phase='piles';log(`Round ${G.round+1}/${G.n}: ${P(G.dealer).name} è il mazziere e sceglie per primo.`);render();advancePileChoice();
}
function chooserId(){return (G.dealer+G.chooser)%G.n}
function advancePileChoice(){
  if(G.phase!=='piles')return;
  if(G.chooser>=G.n){G.draw=G.piles[0];G.piles=[];G.bidOrder=Array.from({length:G.n},(_,i)=>(G.dealer+i)%G.n);G.bidAt=0;G.phase='bid';log('Tutti hanno scelto una mano. Inizia la previsione: il numero sul retro è il pronostico.');render();advanceBid();return}
  if(chooserId()!==0){setTimeout(()=>{if(G&&G.phase==='piles'){const ix=rnd(G.piles.length);assignPile(chooserId(),ix)}},350)}
}
function assignPile(player,ix){
  if(G.phase!=='piles'||player!==chooserId()||!G.piles[ix])return;
  P(player).hand=G.piles.splice(ix,1)[0];G.chooser++;render();advancePileChoice();
}
function advanceBid(){
  if(G.phase!=='bid')return;
  if(G.bidAt>=G.n){G.phase='play';G.leader=G.dealer;G.turn=G.leader;G.trickNo=0;log('Previsioni complete. Si gioca la prima presa.');render();advancePlay();return}
  if(G.bidOrder[G.bidAt]!==0)setTimeout(()=>{if(G&&G.phase==='bid')aiBid(G.bidOrder[G.bidAt])},420);
}
function aiBid(player){
  const own=P(player).hand;
  const target=Math.max(0,Math.min(G.n===3?7:9,Math.round(own.filter(c=>c.c===1).length*1.1+own.filter(c=>c.n>=7).length*.65-1.6)));
  const options=[];
  G.players.forEach((p,owner)=>p.hand.forEach((card,index)=>options.push({owner,index,value:card.n})));
  options.sort((a,b)=>Math.abs(a.value-target)-Math.abs(b.value-target)+(a.owner===player?-0.12:0.12));
  placeForecast(player,options[0].owner,options[0].index);
}
function placeForecast(player,owner,index){
  if(G.phase!=='bid'||G.bidOrder[G.bidAt]!==player)return;
  PENDING=null;
  const card=P(owner).hand.splice(index,1)[0];
  P(player).forecast=card.n;
  const replacement=G.draw.shift();
  if(replacement)P(owner).hand.push(replacement);
  log(`${P(player).name} pronostica ${card.n} prese${owner===player?' con una propria carta':` usando una carta di ${P(owner).name}`}.`);
  if(card.n===0)awardChip(player);
  G.bidAt++;render();advanceBid();
}
function awardChip(player){
  if(P(player).chip!==null||!G.chips.length)return;
  P(player).chip=G.chips.shift();log(`${P(player).name} prende il chip ${P(player).chip}.`);
}
function legalCards(player){
  const hand=P(player).hand.map((_,i)=>i);if(!G.trick.length)return hand;
  const lead=G.trick[0].card.c,same=hand.filter(i=>P(player).hand[i].c===lead);return same.length?same:hand;
}
function wins(trick){
  const trump=trick.filter(x=>x.card.c===1),lead=trick[0].card.c,candidates=trump.length?trump:trick.filter(x=>x.card.c===lead);
  return candidates.reduce((best,x)=>x.card.n>best.card.n?x:best).player;
}
function aiPlay(player){
  const legal=legalCards(player),need=P(player).forecast-P(player).won;
  const ranked=legal.map(i=>{const card=P(player).hand[i],wouldWin=wins(G.trick.concat({player,card}))===player;return{i,card,wouldWin}});
  ranked.sort((a,b)=>need>0?(Number(b.wouldWin)-Number(a.wouldWin)||a.card.n-b.card.n):(Number(a.wouldWin)-Number(b.wouldWin)||b.card.n-a.card.n));
  playCard(player,ranked[0].i);
}
function advancePlay(){
  if(G.phase!=='play')return;
  if(G.turn!==0){setTimeout(()=>{if(G&&G.phase==='play')aiPlay(G.turn)},380)}
}
function playCard(player,index){
  if(G.phase!=='play'||G.turn!==player||!legalCards(player).includes(index))return;
  PENDING=null;
  const card=P(player).hand.splice(index,1)[0];G.trick.push({player,card});
  if(G.trick.length<G.n){G.turn=(player+1)%G.n;render();advancePlay();return}
  const winner=wins(G.trick);P(winner).won++;
  log(`${P(winner).name} vince la presa ${G.trickNo+1}.`);
  if(P(winner).won===P(winner).forecast)awardChip(winner);
  G.lastWinner=winner;G.phase='trick-end';render();
  setTimeout(()=>{
    if(!G||G.phase!=='trick-end')return;
    G.trickNo++;
    if(G.trickNo>=8){finishRound();return}
    G.leader=winner;G.turn=winner;G.trick=[];G.phase='play';render();advancePlay();
  },950);
}
function finishRound(){
  G.phase='score';
  G.players.forEach(p=>{const exact=p.won===p.forecast,delta=exact?2+(p.chip||0):-Math.abs(p.won-p.forecast);p.delta=delta;p.score+=delta;log(`${p.name}: previste ${p.forecast}, vinte ${p.won}, ${delta>0?'+':''}${delta} punti.`)});
  render();
}
function nextRound(){
  if(G.round+1>=G.n){G.phase='over';const best=Math.max(...G.players.map(p=>p.score));G.winners=G.players.filter(p=>p.score===best).map(p=>p.name);render();return}
  G.round++;G.dealer=(G.dealer+1)%G.n;beginRound();
}

function faceCard(card,player,index,legal){
  const suit=SUITS[card.c],selected=PENDING&&PENDING.kind==='play'&&PENDING.index===index;return `<button class="card c${card.c} ${legal?'legal':''} ${selected?'selected':''}" ${legal?'':'disabled'} data-play="${player}:${index}" aria-label="Gioca ${card.n} ${suit.name}"><small>${card.n}</small><span class="suit">${suit.icon}</span>${card.n}</button>`;
}
function playerSeat(player,pos){
  const p=P(player),active=(G.phase==='piles'&&chooserId()===player)||(G.phase==='bid'&&G.bidOrder[G.bidAt]===player)||(G.phase==='play'&&G.turn===player);
  const lead=G.phase==='play'&&G.trick.length&&G.trick[0].player===player;
  let cards='';
  if(G.phase==='bid')cards=p.hand.map((c,i)=>`<button class="back-card pick ${PENDING&&PENDING.kind==='bid'&&PENDING.owner===player&&PENDING.index===i?'selected':''}" data-bid="${player}:${i}" aria-label="Scegli carta con previsione ${c.n} dalla mano di ${esc(p.name)}">${c.n}</button>`).join('');
  else if(G.phase==='play'||G.phase==='trick-end')cards=p.hand.map(c=>`<span class="back-card" title="Numero visibile sul retro">${c.n}</span>`).join('');
  const forecast=p.forecast===null?'':`<span class="forecast">Previsione ${p.forecast}</span>`;
  return `<section class="seat ${pos} ${active?'active':''} ${G.lastWinner===player&&G.phase==='trick-end'?'winner':''}"><div class="seat-name">${esc(p.name)}${player===G.dealer?' · mazziere':''}</div><div class="seat-info"><span class="tag">${p.won} prese</span>${forecast}<span class="tag">${p.score} pt</span>${p.chip!==null?`<span class="tag">Chip ${p.chip}</span>`:''}${lead?'<span class="tag">mano</span>':''}</div><div class="back-row">${cards}</div></section>`;
}
function menuHtml(){return `<div class="menu-wrap"><button class="hamb" type="button" data-menu="1" aria-label="Opzioni" aria-expanded="${MENUOPEN}"><svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 1h16M1 7h16M1 13h16"/></svg></button>${MENUOPEN?`<div class="menu-pop"><label class="opt-toggle" title="Conferma una previsione o una carta prima di giocarla"><input type="checkbox" id="optUndo" ${OPT.undo?'checked':''}> Abilita annulla</label><label class="opt-toggle" title="Aggiunge trame per distinguere i colori senza affidarsi ai colori"><input type="checkbox" id="optA11y" ${OPT.a11y?'checked':''}> Modalità accessibile</label></div>`:''}</div>`}
function topbar(){return `<header class="topbar"><div class="logo">The Ice <em>Raccoon</em></div>${window.nyloBackBtn?nyloBackBtn():''}${nyloHomeBtn()}${G?`<span class="badge">${G.phase==='over'?'Partita conclusa':`Round ${G.round+1}/${G.n}`}</span><button class="btn btn-sm" data-new="1">Nuova partita</button>`:''}${menuHtml()}</header>`}
function confirmPending(){
  if(!PENDING||!G)return;
  const pending=PENDING;PENDING=null;
  if(pending.kind==='bid'&&G.phase==='bid'&&G.bidOrder[G.bidAt]===0)placeForecast(0,pending.owner,pending.index);
  else if(pending.kind==='play'&&G.phase==='play'&&G.turn===0)playCard(0,pending.index);
  else render();
}
function render(){
  const app=document.getElementById('app');document.body.classList.toggle('a11y',OPT.a11y);
  const top=topbar();
  if(!G){app.innerHTML=top+`<section class="dock"><strong>Gioco di prese · 3–4 giocatori</strong><p>Scegli la tua mano, predici le prese e raccogli i chip per salire sul podio.</p><label for="playerCount">Giocatori</label><select id="playerCount"><option value="3">3 giocatori</option><option value="4">4 giocatori</option></select><div class="opts"><button class="opt primary" data-start="1">Nuova partita</button></div></section>${rulesHtml()}`;return}
  const positions=POS[G.n];let dock='';
  if(PENDING){dock=PENDING.kind==='bid'?`<strong>Conferma previsione</strong><p>La carta selezionata prevede ${P(PENDING.owner).hand[PENDING.index].n} prese. ${PENDING.owner===0?'Viene sostituita dalla cima del mazzo.':`Viene presa dalla mano di ${esc(P(PENDING.owner).name)} e sostituita.`}</p><div class="opts"><button class="opt primary" data-confirm="1">Conferma</button><button class="opt" data-cancel="1">Annulla</button></div>`:`<strong>Conferma carta</strong><p>Vuoi giocare la carta selezionata?</p><div class="opts"><button class="opt primary" data-confirm="1">Conferma</button><button class="opt" data-cancel="1">Annulla</button></div>`}
  else if(G.phase==='piles')dock=`<strong>Scelta della mano · ${G.chooser+1}/${G.n}</strong><p>${chooserId()===0?'Scegli un mazzetto da 8 carte.':'Attendi la scelta della mano.'} Il mazzetto rimasto diventa il mazzo di pesca.</p>${chooserId()===0?`<div class="opts">${G.piles.map((_,i)=>`<button class="opt" data-pile="${i}">Mazzetto ${i+1} · 8 carte</button>`).join('')}</div>`:''}`;
  else if(G.phase==='bid')dock=`<strong>Previsione · ${G.bidAt+1}/${G.n}</strong><p>${G.bidOrder[G.bidAt]===0?'Scegli una carta fra le mani: il numero sul retro sarà la tua previsione. La carta scelta viene sostituita per chi la possedeva.':'Le AI stanno scegliendo le previsioni.'} ${G.chips.length?`Chip disponibili: ${G.chips.join(' · ')}.`:'Nessun chip disponibile.'}</p>`;
  else if(G.phase==='play')dock=`<strong>Round ${G.round+1}/${G.n} · Presa ${G.trickNo+1}/8</strong><p>${G.turn===0?'Gioca una carta. Devi seguire il colore iniziale se puoi.':'Turno di '+esc(P(G.turn).name)+'.'}</p><div class="chips">Chip sul tavolo: ${G.chips.map(c=>`<span class="chip">${c}</span>`).join('')||'nessuno'} ${G.discardedChip!==null?`<span class="chip used" title="Scartato a inizio round">${G.discardedChip}</span>`:''}</div>`;
  else if(G.phase==='trick-end')dock=`<strong>Presa ${G.trickNo+1}/8</strong><p>${esc(P(G.lastWinner).name)} vince la presa. La carta più alta viola è briscola; senza viola vince il numero più alto del colore iniziale.</p>`;
  else if(G.phase==='score')dock=`<strong>Fine round ${G.round+1}/${G.n}</strong><p>Previsione esatta: +2 punti e valore del chip raccolto. Altrimenti: perdita pari alla differenza.</p><div class="opts"><button class="opt primary" id="continue">${G.round+1===G.n?'Risultato finale':'Round successivo'}</button></div>`;
  else if(G.phase==='over')dock=`<strong>Partita conclusa</strong><p>${G.winners.length>1?'Pareggio tra':'Vince'} ${G.winners.map(esc).join(', ')}.</p>`;
  const seatMarkup=G.players.map((p,i)=>playerSeat(i,positions[i])).join('');
  const center=G.phase==='piles'?`<div class="center"><div class="center-note">${G.piles.length} mazzetti coperti<br>scegline uno</div></div>`:`<div class="center"><div class="trick">${G.trick.map(x=>`<div><div class="card c${x.card.c}"><small>${x.card.n}</small><span class="suit">${SUITS[x.card.c].icon}</span>${x.card.n}</div><small>${esc(P(x.player).name)}</small></div>`).join('')}</div><div class="center-note">${G.phase==='play'||G.phase==='trick-end'?`Presa ${Math.min(G.trickNo+1,8)} · ${G.trick.length}/${G.n} carte`:'The Ice Raccoon'}</div></div>`;
  const hand=G.phase==='play'&&G.turn===0?`<section class="hand-panel"><div class="hand-heading">La tua mano · scegli una carta legale</div><div class="hand">${P(0).hand.map((c,i)=>faceCard(c,0,i,legalCards(0).includes(i))).join('')}</div></section>`:'';
  const roundTable=G.phase==='score'||G.phase==='over'?`<div class="hand-panel"><div class="hand-heading">Punteggio del round</div><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr><th style="text-align:left;padding:7px">Giocatore</th><th>Previste</th><th>Vinte</th><th>Chip</th><th>Punti</th><th>Totale</th></tr></thead><tbody>${G.players.map(p=>`<tr><td style="padding:7px;border-top:1px solid var(--line)">${esc(p.name)}</td><td style="text-align:center;border-top:1px solid var(--line)">${p.forecast}</td><td style="text-align:center;border-top:1px solid var(--line)">${p.won}</td><td style="text-align:center;border-top:1px solid var(--line)">${p.chip??'—'}</td><td style="text-align:center;border-top:1px solid var(--line)">${p.delta>0?'+':''}${p.delta}</td><td style="text-align:center;border-top:1px solid var(--line)"><b>${p.score}</b></td></tr>`).join('')}</tbody></table></div></div>`:'';
  app.innerHTML=top+`<section class="dock">${dock}</section><section class="scoreboard">${G.players.map(p=>`<div class="score ${G.phase==='play'&&G.turn===p.id?'current':''}"><div class="score-name">${esc(p.name)}</div><div class="score-data"><b>${p.score}</b> punti · ${p.won} prese${p.forecast!==null?` · previste ${p.forecast}`:''}${p.chip!==null?` · chip ${p.chip}`:''}</div></div>`).join('')}</section><section class="table">${seatMarkup}${center}</section>${hand}${roundTable}<details class="log" ${LOGOPEN?'open':''}><summary>LOG DELLA PARTITA (${G.log.length})</summary><div class="logbody">${G.log.map(x=>`<div>${esc(x)}</div>`).join('')}</div></details>${rulesHtml()}`;
}
function rulesHtml(){return `<details class="rules"><summary>Regolamento</summary><div class="rules-body"><h3>Preparazione</h3><ul><li>Ogni giocatore parte da 3 punti. Si giocano 3 round in 3 o 4 round in 4.</li><li>In 3 si usano i numeri da 0 a 7 e si rimuove il chip 3; in 4 si usano tutti i numeri da 0 a 9. Si distribuiscono mazzetti da 8 carte e uno resta come mazzo di pesca.</li><li>All'inizio del round si mescolano i chip utilizzabili, se ne scarta uno e gli altri si dispongono in ordine crescente.</li></ul><h3>Previsione e prese</h3><ul><li>A turno scegli una carta da una qualsiasi mano senza guardare il fronte: il numero visibile sul retro è la previsione. Chi perde la carta pesca subito una sostituzione.</li><li>Con previsione 0 si prende subito il chip più basso disponibile. Si giocano 8 prese, seguendo il colore iniziale quando possibile.</li><li>Una carta viola vince su ogni altro colore; senza viola vince la carta più alta del colore iniziale. Chi raggiunge esattamente la propria previsione prende il chip più basso disponibile.</li></ul><h3>Punteggio</h3><ul><li>Previsione esatta: +2 punti più il valore del chip raccolto. Previsione errata: −1 per ogni presa di differenza; nessun bonus chip.</li><li>I cristalli bianchi valgono 1 punto e quelli blu 3; il punteggio digitale mostra il totale equivalente. Si parte da 3 punti.</li><li>Dopo un round il mazziere passa alla persona alla sua sinistra; vince il totale più alto, con pareggio condiviso.</li></ul><p style="margin-top:10px"><a href="https://www.youtube.com/watch?v=_-GNMmnAuTM" target="_blank" rel="noopener noreferrer">Video del gioco su YouTube ↗</a></p></div></details>`}

document.getElementById('app').addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t||t.disabled)return;
  if(t.dataset.menu){MENUOPEN=!MENUOPEN;render();return}
  if(t.dataset.start){startMatch(Number(document.getElementById('playerCount').value));return}
  if(t.dataset.new){if(confirm('Iniziare una nuova partita?'))startMatch(G.n);return}
  if(t.dataset.confirm){confirmPending();return}
  if(t.dataset.cancel){PENDING=null;render();return}
  if(t.id==='continue'){nextRound();return}
  if(t.dataset.pile!==undefined){assignPile(0,Number(t.dataset.pile));return}
  if(t.dataset.bid){const [owner,index]=t.dataset.bid.split(':').map(Number);if(G.phase==='bid'&&G.bidOrder[G.bidAt]===0){if(OPT.undo){PENDING={kind:'bid',owner,index};render()}else placeForecast(0,owner,index)}return}
  if(t.dataset.play){const [player,index]=t.dataset.play.split(':').map(Number);if(player===0&&G.phase==='play'&&G.turn===0){if(OPT.undo){PENDING={kind:'play',index};render()}else playCard(0,index)}}
});
document.getElementById('app').addEventListener('change',e=>{
  if(e.target.id==='optA11y'){OPT.a11y=e.target.checked;try{localStorage.setItem('ice-raccoon-a11y',OPT.a11y?'1':'0')}catch(err){}render();return}
  if(e.target.id!=='optUndo')return;
  OPT.undo=e.target.checked;try{localStorage.setItem('ice-raccoon-undo',OPT.undo?'1':'0')}catch(err){}
  if(!OPT.undo&&PENDING){confirmPending();return}
  render();
});
document.getElementById('app').addEventListener('toggle',e=>{if(e.target.matches&&e.target.matches('details.log'))LOGOPEN=e.target.open},true);
document.addEventListener('click',e=>{if(MENUOPEN&&!e.target.closest('.menu-wrap')){MENUOPEN=false;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&MENUOPEN){MENUOPEN=false;render()}});
render();
</script>
</body>
</html>
