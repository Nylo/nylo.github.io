<body>
<div class="app" id="app"></div>

<script>
// ═════════════════════════ COSTANTI ═════════════════════════
const SUITS = [
  {n:'Blu',    icon:'moon'},
  {n:'Rosso',  icon:'star-of-david'},
  {n:'Giallo', icon:'person-simple-run'},
  {n:'Grigio', icon:'diamond'}
];
const HUM = 0;
const BONUS = [1,2,3];                                  // bonus sopravvivenza dei 3 round
const POS = {4:['bottom','left','top','right'],5:['bottom','left','tl','tr','right']};
const NAMES = ['Tu','AI Ricercatore','AI Dott.','AI Agente','AI Professore'];
const ico = n => `<i class="ph-fill ph-${n}"></i>`;

// ═════════════════════════ UTILITÀ ═════════════════════════
const rnd = n => Math.floor(Math.random()*n);
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const ABORT = {abort:true};
let G = null, PR = null;
const OPT = {undo:true,a11y:false};
try{ const s=localStorage.getItem('os-undo'); if(s!==null) OPT.undo=s==='1'; OPT.a11y=localStorage.getItem('os-a11y')==='1'; }catch(e){}
const delay = ms => new Promise(r=>setTimeout(r,ms));
async function sleep(ms){ const g=G; await delay(ms); if(g!==G) throw ABORT; }
const P = i => G.pl[i];
function logMsg(t){ G.log.unshift(t); if(G.log.length>800) G.log.pop(); render(); }
function status(t){ G.msg=t; render(); }
const cname = c => `${SUITS[c.s].n} ${c.v}`;
const sg = v => (v>0?'+':'')+v;
const argmax = a => a.reduce((b,x,i)=>x>a[b]?i:b,0);

// ═════════════════════════ INTERAZIONE ═════════════════════════
async function ask(p,title,options){
  const ok=options.filter(x=>!x.disabled);
  if(!ok.length) return null;
  const g=G;
  return new Promise((res,rej)=>{ PR={type:'choose',title,options,res,rej}; render(); }).then(v=>{ if(g!==G) throw ABORT; return v; });
}
function askCard(legal,hint){
  const g=G;
  return new Promise((res,rej)=>{ PR={type:'card',legal:new Set(legal),hint,sel:null,res,rej}; render(); }).then(v=>{ if(g!==G) throw ABORT; return v; });
}
function answer(i){
  if(!PR||PR.type!=='choose') return;
  const o=PR.options[i]; if(!o||o.disabled) return;
  const r=PR.res; PR=null; render(); r(o.value);
}
function playIdx(i){
  if(!PR||PR.type!=='card'||!PR.legal.has(i)) return;
  if(OPT.undo){ PR.sel=i; render(); return; }
  const r=PR.res; PR=null; render(); r(i);
}
function confirmCard(ok){
  if(!PR||PR.type!=='card'||PR.sel==null) return;
  if(!ok){ PR.sel=null; render(); return; }
  const i=PR.sel, r=PR.res; PR=null; render(); r(i);
}

// ═════════════════════════ REGOLE (funzioni pure) ═════════════════════════
function fullDeck(){
  const d=[];
  for(let s=0;s<4;s++) for(let v=1;v<=13;v++) d.push({s,v,id:s*13+v-1});
  return d;
}
const sortHand = h => h.sort((a,b)=>a.s-b.s||a.v-b.v);
// lato vicino = seme della prima carta; lato opposto = primo seme diverso giocato (se c'è)
function suitsOf(plays){
  if(!plays.length) return {near:-1,other:-1};
  const near=plays[0].c.s;
  const o=plays.find(x=>x.c.s!==near);
  return {near,other:o?o.c.s:-1};
}
// finché non esiste il lato opposto si può giocare qualsiasi carta; poi, chi ha un seme tra vicino e opposto deve giocarne uno, altrimenti gioca ciò che vuole (non può vincere)
function legalIdx(h,plays){
  const all=h.map((_,i)=>i);
  const {near,other}=suitsOf(plays);
  if(near<0||other<0) return all;
  const ok=all.filter(i=>h[i].s===near||h[i].s===other);
  return ok.length?ok:all;
}
function resolve(plays){
  const {near,other}=suitsOf(plays);
  const best=s=>plays.filter(x=>x.c.s===s).reduce((b,x)=>x.c.v>b.c.v?x:b);
  return {nw:best(near),ow:other>=0?best(other):null};
}
// kaii > strutture = muore (−2); altrimenti +1 per kaii contenuto, −1 per struttura inutilizzata, più il bonus sopravvivenza
function roundScore(fac,kaii,rd){
  if(kaii>fac) return {dead:true,pts:-2};
  return {dead:false,pts:kaii-(fac-kaii)+BONUS[rd]};
}

// ═════════════════════════ AI ═════════════════════════
// Monte-Carlo con determinizzazione: le mani avversarie si campionano tra le carte non viste (comprese le carte tolte dal gioco), il resto del round si gioca a caso
const AIP = {S:16};
function unseen(me){
  const seen=new Set();
  P(me).hand.forEach(c=>seen.add(c.id));
  G.played.forEach(c=>seen.add(c.id));
  return fullDeck().filter(c=>!seen.has(c.id));
}
function sampleHands(me,pool){
  const pl=shuffle(pool.slice());
  return G.pl.map((p,i)=>i===me?p.hand.slice():pl.splice(0,p.hand.length));
}
function simPlayTrick(S,order,plays){
  for(const p of order){
    const h=S.hands[p], lg=legalIdx(h,plays);
    plays.push({p,c:h.splice(lg[rnd(lg.length)],1)[0]});
  }
}
function simResolve(S,plays){
  const r=resolve(plays);
  S.fac[r.nw.p]++;
  if(r.ow) S.kaii[r.ow.p]++;
  return r.nw.p;
}
function simRound(S,leader){
  const n=S.hands.length;
  while(S.hands[leader].length){
    const order=[]; for(let k=0;k<n;k++) order.push((leader+k)%n);
    const plays=[];
    simPlayTrick(S,order,plays);
    leader=simResolve(S,plays);
  }
}
function objective(S,me){
  const sc=S.fac.map((f,i)=>roundScore(f,S.kaii[i],G.round));
  let mine=sc[me].pts;
  if(sc[me].dead&&P(me).deaths>=1) mine-=8;               // seconda morte = eliminazione
  const oth=sc.filter((_,i)=>i!==me).map(x=>x.pts);
  return mine-oth.reduce((a,b)=>a+b,0)/oth.length;
}
function aiPickCard(p){
  const h=P(p).hand, lg=legalIdx(h,G.trick);
  if(lg.length===1) return lg[0];
  const pool=unseen(p), sc=lg.map(()=>0);
  const rest=G.order.slice(G.order.indexOf(p)+1);
  for(let s=0;s<AIP.S;s++){
    const hands=sampleHands(p,pool);
    lg.forEach((idx,j)=>{
      const S={hands:hands.map(x=>x.slice()),fac:G.pl.map(q=>q.fac),kaii:G.pl.map(q=>q.kaii)};
      const plays=G.trick.map(x=>({p:x.p,c:x.c}));
      plays.push({p,c:S.hands[p].splice(idx,1)[0]});
      simPlayTrick(S,rest,plays);
      simRound(S,simResolve(S,plays));
      sc[j]+=objective(S,p);
    });
  }
  return lg[argmax(sc)];
}

// ═════════════════════════ PARTITA ═════════════════════════
function toSetup(){ if(PR){ const r=PR.rej; PR=null; r(ABORT); } G=null; render(); }
function newMatch(n){
  if(PR){ const r=PR.rej; PR=null; r(ABORT); }
  G={n,round:0,leader:rnd(n),lastNear:0,msg:'',log:[],over:null,show:null,
     turn:-1,win:-1,oth:-1,trickNo:0,trick:[],order:[],played:[],
     pl:Array.from({length:n},(_,i)=>({id:i,name:NAMES[i],hand:[],fac:0,kaii:0,tot:0,deaths:0,elim:false,hist:[]}))};
  run();
}
function deal(){
  const deck=shuffle(fullDeck()), per=G.n===4?12:10;
  G.pl.forEach((p,i)=>{ p.hand=sortHand(deck.slice(i*per,(i+1)*per)); p.fac=0; p.kaii=0; });
  G.trick=[]; G.played=[]; G.win=-1; G.oth=-1; G.turn=-1; G.trickNo=0; G.order=[]; G.show=null;
}
function humanHint(){
  const {near,other}=suitsOf(G.trick), h=P(HUM).hand;
  if(near<0) return 'Sei di mano: la tua carta stabilisce il lato vicino (Nearside).';
  if(other<0) return `Lato vicino: ${SUITS[near].n}. Puoi giocare qualsiasi carta; un seme diverso diventerà il lato opposto (Otherside).`;
  if(h.some(c=>c.s===near||c.s===other)) return `Lato vicino ${SUITS[near].n}, lato opposto ${SUITS[other].n}: devi giocare uno di questi due semi (non c'è preferenza).`;
  return `Non hai né ${SUITS[near].n} né ${SUITS[other].n}: puoi giocare qualsiasi carta, ma non può vincere.`;
}
async function playRound(){
  const total=G.n===4?12:10;
  while(P(G.leader).hand.length){
    G.trickNo++; G.trick=[]; G.win=-1; G.oth=-1;
    G.order=[];
    for(let k=0;k<G.n;k++) G.order.push((G.leader+k)%G.n);
    for(const p of G.order){
      G.turn=p;
      const pl=P(p), lg=legalIdx(pl.hand,G.trick);
      status(`Presa ${G.trickNo}/${total} · di mano: ${P(G.leader).name}. Tocca a ${pl.name}.`);
      let idx;
      if(p===HUM) idx=await askCard(lg,humanHint()); else{ await sleep(650); idx=aiPickCard(p); }
      const c=pl.hand.splice(idx,1)[0];
      G.trick.push({p,c}); G.played.push(c);
      const s=suitsOf(G.trick);
      logMsg(`${pl.name} gioca ${cname(c)}${G.trick.length===1?' (lato vicino)':(c.s!==s.near&&c.s===s.other&&G.trick.filter(x=>x.c.s===s.other).length===1?' (lato opposto)':'')}.`);
    }
    G.turn=-1;
    const r=resolve(G.trick);
    G.win=r.nw.p; G.oth=r.ow?r.ow.p:-1;
    const nw=P(r.nw.p); nw.fac++;
    let m=`${nw.name} vince il lato vicino (${cname(r.nw.c)}) e prende una struttura.`;
    if(r.ow){
      const ow=P(r.ow.p); ow.kaii++;
      m+=` ${ow.name} vince il lato opposto (${cname(r.ow.c)}) e prende un Kaii${ow.kaii>ow.fac?' non contenuto!':' (contenuto).'}`;
    }else m+=' Nessun lato opposto: nessun Kaii.';
    status(m); logMsg(m);
    await sleep(1900);
    G.leader=r.nw.p; G.lastNear=r.nw.p;
  }
  G.turn=-1; G.win=-1; G.oth=-1;
}
async function scoreRound(){
  const rd=G.round;
  const rows=G.pl.map((p,i)=>{
    const r=roundScore(p.fac,p.kaii,rd);
    p.tot+=r.pts; p.hist.push(r.pts);
    if(r.dead){ p.deaths++; if(p.deaths>=2) p.elim=true; }
    const calc=r.dead?`${p.kaii} Kaii > ${p.fac} strutture`:`${p.kaii} − ${p.fac-p.kaii} + ${BONUS[rd]}`;
    return {p:i,fac:p.fac,kaii:p.kaii,dead:r.dead,elim:p.elim,pts:r.pts,calc,tot:p.tot,deaths:p.deaths};
  });
  G.show={rows};
  logMsg(`Round ${rd+1} concluso.`);
  rows.forEach(x=>logMsg(`${P(x.p).name}: ${x.fac} strutture, ${x.kaii} Kaii → ${x.dead?'MUORE':'sopravvive'} ${sg(x.pts)} (totale ${x.tot})${x.elim?' · eliminato (2ª morte)':''}.`));
  status(`Round ${rd+1} concluso.`);
  const end=rd>=2||G.pl.some(p=>p.elim);
  await ask(HUM,'Risultato del round',[{label:end?'Vedi il risultato finale':'Round successivo',value:1}]);
  G.show=null;
  return end;
}
function winners(){
  let c=G.pl.filter(p=>!p.elim);
  if(!c.length) c=G.pl;
  const mx=Math.max(...c.map(p=>p.tot));
  return c.filter(p=>p.tot===mx).map(p=>p.id);
}
async function run(){
  const g=G;
  try{
    for(let r=0;r<3;r++){
      g.round=r;
      if(r>0) g.leader=g.lastNear;
      deal();
      logMsg(`— Round ${r+1}/3 (bonus sopravvivenza +${BONUS[r]}): inizia ${P(g.leader).name} —`);
      status(g.leader===HUM?'Sei tu il primo giocatore.':`Primo giocatore: ${P(g.leader).name}.`);
      await ask(HUM,`Round ${r+1}/3: ${g.leader===HUM?'sei tu il primo giocatore':'primo giocatore: '+P(g.leader).name}`,[{label:'Ok, si parte',value:1}]);
      await playRound();
      if(await scoreRound()) break;
    }
    g.over={winners:winners()};
    render();
  }catch(e){
    if(e===ABORT||g!==G) return;
    console.error(e); G.log.unshift('Errore: '+e.message); render();
  }
}

function seatHtml(p,pos){
  const pl=P(p);

    hand=`<div class="hand">${pl.hand.map((c,i)=>{

  }else hand=`<div class="backs">${pl.hand.map(()=>'<span class="back"></span>').join('')}</div>`;
  const risk=pl.kaii>pl.fac;

  const meta=`<div class="seat-meta">
    <span class="tag" title="Strutture (prese del lato vicino)">${ico('lock')} <b>${pl.fac}</b></span>

  return `<div class="seat ${pos} ${isLeader?'leader':''} ${active?'active':''} ${winner?'winner':''} ${other?'other':''} ${pl.elim?'elim':''}">${inner}</div>`;
}
function centerHtml(){
  const {near,other}=suitsOf(G.trick);

function scoreTable(){

const RULES_HTML = `
<details class="rules paper hud"><summary>REGOLAMENTO</summary>
<div class="rtext">
<h4>Descrizione</h4>
<p>Otherside Trick è un gioco con 52 carte da gioco e 12 carte Kaii. In 4 giocatori ogni giocatore riceve 12 carte, in 5 giocatori 10 carte. Le carte non usate sono tolte dal gioco. Le carte Kaii si mettono in un mazzo al centro del tavolo con l'illustrazione del Kaii a faccia in su. Si sceglie il primo giocatore con un metodo qualsiasi.</p>
<h4>La presa</h4>
<p>Ogni giocatore gioca una carta dalla mano, a partire da chi guida e in senso orario. Ogni presa ha due vincitori: il vincitore del lato vicino (Nearside) e il vincitore del lato opposto (Otherside).</p>
<h4>Gioco delle carte</h4>
<p>Il seme della prima carta giocata diventa il <b>lato vicino (Nearside)</b>. I giocatori successivi possono giocare una carta del lato vicino o di un seme diverso. Quando viene giocato un seme diverso, quel seme diventa il <b>lato opposto (Otherside)</b>. <b>Nessuna presa può avere più di due semi.</b> Una volta stabilito il lato opposto, si può giocare il lato vicino oppure il lato opposto.</p>
<p><i>Avviso dell'amministratore:</i> possedere il seme del lato vicino non crea l'obbligo di giocarlo.</p>
<p>Se un giocatore non ha né il seme del lato vicino né quello del lato opposto, gioca una carta di un altro seme; quella carta non può vincere. Quando tutti hanno giocato una carta la presa finisce: si determinano i vincitori dei due lati.</p>
<h4>Vincitore del lato vicino</h4>
<p>Chi ha giocato la carta di grado più alto del lato vicino è il vincitore del lato vicino. Prende la presa e la mette davanti a sé con l'illustrazione del lucchetto a faccia in su: questo mazzetto si chiama <b>Struttura (Facility)</b>. Le strutture si tengono separate in modo da contarle facilmente. Il vincitore del lato vicino guida la presa successiva.</p>
<h4>Vincitore del lato opposto</h4>
<p>Chi ha giocato la carta di grado più alto del lato opposto è il vincitore del lato opposto. Prende una carta <b>Kaii</b> e la mette davanti a sé con l'illustrazione del Kaii a faccia in su. I Kaii si tengono separati in modo da contarli facilmente.</p>
<h4>Contenimento</h4>
<p>Ogni volta che un Kaii è abbinato a una struttura viene immediatamente <b>contenuto</b>: si mette la carta Kaii sopra una struttura con il lato «Contained» a faccia in su.</p>
<h4>Fine del round</h4>
<p>Il round finisce dopo che tutti hanno giocato la loro ultima carta. Se un giocatore possiede Kaii non contenuti, cioè più Kaii che strutture, <b>muore</b> e riceve −2 punti, qualunque sia il risultato. I giocatori che sopravvivono segnano:</p>
<table><tr><td>Kaii contenuto</td><td>+1 punto ciascuno</td></tr>
<tr><td>Struttura inutilizzata</td><td>−1 punto ciascuna</td></tr>
<tr><td>Bonus sopravvivenza</td><td>Round 1: +1 · Round 2: +2 · Round 3: +3</td></tr></table>
<p>Esempio 1 (round 1): 2 Kaii contenuti (+2), 1 struttura inutilizzata (−1), bonus sopravvivenza (+1): totale +2. Esempio 2: 3 Kaii contenuti e 1 struttura più 1 Kaii non contenuto (4 Kaii contro 3 strutture): il giocatore muore, −2 punti.</p>
<h4>Preparare il round successivo</h4>
<p>Dopo il punteggio si raccolgono tutte le strutture, i Kaii e le carte tolte dal gioco, e si prepara il round come a inizio partita. Il giocatore che è stato l'ultimo vincitore del lato vicino del round precedente guida il round successivo.</p>
<h4>Fine della partita</h4>
<p>La partita finisce quando è terminato il 3° round oppure quando lo stesso giocatore è morto due volte. Un giocatore che muore due volte è eliminato a prescindere dal punteggio. Tra tutti i giocatori non eliminati vince quello con il punteggio più alto. In caso di ulteriore parità i giocatori pari merito condividono la vittoria.</p>
<h4>Note aggiuntive</h4>
<ul>
<li>Se solo una carta è stata giocata nel lato vicino o nel lato opposto, chi l'ha giocata vince quel lato.</li>
<li>Un giocatore sopravvissuto può comunque avere un punteggio negativo se possiede molte strutture inutilizzate.</li>
<li>Una presa può avere un vincitore del lato vicino senza che sia stato stabilito un lato opposto (in quel caso nessuno prende un Kaii).</li>
<li>Indipendentemente dal numero di Kaii non contenuti, la morte comporta sempre una penalità di −2 punti.</li>
<li>Un giocatore che muore per la prima volta può partecipare al round successivo.</li>
<li>Le illustrazioni sulle carte Kaii sono solo di contorno e non influiscono sul gioco.</li>
</ul>
<p><i>Nell'app:</i> i quattro semi sono Blu, Rosso, Giallo e Grigio (i nomi dei semi non sono nel regolamento). Le carte tolte dal gioco sono scelte a caso e nascoste. Il primo giocatore del primo round è casuale. Strutture e Kaii si contano come numeri e il contenimento è automatico (un Kaii per ogni struttura). L'AI stima le mani avversarie con simulazioni.</p>
</div></details>`;

}
document.getElementById('app').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||b.disabled) return;
  if(b.dataset.menu){ MENUOPEN=!MENUOPEN; render(); return; }
  if(b.dataset.n){ const n=Number(b.dataset.n); if(G) newMatch(n); else askName(n); }
  else if(b.dataset.new){ if(confirm('Iniziare una nuova partita?')) toSetup(); }
  else if(b.dataset.i!==undefined) answer(Number(b.dataset.i));
  else if(b.dataset.p!==undefined) playIdx(Number(b.dataset.p));
  else if(b.dataset.cf!==undefined) confirmCard(b.dataset.cf==='1');
});
document.getElementById('app').addEventListener('change',e=>{
  if(e.target.id==='optA11y'){
    OPT.a11y=e.target.checked;
    try{ localStorage.setItem('os-a11y',OPT.a11y?'1':'0'); }catch(err){}
    render(); return;
  }
  if(e.target.id!=='optUndo') return;
  OPT.undo=e.target.checked;
  try{ localStorage.setItem('os-undo',OPT.undo?'1':'0'); }catch(err){}
  if(PR&&PR.type==='card'&&PR.sel!=null&&!OPT.undo){ const i=PR.sel,r=PR.res; PR=null; render(); r(i); return; }
  render();
});
document.addEventListener('click',e=>{ if(MENUOPEN&&!e.target.closest('.menu-wrap')){ MENUOPEN=false; render(); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&MENUOPEN){ MENUOPEN=false; render(); } });
render();

</script>
</body>
</html>
