.rw{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;align-items:flex-end;min-height:38px;max-width:300px}

<div class="app" id="app"></div>

<script>
// ═════════════════════════ COSTANTI ═════════════════════════
const COLN = ['Nero','Bianco','Marrone'];
const POS = {3:['bottom','left','right'], 4:['bottom','left','top','right']};
const NAMES = ['Tu','AI Latte','AI Mocha','AI Cappuccino'];
const SEATC = ['#ffd166','#ff8fb8','#6ee7b7','#8ecbff'];
const HUM = 0;
const LIMIT = n => n===3?20:15;
const HANDN = n => n===3?13:10;
const COFN = n => n===3?4:3;
const MAXV = [15,15,20];
const ico = n => `<i class="ph-fill ph-${n}"></i>`;
function catDeck(){ const d=[]; for(let v=1;v<=15;v++) d.push({c:0,v}); for(let v=1;v<=15;v++) d.push({c:1,v}); for(let v=10;v<=20;v++) d.push({c:2,v}); return d; }
function coffeeDeck(){ const d=[]; [[0,[1,3,5,7,9]],[1,[2,4,6,8,10]],[2,[5,10,15]]].forEach(([c,vs])=>vs.forEach(v=>d.push({c,v,f:1}))); return d; }

// ═════════════════════════ UTILITÀ ═════════════════════════
const rnd = n => Math.floor(Math.random()*n);
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const ABORT = {abort:true};
let G = null, PR = null;
const OPT = {undo:true};
try{ const s=localStorage.getItem('ct-undo'); if(s!==null) OPT.undo=s==='1' }catch(e){}
const delay = ms => new Promise(r=>setTimeout(r,ms));
async function sleep(ms){ const g=G; await delay(ms); if(g!==G) throw ABORT; }
const P = i => G.pl[i];
function logMsg(t){ G.log.unshift(t); if(G.log.length>900) G.log.pop(); render(); }
function status(t){ G.msg=t; render(); }
const key = c => c.c*100+c.v+(c.f?1000:0);
const cname = c => `${c.f?'Caffè ':''}${COLN[c.c]} ${c.v}`;
const sortHand = h => h.sort((a,b)=>a.c-b.c||a.v-b.v);
const plu = (n,s,p) => `${n} ${n===1?s:p}`;
const sumOf = a => a.reduce((s,c)=>s+c.v,0);
const playName = p => p.cards.length===1?cname(p.cards[0]):`set ${cname(p.cards[0])} + ${cname(p.cards[1])} = Marrone ${p.val}`;

// ═════════════════════════ INTERAZIONE ═════════════════════════
async function ask(p,title,options){
  const ok=options.filter(x=>!x.disabled);
  if(!ok.length) return null;
  if(p!==HUM) return ok[rnd(ok.length)].value;
  const g=G;
  return new Promise((res,rej)=>{ PR={type:'choose',title,options,res,rej}; render(); }).then(v=>{ if(g!==G) throw ABORT; return v; });
}
function answer(i){
  if(!PR||PR.type!=='choose') return;
  const o=PR.options[i]; if(!o||o.disabled) return;
  const r=PR.res; PR=null; render(); r(o.value);
}

// ═════════════════════════ REGOLE (funzioni pure) ═════════════════════════
// una "giocata" è una carta singola oppure un set 1 Nero + 1 Bianco, che vale come Marrone con la somma dei numeri
function playsOf(hand){
  const o=hand.map(c=>({cards:[c],col:c.c,val:c.v}));
  const bl=hand.filter(c=>c.c===0), wh=hand.filter(c=>c.c===1);
  bl.forEach(b=>wh.forEach(w=>o.push({cards:[b,w],col:2,val:b.v+w.v})));
  return o;
}
function legalPlays(hand,led){
  const all=playsOf(hand);
  if(led===null) return all;
  const same=all.filter(p=>p.col===led);
  return same.length?same:all;
}
// vince il valore più alto nel colore del caffè al centro; se nessuno lo ha giocato, nel colore della prima giocata; a pari valore l'ultimo
function trickWinner(tr,cc){
  const col=tr.some(e=>e.play.col===cc)?cc:tr[0].play.col; let b=-1;
  tr.forEach((e,i)=>{ if(e.play.col===col&&(b<0||e.play.val>=tr[b].play.val)) b=i; });
  return b;
}
const coffeePts = (t,L) => t>L?0:t===L?2*t:t;
function roundRows(got,cols,L){
  return got.map((g,p)=>{ const t=sumOf(g), cs=coffeePts(t,L), cnt=cols[p].length; return {p,t,cs,cnt,sq:cnt*cnt,tot:cs+cnt*cnt,over:t>L,exact:t===L}; });
}

// ═════════════════════════ AI ═════════════════════════
function wantWin(X,p){
  const t=sumOf(X.got[p]), nt=t+X.center.v;
  return coffeePts(nt,X.L)>coffeePts(t,X.L);
}
function currentWin(X,p,pl){
  const tmp=X.trick.concat([{p,play:pl}]);
  return trickWinner(tmp,X.center.c)===tmp.length-1;
}
function polFollow(X,p,plays){
  if(plays.length===1) return plays[0];
  if(Math.random()<0.08) return plays[rnd(plays.length)];
  const want=wantWin(X,p);
  const win=plays.filter(pl=>currentWin(X,p,pl)), lose=plays.filter(pl=>!currentWin(X,p,pl));
  const single=a=>{ const s=a.filter(x=>x.cards.length===1); return s.length?s:a; };
  if(want){
    if(win.length) return single(win).reduce((a,b)=>b.val<a.val?b:a);
    return single(plays).reduce((a,b)=>b.val<a.val?b:a);
  }
  if(lose.length){ const s=single(lose); return s[rnd(s.length)]; }
  return single(win).reduce((a,b)=>b.val<a.val?b:a);
}
function polLead(X,l){
  const H=X.hands[l], t=sumOf(X.got[l]);
  const singles=H.map(c=>({cards:[c],col:c.c,val:c.v}));
  const ks=X.cols[l];
  if(Math.random()<0.12) return {k:ks[rnd(ks.length)],play:singles[rnd(singles.length)]};
  let best=null, bv=-1e9;
  ks.forEach(k=>singles.forEach(pl=>{
    const pw=(k.c===pl.col?0.3+0.65:0.12)*(pl.val/MAXV[pl.col]);
    const gain=coffeePts(t+k.v,X.L)-coffeePts(t,X.L);
    const ev=pw*gain-(1-pw)*0.3*k.v+Math.random()*0.5;
    if(ev>bv){ bv=ev; best={k,play:pl}; }
  }));
  return best;
}
function removeCards(h,cards){ return h.filter(c=>!cards.includes(c)); }
function resolveSim(X){
  const tr=X.trick, wi=trickWinner(tr,X.center.c), w=tr[wi].p;
  X.got[w].push(X.center); X.center=null; X.lead=w; X.trick=[];
  if(sumOf(X.got[w])>X.L) X.ended=true;
  if(X.hands.some(h=>h.length===0)) X.ended=true;
}
function trickRestSim(X){
  for(let i=X.trick.length;i<X.n;i++){
    const p=(X.lead+i)%X.n, led=X.trick.length?X.trick[0].play.col:null;
    const pl=polFollow(X,p,legalPlays(X.hands[p],led));
    X.hands[p]=removeCards(X.hands[p],pl.cards); X.trick.push({p,play:pl});
  }
  resolveSim(X);
}
function simRound(X){
  let g=0;
  while(!X.ended&&g++<30){
    if(X.center===null){
      const l=X.lead;
      if(X.hands[l].length===0||X.cols[l].length===0) break;
      const mv=polLead(X,l);
      X.cols[l]=X.cols[l].filter(c=>c!==mv.k); X.center=mv.k;
      X.hands[l]=removeCards(X.hands[l],mv.play.cards); X.trick=[{p:l,play:mv.play}];
    }
    trickRestSim(X);
  }
}
function valueOf(X,p){
  const rows=roundRows(X.got,X.cols,X.L);
  let s=0; rows.forEach((r,q)=>{ if(q!==p) s+=r.tot; });
  return rows[p].tot-0.4*s/(X.n-1);
}
function takeFrom(pool,k,vd){
  const out=[];
  for(let i=0;i<pool.length&&out.length<k;i++){
    const c=pool[i];
    if(vd&&(vd.has(c.c))) continue;
    out.push(c); pool.splice(i,1); i--;
  }
  while(out.length<k&&pool.length) out.push(pool.pop());
  return out;
}
function worldOf(p){
  const S=G.S, n=G.n, known=new Set();
  S.hands[p].forEach(c=>known.add(key(c))); S.playedR.forEach(c=>known.add(key(c)));
  const pool=shuffle(catDeck().filter(c=>!known.has(key(c))));
  const hands=[];
  const qs=[...Array(n).keys()].filter(q=>q!==p).sort((a,b)=>S.void[b].size-S.void[a].size);
  qs.forEach(q=>{ hands[q]=takeFrom(pool,S.hands[q].length,S.void[q]); });
  hands[p]=S.hands[p].slice();
  return {n,L:S.L,hands,cols:S.cols.map(c=>c.slice()),got:S.got.map(g=>g.slice()),center:S.center,trick:S.trick.map(e=>({p:e.p,play:e.play})),lead:S.lead,ended:false};
}
function cloneX(W){ return {n:W.n,L:W.L,hands:W.hands.map(h=>h.slice()),cols:W.cols.map(c=>c.slice()),got:W.got.map(g=>g.slice()),center:W.center,trick:W.trick.map(e=>({...e})),lead:W.lead,ended:false}; }
// per limitare le combinazioni, dei set si tiene uno per ogni somma e al massimo 8
function reducePlays(plays){
  const singles=plays.filter(p=>p.cards.length===1), seen=new Map();
  plays.filter(p=>p.cards.length===2).forEach(p=>{ if(!seen.has(p.val)||Math.random()<0.5) seen.set(p.val,p); });
  let sets=[...seen.values()];
  if(sets.length>8) sets=shuffle(sets).slice(0,8);
  return singles.concat(sets);
}
function aiMove(p){
  const S=G.S, L0=S.trick.length?S.trick[0].play.col:null;
  const plays=reducePlays(legalPlays(S.hands[p],L0));
  const needK=S.center===null;
  const ks=needK?S.cols[p]:[null];
  const cands=[]; ks.forEach(k=>plays.forEach(pl=>cands.push({k,play:pl})));
  if(cands.length===1) return cands[0];
  const NS=cands.length>40?14:cands.length>16?22:32, tot=cands.map(()=>0);
  for(let s=0;s<NS;s++){
    const W=worldOf(p);
    cands.forEach((cd,i)=>{
      const X=cloneX(W);
      if(cd.k){ X.cols[p]=X.cols[p].filter(c=>c!==cd.k); X.center=cd.k; }
      X.hands[p]=removeCards(X.hands[p],cd.play.cards); X.trick.push({p,play:cd.play});
      trickRestSim(X); simRound(X); tot[i]+=valueOf(X,p);
    });
  }
  let bi=0; tot.forEach((v,i)=>{ if(v>tot[bi]) bi=i; });
  return cands[bi];
}

// ═════════════════════════ PARTITA ═════════════════════════
function toSetup(){ if(PR){ const r=PR.rej; PR=null; r(ABORT); } G=null; render(); }
function newMatch(n){
  if(PR){ const r=PR.rej; PR=null; r(ABORT); }
  G={n,round:0,msg:'',log:[],over:null,show:null,turn:-1,S:null,starter:rnd(n),
     pl:Array.from({length:n},(_,i)=>({id:i,name:NAMES[i],total:0,hist:[]}))};
  run();
}
function deal(){
  const n=G.n, d=shuffle(catDeck()), cf=shuffle(coffeeDeck()), hn=HANDN(n), cn=COFN(n);
  const hands=Array.from({length:n},(_,i)=>sortHand(d.slice(i*hn,(i+1)*hn)));
  const cols=Array.from({length:n},(_,i)=>cf.slice(i*cn,(i+1)*cn).sort((a,b)=>a.v-b.v||a.c-b.c));
  G.S={n,L:LIMIT(n),hands,cols,got:Array.from({length:n},()=>[]),center:cf[n*cn],trick:[],lead:G.starter,done:0,res:null,phase:'play',
    void:Array.from({length:n},()=>new Set()),playedR:[],ended:null};
}
function humanPlay(){
  const S=G.S, g=G, led=S.trick.length?S.trick[0].play.col:null, plays=legalPlays(S.hands[HUM],led);
  const ok=new Set(); plays.forEach(pl=>pl.cards.forEach(c=>ok.add(key(c))));
  return new Promise((res,rej)=>{ PR={type:'play',plays,ok,led,sel:[],setMode:false,res,rej}; render(); }).then(v=>{ if(g!==G) throw ABORT; return v; });
}
function humanCoffee(){
  const g=G;
  return new Promise((res,rej)=>{ PR={type:'coffee',res,rej}; render(); }).then(v=>{ if(g!==G) throw ABORT; return v; });
}
function selPlay(){
  if(!PR||PR.type!=='play') return null;
  const ks=new Set(PR.sel);
  return PR.plays.find(pl=>pl.cards.length===ks.size&&pl.cards.every(c=>ks.has(key(c))))||null;
}
async function playRound(){
  const S=G.S, n=G.n;
  logMsg(`— Round ${G.round+1}/${n} — limite ${S.L}. Apre ${P(S.lead).name}; caffè al centro: ${cname(S.center)}.`);
  for(;;){
    const l=S.lead;
    S.trick=[]; S.res=null;
    let mv=null;
    if(S.center===null){
      if(S.cols[l].length===0){ logMsg(`${P(l).name} non ha più caffè da giocare: il round finisce.`); S.ended='col'; break; }
      if(l===HUM){
        status('Scegli uno dei tuoi caffè inutilizzati da mettere al centro.');
        S.center=await humanCoffee();
        S.cols[l]=S.cols[l].filter(c=>c!==S.center);
      }else{
        G.turn=l; status(`${P(l).name} sceglie il caffè e la carta d'apertura.`);
        await sleep(650); mv=aiMove(l);
        S.cols[l]=S.cols[l].filter(c=>c!==mv.k); S.center=mv.k;
      }
      logMsg(`${P(l).name} mette al centro ${cname(S.center)}.`);
      await sleep(300);
    }
    for(let k=0;k<n;k++){
      const p=(l+k)%n; G.turn=p;
      status(p===HUM?`Tocca a te: gioca una carta${S.trick.length?` (colore ${COLN[S.trick[0].play.col]})`:''}.`:`Tocca a ${P(p).name}.`);
      let pl;
      if(p===HUM) pl=await humanPlay();
      else if(k===0&&mv) pl=mv.play;
      else{ await sleep(650); const led=S.trick.length?S.trick[0].play.col:null; pl=aiMove(p).play; }
      S.hands[p]=removeCards(S.hands[p],pl.cards);
      if(S.trick.length){ const led=S.trick[0].play.col; if(pl.col!==led) S.void[p].add(led); }
      S.trick.push({p,play:pl}); pl.cards.forEach(c=>S.playedR.push(c));
      logMsg(`${P(p).name} gioca ${playName(pl)}.`);
    }
    G.turn=-1;
    const wi=trickWinner(S.trick,S.center.c), w=S.trick[wi].p;
    S.res=wi;
    const cc=S.center.c, has=S.trick.some(e=>e.play.col===cc);
    status(`${P(w).name} vince la presa (${has?`colore del caffè: ${COLN[cc]}`:`colore d'apertura: ${COLN[S.trick[0].play.col]}`}).`);
    logMsg(`${P(w).name} vince la presa e prende ${cname(S.center)}.`);
    await sleep(1000);
    S.got[w].push(S.center); S.center=null; S.lead=w; S.done++;
    const t=sumOf(S.got[w]);
    if(t>S.L){ logMsg(`${P(w).name} supera il limite (${t} > ${S.L}): il round finisce e i suoi caffè non valgono nulla.`); S.ended='over'; S.trick=[]; S.res=null; break; }
    const out=S.hands.findIndex(h=>h.length===0);
    if(out>=0){ logMsg(`${P(out).name} ha giocato l'ultima carta: il round finisce.`); S.ended='hand'; S.trick=[]; S.res=null; break; }
    S.trick=[]; S.res=null;
  }
  G.turn=-1; S.phase='end';
}
async function scoring(){
  const S=G.S, rows=roundRows(S.got,S.cols,S.L);
  rows.forEach(r=>{ P(r.p).total+=r.tot; P(r.p).hist.push(r.tot); });
  G.show={rows};
  rows.forEach(r=>logMsg(`Round ${G.round+1}: ${P(r.p).name} caffè ${r.t}/${S.L}${r.over?' (oltre il limite: 0)':r.exact?' (esatto: ×2)':''} = ${r.cs} + ${r.cnt} inutilizzati² = ${r.sq} → ${r.tot} punti.`));
  status(`Round ${G.round+1} concluso.`);
  await ask(HUM,'Punteggi del round',[{label:'Avanti',value:1}]);
  G.show=null;
}
async function run(){
  const g=G;
  try{
    for(let r=0;r<g.n;r++){
      g.round=r; g.starter=(g.starter+(r?1:0))%g.n; deal();
      await playRound();
      await scoring();
    }
    const m=Math.max(...g.pl.map(p=>p.total));
    g.over={winners:g.pl.filter(p=>p.total===m).map(p=>p.id)};
    render();
  }catch(e){
    if(e===ABORT||g!==G) return;
    console.error(e); G.log.unshift('Errore: '+e.message); render();
  }
}

function pickCard(k){
  if(!PR) return;
  if(PR.type==='coffee'){
    const c=G.S.cols[HUM].find(x=>key(x)===k); if(!c) return;
    const r=PR.res; PR=null; render(); r(c); return;
  }
  if(PR.type!=='play'||!PR.ok.has(k)) return;
  const at=PR.sel.indexOf(k);
  if(at>=0) PR.sel.splice(at,1);
  else{ if(PR.sel.length>=2||(PR.sel.length===1&&!PR.setMode&&!OPT.undo)) PR.sel=[]; PR.sel.push(k); }
  const pl=selPlay();
  if(!OPT.undo&&pl&&(pl.cards.length===2||!PR.setMode)){ finishPlay(); return; }
  render();
}
function finishPlay(){
  const pl=selPlay(); if(!pl) return;
  const r=PR.res; PR=null; render(); r(pl);
}

<h4>La presa</h4>
<p>Il primo giocatore gioca una carta gatto (o un set). Gli altri, in senso orario, devono giocare una carta dello stesso <b>colore</b>; solo se non possono, giocano qualsiasi carta. Un <b>set</b> è formato da 1 Nero e 1 Bianco: vale come carta <b>Marrone</b> con la somma dei numeri; si può giocare solo quando si deve (o si può) rispondere a Marrone, o come apertura, e non con altre combinazioni.</p>
<p><b>Vincitore:</b> vince la carta di valore più alto nel colore del <b>caffè al centro</b>; se nessuno ha giocato quel colore, vince il valore più alto nel colore della prima carta giocata. A parità di numero vince chi ha giocato dopo.</p>
<p>Il vincitore prende il caffè centrale e lo mette davanti a sé (tra i caffè conquistati, non nella colonna), scarta le carte gatto della presa e apre la successiva: sceglie <b>un caffè dalla sua colonna</b>, lo mette al centro (il suo colore non deve coincidere con la carta gatto che aprirà) e gioca una carta.</p>
<h4>Fine del round</h4>
<ul><li>Un giocatore, vincendo una presa, supera con i caffè presi il <b>limite</b> (20 con 3 giocatori, 15 con 4): il round finisce subito. «Esattamente il limite» non è un superamento.</li><li>Chi deve aprire non ha più caffè nella sua colonna.</li><li>Un giocatore gioca la sua <b>ultima carta gatto</b> (la presa in corso si conclude).</li></ul>
<h4>Punteggio del round</h4>
<ul><li><b>Caffè presi:</b> la somma dei valori; se hai superato il limite: 0; se hai esattamente il limite: la somma × 2.</li><li><b>Caffè inutilizzati</b> nella tua colonna: il numero di carte al quadrato (3 carte = 9, 1 carta = 1). Vale anche per chi ha superato il limite.</li></ul>
<p>Si sommano le due parti e si accumulano i punti. Vince chi ha più punti dopo tutti i round; i pari merito vincono insieme.</p>
<p><i>Interpretazioni nell'app:</i> un set conta come carta Marrone per l'obbligo di colore (se devi rispondere a Marrone e hai un Nero e un Bianco, puoi giocarli come set; se non hai né Marrone né set, giochi qualsiasi carta); ai round con carte avanzate dopo la fine non si pesca nulla; i caffè inutilizzati contano solo come numero di carte. Le AI non vedono la tua mano: ragionano su mani plausibili (con i vuoti di colore dedotti) e simulano il resto del round.</p>
</div></details>`;

let LOGOPEN=false;
function logHtml(){
  return `<details class="log" ${LOGOPEN?'open':''}><summary>LOG DELLA PARTITA (${G.log.length})</summary><div class="logbody">${G.log.map(l=>`<div>${esc(l)}</div>`).join('')}</div></details>`;
}
document.getElementById('app').addEventListener('toggle',e=>{ if(e.target.matches&&e.target.matches('details.log')) LOGOPEN=e.target.open; },true);
let MENUOPEN=false;
function menuHtml(){
  return `<div class="menu-wrap"><button class="hamb" type="button" data-menu="1" aria-label="Opzioni" aria-expanded="${MENUOPEN}"><svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 1h16M1 7h16M1 13h16"/></svg></button>
    ${MENUOPEN?`<div class="menu-pop">
      <label class="opt-toggle" title="Chiede conferma prima di giocare la carta"><input type="checkbox" id="optUndo" ${OPT.undo?'checked':''}> Abilita annulla</label>
    </div>`:''}</div>`;
}
function render(){
  const app=document.getElementById('app');
  const top=`<div class="topbar"><div class="logo">Catte</div>
    ${window.nyloBackBtn?nyloBackBtn():""}${nyloHomeBtn()}
    ${G&&!G.over&&G.S?`<span class="badge">Round ${G.round+1}/${G.n}</span>`:''}
    ${G?`<button class="btn btn-sm" data-new="1">Nuova partita</button>`:''}
    ${menuHtml()}</div>`;
  let body='';
  if(G&&G.S){
    const pos=POS[G.n];
    body=`<div class="table">${centerHtml()}${G.pl.map((p,i)=>seatHtml(i,pos[i])).join('')}</div>
      ${G.pl.some(p=>p.hist.length)?`<div class="dock" style="position:static">${scoreTable()}</div>`:''}
      ${logHtml()}
      ${recapHtml()}
      ${RULES_HTML}`;
  }
  app.innerHTML=top+`<div class="dock">${dockHtml()}</div>`+body;
}

function askName(n){
  try{ if(localStorage.getItem('nylo-skip-name')==='1'){ NAMES[0]=localStorage.getItem('nylo-player-name')||'Nylo'; newMatch(n); return; } }catch(e){}
  let ov=document.getElementById('nameModal');
  if(!ov){ ov=document.createElement('div'); ov.id='nameModal'; ov.className='name-modal'; document.body.appendChild(ov); }
  let saved=''; try{ saved=localStorage.getItem('nylo-player-name')||''; }catch(e){}
  ov.innerHTML='<form class="name-box"><h3>Come ti chiami?</h3><p>Il tuo nome sostituirà «Tu» al tavolo.</p><input id="nameInput" maxlength="16" placeholder="Il tuo nome" autocomplete="off" value="'+esc(saved)+'"><div class="opts"><button class="opt" type="submit">Inizia la partita</button><button class="opt" type="button" data-cancel="1">Annulla</button></div></form>';
  ov.style.display='flex';
  const closeName=()=>{ ov.style.display='none'; };
  ov.onclick=e=>{ if(e.target===ov||e.target.hasAttribute('data-cancel')) closeName(); };
  ov.onkeydown=e=>{ if(e.key==='Escape') closeName(); };
  const f=ov.firstChild, inp=f.querySelector('input'); inp.focus(); inp.select();
  f.onsubmit=e=>{
    e.preventDefault();
    const v=inp.value.trim().slice(0,16)||'Tu';
    try{ localStorage.setItem('nylo-player-name',v); }catch(x){}
    NAMES[0]=v; ov.style.display='none'; newMatch(n);
  };
}
document.getElementById('app').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||b.disabled) return;
  if(b.dataset.menu){ MENUOPEN=!MENUOPEN; render(); return; }
  if(b.dataset.n){ const n=Number(b.dataset.n); if(G) newMatch(n); else askName(n); }
  else if(b.dataset.new){ if(confirm('Iniziare una nuova partita?')) toSetup(); }
  else if(b.dataset.i!==undefined) answer(Number(b.dataset.i));
  else if(b.dataset.k!==undefined) pickCard(Number(b.dataset.k));
  else if(b.dataset.sm!==undefined){ if(PR&&PR.type==='play'){ PR.setMode=!PR.setMode; PR.sel=[]; render(); } }
  else if(b.dataset.ok!==undefined) finishPlay();
  else if(b.dataset.no!==undefined){ if(PR&&PR.type==='play'){ PR.sel=[]; render(); } }
});
document.getElementById('app').addEventListener('change',e=>{
  if(e.target.id!=='optUndo') return;
  OPT.undo=e.target.checked;
  try{ localStorage.setItem('ct-undo',OPT.undo?'1':'0'); }catch(err){}
  render();
});
document.addEventListener('click',e=>{ if(MENUOPEN&&!e.target.closest('.menu-wrap')){ MENUOPEN=false; render(); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&MENUOPEN){ MENUOPEN=false; render(); } });
render();

</script>
</body>
</html>
