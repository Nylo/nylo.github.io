<script type="text/plain" id="src-ai">
// ═════════════════════════ COSTANTI ═════════════════════════
const SUITS = [
  {n:'Pesci',  icon:'fish'},
  {n:'Gatti',  icon:'cat'},
  {n:'Topi',   icon:'cheese'},
  {n:'Uccelli',icon:'bird'}
];
const TR = 1;                       // il seme dei gatti è briscola
const POS = {3:['bottom','left','right'], 4:['bottom','left','top','right']};
const NAMES = ['Tu','AI Felix','AI Luna','AI Tigro'];
const SEATC = ['#f0594c','#c4966a','#f2c94c','#7da6e0'];
const HUM = 0, ROUNDS = 4, TARGET = 9;
const ico = n => `<i class="ph-fill ph-${n}"></i>`;
function deckFor(n){ const d=[]; for(let s=(n===3?1:0);s<4;s++) for(let r=1;r<=9;r++) d.push({s,r}); return d; }

// ═════════════════════════ UTILITÀ ═════════════════════════
const rnd = n => Math.floor(Math.random()*n);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
let G = null, PR = null;
const OPT = {undo:true,a11y:false};
try{ const s=localStorage.getItem('nl-undo'); if(s!==null) OPT.undo=s==='1'; OPT.a11y=localStorage.getItem('nl-a11y')==='1'; }catch(e){}
function logMsg(t){ G.log.unshift(t); if(G.log.length>900) G.log.pop(); render(); }
const cname = c => `${SUITS[c.s].n} ${c.r}`;
const sortHand = h => h.sort((a,b)=>a.s-b.s||a.r-b.r);
const SHAPES = ['cerchio','triangolo','rombo','stella'];
const shape = (i,t) => `<span class="shp s${i%4}" title="${esc(t||P(i).name)}"><i style="background:${SEATC[i]}"></i></span>`;
const key = c => c.s*20+c.r;
const plu = (n,s,p) => `${n} ${n===1?s:p}`;

// ═════════════════════════ INTERAZIONE ═════════════════════════
async function ask(p,title,options){
  const ok=options.filter(x=>!x.disabled);
  if(!ok.length) return null;
  if(p!==HUM) return ok[rnd(ok.length)].value;
  const g=G;
  return new Promise((res,rej)=>{ PR={type:'choose',title,options,res,rej}; render(); }).then(v=>{ if(g!==G) throw ABORT; return v; });
}
function answer(i){
  if(!PR||PR.type!=='choose') return;
  const o=PR.options[i]; if(!o||o.disabled) return;
  const r=PR.res; PR=null; render(); r(o.value);
}

// ═════════════════════════ REGOLE (funzioni pure) ═════════════════════════
const strength = (c,lead) => c.s===TR?100+c.r:(c.s===lead?c.r:0);
function legalOf(hand,trick){
  if(!trick.length) return hand.slice();
  const f=hand.filter(c=>c.s===trick[0].c.s);
  return f.length?f:hand.slice();
}
function trickWinner(tr){
  const lead=tr[0].c.s; let b=0;
  tr.forEach((e,i)=>{ if(strength(e.c,lead)>strength(tr[b].c,lead)) b=i; });
  return b;
}
// il cubetto delle prese sul tappeto: 0 = partenza, poi 1..4 e di nuovo 1..4
const posOf = t => t===0?0:((t-1)%4)+1;
const hitOf = (sp,t) => t>=1&&sp.includes(posOf(t));
function cycDist(a,b){ const d=Math.abs((a%4)-(b%4)); return Math.min(d,4-d); }
function distTo(sp,t){ return Math.min(...sp.map(s=>cycDist(posOf(t),s))); }
function roundDelta(sp,t){ return hitOf(sp,t)?(sp.length===1?4:2):-distTo(sp,t); }
function fwd(sp,t){ for(let k=0;k<=4;k++) if(hitOf(sp,t+k)) return k; return 4; }
const wantWin = (X,p) => { const f=fwd(X.bets[p].sp,X.t[p]); return f>=1&&f<=2; };
// puntate possibili: uno spazio (4 punti) o due spazi adiacenti (2 punti). Il lato del tappeto (sinistra/destra) si assegna da solo
// e due giocatori non possono fare la stessa puntata. ok = disponibile; fit = c'è posto sul tappeto
const BETDEFS = [[1],[2],[3],[4],[1,2],[2,3],[3,4]];
const betKey = sp => sp.join('+');
function betOptions(slots,bets){
  const taken=new Set((bets||[]).filter(Boolean).map(b=>betKey(b.sp)));
  return BETDEFS.map(sp=>{
    const side=['L','R'].find(sd=>sp.every(n=>slots[n+sd]===undefined));
    const dup=taken.has(betKey(sp));
    return {sp,side:side||'L',pts:sp.length===1?4:2,fit:!!side,ok:!!side&&!dup,why:dup?'già scelta da un altro giocatore':!side?"non c'è posto sul tappeto":''};
  });
}
// puntate selezionabili: quelle disponibili (se per assurdo non ce ne fossero, quelle con posto anche se già scelte)
const pickable = all => { const ok=all.filter(o=>o.ok); return ok.length?ok:all.filter(o=>o.fit); };
const betChoices = (slots,bets) => pickable(betOptions(slots,bets));
const betName = b => b.sp.length===1?`${b.sp[0]}/${b.sp[0]+4}`:`${b.sp[0]}/${b.sp[1]}/${b.sp[0]+4}/${b.sp[1]+4}`;
const betLabel = b => `${betName(b)} · ${b.pts} punti`;

// ═════════════════════════ AI ═════════════════════════
function polCard(X,p){
  const L=legalOf(X.hands[p],X.trick);
  if(L.length===1) return L[0];
  if(Math.random()<0.08) return L[rnd(L.length)];
  const ww=wantWin(X,p);
  if(!X.trick.length){
    const s=L.slice().sort((a,b)=>strength(a,a.s)-strength(b,b.s)||a.r-b.r);
    return ww?s[s.length-1]:s[0];
  }
  const lead=X.trick[0].c.s; let B=0;
  X.trick.forEach(e=>{ B=Math.max(B,strength(e.c,lead)); });
  const sv=c=>strength(c,lead)*1000+c.r*(c.s===lead||c.s===TR?0:1);
  const win=L.filter(c=>strength(c,lead)>B), lose=L.filter(c=>strength(c,lead)<=B);
  if(ww){
    if(win.length) return win.reduce((a,b)=>strength(b,lead)<strength(a,lead)?b:a);
    return L.reduce((a,b)=>a.r+(a.s===TR?20:0)<=b.r+(b.s===TR?20:0)?a:b);
  }
  if(lose.length) return lose.reduce((a,b)=>(strength(b,lead)*100+b.r)>(strength(a,lead)*100+a.r)?b:a);
  return win.reduce((a,b)=>strength(b,lead)<strength(a,lead)?b:a);
}
function pickPol(X,w,cands){
  const more=(()=>{ const f=fwd(X.bets[w].sp,X.t[w]+1); return f>=1&&f<=2; })();
  const sc=c=>(c.s===TR?100:0)+c.r;
  return cands.reduce((a,b)=>more?(sc(b)>sc(a)?b:a):(sc(b)<sc(a)?b:a));
}
function resolveSim(X,pickFn){
  const tr=X.trick, wi=trickWinner(tr), w=tr[wi].p;
  const cands=tr.filter((_,i)=>i!==wi).map(e=>e.c);
  const c=(pickFn||pickPol)(X,w,cands);
  X.hands[w].push(c); X.t[w]++; X.trick=[]; X.lead=w;
}
function playTrickSim(X){
  for(let i=X.trick.length;i<X.n;i++){
    const p=(X.lead+i)%X.n, c=polCard(X,p);
    X.hands[p]=X.hands[p].filter(x=>x!==c); X.trick.push({p,c});
  }
  resolveSim(X);
}
const ended = X => X.hands.some(h=>h.length===0);
function simRest(X){ let g=0; while(!ended(X)&&g++<60) playTrickSim(X); }
function valueOf(X,p){
  let s=0; for(let q=0;q<X.n;q++) if(q!==p) s+=roundDelta(X.bets[q].sp,X.t[q]);
  return roundDelta(X.bets[p].sp,X.t[p])-0.3*s/(X.n-1);
}
function takeFrom(pool,k,vd){
  const out=[];
  for(let i=0;i<pool.length&&out.length<k;i++) if(!vd||!vd.has(pool[i].s)){ out.push(pool[i]); pool.splice(i,1); i--; }
  while(out.length<k&&pool.length) out.push(pool.pop());
  return out;
}
// i dorsi mostrano il colore (seme) di ogni carta: la composizione per seme delle mani avversarie è pubblica
function takeSuits(pool,counts){
  const out=[];
  counts.forEach((k,s)=>{ for(let i=0;i<pool.length&&k>0;i++) if(pool[i].s===s){ out.push(pool[i]); pool.splice(i,1); i--; k--; } });
  return out;
}
const suitCounts = h => { const a=[0,0,0,0]; h.forEach(c=>a[c.s]++); return a; };
function worldPlay(p){
  const S=G.S, n=G.n, known=new Set(), add=c=>known.add(key(c));
  S.hands[p].forEach(add); S.dead.forEach(add); S.trick.forEach(e=>add(e.c)); S.kn.forEach(a=>a.forEach(add));
  const pool=shuffle(deckFor(n).filter(c=>!known.has(key(c))));
  const hands=[];
  const qs=[...Array(n).keys()].filter(q=>q!==p).sort((a,b)=>S.void[b].size-S.void[a].size);
  qs.forEach(q=>{ const cn=suitCounts(S.hands[q]); S.kn[q].forEach(c=>cn[c.s]--); hands[q]=S.kn[q].concat(takeSuits(pool,cn)); });
  hands[p]=S.hands[p].slice();
  return {n,hands,trick:S.trick.map(e=>({p:e.p,c:e.c})),lead:S.lead,t:S.t.slice(),bets:S.bets.slice()};
}
function cloneX(W){ return {n:W.n,hands:W.hands.map(h=>h.slice()),trick:W.trick.map(e=>({...e})),lead:W.lead,t:W.t.slice(),bets:W.bets.slice()}; }
function aiPlay(p){
  const S=G.S, L=legalOf(S.hands[p],S.trick);
  if(L.length===1) return L[0];
  const NS=G.n===4?40:50, tot=L.map(()=>0);
  for(let s=0;s<NS;s++){
    const W=worldPlay(p);
    L.forEach((c,i)=>{
      const X=cloneX(W); X.hands[p]=X.hands[p].filter(x=>x!==c); X.trick.push({p,c});
      playTrickSim(X); simRest(X); tot[i]+=valueOf(X,p);
    });
  }
  let bi=0; tot.forEach((v,i)=>{ if(v>tot[bi]) bi=i; });
  return L[bi];
}
function aiPick(p,cands){
  if(cands.length===1) return cands[0];
  const S=G.S, NS=G.n===4?40:50, tot=cands.map(()=>0);
  for(let s=0;s<NS;s++){
    const W=worldPlay(p);
    cands.forEach((c,i)=>{
      const X=cloneX(W);
      const wi=trickWinner(X.trick);
      resolveSim(X,()=>c);
      if(!ended(X)) simRest(X);
      tot[i]+=valueOf(X,p);
    });
  }
  let bi=0; tot.forEach((v,i)=>{ if(v>tot[bi]) bi=i; });
  return cands[bi];
}
function aiBet(p,opts){
  const S=G.S, n=G.n, mine=S.hands[p], mk=new Set(mine.map(key)), NS=18, tot=opts.map(()=>0);
  for(let s=0;s<NS;s++){
    const U=shuffle(deckFor(n).filter(c=>!mk.has(key(c)))), base=[];
    for(let q=0;q<n;q++) base[q]=q===p?mine.slice():takeSuits(U,suitCounts(S.hands[q]));
    opts.forEach((o,oi)=>{
      const slots={...S.slots}, bets=S.bets.slice();
      const put=(q,b)=>{ bets[q]=b; b.sp.forEach(x=>{ slots[x+b.side]=q; }); };
      put(p,o);
      for(let k=1;k<n;k++){ const q=(p+k)%n; if(bets[q]) continue; const ol=betChoices(slots,bets); if(ol.length) put(q,ol[rnd(ol.length)]); }
      const X={n,hands:base.map(h=>h.slice()),trick:[],lead:S.starter,t:Array(n).fill(0),bets};
      simRest(X); tot[oi]+=valueOf(X,p);
    });
  }
  let bi=0; tot.forEach((v,i)=>{ if(v>tot[bi]) bi=i; });
  return opts[bi];
}

// ═════════════════════════ PARTITA ═════════════════════════
function toSetup(){ if(PR){ const r=PR.rej; PR=null; r(ABORT); } location.href=location.pathname+'#ai'; location.reload(); }
function newMatch(n){
  if(PR){ const r=PR.rej; PR=null; r(ABORT); }
  G={n,round:0,msg:'',log:[],over:null,show:null,turn:-1,S:null,starter:rnd(n),
     pl:Array.from({length:n},(_,i)=>({id:i,name:NAMES[i],score:0,hist:[]}))};
  run();
}
function deal(){
  const n=G.n, d=shuffle(deckFor(n));
  const hands=Array.from({length:n},(_,i)=>sortHand(d.slice(i*9,(i+1)*9)));
  G.S={n,hands,slots:{},bets:Array(n).fill(null),t:Array(n).fill(0),trick:[],lead:G.starter,starter:G.starter,
    kn:Array.from({length:n},()=>[]),void:Array.from({length:n},()=>new Set()),dead:[],phase:'bet',res:null,done:0,started:false};
}
async function betPhase(){
  const S=G.S, n=G.n;
  for(let k=0;k<n;k++){
    const p=(S.starter+k)%n; G.turn=p;
    status(p===HUM?'Tocca a te: scegli la tua puntata.':`${P(p).name} sta puntando.`);
    const all=betOptions(S.slots,S.bets), opts=pickable(all);
    let b;
    if(p===HUM){
      const okSet=new Set(opts);
      const owner=o=>{ const q=S.bets.findIndex(x=>x&&betKey(x.sp)===betKey(o.sp)); return q>=0?q:-1; };
      const opts2=all.map(o=>{
        const dis=!okSet.has(o), q=dis?owner(o):-1;
        const why=!dis?'':q>=0?`Posto occupato da ${P(q).name}`:"Non c'è posto sul tappeto";
        return {label:`${betName(o)}${why?` (${why})`:''}`,value:o,disabled:dis,group:o.sp.length===1?'Puntate più rischiose (4 punti)':'Puntate più semplici (2 punti)',gi:o.sp.length===1?0:1};
      });
      // prima le disponibili, poi le non disponibili, sempre in ordine di valore (ordinamento stabile)
      opts2.sort((x,y)=>x.gi-y.gi||(x.disabled?1:0)-(y.disabled?1:0));
      b=await ask(HUM,'La tua puntata',opts2);
    }
    else { await sleep(600); b=aiBet(p,opts); }
    S.bets[p]=b; b.sp.forEach(x=>{ S.slots[x+b.side]=p; });
    logMsg(`${P(p).name} punta ${betName(b)}.`);
  }
  G.turn=-1;
}
function humanPlay(){
  const S=G.S, g=G, L=legalOf(S.hands[HUM],S.trick);
  return new Promise((res,rej)=>{ PR={type:'play',legal:new Set(L.map(key)),sel:null,res,rej}; render(); }).then(v=>{ if(g!==G) throw ABORT; return v; });
}
function humanTake(ok){
  const g=G;
  return new Promise((res,rej)=>{ PR={type:'take',ok:new Set(ok.map(key)),res,rej}; render(); }).then(v=>{ if(g!==G) throw ABORT; return v; });
}
async function playRound(){
  const S=G.S, n=G.n; S.phase='play'; S.started=true;
  logMsg(`Apre ${P(S.lead).name}.`);
  while(!S.hands.some(h=>h.length===0)){
    S.trick=[]; S.res=null;
    for(let k=0;k<n;k++){
      const p=(S.lead+k)%n; G.turn=p;
      status(p===HUM?'Tocca a te: gioca una carta.':`Tocca a ${P(p).name}.`);
      let c;
      if(p===HUM) c=await humanPlay(); else { await sleep(650); c=aiPlay(p); }
      S.hands[p]=S.hands[p].filter(x=>x!==c);
      S.kn[p]=S.kn[p].filter(x=>x!==c);
      const offSuit=S.trick.length&&c.s!==S.trick[0].c.s, ls=S.trick.length?S.trick[0].c.s:-1;
      if(offSuit) S.void[p].add(ls);
      S.trick.push({p,c});
      logMsg(offSuit?`${P(p).name} non ha ${SUITS[ls].n}: gioca ${cname(c)}${c.s===TR?' (briscola)':''}.`:`${P(p).name} gioca ${cname(c)}.`);
    }
    G.turn=-1;
    const wi=trickWinner(S.trick), w=S.trick[wi].p, wc=S.trick[wi].c;
    S.res=wi;
    status(`${P(w).name} vince la presa con ${cname(wc)}.`);
    logMsg(`${P(w).name} vince la presa con ${cname(wc)} (${plu(S.t[w]+1,'presa','prese')} nel round).`);
    await sleep(700);
    const cands=S.trick.filter((_,i)=>i!==wi).map(e=>e.c);
    let take;
    if(w===HUM){ status('Hai vinto la presa: prendi in mano una delle altre carte.'); take=await humanTake(cands); }
    else take=aiPick(w,cands);
    S.t[w]++;
    S.hands[w]=sortHand(S.hands[w].concat([take]));
    S.kn[w].push(take);
    S.trick.forEach(e=>{ if(e.c!==take) S.dead.push(e.c); });
    logMsg(`${P(w).name} prende ${cname(take)} e scarta le altre carte.`);
    S.lead=w; S.done++;
    status(`${P(w).name} riporta in mano ${cname(take)}.`);
    await sleep(600);
    S.trick=[]; S.res=null;
  }
  const out=S.hands.findIndex(h=>h.length===0);
  logMsg(`${P(out).name} resta senza carte: il round finisce.`);
}
async function scoring(){
  const S=G.S, n=G.n;
  const rows=G.pl.map((_,p)=>{
    const b=S.bets[p], t=S.t[p], d=roundDelta(b.sp,t), old=P(p).score, now=Math.max(0,old+d);
    return {p,b,t,hit:hitOf(b.sp,t),d,old,now,dist:distTo(b.sp,t)};
  });
  rows.forEach(r=>{ P(r.p).score=r.now; P(r.p).hist.push(r.now-r.old); });
  G.show={rows};
  rows.forEach(r=>logMsg(`Round ${G.round+1}: ${P(r.p).name} ha puntato ${betName(r.b)}, ha vinto ${plu(r.t,'presa','prese')}: ${r.hit?`centrato (+${r.d})`:`mancato di ${r.dist} (${r.d})`} → ${r.now} punti.`));
  status(`Round ${G.round+1} concluso.`);
  S.phase='end';
  const last=G.round+1>=ROUNDS||G.pl.some(p=>p.score>=TARGET);
  await ask(HUM,'Punteggi del round',[{label:last?'Mostra risultato finale':'Prossimo round',value:1}]);
  G.show=null;
}
async function run(){
  const g=G;
  try{
    await ask(HUM,`Buona partita a 9 Lives, ${P(HUM).name}!`,[{label:'Ok, si parte',value:1}]);
    for(let r=0;r<ROUNDS;r++){
      g.round=r; deal();
      logMsg(`— Round ${r+1}/${ROUNDS} — comincia ${P(g.starter).name}.`);
      await betPhase();
      await playRound();
      await scoring();
      g.starter=(g.starter+1)%g.n;
      if(g.pl.some(p=>p.score>=TARGET)){ logMsg(`Qualcuno ha raggiunto ${TARGET} punti: la partita finisce.`); break; }
    }
    const m=Math.max(...g.pl.map(p=>p.score));
    g.over={winners:g.pl.filter(p=>p.score===m).map(p=>p.id)};
    render();
  }catch(e){
    if(e===ABORT||g!==G) return;
    console.error(e); G.log.unshift('Errore: '+e.message); render();
  }
}

// ═════════════════════════ MOSSE UMANE ═════════════════════════
function pickCard(k){
  if(!PR) return;
  if(PR.type==='take'){ if(!PR.ok.has(k)) return; const c=G.S.trick.find(e=>key(e.c)===k).c, r=PR.res; PR=null; render(); r(c); return; }
  if(PR.type!=='play'||!PR.legal.has(k)) return;
  if(!OPT.undo){ finishPlay(k); return; }
  PR.sel=PR.sel===k?null:k; render();
}
function finishPlay(k){
  if(!PR||PR.type!=='play'||!PR.legal.has(k)) return;
  const c=G.S.hands[HUM].find(x=>key(x)===k), r=PR.res; PR=null; render(); r(c);
}

// ═════════════════════════ RENDER ═════════════════════════
const kface=(c,cls='')=>`<span class="fc k${c.s} ${cls}" title="${cname(c)}"><span>${c.r}</span>${ico(SUITS[c.s].icon)}</span>`;
function handBtn(c){
  const k=key(c);
  if(PR&&PR.type==='play'){
    const ok=PR.legal.has(k), sel=PR.sel===k;
    return `<button class="fc k${c.s} ${ok?'':'dim'} ${sel?'sel':''}" ${ok?'':'disabled'} data-k="${k}" title="${cname(c)}"><span>${c.r}</span>${ico(SUITS[c.s].icon)}</button>`;
  }
  return kface(c);
}
function flagHtml(p){
  if(!G||G.over||!G.S) return '';
  const S=G.S;
  if(S.phase==='bet'&&S.starter===p) return '<span class="flag first">Primo</span>';
  if(S.phase==='play'&&S.lead===p&&!S.trick.length) return '<span class="flag lead">Di mano</span>';

}
function seatHtml(p,pos){

    <div class="seat-meta">${b?`<span class="tag" title="Puntata">puntata <b>${betName(b)}</b></span>`:'<span class="tag">nessuna puntata</span>'}</div>`;

function centerHtml(){

function rugHtml(){
  const S=G.S;
  let h='';
  for(let n=4;n>=1;n--){
    const cubes=G.pl.map((p,i)=>posOf(S.t[i])===n?shape(i,`${p.name}: ${S.t[i]} prese`):'').join('');
    h+=`<div class="rnum" style="grid-row:${5-n};grid-column:2">${n}<small>/${n+4}</small>${cubes}</div>`;
    for(const side of ['L','R']) if(S.slots[n+side]===undefined) h+=`<div class="rslot" style="grid-row:${5-n};grid-column:${side==='L'?1:3}"></div>`;
  }
  const c0=G.pl.map((p,i)=>posOf(S.t[i])===0?shape(i,p.name):'').join('');
  h+=`<div class="rnum start" style="grid-row:5;grid-column:2"><span>0 prese</span><span class="cubes0">${c0}</span></div>`;
  S.bets.forEach((b,p)=>{ if(!b) return;
    const top=Math.max(...b.sp);
    h+=`<div class="rbet" style="grid-column:${b.side==='L'?1:3};grid-row:${5-top} / span ${b.sp.length};background:${SEATC[p]}">${esc(P(p).name.replace(/^AI /,''))}<span>${b.pts} pt</span></div>`;
  });
  return `<div class="rugbox"><div class="rug">${h}</div></div>`;
}
function scoreTable(){
  const R=ROUNDS;
  const rows=G.pl.map(p=>`<tr><td>${esc(p.name)}</td>${Array.from({length:R},(_,i)=>i<p.hist.length?`<td>${p.hist[i]>0?'+':''}${p.hist[i]}</td>`:'<td>–</td>').join('')}<td><b>${p.score}</b></td></tr>`).join('');

const RULES_HTML = `
<details class="rules"><summary>REGOLAMENTO</summary>
<div class="rtext">
<h4>Obiettivo</h4>
<p>«9 Lives» è un gioco di prese per 3–4 giocatori, circa 15 minuti. A ogni round scommetti quante prese riuscirai a vincere, ma attenzione: ogni vittoria rimette una carta in mano. Riuscirai a battere gli altri e a guadagnare le tue nove vite per primo?</p>
<h4>Preparazione</h4>
<ul><li>Il tappeto delle puntate e il segnapunti sono visibili a tutti; ogni giocatore ha un gatto e un segnalino (una forma diversa per ognuno: cerchio, triangolo, rombo, stella) per le prese, che parte sotto lo spazio 1.</li><li>Il primo giocatore è casuale. Si mescolano le carte e si danno 9 carte a testa. <b>Con 3 giocatori si tolgono i Pesci.</b></li></ul>
<h4>Puntata</h4>
<p>Dal primo giocatore in senso orario, ognuno punta quante prese vincerà mettendo il proprio gatto in orizzontale accanto a <b>un numero</b>, oppure in verticale a cavallo di <b>due numeri</b> del tappeto. Puoi metterlo a sinistra o a destra dei numeri; quando un gatto occupa un lato di un numero, nessun altro può mettersi dallo stesso lato di quel numero. Ogni spazio ha due numeri: se pensi di vincere 1 o 5 prese lo metti nello stesso posto (1/5, 2/6, 3/7, 4/8).</p>
<h4>Le prese</h4>
<p>Chi è di mano gioca una carta: il suo seme è il seme d'apertura. Gli altri, in senso orario, devono rispondere al seme se possono, altrimenti giocano qualsiasi carta. <b>I Gatti sono briscola</b>: se ne viene giocato uno, vince il Gatto più alto; altrimenti vince la carta più alta del seme d'apertura.</p>
<p>Chi vince avanza il proprio segnalino di uno spazio sul tappeto (dopo il 4 si torna all'1), <b>prende in mano una carta della presa diversa da quella che ha giocato</b> e scarta le altre. Poi apre la presa successiva. Si continua finché un giocatore resta senza carte (9–12 prese circa).</p>
<h4>Punteggio</h4>
<ul><li>Gatto accanto a <b>uno spazio</b> e prese vinte pari a uno dei suoi due numeri: <b>4 punti</b>.</li><li>Gatto a cavallo di <b>due spazi</b> e prese vinte pari a uno dei numeri di quegli spazi: <b>2 punti</b>.</li><li>Altrimenti perdi <b>1 punto</b> per ogni spazio tra il tuo segnalino e il tuo gatto, ricordando che il tappeto è circolare (dal 4 si passa al 5, cioè all'1). Il punteggio non scende sotto zero.</li></ul>
<h4>Round e fine partita</h4>
<p>Il segnalino di primo giocatore passa in senso orario. Si giocano 4 round, o fino a quando qualcuno ha 9 punti o più. Vince chi ha più punti; non c'è spareggio (i pari merito vincono insieme).</p>
<p><i>Interpretazioni nell'app:</i> la puntata si sceglie tra le 7 possibili (4 da un solo spazio, 3 da due spazi) e il lato del tappeto, a sinistra o a destra, è assegnato da solo (prima a sinistra); due giocatori non possono fare la stessa puntata, e una puntata a due spazi è disponibile solo se c'è ancora un lato libero per entrambi gli spazi. I semi sono Pesci (azzurro), Gatti (viola, briscola), Topi (rosa) e Uccelli (giallo-verde). Con 0 prese il cubetto è alla partenza e conta come mancato; la distanza è misurata sul tappeto circolare (la più corta tra «in meno» e «in più»). La carta che il vincitore prende è visibile a tutti. I dorsi delle carte hanno il colore del seme, quindi i semi delle mani avversarie sono visibili a tutti. Le AI non vedono i valori della tua mano: ragionano su mani plausibili (con i semi noti e le carte prese) e simulano il resto del round.</p>
</div></details>`;

function askName(n){
  try{ if(localStorage.getItem('nylo-skip-name')==='1'){ NAMES[0]=localStorage.getItem('nylo-player-name')||'Nylo'; newMatch(n); return; } }catch(e){}
  let ov=document.getElementById('nameModal');

document.getElementById('app').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||b.disabled) return;
  if(b.dataset.menu){ MENUOPEN=!MENUOPEN; render(); return; }
  if(b.dataset.n){ const n=Number(b.dataset.n); if(G) newMatch(n); else askName(n); }
  else if(b.dataset.new){ if(confirm('Iniziare una nuova partita?')) toSetup(); }
  else if(b.dataset.i!==undefined) answer(Number(b.dataset.i));
  else if(b.dataset.k!==undefined) pickCard(Number(b.dataset.k));
  else if(b.dataset.ok!==undefined){ if(PR&&PR.type==='play'&&PR.sel!=null) finishPlay(PR.sel); }
  else if(b.dataset.no!==undefined){ if(PR&&PR.type==='play'){ PR.sel=null; render(); } }
});
document.getElementById('app').addEventListener('change',e=>{
  if(e.target.id==='optA11y'){
    OPT.a11y=e.target.checked;
    try{ localStorage.setItem('nl-a11y',OPT.a11y?'1':'0'); }catch(err){}
    render(); return;
  }
  if(e.target.id!=='optUndo') return;
  OPT.undo=e.target.checked;
  try{ localStorage.setItem('nl-undo',OPT.undo?'1':'0'); }catch(err){}

});
document.addEventListener('click',e=>{ if(MENUOPEN&&!e.target.closest('.menu-wrap')){ MENUOPEN=false; render(); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&MENUOPEN){ MENUOPEN=false; render(); } });
render();
if(window.NYLO_START&&NYLO_START.mode==='ai'){NAMES[0]=NYLO_START.name||'Tu';newMatch(NYLO_START.n);}
</script>

// ═════════════════════════ 9 LIVES · ONLINE ═════════════════════════
var GAME={id:'9-lives',logo:'<span class="n9">9</span><span class="lv">Lives</span> · Online',counts:[3,4],
  lobbyNote:'Servono 3 o 4 giocatori. Quando la stanza è piena, i posti al tavolo vengono assegnati a caso.'};
var SUITS=[{n:'Pesci',icon:'fish'},{n:'Gatti',icon:'cat'},{n:'Topi',icon:'cheese'},{n:'Uccelli',icon:'bird'}];
var TR=1;                       // il seme dei gatti è briscola
var POS={3:['bottom','left','right'],4:['bottom','left','top','right']};
var SEATC=['#f0594c','#c4966a','#f2c94c','#7da6e0'];
var ROUNDS=4,TARGET=9;
var ico=function(n){return '<i class="ph-fill ph-'+n+'"></i>'};
var OPT={undo:true,a11y:false};
try{var _s=localStorage.getItem('nl-undo');if(_s!==null)OPT.undo=_s==='1';OPT.a11y=localStorage.getItem('nl-a11y')==='1'}catch(e){}
var ui={sel:null};
var key=function(c){return c.s*20+c.r};
var cname=function(c){return SUITS[c.s].n+' '+c.r};
var plu=function(n,s,p){return n+' '+(n===1?s:p)};
var SHAPES=['cerchio','triangolo','rombo','stella'];
var shape=function(i,t){return '<span class="shp s'+(i%4)+'" title="'+esc(t||S.names[i])+'"><i style="background:'+SEATC[i]+'"></i></span>'};

// ─────────────── REGOLE (funzioni pure, usate dentro le transazioni) ───────────────
function suitsFor(n){var a=[];for(var s=(n===3?1:0);s<4;s++)a.push(s);return a}
function newDeck(n){var d=[];suitsFor(n).forEach(function(s){for(var r=1;r<=9;r++)d.push(s*9+(r-1))});return shuffle(d)}
function validDeck(d,n){
  var want={};suitsFor(n).forEach(function(s){for(var r=0;r<9;r++)want[s*9+r]=1});
  if(!Array.isArray(d)||d.length!==Object.keys(want).length)return false;
  var seen={};for(var i=0;i<d.length;i++){var x=d[i];if(!want[x]||seen[x])return false;seen[x]=1}
  return true;
}
function mkCard(x){return {s:Math.floor(x/9),r:x%9+1}}
var sortHand=function(h){return h.sort(function(a,b){return a.s-b.s||a.r-b.r})};
function dealInto(S,deck){
  var n=S.n;
  S.hands=[];for(var i=0;i<n;i++)S.hands.push(sortHand(deck.slice(i*9,(i+1)*9).map(mkCard)));
  S.slots={};S.bets=[];S.t=[];for(var j=0;j<n;j++){S.bets.push(null);S.t.push(0)}
  S.trick=[];S.lead=S.starter;S.turn=S.starter;S.res=-1;S.done=0;S.show=null;S.phase='bet';
  S.msg='Round '+(S.round+1)+'/'+ROUNDS+': comincia '+S.names[S.starter]+'. Ognuno sceglie la propria puntata.';
}
function gameInitial(players){
  var n=players.length;
  var S={v:0,game:GAME.id,n:n,names:players.map(function(p){return p.name}),uids:players.map(function(p){return p.uid}),
    round:0,starter:rnd(n),score:[],hist:[],over:null};
  for(var i=0;i<n;i++){S.score.push(0);S.hist.push([])}
  dealInto(S,newDeck(n));
  return S;
}
function legalOf(hand,trick){
  if(!trick.length)return hand.slice();
  var f=hand.filter(function(c){return c.s===trick[0].c.s});
  return f.length?f:hand.slice();
}
var strength=function(c,lead){return c.s===TR?100+c.r:(c.s===lead?c.r:0)};
function trickWinner(tr){
  var lead=tr[0].c.s,b=0;
  tr.forEach(function(e,i){if(strength(e.c,lead)>strength(tr[b].c,lead))b=i});
  return b;
}
// il cubetto delle prese sul tappeto: 0 = partenza, poi 1..4 e di nuovo 1..4
var posOf=function(t){return t===0?0:((t-1)%4)+1};
var hitOf=function(sp,t){return t>=1&&sp.indexOf(posOf(t))>=0};
function cycDist(a,b){var d=Math.abs((a%4)-(b%4));return Math.min(d,4-d)}
var distTo=function(sp,t){return Math.min.apply(null,sp.map(function(s){return cycDist(posOf(t),s)}))};
var roundDelta=function(sp,t){return hitOf(sp,t)?(sp.length===1?4:2):-distTo(sp,t)};
// puntate possibili: uno spazio (4 punti) o due spazi adiacenti (2 punti). Il lato del tappeto (sinistra/destra) si assegna da solo
// e due giocatori non possono fare la stessa puntata. ok = disponibile; fit = c'è posto sul tappeto
var BETDEFS=[[1],[2],[3],[4],[1,2],[2,3],[3,4]];
var betKey=function(sp){return sp.join('+')};
function betOptions(slots,bets){
  var taken={};(bets||[]).filter(Boolean).forEach(function(b){taken[betKey(b.sp)]=1});
  return BETDEFS.map(function(sp){
    var side=['L','R'].filter(function(sd){return sp.every(function(n){return slots[n+sd]===undefined})})[0];
    var dup=!!taken[betKey(sp)];
    return {sp:sp,side:side||'L',pts:sp.length===1?4:2,fit:!!side,ok:!!side&&!dup};
  });
}
function pickable(all){var ok=all.filter(function(o){return o.ok});return ok.length?ok:all.filter(function(o){return o.fit})}
var betName=function(b){return b.sp.length===1?b.sp[0]+'/'+(b.sp[0]+4):b.sp[0]+'/'+b.sp[1]+'/'+(b.sp[0]+4)+'/'+(b.sp[1]+4)};
function scoreRound(S){
  var n=S.n,rows=[];
  for(var p=0;p<n;p++){
    var b=S.bets[p],t=S.t[p],d=roundDelta(b.sp,t),old=S.score[p],now=Math.max(0,old+d);
    S.score[p]=now;S.hist[p].push(now-old);
    rows.push({p:p,b:b,t:t,hit:hitOf(b.sp,t),d:d,old:old,now:now,dist:distTo(b.sp,t)});
  }
  S.show={rows:rows};S.phase='scoreRound';S.trick=[];S.res=-1;
  var out=0;S.hands.forEach(function(h,i){if(!h.length)out=i});
  S.msg=S.names[out]+' resta senza carte: il round finisce. Round '+(S.round+1)+' concluso.';
}

function gameReduce(S,seat,a){
  if(!S||seat<0||seat>=S.n||!a)return null;
  var n=S.n,i;
  switch(a.type){
  case 'bet':{
    if(S.phase!=='bet')return null;
    var made=S.bets.filter(Boolean).length;
    if((S.starter+made)%n!==seat||S.bets[seat])return null;
    var opt=pickable(betOptions(S.slots,S.bets)).filter(function(o){return betKey(o.sp)===betKey(a.sp||[])})[0];
    if(!opt)return null;
    S.bets[seat]={sp:opt.sp,side:opt.side,pts:opt.pts};
    opt.sp.forEach(function(x){S.slots[x+opt.side]=seat});
    S.msg=S.names[seat]+' punta '+betName(opt)+'.';
    if(S.bets.every(Boolean)){S.phase='play';S.lead=S.starter;S.turn=S.starter;S.trick=[];S.res=-1;S.msg='Apre '+S.names[S.starter]+'.'}
    else S.turn=(S.starter+made+1)%n;
    break;}
  case 'play':{
    if(S.phase!=='play'||S.turn!==seat)return null;
    var hand=S.hands[seat],ix=-1;
    for(i=0;i<hand.length;i++)if(key(hand[i])===a.k){ix=i;break}
    if(ix<0)return null;
    var ok=legalOf(hand,S.trick);
    if(!ok.some(function(c){return key(c)===a.k}))return null;
    var card=hand.splice(ix,1)[0];
    S.trick.push({p:seat,c:card});
    if(S.trick.length<n){S.turn=(seat+1)%n;S.msg='Tocca a '+S.names[S.turn]+'.'}
    else{
      var wi=trickWinner(S.trick),w=S.trick[wi].p;
      S.res=wi;S.phase='take';S.turn=w;
      S.msg=S.names[w]+' vince la presa con '+cname(S.trick[wi].c)+': porta in mano una delle altre carte.';
    }
    break;}
  case 'take':{
    if(S.phase!=='take'||S.turn!==seat)return null;
    var wi2=S.res,w2=S.trick[wi2].p;
    if(w2!==seat)return null;
    var ti=-1;
    for(i=0;i<S.trick.length;i++)if(i!==wi2&&key(S.trick[i].c)===a.k){ti=i;break}
    if(ti<0)return null;
    var take=S.trick[ti].c;
    S.hands[w2]=sortHand(S.hands[w2].concat([take]));
    S.t[w2]++;S.trick=[];S.res=-1;S.lead=w2;S.turn=w2;S.done++;
    if(S.hands.some(function(h){return !h.length}))scoreRound(S);
    else{S.phase='play';S.msg=S.names[w2]+' riporta in mano '+cname(take)+' e apre la prossima presa.'}
    break;}
  case 'next':{
    if(S.phase!=='scoreRound'||!validDeck(a.deck,n))return null;
    var last=S.round+1>=ROUNDS||S.score.some(function(s){return s>=TARGET});
    if(last){
      var m=Math.max.apply(null,S.score);
      S.over={winners:S.score.map(function(s,q){return s===m?q:-1}).filter(function(q){return q>=0})};
      S.phase='gameEnd';S.show=null;S.msg='Partita conclusa.';break;
    }
    S.round++;S.starter=(S.starter+1)%n;dealInto(S,a.deck);break;}
  case 'rematch':{
    if(S.phase!=='gameEnd'||!validDeck(a.deck,n))return null;
    S.round=0;S.starter=rnd(n);S.over=null;
    for(i=0;i<n;i++){S.score[i]=0;S.hist[i]=[]}
    dealInto(S,a.deck);break;}
  default:return null;
  }
  return S;
}

function betForm(){

  else if(e.target.id==='optUndo'){OPT.undo=e.target.checked;try{localStorage.setItem('nl-undo',OPT.undo?'1':'0')}catch(x){}ui.sel=null;render()}

function gameClick(b){
  var d=b.dataset;
  if(d.bet){act({type:'bet',sp:d.bet.split('+').map(Number)})}
  else if(d.k!==undefined){
    var k=Number(d.k);
    if(OPT.undo){ui.sel=ui.sel===k?null:k;render()}else act({type:'play',k:k});
  }
  else if(d.ok!==undefined){if(ui.sel!==null){var k2=ui.sel;ui.sel=null;act({type:'play',k:k2})}}
  else if(d.no!==undefined){ui.sel=null;render()}
  else if(d.take!==undefined)act({type:'take',k:Number(d.take)});
  else if(d.next)act({type:'next',deck:newDeck(S.n)});
  else if(d.rematch)act({type:'rematch',deck:newDeck(S.n)});
}

async function createRoom(){
  try{
    setStatus('Connessione a Firebase...');await connect();
    var created=false,lastErr=null;
    for(var i=0;i<5&&!created;i++){
      roomCode=genCode();roomRef=db.ref('rooms/'+roomCode);
      try{
        await roomRef.child('hostUid').set(user.uid);
        await roomRef.child('members/'+user.uid).set(true);
        await roomRef.child('lobby').set({game:GAME.id,hostUid:user.uid,playerCount:chosenCount,started:false,closed:false,players:{}});
        created=true;
      }catch(e){lastErr=e;roomRef=null}
    }
    if(!created)throw lastErr||new Error('Impossibile creare la stanza. Verifica le regole del database.');
    await reserveSeat(playerName);
  }catch(e){roomRef=null;setStatus(e.message||'Errore durante la creazione della stanza.')}
}
async function joinRoom(){
  try{
    roomCode=joinVal.toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(roomCode.length!==12)throw new Error('Il codice stanza è di 12 caratteri.');
    setStatus('Connessione...');await connect();
    roomRef=db.ref('rooms/'+roomCode);
    await roomRef.child('members/'+user.uid).set(true);
    await reserveSeat(playerName);
  }catch(e){roomRef=null;setStatus(e.code==='PERMISSION_DENIED'?'Stanza non trovata o non accessibile.':(e.message||'Errore durante l\'accesso alla stanza.'))}
}
function reserveSeat(name){
  var lobbyRef=roomRef.child('lobby');
  return lobbyRef.once('value').then(function(snap){
    if(!snap.exists())throw new Error('Lobby non trovata: controlla il codice.');
    var initial=snap.val();
    if(initial.game!==GAME.id)throw new Error('Questo codice appartiene a un altro gioco.');
    return new Promise(function(resolve,reject){
      lobbyRef.transaction(function(cur){
        if(cur===null)cur=initial;
        if(!cur||!cur.playerCount||cur.closed)return;
        cur.players=cur.players||{};
        if(cur.players[user.uid])return cur;            // rientro: il posto è già tuo
        if(cur.started)return;
        var occ={};Object.keys(cur.players).forEach(function(u){occ[cur.players[u].seat]=true});
        var seat=1;while(seat<=cur.playerCount&&occ[seat])seat++;
        if(seat>cur.playerCount)return;
        cur.players[user.uid]={uid:user.uid,name:name,seat:seat};
        return cur;
      },function(err,committed,snap2){
        if(err){reject(err);return}
        var cur=snap2&&snap2.val();
        if(!cur||!cur.players||!cur.players[user.uid]){
          reject(new Error(cur&&cur.started?'La partita è già iniziata.':'La stanza è piena o non disponibile.'));return;
        }
        lobbyData=cur;saveLast(name);enterRoom();resolve();
      },false);
    });
  });
}
function orderedPlayers(d){
  return Object.keys(d.players||{}).map(function(u){return d.players[u]}).sort(function(a,b){return a.seat-b.seat});
}
function maybeStart(){
  if(!lobbyData||S||startingGame||lobbyData.started||lobbyData.hostUid!==user.uid)return;
  if(orderedPlayers(lobbyData).length===lobbyData.playerCount)startGame();
}
function startGame(){
  startingGame=true;
  var seated=orderedPlayers(lobbyData);   // i posti si assegnano a caso all'avvio
  shuffle(seated);
  var init=gameInitial(seated.map(function(p){return {uid:p.uid,name:p.name}}));
  init.v=0;
  roomRef.child('state').transaction(function(cur){if(cur!==null)return;return {v:0,s:JSON.stringify(init)}},function(err){
    if(err){startingGame=false;showErr('Errore durante l\'avvio: '+err.message);return}
    roomRef.child('lobby/started').set(true).catch(function(e){startingGame=false;showErr(e.message)});
  },false);
}

// ─────────────── STANZA ───────────────
function enterRoom(){
  setConn('Lobby');
  var lobbyRef=roomRef.child('lobby');
  var lh=function(snap){if(!snap.exists())return;lobbyData=snap.val();if(!S){render();maybeStart()}};
  lobbyRef.on('value',lh,function(e){showErr(e.message)});listeners.push({ref:lobbyRef,h:lh});
  var stateRef=roomRef.child('state');
  var sh=function(snap){
    if(!snap.exists())return;
    var raw=snap.val();
    try{S=JSON.parse(raw.s)}catch(e){showErr('Stato della stanza non leggibile.');return}
    me=S.uids.indexOf(user.uid);
    if(me<0){showErr('Non risulti tra i giocatori di questa partita.');return}
    setConn('Connesso');
    render();
  };
  stateRef.on('value',sh,function(e){showErr('Connessione persa: '+e.message)});listeners.push({ref:stateRef,h:sh});
  render();
}
function leave(){
  listeners.forEach(function(l){l.ref.off('value',l.h)});
  if(!roomRef||S||!user){window.location.reload();return}
  // prima dell'inizio libera il posto; a partita avviata si può rientrare con lo stesso codice
  roomRef.child('lobby').transaction(function(cur){
    if(!cur||cur.started)return;
    cur.players=cur.players||{};delete cur.players[user.uid];
    var rest=orderedPlayers(cur);
    if(cur.hostUid===user.uid&&rest.length)cur.hostUid=rest[0].uid;
    return cur;
  },function(){
    roomRef.child('members/'+user.uid).remove().catch(function(){}).then(function(){window.location.reload()});
  },false);
}

// azioni: ogni azione è una transazione sullo stato, validata da gameReduce() sull'ultima versione
function act(a){
  if(!roomRef||me<0)return;
  var seat=me;
  roomRef.child('state').transaction(function(cur){
    if(!cur||!cur.s)return;
    var st;try{st=JSON.parse(cur.s)}catch(e){return}
    var r=gameReduce(st,seat,a);
    if(!r)return;
    r.v=(st.v||0)+1;
    return {v:r.v,s:JSON.stringify(r)};
  },function(err,committed){
    if(err)showErr('Errore di sincronizzazione: '+err.message);
    else if(!committed)setConn('Azione non più valida');
  },false);
}

// ─────────────── RENDER ───────────────
function lobbyHtml(){
  var radios=GAME.counts.map(function(n){
    return '<label><input type="radio" name="pc" value="'+n+'" '+(chosenCount===n?'checked':'')+'> '+n+' giocatori'+(GAME.countNote&&GAME.countNote[n]?' · '+GAME.countNote[n]:'')+'</label>';
  }).join('');
  return '<section><p class="muted">Sei connesso come <b>'+esc(playerName)+'</b>.</p>'+
    '<div class="panel"><h2>Crea una stanza</h2><p class="muted">'+GAME.lobbyNote+'</p>'+
    '<div class="radios" role="radiogroup" aria-label="Numero di giocatori">'+radios+'</div>'+
    '<button class="opt" id="createRoom" type="button" data-create="1">Crea stanza</button></div>'+
    '<div class="panel"><h2>Unisciti a una stanza</h2>'+
    '<input type="text" id="joinCode" maxlength="12" placeholder="Codice stanza" autocomplete="off" value="'+esc(joinVal)+'">'+
    '<button class="opt" type="button" data-join="1">Unisciti</button></div>'+
    '<p class="status" role="status" aria-live="polite">'+esc(statusText)+'</p>'+
    '<button class="btn btn-sm" type="button" data-ai="1">← Torna alla scelta</button></section>';
}
function waitingHtml(){
  var d=lobbyData||{players:{},playerCount:GAME.counts[0]};
  var players=orderedPlayers(d),full=players.length===d.playerCount,html='';
  for(var seat=1;seat<=d.playerCount;seat++){
    var p=players[seat-1];
    html+='<li><span class="seat-n">'+seat+'.</span>'+
      (p?'<span class="grow">'+esc(p.name)+(p.uid===user.uid?' (tu)':'')+'</span>':'<span class="grow soft">In attesa di un giocatore</span>')+
      (p&&p.uid===d.hostUid?'<span class="flag first">HOST</span>':'')+'</li>';
  }
  return '<section><div class="panel"><h2>Stanza '+roomCode+'</h2><p class="muted">'+
    (d.started?'La partita si sta caricando...':players.length+' / '+d.playerCount+' giocatori'+(full?' · avvio in corso':' · condividi il codice con gli altri'))+
    '</p><ul class="roster">'+html+'</ul></div></section>';
}
function kitMenuHtml(){
  var extra=typeof gameMenu==='function'?gameMenu():'';
  return '<div class="menu-wrap"><button class="hamb" type="button" data-menu="1" aria-label="Opzioni" aria-expanded="'+MENUOPEN+'"><svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 1h16M1 7h16M1 13h16"/></svg></button>'+
    (MENUOPEN?'<div class="menu-pop">'+extra+'</div>':'')+'</div>';
}
function render(){
  document.body.classList.toggle('a11y',!!(typeof OPT!=='undefined'&&OPT.a11y));
  var focus=document.activeElement&&document.activeElement.id==='joinCode';
  var badge=S&&typeof gameBadge==='function'?gameBadge():'';
  var top='<div class="topbar"><div class="logo">'+GAME.logo+'</div>'+
    (window.nyloBackBtn?nyloBackBtn():'')+(window.nyloHomeBtn?nyloHomeBtn():'')+
    (badge?'<span class="badge">'+badge+'</span>':'')+
    (roomRef?'<span class="room-code">'+roomCode+'</span><button class="btn btn-sm" type="button" data-copy="1">Copia codice</button><button class="btn btn-sm" type="button" data-leave="1">Esci</button>':'')+
    '<span class="conn" id="conn">'+esc(connText)+'</span>'+kitMenuHtml()+'</div>';
  var body=!roomRef?lobbyHtml():(!S?waitingHtml():gameRender());
  document.getElementById('app').innerHTML=top+body;
  if(focus){var j=document.getElementById('joinCode');if(j){j.focus();j.setSelectionRange(j.value.length,j.value.length)}}
}
var APP=document.getElementById('app');
APP.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b||b.disabled)return;
  var d=b.dataset;
  if(d.menu){MENUOPEN=!MENUOPEN;render();return}
  if(d.ai!==undefined){location.href=location.pathname;return}
  if(d.create!==undefined){createRoom();return}
  if(d.join!==undefined){joinRoom();return}
  if(d.leave!==undefined){if(!S||confirm('Uscire dalla stanza? Potrai rientrare con lo stesso codice.'))leave();return}
  if(d.copy!==undefined){
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(roomCode).then(function(){setConn('Codice copiato')});
    else window.prompt('Copia il codice stanza:',roomCode);
    return;
  }
  if(S&&typeof gameClick==='function')gameClick(b);
});
APP.addEventListener('input',function(e){if(e.target.id==='joinCode'){joinVal=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'');e.target.value=joinVal}});
APP.addEventListener('keydown',function(e){if(e.target.id==='joinCode'&&e.key==='Enter')joinRoom()});
APP.addEventListener('change',function(e){
  if(e.target.name==='pc'){chosenCount=Number(e.target.value);return}
  if(typeof gameChange==='function')gameChange(e);
});
document.addEventListener('click',function(e){if(MENUOPEN&&!e.target.closest('.menu-wrap')){MENUOPEN=false;render()}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&MENUOPEN){MENUOPEN=false;render()}});
render();
if(window.NYLO_START&&NYLO_START.mode==='room'){chosenCount=NYLO_START.n||chosenCount;if(NYLO_START.name)playerName=NYLO_START.name.slice(0,18);if(NYLO_START.action==='join'){joinVal=NYLO_START.code||'';joinRoom()}else createRoom();}
</script>
<style id="sx-css">

.sx-label{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--text-soft);margin-top:2px}
.sx-row{display:flex;gap:8px;flex-wrap:wrap}
.sx-opt{padding:10px 16px;border-radius:7px;border:1px solid var(--border);background:var(--surface-raised);color:var(--text);cursor:pointer;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;transition:border-color .12s,background .12s}
.sx-opt:hover:not(:disabled){border-color:var(--accent)}
.sx-opt.on{border-color:var(--accent);background:var(--accent);color:#fff;font-weight:600}

.sx-row .sx-opt{flex:1 1 0;min-width:0}
.sx-go{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;margin-top:1rem}
.sx-go:hover:not(:disabled){filter:brightness(1.1);border-color:var(--accent)}
.sx-in{background:#fff;border:1px solid var(--border);color:#222;border-radius:6px;padding:10px 12px;font-family:'Inter',sans-serif;font-size:14px;width:100%;outline:none}
.sx-in:focus{border-color:var(--accent)}
.sx-in.code{letter-spacing:2px;text-transform:uppercase;font-family:Consolas,monospace}
.sx-nav{display:flex;gap:8px;align-items:center;margin-left:auto}

.sx-nav .nylo-home:hover{border-color:var(--accent)}
.sx-sub{display:flex;flex-direction:column;gap:10px;padding-top:2px}
</style>
<script>
(function(){
  var P=window.NYLO_SETUP={id:'9-lives',logo:'<span class="n9">9</span><span class="lv">Lives</span>',counts:[3,4]};
  var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  function run(id){var s=document.createElement('script');s.textContent=document.getElementById(id).textContent;document.body.appendChild(s)}
  window.addEventListener('hashchange',function(){location.reload()});
  window.NYLO_IN_SETUP=true;   // finché si sceglie, Home/Indietro escono senza avviso
  var app=document.getElementById('app');
  var st={n:P.counts[0],mode:location.hash==='#stanze'?'room':(location.hash==='#ai'?'ai':''),sub:'',code:'',name:''};
  var needName=false;
  try{
    st.name=localStorage.getItem('nylo-player-name')||'';
    var last=JSON.parse(localStorage.getItem(P.id+'-online-last')||'null');if(last&&last.code)st.code=last.code;
  }catch(e){}
  needName=!st.name;   // il nome arriva dalla sessione; il campo compare solo se manca
  function btn(attrs,cls,label,on){return '<button type="button" class="sx-opt '+cls+(on?' on':'')+'" '+attrs+'>'+label+'</button>'}
  function draw(){
    var h='<div class="topbar"><div class="logo">'+P.logo+'</div><div class="sx-nav">'+(window.nyloBackBtn?nyloBackBtn():'')+(window.nyloHomeBtn?nyloHomeBtn():'')+'</div></div>';
    h+='<div class="sx-card">';
    if(needName)h+='<label class="sx-label" for="sxName">IL TUO NOME</label><input class="sx-in" id="sxName" maxlength="16" placeholder="Il tuo nome" autocomplete="off" value="'+esc(st.name)+'">';
    if(P.counts.length>1){
      h+='<div class="sx-label">GIOCATORI</div><div class="sx-row">'+P.counts.map(function(n){return btn('data-n="'+n+'"','',n+' giocatori',st.n===n)}).join('')+'</div>';
    }
    h+='<div class="sx-label">MODALITÀ</div><div class="sx-row">'+btn('data-mode="ai"','','Contro l’AI',st.mode==='ai')+btn('data-mode="room"','','A stanze',st.mode==='room')+'</div>';
    if(st.mode==='ai'){
      h+='<div class="sx-sub"><div class="sx-row">'+btn('data-go="ai"','sx-go','Inizia',false)+'</div></div>';
    }else if(st.mode==='room'){
      h+='<div class="sx-label">OPZIONI STANZA</div><div class="sx-sub"><div class="sx-row">'+btn('data-sub="create"','','Crea nuova',st.sub==='create')+btn('data-sub="join"','','Unisciti',st.sub==='join')+'</div>';
      if(st.sub==='create')h+='<div class="sx-row">'+btn('data-go="create"','sx-go','Inizia',false)+'</div>';
      if(st.sub==='join')h+='<input class="sx-in code" id="sxCode" maxlength="12" placeholder="Codice stanza" autocomplete="off" value="'+esc(st.code)+'"><div class="sx-row"><button type="button" class="sx-opt sx-go" id="sxJoin" data-go="join" '+(st.code.length===12?'':'disabled')+'>Inizia</button></div>';
      h+='</div>';
    }
    h+='</div>';
    app.innerHTML=h;
  }
  function loadRoom(){
    var libs=['app','auth','database'].map(function(n){return 'https://www.gstatic.com/firebasejs/10.12.2/firebase-'+n+'-compat.js'});
    (function next(i){
      if(i===libs.length){run('src-room');return}
      var s=document.createElement('script');s.src=libs[i];s.onload=function(){next(i+1)};
      s.onerror=function(){app.innerHTML='<p style="padding:20px;color:#c00">Firebase non raggiungibile: controlla la connessione.</p>'};
      document.head.appendChild(s);
    })(0);
  }
  function go(kind){
    var nm=document.getElementById('sxName'),name=((nm&&nm.value)||st.name||'').trim().slice(0,16);
    window.NYLO_IN_SETUP=false;
    if(name){try{localStorage.setItem('nylo-player-name',name)}catch(e){}}
    var cfg={name:name,n:st.n};
    if(kind==='ai'){cfg.mode='ai';window.NYLO_START=cfg;run('src-ai');return}
    cfg.mode='room';cfg.action=kind;if(kind==='join')cfg.code=st.code;
    window.NYLO_START=cfg;app.innerHTML='';loadRoom();
  }
  app.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b||b.disabled)return;
    var d=b.dataset;
    if(d.n){st.n=Number(d.n);draw()}
    else if(d.mode){st.mode=d.mode;st.sub='';draw()}
    else if(d.sub){st.sub=d.sub;draw();var c=document.getElementById('sxCode');if(c)c.focus()}
    else if(d.go)go(d.go);
  });
  app.addEventListener('input',function(e){
    if(e.target.id==='sxName')st.name=e.target.value;
    else if(e.target.id==='sxCode'){
      st.code=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'');e.target.value=st.code;
      var j=document.getElementById('sxJoin');if(j)j.disabled=st.code.length!==12;
    }
  });
  app.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='sxCode'&&st.code.length===12)go('join')});
  draw();
})();
</script>
