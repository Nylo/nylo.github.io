<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#36424d;
  --surface:#3b4955;
  --surface-raised:#4a5b69;
  --accent:#8db6d6;
  --accent-soft:rgba(141,182,214,0.18);
  --steel:#6488a8;
  --ink:#13222b;
  --shadow-title:#6b5f63;
  --text:#f1f6f8;
  --text-soft:#c3d3dc;
  --danger:#ff9a8a;
  --success:#7fe0a8;
  --border:rgba(150,185,215,0.28);
  --radius:10px;
  --s0:#c99a1c; --s1:#3b73b8; --s2:#3a9a63; --s3:#b4563f;
  --cw:46px; --ch:68px;
}
html,body{min-height:100%;color:var(--text);font-family:'Inter',sans-serif;font-size:14px}
body{background:radial-gradient(ellipse at 50% 0%,rgba(54,66,77,0) 0%,rgba(16,24,30,.55) 100%) fixed,url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260' viewBox='0 0 260 260'><g fill='none' stroke='%236488a8' stroke-width='6' opacity='.30'><circle cx='56' cy='56' r='28'/><circle cx='56' cy='56' r='20' stroke-width='2'/><g transform='translate(176 64) rotate(45)'><circle r='10'/><path d='M0 10v52M0 44h12M0 54h9' stroke-linecap='round'/></g><g transform='translate(190 196) rotate(-28)'><path d='M0 -12C-22 -44 22 -44 0 -12' stroke-width='3'/></g></g><g fill='%236488a8' opacity='.30'><g transform='translate(64 188)'><circle cx='-10' cy='-10' r='11'/><circle cx='10' cy='-10' r='11'/><circle cx='-10' cy='10' r='11'/><circle cx='10' cy='10' r='11'/><path d='M0 0Q6 24 22 32' fill='none' stroke='%236488a8' stroke-width='4'/></g><g transform='translate(190 196) rotate(-28)'><ellipse cx='0' cy='12' rx='15' ry='21'/><rect x='-9' y='-14' width='18' height='11' rx='3'/></g></g></svg>") fixed,#36424d}
.app{max-width:940px;margin:0 auto;padding:0 12px 48px}

.topbar{display:flex;align-items:center;gap:10px;padding:14px 0;margin-bottom:10px;flex-wrap:wrap}
.logo{font-family:'Bebas Neue',sans-serif;font-size:58px;line-height:.9;flex:1;letter-spacing:0.03em;color:#fff;text-shadow:3px 3px 0 var(--shadow-title)}
.logo small{font-size:22px;letter-spacing:0.06em;color:#fff;display:block;margin-bottom:2px;margin-left:1px;text-shadow:2px 2px 0 var(--shadow-title)}
.badge{background:var(--steel);color:#fff;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700;white-space:nowrap}
.btn{border-radius:7px;padding:8px 14px;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;cursor:pointer;background:transparent;color:var(--text-soft);border:1px solid var(--border)}
.btn:hover{background:var(--surface-raised)}
.btn-sm{padding:5px 10px;font-size:12px}
.opt-toggle{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-soft);cursor:pointer;border:0;border-radius:20px;padding:4px 10px;user-select:none}
.opt-toggle input{accent-color:var(--accent);cursor:pointer}
.menu-wrap{position:relative;margin-left:auto}
.hamb{display:inline-flex;align-items:center;justify-content:center;width:34px;height:30px;border-radius:7px;background:transparent;color:var(--text-soft);border:1px solid var(--border);cursor:pointer}

.menu-pop{position:absolute;right:0;top:calc(100% + 6px);z-index:30;min-width:220px;display:flex;flex-direction:column;gap:4px;padding:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 10px 24px rgba(0,0,0,0.35)}
.menu-pop .opt-toggle{border:0;border-radius:6px;padding:9px 10px;font-size:13px;color:var(--text);white-space:nowrap}

.dock{position:sticky;top:0;z-index:10;background:var(--surface);border:2px solid var(--steel);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 18px rgba(0,0,0,0.45)}

button.pc:hover:not(:disabled){transform:translateY(-6px)}

details.rules{background:var(--surface);border:2px solid var(--steel);border-radius:var(--radius);padding:14px 16px}
details.rules summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--text-soft);letter-spacing:0.05em}
.unseen{display:flex;flex-direction:column;gap:6px}
.unseen .ur{display:flex;gap:4px;flex-wrap:wrap;align-items:center}

.unseen .ug{display:inline-flex;gap:3px;margin-right:8px}

<script type="text/plain" id="src-ai">
// ═════════════════════════ COSTANTI ═════════════════════════
const SUITS = [
  {n:'Moneta',            icon:'coin'},
  {n:'Chiave',            icon:'key'},
  {n:'Quadrifoglio',      icon:'clover'},
  {n:'Zampa di coniglio', icon:'paw-print'}
];
const ico = n => `<i class="ph-fill ph-${n}"></i>`;
const HUM = 0, TRICKS = 12, HAND = 13, HANDS = 4, BLACK = 16;
const NAMES = ['Tu','AI Acciaio','AI Salvia','AI Ruggine'];
const POS = {3:['bottom','left','right'], 4:['bottom','left','top','right']};

// ═════════════════════════ UTILITÀ ═════════════════════════
const rnd = n => Math.floor(Math.random()*n);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
let G = null, PR = null;
const OPT = {undo:true,a11y:false,memo:false};
try{ const s=localStorage.getItem('charms-undo'); if(s!==null) OPT.undo=s==='1'; OPT.a11y=localStorage.getItem('charms-a11y')==='1'; OPT.memo=localStorage.getItem('charms-memo')==='1'; }catch(e){}
const cardName = c => c.k==='s'?SUITS[c.s].n:`${c.n}`;

// ═════════════════════════ INTERAZIONE ═════════════════════════
async function ask(p,title,options,o={}){
  const ok=options.filter(x=>!x.disabled);
  if(!ok.length) return null;
  if(p!==HUM){
    if(o.pause) await sleep(o.pause);
    return ok[rnd(ok.length)].value;
  }
  const g=G;
  return new Promise((res,rej)=>{ PR={type:'choose',title,options,res,rej}; render(); }).then(v=>{ if(g!==G) throw ABORT; return v; });
}

// ═════════════════════════ REGOLE (funzioni pure) ═════════════════════════
const isS = c => c.k==='s';
function fullDeck(){
  const d=[];
  for(let s=0;s<4;s++) for(let i=0;i<8;i++) d.push({k:'s',s});
  for(let n=1;n<=8;n++) for(let i=0;i<4;i++) d.push({k:'n',n});
  return d;
}
const okHand = h => h.filter(isS).length>=3 && h.filter(c=>!isS(c)).length>=3;
const sortHand = h => h.sort((a,b)=> (isS(a)===isS(b)) ? (isS(a)?a.s-b.s:a.n-b.n) : (isS(a)?-1:1));
const pen = d => d===0?0:d===1?1:d===2?3:5;

// vincitore: chi mostra la briscola col numero più alto; se nessuno, chi mostra il seme di mano col numero più alto; a pari vince l'ultimo a giocare
function winnerOf(ss,sn,order,trump,led){
  let c=order.filter(p=>ss[p]===trump&&sn[p]>0);
  if(!c.length) c=order.filter(p=>ss[p]===led&&sn[p]>0);
  if(!c.length) return order[0];
  let best=c[0];
  for(const p of c) if(sn[p]>=sn[best]) best=p;
  return best;
}
// prima presa: carta seme (obbligo di rispondere al seme) + carta numero
function legalSuitFirst(hand,led){
  const all=hand.map((_,i)=>i).filter(i=>isS(hand[i]));
  if(led==null) return all;
  const same=all.filter(i=>hand[i].s===led);
  return same.length?same:all;
}
const legalNumFirst = hand => hand.map((_,i)=>i).filter(i=>!isS(hand[i]));
// prese 2-12
function legalNext(hand,shownSuit,led,isLeader){
  const all=hand.map((_,i)=>i);
  if(isLeader) return all;
  const same=all.filter(i=>isS(hand[i])&&hand[i].s===led);
  if(shownSuit!==led) return same.length?same:all;     // devo rispondere al seme se ce l'ho
  const ok=all.filter(i=>!isS(hand[i])||hand[i].s===led);   // già mostro il seme di mano: non posso coprirlo con un altro seme
  return ok.length?ok:all;                                  // eccezione: solo carte seme in mano
}
function uniqueIdx(hand,idxs){
  const seen=new Set(), out=[];
  idxs.forEach(i=>{ const key=isS(hand[i])?'s'+hand[i].s:'n'+hand[i].n; if(!seen.has(key)){ seen.add(key); out.push(i); } });
  return out;
}
function firstOptions(hand,led){
  const S=uniqueIdx(hand,legalSuitFirst(hand,led)), N=uniqueIdx(hand,legalNumFirst(hand)), out=[];
  S.forEach(i=>N.forEach(j=>out.push({idx:[i,j],suit:hand[i].s,num:hand[j].n})));
  return out;
}
function nextOptions(hand,ss,sn,led,isLeader){
  return uniqueIdx(hand,legalNext(hand,ss,led,isLeader)).map(i=>{
    const c=hand[i];
    return isS(c)?{idx:[i],suit:c.s,num:sn}:{idx:[i],suit:ss,num:c.n};
  });
}

// ═════════════════════════ AI ═════════════════════════
// Le AI scelgono le carte cercando di vincere le prese che servono per la puntata e di evitare le altre;
// la puntata si stima simulando (Monte Carlo) la mano con le proprie carte e carte altrui a caso.
function strengthOf(suit,num,trump,led){
  if(suit===trump) return 0.5+0.5*num/8;
  if(suit===led) return 0.6*num/8;
  return 0;
}
function choose(me,opts,ss,sn,ord,trump,led,isLeader,r,need){
  if(Math.random()<0.05) return opts[rnd(opts.length)];
  const os=ss[me], on=sn[me];
  const ev=opts.map(o=>{
    const L=isLeader?o.suit:led;
    ss[me]=o.suit; sn[me]=o.num;
    const w=winnerOf(ss,sn,ord,trump,L)===me;
    const s=strengthOf(o.suit,o.num,trump,L);
    ss[me]=os; sn[me]=on;
    return {o,s,c:w?Math.pow(Math.max(s,0.05),0.6*r):0};
  });
  if(need>0){
    const mx=Math.max(...ev.map(x=>x.c));
    if(mx>0){ return ev.filter(x=>x.c>=mx*0.85).sort((a,b)=>a.s-b.s)[0].o; }
    return ev.sort((a,b)=>b.s-a.s)[0].o;                   // non posso vincere ora: rinforzo ciò che mostro
  }
  const safe=ev.filter(x=>x.c<0.05).sort((a,b)=>a.s-b.s);   // evito di vincere e mostro carte basse
  if(safe.length) return safe[0].o;
  return ev.sort((a,b)=>a.c-b.c||a.s-b.s)[0].o;
}
function applyOpt(hand,o,ss,sn,p){
  [...o.idx].sort((a,b)=>b-a).forEach(i=>hand.splice(i,1));
  ss[p]=o.suit; sn[p]=o.num;
}
function simHand(hands,trump,start,needs,nPl){
  const ss=Array(nPl).fill(-1), sn=Array(nPl).fill(0), won=Array(nPl).fill(0);
  let leader=start;
  for(let t=0;t<TRICKS;t++){
    const order=Array.from({length:nPl},(_,i)=>(leader+i)%nPl);
    let led=null;
    for(let i=0;i<nPl;i++){
      const p=order[i];
      const opts=t===0?firstOptions(hands[p],led):nextOptions(hands[p],ss[p],sn[p],led,i===0);
      const o=choose(p,opts,ss,sn,t===0?order.slice(0,i+1):order,trump,i===0?null:led,i===0,nPl-1-i,needs[p]-won[p]);
      applyOpt(hands[p],o,ss,sn,p);
      if(i===0) led=ss[p];
    }
    const w=winnerOf(ss,sn,order,trump,led); won[w]++; leader=w;
  }
  return won;
}
function aiBid(p,maxBid){
  const nPl=G.n, S=24, own=P(p).hand;
  const un=fullDeck();
  const remove=c=>{ const i=un.findIndex(x=>x.k===c.k&&(c.k==='s'?x.s===c.s:x.n===c.n)); if(i>=0) un.splice(i,1); };
  own.forEach(remove); G.revealed.forEach(remove);
  const others=[...Array(nPl).keys()].filter(i=>i!==p);
  const cands=[];
  for(let t=0;t<=Math.min(maxBid,7);t++){
    let total=0;
    for(let s=0;s<S;s++){
      let deck, hands, tries=0;
      do{                                              // le mani avversarie rispettano la regola delle 3+3 carte
        deck=shuffle([...un]); hands=[]; hands[p]=own.map(c=>({...c}));
        others.forEach((q,i)=>{ hands[q]=deck.slice(i*HAND,(i+1)*HAND).map(c=>({...c})); });
      }while(!others.every(q=>okHand(hands[q]))&&++tries<50);
      const needs=[];
      for(let i=0;i<nPl;i++) needs[i]=i===p?t:rnd(5);
      total+=pen(Math.abs(simHand(hands,G.trump,G.start,needs,nPl)[p]-t));
    }
    cands.push({t,ev:total/S+Math.random()*0.05});
  }
  cands.sort((a,b)=>a.ev-b.ev);
  return cands[0].t;
}

function toSetup(){ if(PR){ const r=PR.rej; PR=null; r(ABORT); } location.href=location.pathname+'#ai'; location.reload(); }
function newMatch(n){
  if(PR){ const r=PR.rej; PR=null; r(ABORT); }
  NYLO_CK=null;
  G={n,game:0,start0:rnd(n),start:0,msg:'',log:[],over:null,black:BLACK,trump:-1,revealed:[],mull:[],
     pl:Array.from({length:n},(_,i)=>({id:i,name:NAMES[i],hand:[],sh:{s:-1,n:0},bid:null,won:0,total:0,hist:[]})),
     leader:0,turn:-1,winner:-1,t:0,led:null,done:[],fresh:{},show:null};
  run();
}
function deal(){
  G.mull=[];
  while(true){
    const deck=shuffle(fullDeck());
    const hands=G.pl.map((_,i)=>deck.slice(i*HAND,(i+1)*HAND));
    let rest=deck.slice(G.n*HAND), guard=0, redo=true;
    while(redo&&guard++<300){
      redo=false;
      for(let i=0;i<G.n;i++) if(!okHand(hands[i])){
        redo=true; G.mull.push(i);
        const pool=shuffle(hands[i].concat(rest));
        hands[i]=pool.slice(0,HAND); rest=pool.slice(HAND);
      }
    }
    const revealed=[]; let trump=-1;
    for(const c of rest){ revealed.push(c); if(isS(c)){ trump=c.s; break; } }
    if(trump<0) continue;
    G.pl.forEach((p,i)=>{ p.hand=sortHand(hands[i]); p.sh={s:-1,n:0}; p.bid=null; p.won=0; });
    G.played=[];   // carte giocate (scoperte) nel round, anche quelle poi coperte: serve al pannello «carte uscite»
    G.trump=trump; G.revealed=revealed; G.black=BLACK; G.fresh={}; G.winner=-1; G.led=null; G.done=[]; G.t=0; G.show=null;
    return;
  }
}
const ssOf = () => G.pl.map(p=>p.sh.s);
const snOf = () => G.pl.map(p=>p.sh.n);

async function bidding(){
  const order=Array.from({length:G.n},(_,i)=>(G.start+i)%G.n);
  for(const p of order){
    const pl=P(p);
    if(pl.bid!=null) continue;   // ripresa: ha già puntato
    ckpt();
    status(`Puntate: tocca a ${pl.name}.`);
    const maxBid=Math.min(TRICKS,G.black);
    if(p!==HUM){
      await sleep(450);
      pl.bid=aiBid(p,maxBid);
      G.black-=pl.bid;
      logMsg(`${pl.name} punta ${pl.bid} ${pl.bid===1?'presa':'prese'}.`);
      continue;
    }
    while(true){
      const opts=[];
      for(let n=0;n<=maxBid;n++) opts.push({label:String(n),value:n});
      const n=await ask(p,`Quante prese vincerai? (gettoni neri disponibili: ${G.black})`,opts);
      if(OPT.undo){
        const okc=await ask(p,`Confermi la puntata: ${n} ${n===1?'presa':'prese'}?`,[{label:'Conferma',value:true},{label:'Annulla e riscegli',value:false}]);
        if(!okc) continue;
      }
      pl.bid=n; G.black-=n;
      logMsg(`${pl.name} punta ${n} ${n===1?'presa':'prese'}.`);
      break;
    }
  }
}

function placeCard(pl,c,p){
  (G.played||(G.played=[])).push(c);
  if(isS(c)){ pl.sh.s=c.s; G.fresh['s'+p]=1; } else { pl.sh.n=c.n; G.fresh['n'+p]=1; }
}
async function humanFirst(p,isLeader){
  const pl=P(p);
  const led=isLeader?null:G.led;
  let i=await askCard(legalSuitFirst(pl.hand,led),isLeader?'Gioca una carta seme (qualsiasi) e poi una carta numero.':`Gioca una carta seme: devi rispondere al seme di mano (${SUITS[G.led].n}) se ce l'hai. Poi una carta numero.`);
  placeCard(pl,pl.hand.splice(i,1)[0],p); render();
  i=await askCard(legalNumFirst(pl.hand),'Ora gioca una carta numero (la scelta è libera).');
  placeCard(pl,pl.hand.splice(i,1)[0],p);
}
async function humanNext(p,isLeader){
  const pl=P(p);
  const legal=legalNext(pl.hand,pl.sh.s,G.led,isLeader);
  const hint=isLeader?'Sei il giocatore di mano: puoi coprire una qualsiasi delle tue carte, seme o numero.'
    :(pl.sh.s===G.led?`Mostri già il seme di mano (${SUITS[G.led].n}): non puoi coprirlo con un altro seme, ma puoi giocare un numero.`
      :`Devi rispondere al seme di mano (${SUITS[G.led].n}) se ce l'hai, altrimenti gioca una carta qualsiasi.`);
  const i=await askCard(legal,hint);
  placeCard(pl,pl.hand.splice(i,1)[0],p);
}
async function aiPlay(p,isLeader,first){
  const pl=P(p), ss=ssOf(), sn=snOf();
  await sleep(650);
  const need=pl.bid-pl.won;
  const opts=first?firstOptions(pl.hand,isLeader?null:G.led):nextOptions(pl.hand,pl.sh.s,pl.sh.n,G.led,isLeader);
  const ord=first?G.done.concat([p]):G.order;
  const o=choose(p,opts,ss,sn,ord,G.trump,isLeader?null:G.led,isLeader,G.n-1-G.done.length,need);
  o.idx.slice().sort((a,b)=>b-a).forEach(i=>{ placeCard(pl,pl.hand.splice(i,1)[0],p); });
}

async function tricks(cont){
  if(!cont) G.leader=G.start;
  for(let t=cont?G.t:0;t<TRICKS;t++){
    G.t=t; G.fresh={}; G.winner=-1; G.led=null; G.done=[];
    ckpt();   // inizio presa: carte mostrate e mani coerenti (alla ripresa si rigioca la presa)
    const order=Array.from({length:G.n},(_,i)=>(G.leader+i)%G.n);
    G.order=order;
    for(let i=0;i<G.n;i++){
      const p=order[i]; G.turn=p;
      status(`Presa ${t+1}/${TRICKS}: giocatore di mano ${P(G.leader).name}. Tocca a ${P(p).name}.`);
      if(p===HUM){ if(t===0) await humanFirst(p,i===0); else await humanNext(p,i===0); }
      else await aiPlay(p,i===0,t===0);
      G.done.push(p);
      logMsg(`${P(p).name} gioca ${SUITS[P(p).sh.s].n} ${P(p).sh.n}.`);
      if(i===0) G.led=P(p).sh.s;
      render();
    }
    G.turn=-1;
    const w=winnerOf(ssOf(),snOf(),order,G.trump,G.led);
    G.winner=w; P(w).won++;
    const m=`${P(w).name} vince la presa (${SUITS[P(w).sh.s].n} ${P(w).sh.n}).`;
    status(m); logMsg(m);
    await sleep(1900);
    G.leader=w;
  }
  G.winner=-1; G.turn=-1;
}

async function scoring(){
  const rows=G.pl.map(p=>{ const d=Math.abs(p.won-p.bid), pt=pen(d); p.total+=pt; p.hist.push(pt); return {p:p.id,bid:p.bid,won:p.won,pt}; });
  G.show={rows};
  rows.forEach(r=>logMsg(`Round ${G.game+1}: ${P(r.p).name} puntata ${r.bid}, prese ${r.won} → ${r.pt>0?'+':''}${r.pt} punti.`));
  status(`Round ${G.game+1} concluso.`);
  const last=G.game===HANDS-1;
  await ask(HUM,'Punteggio del round',[{label:last?'Mostra risultato finale':'Prossimo round',value:1}]);
  G.show=null;
}

async function run(rs){
  const g=G;
  try{
    let res=!!rs;
    for(let k=res?g.game:0;k<HANDS;k++){
      let cont=false;
      if(res){ res=false; cont=g.stage==='play'; status(`Partita ripresa: round ${k+1}/${HANDS}${cont?`, presa ${g.t+1}/${TRICKS}`:' (puntate)'}.`); }
      else{
        g.game=k; g.start=(g.start0+k)%g.n;
        deal(); g.stage='bid'; ckpt();
        logMsg(`— Round ${k+1}/${HANDS}: primo giocatore ${P(g.start).name}. Briscola: ${SUITS[g.trump].n} —`);
        if(g.mull.length) logMsg(`Mano rimescolata per ${g.mull.map(i=>P(i).name).join(', ')} (meno di 3 carte seme o numero).`);
        if(k===0) await announceFirst(true);
      }
      if(g.stage==='bid'){
        await bidding();
        if(k>0) await announceFirst();
        g.stage='play';
      }
      await tricks(cont);
      await scoring();
    }
    const m=Math.min(...g.pl.map(p=>p.total));
    g.over={winners:g.pl.filter(p=>p.total===m).map(p=>p.id)};
    render();
  }catch(e){
    if(e===ABORT||g!==G) return;
    console.error(e); G.log.unshift('Errore: '+e.message); render();
  }
}

const numFace=(n,cls='')=>`<span class="pc num ${cls}">${n}</span>`;

function tableauHtml(p){

function centerHtml(){

function scoreTable(){

// carte uscite: solo informazione pubblica. Sbarrate = carte giocate nel round (anche se poi coperte) e carte scoperte per la briscola; contorno = la tua mano.
// Le copie di una stessa carta sono intercambiabili: si contano (prima le uscite, poi le tue, poi le restanti).
function memoHtml(){
  const cnt=a=>{ const m={}; a.forEach(c=>{ const k=isS(c)?'s'+c.s:'n'+c.n; m[k]=(m[k]||0)+1; }); return m; };
  const gone=cnt((G.played||[]).concat(G.revealed||[])), mine=cnt(P(HUM).hand);
  const chips=(k,copies,face)=>Array.from({length:copies},(_,i)=>{ const g=gone[k]||0, o=mine[k]||0; return face(i<g?'gone':(i<g+o?'own':'')); }).join('');
  const rows=SUITS.map((s,i)=>`<div class="ur"><span class="l">${s.n}</span>${chips('s'+i,8,cls=>suitFace(i,cls))}</div>`).join('');
  const nums=Array.from({length:8},(_,i)=>`<span class="ug">${chips('n'+(i+1),4,cls=>numFace(i+1,cls))}</span>`).join('');
  return `<div class="recap memo"><h3>CARTE USCITE (SBARRATE) · TUE (CONTORNO)</h3><div class="unseen">${rows}<div class="ur"><span class="l">Numeri</span>${nums}</div></div></div>`;
}
function recapHtml(){
  const tr=G.trump>=0?`<span class="rchip s${G.trump}">${ico(SUITS[G.trump].icon)} ${SUITS[G.trump].n}</span>`:'<span class="rv">si scopre a inizio round</span>';
  return `<details class="recap"><summary>RIEPILOGO</summary>
    <div class="recap-row"><span class="lbl">Semi</span>${SUITS.map((s,i)=>`<span class="rchip s${i}">${ico(s.icon)} ${s.n}</span>`).join('')}<span class="rv">8 carte per seme</span></div>
    <div class="recap-row"><span class="lbl">Numeri</span>${Array.from({length:8-1+1},(_,i)=>`<span class="nchip">${i+1}</span>`).join('')}<span class="rv">4 copie per numero</span></div>
    <div class="recap-row"><span class="lbl">Briscola</span>${tr}<span class="rv">${HAND} carte a testa · ${TRICKS} prese · vince il numero più alto</span></div></details>`;
}

const RULES_HTML = `
<details class="rules"><summary>REGOLAMENTO</summary>
<div class="rtext">
<h4>Componenti</h4>
<p>64 carte (8 copie di ciascuno dei 4 semi + 4 copie di ciascun numero da 1 a 8), 28 gettoni (16 per le puntate e 12 bianchi per le prese vinte).</p>
<h4>Panoramica</h4>
<p>Charms è un gioco di prese: in ogni presa ogni giocatore gioca una carta e chi gioca il valore più alto vince la presa (e prende un gettone bianco). Si continua finché nessuno ha più carte in mano. A differenza dei giochi di prese standard, le carte hanno un seme <i>o</i> un numero, non entrambi.</p>
<h4>Preparazione</h4>
<p>Si mescolano le carte e se ne distribuiscono 13 a ciascun giocatore. Chi riceve meno di 3 carte seme o meno di 3 carte numero mostra la mano, la rimescola con il resto del mazzo e ne riceve una nuova (da ripetere se necessario). Si gira la carta in cima al mazzo rimasto finché non esce una carta seme: è il seme di briscola del round. Ognuno dichiara quante prese vincerà prendendo gettoni di puntata (anche zero). Il giocatore alla sinistra del mazziere è il giocatore iniziale.</p>
<h4>Svolgimento</h4>
<p><b>Prima presa.</b> Partendo dal giocatore iniziale, ognuno gioca due carte scoperte davanti a sé, una accanto all'altra: una carta seme e una carta numero. Il giocatore iniziale può giocare qualsiasi seme; gli altri devono seguire il seme: se hanno in mano il seme del giocatore di testa devono giocarlo, altrimenti possono giocare qualsiasi seme. Il numero è sempre a discrezione del giocatore.</p>
<p><b>Vincitore.</b> Se almeno un giocatore ha giocato il seme di briscola, vince chi ha giocato il numero più alto insieme alla briscola. Se nessuno l'ha giocata, vince chi ha il numero più alto del seme giocato dal giocatore iniziale. In caso di parità vince, tra i pari, chi ha giocato per ultimo. Il vincitore prende un gettone bianco (si può posare sopra ai gettoni di puntata per tenere traccia dei progressi) e diventa il nuovo giocatore iniziale.</p>
<p><b>Le carte giocate restano dove sono</b> e influenzano la presa successiva.</p>
<p><b>Prese 2–12.</b> Ogni giocatore gioca una sola carta, coprendo la carta precedente dello stesso tipo (seme o numero). Il giocatore iniziale può coprire una qualsiasi delle sue carte. Gli altri devono comunque seguire il seme: se non hanno già visibile il seme iniziale e ne hanno una carta in mano, devono giocarla coprendo la carta seme precedente. Anche se hanno già visibile il seme iniziale, non possono coprirlo se non con un'altra carta dello stesso seme. Unica eccezione: se in mano hanno solo carte seme e nessuna è del seme iniziale. Il vincitore si determina come nella prima presa.</p>
<h4>Fine del round</h4>
<p>Il round termina quando tutti hanno esaurito le carte. Si ottengono solo punti negativi in base all'errore di previsione: esatta = 0 punti, ±1 = 1 punto, ±2 = 3 punti, ±3 o più = 5 punti. Si raccolgono le carte e si ripete la preparazione.</p>
<h4>Fine del gioco</h4>
<p>Si giocano 4 round; vince chi ha ottenuto meno punti.</p>
<p><i>Interpretazioni nell'app:</i> il regolamento non specifica l'ordine delle dichiarazioni (qui si punta a turno partendo dal giocatore iniziale) né chi inizia i round successivi (qui il giocatore iniziale passa a sinistra a ogni round). Una puntata non può superare i gettoni rimasti (16 in totale).</p>
</div></details>`;

// ═════════════════════════ NOME GIOCATORE / PRIMO / DI MANO ═════════════════════════

document.getElementById('app').addEventListener('click',e=>{

<script type="text/plain" id="src-room">
var RULES_HTML = `

// ═════════════════════════ CHARMS · ONLINE ═════════════════════════
var GAME={id:'charms',logo:'<small>TAIKI SHINZAWA\'S</small>Charms',counts:[3,4],
  lobbyNote:'Servono 3 o 4 giocatori. Quando la stanza è piena, i posti al tavolo vengono assegnati a caso.'};
var SUITS=[
  {n:'Moneta',            icon:'coin'},
  {n:'Chiave',            icon:'key'},
  {n:'Quadrifoglio',      icon:'clover'},
  {n:'Zampa di coniglio', icon:'paw-print'}
];
var ico=function(n){return '<i class="ph-fill ph-'+n+'"></i>'};
var TRICKS=12,HAND=13,HANDS=4,BLACK=16;
var POS={3:['bottom','left','right'],4:['bottom','left','top','right']};
var OPT={undo:true,a11y:false};
try{var _s=localStorage.getItem('charms-undo');if(_s!==null)OPT.undo=_s==='1';OPT.a11y=localStorage.getItem('charms-a11y')==='1'}catch(e){}
var ui={sel:null,bid:null};
var isS=function(c){return c.k==='s'};
var cardName=function(c){return c.k==='s'?SUITS[c.s].n:''+c.n};
var sortHand=function(h){return h.sort(function(a,b){return isS(a)===isS(b)?(isS(a)?a.s-b.s:a.n-b.n):(isS(a)?-1:1)})};
var okHand=function(h){return h.filter(isS).length>=3&&h.filter(function(c){return !isS(c)}).length>=3};
var pen=function(d){return d===0?0:d===1?1:d===2?3:5};

// ─────────────── REGOLE (funzioni pure, usate dentro le transazioni) ───────────────
// ogni distribuzione è calcolata da un seme numerico (generatore pseudocasuale deterministico): nessuna casualità dentro il riduttore
function mkRng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function sshuffle(a,rng){for(var i=a.length-1;i>0;i--){var j=Math.floor(rng()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function newSeed(){return Math.floor(Math.random()*4294967296)}
function validSeed(x){return typeof x==='number'&&x%1===0&&x>=0&&x<4294967296}
function fullDeck(){
  var d=[],s,i,n;
  for(s=0;s<4;s++)for(i=0;i<8;i++)d.push({k:'s',s:s});
  for(n=1;n<=8;n++)for(i=0;i<4;i++)d.push({k:'n',n:n});
  return d;
}
function orderFrom(S,p){var o=[],i;for(i=0;i<S.n;i++)o.push((p+i)%S.n);return o}
// vincitore: chi mostra la briscola col numero più alto; se nessuno, chi mostra il seme di mano col numero più alto; a pari vince l'ultimo a giocare
function winnerOf(ss,sn,order,trump,led){
  var c=order.filter(function(p){return ss[p]===trump&&sn[p]>0});
  if(!c.length)c=order.filter(function(p){return ss[p]===led&&sn[p]>0});
  if(!c.length)return order[0];
  var best=c[0];
  c.forEach(function(p){if(sn[p]>=sn[best])best=p});
  return best;
}
function idxs(h){return h.map(function(_,i){return i})}
// prima presa: carta seme (obbligo di rispondere al seme) + carta numero
function legalSuitFirst(hand,led){
  var all=idxs(hand).filter(function(i){return isS(hand[i])});
  if(led==null)return all;
  var same=all.filter(function(i){return hand[i].s===led});
  return same.length?same:all;
}
function legalNumFirst(hand){return idxs(hand).filter(function(i){return !isS(hand[i])})}
// prese 2-12
function legalNext(hand,shownSuit,led,isLeader){
  var all=idxs(hand);
  if(isLeader)return all;
  var same=all.filter(function(i){return isS(hand[i])&&hand[i].s===led});
  if(shownSuit!==led)return same.length?same:all;           // devo rispondere al seme se ce l'ho
  var ok=all.filter(function(i){return !isS(hand[i])||hand[i].s===led});   // già mostro il seme di mano: non posso coprirlo con un altro seme
  return ok.length?ok:all;                                  // eccezione: solo carte seme in mano
}
// carte che il giocatore di turno può giocare adesso
function legalFor(S,seat){
  var hand=S.hands[seat],lead=S.done.length===0;
  if(S.t===0)return S.step===0?legalSuitFirst(hand,lead?null:S.led):legalNumFirst(hand);
  return legalNext(hand,S.sh[seat].s,S.led,lead);
}
function dealInto(S,seed){
  var n=S.n,rng=mkRng(seed),mull=[],i,deck,hands,rest,trump,guard,redo,pool;
  while(true){
    deck=sshuffle(fullDeck(),rng);hands=[];
    for(i=0;i<n;i++)hands.push(deck.slice(i*HAND,(i+1)*HAND));
    rest=deck.slice(n*HAND);guard=0;redo=true;
    while(redo&&guard++<300){
      redo=false;
      for(i=0;i<n;i++)if(!okHand(hands[i])){
        redo=true;if(mull.indexOf(i)<0)mull.push(i);
        pool=sshuffle(hands[i].concat(rest),rng);hands[i]=pool.slice(0,HAND);rest=pool.slice(HAND);
      }
    }
    trump=-1;
    for(i=0;i<rest.length;i++)if(isS(rest[i])){trump=rest[i].s;break}
    if(trump>=0)break;
  }
  S.start=(S.start0+S.round)%n;
  S.hands=hands.map(sortHand);
  S.sh=[];S.bid=[];S.won=[];
  for(i=0;i<n;i++){S.sh.push({s:-1,n:0});S.bid.push(null);S.won.push(0)}
  S.black=BLACK;S.trump=trump;S.mull=mull;
  S.phase='bid';S.turn=S.start;S.leader=S.start;S.t=0;S.step=0;S.led=null;S.done=[];S.winner=-1;S.fresh={};S.show=null;
  S.msg='Round '+(S.round+1)+'/'+HANDS+': primo giocatore '+S.names[S.start]+'. Briscola: '+SUITS[trump].n+'.'+
    (mull.length?' Mano rimescolata per '+mull.map(function(q){return S.names[q]}).join(', ')+' (meno di 3 carte seme o numero).':'')+
    ' Si punta a turno, a partire dal primo giocatore.';
}
function gameInitial(players,seed){
  if(!validSeed(seed))seed=newSeed();
  var n=players.length,i;
  var S={v:0,game:GAME.id,n:n,names:players.map(function(p){return p.name}),uids:players.map(function(p){return p.uid}),
    round:0,start0:seed%n,total:[],hist:[],over:null};
  for(i=0;i<n;i++){S.total.push(0);S.hist.push([])}
  dealInto(S,seed);
  return S;
}
function scoreRound(S,ms){
  var rows=[],p;
  for(p=0;p<S.n;p++){
    var pt=pen(Math.abs(S.won[p]-S.bid[p]));
    S.total[p]+=pt;S.hist[p].push(pt);
    rows.push({p:p,bid:S.bid[p],won:S.won[p],pt:pt});
  }
  S.show={rows:rows};S.phase='roundEnd';S.turn=-1;S.step=0;
  ms.push('Round '+(S.round+1)+' concluso.');
}
// chiude la presa: il vincitore diventa il giocatore di mano; le carte giocate restano dove sono
function finishTrick(S,ms){
  var order=orderFrom(S,S.leader);
  var w=winnerOf(S.sh.map(function(x){return x.s}),S.sh.map(function(x){return x.n}),order,S.trump,S.led);
  S.won[w]++;S.winner=w;S.leader=w;S.t++;S.done=[];S.led=null;S.step=0;S.turn=w;
  ms.push(S.names[w]+' vince la presa ('+SUITS[S.sh[w].s].n+' '+S.sh[w].n+').');
  if(S.t>=TRICKS)scoreRound(S,ms);
  else ms.push('Presa '+(S.t+1)+'/'+TRICKS+': di mano '+S.names[w]+'.');
}
function placeCard(S,c,p){
  if(isS(c)){S.sh[p].s=c.s;S.fresh['s'+p]=1}else{S.sh[p].n=c.n;S.fresh['n'+p]=1}
}
function gameReduce(S,seat,a){
  if(!S||seat<0||seat>=S.n||!a)return null;
  var n=S.n,i,ms;
  switch(a.type){
  case 'bid':{
    if(S.phase!=='bid'||S.turn!==seat||S.bid[seat]!==null)return null;
    var mx=Math.min(TRICKS,S.black);
    if(typeof a.n!=='number'||a.n%1!==0||a.n<0||a.n>mx)return null;
    S.bid[seat]=a.n;S.black-=a.n;
    ms=[S.names[seat]+' punta '+a.n+' '+(a.n===1?'presa':'prese')+'.'];
    var left=0;for(i=0;i<n;i++)if(S.bid[i]===null)left++;
    if(left)S.turn=(seat+1)%n;
    else{
      S.phase='play';S.t=0;S.step=0;S.led=null;S.done=[];S.winner=-1;S.fresh={};S.leader=S.start;S.turn=S.start;
      ms.push('Puntate concluse. Presa 1/'+TRICKS+': di mano '+S.names[S.start]+'.');
    }
    S.msg=ms.join(' ');
    break;}
  case 'play':{
    if(S.phase!=='play'||S.turn!==seat)return null;
    if(typeof a.i!=='number'||a.i%1!==0||a.i<0||a.i>=S.hands[seat].length)return null;
    if(legalFor(S,seat).indexOf(a.i)<0)return null;
    var isLeader=S.done.length===0;
    if(isLeader&&S.step===0){S.fresh={};S.winner=-1}          // inizia una nuova presa: spariscono gli evidenziati della precedente
    var c=S.hands[seat].splice(a.i,1)[0];
    placeCard(S,c,seat);
    if(S.t===0&&S.step===0){                                   // prima presa: dopo la carta seme tocca ancora a te con la carta numero
      S.step=1;
      S.msg=S.names[seat]+' gioca la carta seme '+SUITS[c.s].n+': ora la carta numero.';
      break;
    }
    S.step=0;
    if(isLeader)S.led=S.sh[seat].s;
    S.done.push(seat);
    ms=[S.names[seat]+' gioca '+SUITS[S.sh[seat].s].n+' '+S.sh[seat].n+'.'];
    if(S.done.length===n)finishTrick(S,ms);
    else S.turn=(seat+1)%n;
    S.msg=ms.join(' ');
    break;}
  case 'next':{
    if(S.phase!=='roundEnd')return null;
    if(S.round>=HANDS-1){
      var m=Math.min.apply(null,S.total);
      S.over={winners:S.total.map(function(t,p){return t===m?p:-1}).filter(function(p){return p>=0})};
      S.phase='gameEnd';S.show=null;S.turn=-1;S.msg='Partita conclusa.';break;
    }
    if(!validSeed(a.seed))return null;
    S.round++;
    dealInto(S,a.seed);
    break;}
  case 'rematch':{
    if(S.phase!=='gameEnd'||!validSeed(a.seed))return null;
    S.round=0;S.over=null;S.start0=a.seed%n;
    for(i=0;i<n;i++){S.total[i]=0;S.hist[i]=[]}
    dealInto(S,a.seed);
    break;}
  default:return null;
  }
  return S;
}

// ─────────────── RENDER ───────────────
function gameBadge(){return S.phase==='gameEnd'?'Partita conclusa':'Round '+(S.round+1)+'/'+HANDS}
function myPlay(){return S.phase==='play'&&S.turn===me}
function myBid(){return S.phase==='bid'&&S.turn===me}
var legalNow=[];
var suitFace=function(s,cls){return '<span class="pc s'+s+' '+(cls||'')+'" title="'+SUITS[s].n+'">'+ico(SUITS[s].icon)+'</span>'};
var numFace=function(n,cls){return '<span class="pc num '+(cls||'')+'">'+n+'</span>'};
var faceOf=function(c,cls){return isS(c)?suitFace(c.s,cls):numFace(c.n,cls)};
function handBtn(c,i){

function tableauHtml(p){
  var sh=S.sh[p],win=S.winner===p;
  var a=sh.s>=0?suitFace(sh.s,'mini '+(S.fresh['s'+p]?'fresh':'')+' '+(win?'win':'')):'<span class="empty"></span>';
  var b=sh.n>0?numFace(sh.n,'mini '+(S.fresh['n'+p]?'fresh':'')+' '+(win?'win':'')):'<span class="empty"></span>';

}
function flagHtml(p){
  if(S.phase==='play'&&S.leader===p)return '<span class="flag lead">Di mano</span>';
  if(S.phase==='bid'&&S.start===p)return '<span class="flag first">Primo giocatore</span>';

}
function seatHtml(p,pos){
  var active=(S.phase==='play'||S.phase==='bid')&&S.turn===p,leader=S.phase==='play'&&S.leader===p,winner=S.winner===p&&!active;
  var hand;
  // informazioni nascoste: delle carte degli altri si vede solo il numero
  if(p===me)hand='<div class="hand">'+S.hands[me].map(function(c,i){return myPlay()?handBtn(c,i):faceOf(c)}).join('')+'</div>';
  else hand='<div class="backs">'+S.hands[p].map(function(){return '<span class="back"></span>'}).join('')+'</div>';
  var meta='<div class="seat-meta"><span class="tag">puntata <b>'+(S.bid[p]==null?'—':S.bid[p])+'</b></span><span class="tag">prese <b>'+S.won[p]+'</b></span><span class="tag">punti <b>'+S.total[p]+'</b></span></div>';
  var name='<div class="seat-name">'+esc(S.names[p])+(p===me?' (tu)':'')+flagHtml(p)+'</div>';
  var tb=tableauHtml(p);
  var inner=pos==='bottom'?tb+name+meta+hand:(pos==='top'?hand+name+meta+tb:name+meta+tb+hand);
  return '<div class="seat '+pos+' '+(leader?'leader':'')+' '+(active?'active':'')+' '+(winner?'winner':'')+'">'+inner+'</div>';

function centerHtml(){
  var t='<div class="trump">'+suitFace(S.trump)+'<span>Briscola: <b>'+SUITS[S.trump].n+'</b></span></div>';
  var info=S.phase==='play'?'<div>Presa <b>'+Math.min(S.t+1,TRICKS)+'/'+TRICKS+'</b>'+(S.led!=null?'<br>Seme di mano: <b>'+SUITS[S.led].n+'</b>':'')+'</div>'

function scoreTable(){

    return '<tr><td>'+esc(nm)+(p===me?' (tu)':'')+'</td>'+cells+'<td><b>'+S.total[p]+'</b></td></tr>';

function resultHtml(){

// riga Conferma/Annulla sempre presente quando "annulla" è attivo (disabilitata finché non scegli): la mano non si sposta
function confirmRow(sel,label,att,cancel){

function dockHtml(){
  var msg='<div class="dock-msg">'+esc(S.msg)+'</div>',i;

    var w=S.over.winners.map(function(q){return esc(S.names[q])+(q===me?' (tu)':'')}).join(' e ');
    return '<div class="dock-msg"><b>'+(S.over.winners.length>1?'Vittoria condivisa: ':'Vince ')+w+'!</b> (vince chi ha meno punti)</div>'+scoreTable()+

  }
  var hint;
  if(S.turn!==me)hint='Tocca a '+esc(S.names[S.turn])+'.';
  else{
    var lead=S.done.length===0;
    if(S.t===0)hint=S.step===1?'Ora gioca una carta numero (la scelta è libera).'
      :(lead?'Gioca una carta seme (qualsiasi) e poi una carta numero.':'Gioca una carta seme: devi rispondere al seme di mano ('+SUITS[S.led].n+') se ce l\'hai. Poi una carta numero.');
    else hint=lead?'Sei il giocatore di mano: puoi coprire una qualsiasi delle tue carte, seme o numero.'
      :(S.sh[me].s===S.led?'Mostri già il seme di mano ('+SUITS[S.led].n+'): non puoi coprirlo con un altro seme, ma puoi giocare un numero.'

    hint='Tocca a te: '+hint;
  }
  var cf='';
  if(S.turn===me)cf=confirmRow(ui.sel!==null,ui.sel!==null?'Conferma: gioca '+cardName(S.hands[me][ui.sel]):'','cf','Annulla');

function recapHtml(){
  var tr='<span class="rchip s'+S.trump+'">'+ico(SUITS[S.trump].icon)+' '+SUITS[S.trump].n+'</span>';

function gameRender(){
  legalNow=myPlay()?legalFor(S,me):[];
  if(!myPlay()||legalNow.indexOf(ui.sel)<0)ui.sel=null;
  if(!myBid())ui.bid=null;
  var pos=POS[S.n],seats='',i;
  for(i=0;i<S.n;i++)seats+=seatHtml((me+i)%S.n,pos[i]);
  var anyHist=S.hist.some(function(h){return h.length});
  return '<div class="dock">'+dockHtml()+'</div><div class="table">'+seats+centerHtml()+'</div>'+
    (anyHist?'<div class="dock" style="position:static">'+scoreTable()+'</div>':'')+recapHtml()+RULES_HTML;
}
function gameMenu(){
  return '<label class="opt-toggle" title="Chiede conferma e permette di annullare puntate e carte giocate"><input type="checkbox" id="optUndo" '+(OPT.undo?'checked':'')+'> Abilita annulla</label>'+
    '<label class="opt-toggle" title="Aggiunge una filigrana ai semi (puntini, righe, diagonali) per distinguerli senza i colori"><input type="checkbox" id="optA11y" '+(OPT.a11y?'checked':'')+'> Modalità accessibile</label>';
}
function gameChange(e){
  if(e.target.id==='optA11y'){OPT.a11y=e.target.checked;try{localStorage.setItem('charms-a11y',OPT.a11y?'1':'0')}catch(x){}render()}
  else if(e.target.id==='optUndo'){OPT.undo=e.target.checked;try{localStorage.setItem('charms-undo',OPT.undo?'1':'0')}catch(x){}ui.sel=null;ui.bid=null;render()}
}
function gameClick(b){
  var d=b.dataset;
  if(d.b!==undefined){
    if(!myBid())return;
    var n=Number(d.b);
    if(OPT.undo){ui.bid=ui.bid===n?null:n;render()}
    else act({type:'bid',n:n});
  }
  else if(d.bcf!==undefined){
    if(d.bcf==='1'){if(ui.bid!==null&&myBid()){var n2=ui.bid;ui.bid=null;act({type:'bid',n:n2})}}
    else{ui.bid=null;render()}
  }
  else if(d.p!==undefined){
    var i=Number(d.p);
    if(myPlay()&&legalNow.indexOf(i)>=0){
      if(OPT.undo){ui.sel=ui.sel===i?null:i;render()}
      else act({type:'play',i:i});
    }
  }
  else if(d.cf!==undefined){
    if(d.cf==='1'){if(ui.sel!==null&&myPlay()){var i2=ui.sel;ui.sel=null;act({type:'play',i:i2})}}
    else{ui.sel=null;render()}
  }
  else if(d.next)act({type:'next',seed:newSeed()});
  else if(d.rematch)act({type:'rematch',seed:newSeed()});
}

// transazione che applica gameReduce() all'ultima versione. Le mani stanno nello stato (nascoste solo dall'interfaccia).

  apiKey:"AIzaSyAoOMLytOqFY9GRXpi2kUGEyzLK-r00nvQ",

};
var ALPHABET='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
var SAVE_KEY=GAME.id+'-online-last';
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var rnd=function(n){return Math.floor(Math.random()*n)};
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t}return a}
function getPlayerName(){
  var name='';
  try{
    name=localStorage.getItem('nylo-player-name')||'';
    if(!name){var last=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');name=last&&last.name||''}
  }catch(e){}
  return String(name||'Giocatore').trim().slice(0,18)||'Giocatore';
}
var playerName=getPlayerName();
var db=null,user=null,roomRef=null,roomCode='',lobbyData=null,S=null,me=-1,listeners=[],startingGame=false;
var statusText='',connText='',joinVal='',chosenCount=GAME.counts[0],MENUOPEN=false,connecting=false;
try{var lastRoom=JSON.parse(localStorage.getItem(SAVE_KEY));if(lastRoom)joinVal=lastRoom.code||''}catch(e){}

function setStatus(t){statusText=t;render()}
function setConn(t){connText=t;var c=document.getElementById('conn');if(c)c.textContent=t}
function showErr(t){
  var e=document.getElementById('err');
  if(!e){e=document.createElement('div');e.id='err';e.className='err';e.setAttribute('role','alert');document.body.appendChild(e)}
  e.textContent=t;e.hidden=false;setConn('Errore');clearTimeout(showErr.t);showErr.t=setTimeout(function(){e.hidden=true},8000);
}
function genCode(){var b=new Uint8Array(12);crypto.getRandomValues(b);return Array.from(b,function(x){return ALPHABET[x%ALPHABET.length]}).join('')}
function withTimeout(p,ms,msg){
  return new Promise(function(res,rej){var t=setTimeout(function(){rej(new Error(msg))},ms);p.then(function(v){clearTimeout(t);res(v)},function(e){clearTimeout(t);rej(e)})});
}
function authMsg(e){
  if(e.code==='auth/operation-not-allowed')return 'Attiva il provider Anonimo in Firebase Authentication.';
  if(e.code==='auth/unauthorized-domain')return 'Dominio non autorizzato: aggiungilo in Authentication > Impostazioni > Domini autorizzati.';
  if(e.code==='auth/network-request-failed')return 'Firebase non raggiungibile: controlla la connessione e che il sito sia in HTTPS.';
  return e.message||'Errore di autenticazione Firebase.';
}
async function connect(){
  if(!window.firebase)throw new Error('Firebase non caricato. Controlla la connessione.');
  if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
  db=firebase.database();
  if(user)return;
  try{user=(await withTimeout(firebase.auth().signInAnonymously(),15000,'Autenticazione scaduta dopo 15 secondi.')).user}
  catch(e){throw new Error(authMsg(e))}
}
function saveLast(name){try{localStorage.setItem(SAVE_KEY,JSON.stringify({code:roomCode,name:name}))}catch(e){}}

// ─────────────── LOBBY ───────────────
async function createRoom(){
  try{
    setStatus('Connessione a Firebase...');await connect();
    var created=false,lastErr=null;
    for(var i=0;i<5&&!created;i++){
      roomCode=genCode();roomRef=db.ref('rooms/'+roomCode);
      try{
        await roomRef.child('hostUid').set(user.uid);
        await roomRef.child('members/'+user.uid).set(true);
        await roomRef.child('lobby').set({game:GAME.id,hostUid:user.uid,playerCount:chosenCount,started:false,closed:false,players:{}});
        created=true;
      }catch(e){lastErr=e;roomRef=null}
    }
    if(!created)throw lastErr||new Error('Impossibile creare la stanza. Verifica le regole del database.');
    await reserveSeat(playerName);
  }catch(e){roomRef=null;connecting=false;setStatus(e.message||'Errore durante la creazione della stanza.')}
}
async function joinRoom(){
  try{
    roomCode=joinVal.toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(roomCode.length!==12)throw new Error('Il codice stanza è di 12 caratteri.');
    setStatus('Connessione...');await connect();
    roomRef=db.ref('rooms/'+roomCode);
    await roomRef.child('members/'+user.uid).set(true);
    await reserveSeat(playerName);
  }catch(e){roomRef=null;connecting=false;setStatus(e.code==='PERMISSION_DENIED'?'Stanza non trovata o non accessibile.':(e.message||'Errore durante l\'accesso alla stanza.'))}
}
function reserveSeat(name){
  var lobbyRef=roomRef.child('lobby');
  return lobbyRef.once('value').then(function(snap){
    if(!snap.exists())throw new Error('Lobby non trovata: controlla il codice.');
    var initial=snap.val();
    if(initial.game!==GAME.id)throw new Error('Questo codice appartiene a un altro gioco.');
    return new Promise(function(resolve,reject){
      lobbyRef.transaction(function(cur){
        if(cur===null)cur=initial;
        if(!cur||!cur.playerCount||cur.closed)return;
        cur.players=cur.players||{};
        if(cur.players[user.uid])return cur;            // rientro: il posto è già tuo
        if(cur.started)return;
        var occ={};Object.keys(cur.players).forEach(function(u){occ[cur.players[u].seat]=true});
        var seat=1;while(seat<=cur.playerCount&&occ[seat])seat++;
        if(seat>cur.playerCount)return;
        cur.players[user.uid]={uid:user.uid,name:name,seat:seat};
        return cur;
      },function(err,committed,snap2){
        if(err){reject(err);return}
        var cur=snap2&&snap2.val();
        if(!cur||!cur.players||!cur.players[user.uid]){
          reject(new Error(cur&&cur.started?'La partita è già iniziata.':'La stanza è piena o non disponibile.'));return;
        }
        lobbyData=cur;saveLast(name);enterRoom();resolve();
      },false);
    });
  });
}
function orderedPlayers(d){
  return Object.keys(d.players||{}).map(function(u){return d.players[u]}).sort(function(a,b){return a.seat-b.seat});
}
function maybeStart(){
  if(!lobbyData||S||startingGame||lobbyData.started||lobbyData.hostUid!==user.uid)return;
  if(orderedPlayers(lobbyData).length===lobbyData.playerCount)startGame();
}
function startGame(){
  startingGame=true;
  var seated=orderedPlayers(lobbyData);   // i posti si assegnano a caso all'avvio
  shuffle(seated);
  var init=gameInitial(seated.map(function(p){return {uid:p.uid,name:p.name}}));
  init.v=0;
  roomRef.child('state').transaction(function(cur){if(cur!==null)return;return {v:0,s:JSON.stringify(init)}},function(err){
    if(err){startingGame=false;showErr('Errore durante l\'avvio: '+err.message);return}
    roomRef.child('lobby/started').set(true).catch(function(e){startingGame=false;showErr(e.message)});
  },false);
}

// ─────────────── STANZA ───────────────
function enterRoom(){
  setConn('Lobby');
  var lobbyRef=roomRef.child('lobby');
  var lh=function(snap){if(!snap.exists())return;lobbyData=snap.val();if(!S){render();maybeStart()}};
  lobbyRef.on('value',lh,function(e){showErr(e.message)});listeners.push({ref:lobbyRef,h:lh});
  var stateRef=roomRef.child('state');
  var sh=function(snap){
    if(!snap.exists())return;
    var raw=snap.val();
    try{S=JSON.parse(raw.s)}catch(e){showErr('Stato della stanza non leggibile.');return}
    me=S.uids.indexOf(user.uid);
    if(me<0){showErr('Non risulti tra i giocatori di questa partita.');return}
    setConn('Connesso');
    render();
  };
  stateRef.on('value',sh,function(e){showErr('Connessione persa: '+e.message)});listeners.push({ref:stateRef,h:sh});
  render();
}
function leave(dest){
  var go=function(){if(dest)window.location.href=dest;else window.location.reload()};
  listeners.forEach(function(l){l.ref.off('value',l.h)});
  if(!roomRef||S||!user){go();return}
  // prima dell'inizio libera il posto; a partita avviata si può rientrare con lo stesso codice
  roomRef.child('lobby').transaction(function(cur){
    if(!cur||cur.started)return;
    cur.players=cur.players||{};delete cur.players[user.uid];
    var rest=orderedPlayers(cur);
    if(cur.hostUid===user.uid&&rest.length)cur.hostUid=rest[0].uid;
    return cur;
  },function(){
    roomRef.child('members/'+user.uid).remove().catch(function(){}).then(go);
  },false);
}

// azioni: ogni azione è una transazione sullo stato, validata da gameReduce() sull'ultima versione
function act(a){
  if(!roomRef||me<0)return;
  var seat=me;
  roomRef.child('state').transaction(function(cur){
    if(!cur||!cur.s)return;
    var st;try{st=JSON.parse(cur.s)}catch(e){return}
    var r=gameReduce(st,seat,a);
    if(!r)return;
    r.v=(st.v||0)+1;
    return {v:r.v,s:JSON.stringify(r)};
  },function(err,committed){
    if(err)showErr('Errore di sincronizzazione: '+err.message);
    else if(!committed)setConn('Azione non più valida');
  },false);
}

function lobbyHtml(){
  var radios=GAME.counts.length<2?'':GAME.counts.map(function(n){
    return '<label><input type="radio" name="pc" value="'+n+'" '+(chosenCount===n?'checked':'')+'> '+n+' giocatori'+(GAME.countNote&&GAME.countNote[n]?' · '+GAME.countNote[n]:'')+'</label>';
  }).join('');
  return '<section><p class="muted">Sei connesso come <b>'+esc(playerName)+'</b>.</p>'+
    '<div class="panel"><h2>Crea una stanza</h2><p class="muted">'+GAME.lobbyNote+'</p>'+
    (radios?'<div class="radios" role="radiogroup" aria-label="Numero di giocatori">'+radios+'</div>':'')+
    '<button class="opt" id="createRoom" type="button" data-create="1">Crea stanza</button></div>'+
    '<div class="panel"><h2>Unisciti a una stanza</h2>'+
    '<input type="text" id="joinCode" maxlength="12" placeholder="Codice stanza" autocomplete="off" value="'+esc(joinVal)+'">'+
    '<button class="opt" type="button" data-join="1">Unisciti</button></div>'+
    '<p class="status" role="status" aria-live="polite">'+esc(statusText)+'</p>'+
    '<button class="btn btn-sm" type="button" data-ai="1">← Torna alla scelta</button></section>';
}
function connectingHtml(){
  return '<section><div class="panel"><p class="muted" role="status" aria-live="polite">'+esc(statusText||'Connessione alla stanza...')+'</p></div></section>';
}
function waitingHtml(){
  var d=lobbyData||{players:{},playerCount:GAME.counts[0]};
  var players=orderedPlayers(d),full=players.length===d.playerCount,html='';
  for(var seat=1;seat<=d.playerCount;seat++){
    var p=players[seat-1];
    html+='<li><span class="seat-n">'+seat+'.</span>'+
      (p?'<span class="grow">'+esc(p.name)+(p.uid===user.uid?' (tu)':'')+'</span>':'<span class="grow soft">In attesa di un giocatore</span>')+
      (p&&p.uid===d.hostUid?'<span class="flag first">HOST</span>':'')+'</li>';
  }
  return '<section><div class="panel"><h2>Stanza '+roomCode+'</h2><p class="muted">'+
    (d.started?'La partita si sta caricando...':players.length+' / '+d.playerCount+' giocatori'+(full?' · avvio in corso':' · condividi il codice con gli altri'))+
    '</p><ul class="roster">'+html+'</ul></div></section>';
}
function kitMenuHtml(){
  var extra=typeof gameMenu==='function'?gameMenu():'';
  return '<div class="menu-wrap"><button class="hamb" type="button" data-menu="1" aria-label="Opzioni" aria-expanded="'+MENUOPEN+'"><svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 1h16M1 7h16M1 13h16"/></svg></button>'+
    (MENUOPEN?'<div class="menu-pop">'+extra+'</div>':'')+'</div>';
}
function render(){
  document.body.classList.toggle('a11y',!!(typeof OPT!=='undefined'&&OPT.a11y));
  var focus=document.activeElement&&document.activeElement.id==='joinCode';
  var badge=S&&typeof gameBadge==='function'?gameBadge():'';
  var top='<div class="topbar"><div class="logo">'+GAME.logo+'</div>'+
    (window.nyloBackBtn?nyloBackBtn(location.pathname,'alle opzioni del gioco'):'')+(window.nyloHomeBtn?nyloHomeBtn():'')+
    (badge?'<span class="badge">'+badge+'</span>':'')+kitMenuHtml()+'</div>'+
    (roomRef?'<div class="room-bar"><span class="room-code">'+roomCode+'</span><button class="btn btn-sm" type="button" data-copy="1">Copia codice</button><button class="btn btn-sm" type="button" data-leave="1">Esci</button><span class="conn" id="conn">'+esc(connText)+'</span></div>':'');
  var body=!roomRef?(connecting?connectingHtml():lobbyHtml()):(!S?waitingHtml():gameRender());
  document.getElementById('app').innerHTML=top+body;
  if(focus){var j=document.getElementById('joinCode');if(j){j.focus();j.setSelectionRange(j.value.length,j.value.length)}}
}
var APP=document.getElementById('app');
APP.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b||b.disabled)return;
  var d=b.dataset;
  if(d.back!==undefined){e.stopPropagation();if(!S||confirm('Tornare alle opzioni del gioco? Potrai rientrare nella stanza con lo stesso codice.'))leave(location.pathname);return}
  if(d.menu){MENUOPEN=!MENUOPEN;render();return}
  if(d.ai!==undefined){location.href=location.pathname;return}
  if(d.create!==undefined){createRoom();return}
  if(d.join!==undefined){joinRoom();return}
  if(d.leave!==undefined){if(!S||confirm('Uscire dalla stanza? Potrai rientrare con lo stesso codice.'))leave();return}
  if(d.copy!==undefined){
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(roomCode).then(function(){setConn('Codice copiato')});
    else window.prompt('Copia il codice stanza:',roomCode);
    return;
  }
  if(S&&typeof gameClick==='function')gameClick(b);
});
APP.addEventListener('input',function(e){if(e.target.id==='joinCode'){joinVal=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'');e.target.value=joinVal}});
APP.addEventListener('keydown',function(e){if(e.target.id==='joinCode'&&e.key==='Enter')joinRoom()});
APP.addEventListener('change',function(e){
  if(e.target.name==='pc'){chosenCount=Number(e.target.value);return}
  if(typeof gameChange==='function')gameChange(e);
});
document.addEventListener('click',function(e){if(MENUOPEN&&!e.target.closest('.menu-wrap')){MENUOPEN=false;render()}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&MENUOPEN){MENUOPEN=false;render()}});
connecting=!!(window.NYLO_START&&NYLO_START.mode==='room');
render();
if(window.NYLO_START&&NYLO_START.mode==='room'){chosenCount=NYLO_START.n||chosenCount;if(NYLO_START.name)playerName=NYLO_START.name.slice(0,18);if(NYLO_START.action==='join'){joinVal=NYLO_START.code||'';joinRoom()}else createRoom();}

</script>
<style id="sx-css">
.sx-card{background:var(--surface);border:2px solid var(--steel);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:12px;color:var(--text)}
.sx-label{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--text-soft);margin-top:2px}
.sx-row{display:flex;gap:8px;flex-wrap:wrap}
.sx-opt{padding:10px 16px;border-radius:7px;border:1px solid var(--border);background:var(--surface-raised);color:var(--text);cursor:pointer;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;transition:border-color .12s,background .12s}
.sx-opt:hover:not(:disabled){border-color:var(--accent)}
.sx-opt.on{border-color:var(--accent);background:var(--accent);color:#13222b;font-weight:600}
.sx-opt.on:hover:not(:disabled){background:var(--accent);filter:brightness(1.1);border-color:var(--accent)}
.sx-opt:disabled{opacity:.4;cursor:not-allowed}
.sx-row .sx-opt{flex:1 1 0;min-width:0}
.sx-go{background:var(--accent);border-color:var(--accent);color:#13222b;font-weight:600;margin-top:1rem}
.sx-go:hover:not(:disabled){filter:brightness(1.1);border-color:var(--accent)}
.sx-in{background:#fff;border:1px solid var(--border);color:#222;border-radius:6px;padding:10px 12px;font-family:'Inter',sans-serif;font-size:14px;width:100%;outline:none}
.sx-in:focus{border-color:var(--accent)}
.sx-in.code{letter-spacing:2px;text-transform:uppercase;font-family:Consolas,monospace}
.sx-nav{display:flex;gap:8px;align-items:center;margin-left:auto}
.sx-nav .nylo-home{background:var(--surface-raised);color:var(--text);border-color:var(--border)}
.sx-nav .nylo-home:hover{border-color:var(--accent)}
.sx-sub{display:flex;flex-direction:column;gap:10px;padding-top:2px}
</style>
<script>
(function(){
  var P=window.NYLO_SETUP={id:'charms',logo:'<small>TAIKI SHINZAWA\'S</small>Charms',counts:[3,4]};
  var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  function run(id){var s=document.createElement('script');s.textContent=document.getElementById(id).textContent;document.body.appendChild(s)}
  window.addEventListener('hashchange',function(){location.reload()});
  window.NYLO_IN_SETUP=true;   // finché si sceglie, Home/Indietro escono senza avviso
  var app=document.getElementById('app');
  var st={n:P.counts[0],mode:location.hash==='#stanze'?'room':(location.hash==='#ai'?'ai':''),sub:'',code:'',name:''};
  var needName=false;
  try{
    st.name=localStorage.getItem('nylo-player-name')||'';
    var last=JSON.parse(localStorage.getItem(P.id+'-online-last')||'null');if(last&&last.code)st.code=last.code;
  }catch(e){}
  needName=!st.name;   // il nome arriva dalla sessione; il campo compare solo se manca
  // accesso rapido dalla home: #join=CODICE apre direttamente la stanza
  var jm=/^#join=([A-Za-z0-9]{12})$/.exec(location.hash);
  if(jm){st.mode='room';st.sub='join';st.code=jm[1].toUpperCase()}
  // #resume (dal pulsante Riprendi della lista): se c'è una partita salvata di questo gioco si rientra direttamente
  var rsm=null;
  if(location.hash==='#resume'){try{var sd=window.nyloSaveData&&nyloSaveData(P.id);if(sd){var sg=JSON.parse(sd);if(sg&&sg.n)rsm={n:sg.n}}}catch(e){}}
  function btn(attrs,cls,label,on){return '<button type="button" class="sx-opt '+cls+(on?' on':'')+'" '+attrs+'>'+label+'</button>'}
  function draw(){
    var h='<div class="topbar"><div class="logo">'+P.logo+'</div><div class="sx-nav">'+(window.nyloBackBtn?nyloBackBtn():'')+(window.nyloHomeBtn?nyloHomeBtn():'')+'</div></div>';
    h+='<div class="sx-card">';
    if(needName)h+='<label class="sx-label" for="sxName">IL TUO NOME</label><input class="sx-in" id="sxName" maxlength="16" placeholder="Il tuo nome" autocomplete="off" value="'+esc(st.name)+'">';
    if(P.counts.length>1){
      h+='<div class="sx-label">GIOCATORI</div><div class="sx-row">'+P.counts.map(function(n){return btn('data-n="'+n+'"','',n+' giocatori',st.n===n)}).join('')+'</div>';
    }
    h+='<div class="sx-label">MODALITÀ</div><div class="sx-row">'+btn('data-mode="ai"','','Contro l’AI',st.mode==='ai')+btn('data-mode="room"','','A stanze',st.mode==='room')+'</div>';
    if(st.mode==='ai'){
      h+='<div class="sx-sub"><div class="sx-row">'+btn('data-go="ai"','sx-go','Inizia',false)+'</div></div>';
    }else if(st.mode==='room'){
      h+='<div class="sx-label">OPZIONI STANZA</div><div class="sx-sub"><div class="sx-row">'+btn('data-sub="create"','','Crea nuova',st.sub==='create')+btn('data-sub="join"','','Unisciti',st.sub==='join')+'</div>';
      if(st.sub==='create')h+='<div class="sx-row">'+btn('data-go="create"','sx-go','Inizia',false)+'</div>';
      if(st.sub==='join')h+='<input class="sx-in code" id="sxCode" maxlength="12" placeholder="Codice stanza" autocomplete="off" value="'+esc(st.code)+'"><div class="sx-row"><button type="button" class="sx-opt sx-go" id="sxJoin" data-go="join" '+(st.code.length===12?'':'disabled')+'>Inizia</button></div>';
      h+='</div>';
    }
    h+='</div>';
    app.innerHTML=h;
  }
  function loadRoom(){
    var libs=['app','auth','database'].map(function(n){return 'https://www.gstatic.com/firebasejs/10.12.2/firebase-'+n+'-compat.js'});
    (function next(i){
      if(i===libs.length){run('src-room');return}
      var s=document.createElement('script');s.src=libs[i];s.onload=function(){next(i+1)};
      s.onerror=function(){app.innerHTML='<p style="padding:20px;color:#c00">Firebase non raggiungibile: controlla la connessione.</p>'};
      document.head.appendChild(s);
    })(0);
  }
  function go(kind){
    var nm=document.getElementById('sxName'),name=((nm&&nm.value)||st.name||'').trim().slice(0,16);
    window.NYLO_IN_SETUP=false;
    if(name){try{localStorage.setItem('nylo-player-name',name)}catch(e){}}
    var cfg={name:name,n:st.n};
    if(kind==='ai'){cfg.mode='ai';window.NYLO_START=cfg;run('src-ai');return}
    cfg.mode='room';cfg.action=kind;if(kind==='join')cfg.code=st.code;
    window.NYLO_START=cfg;app.innerHTML='';loadRoom();
  }
  app.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b||b.disabled)return;
    var d=b.dataset;
    if(d.n){st.n=Number(d.n);draw()}
    else if(d.mode){st.mode=d.mode;st.sub='';draw()}
    else if(d.sub){st.sub=d.sub;draw();var c=document.getElementById('sxCode');if(c)c.focus()}
    else if(d.go)go(d.go);
  });
  app.addEventListener('input',function(e){
    if(e.target.id==='sxName')st.name=e.target.value;
    else if(e.target.id==='sxCode'){
      st.code=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'');e.target.value=st.code;
      var j=document.getElementById('sxJoin');if(j)j.disabled=st.code.length!==12;
    }
  });
  app.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='sxCode'&&st.code.length===12)go('join')});
  if(rsm){window.NYLO_IN_SETUP=false;window.NYLO_START={mode:'ai',name:st.name,n:rsm.n,resume:true};run('src-ai');return}
  draw();
  if(jm&&!needName){try{history.replaceState(null,'',location.pathname+'#stanze')}catch(e){}go('join')}
})();
</script>
</body>
</html>
