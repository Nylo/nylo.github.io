  var name='';
  try{
    name=localStorage.getItem('nylo-player-name')||'';
    if(!name){var last=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');name=last&&last.name||''}
  }catch(e){}
  return String(name||'Giocatore').trim().slice(0,18)||'Giocatore';
}
var playerName=getPlayerName();
var db=null,user=null,roomRef=null,roomCode='',lobbyData=null,S=null,me=-1,listeners=[],startingGame=false;
var statusText='',connText='',joinVal='',chosenCount=GAME.counts[0],MENUOPEN=false;
try{var lastRoom=JSON.parse(localStorage.getItem(SAVE_KEY));if(lastRoom)joinVal=lastRoom.code||''}catch(e){}

function setStatus(t){statusText=t;render()}
function setConn(t){connText=t;var c=document.getElementById('conn');if(c)c.textContent=t}
function showErr(t){
  var e=document.getElementById('err');
  if(!e){e=document.createElement('div');e.id='err';e.className='err';e.setAttribute('role','alert');document.body.appendChild(e)}
  e.textContent=t;e.hidden=false;setConn('Errore');clearTimeout(showErr.t);showErr.t=setTimeout(function(){e.hidden=true},8000);
}
function genCode(){var b=new Uint8Array(12);crypto.getRandomValues(b);return Array.from(b,function(x){return ALPHABET[x%ALPHABET.length]}).join('')}
function withTimeout(p,ms,msg){
  return new Promise(function(res,rej){var t=setTimeout(function(){rej(new Error(msg))},ms);p.then(function(v){clearTimeout(t);res(v)},function(e){clearTimeout(t);rej(e)})});
}
function authMsg(e){
  if(e.code==='auth/operation-not-allowed')return 'Attiva il provider Anonimo in Firebase Authentication.';
  if(e.code==='auth/unauthorized-domain')return 'Dominio non autorizzato: aggiungilo in Authentication > Impostazioni > Domini autorizzati.';
  if(e.code==='auth/network-request-failed')return 'Firebase non raggiungibile: controlla la connessione e che il sito sia in HTTPS.';
  return e.message||'Errore di autenticazione Firebase.';
}
async function connect(){
  if(!window.firebase)throw new Error('Firebase non caricato. Controlla la connessione.');
  if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
  db=firebase.database();
  if(user)return;
  try{user=(await withTimeout(firebase.auth().signInAnonymously(),15000,'Autenticazione scaduta dopo 15 secondi.')).user}
  catch(e){throw new Error(authMsg(e))}
}
function saveLast(name){try{localStorage.setItem(SAVE_KEY,JSON.stringify({code:roomCode,name:name}))}catch(e){}}

// ─────────────── LOBBY ───────────────
async function createRoom(){
  try{
    setStatus('Connessione a Firebase...');await connect();
    var created=false,lastErr=null;
    for(var i=0;i<5&&!created;i++){
      roomCode=genCode();roomRef=db.ref('rooms/'+roomCode);
      try{
        await roomRef.child('hostUid').set(user.uid);
        await roomRef.child('members/'+user.uid).set(true);
        await roomRef.child('lobby').set({game:GAME.id,hostUid:user.uid,playerCount:chosenCount,started:false,closed:false,players:{}});
        created=true;
      }catch(e){lastErr=e;roomRef=null}
    }
    if(!created)throw lastErr||new Error('Impossibile creare la stanza. Verifica le regole del database.');
    await reserveSeat(playerName);
  }catch(e){roomRef=null;setStatus(e.message||'Errore durante la creazione della stanza.')}
}
async function joinRoom(){
  try{
    roomCode=joinVal.toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(roomCode.length!==12)throw new Error('Il codice stanza è di 12 caratteri.');
    setStatus('Connessione...');await connect();
    roomRef=db.ref('rooms/'+roomCode);
    await roomRef.child('members/'+user.uid).set(true);
    await reserveSeat(playerName);
  }catch(e){roomRef=null;setStatus(e.code==='PERMISSION_DENIED'?'Stanza non trovata o non accessibile.':(e.message||'Errore durante l\'accesso alla stanza.'))}
}
function reserveSeat(name){
  var lobbyRef=roomRef.child('lobby');
  return lobbyRef.once('value').then(function(snap){
    if(!snap.exists())throw new Error('Lobby non trovata: controlla il codice.');
    var initial=snap.val();
    if(initial.game!==GAME.id)throw new Error('Questo codice appartiene a un altro gioco.');
    return new Promise(function(resolve,reject){
      lobbyRef.transaction(function(cur){
        if(cur===null)cur=initial;
        if(!cur||!cur.playerCount||cur.closed)return;
        cur.players=cur.players||{};
        if(cur.players[user.uid])return cur;            // rientro: il posto è già tuo
        if(cur.started)return;
        var occ={};Object.keys(cur.players).forEach(function(u){occ[cur.players[u].seat]=true});
        var seat=1;while(seat<=cur.playerCount&&occ[seat])seat++;
        if(seat>cur.playerCount)return;
        cur.players[user.uid]={uid:user.uid,name:name,seat:seat};
        return cur;
      },function(err,committed,snap2){
        if(err){reject(err);return}
        var cur=snap2&&snap2.val();
        if(!cur||!cur.players||!cur.players[user.uid]){
          reject(new Error(cur&&cur.started?'La partita è già iniziata.':'La stanza è piena o non disponibile.'));return;
        }
        lobbyData=cur;saveLast(name);enterRoom();resolve();
      },false);
    });
  });
}
function orderedPlayers(d){
  return Object.keys(d.players||{}).map(function(u){return d.players[u]}).sort(function(a,b){return a.seat-b.seat});
}
function maybeStart(){
  if(!lobbyData||S||startingGame||lobbyData.started||lobbyData.hostUid!==user.uid)return;
  if(orderedPlayers(lobbyData).length===lobbyData.playerCount)startGame();
}
function startGame(){
  startingGame=true;
  var seated=orderedPlayers(lobbyData);   // i posti si assegnano a caso all'avvio
  shuffle(seated);
  var init=gameInitial(seated.map(function(p){return {uid:p.uid,name:p.name}}));
  init.v=0;
  roomRef.child('state').transaction(function(cur){if(cur!==null)return;return {v:0,s:JSON.stringify(init)}},function(err){
    if(err){startingGame=false;showErr('Errore durante l\'avvio: '+err.message);return}
    roomRef.child('lobby/started').set(true).catch(function(e){startingGame=false;showErr(e.message)});
  },false);
}

// ─────────────── STANZA ───────────────
function enterRoom(){
  setConn('Lobby');
  var lobbyRef=roomRef.child('lobby');
  var lh=function(snap){if(!snap.exists())return;lobbyData=snap.val();if(!S){render();maybeStart()}};
  lobbyRef.on('value',lh,function(e){showErr(e.message)});listeners.push({ref:lobbyRef,h:lh});
  var stateRef=roomRef.child('state');
  var sh=function(snap){
    if(!snap.exists())return;
    var raw=snap.val();
    try{S=JSON.parse(raw.s)}catch(e){showErr('Stato della stanza non leggibile.');return}
    me=S.uids.indexOf(user.uid);
    if(me<0){showErr('Non risulti tra i giocatori di questa partita.');return}
    setConn('Connesso');
    render();
  };
  stateRef.on('value',sh,function(e){showErr('Connessione persa: '+e.message)});listeners.push({ref:stateRef,h:sh});
  render();
}
function leave(){
  listeners.forEach(function(l){l.ref.off('value',l.h)});
  if(!roomRef||S||!user){window.location.reload();return}
  // prima dell'inizio libera il posto; a partita avviata si può rientrare con lo stesso codice
  roomRef.child('lobby').transaction(function(cur){
    if(!cur||cur.started)return;
    cur.players=cur.players||{};delete cur.players[user.uid];
    var rest=orderedPlayers(cur);
    if(cur.hostUid===user.uid&&rest.length)cur.hostUid=rest[0].uid;
    return cur;
  },function(){
    roomRef.child('members/'+user.uid).remove().catch(function(){}).then(function(){window.location.reload()});
  },false);
}

// azioni: ogni azione è una transazione sullo stato, validata da gameReduce() sull'ultima versione
function act(a){
  if(!roomRef||me<0)return;
  var seat=me;
  roomRef.child('state').transaction(function(cur){
    if(!cur||!cur.s)return;
    var st;try{st=JSON.parse(cur.s)}catch(e){return}
    var r=gameReduce(st,seat,a);
    if(!r)return;
    r.v=(st.v||0)+1;
    return {v:r.v,s:JSON.stringify(r)};
  },function(err,committed){
    if(err)showErr('Errore di sincronizzazione: '+err.message);
    else if(!committed)setConn('Azione non più valida');
  },false);
}

// ─────────────── RENDER ───────────────
function lobbyHtml(){
  var radios=GAME.counts.map(function(n){
    return '<label><input type="radio" name="pc" value="'+n+'" '+(chosenCount===n?'checked':'')+'> '+n+' giocatori'+(GAME.countNote&&GAME.countNote[n]?' · '+GAME.countNote[n]:'')+'</label>';
  }).join('');
  return '<section><p class="muted">Sei connesso come <b>'+esc(playerName)+'</b>.</p>'+
    '<div class="panel"><h2>Crea una stanza</h2><p class="muted">'+GAME.lobbyNote+'</p>'+
    '<div class="radios" role="radiogroup" aria-label="Numero di giocatori">'+radios+'</div>'+
    '<button class="opt" id="createRoom" type="button" data-create="1">Crea stanza</button></div>'+
    '<div class="panel"><h2>Unisciti a una stanza</h2>'+
    '<input type="text" id="joinCode" maxlength="12" placeholder="Codice stanza" autocomplete="off" value="'+esc(joinVal)+'">'+
    '<button class="opt" type="button" data-join="1">Unisciti</button></div>'+
    '<p class="status" role="status" aria-live="polite">'+esc(statusText)+'</p>'+
    '<button class="btn btn-sm" type="button" data-ai="1">← Torna alla scelta</button></section>';
}
function waitingHtml(){
  var d=lobbyData||{players:{},playerCount:GAME.counts[0]};
  var players=orderedPlayers(d),full=players.length===d.playerCount,html='';
  for(var seat=1;seat<=d.playerCount;seat++){
    var p=players[seat-1];
    html+='<li><span class="seat-n">'+seat+'.</span>'+
      (p?'<span class="grow">'+esc(p.name)+(p.uid===user.uid?' (tu)':'')+'</span>':'<span class="grow soft">In attesa di un giocatore</span>')+
      (p&&p.uid===d.hostUid?'<span class="flag first">HOST</span>':'')+'</li>';
  }
  return '<section><div class="panel"><h2>Stanza '+roomCode+'</h2><p class="muted">'+
    (d.started?'La partita si sta caricando...':players.length+' / '+d.playerCount+' giocatori'+(full?' · avvio in corso':' · condividi il codice con gli altri'))+
    '</p><ul class="roster">'+html+'</ul></div></section>';
}
function kitMenuHtml(){
  var extra=typeof gameMenu==='function'?gameMenu():'';
  return '<div class="menu-wrap"><button class="hamb" type="button" data-menu="1" aria-label="Opzioni" aria-expanded="'+MENUOPEN+'"><svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 1h16M1 7h16M1 13h16"/></svg></button>'+
    (MENUOPEN?'<div class="menu-pop">'+extra+'</div>':'')+'</div>';
}
function render(){
  document.body.classList.toggle('a11y',!!(typeof OPT!=='undefined'&&OPT.a11y));
  var focus=document.activeElement&&document.activeElement.id==='joinCode';
  var badge=S&&typeof gameBadge==='function'?gameBadge():'';
  var top='<div class="topbar"><div class="logo">'+GAME.logo+'</div>'+
    (window.nyloBackBtn?nyloBackBtn():'')+(window.nyloHomeBtn?nyloHomeBtn():'')+
    (badge?'<span class="badge">'+badge+'</span>':'')+
    (roomRef?'<span class="room-code">'+roomCode+'</span><button class="btn btn-sm" type="button" data-copy="1">Copia codice</button><button class="btn btn-sm" type="button" data-leave="1">Esci</button>':'')+
    '<span class="conn" id="conn">'+esc(connText)+'</span>'+kitMenuHtml()+'</div>';
  var body=!roomRef?lobbyHtml():(!S?waitingHtml():gameRender());
  document.getElementById('app').innerHTML=top+body;
  if(focus){var j=document.getElementById('joinCode');if(j){j.focus();j.setSelectionRange(j.value.length,j.value.length)}}
}
var APP=document.getElementById('app');
APP.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b||b.disabled)return;
  var d=b.dataset;
  if(d.menu){MENUOPEN=!MENUOPEN;render();return}
  if(d.ai!==undefined){location.href=location.pathname;return}
  if(d.create!==undefined){createRoom();return}
  if(d.join!==undefined){joinRoom();return}
  if(d.leave!==undefined){if(!S||confirm('Uscire dalla stanza? Potrai rientrare con lo stesso codice.'))leave();return}
  if(d.copy!==undefined){
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(roomCode).then(function(){setConn('Codice copiato')});
    else window.prompt('Copia il codice stanza:',roomCode);
    return;
  }
  if(S&&typeof gameClick==='function')gameClick(b);
});
APP.addEventListener('input',function(e){if(e.target.id==='joinCode'){joinVal=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'');e.target.value=joinVal}});
APP.addEventListener('keydown',function(e){if(e.target.id==='joinCode'&&e.key==='Enter')joinRoom()});
APP.addEventListener('change',function(e){
  if(e.target.name==='pc'){chosenCount=Number(e.target.value);return}
  if(typeof gameChange==='function')gameChange(e);
});
document.addEventListener('click',function(e){if(MENUOPEN&&!e.target.closest('.menu-wrap')){MENUOPEN=false;render()}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&MENUOPEN){MENUOPEN=false;render()}});
render();
if(window.NYLO_START&&NYLO_START.mode==='room'){chosenCount=NYLO_START.n||chosenCount;if(NYLO_START.name)playerName=NYLO_START.name.slice(0,18);if(NYLO_START.action==='join'){joinVal=NYLO_START.code||'';joinRoom()}else createRoom();}
</script>
<style id="sx-css">
.sx-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:12px;color:var(--text)}
.sx-label{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--text-soft);margin-top:2px}
.sx-row{display:flex;gap:8px;flex-wrap:wrap}
.sx-opt{padding:10px 16px;border-radius:7px;border:1px solid var(--border);background:var(--surface-raised);color:var(--text);cursor:pointer;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;transition:border-color .12s,background .12s}
.sx-opt:hover:not(:disabled){border-color:var(--accent)}
.sx-opt.on{border-color:var(--accent);background:var(--accent);color:#fff;font-weight:600}
.sx-opt:disabled{opacity:.4;cursor:not-allowed}
.sx-row .sx-opt{flex:1 1 0;min-width:0}
.sx-go{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;margin-top:1rem}
.sx-go:hover:not(:disabled){filter:brightness(1.1);border-color:var(--accent)}
.sx-in{background:#fff;border:1px solid var(--border);color:#222;border-radius:6px;padding:10px 12px;font-family:'Inter',sans-serif;font-size:14px;width:100%;outline:none}
.sx-in:focus{border-color:var(--accent)}
.sx-in.code{letter-spacing:2px;text-transform:uppercase;font-family:Consolas,monospace}
.sx-nav{display:flex;gap:8px;align-items:center;margin-left:auto}
.sx-sub{display:flex;flex-direction:column;gap:10px;padding-top:2px}
</style>
<script>
(function(){
  var P=window.NYLO_SETUP={id:'six-forces',logo:'<b>6</b> Forces',counts:[3,4]};
  var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  function run(id){var s=document.createElement('script');s.textContent=document.getElementById(id).textContent;document.body.appendChild(s)}
  window.addEventListener('hashchange',function(){location.reload()});
  window.NYLO_IN_SETUP=true;   // finché si sceglie, Home/Indietro escono senza avviso
  var app=document.getElementById('app');
  var st={n:P.counts[0],mode:location.hash==='#stanze'?'room':(location.hash==='#ai'?'ai':''),sub:'',code:'',name:''};
  var needName=false;
  try{
    st.name=localStorage.getItem('nylo-player-name')||'';
    var last=JSON.parse(localStorage.getItem(P.id+'-online-last')||'null');if(last&&last.code)st.code=last.code;
  }catch(e){}
  needName=!st.name;   // il nome arriva dalla sessione; il campo compare solo se manca
  function btn(attrs,cls,label,on){return '<button type="button" class="sx-opt '+cls+(on?' on':'')+'" '+attrs+'>'+label+'</button>'}
  function draw(){
    var h='<div class="topbar"><div class="logo">'+P.logo+'</div><div class="sx-nav">'+(window.nyloBackBtn?nyloBackBtn():'')+(window.nyloHomeBtn?nyloHomeBtn():'')+'</div></div>';
    h+='<div class="sx-card">';
    if(needName)h+='<label class="sx-label" for="sxName">IL TUO NOME</label><input class="sx-in" id="sxName" maxlength="16" placeholder="Il tuo nome" autocomplete="off" value="'+esc(st.name)+'">';
    if(P.counts.length>1){
      h+='<div class="sx-label">GIOCATORI</div><div class="sx-row">'+P.counts.map(function(n){return btn('data-n="'+n+'"','',n+' giocatori',st.n===n)}).join('')+'</div>';
    }
    h+='<div class="sx-label">MODALITÀ</div><div class="sx-row">'+btn('data-mode="ai"','','Contro l’AI',st.mode==='ai')+btn('data-mode="room"','','A stanze',st.mode==='room')+'</div>';
    if(st.mode==='ai'){
      h+='<div class="sx-sub"><div class="sx-row">'+btn('data-go="ai"','sx-go','Inizia',false)+'</div></div>';
    }else if(st.mode==='room'){
      h+='<div class="sx-label">OPZIONI STANZA</div><div class="sx-sub"><div class="sx-row">'+btn('data-sub="create"','','Crea nuova',st.sub==='create')+btn('data-sub="join"','','Unisciti',st.sub==='join')+'</div>';
      if(st.sub==='create')h+='<div class="sx-row">'+btn('data-go="create"','sx-go','Inizia',false)+'</div>';
      if(st.sub==='join')h+='<input class="sx-in code" id="sxCode" maxlength="12" placeholder="Codice stanza" autocomplete="off" value="'+esc(st.code)+'"><div class="sx-row"><button type="button" class="sx-opt sx-go" id="sxJoin" data-go="join" '+(st.code.length===12?'':'disabled')+'>Inizia</button></div>';
      h+='</div>';
    }
    h+='</div>';
    app.innerHTML=h;
  }
  function loadRoom(){
    var libs=['app','auth','database'].map(function(n){return 'https://www.gstatic.com/firebasejs/10.12.2/firebase-'+n+'-compat.js'});
    (function next(i){
      if(i===libs.length){run('src-room');return}
      var s=document.createElement('script');s.src=libs[i];s.onload=function(){next(i+1)};
      s.onerror=function(){app.innerHTML='<p style="padding:20px;color:#c00">Firebase non raggiungibile: controlla la connessione.</p>'};
      document.head.appendChild(s);
    })(0);
  }
  function go(kind){
    var nm=document.getElementById('sxName'),name=((nm&&nm.value)||st.name||'').trim().slice(0,16);
    window.NYLO_IN_SETUP=false;
    if(name){try{localStorage.setItem('nylo-player-name',name)}catch(e){}}
    var cfg={name:name,n:st.n};
    if(kind==='ai'){cfg.mode='ai';window.NYLO_START=cfg;run('src-ai');return}
    cfg.mode='room';cfg.action=kind;if(kind==='join')cfg.code=st.code;
    window.NYLO_START=cfg;app.innerHTML='';loadRoom();
  }
  app.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b||b.disabled)return;
    var d=b.dataset;
    if(d.n){st.n=Number(d.n);draw()}
    else if(d.mode){st.mode=d.mode;st.sub='';draw()}
    else if(d.sub){st.sub=d.sub;draw();var c=document.getElementById('sxCode');if(c)c.focus()}
    else if(d.go)go(d.go);
  });
  app.addEventListener('input',function(e){
    if(e.target.id==='sxName')st.name=e.target.value;
    else if(e.target.id==='sxCode'){
      st.code=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'');e.target.value=st.code;
      var j=document.getElementById('sxJoin');if(j)j.disabled=st.code.length!==12;
    }
  });
  app.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='sxCode'&&st.code.length===12)go('join')});
  draw();
})();
</script>
