<style>

.opt-toggle{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-soft);cursor:pointer;border:0;border-radius:20px;padding:4px 10px;user-select:none}

.recap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}

.recap-row{display:block;font-size:12px;line-height:1.7}
.recap-row > *{margin-right:6px}
.recap-row .lbl{font-weight:600;color:var(--text-soft)}

<body>
<div class="app" id="app"></div>

<script>
// ═════════════════════════ COSTANTI ═════════════════════════
const COLS = [
  {n:'Rosso',  icon:'circle'},
  {n:'Blu',    icon:'square'},
  {n:'Verde',  icon:'triangle'},
  {n:'Giallo', icon:'diamond'}
];
const MAXN = {3:10, 4:13};                               // numero massimo per colore (3 giocatori: 1–10, 4 giocatori: 1–13)
const TRICKS = 13;
const POS = {3:['bottom','left','right'], 4:['bottom','left','top','right']};
const NAMES = ['Tu','AI Kumo','AI Oni','AI Neko'];
const HUM = 0;
const HALF = ['Prima metà','Seconda metà'];
const ico = n => `<i class="ph-fill ph-${n}"></i>`;

// ═════════════════════════ UTILITÀ ═════════════════════════
const rnd = n => Math.floor(Math.random()*n);
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const ABORT = {abort:true};
let G = null, PR = null;
const OPT = {undo:true,a11y:false};
try{ const s=localStorage.getItem('ot-undo'); if(s!==null) OPT.undo=s==='1'; OPT.a11y=localStorage.getItem('ot-a11y')==='1'; }catch(e){}
const delay = ms => new Promise(r=>setTimeout(r,ms));
async function sleep(ms){ const g=G; await delay(ms); if(g!==G) throw ABORT; }
const P = i => G.pl[i];
function logMsg(t){ G.log.unshift(t); if(G.log.length>600) G.log.pop(); render(); }
function status(t){ G.msg=t; render(); }
const cname = c => `${COLS[c.s].n} ${c.r}`;

// ═════════════════════════ INTERAZIONE ═════════════════════════
async function ask(p,title,options){
  const ok=options.filter(x=>!x.disabled);
  if(!ok.length) return null;
  const g=G;
  return new Promise((res,rej)=>{ PR={type:'choose',title,options,res,rej}; render(); }).then(v=>{ if(g!==G) throw ABORT; return v; });
}
function askCard(legal,hint){
  const g=G;
  return new Promise((res,rej)=>{ PR={type:'card',legal:new Set(legal),hint,sel:null,res,rej}; render(); }).then(v=>{ if(g!==G) throw ABORT; return v; });
}
function answer(i){
  if(!PR||PR.type!=='choose') return;
  const o=PR.options[i]; if(!o||o.disabled) return;
  const r=PR.res; PR=null; render(); r(o.value);
}
function playIdx(i){
  if(!PR||PR.type!=='card'||!PR.legal.has(i)) return;
  if(OPT.undo){ PR.sel=i; render(); return; }
  const r=PR.res; PR=null; render(); r(i);
}
function confirmCard(ok){
  if(!PR||PR.type!=='card'||PR.sel==null) return;
  if(!ok){ PR.sel=null; render(); return; }
  const i=PR.sel, r=PR.res; PR=null; render(); r(i);
}

// ═════════════════════════ REGOLE (funzioni pure) ═════════════════════════
function fullDeck(n){
  const d=[];
  for(let s=0;s<4;s++) for(let r=1;r<=MAXN[n];r++) d.push({s,r});
  return d;
}
const sortHand = h => h.sort((a,b)=>a.s-b.s||a.r-b.r);
// obbligo di rispondere al colore di mano; altrimenti si gioca qualunque carta
function legalIdx(hand,lead){
  const all=hand.map((_,i)=>i);
  if(lead==null) return all;
  const same=all.filter(i=>hand[i].s===lead);
  return same.length?same:all;
}
// vince il numero più basso tra le carte di colore diverso da quello di mano (a parità l'ultimo a giocare); se tutte hanno il colore di mano vince il numero più basso
function winnerOf(table,lead){
  const off=table.filter(x=>x.c.s!==lead), pool=off.length?off:table;
  let w=pool[0];
  for(const x of pool) if(x.c.r<=w.c.r) w=x;
  return w.p;
}
const nCols = tops => tops.reduce((a,t)=>a+(t>0?1:0),0);
// penalità Oshaka obbligata: numero minore della cima della colonna; nella seconda metà anche un 4° colore
const forcedOsh = (tops,c,r2) => c.r<tops[c.s] || (r2 && tops[c.s]===0 && nCols(tops)>=3);
const scoreOf = (tops,pen,osh) => tops.reduce((a,t)=>a+t,0)-pen-osh;

// ═════════════════════════ AI ═════════════════════════
// Monte-Carlo con determinizzazione: le mani nascoste vengono campionate tra le carte non ancora viste (rispettando i colori che un giocatore ha mostrato di non avere), poi si simula il resto della metà con giocate casuali e piazzamenti euristici
const AIP = {S:36,RISK:0.5};
function unseen(me){
  const seen=new Set();
  P(me).hand.forEach(c=>seen.add(c.s*100+c.r));
  G.played.forEach(c=>seen.add(c.s*100+c.r));
  return fullDeck(G.n).filter(c=>!seen.has(c.s*100+c.r));
}
function sampleHands(me,pool){
  const pl=shuffle(pool.slice());
  const need=G.pl.map((p,i)=>i===me?0:p.hand.length);
  const hands=G.pl.map((p,i)=>i===me?p.hand.slice():[]);
  const rest=[];
  for(const c of pl){
    const el=[];
    for(let i=0;i<G.n;i++) if(i!==me&&hands[i].length<need[i]&&!G.void[i][c.s]) el.push(i);
    if(el.length) hands[el[rnd(el.length)]].push(c); else rest.push(c);
  }
  for(const c of rest){
    const el=[];
    for(let i=0;i<G.n;i++) if(i!==me&&hands[i].length<need[i]) el.push(i);
    if(el.length) hands[el[rnd(el.length)]].push(c);
  }
  return hands;
}
function mkSim(hands){
  return {hands:hands.map(h=>h.slice()),tops:G.pl.map(p=>p.tops.slice()),pen:G.pl.map(p=>p.pen),osh:G.pl.map(p=>p.oshSum),
    r2:G.round===1,base:G.pl.map(p=>p.r1||0)};
}
// euristica di piazzamento: true = carta punteggio, false = penalità coperta
function heurPlace(st,p,c){
  const top=st.tops[p][c.s], gain=c.r-top;
  let risk=0;
  for(const k of st.hands[p]) if(k.s===c.s&&k.r>top&&k.r<c.r) risk+=(k.r-1)*AIP.RISK;
  return gain+1>risk;
}
function simPlace(st,p,cards){
  const cs=cards.slice().sort((a,b)=>a.r-b.r);
  for(const c of cs){
    if(forcedOsh(st.tops[p],c,st.r2)) st.osh[p]+=c.r;
    else if(heurPlace(st,p,c)) st.tops[p][c.s]=c.r;
    else st.pen[p]++;
  }
}
function simTrickFrom(st,table,lead,order,from){
  for(let k=from;k<order.length;k++){
    const p=order[k], h=st.hands[p], lg=legalIdx(h,lead);
    const c=h.splice(lg[rnd(lg.length)],1)[0];
    if(lead==null) lead=c.s;
    table.push({p,c});
  }
  const w=winnerOf(table,lead);
  simPlace(st,w,table.map(x=>x.c));
  return w;
}
function simRest(st,leader){
  const n=st.hands.length;
  while(st.hands[leader].length){
    const order=Array.from({length:n},(_,i)=>(leader+i)%n);
    leader=simTrickFrom(st,[],null,order,0);
  }
}
// margine finale rispetto agli avversari (media e migliore)
function margin(st,me){
  const tot=st.hands.map((_,i)=>scoreOf(st.tops[i],st.pen[i],st.osh[i])+st.base[i]);
  const oth=tot.filter((_,i)=>i!==me);
  const mean=oth.reduce((a,b)=>a+b,0)/oth.length, mx=Math.max(...oth);
  return 0.5*(tot[me]-mean)+0.5*(tot[me]-mx);
}
function aiPickCard(p){
  const pl=P(p), lg=legalIdx(pl.hand,G.lead);
  if(lg.length===1) return lg[0];
  const pool=unseen(p), sc=lg.map(()=>0);
  const order=G.order, pos=order.indexOf(p);
  for(let s=0;s<AIP.S;s++){
    const hands=sampleHands(p,pool);
    lg.forEach((idx,j)=>{
      const st=mkSim(hands);
      const table=G.table.map(x=>({p:x.p,c:x.c}));
      const c=st.hands[p].splice(idx,1)[0];
      table.push({p,c});
      const w=simTrickFrom(st,table,G.lead==null?c.s:G.lead,order,pos+1);
      simRest(st,w);
      sc[j]+=margin(st,p);
    });
  }
  let b=0; for(let j=1;j<lg.length;j++) if(sc[j]>sc[b]) b=j;
  return lg[b];
}
// scelta tra carta punteggio e penalità per la carta i della presa (le precedenti sono già state applicate)
function aiPlaceChoice(w,cards,i){
  const c=cards[i], pool=unseen(w), rest=cards.slice(i+1);
  const S=P(w).hand.length?AIP.S:1;
  let a=0,b=0;
  for(let s=0;s<S;s++){
    const hands=sampleHands(w,pool);
    for(const opt of [true,false]){
      const st=mkSim(hands);
      if(opt) st.tops[w][c.s]=c.r; else st.pen[w]++;
      simPlace(st,w,rest);
      simRest(st,w);
      if(opt) a+=margin(st,w); else b+=margin(st,w);
    }
  }
  return a>=b;
}

function toSetup(){ if(PR){ const r=PR.rej; PR=null; r(ABORT); } G=null; render(); }
function newMatch(n){
  if(PR){ const r=PR.rej; PR=null; r(ABORT); }
  G={n,round:0,start:rnd(n),msg:'',log:[],over:null,
     table:[],lead:null,order:[],leader:0,turn:-1,win:-1,fresh:-1,trickNo:0,played:[],show:null,void:[],
     pl:Array.from({length:n},(_,i)=>({id:i,name:NAMES[i],hand:[],tops:[0,0,0,0],cnt:[0,0,0,0],pen:0,osh:[],oshSum:0,r1:null,r2:null}))};
  run();
}
function deal(){
  const deck=shuffle(fullDeck(G.n));
  if(G.n===3) deck.pop();                                // 3 giocatori: una carta scartata coperta
  G.pl.forEach((p,i)=>{ p.hand=sortHand(deck.slice(i*TRICKS,(i+1)*TRICKS)); p.tops=[0,0,0,0]; p.cnt=[0,0,0,0]; p.pen=0; p.osh=[]; p.oshSum=0; });
  G.played=[]; G.table=[]; G.lead=null; G.win=-1; G.show=null; G.turn=-1; G.trickNo=0; G.fresh=-1;
  G.void=Array.from({length:G.n},()=>[false,false,false,false]);
}
async function humanTurn(){
  const pl=P(HUM), lg=legalIdx(pl.hand,G.lead);
  const hint=G.lead==null?'Sei di mano: gioca la carta che vuoi.'
    :(pl.hand.some(c=>c.s===G.lead)?`Devi rispondere al colore ${COLS[G.lead].n}.`:`Non hai il colore ${COLS[G.lead].n}: puoi giocare ciò che vuoi.`);
  return askCard(lg,hint);
}
async function oneTrick(){
  G.trickNo++; G.table=[]; G.lead=null; G.win=-1; G.fresh=-1;
  G.order=Array.from({length:G.n},(_,i)=>(G.leader+i)%G.n);
  for(const p of G.order){
    G.turn=p;
    const pl=P(p);
    status(`Presa ${G.trickNo}/${TRICKS} · di mano: ${P(G.leader).name}. Tocca a ${pl.name}.`);
    let idx;
    if(p===HUM) idx=await humanTurn();
    else{ await sleep(700); idx=aiPickCard(p); }
    const c=pl.hand.splice(idx,1)[0];
    G.table.push({p,c}); G.played.push(c); G.fresh=p;
    if(G.lead==null) G.lead=c.s;
    else if(c.s!==G.lead) G.void[p][G.lead]=true;
    logMsg(`${pl.name} gioca ${cname(c)}.`);
  }
  G.turn=-1;
  const w=winnerOf(G.table,G.lead), wc=G.table.find(x=>x.p===w).c, pw=P(w);
  G.win=w;
  const m=`${pw.name} vince la presa con ${cname(wc)} e prende ${G.n} carte.`;
  status(m); logMsg(m);
  await sleep(1500);
  await resolveTrick(w);
  G.leader=w;
}
// il vincitore sistema le carte della presa dalla più piccola: punteggio, penalità coperta o Oshaka obbligata
async function resolveTrick(w){
  const pw=P(w), r2=G.round===1;
  const cs=G.table.map(x=>x.c).sort((a,b)=>a.r-b.r);
  for(let i=0;i<cs.length;i++){
    const c=cs[i], col=COLS[c.s].n;
    if(forcedOsh(pw.tops,c,r2)){
      const why=c.r<pw.tops[c.s]?`è più piccola della cima ${pw.tops[c.s]} della colonna ${col}`:`è il 4° colore`;
      pw.osh.push(c); pw.oshSum+=c.r;
      logMsg(`${pw.name}: ${cname(c)} ${why} → penalità OSHAKA (−${c.r}).`);
      continue;
    }
    let A;
    if(w===HUM){
      const top=pw.tops[c.s];
      status(`Hai preso la presa: sistema le carte, dalla più piccola (${i+1}/${cs.length}).`);
      A=await ask(HUM,`Carta ${cname(c)}: come la sistemi?`,[
        {label:`Carta punteggio: colonna ${col} ${top?`da ${top} a ${c.r} (${c.r-top>=0?'+':''}${c.r-top} punti)`:`con ${c.r} (+${c.r} punti)`}`,value:true},
        {label:'Penalità coperta (−1 punto)',value:false}]);
    }else A=aiPlaceChoice(w,cs,i);
    if(A){ pw.tops[c.s]=c.r; pw.cnt[c.s]++; logMsg(`${pw.name} mette ${cname(c)} come carta punteggio (colonna ${col}: ${c.r}).`); }
    else{ pw.pen++; logMsg(`${pw.name} mette ${cname(c)} come penalità coperta (−1).`); }
  }
  G.table=[];
  render();
  if(w!==HUM) await sleep(600);
}
async function tricks(){
  G.leader=G.start;
  for(let t=0;t<TRICKS;t++) await oneTrick();
  G.win=-1; G.turn=-1; G.table=[]; G.lead=null;
}
async function scoring(){
  const rows=G.pl.map(pl=>{
    const cardsPts=pl.tops.reduce((a,t)=>a+t,0), total=cardsPts-pl.pen-pl.oshSum;
    if(G.round===0) pl.r1=total; else pl.r2=total;
    return {p:pl.id,cardsPts,pen:pl.pen,osh:pl.oshSum,total};
  });
  G.show={rows};
  rows.forEach(r=>logMsg(`${HALF[G.round]}: ${P(r.p).name} ${r.cardsPts} (carte) − ${r.pen} (penalità) − ${r.osh} (Oshaka) = ${r.total}.`));
  status(`${HALF[G.round]} conclusa.`);
  await ask(HUM,'Risultato',[{label:G.round===0?'Vai alla seconda metà':'Vedi il risultato finale',value:1}]);
  G.show=null;
}
const totalOf = pl => (pl.r1||0)+(pl.r2||0);
function winners(){
  const t=G.pl.map(totalOf), mx=Math.max(...t);
  return G.pl.filter((p,i)=>t[i]===mx).map(p=>p.id);
}
// seconda metà: il giocatore col punteggio più basso (a pari merito a sorte) sceglie chi inizia
async function chooseStart(){
  const mn=Math.min(...G.pl.map(p=>p.r1));
  const low=G.pl.filter(p=>p.r1===mn);
  const ch=low[rnd(low.length)].id;
  if(ch===HUM){
    const o=G.pl.map(p=>({label:p.id===HUM?'Inizio io':`Inizia ${p.name}`,value:p.id}));
    const s=await ask(HUM,'Hai il punteggio più basso: scegli chi inizia la seconda metà',o);
    logMsg(`${P(HUM).name} (punteggio più basso) sceglie ${s===HUM?'se stesso':P(s).name} come primo giocatore.`);
    return s;
  }
  logMsg(`${P(ch).name} (punteggio più basso) sceglie se stesso come primo giocatore.`);
  return ch;
}
async function run(){
  const g=G;
  try{
    for(let k=0;k<2;k++){
      g.round=k;
      deal();
      if(k===1) g.start=await chooseStart();
      logMsg(`— ${HALF[k]}: primo giocatore ${P(g.start).name}${g.n===3?' (una carta tolta coperta dal mazzo)':''} —`);
      status(g.start===HUM?'Sei tu il primo giocatore.':`Primo giocatore: ${P(g.start).name}.`);
      await ask(HUM,`${HALF[k]}${k===1?' · regola in più: un 4° colore diventa penalità Oshaka':''}. ${g.start===HUM?'Sei tu il primo giocatore':'Primo giocatore: '+P(g.start).name}`,[{label:'Ok, si parte',value:1}]);
      await tricks();
      await scoring();
    }
    g.over={winners:winners()};
    render();
  }catch(e){
    if(e===ABORT||g!==G) return;
    console.error(e); G.log.unshift('Errore: '+e.message); render();
  }
}

const RULES_HTML = `
<details class="rules"><summary>REGOLAMENTO</summary>
<div class="rtext">
<h4>Introduzione</h4>
<p>«Se sei troppo avido, potresti rovinarti…?» OSHAKA Trick è un gioco di prese in cui devi decidere se mettere a punteggio le carte conquistate oppure accettare una piccola penalità per evitarne di enormi più avanti. Vincere una presa non è sempre un vantaggio. Sopravvivi alle 13 prese infernali e punta alla vittoria!</p>
<h4>Panoramica</h4>
<p>La partita è composta da 2 metà (Prima metà e Seconda metà) di 13 prese ciascuna. Nella seconda metà viene aggiunta una piccola regola. Vince il giocatore con il punteggio totale più alto.</p>
<h4>1. Preparazione</h4>
<ul>
<li>3 giocatori (39 carte): numeri 1-10 di tutti e 4 i colori (40 carte), una carta viene tolta coperta senza guardarla.</li>
<li>4 giocatori (52 carte): tutte le carte, numeri 1-13 dei 4 colori (rosso, blu, verde, giallo).</li>
<li>Si distribuiscono 13 carte coperte a testa: è la tua mano. Il primo giocatore (di mano) si sceglie a caso.</li>
</ul>
<h4>2. Come si gioca una presa</h4>
<p>Partendo dal giocatore di mano e procedendo in senso orario, ognuno gioca esattamente 1 carta. Il giocatore di mano sceglie una carta qualsiasi e la gioca scoperta. Gli altri devono rispondere al colore della prima carta: se hai una carta dello stesso colore DEVI giocarne una; se non ce l'hai puoi giocare QUALSIASI carta. La presa finisce quando tutti hanno giocato.</p>
<p><i>Per i veterani:</i> si gioca «con obbligo di risposta» e «vince il numero più basso»; la briscola è «qualsiasi colore diverso da quello di mano» e «a parità vince chi ha giocato dopo».</p>
<h4>3. Vincere una presa</h4>
<ul>
<li><b>Tutte le carte dello stesso colore:</b> vince chi ha giocato il numero più basso.</li>
<li><b>Due o più colori:</b> tra le carte di colore <i>diverso</i> da quello di mano vince il numero più basso. A parità di numero più basso vince chi ha giocato dopo.</li>
</ul>
<p>Il vincitore prende tutte le carte giocate, le sistema davanti a sé secondo le regole di piazzamento e diventa il giocatore di mano della presa successiva.</p>
<h4>4. Regole di piazzamento</h4>
<p>Le carte vinte in una presa si sistemano una alla volta in ordine crescente (prima la più piccola). Le carte che non si possono mettere secondo l'ordine crescente (numero più piccolo della carta in cima alla colonna di quel colore) NON possono dare punti e diventano una pesante penalità obbligata, la «penalità Oshaka».</p>
<p>Le carte dello stesso colore si mettono in una colonna verticale, leggermente sovrapposte. Il numero più alto visibile in cima alla colonna di ogni colore è il tuo punteggio per quel colore.</p>
<h4>5. Sistemare le carte (punteggio o penalità)</h4>
<p>Quando vinci una presa, risolvi le carte una alla volta partendo dalla più piccola. Per ciascuna puoi scegliere:</p>
<ul>
<li><b>A. Carta punteggio:</b> la metti scoperta nella colonna del suo colore, in ordine crescente.</li>
<li><b>B. Penalità coperta:</b> la metti coperta davanti a te; vale −1 punto. Nessuno può guardare le carte coperte.</li>
</ul>
<h4>6. La penalità Oshaka</h4>
<p>Se prendi una carta più piccola della tua carta punteggio in cima alla colonna di quel colore, non puoi scegliere A o B: va messa di lato (in orizzontale) e il numero stampato diventa un punteggio negativo (ad esempio «4» = −4 punti). Consiglio: per evitare Oshaka devastanti è spesso saggio mettere intenzionalmente delle carte coperte come penalità (−1) per gestire le colonne, accettando una piccola perdita.</p>
<h4>7. Punteggio della metà</h4>
<p>Somma le <b>carte punteggio</b> (il numero più alto visibile di ogni colore), sottrai le <b>penalità coperte</b> (−1 ciascuna) e le <b>penalità Oshaka</b> (il numero di ciascuna carta). Esempio: 20 − 3 − 9 = 8.</p>
<h4>8. Fine della prima metà e inizio della seconda</h4>
<p>La prima metà finisce dopo aver sistemato le carte della 13ª presa. Si annotano i punteggi. Nella seconda metà si distribuiscono nuove mani; il giocatore con il punteggio più basso della prima metà (a pari merito a sorte) sceglie chi inizia.</p>
<p><b>Regola in più della seconda metà:</b> se ottieni una carta di un colore diverso dai 3 colori che hai già messo a punteggio (un 4° colore), anche questa diventa una penalità Oshaka! Se fissi un 3° colore a punteggio, la probabilità di prendere Oshaka nelle prese successive aumenta moltissimo.</p>
<h4>9. Fine della partita</h4>
<p>Anche la seconda metà (e la partita) finisce dopo aver sistemato le carte della 13ª presa. Si sommano i punteggi delle due metà: vince chi ha il totale più alto. In caso di parità si condivide la vittoria.</p>
<p><i>Interpretazioni nell'app:</i> la scelta del primo giocatore della prima metà è casuale (nessuno ha «aiutato per ultimo»). Quando è l'AI ad avere il punteggio più basso, sceglie se stessa come primo giocatore. Il colore «piazzato» per la regola del 4° colore è un colore con almeno una carta punteggio nella colonna.</p>
</div></details>`;

let LOGOPEN=false;
function logHtml(){
  return `<details class="log" ${LOGOPEN?'open':''}><summary>LOG DELLA PARTITA (${G.log.length})</summary><div class="logbody">${G.log.map(l=>`<div>${esc(l)}</div>`).join('')}</div></details>`;
}
document.getElementById('app').addEventListener('toggle',e=>{ if(e.target.matches&&e.target.matches('details.log')) LOGOPEN=e.target.open; },true);
let MENUOPEN=false;
function menuHtml(){
  return `<div class="menu-wrap"><button class="hamb" type="button" data-menu="1" aria-label="Opzioni" aria-expanded="${MENUOPEN}"><svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 1h16M1 7h16M1 13h16"/></svg></button>
    ${MENUOPEN?`<div class="menu-pop">
      <label class="opt-toggle" title="Chiede conferma e permette di annullare le carte giocate"><input type="checkbox" id="optUndo" ${OPT.undo?'checked':''}> Abilita annulla</label>
      <label class="opt-toggle" title="Aggiunge una filigrana ai colori per distinguerli senza i colori"><input type="checkbox" id="optA11y" ${OPT.a11y?'checked':''}> Modalità accessibile</label>
    </div>`:''}</div>`;
}
function render(){
  document.body.classList.toggle('a11y',OPT.a11y);
  const app=document.getElementById('app');
  const top=`<div class="topbar"><div class="logo"><small>Gioco di prese</small>Oshaka Trick</div>
    ${window.nyloBackBtn?nyloBackBtn():""}${nyloHomeBtn()}
    ${G&&!G.over?`<span class="badge">${HALF[G.round]}</span>`:''}
    ${G?`<button class="btn btn-sm" data-new="1">Nuova partita</button>`:''}
    ${menuHtml()}</div>`;
  let body='';
  if(G){
    const pos=POS[G.n];
    body=`<div class="table">${G.pl.map((p,i)=>seatHtml(i,pos[i])).join('')}${centerHtml()}</div>
      ${G.pl.some(p=>p.r1!=null)?`<div class="dock" style="position:static">${scoreTable()}</div>`:''}
      ${logHtml()}
      ${recapHtml()}
      ${RULES_HTML}`;
  }
  app.innerHTML=top+`<div class="dock">${dockHtml()}</div>`+body;
}

function askName(n){
  try{ if(localStorage.getItem('nylo-skip-name')==='1'){ NAMES[0]=localStorage.getItem('nylo-player-name')||'Nylo'; newMatch(n); return; } }catch(e){}
  let ov=document.getElementById('nameModal');
  if(!ov){ ov=document.createElement('div'); ov.id='nameModal'; ov.className='name-modal'; document.body.appendChild(ov); }
  let saved=''; try{ saved=localStorage.getItem('nylo-player-name')||''; }catch(e){}
  ov.innerHTML='<form class="name-box"><h3>Come ti chiami?</h3><p>Il tuo nome sostituirà «Tu» al tavolo.</p><input id="nameInput" maxlength="16" placeholder="Il tuo nome" autocomplete="off" value="'+esc(saved)+'"><div class="opts"><button class="opt" type="submit">Inizia la partita</button><button class="opt" type="button" data-cancel="1">Annulla</button></div></form>';
  ov.style.display='flex';
  const closeName=()=>{ ov.style.display='none'; };
  ov.onclick=e=>{ if(e.target===ov||e.target.hasAttribute('data-cancel')) closeName(); };
  ov.onkeydown=e=>{ if(e.key==='Escape') closeName(); };
  const f=ov.firstChild, inp=f.querySelector('input'); inp.focus(); inp.select();
  f.onsubmit=e=>{
    e.preventDefault();
    const v=inp.value.trim().slice(0,16)||'Tu';
    try{ localStorage.setItem('nylo-player-name',v); }catch(x){}
    NAMES[0]=v; ov.style.display='none'; newMatch(n);
  };
}
document.getElementById('app').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||b.disabled) return;
  if(b.dataset.menu){ MENUOPEN=!MENUOPEN; render(); return; }
  if(b.dataset.n){ const n=Number(b.dataset.n); if(G) newMatch(n); else askName(n); }
  else if(b.dataset.new){ if(confirm('Iniziare una nuova partita?')) toSetup(); }
  else if(b.dataset.i!==undefined) answer(Number(b.dataset.i));
  else if(b.dataset.p!==undefined) playIdx(Number(b.dataset.p));
  else if(b.dataset.cf!==undefined) confirmCard(b.dataset.cf==='1');
});
document.getElementById('app').addEventListener('change',e=>{
  if(e.target.id==='optA11y'){
    OPT.a11y=e.target.checked;
    try{ localStorage.setItem('ot-a11y',OPT.a11y?'1':'0'); }catch(err){}
    render(); return;
  }
  if(e.target.id!=='optUndo') return;
  OPT.undo=e.target.checked;
  try{ localStorage.setItem('ot-undo',OPT.undo?'1':'0'); }catch(err){}
  if(PR&&PR.type==='card'&&PR.sel!=null&&!OPT.undo){ const i=PR.sel,r=PR.res; PR=null; render(); r(i); return; }
  render();
});
document.addEventListener('click',e=>{ if(MENUOPEN&&!e.target.closest('.menu-wrap')){ MENUOPEN=false; render(); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&MENUOPEN){ MENUOPEN=false; render(); } });
render();

</script>
</body>
</html>
