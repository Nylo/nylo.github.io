<!DOCTYPE html>
<html lang="it" data-home-inline>
<head>
<script src="/auth-gate.js"></script>
<script src="/home-btn.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spy Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f1117;
  --surface:#1a1f2e;
  --surface-raised:#232840;
  --surface-hover:#2a3050;
  --accent:#5b8dd9;
  --accent-soft:rgba(91,141,217,0.13);
  --text:#fafafa;
  --text-soft:#dfdfdf;
  --success:#4caf7d;
  --warn:#e0a44a;
  --danger:#d96b6b;
  --border:rgba(255,255,255,0.07);
  --radius:10px;
  --cat:#4caf7d;
  --cat-soft:rgba(76,175,125,0.13);
  --bird:#d96b6b;
  --bird-soft:rgba(217,107,107,0.13);
  --c0:#d6457c;   /* carte rosa */
  --c1:#2f94d8;   /* carte azzurre */
  --cw:46px;
  --ch:68px;
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px}
.app{max-width:820px;margin:0 auto;padding:0 12px 48px}

/* ── TOPBAR ── */
.topbar{display:flex;align-items:center;gap:10px;padding:14px 0;margin-bottom:12px}
.logo{font-family:'Libre Baskerville',serif;font-size:19px;line-height:1.2;flex:1}
.logo span{color:var(--accent);font-style:italic}
.round-badge{background:var(--accent-soft);color:var(--accent);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600;white-space:nowrap}
.menu-wrap{position:relative;margin-left:auto}
.hamb{display:inline-flex;align-items:center;justify-content:center;width:34px;height:30px;border-radius:7px;background:transparent;color:var(--text-soft);border:1px solid var(--border);cursor:pointer}
.hamb:hover{background:var(--surface-raised);color:var(--text)}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);z-index:30;min-width:200px;display:flex;flex-direction:column;gap:4px;padding:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 10px 24px rgba(0,0,0,0.3)}
.btn{border:none;border-radius:7px;padding:8px 14px;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:7px;justify-content:center;transition:background 0.15s,transform 0.07s}
.btn:active{transform:scale(0.96)}
.btn:disabled{opacity:0.35;cursor:not-allowed;transform:none}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover:not(:disabled){background:#4a7cc5}
.btn-ghost{background:transparent;color:var(--text-soft);border:1px solid var(--border)}
.btn-ghost:hover:not(:disabled){background:var(--surface-raised);color:var(--text)}
.btn-sm{padding:5px 10px;font-size:12px}

/* ── PUNTEGGIO ── */
.score{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.score-team{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;display:flex;align-items:center;gap:10px}
.score-team .nm{font-family:'Libre Baskerville',serif;font-size:14px;flex:1}
.score-team.cat .nm{color:var(--cat)}
.score-team.bird .nm{color:var(--bird)}
.tile-chip{font-family:'Libre Baskerville',serif;font-size:11px;padding:4px 7px;border-radius:5px;border:1px solid var(--border);color:var(--text-soft);background:var(--bg)}
.score-team.cat .tile-chip.done{background:var(--cat-soft);border-color:rgba(76,175,125,0.4);color:var(--cat);text-decoration:line-through}
.score-team.bird .tile-chip.done{background:var(--bird-soft);border-color:rgba(217,107,107,0.4);color:var(--bird);text-decoration:line-through}
.tiles{display:flex;gap:4px}

/* ── DOCK ── */
.dock{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;min-height:84px;display:flex;flex-direction:column;gap:10px;justify-content:center}
.dock-msg{font-size:13px;line-height:1.5}
.dock-msg strong{font-weight:600}
.dock-sub{font-size:12px;color:var(--text-soft);line-height:1.5}
.section-title{font-size:11px;font-weight:600;color:var(--text-soft);letter-spacing:0.04em}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
.toggle{background:var(--bg);border:1px solid var(--border);color:var(--text-soft);border-radius:6px;padding:7px 12px;font-family:'Inter',sans-serif;font-size:12px;font-weight:500;cursor:pointer;transition:all 0.12s}
.toggle:hover:not(:disabled){border-color:rgba(91,141,217,0.4)}
.toggle:disabled{opacity:0.3;cursor:not-allowed;text-decoration:line-through}
.toggle.tile{font-family:'Libre Baskerville',serif;font-size:14px;padding:8px 16px}
.toggle.on{background:var(--accent-soft);border-color:rgba(91,141,217,0.45);color:var(--accent)}
.result{border-radius:var(--radius);padding:14px;text-align:center}
.result.cat{background:var(--cat-soft);border:1px solid rgba(76,175,125,0.4)}
.result.bird{background:var(--bird-soft);border:1px solid rgba(217,107,107,0.4)}
.result .t{font-family:'Libre Baskerville',serif;font-size:17px;margin-bottom:6px}
.result.cat .t{color:var(--cat)}
.result.bird .t{color:var(--bird)}
.result p{font-size:13px;color:var(--text-soft);line-height:1.5;margin-bottom:12px}

/* ── BADGES ── */
.flag{font-size:11px;padding:2px 6px;border-radius:4px;font-weight:500;white-space:nowrap;display:inline-block}
.flag-yes{background:rgba(76,175,125,0.12);color:var(--success)}
.flag-no{background:rgba(217,107,107,0.12);color:var(--danger)}
.flag-part{background:rgba(224,164,74,0.12);color:var(--warn)}
.flag-accent{background:var(--accent-soft);color:var(--accent)}

/* ── TAVOLO ── */
.table{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"top top top" "left center right" "bottom bottom bottom";gap:10px;background:radial-gradient(ellipse at center,#16302a 0%,#10201f 70%);border:1px solid var(--border);border-radius:14px;padding:12px}
.seat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;border-radius:10px;border:1px solid transparent;transition:border-color 0.15s,background 0.15s}
.seat.top{grid-area:top}
.seat.left{grid-area:left;justify-content:center}
.seat.right{grid-area:right;justify-content:center}
.seat.bottom{grid-area:bottom}
.seat.active{border-color:var(--accent);background:var(--accent-soft)}
.seat.winner{border-color:var(--success);background:var(--cat-soft)}
.seat-info{font-size:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;text-align:center}
.seat-info .nm{font-weight:600}
.seat.cat .nm{color:var(--cat)}
.seat.bird .nm{color:var(--bird)}
.hand{display:flex;gap:3px;justify-content:center;flex-wrap:wrap}
.hand.col{flex-direction:column;flex-wrap:nowrap;align-items:center}

/* carte */
.icard{width:var(--cw);height:var(--ch);border-radius:6px;border:2px solid rgba(255,255,255,0.85);display:flex;align-items:center;justify-content:center;font-family:'Libre Baskerville',serif;font-weight:700;font-size:20px;color:#fff;position:relative;flex-shrink:0;user-select:none}
.icard.c0{background:var(--c0)}
.icard.c1{background:var(--c1)}
.icard .corner{position:absolute;top:2px;left:4px;font-size:10px;font-family:'Inter',sans-serif}
.icard.back{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,0.14) 0 4px,transparent 4px 8px)}
.icard.back.c0{background-color:var(--c0)}
.icard.back.c1{background-color:var(--c1)}
.icard.sm{width:22px;height:34px;border-width:1px;border-radius:4px}
.icard.sm.side{width:34px;height:20px}
button.icard{cursor:pointer;padding:0;transition:transform 0.12s,box-shadow 0.12s}
button.icard:hover:not(:disabled){transform:translateY(-6px);box-shadow:0 6px 12px rgba(0,0,0,0.4)}
button.icard:disabled{cursor:default}
.icard.dim{opacity:0.45;filter:saturate(0.6)}
.icard.playable{box-shadow:0 0 0 2px var(--warn)}
.gap{width:14px;height:var(--ch);border:1px dashed var(--accent);background:var(--accent-soft);border-radius:4px;color:var(--accent);font-size:12px;cursor:pointer;padding:0}
.gap:hover{background:var(--accent);color:#fff}

/* centro */
.center{grid-area:center;display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:auto auto auto;align-items:center;justify-items:center;min-height:calc(var(--ch)*3 + 30px)}
.slot{min-height:var(--ch)}
.slot.s2{grid-column:2;grid-row:1}
.slot.s1{grid-column:1;grid-row:2}
.slot.s3{grid-column:3;grid-row:2}
.slot.s0{grid-column:2;grid-row:3}
.slot .icard.win{box-shadow:0 0 0 3px var(--success)}
.center-note{grid-column:2;grid-row:2;font-size:11px;color:var(--text-soft);text-align:center}

details.log{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-top:12px;font-size:12px;color:var(--text-soft);line-height:1.6}
details.log summary{cursor:pointer;font-weight:600;letter-spacing:0.05em}
.logbody{margin-top:8px;max-height:260px;overflow-y:auto;padding-right:6px}
.logbody div{border-bottom:1px solid var(--border);padding:1px 0}
details.rules{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-top:12px}
details.rules summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--text-soft);letter-spacing:0.04em}
details.rules ul{margin:10px 0 0 18px;font-size:12px;line-height:1.6;color:var(--text-soft)}

@media(max-width:560px){
  :root{--cw:27px;--ch:42px}
  .icard{font-size:13px;border-width:1px;border-radius:4px}
  .icard .corner{display:none}
  .icard.sm{width:14px;height:22px}
  .icard.sm.side{width:22px;height:13px}
  .gap{width:10px}
  .hand{gap:2px}
  .table{padding:8px;gap:6px}
  .seat{padding:4px}
  .score-team{flex-direction:column;align-items:flex-start;gap:6px}
}

[hidden]{display:none!important}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px;display:flex;flex-direction:column;gap:12px;color:var(--text)}
.panel h2{font-size:16px;font-weight:700}
.muted{color:var(--text-soft);font-size:12px;line-height:1.5}
body .app>section>p.muted{color:var(--topc,var(--text-soft));margin-bottom:10px}
.status{font-size:13px;min-height:20px;line-height:1.5;color:var(--topc,var(--text))}
.panel input[type=text]{background:#fff;border:1px solid var(--border);color:#222;border-radius:6px;padding:9px 11px;font-family:'Inter',sans-serif;font-size:14px;width:100%;outline:none;letter-spacing:1px}
.panel input[type=text]:focus{border-color:var(--accent)}
.radios{display:flex;gap:18px;flex-wrap:wrap;font-size:13px}
.radios label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.roster{list-style:none;display:flex;flex-direction:column;gap:8px}
.roster li{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface-raised);border:1px solid var(--border);border-radius:8px;font-size:13px}
.roster .seat-n{width:20px;color:var(--text-soft)}
.roster .grow{flex:1}
.roster .soft{color:var(--text-soft)}
.room-code{padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-family:Consolas,monospace;letter-spacing:1px;font-size:12px;color:var(--topc,var(--text));border-color:var(--topc,var(--border))}
.conn{font-size:11px;color:var(--topc,var(--text-soft))}
.err{position:fixed;left:12px;right:12px;bottom:12px;max-width:680px;margin:0 auto;padding:12px 14px;border:1px solid rgba(217,107,107,0.6);border-radius:8px;background:#3a1d22;color:#fff;font-size:13px;line-height:1.4;z-index:200}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt.on:disabled{opacity:1}
.hint+.hint{margin-top:4px}

.badge{background:var(--accent-soft);color:var(--accent);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600;white-space:nowrap}
.topbar{flex-wrap:wrap}
.opt{background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:9px 14px;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;cursor:pointer;text-align:center}
.opt:hover:not(:disabled){border-color:rgba(91,141,217,0.45)}
.flag.first{background:var(--accent-soft);color:var(--accent)}
.slot.p2{grid-column:2;grid-row:1}
.slot.p1{grid-column:1;grid-row:2}
.slot.p3{grid-column:3;grid-row:2}
.slot.p0{grid-column:2;grid-row:3}
.score-team .who{flex:1;min-width:0}
.score-team .sub{font-size:11px;color:var(--text-soft);margin-top:2px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script type="text/plain" id="src-ai">
// ─────────────── COSTANTI ───────────────
const TEAMS = [{name:'C.A.T.', cls:'cat'}, {name:'B.I.R.D.', cls:'bird'}];
const TILES = ['1/5','2/4','3/3'];
const NAMES = ['Tu','Avversario sx','Compagno','Avversario dx'];
// Posti in senso orario: 0 tu (basso), 1 sinistra, 2 compagno (alto), 3 destra.
const teamOf = i => i % 2;
const mates  = t => [t, t+2];
const pname  = i => NAMES[i];

let G = null;          // stato partita
let ui = {};           // stato del modulo scelta tile (solo per l'umano)
let gen = 0;           // invalida i timer di una partita precedente

const later = (fn, ms) => { const my = gen; setTimeout(()=>{ if(my===gen) fn(); }, ms); };
const rnd   = n => Math.floor(Math.random()*n);
const pick  = arr => arr[rnd(arr.length)];
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }

// ─────────────── LOGICA DI GIOCO ───────────────
function newGame(){
  gen++;
  G = {removed:[[],[]], start:rnd(4), over:null, round:1, history:[], log:[]};
  dealRound();
}

function logMsg(t){ G.log.unshift(t); if(G.log.length>600) G.log.pop(); }
function dealRound(){
  const deck=[];
  for(const c of [0,1]) for(let n=1;n<=24;n++) deck.push({c,n});
  shuffle(deck);
  Object.assign(G,{
    hands:[0,1,2,3].map(i=>deck.slice(i*11,i*11+11)),   // 4 carte restano inutilizzate
    phase:'tiles', tstep:0, prop:[null,null], tile:[null,null], low:[null,null],
    passed:[null,null,null,null], received:null,
    trick:[], leader:G.start, turn:G.start, won:[0,0,0,0], resolving:false, winnerSeat:null,
    result:null, msg:`Round ${G.round}: inizia ${pname(G.start)}. Si scelgono le Mission Tile.`
  });
  ui={tile:null, low:null, initFor:-1};
  logMsg(`— Round ${G.round}: inizia ${pname(G.start)} —`);
  render(); advance();
}

// Fase tile: Start Player propone, il giocatore alla sua sinistra propone,
// poi il compagno dello Start Player conferma/cambia, infine l'ultimo.
const tileActor = () => (G.start + G.tstep) % 4;

function tileTargets(t, pr){
  const [a,b] = pr.tile.split('/').map(Number);
  const [m0,m1] = mates(t), out = {};
  if(a===b){ out[m0]=a; out[m1]=b; }
  else { const lo = pr.low, hi = lo===m0 ? m1 : m0; out[lo]=a; out[hi]=b; }
  return out;
}
function targets(){
  const T=[];
  for(const t of [0,1]) Object.assign(T, tileTargets(t, {tile:G.tile[t], low:G.low[t]}));
  return T;
}
// obiettivo da mostrare in un seggio (proposta durante la scelta, definitivo dopo)
function seatTarget(p){
  if(G.phase==='tiles'){ const pr=G.prop[teamOf(p)]; return pr ? tileTargets(teamOf(p),pr)[p] : null; }
  return targets()[p];
}
function tileDesc(t){
  const pr=G.prop[t], tg=tileTargets(t,pr);
  return `[${pr.tile}] (${mates(t).map(p=>`${pname(p)} ${tg[p]}`).join(', ')})`;
}

function applyTile(p, tile, low){
  const t=teamOf(p), old=G.prop[t];
  const same = old && old.tile===tile && old.low===low;
  const verb = G.tstep<2 ? 'propone' : (same ? 'accetta' : 'cambia in');
  G.prop[t] = {tile, low};
  G.msg = `${pname(p)} ${verb} ${tileDesc(t)}.`;
  logMsg(G.msg);
  G.tstep++;
  if(G.tstep===4){
    G.tile = G.prop.map(x=>x.tile);
    G.low  = G.prop.map(x=>x.low);
    G.phase = 'exchange';
    for(const q of [1,2,3]) G.passed[q] = pick(G.hands[q]);   // AI: carta da passare a caso
    G.msg += ' Scegli una carta da passare al compagno.';
  }
  render(); advance();
}

// ── AI (per ora a caso). Sostituibile con logica migliore. ──
function aiTile(p){
  if(G.phase!=='tiles' || tileActor()!==p) return;
  const t=teamOf(p), pr=G.prop[t];
  if(G.tstep>=2 && Math.random()<0.5) return applyTile(p, pr.tile, pr.low);
  const tile = pick(TILES.filter(x=>!G.removed[t].includes(x)));
  const [a,b] = tile.split('/');
  applyTile(p, tile, a===b ? null : pick(mates(t)));
}
function aiPlay(p){
  if(G.phase!=='play' || G.turn!==p || G.resolving || G.trick.length>=4) return;
  const h=G.hands[p];
  playCard(p, Math.random()<0.5 ? 0 : h.length-1);
}

function advance(){
  if(G.phase==='tiles'){
    const p=tileActor();
    if(p===0){
      if(ui.initFor!==G.tstep){
        const pr=G.prop[0];
        ui={tile:pr?pr.tile:null, low:pr?pr.low:null, initFor:G.tstep};
        render();
      }
      return;
    }
    later(()=>aiTile(p), 1000);
  } else if(G.phase==='play'){
    if(G.resolving || G.trick.length>=4) return;
    if(G.turn!==0) later(()=>aiPlay(G.turn), 850);
  }
}

// ── azioni umane ──
function pickTileUi(x){
  if(ui.tile!==x) ui.low=null;
  ui.tile=x; render();
}
function pickLowUi(p){ ui.low=p; render(); }
function confirmTile(){
  if(G.phase!=='tiles' || tileActor()!==0 || !ui.tile) return;
  const [a,b]=ui.tile.split('/');
  if(a!==b && ui.low==null) return;
  applyTile(0, ui.tile, a===b ? null : ui.low);
}
function passCard(idx){
  if(G.phase!=='exchange') return;
  G.passed[0] = G.hands[0][idx];
  // scambio: ogni giocatore toglie la carta passata e riceve quella del compagno
  for(let p=0;p<4;p++) G.hands[p].splice(G.hands[p].indexOf(G.passed[p]),1);
  for(const p of [1,2,3]) G.hands[p].splice(rnd(G.hands[p].length+1),0,G.passed[(p+2)%4]);
  G.received = G.passed[2];
  logMsg(`Scambio di carte: passi il ${G.passed[0].n} ${colName(G.passed[0].c)}, ricevi il ${G.received.n} ${colName(G.received.c)} dal compagno.`);
  G.phase='insert';
  G.msg=`Il compagno ti ha passato il <strong>${G.received.n}</strong> ${G.received.c?'azzurro':'rosa'}. Scegli dove inserirlo nel portacarte.`;
  render();
}
function insertAt(pos){
  if(G.phase!=='insert') return;
  G.hands[0].splice(pos,0,G.received);
  G.received=null;
  G.phase='play';
  G.leader=G.turn=G.start;
  G.msg=`Si gioca: apre ${pname(G.start)}.`;
  render(); advance();
}
function humanPlay(idx){
  const len=G.hands[0].length;
  if(G.phase!=='play' || G.turn!==0 || G.resolving || G.trick.length>=4) return;
  if(idx!==0 && idx!==len-1) return;
  playCard(0, idx);
}

function playCard(p, idx){
  const [card]=G.hands[p].splice(idx,1);
  G.trick.push({p,card});
  logMsg(`${pname(p)} gioca ${card.n} ${colName(card.c)}.`);
  if(G.trick.length===4){
    const w=trickWinner();
    logMsg(`${pname(w)} vince la presa.`);
    G.resolving=true; G.winnerSeat=w;
    G.msg=`<strong>${pname(w)}</strong> vince la presa.`;
    render();
    later(()=>finishTrick(w), 1900);
    return;
  }
  G.turn=(p+1)%4;
  G.msg = G.turn===0 ? 'Tocca a te.' : `Tocca a ${pname(G.turn)}.`;
  render(); advance();
}

function trickWinner(){
  const lead=G.trick[0].card.c;
  const camouflage=G.trick.every(x=>x.card.c===lead);
  let best=G.trick[0];
  for(const x of G.trick){
    if(camouflage){ if(x.card.n<best.card.n) best=x; }
    else if(x.card.c===lead && (best.card.c!==lead || x.card.n>best.card.n)) best=x;
  }
  return best.p;
}

function finishTrick(w){
  G.won[w]++;
  G.trick=[]; G.resolving=false; G.winnerSeat=null; G.leader=G.turn=w;
  const r=evaluate();
  if(r){
    G.phase='roundEnd'; G.result=r;
    logMsg(r.reason==='sabotage'
      ? `Sabotaggio: ${pname(r.player)} supera il suo obiettivo, la missione ${G.tile[r.failed]} di ${TEAMS[r.failed].name} fallisce e ${TEAMS[r.winner].name} completa la sua (${G.tile[r.winner]}).`
      : `${TEAMS[r.winner].name} completa la missione ${G.tile[r.winner]}.`);
  }
  else if(!G.hands[0].length){ G.phase='roundEnd'; G.result=null; logMsg('Round concluso senza nessuna missione compiuta.'); }
  else G.msg = w===0 ? 'Hai vinto la presa: apri tu.' : `Apre ${pname(w)}.`;
  render(); advance();
}

function evaluate(){
  const T=targets(), c=G.won;
  for(const t of [0,1]){
    const over=mates(t).find(p=>c[p]>T[p]);
    if(over!=null) return {winner:1-t, failed:t, reason:'sabotage', player:over};
  }
  for(const t of [0,1]){
    if(mates(t).every(p=>c[p]===T[p])) return {winner:t, reason:'mission'};
  }
  return null;
}

function nextRound(){
  const r=G.result;
  if(r){
    G.removed[r.winner].push(G.tile[r.winner]);
    G.history.push({round:G.round, winner:r.winner, reason:r.reason});
    if(G.removed[r.winner].length===3){ G.over=r.winner; G.phase='gameEnd'; render(); return; }
  }
  G.start=(G.start+1)%4;   // il segnalino passa al giocatore alla sinistra
  G.round++;
  dealRound();
}

// ─────────────── RENDER ───────────────
const colName = c => c ? 'azzurro' : 'rosa';

function cardFace(card, extra=''){
  return `<span class="icard c${card.c} ${extra}"><span class="corner">${card.n}</span>${card.n}</span>`;
}
function cardBtn(card, idx, handler, cls, enabled){
  return `<button class="icard c${card.c} ${cls}" ${enabled?'':'disabled'} onclick="${handler}(${idx})" title="${card.n} ${colName(card.c)}"><span class="corner">${card.n}</span>${card.n}</button>`;
}

function scoreHtml(){
  return `<div class="score">${[0,1].map(t=>`<div class="score-team ${TEAMS[t].cls}">
    <span class="nm">${t===0?'Noi':'Loro'} · ${TEAMS[t].name}</span>
    <div class="tiles">${TILES.map(x=>`<span class="tile-chip ${G.removed[t].includes(x)?'done':''}">${x}</span>`).join('')}</div>
  </div>`).join('')}</div>`;
}

function dockHtml(){
  if(G.phase==='gameEnd'){
    const tm=TEAMS[G.over];
    return `<div class="result ${tm.cls}"><div class="t">${G.over===0?'Hai vinto!':'Hanno vinto gli avversari'} · ${tm.name}</div>
      <p>${tm.name} ha completato tutte e tre le missioni in ${G.history.length} round.</p>
      <button class="btn btn-primary" onclick="newGame()">Nuova partita</button></div>`;
  }
  if(G.phase==='roundEnd') return roundEndHtml();
  let html=`<div class="dock-msg">${G.msg}</div>`;
  if(G.phase==='tiles' && tileActor()===0) html+=tileForm();
  else if(G.phase==='tiles') html+=`<div class="dock-sub">${pname(tileActor())} sta scegliendo…</div>`;
  else if(G.phase==='exchange') html+=`<div class="dock-sub">Tocca una carta della tua mano per passarla al compagno.</div>`;
  else if(G.phase==='insert') html+=`<div class="dock-sub">Riceverai: ${cardFace(G.received,'sm')} — clicca uno spazio tratteggiato nella tua mano.</div>`;
  else if(G.phase==='play' && G.turn===0 && !G.resolving) html+=`<div class="dock-sub">Puoi giocare solo la carta più a sinistra o più a destra.</div>`;
  return html;
}

function tileForm(){
  const avail=TILES.filter(x=>!G.removed[0].includes(x));
  const finalizing=G.tstep>=2, pr=G.prop[0];
  const sel=ui.tile, [a,b]=sel?sel.split('/'):[];
  const ready = sel && (a===b || ui.low!=null);
  const unchanged = pr && pr.tile===sel && pr.low===(a===b?null:ui.low);
  const label = finalizing ? (unchanged ? 'Accetta' : 'Cambia') : 'Proponi';
  return `<div class="section-title">${finalizing?'IL COMPAGNO HA PROPOSTO — ACCETTA O CAMBIA':'LA TUA PROPOSTA DI MISSION TILE'}</div>
    <div class="toggles">${TILES.map(x=>`<button class="toggle tile ${sel===x?'on':''}" ${avail.includes(x)?'':'disabled'} onclick="pickTileUi('${x}')">${x}</button>`).join('')}</div>
    ${sel && a!==b ? `<div class="toggles">
      <button class="toggle ${ui.low===0?'on':''}" onclick="pickLowUi(0)">Tu ${a} · Compagno ${b}</button>
      <button class="toggle ${ui.low===2?'on':''}" onclick="pickLowUi(2)">Tu ${b} · Compagno ${a}</button></div>` : ''}
    <div><button class="btn btn-primary btn-sm" ${ready?'':'disabled'} onclick="confirmTile()">${label}</button></div>`;
}

function roundEndHtml(){
  const r=G.result;
  if(!r) return `<div class="result"><div class="t">Round concluso senza esito</div><p>Nessuna missione risulta completata.</p><button class="btn btn-primary" onclick="nextRound()">Prossimo round</button></div>`;
  const tm=TEAMS[r.winner], T=targets(), last=G.removed[r.winner].length===2;
  const why = r.reason==='mission'
    ? `Entrambi i compagni hanno vinto esattamente le prese richieste.`
    : `${pname(r.player)} ha vinto ${G.won[r.player]} prese contro un obiettivo di ${T[r.player]}: ${TEAMS[r.failed].name} fallisce.`;
  return `<div class="result ${tm.cls}">
    <div class="t">${r.reason==='mission'?'Missione compiuta':'Sabotaggio riuscito'} · ${tm.name}</div>
    <p>${why}<br>La tile ${G.tile[r.winner]} di ${tm.name} viene rimossa.</p>
    <button class="btn btn-primary" onclick="nextRound()">${last?'Mostra risultato finale':'Prossimo round'}</button></div>`;
}

function seatInfo(p){
  const tg=seatTarget(p), tm=TEAMS[teamOf(p)];
  let html=`<span class="nm">${pname(p)}</span>`;
  if(tg!=null){
    html+=`<span class="flag flag-accent">obiettivo ${tg}</span>`;
    if(G.phase!=='tiles'){
      const w=G.won[p];
      html+=`<span class="flag ${w>tg?'flag-no':w===tg?'flag-yes':'flag-part'}">prese ${w}/${tg}</span>`;
    }
  }
  return html;
}

function seatHtml(p, pos){
  const tm=TEAMS[teamOf(p)];
  const active = G.phase==='play' && !G.resolving && G.turn===p;
  const winner = G.winnerSeat===p;
  const h=G.hands[p];
  let hand;
  if(p===0) hand=humanHand();
  else if(pos==='top') hand=`<div class="hand">${h.map(c=>`<span class="icard sm back c${c.c}"></span>`).join('')}</div>`;
  else hand=`<div class="hand col">${h.map(c=>`<span class="icard sm side back c${c.c}"></span>`).join('')}</div>`;
  return `<div class="seat ${pos} ${tm.cls} ${active?'active':''} ${winner?'winner':''}">
    ${pos==='bottom'?'':`<div class="seat-info">${seatInfo(p)}</div>`}
    ${hand}
    ${pos==='bottom'?`<div class="seat-info">${seatInfo(p)}</div>`:''}
  </div>`;
}

function humanHand(){
  const h=G.hands[0], len=h.length;
  if(G.phase==='insert'){
    let out='';
    for(let i=0;i<=len;i++){
      out+=`<button class="gap" onclick="insertAt(${i})" title="Inserisci qui">▾</button>`;
      if(i<len) out+=cardFace(h[i]);
    }
    return `<div class="hand">${out}</div>`;
  }
  return `<div class="hand">${h.map((c,i)=>{
    if(G.phase==='exchange') return cardBtn(c,i,'passCard','',true);
    if(G.phase==='play'){
      const can = G.turn===0 && !G.resolving && G.trick.length<4 && (i===0||i===len-1);
      return cardBtn(c,i,'humanPlay', can?'playable':'dim', can);
    }
    return cardFace(c);
  }).join('')}</div>`;
}

function centerHtml(){
  const slots=[0,1,2,3].map(p=>{
    const x=G.trick.find(t=>t.p===p);
    return `<div class="slot s${p}">${x?cardFace(x.card, G.winnerSeat===p?'win':''):''}</div>`;
  }).join('');
  return `<div class="center">${slots}<div class="center-note">${G.phase==='play'?`Presa ${Math.min(G.won.reduce((a,b)=>a+b,0)+1,11)}/11`:''}</div></div>`;
}

let LOGOPEN=false;
const escL = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function logHtml(){
  return `<details class="log" ${LOGOPEN?'open':''}><summary>LOG DELLA PARTITA (${G.log.length})</summary><div class="logbody">${G.log.map(l=>`<div>${escL(l)}</div>`).join('')}</div></details>`;
}
let MENUOPEN=false;

}
function renderMode(){
  const app=document.getElementById('app');
  app.innerHTML=`<div class="topbar">
      <div class="logo">Spy <span>Team</span></div>
      ${window.nyloBackBtn?nyloBackBtn():""}${nyloHomeBtn()}

      <button class="btn btn-primary" type="button" data-mode-online="#stanze">Contro gli amici</button></div></div>`;

function render(){

  const app=document.getElementById('app');
  app.innerHTML=`
    <div class="topbar">
      <div class="logo">Spy <span>Team</span></div>

    </div>

    <details class="rules">

        <li>Squadre: tu e il compagno (C.A.T.) contro i due avversari (B.I.R.D.). Vince chi completa per primo le tre missioni.</li>

        <li>Vince la presa la carta più alta del colore della prima carta giocata. <strong>Camouflage:</strong> se le 4 carte hanno lo stesso colore vince la più bassa.</li>
        <li>Missione compiuta: entrambi i compagni hanno vinto esattamente le prese della tile. Sabotaggio: chi supera il proprio obiettivo fa fallire la sua missione e fa riuscire quella avversaria.</li>
        <li>Degli avversari vedi solo il colore delle carte, mai il numero. Gli avversari e il compagno per ora giocano a caso.</li>
      </ul>
    </details>`;
}

document.getElementById('app').addEventListener('toggle',e=>{ if(e.target.matches&&e.target.matches('details.log')) LOGOPEN=e.target.open; },true);
document.getElementById('app').addEventListener('click',e=>{
  if(e.target.closest('[data-start-ai]')) newGame();
  else if(e.target.closest('[data-menu]')){ MENUOPEN=!MENUOPEN; render(); }
  else if(e.target.closest('[data-new]')){ MENUOPEN=false; if(confirm('Iniziare una nuova partita?')) newGame(); else render(); }
});
document.addEventListener('click',e=>{ if(MENUOPEN&&!e.target.closest('.menu-wrap')){ MENUOPEN=false; render(); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&MENUOPEN){ MENUOPEN=false; render(); } });
render();
if(window.NYLO_START&&NYLO_START.mode==='ai'){NAMES[0]=NYLO_START.name||'Tu';newGame();}
</script>
<script type="text/plain" id="src-room">

// ═════════════════════════ SPY TEAM · STANZE ═════════════════════════
var GAME={id:'spy-team',logo:'Spy <span>Team</span> · Online',counts:[4],
  lobbyNote:'Servono 4 giocatori. Quando la stanza è piena, posti e squadre (C.A.T. e B.I.R.D.) vengono assegnati a caso: i compagni siedono uno di fronte all\'altro.'};
var TEAMS=[{name:'C.A.T.',cls:'cat'},{name:'B.I.R.D.',cls:'bird'}];
var TILES=['1/5','2/4','3/3'];
var teamOf=function(s){return s%2};
var mates=function(t){return [t,t+2]};
var cc=function(i){return i<24?0:1};          // colore della carta (0 rosa, 1 azzurro)
var cn=function(i){return i%24+1};            // numero della carta
var ui={key:'',tile:'',low:-1};

// ─────────────── REGOLE (funzioni pure, usate dentro le transazioni) ───────────────
function validDeck(d){
  if(!Array.isArray(d)||d.length!==48)return false;
  var seen={};for(var i=0;i<48;i++){var x=d[i];if(x!==(x|0)||x<0||x>47||seen[x])return false;seen[x]=1}return true;
}
function newDeck(){var d=[];for(var i=0;i<48;i++)d.push(i);return shuffle(d)}
function deal(w,deck){
  w.hands=[0,1,2,3].map(function(i){return deck.slice(i*11,i*11+11)});   // 4 carte restano da parte
  w.phase='tiles';w.tstep=0;w.ptile=['',''];w.plow=[-1,-1];w.tile=['',''];w.low=[-1,-1];
  w.passed=[-1,-1,-1,-1];w.recv=[-1,-1,-1,-1];w.won=[0,0,0,0];w.trick=[];w.winner=-1;w.result=null;
  w.turn=w.start;
  w.msg='Round '+w.round+': inizia '+w.names[w.start]+'. Si scelgono le Mission Tile.';
}
function gameInitial(players){
  var w={v:0,game:GAME.id,names:players.map(function(p){return p.name}),uids:players.map(function(p){return p.uid}),
    round:1,start:rnd(4),rem:[[],[]],over:-1};
  deal(w,newDeck());
  return w;
}
function tileTargets(t,tile,low){
  var ab=tile.split('/').map(Number),m=mates(t),o={};
  if(ab[0]===ab[1]){o[m[0]]=ab[0];o[m[1]]=ab[1]}
  else{var hi=low===m[0]?m[1]:m[0];o[low]=ab[0];o[hi]=ab[1]}
  return o;
}
function tileDesc(w,t,tile,low){
  var tg=tileTargets(t,tile,low);
  return '['+tile+'] ('+mates(t).map(function(p){return w.names[p]+' '+tg[p]}).join(', ')+')';
}
function targets(w){
  var T=[];for(var t=0;t<2;t++)Object.assign(T,tileTargets(t,w.tile[t],w.low[t]));return T;
}
function evaluate(w){
  var T=targets(w);
  for(var t=0;t<2;t++){
    var over=mates(t).filter(function(p){return w.won[p]>T[p]})[0];
    if(over!==undefined)return {winner:1-t,failed:t,reason:'sabotage',player:over};
  }
  for(var u=0;u<2;u++){
    if(mates(u).every(function(p){return w.won[p]===T[p]}))return {winner:u,reason:'mission'};
  }
  return null;
}
function trickWinner(trick){
  var lead=cc(trick[0].c),camo=trick.every(function(x){return cc(x.c)===lead}),best=trick[0];
  trick.forEach(function(x){
    if(camo){if(cn(x.c)<cn(best.c))best=x}
    else if(cc(x.c)===lead&&(cc(best.c)!==lead||cn(x.c)>cn(best.c)))best=x;
  });
  return best.p;
}

// Applica un'azione di `seat` allo stato. Restituisce il nuovo stato oppure null se non valida.
function gameReduce(w,seat,a){
  if(!w||seat<0||seat>3||!a)return null;
  var hand=w.hands[seat];
  switch(a.type){

  case 'tile':{
    if(w.phase!=='tiles'||(w.start+w.tstep)%4!==seat)return null;
    var t=teamOf(seat);
    if(TILES.indexOf(a.tile)<0||w.rem[t].indexOf(a.tile)>=0)return null;
    var ab=a.tile.split('/'),low=-1;
    if(ab[0]!==ab[1]){if(mates(t).indexOf(a.low)<0)return null;low=a.low}
    var same=w.ptile[t]===a.tile&&w.plow[t]===low;
    var verb=w.tstep<2?'propone':(same?'accetta':'cambia in');
    w.ptile[t]=a.tile;w.plow[t]=low;
    w.msg=w.names[seat]+' '+verb+' '+tileDesc(w,t,a.tile,low)+'.';
    w.tstep++;
    if(w.tstep===4){w.tile=w.ptile.slice();w.low=w.plow.slice();w.phase='exchange';w.passed=[-1,-1,-1,-1];w.msg+=' Ognuno sceglie una carta da passare al compagno.'}
    break;}

  case 'pass':{
    if(w.phase!=='exchange'||w.passed[seat]!==-1||hand.indexOf(a.card)<0)return null;
    w.passed[seat]=a.card;
    if(w.passed.every(function(x){return x!==-1})){
      for(var p=0;p<4;p++)w.hands[p].splice(w.hands[p].indexOf(w.passed[p]),1);
      for(var q=0;q<4;q++)w.recv[q]=w.passed[(q+2)%4];
      w.phase='insert';w.msg='Scambio fatto: ognuno inserisce la carta ricevuta dove preferisce.';
    }
    break;}

  case 'insert':{
    if(w.phase!=='insert'||w.recv[seat]===-1)return null;
    if(a.pos!==(a.pos|0)||a.pos<0||a.pos>hand.length)return null;
    hand.splice(a.pos,0,w.recv[seat]);w.recv[seat]=-1;
    if(w.recv.every(function(x){return x===-1})){
      w.phase='play';w.turn=w.start;w.trick=[];w.winner=-1;
      w.msg='Si gioca: apre '+w.names[w.start]+'.';
    }
    break;}

  case 'play':{
    if(w.phase!=='play'||w.turn!==seat||hand.length===0)return null;
    if(a.idx!==0&&a.idx!==hand.length-1)return null;
    if(w.trick.length===4){w.trick=[];w.winner=-1}
    var card=hand.splice(a.idx,1)[0];
    w.trick.push({p:seat,c:card});
    if(w.trick.length===4){
      var win=trickWinner(w.trick);
      w.won[win]++;w.winner=win;w.turn=win;
      var r=evaluate(w);
      if(r){w.phase='roundEnd';w.result=r;w.msg=w.names[win]+' vince la presa. Round concluso.'}
      else if(w.hands.every(function(h){return h.length===0})){w.phase='roundEnd';w.result=null;w.msg='Round concluso senza esito.'}
      else w.msg=w.names[win]+' vince la presa e apre la prossima.';
    }else{
      w.turn=(seat+1)%4;w.msg='Tocca a '+w.names[w.turn]+'.';
    }
    break;}

  case 'next':{
    if(w.phase!=='roundEnd'||!validDeck(a.deck))return null;
    var res=w.result;
    if(res){
      w.rem[res.winner].push(w.tile[res.winner]);
      if(w.rem[res.winner].length===3){w.phase='gameEnd';w.over=res.winner;w.msg='Partita conclusa.';break}
    }
    w.start=(w.start+1)%4;w.round++;
    deal(w,a.deck);
    break;}

  case 'rematch':{
    if(w.phase!=='gameEnd'||!validDeck(a.deck))return null;
    w.rem=[[],[]];w.over=-1;w.round=1;w.start=rnd(4);
    deal(w,a.deck);
    break;}

  default:return null;
  }
  return w;
}

// ─────────────── RENDER ───────────────
var colName=function(c){return c?'azzurro':'rosa'};
var cardFace=function(i,extra){return '<span class="icard c'+cc(i)+' '+(extra||'')+'"><span class="corner">'+cn(i)+'</span>'+cn(i)+'</span>'};
var cardBtn=function(i,idx,action,cls,enabled){
  return '<button class="icard c'+cc(i)+' '+cls+'" '+(enabled?'':'disabled')+' data-a="'+action+'" data-i="'+idx+'" title="'+cn(i)+' '+colName(cc(i))+'"><span class="corner">'+cn(i)+'</span>'+cn(i)+'</button>';
};
var seatAt=function(r){return (me+r)%4};
function gameBadge(){return S.phase==='gameEnd'?'Partita conclusa':'Round '+S.round}

function seatTarget(p){
  if(S.phase==='tiles'){var t=teamOf(p);return S.ptile[t]?tileTargets(t,S.ptile[t],S.plow[t])[p]:null}
  return targets(S)[p];
}
function scoreHtml(){
  return '<div class="score">'+[0,1].map(function(t){
    return '<div class="score-team '+TEAMS[t].cls+'"><div class="who"><div class="nm">'+TEAMS[t].name+'</div><div class="sub">'+
      mates(t).map(function(p){return esc(S.names[p])}).join(' · ')+'</div></div><div class="tiles">'+
      TILES.map(function(x){return '<span class="tile-chip '+(S.rem[t].indexOf(x)>=0?'done':'')+'">'+x+'</span>'}).join('')+'</div></div>';
  }).join('')+'</div>';
}
function tileForm(){
  var t=teamOf(me),mate=(me+2)%4,fin=S.tstep>=2;
  var avail=TILES.filter(function(x){return S.rem[t].indexOf(x)<0});
  var key=S.round+':'+S.tstep;
  if(ui.key!==key){ui={key:key,tile:fin?S.ptile[t]:'',low:fin?S.plow[t]:-1}}
  var ab=ui.tile?ui.tile.split('/'):[],split=ui.tile&&ab[0]!==ab[1];
  var ready=ui.tile&&(!split||ui.low!==-1);
  var unchanged=ui.tile===S.ptile[t]&&(split?ui.low:-1)===S.plow[t];
  var label=fin?(unchanged?'Accetta':'Cambia'):'Proponi';

      '<button class="toggle '+(ui.low===mate?'on':'')+'" data-a="uiLow" data-v="'+mate+'">Tu '+ab[1]+' · '+esc(S.names[mate])+' '+ab[0]+'</button></div>':'')+

function dockHtml(){
  var msg='<div class="dock-msg">'+esc(S.msg)+'</div>';
  if(S.phase==='gameEnd'){
    var tm=TEAMS[S.over],mine=teamOf(me)===S.over;
    return '<div class="result '+tm.cls+'"><div class="t">'+(mine?'Avete vinto!':'Hanno vinto gli avversari')+' · '+tm.name+'</div>'+
      '<p>'+mates(S.over).map(function(p){return esc(S.names[p])}).join(' e ')+' hanno completato tutte e tre le missioni.</p>'+

  }

    var r=S.result;

    var t2=TEAMS[r.winner],T=targets(S),last=S.rem[r.winner].length===2;
    var why=r.reason==='mission'?'Entrambi i compagni hanno vinto esattamente le prese richieste.':
      esc(S.names[r.player])+' ha vinto '+S.won[r.player]+' prese contro un obiettivo di '+T[r.player]+': '+TEAMS[r.failed].name+' fallisce.';
    return '<div class="result '+t2.cls+'"><div class="t">'+(r.reason==='mission'?'Missione compiuta':'Sabotaggio riuscito')+' · '+t2.name+'</div>'+
      '<p>'+why+'<br>La tile '+S.tile[r.winner]+' di '+t2.name+' viene rimossa.</p>'+
      '<button class="btn btn-primary" data-a="next">'+(last?'Mostra risultato finale':'Prossimo round')+'</button></div>';
  }
  var sub='';
  if(S.phase==='tiles'){
    var actor=(S.start+S.tstep)%4;
    if(actor===me)return msg+tileForm();
    sub=esc(S.names[actor])+' sta scegliendo…';
  }else if(S.phase==='exchange'){
    sub=S.passed[me]===-1?'Tocca una carta della tua mano per passarla al compagno.':'Carta scelta: aspetto gli altri giocatori…';
  }else if(S.phase==='insert'){
    sub=S.recv[me]!==-1?'Hai ricevuto '+cardFace(S.recv[me],'sm')+' — clicca uno spazio tratteggiato nella tua mano.':'Carta inserita: aspetto gli altri giocatori…';
  }else if(S.phase==='play'){
    sub=S.turn===me?'Tocca a te: puoi giocare solo la carta più a sinistra o più a destra.':'';
  }

function myHand(){
  var h=S.hands[me],len=h.length,out='';
  if(S.phase==='insert'&&S.recv[me]!==-1){
    for(var i=0;i<=len;i++){
      out+='<button class="gap" data-a="insert" data-i="'+i+'" title="Inserisci qui">▾</button>';
      if(i<len)out+=cardFace(h[i]);
    }
    return '<div class="hand">'+out+'</div>';
  }
  return '<div class="hand">'+h.map(function(c,i){
    if(S.phase==='exchange'){
      var picked=S.passed[me]===c;
      return cardBtn(c,i,'pass',picked?'playable':'',S.passed[me]===-1);
    }
    if(S.phase==='play'){
      var can=S.turn===me&&(i===0||i===len-1);
      return cardBtn(c,i,'play',can?'playable':'dim',can);
    }
    return cardFace(c);
  }).join('')+'</div>';
}
function seatHtml(seat,pos){
  var tg=seatTarget(seat),cls=TEAMS[teamOf(seat)].cls;
  var info='<span class="nm">'+esc(S.names[seat])+(seat===me?' (tu)':'')+'</span>';
  if(tg!=null){
    info+='<span class="flag flag-accent">obiettivo '+tg+'</span>';
    if(S.phase!=='tiles'){var w=S.won[seat];info+='<span class="flag '+(w>tg?'flag-no':w===tg?'flag-yes':'flag-part')+'">prese '+w+'/'+tg+'</span>'}
  }
  var active=S.phase==='play'&&S.turn===seat&&S.trick.length<4;
  var hand=S.hands[seat],body;
  if(seat===me)body=myHand();
  else if(pos==='top')body='<div class="hand">'+hand.map(function(c){return '<span class="icard sm back c'+cc(c)+'"></span>'}).join('')+'</div>';
  else body='<div class="hand col">'+hand.map(function(c){return '<span class="icard sm side back c'+cc(c)+'"></span>'}).join('')+'</div>';
  var winner=S.winner===seat&&S.trick.length===4;
  return '<div class="seat '+pos+' '+cls+' '+(active?'active':'')+' '+(winner?'winner':'')+'">'+
    (pos==='bottom'?body+'<div class="seat-info">'+info+'</div>':'<div class="seat-info">'+info+'</div>'+body)+'</div>';
}
function centerHtml(){
  var slots=[0,1,2,3].map(function(r){
    var seat=seatAt(r),x=S.trick.filter(function(t){return t.p===seat})[0];
    var win=S.trick.length===4&&S.winner===seat;
    return '<div class="slot p'+r+'">'+(x?cardFace(x.c,win?'win':''):'')+'</div>';
  }).join('');
  var played=S.won.reduce(function(a,b){return a+b},0);
  return '<div class="center">'+slots+'<div class="center-note">'+(S.phase==='play'?'Presa '+Math.min(played+(S.trick.length===4?0:1),11)+'/11':'')+'</div></div>';
}
function gameRender(){
  return scoreHtml()+'<div class="dock">'+dockHtml()+'</div>'+
    '<div class="table">'+seatHtml(seatAt(2),'top')+seatHtml(seatAt(1),'left')+centerHtml()+seatHtml(seatAt(3),'right')+seatHtml(seatAt(0),'bottom')+'</div>'+
    '<details class="rules"><summary>PROMEMORIA REGOLE</summary><ul>'+
    '<li>Due squadre da due: C.A.T. contro B.I.R.D., con i compagni seduti di fronte. Vince chi completa per primo le tre missioni.</li>'+
    '<li>Si può giocare solo la carta all\'estremo sinistro o destro del proprio portacarte, di qualsiasi colore.</li>'+
    '<li>Vince la presa la carta più alta del colore della prima carta giocata. <strong>Camouflage:</strong> se le 4 carte hanno lo stesso colore vince la più bassa.</li>'+
    '<li>Missione compiuta: entrambi i compagni hanno vinto esattamente le prese della tile. Sabotaggio: chi supera il proprio obiettivo fa fallire la sua missione.</li>'+
    '<li>Le carte restano visibili sul tavolo finché il vincitore non gioca la presa successiva.</li></ul></details>';
}
function gameClick(b){
  var d=b.dataset,a=d.a;if(!a)return;
  var i=Number(d.i);
  if(a==='uiTile'){if(ui.tile!==d.v)ui.low=-1;ui.tile=d.v;render()}
  else if(a==='uiLow'){ui.low=Number(d.v);render()}
  else if(a==='tile'){
    var ab=ui.tile.split('/');
    act({type:'tile',tile:ui.tile,low:ab[0]===ab[1]?-1:ui.low});
  }
  else if(a==='pass')act({type:'pass',card:S.hands[me][i]});
  else if(a==='insert')act({type:'insert',pos:i});
  else if(a==='play')act({type:'play',idx:i});
  else if(a==='next')act({type:'next',deck:newDeck()});
  else if(a==='rematch')act({type:'rematch',deck:newDeck()});
}

// Stesso schema di tt/spy-team/online: rooms/$room con hostUid, members, lobby, state (le regole già pubblicate bastano).
// Lo stato di gioco è un unico oggetto JSON salvato come stringa in state.s (+ contatore state.v); ogni azione è una
// transazione che applica gameReduce() all'ultima versione. Le mani stanno nello stato (nascoste solo dall'interfaccia).
var FIREBASE_CONFIG={
  apiKey:"AIzaSyAoOMLytOqFY9GRXpi2kUGEyzLK-r00nvQ",
  authDomain:"gachapon-trick.firebaseapp.com",
  databaseURL:"https://gachapon-trick-default-rtdb.europe-west1.firebasedatabase.app",

  messagingSenderId:"869677835302",

var ALPHABET='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
var SAVE_KEY=GAME.id+'-online-last';
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var rnd=function(n){return Math.floor(Math.random()*n)};
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t}return a}
function getPlayerName(){
  var name='';
  try{
    name=localStorage.getItem('nylo-player-name')||'';
    if(!name){var last=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');name=last&&last.name||''}
  }catch(e){}
  return String(name||'Giocatore').trim().slice(0,18)||'Giocatore';
}
var playerName=getPlayerName();
var db=null,user=null,roomRef=null,roomCode='',lobbyData=null,S=null,me=-1,listeners=[],startingGame=false;
var statusText='',connText='',joinVal='',chosenCount=GAME.counts[0],MENUOPEN=false;
try{var lastRoom=JSON.parse(localStorage.getItem(SAVE_KEY));if(lastRoom)joinVal=lastRoom.code||''}catch(e){}

function setStatus(t){statusText=t;render()}
function setConn(t){connText=t;var c=document.getElementById('conn');if(c)c.textContent=t}
function showErr(t){
  var e=document.getElementById('err');
  if(!e){e=document.createElement('div');e.id='err';e.className='err';e.setAttribute('role','alert');document.body.appendChild(e)}
  e.textContent=t;e.hidden=false;setConn('Errore');clearTimeout(showErr.t);showErr.t=setTimeout(function(){e.hidden=true},8000);
}
function genCode(){var b=new Uint8Array(12);crypto.getRandomValues(b);return Array.from(b,function(x){return ALPHABET[x%ALPHABET.length]}).join('')}
function withTimeout(p,ms,msg){
  return new Promise(function(res,rej){var t=setTimeout(function(){rej(new Error(msg))},ms);p.then(function(v){clearTimeout(t);res(v)},function(e){clearTimeout(t);rej(e)})});
}
function authMsg(e){
  if(e.code==='auth/operation-not-allowed')return 'Attiva il provider Anonimo in Firebase Authentication.';
  if(e.code==='auth/unauthorized-domain')return 'Dominio non autorizzato: aggiungilo in Authentication > Impostazioni > Domini autorizzati.';
  if(e.code==='auth/network-request-failed')return 'Firebase non raggiungibile: controlla la connessione e che il sito sia in HTTPS.';
  return e.message||'Errore di autenticazione Firebase.';
}
async function connect(){
  if(!window.firebase)throw new Error('Firebase non caricato. Controlla la connessione.');
  if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
  db=firebase.database();
  if(user)return;
  try{user=(await withTimeout(firebase.auth().signInAnonymously(),15000,'Autenticazione scaduta dopo 15 secondi.')).user}
  catch(e){throw new Error(authMsg(e))}
}
function saveLast(name){try{localStorage.setItem(SAVE_KEY,JSON.stringify({code:roomCode,name:name}))}catch(e){}}

// ─────────────── LOBBY ───────────────
async function createRoom(){
  try{
    setStatus('Connessione a Firebase...');await connect();
    var created=false,lastErr=null;
    for(var i=0;i<5&&!created;i++){
      roomCode=genCode();roomRef=db.ref('rooms/'+roomCode);
      try{
        await roomRef.child('hostUid').set(user.uid);
        await roomRef.child('members/'+user.uid).set(true);
        await roomRef.child('lobby').set({game:GAME.id,hostUid:user.uid,playerCount:chosenCount,started:false,closed:false,players:{}});
        created=true;
      }catch(e){lastErr=e;roomRef=null}
    }
    if(!created)throw lastErr||new Error('Impossibile creare la stanza. Verifica le regole del database.');
    await reserveSeat(playerName);
  }catch(e){roomRef=null;setStatus(e.message||'Errore durante la creazione della stanza.')}
}
async function joinRoom(){
  try{
    roomCode=joinVal.toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(roomCode.length!==12)throw new Error('Il codice stanza è di 12 caratteri.');
    setStatus('Connessione...');await connect();
    roomRef=db.ref('rooms/'+roomCode);
    await roomRef.child('members/'+user.uid).set(true);
    await reserveSeat(playerName);
  }catch(e){roomRef=null;setStatus(e.code==='PERMISSION_DENIED'?'Stanza non trovata o non accessibile.':(e.message||'Errore durante l\'accesso alla stanza.'))}
}
function reserveSeat(name){
  var lobbyRef=roomRef.child('lobby');
  return lobbyRef.once('value').then(function(snap){
    if(!snap.exists())throw new Error('Lobby non trovata: controlla il codice.');
    var initial=snap.val();
    if(initial.game!==GAME.id)throw new Error('Questo codice appartiene a un altro gioco.');
    return new Promise(function(resolve,reject){
      lobbyRef.transaction(function(cur){
        if(cur===null)cur=initial;
        if(!cur||!cur.playerCount||cur.closed)return;
        cur.players=cur.players||{};
        if(cur.players[user.uid])return cur;            // rientro: il posto è già tuo
        if(cur.started)return;
        var occ={};Object.keys(cur.players).forEach(function(u){occ[cur.players[u].seat]=true});
        var seat=1;while(seat<=cur.playerCount&&occ[seat])seat++;
        if(seat>cur.playerCount)return;
        cur.players[user.uid]={uid:user.uid,name:name,seat:seat};
        return cur;
      },function(err,committed,snap2){
        if(err){reject(err);return}
        var cur=snap2&&snap2.val();
        if(!cur||!cur.players||!cur.players[user.uid]){
          reject(new Error(cur&&cur.started?'La partita è già iniziata.':'La stanza è piena o non disponibile.'));return;
        }
        lobbyData=cur;saveLast(name);enterRoom();resolve();
      },false);
    });
  });
}
function orderedPlayers(d){
  return Object.keys(d.players||{}).map(function(u){return d.players[u]}).sort(function(a,b){return a.seat-b.seat});
}
function maybeStart(){
  if(!lobbyData||S||startingGame||lobbyData.started||lobbyData.hostUid!==user.uid)return;
  if(orderedPlayers(lobbyData).length===lobbyData.playerCount)startGame();
}
function startGame(){
  startingGame=true;
  var seated=orderedPlayers(lobbyData);   // i posti si assegnano a caso all'avvio
  shuffle(seated);
  var init=gameInitial(seated.map(function(p){return {uid:p.uid,name:p.name}}));
  init.v=0;
  roomRef.child('state').transaction(function(cur){if(cur!==null)return;return {v:0,s:JSON.stringify(init)}},function(err){
    if(err){startingGame=false;showErr('Errore durante l\'avvio: '+err.message);return}
    roomRef.child('lobby/started').set(true).catch(function(e){startingGame=false;showErr(e.message)});
  },false);
}

// ─────────────── STANZA ───────────────
function enterRoom(){
  setConn('Lobby');
  var lobbyRef=roomRef.child('lobby');
  var lh=function(snap){if(!snap.exists())return;lobbyData=snap.val();if(!S){render();maybeStart()}};
  lobbyRef.on('value',lh,function(e){showErr(e.message)});listeners.push({ref:lobbyRef,h:lh});
  var stateRef=roomRef.child('state');
  var sh=function(snap){
    if(!snap.exists())return;
    var raw=snap.val();
    try{S=JSON.parse(raw.s)}catch(e){showErr('Stato della stanza non leggibile.');return}
    me=S.uids.indexOf(user.uid);
    if(me<0){showErr('Non risulti tra i giocatori di questa partita.');return}
    setConn('Connesso');
    render();
  };
  stateRef.on('value',sh,function(e){showErr('Connessione persa: '+e.message)});listeners.push({ref:stateRef,h:sh});
  render();
}
function leave(){
  listeners.forEach(function(l){l.ref.off('value',l.h)});
  if(!roomRef||S||!user){window.location.reload();return}
  // prima dell'inizio libera il posto; a partita avviata si può rientrare con lo stesso codice
  roomRef.child('lobby').transaction(function(cur){
    if(!cur||cur.started)return;
    cur.players=cur.players||{};delete cur.players[user.uid];
    var rest=orderedPlayers(cur);
    if(cur.hostUid===user.uid&&rest.length)cur.hostUid=rest[0].uid;
    return cur;
  },function(){
    roomRef.child('members/'+user.uid).remove().catch(function(){}).then(function(){window.location.reload()});
  },false);
}

// azioni: ogni azione è una transazione sullo stato, validata da gameReduce() sull'ultima versione
function act(a){
  if(!roomRef||me<0)return;
  var seat=me;
  roomRef.child('state').transaction(function(cur){
    if(!cur||!cur.s)return;
    var st;try{st=JSON.parse(cur.s)}catch(e){return}
    var r=gameReduce(st,seat,a);
    if(!r)return;
    r.v=(st.v||0)+1;
    return {v:r.v,s:JSON.stringify(r)};
  },function(err,committed){
    if(err)showErr('Errore di sincronizzazione: '+err.message);
    else if(!committed)setConn('Azione non più valida');
  },false);
}

function kitMenuHtml(){

function render(){

var APP=document.getElementById('app');
APP.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b||b.disabled)return;

});
APP.addEventListener('input',function(e){if(e.target.id==='joinCode'){joinVal=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'');e.target.value=joinVal}});
APP.addEventListener('keydown',function(e){if(e.target.id==='joinCode'&&e.key==='Enter')joinRoom()});
APP.addEventListener('change',function(e){
  if(e.target.name==='pc'){chosenCount=Number(e.target.value);return}
  if(typeof gameChange==='function')gameChange(e);
});
document.addEventListener('click',function(e){if(MENUOPEN&&!e.target.closest('.menu-wrap')){MENUOPEN=false;render()}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&MENUOPEN){MENUOPEN=false;render()}});
render();
if(window.NYLO_START&&NYLO_START.mode==='room'){chosenCount=NYLO_START.n||chosenCount;if(NYLO_START.name)playerName=NYLO_START.name.slice(0,18);if(NYLO_START.action==='join'){joinVal=NYLO_START.code||'';joinRoom()}else createRoom();}
</script>
<style id="sx-css">
.sx-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:12px;color:var(--text)}
.sx-label{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--text-soft);margin-top:2px}
.sx-row{display:flex;gap:8px;flex-wrap:wrap}
.sx-opt{padding:10px 16px;border-radius:7px;border:1px solid var(--border);background:var(--surface-raised);color:var(--text);cursor:pointer;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;transition:border-color .12s,background .12s}
.sx-opt:hover:not(:disabled){border-color:var(--accent)}
.sx-opt.on{border-color:var(--accent);background:var(--accent);color:#fff;font-weight:600}
.sx-opt.on::before{content:'\2713\00a0'}
.sx-opt:disabled{opacity:.4;cursor:not-allowed}
.sx-row .sx-opt{flex:1 1 0;min-width:0}
.sx-go{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;margin-top:1rem}
.sx-go:hover:not(:disabled){filter:brightness(1.1);border-color:var(--accent)}
.sx-in{background:#fff;border:1px solid var(--border);color:#222;border-radius:6px;padding:10px 12px;font-family:'Inter',sans-serif;font-size:14px;width:100%;outline:none}
.sx-in:focus{border-color:var(--accent)}
.sx-in.code{letter-spacing:2px;text-transform:uppercase;font-family:Consolas,monospace}
.sx-nav{display:flex;gap:8px;align-items:center;margin-left:auto}
.sx-sub{display:flex;flex-direction:column;gap:10px;padding-top:2px}
</style>
<script>
(function(){
  var P=window.NYLO_SETUP={id:'spy-team',logo:'Spy <span>Team</span>',counts:[4]};
  var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  function run(id){var s=document.createElement('script');s.textContent=document.getElementById(id).textContent;document.body.appendChild(s)}
  window.addEventListener('hashchange',function(){location.reload()});
  window.NYLO_IN_SETUP=true;   // finché si sceglie, Home/Indietro escono senza avviso
  var app=document.getElementById('app');
  var st={n:P.counts[0],mode:location.hash==='#stanze'?'room':(location.hash==='#ai'?'ai':''),sub:'',code:'',name:''};
  var needName=false;
  try{
    st.name=localStorage.getItem('nylo-player-name')||'';
    var last=JSON.parse(localStorage.getItem(P.id+'-online-last')||'null');if(last&&last.code)st.code=last.code;
  }catch(e){}
  needName=!st.name;   // il nome arriva dalla sessione; il campo compare solo se manca
  function btn(attrs,cls,label,on){return '<button type="button" class="sx-opt '+cls+(on?' on':'')+'" '+attrs+'>'+label+'</button>'}
  function draw(){
    var h='<div class="topbar"><div class="logo">'+P.logo+'</div><div class="sx-nav">'+(window.nyloBackBtn?nyloBackBtn():'')+(window.nyloHomeBtn?nyloHomeBtn():'')+'</div></div>';
    h+='<div class="sx-card">';
    if(needName)h+='<label class="sx-label" for="sxName">IL TUO NOME</label><input class="sx-in" id="sxName" maxlength="16" placeholder="Il tuo nome" autocomplete="off" value="'+esc(st.name)+'">';
    if(P.counts.length>1){
      h+='<div class="sx-label">GIOCATORI</div><div class="sx-row">'+P.counts.map(function(n){return btn('data-n="'+n+'"','',n+' giocatori',st.n===n)}).join('')+'</div>';
    }
    h+='<div class="sx-label">MODALITÀ</div><div class="sx-row">'+btn('data-mode="ai"','','Contro l’AI',st.mode==='ai')+btn('data-mode="room"','','A stanze',st.mode==='room')+'</div>';
    if(st.mode==='ai'){
      h+='<div class="sx-sub"><div class="sx-row">'+btn('data-go="ai"','sx-go','Inizia',false)+'</div></div>';
    }else if(st.mode==='room'){
      h+='<div class="sx-label">OPZIONI STANZA</div><div class="sx-sub"><div class="sx-row">'+btn('data-sub="create"','','Crea nuova',st.sub==='create')+btn('data-sub="join"','','Unisciti',st.sub==='join')+'</div>';
      if(st.sub==='create')h+='<div class="sx-row">'+btn('data-go="create"','sx-go','Inizia',false)+'</div>';
      if(st.sub==='join')h+='<input class="sx-in code" id="sxCode" maxlength="12" placeholder="Codice stanza" autocomplete="off" value="'+esc(st.code)+'"><div class="sx-row"><button type="button" class="sx-opt sx-go" id="sxJoin" data-go="join" '+(st.code.length===12?'':'disabled')+'>Inizia</button></div>';
      h+='</div>';
    }
    h+='</div>';
    app.innerHTML=h;
  }
  function loadRoom(){
    var libs=['app','auth','database'].map(function(n){return 'https://www.gstatic.com/firebasejs/10.12.2/firebase-'+n+'-compat.js'});
    (function next(i){
      if(i===libs.length){run('src-room');return}
      var s=document.createElement('script');s.src=libs[i];s.onload=function(){next(i+1)};
      s.onerror=function(){app.innerHTML='<p style="padding:20px;color:#c00">Firebase non raggiungibile: controlla la connessione.</p>'};
      document.head.appendChild(s);
    })(0);
  }
  function go(kind){
    var nm=document.getElementById('sxName'),name=((nm&&nm.value)||st.name||'').trim().slice(0,16);
    window.NYLO_IN_SETUP=false;
    if(name){try{localStorage.setItem('nylo-player-name',name)}catch(e){}}
    var cfg={name:name,n:st.n};
    if(kind==='ai'){cfg.mode='ai';window.NYLO_START=cfg;run('src-ai');return}
    cfg.mode='room';cfg.action=kind;if(kind==='join')cfg.code=st.code;
    window.NYLO_START=cfg;app.innerHTML='';loadRoom();
  }
  app.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b||b.disabled)return;
    var d=b.dataset;
    if(d.n){st.n=Number(d.n);draw()}
    else if(d.mode){st.mode=d.mode;st.sub='';draw()}
    else if(d.sub){st.sub=d.sub;draw();var c=document.getElementById('sxCode');if(c)c.focus()}
    else if(d.go)go(d.go);
  });
  app.addEventListener('input',function(e){
    if(e.target.id==='sxName')st.name=e.target.value;
    else if(e.target.id==='sxCode'){
      st.code=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'');e.target.value=st.code;
      var j=document.getElementById('sxJoin');if(j)j.disabled=st.code.length!==12;
    }
  });
  app.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='sxCode'&&st.code.length===12)go('join')});
  draw();
})();
</script>
</body>
</html>
