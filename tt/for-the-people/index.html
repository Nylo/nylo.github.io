.k4{--kc:#2b2b30;--kl:#dcdcde;--kt:#fff;--av:var(--av4)}
html,body{min-height:100%;color:var(--text);font-family:'Inter',sans-serif;font-size:14px}
body{background-color:var(--bg);background-image:radial-gradient(rgba(169,119,43,0.16) 1.6px,transparent 2px),radial-gradient(ellipse at 50% 0%,rgba(255,255,255,0.55),transparent 70%);background-size:16px 16px,100% 100%;background-attachment:fixed}
.app{max-width:960px;margin:0 auto;padding:0 12px 48px}

.topbar{display:flex;align-items:center;gap:10px;padding:14px 0;margin-bottom:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo .emb{width:40px;height:40px;flex:0 0 40px;border-radius:50%;border:2px solid var(--brass);box-shadow:0 0 0 2px var(--ink);background:var(--av1) center/cover}
.logo .t{font-family:'Cinzel Decorative','Cinzel',serif;font-weight:700;font-size:26px;line-height:1.05;color:var(--ink);letter-spacing:.01em}
.logo .t small{display:block;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.3em;color:var(--brass);font-weight:700}
.badge{background:var(--accent);color:#fff;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700;white-space:nowrap;border:2px solid var(--ink)}
.btn{border-radius:7px;padding:8px 14px;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;cursor:pointer;background:#fffdf5;color:var(--text);border:2px solid var(--ink)}
.btn:hover{background:var(--surface-raised)}
.btn-sm{padding:5px 10px;font-size:12px}
.opt-toggle{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-soft);cursor:pointer;border:0;border-radius:20px;padding:4px 10px;user-select:none}
.opt-toggle input[type=checkbox]{appearance:none;-webkit-appearance:none;position:relative;width:34px;height:19px;flex:0 0 34px;margin:0;border:1px solid var(--border);border-radius:999px;background:var(--surface-raised);cursor:pointer;transition:background .15s,border-color .15s}
.opt-toggle input[type=checkbox]::before{content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--text-soft);transition:transform .15s,background .15s}
.opt-toggle input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
.opt-toggle input[type=checkbox]:checked::before{transform:translateX(15px);background:#fff}
.opt-toggle input[type=checkbox]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.menu-wrap{position:relative;margin-left:auto}
.hamb{display:inline-flex;align-items:center;justify-content:center;width:34px;height:30px;border-radius:7px;background:#fffdf5;color:var(--text);border:2px solid var(--ink);cursor:pointer}
.hamb:hover{background:var(--surface-raised)}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);z-index:30;min-width:240px;display:flex;flex-direction:column;gap:4px;padding:8px;background:var(--surface);border:2px solid var(--ink);border-radius:var(--radius);box-shadow:var(--shadow)}
.menu-pop .opt-toggle{border:0;border-radius:6px;padding:9px 10px;font-size:13px;color:var(--text);white-space:normal;line-height:1.35;text-align:left;width:100%}
.menu-pop .opt-toggle:hover{background:var(--accent-soft)}
/* nel menu le voci sono azioni a testo (home-btn.js): l'interruttore stilizzato deve restare nascosto e non occupare spazio */
.menu-pop .opt-toggle.nylo-menu-action input[type=checkbox]{position:absolute;width:1px;height:1px;flex:none;margin:0;border:0;opacity:0;pointer-events:none}
.menu-pop button.opt-toggle{appearance:none;-webkit-appearance:none;font-family:inherit;font-size:13px;font-weight:500;color:var(--text);text-align:left;background:transparent;border:0;box-shadow:none;cursor:pointer}
.flag{display:inline-block;margin-left:5px;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;vertical-align:middle;white-space:nowrap}
.flag.lead{background:var(--brass);color:#fff}
.flag.win{background:var(--success);color:#fff}
.log{background:var(--surface);border:2px solid var(--ink);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 14px;margin-top:12px;margin-bottom:14px;font-size:12px;color:var(--text-soft);line-height:1.6}
.log summary{cursor:pointer;font-weight:600;letter-spacing:0.05em}
.logbody{margin-top:8px;max-height:260px;overflow-y:auto;padding-right:6px}
.logbody div{border-bottom:1px solid var(--border);padding:1px 0}
.name-modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(10,25,28,0.7);padding:16px}
.name-box{background:var(--surface);color:var(--text);border:2px solid var(--ink);border-radius:var(--radius);padding:20px;width:min(340px,100%);display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.name-box h3{font-family:'Cinzel',serif;font-weight:700;font-size:20px}
.name-box p{font-size:12px;color:var(--text-soft)}
.name-box input{padding:9px 11px;border-radius:7px;border:1px solid var(--border);background:#fff;color:var(--text);font-size:14px;font-family:inherit;outline:none}
.name-box input:focus{border-color:var(--accent)}

.dock{position:sticky;top:0;z-index:10;background:var(--surface);border:2px solid var(--ink);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px;margin-bottom:14px;display:flex;flex-direction:column;gap:10px}
.dock.tall{position:static}
.dock-msg{font-size:13px;line-height:1.5}
.dock-title{font-size:11px;font-weight:600;color:var(--text-soft);letter-spacing:0.05em}
.opts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.opt{background:#fffdf5;border:2px solid var(--ink);color:var(--text);border-radius:8px;padding:8px 12px;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.12s;text-align:left}
.opt:hover:not(:disabled){background:var(--brass);border-color:var(--ink);color:#fff}
.opt.on{background:var(--accent);color:#fff}
.opt:disabled{opacity:0.35;cursor:not-allowed}
.opt .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--kc);margin-right:6px;vertical-align:-1px;border:1px solid rgba(0,0,0,.4)}
.hint{font-size:12px;color:var(--text-soft);line-height:1.5}
.hint b{color:var(--text)}
.stack{display:grid}.stack>*{grid-area:1/1}
.scroll-x{overflow-x:auto;max-width:100%}
table.score{border-collapse:collapse;font-size:12px;width:100%}
table.score td,table.score th{padding:5px 8px;border-bottom:1px solid var(--border);text-align:right;vertical-align:middle}
table.score td:first-child,table.score th:first-child{text-align:left}
table.score td.l,table.score th.l{text-align:left}
table.score .pos{color:var(--success)}
table.score .neg{color:var(--danger)}
table.score tr.me td{background:var(--accent-soft)}
table.score td.c{text-align:center}

/* carte: fondo avorio con cornice color ottone, ritratto del colore al centro, numero e seme negli angoli */
.pc{width:var(--cw);height:var(--ch);border-radius:6px;background:#f8f1de;border:2px solid var(--brass);box-shadow:0 0 0 1px rgba(23,55,59,.6),0 2px 5px rgba(0,0,0,.35);position:relative;display:inline-block;overflow:hidden;flex-shrink:0;padding:0;color:var(--kc)}
.pc::before{content:'';position:absolute;inset:2px;border-radius:4px;background:linear-gradient(180deg,var(--kl),#fffaf0 130%);border:1px solid var(--kc);opacity:.95}
.pc .pt{position:absolute;left:50%;top:56%;width:calc(var(--cw)*.56);height:calc(var(--cw)*.56);transform:translate(-50%,-50%);border-radius:50%;background:var(--av) center/cover;border:2px solid var(--kc);box-shadow:0 0 0 1px #fff}
.pc .cn{position:absolute;display:flex;flex-direction:column;align-items:center;gap:1px;font-family:'Cinzel',serif;font-weight:800;font-size:calc(var(--cw)*.36);line-height:1;font-style:normal;color:var(--kc);z-index:2;min-width:calc(var(--cw)*.24)}
.pc .cn svg{width:calc(var(--cw)*.22);height:calc(var(--cw)*.22);display:block;fill:var(--kc);color:var(--kc)}
.pc .cn.a{left:calc(var(--cw)*.05);top:calc(var(--cw)*.04)}
.pc .cn.d{right:calc(var(--cw)*.05);bottom:calc(var(--cw)*.04);transform:rotate(180deg)}
.pc.mini{--cw:42px;--ch:61px}
.pc.fresh{box-shadow:0 0 0 3px #ffd54a,0 2px 5px rgba(0,0,0,.45)}
.pc.win{box-shadow:0 0 0 3px var(--success),0 2px 5px rgba(0,0,0,.45)}
.pc.legal{box-shadow:0 0 0 2px var(--ink),0 0 0 4px rgba(227,182,76,.95)}
.pc.dim{opacity:.4;filter:saturate(.5)}
.pc.sel{transform:translateY(-12px);box-shadow:0 0 0 2px #fff,0 0 0 5px var(--brass)}
button.pc{cursor:pointer;transition:transform .12s}
button.pc:hover:not(:disabled){transform:translateY(-6px)}
button.pc.sel:hover:not(:disabled){transform:translateY(-12px)}
button.pc:disabled{cursor:default}
.hand{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;padding-top:14px}
.back{width:9px;height:14px;border-radius:2px;background:linear-gradient(135deg,var(--accent),#0f3d4a);border:1px solid #f8f1de;box-shadow:0 0 0 1px rgba(23,55,59,.6)}
.backs{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:230px}
.seat.top .backs,.seat.left .backs,.seat.right .backs,.seat.tl .backs,.seat.tr .backs{display:grid;grid-template-columns:repeat(6,9px);max-width:none}
.nc{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:28px;padding:0 4px;border-radius:5px;background:var(--kc);color:var(--kt);font-family:'Cinzel',serif;font-weight:800;font-size:13px;line-height:1;border:1px solid rgba(23,55,59,.55);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.nc.s{min-width:20px;height:22px;font-size:11px}

.ind{display:flex;gap:6px;align-items:flex-end;justify-content:center;flex-wrap:wrap}
.itok{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:46px;font-size:10px;font-weight:700;color:var(--text-soft)}
.itok .ia{width:38px;height:38px;border-radius:50%;background:var(--av) center/cover;border:3px solid var(--kc);box-shadow:0 0 0 1px #fff}
.itok.top .ia{box-shadow:0 0 0 2px var(--brass)}
.itok b{color:var(--kc)}
.indlbl{display:flex;justify-content:space-between;font-size:10px;color:var(--text-soft);font-weight:600;letter-spacing:.04em;margin-top:6px}

.table{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(0,1fr);gap:8px;background:var(--surface);border:2px solid var(--ink);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px;margin:0 0 14px}
.table.n2{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "center" "bottom"}
.table.n3{grid-template-areas:"left center right" "bottom bottom bottom"}
.table.n4{grid-template-areas:". top ." "left center right" "bottom bottom bottom"}
.table.n5{grid-template-areas:"tl . tr" "left center right" "bottom bottom bottom"}
.seat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;border-radius:10px;border:1px solid transparent;text-align:center;min-width:0}
.seat.top{grid-area:top} .seat.left{grid-area:left;justify-content:center} .seat.right{grid-area:right;justify-content:center} .seat.bottom{grid-area:bottom} .seat.tl{grid-area:tl} .seat.tr{grid-area:tr}
.seat.leader{border:1px dashed rgba(169,119,43,0.9);background:rgba(169,119,43,0.07)}
.seat.active{border:2px solid var(--brass);background:rgba(227,182,76,0.3);box-shadow:0 0 0 2px #ffd54a}
.seat.winner{border:2px solid var(--success);background:rgba(44,122,71,0.12)}
.seat-name{font-weight:600;font-size:13px;overflow-wrap:anywhere;display:flex;flex-direction:column;align-items:center;gap:3px}
.seat-name .nm{display:inline-block;padding:2px 10px;border-radius:999px;color:#1d2b2e;font-weight:700;border:1px solid rgba(23,55,59,0.35);background:var(--sc,#eee)}
.nmrow{display:flex;gap:4px;align-items:center;justify-content:center;flex-wrap:wrap}.nmrow .flag{margin-left:0}
.seat-meta{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;align-items:center;font-size:11px}
.tag{background:rgba(23,55,59,0.09);border-radius:4px;padding:2px 6px;color:var(--text)}
.tag b{color:var(--accent)}
.tag.man{background:var(--kc);color:var(--kt);font-weight:700}
.tag.ok{background:rgba(44,122,71,0.16);color:#1b5a33;font-weight:700}
.tag.ko{background:rgba(168,40,31,0.13);color:#86201a;font-weight:700}
.subs{display:flex;flex-direction:column;gap:6px;width:100%;align-items:center}
.sub{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;min-width:0;padding:4px;border-radius:8px}
.sub+.sub{border-top:1px dashed var(--border);padding-top:8px}
.sub.active{background:rgba(227,182,76,0.3);box-shadow:0 0 0 2px #ffd54a}
.sub.win{background:rgba(44,122,71,0.12);box-shadow:0 0 0 2px var(--success)}
.n2 .top .subs,.n2 .bottom .subs{flex-direction:row;align-items:flex-start;flex-wrap:wrap;justify-content:center}
.n2 .subs .sub{flex:1 1 220px;width:auto}
.n2 .sub+.sub{border-top:0;padding-top:4px}
.tableau{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:65px;min-width:46px;padding:3px;border-radius:8px;background:rgba(23,55,59,0.05)}
.slot{display:inline-block;width:42px;height:61px;border:1px dashed rgba(23,55,59,0.4);border-radius:6px}
.center{grid-area:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;font-size:12px;line-height:1.45;color:var(--text-soft);min-width:0}
.center b{color:var(--accent)}
.rbox{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;font-size:12px;font-family:'Cinzel',serif;border:2px solid var(--ink)}

.scorebox{background:var(--surface);border:2px solid var(--ink);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px;margin-bottom:14px}
.scorebox h3{font-size:11px;font-weight:600;color:var(--text-soft);letter-spacing:0.05em;margin-bottom:8px}
.acq{display:flex;flex-direction:column;gap:12px}
.ab{border-top:1px dashed var(--border);padding-top:10px}
.ab:first-child{border-top:0;padding-top:0}
.ab-h{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px;font-size:12px}
.ab-h .nm{display:inline-block;padding:2px 10px;border-radius:999px;color:#1d2b2e;font-weight:700;border:1px solid rgba(23,55,59,0.35);background:var(--sc,#eee)}
.ab-h .tot{margin-left:auto;font-weight:700}
.arow{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:6px;align-items:center;padding:3px 0}
.arow .al{font-size:11px;font-weight:700;color:var(--kc);display:flex;align-items:center;gap:5px;min-width:0}
.arow .al i{width:10px;height:10px;border-radius:50%;background:var(--kc);flex:0 0 10px}
.arow .cs{display:flex;flex-wrap:wrap;gap:3px;min-width:0}
.arow .ar{font-size:11px;font-weight:700;white-space:nowrap;text-align:right}
.arow .ar.pos{color:var(--success)}.arow .ar.neg{color:var(--danger)}
.arow .ar small{display:block;font-weight:500;color:var(--text-soft);font-size:10px}
.unseen{display:flex;flex-direction:column;gap:5px}
.unseen .ur{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.unseen .ur .l{width:56px;font-size:11px;font-weight:700;color:var(--kc)}
.recap{background:var(--surface);border:2px solid var(--ink);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:14px;display:flex;flex-direction:column;gap:10px}
.recap-row{display:block;font-size:12px;line-height:1.7}
.recap-row > *{margin-right:6px}
.recap-row .lbl{font-weight:600;color:var(--text-soft)}
.recap-row .rv{color:var(--text-soft);margin-left:0 !important;margin-right:0}
details.rules{background:var(--surface);border:2px solid var(--ink);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px}
details.rules summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--text-soft);letter-spacing:0.05em}
details.recap{display:block;padding:14px 16px}
details.recap>summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--text-soft);letter-spacing:0.05em}
details.recap[open]>summary{margin-bottom:10px}
details.recap[open]>:not(summary)+*{margin-top:10px}
.rtext h4{font-family:'Cinzel',serif;font-weight:700;font-size:16px;color:var(--accent);margin:14px 0 4px}
.rtext p,.rtext li{font-size:12px;line-height:1.6;color:var(--text-soft);margin-bottom:6px}
.rtext ul,.rtext ol{padding-left:20px}
.rtext b{color:var(--text)}

@media(max-width:600px){
  .logo .t{font-size:21px}
  .logo .emb{width:34px;height:34px;flex-basis:34px}
  :root{--cw:36px;--ch:53px}
  .pc{border-radius:5px;border-width:1.5px}
  .pc.mini{--cw:36px;--ch:53px}
  .slot{width:36px;height:53px}
  .table{padding:8px;gap:6px}
  .back{width:7px;height:11px}
  .seat.top .backs,.seat.left .backs,.seat.right .backs,.seat.tl .backs,.seat.tr .backs{grid-template-columns:repeat(6,7px)}
  .hand{gap:3px}
  .seat{padding:6px 3px}
  .seat-name .nm{padding:2px 6px;font-size:12px}
  table.score td,table.score th{padding:5px 4px}
  .arow{grid-template-columns:64px minmax(0,1fr) auto}
  .nc{min-width:21px;height:25px;font-size:12px}
  .itok{min-width:40px}.itok .ia{width:32px;height:32px}
}
@media(max-width:380px){.topbar{gap:6px}.logo .t{font-size:18px}.badge{padding:4px 9px}}
@media(max-width:340px){.logo .t{font-size:16px}.logo .emb{width:30px;height:30px;flex-basis:30px}.badge{font-size:11px;padding:3px 7px}.seat-name .nm{padding:2px 5px;font-size:11px}.arow{grid-template-columns:58px minmax(0,1fr) auto}}

<script>
// ═════════════════════════ COSTANTI ═════════════════════════
// 5 colori: 0 Verde (cuori, agricoltura), 1 Blu (fiori, scienza), 2 Rosso (picche, militare), 3 Giallo (quadri, industria), 4 Nero (corruzione, numeri 4–13).
const COLS = [
  {n:'Verde',  sub:'agricoltura', sym:'heart'},
  {n:'Blu',    sub:'scienza',     sym:'club'},
  {n:'Rosso',  sub:'militare',    sym:'spade'},
  {n:'Giallo', sub:'industria',   sym:'diamond'},
  {n:'Nero',   sub:'corruzione',  sym:'corr'}
];
const BLACK = 4;
const CARD = []; for(let k=0;k<5;k++) for(let r=(k===BLACK?4:1);r<=13;r++) CARD[k*16+r]={id:k*16+r,k,r};
const POOL_ALL = CARD.filter(Boolean);
const MAXR = {2:10,3:7,4:10,5:13};          // numero massimo usato (si tolgono gli altri: 3 giocatori 8–13, 2 e 4 giocatori 11–13)
const HS   = {2:10,3:10,4:11,5:12};         // carte a testa (a 2 giocatori: 10 per ciascuna delle due mani)
const NAMES = ['Tu','AI Agnes','AI Silas','AI Cornelius','AI Mabel'];
const SEATC = ['#f4d9a6','#cfe3c4','#bfe0e8','#e9c9d8','#d9d2ee'];
const HUM = 0;
const POS = {2:['bottom','top'],3:['bottom','left','right'],4:['bottom','left','top','right'],5:['bottom','left','tl','tr','right']};
const ROUND_OPTS = [3,'n'];

// ═════════════════════════ UTILITÀ ═════════════════════════
const rnd = n => Math.floor(Math.random()*n);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
let G = null, PR = null;
let LOGOPEN=false, RULESOPEN=false, RECAPOPEN=false, MENUOPEN=false;
const OPT = {undo:true, seen:false, rounds:3};
try{ let s=localStorage.getItem('fp-undo'); if(s!==null) OPT.undo=s==='1'; OPT.seen=localStorage.getItem('fp-seen')==='1'; const r=localStorage.getItem('fp-rounds'); if(r==='n') OPT.rounds='n'; }catch(e){}
const cname = c => `${c.r} ${COLS[c.k].n}`;
const sortHand = h => h.sort((a,b)=>a.k-b.k||a.r-b.r);
const plural = (n,a,b) => n===1?a:b;
const sgn = v => v>0?'+'+v:(v<0?'−'+(-v):'0');
const POP = new Uint8Array(1<<14); for(let i=1;i<POP.length;i++) POP[i]=POP[i>>1]+(i&1);
const seatsOf = o => { const r=[]; G.own.forEach((x,s)=>{ if(x===o) r.push(s); }); return r; };
const nameOf = s => P(G.own[s]).name + (G.lab?' '+G.lab[s]:'');
const shortOf = o => P(o).name.replace(/^AI /,'');

// ═════════════════════════ REGOLE (funzioni pure) ═════════════════════════
// una carta batte l'altra se il suo colore è più in alto nell'ordine di forza; a parità di colore, se ha il numero più alto
const beats = (a,b,ind) => { const pa=ind.indexOf(a.k), pb=ind.indexOf(b.k); return pa!==pb?pa<pb:a.r>b.r; };
function trickWin(plays,ind){ let b=plays[0]; for(let i=1;i<plays.length;i++) if(beats(plays[i].c,b.c,ind)) b=plays[i]; return b; }
// punti di un tableau (file in ordine di creazione, la prima è quella del manifesto)
function scoreRows(rows){
  let t=0;
  for(let i=0;i<rows.length;i++){ const r=rows[i]; t+= i===0 ? r.sum : (r.n<=rows[i-1].n ? r.n : -r.sum); }
  return t;
}
function breakdown(rows){
  return rows.map((r,i)=>{
    if(i===0) return {k:r.k,n:r.n,sum:r.sum,pts:r.sum,kind:'man',above:0};
    const above=rows[i-1].n, ok=r.n<=above;
    return {k:r.k,n:r.n,sum:r.sum,pts:ok?r.n:-r.sum,kind:ok?'ok':'ko',above};
  });
}
const newColors = (rows,cards) => { const r=[]; for(const c of cards) if(!r.includes(c.k)&&!rows.some(x=>x.k===c.k)) r.push(c.k); return r; };
function scoreAfter(rows,cards,order){
  const R=rows.map(x=>({k:x.k,n:x.n,sum:x.sum})), idx={}; R.forEach((x,i)=>{ idx[x.k]=i; });
  for(const k of order){ idx[k]=R.length; R.push({k,n:0,sum:0}); }
  for(const c of cards){ const x=R[idx[c.k]]; x.n++; x.sum+=c.r; }
  return scoreRows(R);
}
function permutations(a){
  if(a.length<=1) return [a.slice()];
  const out=[]; a.forEach((x,i)=>{ permutations(a.filter((_,j)=>j!==i)).forEach(r=>out.push([x,...r])); });
  return out;
}
// ordine migliore (per i punti subito) in cui aprire le file dei colori nuovi
function bestOrder(rows,cards){
  const nk=newColors(rows,cards); if(nk.length<2) return nk;
  if(nk.length>3){ const cnt=k=>cards.filter(c=>c.k===k).length; return nk.slice().sort((a,b)=>cnt(b)-cnt(a)); }
  let best=nk, bv=-1e9;
  for(const o of permutations(nk)){ const v=scoreAfter(rows,cards,o)+Math.random()*0.01; if(v>bv){ bv=v; best=o; } }
  return best;
}
const takeScore = (rows,cards) => scoreAfter(rows,cards,bestOrder(rows,cards));
function addCards(rows,cards,order){
  for(const k of order) rows.push({k,n:0,sum:0,cards:[]});
  for(const c of cards){ const r=rows.find(x=>x.k===c.k); r.n++; r.sum+=c.r; if(r.cards) r.cards.push(c); }
}
// aggiornamento degli indicatori di forza dopo la presa
function updInd(ind,wk){
  const a=ind.filter(k=>k!==wk); a.push(wk);
  if(wk!==BLACK){ const i=a.indexOf(BLACK); if(i>0){ const t=a[i]; a[i]=a[i-1]; a[i-1]=t; } }
  return a;
}
// conclude la presa (S.plays completo): assegna le carte al vincitore. order = ordine scelto dal vincitore per i colori nuovi (se omesso, il migliore)
function settleTrick(S,order){
  const w=trickWin(S.plays,S.ind), cards=S.plays.map(x=>x.c), rows=S.rows[w.s];
  const ord=order||bestOrder(rows,cards);
  addCards(rows,cards,ord);
  S.ind=updInd(S.ind,w.c.k); S.leader=w.s;
  return {w:w.s,wc:w.c,cards,ord};
}
// punti del round di ogni giocatore (a 2 giocatori vale la mano che ha fatto meno)
function roundPts(S){
  const pts=new Array(S.n).fill(null);
  for(let s=0;s<S.ns;s++){ const o=S.own[s], v=scoreRows(S.rows[s]); pts[o]=pts[o]===null?v:Math.min(pts[o],v); }
  return pts;
}

// ═════════════════════════ AI ═════════════════════════
// Si gioca con informazione parziale: l'AI conosce la propria mano, le carte già uscite (tutte pubbliche) e il numero di carte degli altri.
// Politica euristica = stima della probabilità di vincere la presa e del guadagno in punti; Monte Carlo sulle mani nascoste per scegliere la carta.
const AIP = {ms:110, minW:4, maxW:120};
const TUN = {rho:1, lam:0.25, sw:2.0, leak:0.5, fx:3.5, wo:0.25, noise:0.35, ma:1, mb:0.5, mc:0};
function poolInfo(S,s){
  const o=S.own[s], pm=S.rem.slice();
  for(let q=0;q<S.ns;q++) if(S.own[q]===o) for(const c of S.hands[q]) pm[c.k]&=~(1<<c.r);
  const cnt=pm.map(m=>POP[m]); let tot=0; for(const x of cnt) tot+=x;
  return {pm,cnt,tot};
}
function polCard(S,s,noise){
  const hand=S.hands[s]; if(hand.length===1) return hand[0];
  const X=S.plays, m=S.ns-X.length-1, rows=S.rows[s], ind=S.ind, mk=rows.length?rows[0].k:-1;
  const pi=poolInfo(S,s), base=scoreRows(rows), cards0=X.map(x=>x.c);
  let exv=0;
  if(m>0&&pi.tot>0){
    const pm=mk>=0?pi.cnt[mk]:0, share=pm/pi.tot;
    let avg=0; if(pm){ let sm=0; for(let r=1;r<=13;r++) if(pi.pm[mk]>>r&1) sm+=r; avg=sm/pm; }
    exv=m*(share*avg - (1-share)*TUN.fx);
  }
  const rest=[]; for(let k=X.length+1;k<S.ns;k++) rest.push((S.leader+k)%S.ns);
  let best=hand[0], bv=-1e9;
  for(const c of hand){
    let win=true; for(const x of X) if(!beats(c,x.c,ind)){ win=false; break; }
    let pw=0;
    if(win){
      pw=1;
      if(m>0&&pi.tot>0){
        const pos=ind.indexOf(c.k); let b=0; for(let i=0;i<pos;i++) b+=pi.cnt[ind[i]]; b+=POP[pi.pm[c.k]>>(c.r+1)];
        const q=b/pi.tot;
        for(const o of rest){ const h=S.hands[o].length; pw*=1-TUN.rho*(1-Math.pow(1-q,h)); }
      }
    }
    const cards=cards0.concat([c]);
    const d=takeScore(rows,cards)-base;
    const str=(4-ind.indexOf(c.k))*TUN.sw+c.r*0.5;
    const v=pw*(d+exv)-(1-pw)*(c.k===mk?TUN.leak*c.r:0)-TUN.lam*str+Math.random()*noise;
    if(v>bv){ bv=v; best=c; }
  }
  return best;
}
function playCard(S,s,c){ S.hands[s].splice(S.hands[s].indexOf(c),1); S.plays.push({s,c}); S.rem[c.k]&=~(1<<c.r); }
function finishTrick(S,noise){
  while(S.plays.length<S.ns){ const s=(S.leader+S.plays.length)%S.ns; playCard(S,s,polCard(S,s,noise)); }
  settleTrick(S);
  S.plays=[];
}
function playOut(S,noise){
  while(S.hands[0].length>0||S.plays.length) finishTrick(S,noise);
  return roundPts(S);
}
// mondo possibile dal punto di vista di s: le sue carte (e quelle dell'altra mano, se ne ha due) sono vere, le altre sono campionate tra quelle non viste
function sampleWorld(s){
  const ns=G.ns, o=G.own[s], hands=new Array(ns);
  const pi=poolInfo(G,s), pool=[];
  for(let k=0;k<5;k++) for(let r=1;r<=13;r++) if(pi.pm[k]>>r&1) pool.push(CARD[k*16+r]);
  shuffle(pool); let i=0;
  for(let q=0;q<ns;q++){ if(G.own[q]===o) hands[q]=G.hands[q].slice(); else { hands[q]=pool.slice(i,i+G.hands[q].length); i+=G.hands[q].length; } }
  return {n:G.n,ns,own:G.own,hands,rows:G.rows.map(x=>x.map(r=>({k:r.k,n:r.n,sum:r.sum}))),ind:G.ind.slice(),plays:G.plays.map(x=>({s:x.s,c:x.c})),leader:G.leader,trick:G.trick,ntr:G.ntr,rem:G.rem.slice()};
}
function cloneW(W){ return {n:W.n,ns:W.ns,own:W.own,hands:W.hands.map(h=>h.slice()),rows:W.rows.map(x=>x.map(r=>({k:r.k,n:r.n,sum:r.sum}))),ind:W.ind.slice(),plays:W.plays.map(x=>({s:x.s,c:x.c})),leader:W.leader,trick:W.trick,ntr:W.ntr,rem:W.rem.slice()}; }
const worldValue = (pts,o,n) => { let t=0; for(let q=0;q<n;q++) if(q!==o) t+=pts[q]; return pts[o]-TUN.wo*t/(n-1); };
function aiCard(s){
  const L=G.hands[s]; if(L.length===1) return L[0];
  const o=G.own[s], tot=L.map(()=>0), t0=performance.now(), ms=window.FP_AIMS||AIP.ms; let nW=0;
  while(nW<AIP.minW||(performance.now()-t0<ms&&nW<AIP.maxW)){
    const W=sampleWorld(s);
    L.forEach((c,i)=>{
      const X=cloneW(W); playCard(X,s,X.hands[s].find(x=>x.id===c.id));
      tot[i]+=worldValue(playOut(X,TUN.noise*0.5),o,G.n);
    });
    nW++;
  }
  let bi=0; tot.forEach((v,i)=>{ if(v>tot[bi]) bi=i; });
  return L[bi];
}
// scelta del manifesto: colore in cui si hanno più carte e alte; la carta scelta vale subito il suo numero
function aiMan(s,mode){
  const h=G.hands[s], cand=h.filter(c=>c.k!==BLACK); if(!cand.length) return h[0];
  if(mode==='rnd') return cand[rnd(cand.length)];
  let best=cand[0], bv=-1e9;
  for(const c of cand){
    const same=h.filter(d=>d.k===c.k&&d!==c), v=TUN.ma*c.r+TUN.mb*same.length+TUN.mc*same.reduce((a,d)=>a+d.r,0)+Math.random()*0.05;
    if(v>bv){ bv=v; best=c; }
  }
  return best;
}

// ═════════════════════════ PARTITA ═════════════════════════
function newMatch(n){
  if(PR){ const r=PR.rej; PR=null; r(ABORT); }
  const ns=n===2?4:n;
  G={n,ns,own:n===2?[0,1,0,1]:Array.from({length:n},(_,i)=>i),lab:n===2?['L','R','R','L']:null,R:OPT.rounds==='n'?n:3,rd:0,
     msg:'',log:[],over:null,show:null,phase:'',turn:-1,hands:[],rows:[],man:[],ind:[BLACK,...shuffle([0,1,2,3])],plays:[],leader:0,trick:0,ntr:0,rem:[0,0,0,0,0],res:null,fresh:-1,set:0,
     pl:Array.from({length:n},(_,i)=>({id:i,name:NAMES[i],total:0,hist:[]}))};
  run();
}
function dealRound(){
  const n=G.n, ns=G.ns, pool=POOL_ALL.filter(c=>c.r<=MAXR[n]), sh=shuffle(pool.slice()), hs=HS[n];
  G.hands=[]; for(let s=0;s<ns;s++) G.hands.push(sortHand(sh.slice(s*hs,(s+1)*hs)));
  G.rem=[0,0,0,0,0]; pool.forEach(c=>{ G.rem[c.k]|=1<<c.r; });
  G.set=sh.length-ns*hs; G.man=new Array(ns).fill(null); G.rows=Array.from({length:ns},()=>[]);
  G.plays=[]; G.trick=0; G.ntr=hs-1; G.res=null; G.fresh=-1; G.phase='man';
  if(G.rd>1) G.ind=[BLACK,...G.ind.filter(k=>k!==BLACK)];
}
function takeMan(s,c){ G.hands[s].splice(G.hands[s].indexOf(c),1); G.man[s]=c; }
function revealMan(){
  G.man.forEach((c,s)=>{ G.rows[s]=[{k:c.k,n:1,sum:c.r,cards:[c]}]; G.rem[c.k]&=~(1<<c.r); });
  let b=0;
  for(let s=1;s<G.ns;s++){ const a=G.man[s], x=G.man[b]; if(a.r>x.r||(a.r===x.r&&G.ind.indexOf(a.k)<G.ind.indexOf(x.k))) b=s; }
  G.leader=b; G.phase='play';
}
function humanMan(s){
  const g=G, h=G.hands[s], ok=h.filter(c=>c.k!==BLACK), L=ok.length?ok:h;
  return new Promise((res,rej)=>{ PR={type:'turn',kind:'man',seat:s,legal:new Set(L.map(c=>c.id)),sel:null,res,rej}; render(); }).then(v=>{ if(g!==G) throw ABORT; return v; });
}
function humanTurn(s){
  const g=G, h=G.hands[s];
  if(h.length===1){ status(`${nameOf(s)}: hai una sola carta, ${cname(h[0])}.`); return sleep(900).then(()=>h[0]); }
  return new Promise((res,rej)=>{ PR={type:'turn',kind:'play',seat:s,legal:new Set(h.map(c=>c.id)),sel:null,res,rej}; render(); }).then(v=>{ if(g!==G) throw ABORT; return v; });
}
function tapCard(id){
  if(!PR||PR.type!=='turn'||!PR.legal.has(id)) return;
  const c=G.hands[PR.seat].find(x=>x.id===id);
  if(!OPT.undo){ const r=PR.res; PR=null; render(); r(c); return; }
  PR.sel=PR.sel===id?null:id; render();
}
function goTurn(kind){
  if(!PR||PR.type!=='turn'||PR.sel==null) return;
  if(kind==='x'){ PR.sel=null; render(); return; }
  const c=G.hands[PR.seat].find(x=>x.id===PR.sel), r=PR.res; PR=null; render(); r(c);
}
const indTxt = () => G.ind.map(k=>COLS[k].n).join(' > ');
function turnHint(){
  const s=PR.seat, lab=G.lab?` (mano ${G.lab[s]==='L'?'sinistra':'destra'})`:'';
  if(PR.kind==='man') return `<b>Scegli il tuo manifesto${lab}</b>: il colore della carta che scegli è quello che dovrai raccogliere in questo round. La carta vale subito il suo numero. Le carte nere non si possono scegliere.`;
  return `Vince la carta più alta del colore più forte tra quelle giocate (ora: ${esc(indTxt())}); chi vince prende tutte le carte. Non c'è obbligo di rispondere al colore. Tocca a te${lab}.`;
}
function previewText(c){
  const s=PR.seat;
  if(PR.kind==='man'){
    const same=G.hands[s].filter(d=>d.k===c.k&&d!==c).length;
    return `${esc(cname(c))} (${COLS[c.k].sub}): parti con ${c.r} punti nella fila del manifesto. Nella mano ti restano ${same} ${plural(same,'altra carta','altre carte')} di questo colore.`;
  }
  const X=G.plays, rest=G.ns-X.length-1, rows=G.rows[s];
  const win=X.every(x=>beats(c,x.c,G.ind));
  const cards=X.map(x=>x.c).concat([c]), d=takeScore(rows,cards)-scoreRows(rows);
  return `${esc(cname(c))}: ${X.length?(win?'al momento batte le carte sul tavolo':'al momento non vince la presa'):'sei di mano'}${rest?`; ${rest} ${plural(rest,'giocatore deve','giocatori devono')} ancora giocare`:''}. Se prendessi le ${cards.length} carte sul tavolo, i tuoi punti cambierebbero di ${sgn(d)} (con le file nel modo migliore).`;
}
async function humanOrder(nk,cards){
  const ord=[]; let rest=nk.slice();
  while(rest.length>1){
    const k=await ask(HUM,`Hai preso colori nuovi: quale fila metti ${ord.length?'subito dopo':'più in alto'} tra le nuove? (le file non si spostano più)`,
      rest.map(k=>{ const n=cards.filter(c=>c.k===k).length; return {label:`${COLS[k].n} · ${n} ${plural(n,'carta','carte')}`,value:k,k}; }));
    ord.push(k); rest=rest.filter(x=>x!==k);
  }
  return ord.concat(rest);
}
async function oneTrick(){
  const ns=G.ns; G.trick++; G.plays=[]; G.res=null; G.fresh=-1;
  const t=G.trick, leader=G.leader;
  logMsg(`Round ${G.rd}/${G.R} · presa ${t}/${G.ntr}: di mano ${nameOf(leader)}.`);
  status(`Round ${G.rd}/${G.R} · presa ${t}/${G.ntr}: di mano ${nameOf(leader)}.`);
  await sleep(600);
  for(let k=0;k<ns;k++){
    const s=(leader+k)%ns, o=G.own[s];
    G.turn=s; status(`Presa ${t}/${G.ntr} · tocca a ${nameOf(s)}.`);
    let c;
    if(o===HUM) c=await humanTurn(s); else { await sleep(550); c=aiCard(s); }
    playCard(G,s,c); G.fresh=s;
    logMsg(`${nameOf(s)} gioca ${cname(c)}.`);
  }
  G.turn=-1;
  const w=trickWin(G.plays,G.ind), cards=G.plays.map(x=>x.c), nk=newColors(G.rows[w.s],cards);
  let ord;
  if(G.own[w.s]===HUM&&nk.length>=2){ G.res={w:w.s}; status(`Vinci la presa con ${cname(w.c)}! Ora disponi le carte.`); ord=await humanOrder(nk,cards); }
  const r=settleTrick(G,ord);
  G.res={w:r.w}; G.leader=r.w;
  const msg=`${nameOf(r.w)} vince la presa con ${cname(r.wc)} e prende ${r.cards.length} carte (${r.cards.map(cname).join(', ')}). Forza ora: ${indTxt()}.`;
  status(msg); logMsg(msg);
  await sleep(2300);
}
async function roundEnd(){
  const sc=G.rows.map(r=>scoreRows(r)), pts=roundPts(G);
  G.pl.forEach(p=>{ p.total+=pts[p.id]; p.hist.push(pts[p.id]); });
  logMsg(`Round ${G.rd} concluso: ${G.pl.map(p=>`${p.name} ${sgn(pts[p.id])} (totale ${p.total})`).join(' · ')}.`);
  const last=G.rd===G.R;
  G.show={sc,pts,bd:G.rows.map(r=>breakdown(r)),last}; G.phase='end'; G.plays=[]; G.res=null; G.turn=-1;
  status(last?'Partita conclusa: ecco il risultato.':`Round ${G.rd} concluso.`);
  await ask(HUM,'Punteggio del round',[{label:last?'Mostra risultato finale':'Prossimo round',value:1}]);
  G.show=null;
}
async function run(){
  const g=G;
  try{
    status(`Buona partita a For the People, ${P(HUM).name}!`);
    await ask(HUM,`Round 1/${g.R} · all'inizio il Nero è il colore più forte (poi: ${g.ind.slice(1).map(k=>COLS[k].n).join(', ')})`,[{label:'Ok, si parte',value:1}]);
    for(let rd=1;rd<=g.R;rd++){
      g.rd=rd; dealRound();
      logMsg(`— Round ${rd}/${g.R}: ${g.ns} mani da ${HS[g.n]} carte, ${g.set} ${plural(g.set,'carta','carte')} messe da parte. Forza: ${indTxt()} —`);
      // manifesti
      for(let s=0;s<g.ns;s++){
        if(g.own[s]===HUM){ status('Scegli il tuo manifesto.'); takeMan(s,await humanMan(s)); }
        else takeMan(s,aiMan(s));
      }
      revealMan();
      logMsg(`Manifesti: ${g.man.map((c,s)=>`${nameOf(s)} ${cname(c)}`).join(' · ')}. Di mano ${nameOf(g.leader)}.`);
      status(`Manifesti rivelati. Di mano ${nameOf(g.leader)} (manifesto più alto).`);
      await ask(HUM,`Manifesti rivelati · di mano ${nameOf(g.leader)}`,[{label:'Inizia le prese',value:1}]);
      for(let i=0;i<g.ntr;i++) await oneTrick();
      await roundEnd();
    }
    const m=Math.max(...g.pl.map(p=>p.total));
    g.over={winners:g.pl.filter(p=>p.total===m).map(p=>p.id)};
    g.turn=-1; g.show=null; render();
  }catch(e){
    if(e===ABORT||g!==G) return;
    console.error(e); G.log.unshift('Errore: '+e.message); render();
  }
}

  return `<div class="ind">${G.ind.map((k,i)=>`<div class="itok k${k} ${i===0?'top':''}" title="${COLS[k].n} (${COLS[k].sub})"><span class="ia"></span><b>${COLS[k].n}</b><span>${i===0?'più forte':(i===4?'più debole':(i+1)+'°')}</span></div>`).join('')}</div>`;
}
function liveOf(s){ return G.rows[s]&&G.rows[s].length?scoreRows(G.rows[s]):'–'; }
function playedHtml(s){
  const x=G.plays.find(y=>y.s===s);
  if(x) return `<div class="tableau">${cardHtml(x.c,`mini ${G.res&&G.res.w===s&&G.plays.length===G.ns?'win':''} ${G.fresh===s&&!G.res?'fresh':''}`)}</div>`;
  return `<div class="tableau">${G.phase==='play'?'<span class="slot"></span>':''}</div>`;
}
function subHtml(s,pos){
  const o=G.own[s], human=o===HUM, hl=G.hands[s].length, active=G.turn===s;
  let h='';
  if(human){
    h=`<div class="hand">${G.hands[s].map(c=>{
      if(PR&&PR.type==='turn'&&PR.seat===s){ const lg=PR.legal.has(c.id); return cardHtml(c,`${lg?'legal':'dim'} ${PR.sel===c.id?'sel':''}`,'button',`${lg?'':'disabled'} data-t="${c.id}"`); }
      return cardHtml(c);
    }).join('')}</div>`;
  }else h=`<div class="backs">${Array.from({length:hl},()=>'<span class="back"></span>').join('')}</div>`;
  const m=G.man[s]&&G.phase!=='man'?G.man[s]:null;
  const meta=`<div class="seat-meta">${G.lab?`<span class="tag"><b>${G.lab[s]==='L'?'Sinistra':'Destra'}</b></span>`:''}${m?`<span class="tag man k${m.k}">Manifesto ${esc(cname(m))}</span>`:''}<span class="tag"><b>${hl}</b> ${plural(hl,'carta','carte')}${G.phase==='play'?` · <b>${liveOf(s)}</b> pt`:''}</span></div>`;
  const tb=G.phase==='play'?playedHtml(s):'';
  const inner=pos==='bottom'?`${tb}${meta}${h}`:(pos==='top'?`${h}${meta}${tb}`:`${meta}${tb}${h}`);
  return `<div class="sub ${active?'active':''}">${inner}</div>`;
}
function flagHtml(o){
  if(G.over) return G.over.winners.includes(o)?'<span class="flag win">Vince</span>':'';
  return G.phase==='play'&&G.own[G.leader]===o?'<span class="flag lead">Di mano</span>':'';
}
function seatHtml(o,pos){
  const pl=P(o), ss=seatsOf(o);
  const name=`<div class="seat-name"><span class="nm" style="--sc:${SEATC[o]}">${esc(pl.name)}</span><div class="nmrow">${flagHtml(o)}<span class="tag">totale <b>${pl.total}</b></span></div></div>`;
  const subs=ss.map(s=>subHtml(s,pos)).join('');
  const act=ss.includes(G.turn), ld=G.phase==='play'&&!G.over&&ss.includes(G.leader)&&G.turn<0&&!G.plays.length;
  const wn=(G.res&&ss.includes(G.res.w)&&G.plays.length===G.ns)||(G.over&&G.over.winners.includes(o));
  const inner=pos==='bottom'?`${name}<div class="subs">${subs}</div>`:(pos==='top'?`<div class="subs">${subs}</div>${name}`:`${name}<div class="subs">${subs}</div>`);
  return `<div class="seat ${pos} ${ld?'leader':''} ${act?'active':''} ${wn&&!G.over?'winner':''}">${inner}</div>`;
}
function centerHtml(){
  let top='';
  if(G.over) top='<div><b>Partita conclusa</b></div>';
  else if(G.res&&G.plays.length===G.ns) top=`<div>Presa a <b>${esc(nameOf(G.res.w))}</b></div>`;
  return `<div class="center">${top}<span class="rbox">Round ${G.rd||1}/${G.R}</span>
    <div>${G.phase==='play'&&G.trick?`Presa <b>${Math.min(G.trick,G.ntr)}/${G.ntr}</b>`:(G.phase==='man'?'Scelta dei manifesti':'')}</div>
    ${G.set?`<div class="hint">${G.set} ${plural(G.set,'carta','carte')} da parte</div>`:''}</div>`;
}
function rowsHtml(s){
  const rows=G.rows[s]; if(!rows||!rows.length) return '<div class="hint">Nessuna carta ancora.</div>';
  const bd=breakdown(rows);
  return rows.map((r,i)=>{
    const b=bd[i], t=i===0?`manifesto`:(b.kind==='ok'?`≤ ${b.above}`:`&gt; ${b.above}`);
    return `<div class="arow k${r.k}"><span class="al"><i></i>${COLS[r.k].n}<span style="font-weight:500;color:var(--text-soft)">${r.n}</span></span><span class="cs">${sortCards(r.cards).map(c=>chipN(c,'s')).join('')}</span><span class="ar ${b.pts<0?'neg':'pos'}">${sgn(b.pts)}<small>${t}</small></span></div>`;
  }).join('');
}
const sortCards = a => a.slice().sort((x,y)=>x.r-y.r);
function acqHtml(){
  const owners=G.pl.map(p=>p.id);
  return `<div class="scorebox"><h3>CARTE ACQUISITE (LE FILE, DALL'ALTO: LA PRIMA È IL MANIFESTO)</h3><div class="acq">${owners.map(o=>seatsOf(o).map(s=>{
    const live=G.rows[s].length?scoreRows(G.rows[s]):0;
    return `<div class="ab"><div class="ab-h"><span class="nm" style="--sc:${SEATC[o]}">${esc(P(o).name)}${G.lab?' '+G.lab[s]:''}</span><span class="tot">${sgn(live)} ora</span></div>${rowsHtml(s)}</div>`;
  }).join('')).join('')}</div></div>`;
}
function unseenHtml(){
  const hum=seatsOf(HUM), pm=G.rem.slice();
  hum.forEach(s=>G.hands[s].forEach(c=>{ pm[c.k]&=~(1<<c.r); }));
  const rows=[0,1,2,3,4].map(k=>{
    const cs=[]; for(let r=1;r<=13;r++) if(pm[k]>>r&1) cs.push(CARD[k*16+r]);
    return `<div class="ur k${k}"><span class="l">${COLS[k].n}</span>${cs.map(c=>chipN(c,'s')).join('')||'<span class="hint">—</span>'}</div>`;
  }).join('');
  return `<div class="scorebox"><h3>CARTE NON ANCORA USCITE (NON IN MANO TUA E NON GIOCATE; COMPRESE QUELLE DA PARTE)</h3><div class="unseen">${rows}</div></div>`;
}
function scoreTable(){
  const nr=G.pl[0].hist.length;
  const rows=G.pl.map(p=>`<tr class="${p.id===HUM?'me':''}"><td>${esc(p.name)}</td>${p.hist.map(x=>`<td class="${x<0?'neg':''}">${x}</td>`).join('')}<td><b>${p.total}</b></td></tr>`).join('');
  return `<div class="scroll-x"><table class="score"><tr><th>Punteggi</th>${Array.from({length:nr},(_,i)=>`<th>R${i+1}</th>`).join('')}<th>Totale</th></tr>${rows}</table></div>`;
}
function showHtml(){
  const sh=G.show;
  return G.pl.map(p=>seatsOf(p.id).map(s=>{
    const parts=sh.bd[s].map(b=>b.kind==='man'?`<span class="tag man k${b.k}">${COLS[b.k].n}: ${b.sum}</span>`:`<span class="tag ${b.kind}">${COLS[b.k].n} ${b.n} ${b.kind==='ok'?'≤':'&gt;'} ${b.above}: ${sgn(b.pts)}</span>`).join(' ');
    return `<div class="ab"><div class="ab-h"><span class="nm" style="--sc:${SEATC[p.id]}">${esc(p.name)}${G.lab?' '+G.lab[s]:''}</span><b>${sgn(sh.sc[s])}</b></div><div class="seat-meta" style="justify-content:flex-start">${parts}</div></div>`;
  }).join('')+(G.lab?`<div class="hint"><b>${esc(p.name)}</b>: conta la mano con meno punti: ${sgn(sh.pts[p.id])}.</div>`:'')).join('');
}
function dockHtml(){
  if(!G) return `<div class="dock-msg">For the People contro l'AI. Quanti round?</div>
    <div class="opts">${ROUND_OPTS.map(r=>`<button class="opt ${OPT.rounds===r?'on':''}" data-r="${r}">${r===3?'3 round':'Tanti round quanti i giocatori'}</button>`).join('')}</div>
    <div class="dock-title">QUANTI GIOCATORI IN TUTTO?</div>
    <div class="opts">${[2,3,4,5].map(n=>`<button class="opt" data-n="${n}">${n} giocatori (tu + ${n-1} AI)${n===2?' · variante a due mani':''}</button>`).join('')}</div>`;
  if(G.over){
    const w=G.over.winners.map(i=>esc(P(i).name)).join(' e ');
    return `<div class="dock-msg"><b>${G.over.winners.length>1?'Vittoria condivisa: ':'Vince '}${w}!</b></div>${scoreTable()}`;
  }
  let html=`<div class="dock-msg">${esc(G.msg)}</div>`;
  if(G.show) html+=`<div class="acq">${showHtml()}</div>`;
  if(PR&&PR.type==='choose'){
    html+=`<div class="dock-title">${esc(PR.title).toUpperCase()}</div><div class="opts">${PR.options.map((o,i)=>`<button class="opt ${o.k!==undefined?'k'+o.k:''}" ${o.disabled?'disabled':''} data-i="${i}">${o.k!==undefined?'<span class="dot"></span>':''}${esc(o.label)}</button>`).join('')}</div>`;
  }else if(PR&&PR.type==='turn'){
    const PH_M='13 Verde (agricoltura): parti con 13 punti nella fila del manifesto. Nella mano ti restano 5 altre carte di questo colore.';
    const PH_P='13 Giallo: al momento non vince la presa; 3 giocatori devono ancora giocare. Se prendessi le 4 carte sul tavolo, i tuoi punti cambierebbero di −13 (con le file nel modo migliore).';
    const ph=PR.kind==='man'?PH_M:PH_P;
    html+=`<div class="hint">${turnHint()}</div>`;
    if(PR.sel!=null){
      const c=G.hands[PR.seat].find(x=>x.id===PR.sel);
      html+=`<div class="stack"><div class="hint">${previewText(c)}</div><div class="hint" style="visibility:hidden" aria-hidden="true">${ph}</div></div><div class="opts"><button class="opt k${c.k}" data-go="play"><span class="dot"></span>${esc((PR.kind==='man'?'Manifesto: ':'Gioca ')+cname(c))}</button><button class="opt" data-go="x">Annulla</button></div>`;
    }else if(OPT.undo) html+=`<div class="stack"><div class="hint"></div><div class="hint" style="visibility:hidden" aria-hidden="true">${ph}</div></div><div class="opts" style="visibility:hidden" aria-hidden="true"><button class="opt" tabindex="-1">Manifesto: 13 Verde</button><button class="opt" tabindex="-1">Annulla</button></div>`;
  }
  return html;
}
function recapHtml(){
  return `<details class="recap" ${RECAPOPEN?'open':''}><summary>RIEPILOGO</summary>
    <div class="recap-row"><span class="lbl">Carte</span><span class="rv">${G.n===3?'32 carte (numeri fino al 7, nero 4–7)':(G.n===5?'62 carte (tutte)':'47 carte (numeri fino al 10, nero 4–10)')}: Verde, Blu, Rosso, Giallo e le carte nere della corruzione · ${HS[G.n]} carte a testa${G.n===2?' per ciascuna delle due mani':''}</span></div>
    <div class="recap-row"><span class="lbl">Manifesto</span><span class="rv">ognuno sceglie una carta (non nera): il suo colore è quello da raccogliere e vale subito il suo numero · di mano chi ha il numero più alto</span></div>
    <div class="recap-row"><span class="lbl">Presa</span><span class="rv">si gioca qualsiasi carta · vince il colore più in alto negli indicatori di forza, a parità il numero più alto · chi vince prende tutte le carte e le mette in file per colore</span></div>
    <div class="recap-row"><span class="lbl">Forza</span><span class="rv">se vince il nero l'indicatore nero va in fondo; se vince un altro colore va in fondo quello e il nero sale di un posto</span></div>
    <div class="recap-row"><span class="lbl">Punti</span><span class="rv">fila del manifesto: somma dei numeri · ogni altra fila: se ha lo stesso numero di carte o meno della fila sopra +1 a carta, altrimenti − la somma dei suoi numeri</span></div></details>`;
}
const RULES_HTML = () => `
<details class="rules" ${RULESOPEN?'open':''}><summary>REGOLAMENTO</summary>
<div class="rtext">
<h4>Che gioco è</h4>
<p>For the People è un gioco di prese per 2–5 giocatori. Ognuno è il leader di un partito politico e cerca di raccogliere carte politica di un colore preciso, il suo <b>manifesto</b>. Si gioca in tre round. I colori che non hai scelto come manifesto possono costarti punti se ne raccogli troppe carte. Le carte nere, la <b>corruzione</b>, sono potenti ma, se usate male, fanno perdere molti punti.</p>
<h4>Componenti</h4>
<ul><li><b>52 carte politica</b> numerate 1–13 in quattro colori: Verde (agricoltura, cuori), Blu (scienza, fiori), Rosso (militare, picche), Giallo (industria, quadri).</li>
<li><b>10 carte corruzione</b> nere, numerate 4–13.</li>
<li><b>5 carte indicatore di forza</b>, una per colore (le trovi in alto nell'app).</li></ul>
<h4>Preparazione</h4>
<p>Le carte usate dipendono dal numero di giocatori (i colori sono sempre tutti e cinque): con <b>3</b> giocatori si tolgono i numeri 8–13 di ogni colore (32 carte, 10 a testa, 2 da parte); con <b>4</b> si tolgono 11–13 (47 carte, 11 a testa, 3 da parte); con <b>5</b> si usano tutte le 62 carte (12 a testa, 2 da parte). Le carte da parte non si guardano.</p>
<p>L'indicatore <b>nero</b> è in cima alla colonna della forza (più in alto = più forte); sotto ci sono gli altri quattro, mescolati.</p>
<h4>Un round</h4>
<ol><li><b>Manifesto.</b> Ognuno sceglie dalla mano una carta e la mette coperta davanti a sé: il suo colore è il suo manifesto per il round. <b>Le carte nere non si possono scegliere.</b> Si scoprono insieme: di mano è chi ha il numero più alto; a parità conta la forza del colore. Il manifesto va nell'area delle carte acquisite come se fosse già stato vinto.</li>
<li><b>Presa.</b> A turno, in senso orario, ognuno gioca una carta scoperta, qualsiasi (<b>nessun obbligo di rispondere al colore</b>). Vince la carta di colore più forte secondo gli indicatori; se più carte hanno quel colore vince il numero più alto. Chi vince prende tutte le carte giocate.</li>
<li><b>Carte acquisite.</b> Le carte si dispongono per colore in file. Se esiste già una fila di quel colore, la carta va a destra; altrimenti si apre una nuova fila sotto le altre (se si prendono più colori nuovi insieme, scegli tu in che ordine). <b>Una fila, una volta aperta, non si sposta più.</b> La posizione verticale delle file conta per il punteggio.</li>
<li><b>Variazione.</b> Dopo la presa si aggiornano gli indicatori: se ha vinto una carta <b>nera</b>, l'indicatore nero va in fondo alla colonna; se ha vinto un <b>altro colore</b>, il suo indicatore va in fondo e il nero sale di un posto (se non è già in cima). Le carte nere usate, quindi, tornano forti in fretta.</li>
<li>Chi ha vinto apre la presa dopo. Il round finisce quando le mani sono vuote.</li></ol>
<h4>Punteggio del round</h4>
<ul><li><b>Fila del manifesto:</b> somma dei numeri di tutte le sue carte (compreso il manifesto): sono i tuoi punti.</li>
<li><b>Ogni altra fila</b>, dall'alto in basso, si confronta con la fila <b>subito sopra</b>: se ha lo <b>stesso numero di carte o meno</b>, ogni carta vale <b>1 punto</b> (qualunque sia il numero); se ha <b>più carte</b>, <b>perdi</b> la somma dei numeri di quella fila.</li>
<li>Il punteggio del round è la somma di tutto (può essere negativo).</li></ul>
<h4>Round successivo</h4>
<p>L'indicatore nero torna in cima, gli altri restano nell'ordine in cui erano alla fine dell'ultima presa. Si raccolgono tutte le carte (anche quelle da parte), si rimescolano e si distribuiscono di nuovo.</p>
<h4>Fine della partita</h4>
<p>Dopo tre round (oppure tanti round quanti sono i giocatori, a seconda degli accordi) vince il totale più alto. Se tutti sono in negativo vince il meno negativo. In caso di parità la vittoria è condivisa.</p>
<h4>Variante avanzata a 2 giocatori</h4>
<p>Si prepara come per 4 giocatori. Ognuno riceve <b>due mani da 10 carte</b>, sinistra (L) e destra (R), tenute separate, e gioca per entrambe: l'ordine è Giocatore 1 (L), Giocatore 2 (R), Giocatore 1 (R), Giocatore 2 (L), e così via. Ogni mano sceglie il suo manifesto e ha le proprie carte acquisite; di mano è chi ha il manifesto più alto tra i quattro. A fine round si punteggiano le due mani con le regole normali, ma conta <b>solo il punteggio più basso</b> delle due.</p>
<p><i>Nell'app:</i> il primo di mano del primo round si decide dai manifesti, come da regolamento. Nell'ordine di forza i colori nuovi presi nella stessa presa si possono mettere in fila nell'ordine che preferisci (l'AI sceglie l'ordine che le dà più punti subito). Il nero sale di un posto dopo aver tolto dalla colonna il colore che ha vinto (la nuova posizione di quest'ultimo è il fondo). A due giocatori usiamo il mazzo da 4 giocatori (47 carte) con mani da 10 carte e 7 carte da parte; a tre o quattro giocatori la mano ha una carta in più di quelle che si giocano, perché una è il manifesto. Le carte giocate e le file sono pubbliche; nel menu puoi attivare la tabella «Carte non ancora uscite». L'AI conosce la propria mano, le carte già uscite e quante carte ha ciascuno, non le mani altrui né le carte da parte. Nel menu c'è «Abilita annulla» (chiede conferma prima di giocare una carta).</p>
</div></details>`;

function menuHtml(){
  return `<div class="menu-wrap"><button class="hamb" type="button" data-menu="1" aria-label="Opzioni" aria-expanded="${MENUOPEN}"><svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 1h16M1 7h16M1 13h16"/></svg></button>
    ${MENUOPEN?`<div class="menu-pop">
      <label class="opt-toggle" title="Chiede conferma prima di giocare una carta"><input type="checkbox" id="optUndo" ${OPT.undo?'checked':''}> Abilita annulla</label>
      <label class="opt-toggle" title="Mostra le carte che non sono in mano tua e non sono ancora state giocate"><input type="checkbox" id="optSeen" ${OPT.seen?'checked':''}> Mostra le carte non ancora uscite</label>
    </div>`:''}</div>`;
}
document.getElementById('app').addEventListener('toggle',e=>{
  if(!e.target.matches) return;
  if(e.target.matches('details.log')) LOGOPEN=e.target.open;
  else if(e.target.matches('details.rules')) RULESOPEN=e.target.open;
  else if(e.target.matches('details.recap')) RECAPOPEN=e.target.open;
},true);
function render(){
  const app=document.getElementById('app');
  const top=`<div class="topbar"><div class="logo"><span class="emb"></span><span class="t">For the People<small>${G&&G.rd?`ROUND ${G.rd} DI ${G.R}`:'GIOCO DI PRESE'}</small></span></div>
    ${window.nyloBackBtn?nyloBackBtn():""}${nyloHomeBtn()}
    ${G&&!G.over&&G.rd?`<span class="badge">Round ${G.rd}/${G.R}</span>`:''}
    ${G?`<button class="btn btn-sm" data-new="1">Nuova partita</button>`:''}
    ${menuHtml()}</div>`;
  let body='';
  if(G){
    const ready=G.hands.length>0;
    body=`${ready?`<div class="scorebox"><h3>FORZA DEI COLORI · IN CIMA IL PIÙ FORTE</h3>${indHtml()}</div>`:''}
      ${ready?`<div class="table n${G.n}">${G.pl.map((p,i)=>seatHtml(i,POS[G.n][i])).join('')}${centerHtml()}</div>`:''}
      ${ready&&G.phase!=='man'?acqHtml():''}
      ${ready&&OPT.seen&&!G.over?unseenHtml():''}
      ${G.pl[0].hist.length&&!G.over?`<div class="scorebox"><h3>PUNTEGGI</h3>${scoreTable()}</div>`:''}
      ${logHtml()}
      ${recapHtml()}
      ${RULES_HTML()}`;
  }
  const lb=app.querySelector('.logbody'), lbTop=lb?lb.scrollTop:0;
  app.innerHTML=top+`<div class="dock${G&&(G.show||G.over)?' tall':''}">${dockHtml()}</div>`+body;
  if(lbTop){ const nb=app.querySelector('.logbody'); if(nb) nb.scrollTop=lbTop; }
}

document.getElementById('app').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||b.disabled) return;
  if(b.dataset.menu){ MENUOPEN=!MENUOPEN; render(); return; }
  if(b.dataset.r){
    OPT.rounds=b.dataset.r==='n'?'n':3;
    try{ localStorage.setItem('fp-rounds',String(OPT.rounds)); }catch(err){}
    render(); return;
  }
  if(b.dataset.n){ MENUOPEN=false; const n=Number(b.dataset.n); if(G) newMatch(n); else askName(n); }
  else if(b.dataset.new){ if(confirm('Iniziare una nuova partita?')){ MENUOPEN=false; toSetup(); } }
  else if(b.dataset.i!==undefined) answer(Number(b.dataset.i));
  else if(b.dataset.t!==undefined) tapCard(Number(b.dataset.t));
  else if(b.dataset.go!==undefined) goTurn(b.dataset.go);
});
document.getElementById('app').addEventListener('change',e=>{
  if(e.target.id==='optUndo'){
    OPT.undo=e.target.checked;
    try{ localStorage.setItem('fp-undo',OPT.undo?'1':'0'); }catch(err){}
    if(!OPT.undo&&PR&&PR.type==='turn'&&PR.sel!=null) PR.sel=null;
    render();
  }else if(e.target.id==='optSeen'){
    OPT.seen=e.target.checked;
    try{ localStorage.setItem('fp-seen',OPT.seen?'1':'0'); }catch(err){}
    render();
  }
});
document.addEventListener('click',e=>{ if(MENUOPEN&&!e.target.closest('.menu-wrap')){ MENUOPEN=false; render(); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&MENUOPEN){ MENUOPEN=false; render(); } });
render();

</script>
</body>
</html>
