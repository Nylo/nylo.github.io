  4:{maxV:12,hand:9,open:4,tokens:10,rounds:4,maxPlays:2}
};
const PLAYS = 8;      // carte giocate da ciascuno in un round (ne resta 1 in mano)
const ZBONUS = 30;    // scommessa 0 riuscita
const TEAMZ = 60;     // valore usato dall'AI per la scommessa 0 a squadre (vittoria immediata)
const HUM = 0;
const POS = {2:['bottom','top'],3:['bottom','left','right'],4:['bottom','left','top','right']};
const NAMES = ['Tu','AI Ago','AI Bottone','AI Cucito'];
const SEATC = ['#ffd166','#ff6fa8','#6ee7b7','#7cc4ff'];
const ico = n => `<i class="ph-fill ph-${n}"></i>`;

// ═════════════════════════ UTILITÀ ═════════════════════════
const rnd = n => Math.floor(Math.random()*n);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
let G = null, PR = null;
const OPT = {undo:true};
try{ const s=localStorage.getItem('bt-undo'); if(s!==null) OPT.undo=s==='1'; }catch(e){}
function logMsg(t){ G.log.unshift(t); if(G.log.length>800) G.log.pop(); render(); }
const argmax = a => { let b=0; for(let i=1;i<a.length;i++) if(a[i]>a[b]) b=i; return b; };

// ═════════════════════════ CARTE E REGOLE (funzioni pure) ═════════════════════════
// una carta è un intero: seme*16 + valore
const mk = (s,v) => s*16+v;
const cs = c => c>>4, cv = c => c&15;
const cardName = c => `${cv(c)} ${SUITS[cs(c)]}`;
const sortHand = h => h.sort((a,b)=>a-b);
function makeDeck(maxV){ const d=[]; for(let s=0;s<4;s++) for(let v=1;v<=maxV;v++) d.push(mk(s,v)); return d; }
const plu = (n,s,p) => `${n} ${n===1?s:p}`;
const bonusOf = (b,t) => b===t ? (b===0?ZBONUS:5*b) : 0;
const partner = p => (p+2)&3;

// Risoluzione di una presa (5 carte, o meno a fine round). TC/TO = carte e proprietari (-1 = carta iniziale).
// Ritorna il proprietario del vincitore, -1 se la presa viene scartata; i dettagli sono in RC.
const RC = {idx:-1,kind:'',suit:-1};
const TC = [0,0,0,0,0], TO = [0,0,0,0,0], CNT = [0,0,0,0];
function resolveCore(k){
  CNT[0]=CNT[1]=CNT[2]=CNT[3]=0;
  for(let i=0;i<k;i++) CNT[TC[i]>>4]++;
  let mx=0,nt=0;
  for(let s=0;s<4;s++){ if(CNT[s]>mx){ mx=CNT[s]; nt=1; } else if(CNT[s]===mx&&mx>0) nt++; }
  if(nt===1){   // un seme ha la maggioranza netta: vince la carta più alta di quel seme
    let b=-1;
    for(let i=0;i<k;i++) if(CNT[TC[i]>>4]===mx&&(b<0||TC[i]>TC[b])) b=i;
    RC.idx=b; RC.kind='high'; RC.suit=TC[b]>>4; return TO[b];
  }
  // pareggio per la maggioranza: vince la carta più bassa tra quelle dei semi in pareggio
  let low=99;
  for(let i=0;i<k;i++) if(CNT[TC[i]>>4]===mx&&(TC[i]&15)<low) low=TC[i]&15;
  const cand=[];
  for(let i=0;i<k;i++) if(CNT[TC[i]>>4]===mx&&(TC[i]&15)===low) cand.push(i);
  if(cand.length===1){ RC.idx=cand[0]; RC.kind='low'; RC.suit=TC[cand[0]]>>4; return TO[cand[0]]; }
  // spareggio: si confronta la seconda carta più bassa dei semi a pari merito
  let best=99, bi=[];
  for(const i of cand){
    const s=TC[i]>>4; let v1=99,v2=99;
    for(let j=0;j<k;j++) if((TC[j]>>4)===s){ const v=TC[j]&15; if(v<v1){ v2=v1; v1=v; } else if(v<v2) v2=v; }
    if(v2<best){ best=v2; bi=[i]; } else if(v2===best) bi.push(i);
  }
  if(best===99||bi.length>1){ RC.idx=-1; RC.kind='tie'; RC.suit=-1; return -1; }
  RC.idx=bi[0]; RC.kind='low2'; RC.suit=TC[bi[0]]>>4; return TO[bi[0]];
}
function resolveXs(st,plays,cx,px){
  let k=0; TC[0]=st; TO[0]=-1; k=1;
  for(let i=0;i<plays.length;i++){ TC[k]=plays[i].c; TO[k]=plays[i].p; k++; }
  if(cx>=0){ TC[k]=cx; TO[k]=px; k++; }
  return resolveCore(k);
}

// stato di gioco "leggero" S, usato sia dalla partita vera che dalle simulazioni dell'AI:
// {n,cfg,team,hands[][],open[{id,start,plays[{p,c}]}],draw[],cw[] carte vinte,tr[] prese vinte,bets[],disc,nid}
function legalTricks(S,p){
  const r=[];
  for(let ti=0;ti<S.open.length;ti++){
    const t=S.open[ti]; if(t.plays.length>=4) continue;
    let m=0; for(const x of t.plays) if(x.p===p) m++;
    if(m<S.cfg.maxPlays) r.push(ti);
  }
  return r;
}
function nextMover(S,last){
  for(let k=1;k<=S.n;k++){ const q=(last+k)%S.n; if(S.hands[q].length>S.cfg.hand-PLAYS&&legalTricks(S,q).length) return q; }
  return -1;
}
function applyPlay(S,p,ci,ti){ const c=S.hands[p].splice(ci,1)[0]; S.open[ti].plays.push({p,c}); return c; }
// risolve la presa ti: assegna carte e presa, e (se reveal) apre una nuova presa dal mazzo
function settleTrick(S,ti,reveal){
  const t=S.open[ti], k=t.plays.length+1;
  const owner=resolveXs(t.start,t.plays,-1,-1);
  const res={id:t.id,p:owner,idx:RC.idx,kind:RC.kind,suit:RC.suit,start:t.start,plays:t.plays.slice(),n:k,card:-1,reveal:-1};
  if(res.idx>=0) res.card=res.idx===0?t.start:t.plays[res.idx-1].c;
  if(owner>=0){ S.cw[owner]+=k; S.tr[owner]++; } else S.disc+=k;
  if(reveal&&S.draw.length){ res.reveal=S.draw.pop(); S.open[ti]={id:++S.nid,start:res.reveal,plays:[]}; }
  else S.open.splice(ti,1);
  return res;
}
function finishRound(S){ while(S.open.length) settleTrick(S,S.open.length-1,false); }
function cloneS(S){
  return {n:S.n,cfg:S.cfg,team:S.team,hands:S.hands.map(h=>h.slice()),
    open:S.open.map(t=>({id:t.id,start:t.start,plays:t.plays.map(x=>({p:x.p,c:x.c}))})),
    draw:S.draw.slice(),cw:S.cw.slice(),tr:S.tr.slice(),bets:S.bets.slice(),disc:S.disc,nid:S.nid};
}
// punteggio del round di ogni giocatore (a squadre: della sua squadra). Scommesse sconosciute (null) = nessun bonus.
function scoresOf(S){
  if(!S.team) return S.cw.map((c,i)=>c+(S.bets[i]==null?0:bonusOf(S.bets[i],S.tr[i])));
  const t=[0,1].map(k=>{
    let c=0,tr=0,b=0,unk=false; for(const i of [k,k+2]){ c+=S.cw[i]; tr+=S.tr[i]; if(S.bets[i]==null) unk=true; else b+=S.bets[i]; }
    return c+(unk?0:(b===tr?(b===0?TEAMZ:5*b):0));
  });
  return [t[0],t[1],t[0],t[1]];
}
// quanto manca alla scommessa (di squadra se a squadre): >0 servono prese, 0 evitarle, <0 scommessa persa
function needOf(S,q){
  const b=S.bets[q]; if(b==null) return 1;
  if(S.team){ const m=partner(q), bb=S.bets[m]; if(bb==null) return 1; return b+bb-S.tr[q]-S.tr[m]; }
  return b-S.tr[q];
}

// ═════════════════════════ AI ═════════════════════════
const AIP = {play:700,bet:330,eps:0.05,peps:0.12};
// politica veloce per le simulazioni: guarda chi vincerebbe la presa con la carta giocata
function polMove(S,q,eps){
  const lt=legalTricks(S,q), h=S.hands[q];
  if(Math.random()<eps) return {ci:rnd(h.length),ti:lt[rnd(lt.length)]};
  const avoid=needOf(S,q)===0, tm=S.team?partner(q):-2;
  let best=-1e9,bc=0,bt=lt[0];
  for(let a=0;a<lt.length;a++){
    const ti=lt[a], t=S.open[ti], full=t.plays.length===3;
    for(let ci=0;ci<h.length;ci++){
      const o=resolveXs(t.start,t.plays,h[ci],q);
      const mine=o===q||o===tm;
      let sc;
      if(full){
        if(o<0) sc=avoid?0.8:-0.2;
        else if(mine) sc=avoid?-3:1.5+0.15*(t.plays.length+1);
        else sc=avoid?0.5:-0.5;
      }else{
        if(o<0) sc=0;
        else if(mine) sc=avoid?-0.4:0.4;
        else sc=avoid?0.2:-0.2;
      }
      sc+=Math.random()*0.6;
      if(sc>best){ best=sc; bc=ci; bt=ti; }
    }
  }
  return {ci:bc,ti:bt};
}
function playout(S,last,eps){
  let g=0;
  for(;;){
    const p=nextMover(S,last); if(p<0||++g>400) break;
    const m=polMove(S,p,eps);
    applyPlay(S,p,m.ci,m.ti);
    if(S.open[m.ti].plays.length>=4) settleTrick(S,m.ti,true);
    last=p;
  }
  finishRound(S);
}
// mondo campione: mani avversarie e mazzo di pesca estratti a caso dalle carte che p non può vedere
function worldFor(p){
  const S0=G.S, mine=S0.hands[p];
  let pool=[];
  for(const c of G.deckAll) if(!G.seen.has(c)&&!mine.includes(c)) pool.push(c);
  shuffle(pool);
  const S=cloneS(S0);
  let fixed=-1;
  if(S0.team&&G.gave[p]!=null&&pool.includes(G.gave[p])){ fixed=G.gave[p]; pool=pool.filter(c=>c!==fixed); }
  for(let q=0;q<S0.n;q++){
    if(q===p) continue;
    S.hands[q]=[]; if(fixed>=0&&q===partner(p)) S.hands[q].push(fixed);
    while(S.hands[q].length<S0.hands[q].length) S.hands[q].push(pool.pop());
  }
  S.draw=pool.slice(0,S0.draw.length);
  return S;
}
function valOf(S,p){
  const sc=scoresOf(S); let opp=-1e9;
  for(let q=0;q<S.n;q++) if(q!==p&&!(S.team&&q===partner(p))&&sc[q]>opp) opp=sc[q];
  return sc[p]-opp;
}
function aiPlay(p){
  const S0=G.S, lt=legalTricks(S0,p), h=S0.hands[p];
  const moves=[]; for(const ti of lt) for(let ci=0;ci<h.length;ci++) moves.push({ci,ti});
  if(Math.random()<AIP.eps) return moves[rnd(moves.length)];
  if(moves.length===1) return moves[0];
  const N=Math.max(6,Math.min(40,Math.round(AIP.play/moves.length)));
  const sc=new Array(moves.length).fill(0);
  for(let k=0;k<N;k++){
    const W=worldFor(p);
    for(let j=0;j<moves.length;j++){
      const S=cloneS(W), m=moves[j];
      applyPlay(S,p,m.ci,m.ti);
      if(S.open[m.ti].plays.length>=4) settleTrick(S,m.ti,true);
      playout(S,p,AIP.peps);
      sc[j]+=valOf(S,p);
    }
  }
  return moves[argmax(sc)];
}
// scommesse note durante la fase scommesse: chi ha preso bottoni, o ha passato, ha una scommessa
function betsFor(p,b){
  return G.pl.map((pl,q)=>q===p?b:(pl.passed||pl.tokens>0?pl.tokens:(G.team&&q===partner(p)?0:null)));
}
function aiBet(p){
  const pl=P(p), h=pl.tokens, T=G.pool;
  const cands=[]; for(let b=h;b<=h+T&&b<=h+10;b++) cands.push(b);
  const N=Math.max(8,Math.round(AIP.bet/cands.length));
  const sc=new Array(cands.length).fill(0);
  for(let k=0;k<N;k++){
    const W=worldFor(p);
    for(let j=0;j<cands.length;j++){
      const S=cloneS(W); S.bets=betsFor(p,cands[j]);
      playout(S,G.dealer,AIP.peps);
      sc[j]+=scoresOf(S)[p];
    }
  }
  return cands[argmax(sc)]-h;
}
// carta da passare al compagno (versione a squadre): la più "di mezzo", cioè quella che né vince né perde facilmente
function aiGive(p){
  const h=G.S.hands[p], mV=G.cfg.maxV;
  let bi=0,bs=1e9;
  for(let i=0;i<h.length;i++){
    const v=cv(h[i]), s=Math.max((v-1)/(mV-1),(mV-v)/(mV-1))+Math.random()*0.15;
    if(s<bs){ bs=s; bi=i; }
  }
  return bi;
}

// ═════════════════════════ INTERAZIONE ═════════════════════════
// confirm = la scelta va confermata (se «Abilita annulla» è attivo)
async function ask(p,title,options,confirm){
  const ok=options.filter(x=>!x.disabled);
  if(!ok.length) return null;
  const g=G;
  return new Promise((res,rej)=>{ PR={type:'choose',title,options,confirm:!!confirm,sel:null,res,rej}; render(); }).then(v=>{ if(g!==G) throw ABORT; return v; });
}
function answer(i){
  if(!PR||PR.type!=='choose') return;
  const o=PR.options[i]; if(!o||o.disabled) return;
  if(PR.confirm&&OPT.undo){ PR.sel=i; render(); return; }
  const r=PR.res; PR=null; render(); r(o.value);
}
function confirmAns(ok){
  if(!PR||PR.type!=='choose'||PR.sel==null) return;
  if(!ok){ PR.sel=null; render(); return; }
  const o=PR.options[PR.sel], r=PR.res; PR=null; render(); r(o.value);
}
// mossa: carta + presa (give = si sceglie solo una carta da passare al compagno)
function askMove(lt,give){
  const g=G;
  return new Promise((res,rej)=>{ PR={type:'move',lt,give:!!give,selC:null,selT:null,res,rej}; render(); }).then(v=>{ if(g!==G) throw ABORT; return v; });
}
function finishMove(){
  const r=PR.res, v=PR.give?PR.selC:{ci:PR.selC,ti:PR.selT};
  PR=null; render(); r(v);
}
function pickCard(i){
  if(!PR||PR.type!=='move'||i<0||i>=G.S.hands[HUM].length) return;
  PR.selC=i;
  if(PR.give){ if(OPT.undo) render(); else finishMove(); return; }
  PR.selT=PR.lt.length===1?PR.lt[0]:null;
  if(PR.selT!=null&&!OPT.undo) finishMove(); else render();
}
function pickTrick(ti){
  if(!PR||PR.type!=='move'||PR.give||PR.selC==null||!PR.lt.includes(ti)) return;
  PR.selT=ti;
  if(OPT.undo) render(); else finishMove();
}
function confirmMove(ok){
  if(!PR||PR.type!=='move'||PR.selC==null) return;
  if(!ok){ PR.selC=null; PR.selT=null; render(); return; }
  if(!PR.give&&PR.selT==null) return;
  finishMove();
}

function newMatch(n,team){
  if(PR){ const r=PR.rej; PR=null; r(ABORT); }
  team=!!team&&n===4;
  const cfg=CFG[n];
  G={n,team,cfg,rounds:cfg.rounds,round:0,dealer0:rnd(n),dealer:0,phase:'idle',turn:-1,msg:'',log:[],over:null,show:null,S:null,
     seen:new Set(),deckAll:makeDeck(cfg.maxV),keep:Array.from({length:n},()=>[]),pool:0,lastRes:null,gave:[],recv:-1,instant:null,
     pl:Array.from({length:n},(_,i)=>({id:i,name:NAMES[i],tokens:0,passed:false,decided:false})),un:[]};
  G.un = team
    ? [0,1].map(k=>({name:`${NAMES[k]} + ${NAMES[k+2]}`,m:[k,k+2],total:0,hist:[]}))
    : G.pl.map((p,i)=>({name:p.name,m:[i],total:0,hist:[]}));
  run();
}
const unitOf = p => G.team ? p%2 : p;
function deal(){
  const g=G, n=g.n, cfg=g.cfg;
  g.dealer=(g.dealer0+g.round)%n;
  const kept=new Set(); g.keep.forEach(a=>a.forEach(c=>kept.add(c)));
  const pool=shuffle(g.deckAll.filter(c=>!kept.has(c)));
  const S={n,cfg,team:g.team,hands:[],open:[],draw:[],cw:Array(n).fill(0),tr:Array(n).fill(0),bets:Array(n).fill(null),disc:0,nid:0};
  for(let i=0;i<n;i++) S.hands.push(sortHand(g.keep[i].concat(pool.splice(0,cfg.hand-g.keep[i].length))));
  for(let k=0;k<cfg.open;k++) S.open.push({id:++S.nid,start:pool.pop(),plays:[]});
  S.draw=pool;
  g.S=S; g.seen=new Set(S.open.map(t=>t.start));
  g.pl.forEach(p=>{ p.tokens=0; p.passed=false; p.decided=false; });
  g.pool=cfg.tokens; g.gave=[]; g.recv=-1; g.lastRes=null; g.show=null; g.turn=-1;
}
// versione a squadre: ogni giocatore passa una carta coperta al compagno (scambio simultaneo)
async function exchange(){
  const g=G, S=g.S; g.phase='swap';
  const give=[];
  for(let p=0;p<4;p++){
    g.turn=p;
    if(p===HUM){
      status('Scambio con il compagno: scegli una carta da passargli a faccia in giù.');
      give[p]=S.hands[p][await askMove([],true)];
    }else give[p]=S.hands[p][aiGive(p)];
  }
  g.turn=-1;
  for(let p=0;p<4;p++){ S.hands[p].splice(S.hands[p].indexOf(give[p]),1); g.gave[p]=give[p]; }
  for(let p=0;p<4;p++){ S.hands[partner(p)].push(give[p]); }
  for(let p=0;p<4;p++) sortHand(S.hands[p]);
  g.recv=give[partner(HUM)];
  logMsg(`Scambio carte: passi ${cardName(give[HUM])} a ${P(partner(HUM)).name} e ricevi ${cardName(g.recv)}.`);
}
async function bettingPhase(){
  const g=G, n=g.n; g.phase='bet';
  const order=[]; for(let k=1;k<=n;k++) order.push((g.dealer+k)%n);
  while(g.pool>0&&g.pl.some(p=>!p.passed)){
    for(const p of order){
      const pl=P(p); if(pl.passed||g.pool===0) continue;
      g.turn=p; let k;
      if(p===HUM){
        status(`Tocca a te: quanti bottoni scommessa prendi? Ne restano ${g.pool}${pl.tokens?`, ne hai già ${pl.tokens}`:''}.`);
        const opts=[]; for(let i=1;i<=Math.min(g.pool,10);i++) opts.push({label:`Prendi ${i}`,value:i,num:true});
        opts.push({label:pl.tokens?`Passa (scommessa: ${pl.tokens})`:'Passa (scommetto 0 prese)',value:0});
        k=await ask(HUM,'Scommessa',opts,true);
      }else{
        status(`${pl.name} decide la scommessa…`); await sleep(700);
        k=pl.decided?0:aiBet(p); pl.decided=true;
      }
      if(k>0){ pl.tokens+=k; g.pool-=k; logMsg(`${pl.name} ${V(p,'prende','prendi')} ${k} ${k===1?'bottone':'bottoni'} (ora ne ${V(p,'ha','hai')} ${pl.tokens}).`); }
      else{ pl.passed=true; logMsg(pl.tokens?`${pl.name} ${V(p,'passa','passi')} con ${pl.tokens} ${pl.tokens===1?'bottone':'bottoni'}: ${V(p,'scommette','scommetti')} ${pl.tokens} ${pl.tokens===1?'presa':'prese'}.`:`${pl.name} ${V(p,'passa','passi')} senza bottoni: ${V(p,'scommette','scommetti')} 0 prese.`); }
    }
  }
  g.S.bets=g.pl.map(p=>p.tokens);
  g.turn=-1;
  logMsg('Scommesse: '+(g.team
    ? g.un.map(u=>`${u.name} ${u.m.reduce((a,i)=>a+P(i).tokens,0)}`).join(' · ')
    : g.pl.map(p=>`${p.name} ${p.tokens}`).join(' · '))+'.');
}
function describeRes(r){
  const w=r.p>=0?(you(r.p)?'te':P(r.p).name):'';
  const base=`Presa ${r.id}`;
  if(r.kind==='tie') return `${base}: pareggio senza vincitore, presa scartata (${plu(r.n,'carta','carte')}).`;
  if(r.p<0) return `${base}: vince la carta iniziale (${cardName(r.card)}), presa scartata (${plu(r.n,'carta','carte')}).`;
  const pts=`+${r.n} ${r.n===1?'carta':'carte'}, +1 presa`;
  if(r.kind==='high') return `${base}: ${SUITS[r.suit]} in maggioranza, vince la carta più alta (${cardName(r.card)}) di ${w} (${pts}).`;
  if(r.kind==='low') return `${base}: pareggio tra semi, vince la carta più bassa (${cardName(r.card)}) di ${w} (${pts}).`;
  return `${base}: pareggio anche sulla carta più bassa, spareggio con la seconda: vince ${cardName(r.card)} di ${w} (${pts}).`;
}
async function playRound(){
  const g=G, S=g.S; g.phase='play';
  let last=g.dealer, guard=0;
  logMsg(`Fase prese: inizia ${P((g.dealer+1)%g.n).name}, poi in senso orario.`);
  for(;;){
    const p=nextMover(S,last); if(p<0||++guard>600) break;
    g.turn=p; const pl=P(p), lt=legalTricks(S,p);
    let mv;
    if(p===HUM){ status('Tocca a te: scegli una carta e la presa in cui giocarla.'); mv=await askMove(lt,false); }
    else{ status(`${pl.name} sta scegliendo…`); await sleep(500); mv=aiPlay(p); }
    const tid=S.open[mv.ti].id, c=applyPlay(S,p,mv.ci,mv.ti);
    g.seen.add(c); g.recv=-1;
    logMsg(`${pl.name} ${V(p,'gioca','giochi')} ${cardName(c)} nella presa ${tid}.`);
    if(S.open[mv.ti].plays.length>=4){
      g.turn=-1; status(`La presa ${tid} è completa…`); await sleep(1000);
      const res=settleTrick(S,mv.ti,true);
      if(res.reveal>=0) g.seen.add(res.reveal);
      g.lastRes=res; logMsg(describeRes(res)); status(describeRes(res)+(res.reveal>=0?` Si apre la presa ${S.open[mv.ti].id}.`:''));
      await sleep(1500);
    }
    last=p;
  }
  g.turn=-1;
  status('Fine del round: ogni giocatore tiene 1 carta; le prese ancora aperte si risolvono con le regole normali.');
  await sleep(1200);
  while(S.open.length){
    const res=settleTrick(S,0,false);
    g.lastRes=res; logMsg(describeRes(res)); status(describeRes(res)); await sleep(1300);
  }
}
async function scoreRound(){
  const g=G, S=g.S, last=g.round===g.rounds-1;
  g.phase='score'; g.keep=S.hands.map(h=>h.slice());
  const rows=g.un.map((u,k)=>{
    let bet=0,tr=0,cards=0; for(const i of u.m){ bet+=P(i).tokens; tr+=S.tr[i]; cards+=S.cw[i]; }
    const ok=bet===tr, zero=ok&&bet===0;
    const bonus=g.team&&zero?0:bonusOf(bet,tr);
    return {k,bet,tr,cards,bonus,ok,zero,tot:cards+bonus};
  });
  rows.forEach(r=>{ g.un[r.k].total+=r.tot; g.un[r.k].hist.push(r.tot); });
  g.show={rows};
  if(g.team){
    const z=rows.filter(r=>r.zero).map(r=>r.k);
    if(z.length){ g.instant=z; logMsg(`${z.map(k=>g.un[k].name).join(' e ')}: scommessa di 0 prese riuscita, vittoria immediata!`); }
  }
  logMsg('Punteggio del round: '+rows.map(r=>`${g.un[r.k].name} ${plu(r.cards,'carta','carte')}${r.bonus?` + ${r.bonus} bonus`:''} = ${r.tot}`).join(' · ')+'.');
  status(`Round ${g.round+1} concluso.`);
  if(last||g.instant) return;
  await ask(HUM,'Round concluso',[{label:'Prossimo round',value:1}]);
  g.show=null;
}
async function run(){
  const g=G;
  try{
    G.welcome=true; await ask(HUM,`Buona partita a Button, ${P(HUM).name}!`,[{label:'Ok, si parte',value:1}]); G.welcome=false;
    for(let r=0;r<g.rounds;r++){
      g.round=r; deal();
      logMsg(`— Round ${r+1}/${g.rounds}: mazziere ${P(g.dealer).name}; ${g.cfg.hand} carte a testa, ${g.cfg.open} prese aperte, ${g.S.draw.length} carte nel mazzo di pesca —`);
      if(g.team) await exchange();
      await bettingPhase();
      await playRound();
      await scoreRound();
      if(g.instant) break;
    }
    let ws;
    if(g.instant) ws=g.instant.slice();
    else{ const mx=Math.max(...g.un.map(u=>u.total)); ws=g.un.map((u,k)=>u.total===mx?k:-1).filter(k=>k>=0); }
    g.over={winners:ws};
    g.phase='over'; g.turn=-1;
    logMsg('Punteggio finale: '+g.un.map(u=>`${u.name} ${u.total}`).join(' · ')+'.');
    render();
  }catch(e){
    if(e===ABORT||g!==G) return;
    console.error(e); G.log.unshift('Errore: '+e.message); render();
  }
}

const RULES_HTML = `
<details class="rules paper"><summary>REGOLAMENTO</summary>
<div class="rtext">
<h4>Panoramica</h4>
<p>In Button ogni presa è una passerella di moda in cui gli stilisti fanno sfilare il loro capo di punta. Se una tendenza (un seme) emerge chiaramente, vince il capo più convenzionale, cioè la carta più alta di quel seme. Se nessuna tendenza domina (due semi pari), vince il capo più originale, cioè la carta più bassa. Prevedi quante prese vincerai prendendo bottoni scommessa: se indovini, bonus!</p>
<h4>Componenti e preparazione (4 giocatori)</h4>
<p>48 carte in 4 semi (Leopardato, Righe, Pied-de-poule, Tartan) con valori da 1 a 12 e 10 bottoni scommessa. Il primo mazziere è casuale. Si distribuiscono 9 carte a testa e si mettono 4 carte scoperte al centro: ognuna è la carta iniziale di una presa aperta. Le 8 carte rimaste formano il mazzo di pesca.</p>
<h4>Fase scommesse</h4>
<p>Inizia il giocatore a sinistra del mazziere, poi si procede in senso orario. Nel proprio turno si prendono quanti bottoni si vuole, oppure si passa; chi passa non può prenderne altri. Chi non prende nessun bottone scommette di vincere 0 prese. Le scommesse proseguono finché finiscono i bottoni o tutti hanno passato.</p>
<h4>Fase prese</h4>
<p>Inizia il giocatore a sinistra del mazziere e si procede in senso orario. Nel proprio turno si gioca una carta in una presa aperta. Un giocatore può giocare al massimo 2 volte nella stessa presa (nella partita a 2 giocatori, 3 volte) e ci sono sempre 4 prese aperte (tante quante i giocatori).</p>
<p>Appena una presa contiene 5 carte (la carta iniziale e quattro giocate) si risolve subito:</p>
<ul>
<li><b>Maggioranza netta</b> di un seme: vince la carta più alta di quel seme.</li>
<li><b>Due semi pari</b> per la maggioranza (es. 2-2-1): vince la carta più bassa tra quelle dei semi in pareggio. Se anche le due carte più basse sono uguali, si confronta la seconda carta dei due semi: vince la più bassa. Se è ancora pari, la presa viene scartata.</li>
<li>Chi vince prende tutte le carte della presa e le mette coperte davanti a sé; il numero di prese vinte resta visibile. Se vince la <b>carta iniziale</b>, la presa viene scartata.</li>
</ul>
<p>Poi si scopre una carta dal mazzo di pesca per aprire una nuova presa e si riparte dal giocatore successivo.</p>
<h4>Fine del round e punteggio</h4>
<p>Quando tutti hanno giocato 8 carte (ne resta 1 in mano) il round finisce: ognuno tiene la carta rimasta per il round successivo e le prese ancora aperte si risolvono con le regole normali; contano per le scommesse.</p>
<ul>
<li>Ogni <b>carta vinta</b> vale 1 punto.</li>
<li>Scommessa riuscita (prese vinte = bottoni presi): <b>5 punti per ogni bottone</b>.</li>
<li>Scommessa di 0 bottoni e nessuna presa vinta: <b>30 punti</b>.</li>
<li>Scommessa fallita: nessun bonus, solo i punti delle carte.</li>
</ul>
<h4>Nuovo round e fine partita</h4>
<p>Il giocatore a sinistra del mazziere diventa il nuovo mazziere, che rimescola tutte le carte tranne quelle tenute e ne dà 8 a testa (si arriva a 9 con quella tenuta); si scoprono nuove prese e si riparte dalle scommesse. Dopo 4 round vince chi ha il punteggio totale più alto (pari merito: vittoria condivisa).</p>
<h4>Varianti</h4>
<p><b>2 giocatori:</b> mazzo da 28 carte (valori 1–7), 2 prese aperte, 8 carte di pesca, 7 bottoni, fino a 3 giocate per presa, 4 round.</p>
<p><b>3 giocatori:</b> mazzo da 36 carte (valori 1–9), 3 prese aperte, 6 carte di pesca, 9 bottoni, fino a 2 giocate per presa, 3 round.</p>
<p><b>A squadre (4 giocatori):</b> chi siede di fronte è compagno. Prima delle scommesse i compagni si scambiano una carta a faccia in giù. La scommessa della squadra è la somma dei bottoni dei due giocatori e la squadra deve vincere esattamente quel numero di prese; i punti si sommano per squadra. Una scommessa di 0 prese riuscita fa vincere subito la partita. 4 round.</p>
<p><i>Nell'app:</i> il primo mazziere e le carte sono casuali; i bottoni si prendono uno «scatto» alla volta (puoi prenderne più di uno nello stesso turno e, al giro dopo, altri); l'AI conosce solo le carte scoperte e stima il resto con simulazioni. Se un giocatore non ha nessuna presa dove giocare (ha già giocato il massimo in tutte), salta il turno. Il regolamento cita 40 carte da rimescolare, ma ne servono 44: l'app rimescola tutte le carte tranne quelle tenute.</p>
</div></details>`;

  ov.style.display='flex';
  const closeName=()=>{ ov.style.display='none'; };
  ov.onclick=e=>{ if(e.target===ov||e.target.hasAttribute('data-cancel')) closeName(); };
  ov.onkeydown=e=>{ if(e.key==='Escape') closeName(); };
  const f=ov.firstChild, inp=f.querySelector('input'); inp.focus(); inp.select();
  f.onsubmit=e=>{
    e.preventDefault();
    const v=inp.value.trim().slice(0,16)||'Tu';
    try{ localStorage.setItem('nylo-player-name',v); }catch(x){}
    NAMES[0]=v; ov.style.display='none'; newMatch(n,team);
  };
}
document.getElementById('app').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||b.disabled) return;
  if(b.dataset.menu){ MENUOPEN=!MENUOPEN; render(); return; }
  if(b.dataset.n){ const n=Number(b.dataset.n), team=b.dataset.team==='1'; if(G) newMatch(n,team); else askName(n,team); }
  else if(b.dataset.new){ if(confirm('Iniziare una nuova partita?')) toSetup(); }
  else if(b.dataset.i!==undefined) answer(Number(b.dataset.i));
  else if(b.dataset.af!==undefined) confirmAns(b.dataset.af==='1');
  else if(b.dataset.p!==undefined) pickCard(Number(b.dataset.p));
  else if(b.dataset.t!==undefined) pickTrick(Number(b.dataset.t));
  else if(b.dataset.cf!==undefined) confirmMove(b.dataset.cf==='1');
});
document.getElementById('app').addEventListener('change',e=>{
  if(e.target.id!=='optUndo') return;
  OPT.undo=e.target.checked;
  try{ localStorage.setItem('bt-undo',OPT.undo?'1':'0'); }catch(err){}
  if(!OPT.undo&&PR&&PR.type==='move'&&PR.selC!=null&&(PR.give||PR.selT!=null)){ finishMove(); return; }
  if(!OPT.undo&&PR&&PR.type==='choose'&&PR.sel!=null){ confirmAns(true); return; }
  render();
});
document.addEventListener('click',e=>{ if(MENUOPEN&&!e.target.closest('.menu-wrap')){ MENUOPEN=false; render(); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&MENUOPEN){ MENUOPEN=false; render(); } });
render();

</script>
</body>
</html>
