<!DOCTYPE html>
<html lang="it" data-home-inline>
<head>
<script src="/auth-gate.js"></script>
<script src="/home-btn.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10/12 Heart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#1c8fb5;
  --ink:#0a1e5c;
  --surface:#f4fbfe;
  --surface-raised:#dcf0f7;
  --accent:#1a48b4;
  --accent-soft:rgba(26,72,180,0.1);
  --text:#0d1b3d;
  --text-soft:#43566f;
  --danger:#b3261e;
  --success:#1c7a3c;
  --border:rgba(10,30,92,0.3);
  --radius:10px;
  --s0:#2b52b8; --s1:#d9272e; --s2:#1e9b4b; --s3:#f0bd1c;
  --t0:#1f45a6; --t1:#c11f26; --t2:#17803c; --t3:#8a6700;
  --on0:#fff; --on1:#fff; --on2:#fff; --on3:#14213d;
  --cw:46px; --ch:68px;
}
html,body{min-height:100%;color:var(--text);font-family:'Inter',sans-serif;font-size:14px}
body{background:var(--bg);position:relative}
/* nastro della cover appena accennato dietro la pagina */
body::before{content:'';position:fixed;right:-18vmin;top:-8vmin;width:70vmin;height:130vmin;pointer-events:none;z-index:0;opacity:.2;
  background:linear-gradient(160deg,#c9defc 0%,#2d62c8 38%,#0a1e6e 100%);border-radius:40vmin 40vmin 8vmin 40vmin;transform:rotate(38deg)}
.app{max-width:960px;margin:0 auto;padding:0 12px 48px;position:relative;z-index:1}

.topbar{display:flex;align-items:center;gap:10px;padding:14px 0;margin-bottom:10px;flex-wrap:wrap}
.logo{font-family:'Orbitron','Inter',sans-serif;font-size:23px;font-weight:800;line-height:1.05;flex:1;color:#fff;display:flex;align-items:center;gap:10px;min-width:0;letter-spacing:.04em;text-shadow:0 1px 0 rgba(10,30,92,.35)}
.logo svg{flex:0 0 auto;width:34px;height:34px}
.badge{background:var(--ink);color:#fff;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700;white-space:nowrap}
.btn{border-radius:7px;padding:8px 14px;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;cursor:pointer;background:#fff;color:var(--text);border:1px solid var(--ink)}
.btn:hover{background:var(--surface-raised)}
.btn-sm{padding:5px 10px;font-size:12px}
.opt-toggle{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-soft);cursor:pointer;border:0;border-radius:20px;padding:4px 10px;user-select:none}
.opt-toggle input[type=checkbox]{appearance:none;-webkit-appearance:none;position:relative;width:34px;height:19px;flex:0 0 34px;margin:0;border:1px solid var(--border);border-radius:999px;background:var(--surface-raised);cursor:pointer;transition:background .15s,border-color .15s}
.opt-toggle input[type=checkbox]::before{content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--text-soft);transition:transform .15s,background .15s}
.opt-toggle input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
.opt-toggle input[type=checkbox]:checked::before{transform:translateX(15px);background:#fff}
.opt-toggle input[type=checkbox]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.menu-wrap{position:relative;margin-left:auto}
.hamb{display:inline-flex;align-items:center;justify-content:center;width:34px;height:30px;border-radius:7px;background:#fff;color:var(--text);border:1px solid var(--ink);cursor:pointer}
.hamb:hover{background:var(--surface-raised)}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);z-index:30;min-width:230px;display:flex;flex-direction:column;gap:4px;padding:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 10px 24px rgba(10,30,92,0.3)}
.menu-pop .opt-toggle{border:0;border-radius:6px;padding:9px 10px;font-size:13px;color:var(--text);white-space:normal;line-height:1.35;text-align:left;width:100%}
.menu-pop .opt-toggle:hover{background:var(--accent-soft)}
/* nel menu le voci sono azioni a testo (home-btn.js): l'interruttore stilizzato deve restare nascosto e non occupare spazio */
.menu-pop .opt-toggle.nylo-menu-action input[type=checkbox]{position:absolute;width:1px;height:1px;flex:none;margin:0;border:0;opacity:0;pointer-events:none}
.menu-pop button.opt-toggle{appearance:none;-webkit-appearance:none;font-family:inherit;font-size:13px;font-weight:500;color:var(--text);text-align:left;background:transparent;border:0;box-shadow:none;cursor:pointer}
.flag{display:inline-block;margin-left:5px;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;vertical-align:middle;white-space:nowrap}
.flag.first{background:var(--ink);color:#fff}
.flag.lead{background:var(--accent);color:#fff}
.flag.role{background:#f0bd1c;color:#14213d}
.flag.win{background:var(--success);color:#fff}
.flag.lose{background:var(--danger);color:#fff}
.log{background:var(--surface);border:2px solid var(--ink);border-radius:var(--radius);padding:10px 14px;margin-top:12px;margin-bottom:12px;font-size:12px;color:var(--text-soft);line-height:1.6}
.log summary{cursor:pointer;font-weight:600;letter-spacing:0.05em}
.logbody{margin-top:8px;max-height:260px;overflow-y:auto;padding-right:6px}
.logbody div{border-bottom:1px solid var(--border);padding:1px 0}
.name-modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(10,30,92,0.55);padding:16px}
.name-box{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:20px;width:min(340px,100%);display:flex;flex-direction:column;gap:12px;box-shadow:0 14px 40px rgba(0,0,0,0.4)}
.name-box h3{font-family:'Orbitron',sans-serif;font-weight:800;font-size:16px}
.name-box p{font-size:12px;color:var(--text-soft)}
.name-box input{padding:9px 11px;border-radius:7px;border:1px solid var(--border);background:#fff;color:var(--text);font-size:14px;font-family:inherit;outline:none}
.name-box input:focus{border-color:var(--accent)}

.dock{position:sticky;top:0;z-index:10;background:var(--surface);border:2px solid var(--ink);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 18px rgba(10,30,92,0.25)}
.dock.tall{position:static}
.dock-msg{font-size:13px;line-height:1.5}
.dock-title{font-size:11px;font-weight:600;color:var(--text-soft);letter-spacing:0.05em}
.opts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.opt{background:#fff;border:1px solid var(--ink);color:var(--text);border-radius:6px;padding:8px 12px;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.12s;text-align:left}
.opt:hover:not(:disabled){background:var(--ink);color:#fff}
.opt:disabled{opacity:0.35;cursor:not-allowed}
.hint{font-size:12px;color:var(--text-soft);line-height:1.5}
.scroll-x{overflow-x:auto}
table.score{border-collapse:collapse;font-size:12px;width:100%}
table.score td,table.score th{padding:5px 8px;border-bottom:1px solid var(--border);text-align:right;vertical-align:middle}
table.score td:first-child,table.score th:first-child{text-align:left}
table.score .neg{color:var(--danger)}
table.score .pos{color:var(--success)}
table.score tr.me td{font-weight:700}

/* semi: icona nel colore del seme */
.ic{display:inline-block;width:14px;height:14px;vertical-align:-2px}
.ic.s0{color:var(--s0)} .ic.s1{color:var(--s1)} .ic.s2{color:var(--s2)} .ic.s3{color:var(--s3)}
.sfx{display:inline-flex;align-items:center;gap:4px}

.table{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;background:#e4f5fb;border:2px solid var(--ink);border-radius:var(--radius);padding:12px;margin:0 0 12px;min-height:480px;grid-template-areas:"top top top top top top" "left left center center right right" "bottom bottom bottom bottom bottom bottom"}
.seat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;border-radius:10px;border:1px solid transparent;text-align:center;min-width:0}
.seat.top{grid-area:top} .seat.left{grid-area:left;justify-content:center} .seat.right{grid-area:right;justify-content:center} .seat.bottom{grid-area:bottom}
.seat.leader{border:1px dashed rgba(26,72,180,0.6);background:rgba(26,72,180,0.05)}
.seat.active{border:2px solid var(--accent);background:rgba(240,189,28,0.28);box-shadow:0 0 0 2px #f0bd1c}
.seat.winner{border:2px solid var(--success);background:rgba(28,122,60,0.12)}
.seat.loser{border:2px solid var(--danger);background:rgba(179,38,30,0.09)}
.seat-name{font-weight:600;font-size:13px}
.nm{display:inline-block;padding:2px 10px;border-radius:999px;color:#16202a;font-weight:700;border:1px solid rgba(0,0,0,.4);background:var(--sc,#eee);text-shadow:none}
.brow .nm{padding:1px 7px;font-size:10px;align-self:flex-start;max-width:100%}
.seat-meta{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;align-items:center;font-size:11px}
.tag{background:rgba(10,30,92,0.09);border-radius:4px;padding:2px 6px;color:var(--text);display:inline-flex;align-items:center;gap:4px}
.tag b{color:var(--accent)}
.backs{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:230px;align-items:center}
.back{width:9px;height:14px;border-radius:2px;background:linear-gradient(135deg,#7ea6ff,#1f4fc0 55%,#0a1e6e);border:1px solid rgba(255,255,255,0.8);box-shadow:0 0 0 1px rgba(10,30,92,0.35)}
.seat.top .backs,.seat.left .backs,.seat.right .backs{display:grid;grid-template-columns:repeat(7,9px);max-width:none}
.tableau{display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center;min-height:74px;padding:4px 6px;border-radius:8px;background:rgba(10,30,92,0.05);min-width:56px}
.slot{display:inline-block;width:42px;height:62px;border:1px dashed rgba(10,30,92,0.4);border-radius:6px}
.cap{font-size:10px;color:var(--text-soft);line-height:1.2}

/* carte: colore pieno del seme, numero grande inclinato (come nella cover), icona del seme negli angoli */
.hc{width:var(--cw);height:var(--ch);border-radius:6px;border:2px solid rgba(255,255,255,.85);display:inline-block;position:relative;flex-shrink:0;padding:0;overflow:hidden;box-shadow:0 2px 4px rgba(10,30,92,0.35),inset 0 0 0 1px rgba(10,30,92,.25);font-family:'Orbitron','Inter',sans-serif}
.hc.s0{background:linear-gradient(160deg,#4a74da,#1f45a6);color:var(--on0)} .hc.s1{background:linear-gradient(160deg,#ef4a50,#b5171d);color:var(--on1)}
.hc.s2{background:linear-gradient(160deg,#35be68,#13783a);color:var(--on2)} .hc.s3{background:linear-gradient(160deg,#ffd75a,#e0a90d);color:var(--on3)}
.hc .cn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:800;transform:rotate(-9deg);line-height:1}
.hc .ci{position:absolute;left:3px;top:3px;line-height:0}
.hc .ci .ic{width:11px;height:11px;color:inherit}
.hc .ci2{position:absolute;right:3px;bottom:3px;line-height:0;transform:rotate(180deg)}
.hc .ci2 .ic{width:11px;height:11px;color:inherit}
.hc.mini{width:42px;height:62px;--cw:42px}
.hc.mini .cn{font-size:23px}
.hc.fresh{box-shadow:0 0 0 3px #f0bd1c}
.hc.win{box-shadow:0 0 0 3px var(--success)}
button.hc{cursor:pointer;transition:transform 0.12s}
button.hc:hover:not(:disabled){transform:translateY(-6px)}
button.hc:disabled{cursor:default}
.hc.dim{opacity:0.4;filter:saturate(0.5)}
.hc.legal{box-shadow:0 0 0 2px var(--ink),0 0 0 4px rgba(240,189,28,0.95)}
.hc.sel{transform:translateY(-12px);box-shadow:0 0 0 2px #fff,0 0 0 5px var(--accent)}
button.hc.sel:hover:not(:disabled){transform:translateY(-12px)}
.hand{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;padding-top:14px}
.pchips{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.pchip{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 4px;border-radius:5px;font-family:'Orbitron',sans-serif;font-weight:800;font-size:11px;border:1px solid rgba(10,30,92,.35)}
.pchip.s0{background:var(--s0);color:var(--on0)} .pchip.s1{background:var(--s1);color:var(--on1)} .pchip.s2{background:var(--s2);color:var(--on2)} .pchip.s3{background:var(--s3);color:var(--on3)}
/* carte uscite (opzione del menu, solo contro l'AI) */
.unseen{display:flex;flex-direction:column;gap:6px}
.unseen .ur{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.unseen .ur .l{width:60px;font-size:11px;font-weight:700}
.pchip.gone{opacity:.2;text-decoration:line-through}
.pchip.own{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--ink)}

.center{grid-area:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;font-size:12px;line-height:1.45;color:var(--text-soft);min-width:0}
.center b{color:var(--accent)}
.trumpchip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-weight:700;font-size:12px;border:2px solid #fff;box-shadow:0 1px 4px rgba(10,30,92,.35)}
.trumpchip .ic{width:18px;height:18px;color:inherit}
.trumpchip.s0{background:var(--s0);color:var(--on0)} .trumpchip.s1{background:var(--s1);color:var(--on1)} .trumpchip.s2{background:var(--s2);color:var(--on2)} .trumpchip.s3{background:var(--s3);color:var(--on3)}
.legend{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.lg{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:5px;font-weight:600;font-size:11px;border:1px solid var(--border);background:#fff;color:var(--text)}
.mnote{font-weight:700;color:var(--success);font-size:12px}

/* tessere (spazio tessere: 2 righe × 6 categorie) */
.board{background:var(--surface);border:2px solid var(--ink);border-radius:var(--radius);padding:12px 12px 10px;margin-bottom:12px}
.board h3,.scorebox h3{font-size:11px;font-weight:600;color:var(--text-soft);letter-spacing:0.05em;margin-bottom:8px}
.bgrid{display:grid;grid-template-columns:minmax(54px,84px) repeat(6,minmax(0,1fr));gap:4px;align-items:stretch}
.bh{font-size:9px;font-weight:700;text-align:center;line-height:1.15;color:var(--text-soft);padding:2px 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.bh .st{color:#c58a00;letter-spacing:-1px;font-size:10px}
.brow{font-size:11px;font-weight:700;display:flex;flex-direction:column;justify-content:center;line-height:1.25;min-width:0}
.brow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile{min-height:48px;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-weight:800;font-size:16px;border:2px solid transparent;position:relative;padding:2px;line-height:1.1;text-align:center;min-width:0}
.tile.empty{border:1px dashed rgba(10,30,92,.35)}
.tile.down{background:linear-gradient(135deg,#7ea6ff,#1f4fc0 55%,#0a1e6e);border-color:#0a1e6e;color:rgba(255,255,255,.85);font-size:12px}
.tile.up{background:#fff;border-color:var(--ink);color:var(--ink)}
.tile.up.vy{color:var(--success)} .tile.up.vn{color:var(--danger)}
.tile.up.ok{background:#e4f6e9;border-color:var(--success)} .tile.up.ko{background:#fdeceb;border-color:var(--danger)}
.tile .sub{font-family:'Inter',sans-serif;font-weight:600;font-size:9px;color:var(--text-soft);line-height:1.15}
.tile.mine{box-shadow:0 0 0 2px #f0bd1c}
.tile.fresh{box-shadow:0 0 0 3px #f0bd1c}
button.tile{cursor:default;font-family:'Orbitron',sans-serif}
button.tile.pick{cursor:pointer;outline:3px solid #f0bd1c;outline-offset:1px;animation:tp 1.1s ease-in-out infinite}
button.tile.pick:hover{filter:brightness(1.2)}
@keyframes tp{50%{outline-color:rgba(240,189,28,.35)}}
@media(prefers-reduced-motion:reduce){button.tile.pick{animation:none}}
.bnote{font-size:11px;color:var(--text-soft);margin-top:8px;line-height:1.5}

/* modulo tessere del mazziere */
.tf{display:flex;flex-direction:column;gap:4px}
.tfr{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr);gap:6px;align-items:center;padding:4px 0;border-bottom:1px solid var(--border)}
.tfr.h{border-bottom:2px solid var(--ink);font-size:11px;font-weight:700}
.tfl{font-size:12px;font-weight:600;line-height:1.25}
.tfl small{display:block;font-size:10px;color:var(--text-soft);font-weight:500}
.ctl{display:flex;align-items:center;justify-content:center;gap:5px}
.ctl .num{min-width:36px;text-align:center;font-family:'Orbitron',sans-serif;font-weight:800;font-size:15px}
.stepb{width:30px;height:30px;border-radius:7px;border:1px solid var(--ink);background:#fff;font-size:18px;font-weight:700;color:var(--text);cursor:pointer;line-height:1}
.stepb:hover:not(:disabled){background:var(--ink);color:#fff}
.stepb:disabled{opacity:0.3;cursor:not-allowed}
.tog{min-width:74px;height:30px;border-radius:7px;border:2px solid var(--ink);background:#fff;font-size:16px;font-weight:800;cursor:pointer;font-family:'Orbitron',sans-serif}
.tog.yes{background:#e4f6e9;border-color:var(--success);color:var(--success)} .tog.no{background:#fdeceb;border-color:var(--danger);color:var(--danger)}

.scorebox{background:var(--surface);border:2px solid var(--ink);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px}
.prow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;margin-bottom:8px}
.prow .lbl{font-weight:600;color:var(--text-soft)}
.recap{background:var(--surface);border:2px solid var(--ink);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.recap-row{display:block;font-size:12px;line-height:1.7}
.recap-row > *{margin-right:6px}
.recap-row .lbl{font-weight:600;color:var(--text-soft)}
.recap-row .rv{color:var(--text-soft);margin-left:0 !important;margin-right:0}
.recap-row .lg{vertical-align:middle}
details.rules{background:var(--surface);border:2px solid var(--ink);border-radius:var(--radius);padding:14px 16px}
details.rules summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--text-soft);letter-spacing:0.05em}
details.recap{display:block;padding:14px 16px}
details.recap>summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--text-soft);letter-spacing:0.05em}
details.recap[open]>summary{margin-bottom:10px}
details.recap[open]>:not(summary)+*{margin-top:10px}
.rtext h4{font-family:'Inter',sans-serif;font-weight:800;font-size:15px;color:var(--accent);margin:14px 0 4px}
.rtext p,.rtext li{font-size:12px;line-height:1.6;color:var(--text-soft);margin-bottom:6px}
.rtext ul{padding-left:18px}

/* stanze online (kit condiviso) */
:root{--topc:#fff}
.panel{background:var(--surface);border:2px solid var(--ink);border-radius:var(--radius);padding:18px;margin-bottom:14px;display:flex;flex-direction:column;gap:12px;color:var(--text)}
.panel h2{font-size:16px;font-weight:700}
.muted{color:var(--text-soft);font-size:12px;line-height:1.5}
body .app>section>p.muted{color:var(--topc,var(--text-soft));margin-bottom:10px}
.status{font-size:13px;min-height:20px;line-height:1.5;color:var(--topc,var(--text))}
.panel input[type=text]{background:#fff;border:1px solid var(--border);color:#222;border-radius:6px;padding:9px 11px;font-family:'Inter',sans-serif;font-size:14px;width:100%;outline:none;letter-spacing:1px}
.panel input[type=text]:focus{border-color:var(--accent)}
.radios{display:flex;gap:18px;flex-wrap:wrap;font-size:13px}
.radios label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.roster{list-style:none;display:flex;flex-direction:column;gap:8px}
.roster li{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface-raised);border:1px solid var(--border);border-radius:8px;font-size:13px}
.roster .seat-n{width:20px;color:var(--text-soft)}
.roster .grow{flex:1}
.roster .soft{color:var(--text-soft)}
.room-code{padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-family:Consolas,monospace;letter-spacing:1px;font-size:12px;color:var(--topc,var(--text));border-color:var(--topc,var(--border))}

function legalIdx(hand,lead){
  const all=hand.map((_,i)=>i);
  if(lead<0) return all;
  const f=all.filter(i=>hand[i].s===lead);
  return f.length?f:all;
}

function beats(a,b,L,tr){
  const sa=a>>4, sb=b>>4;
  if(sa===tr) return sb!==tr||(a&15)>(b&15);
  if(sb===tr) return false;
  return sa===L&&(a&15)>(b&15);
}
// ids in ordine di gioco: vince la briscola più alta, altrimenti la carta più alta del seme di mano
function winIdx(ids,tr){
  const L=ids[0]>>4; let w=0;
  for(let i=1;i<ids.length;i++) if(beats(ids[i],ids[w],L,tr)) w=i;
  return w;
}
function newStats(){ return {n:[0,0,0,0],s7:[0,0,0,0],o:[0,0,0,0],f35:[false,false,false,false],sm:[0,0,0,0],lst:[false,false,false,false]}; }
function takeStats(O,w,ids,tr,tn){
  O.n[w]++;
  for(const id of ids){
    const v=id&15; O.sm[w]+=v;
    if(v===7) O.s7[w]++;
    if(v===1) O.o[w]++;
    if((id>>4)===tr&&(v===3||v===5)) O.f35[w]=true;

}

}
// punti del round per seggio: mazziere = punti di ogni tessera giusta; A/B = punti se giusta (doppi se è l'unico dei due a indovinare); C = 30 − mazziere
function scoreTiles(tiles,O,d){
  const sa=(d+1)%4, sb=(d+2)%4, sc=(d+3)%4;
  const ra=tileOf(O,sa), rb=tileOf(O,sb);
  let dl=0, a=0, b=0;
  const mA=[], mB=[];
  for(let i=0;i<6;i++){
    const k=KEYS[i], ma=tiles.A[k]===ra[k], mb=tiles.B[k]===rb[k];
    mA.push(ma); mB.push(mb);
    if(ma){ dl+=PTS[i]; a+=ma&&mb?PTS[i]:2*PTS[i]; }
    if(mb){ dl+=PTS[i]; b+=ma&&mb?PTS[i]:2*PTS[i]; }
  }
  const pts=[0,0,0,0]; pts[d]=dl; pts[sa]=a; pts[sb]=b; pts[sc]=30-dl;
  return {pts,mA,mB,ra,rb};
}
const clamp = (x,a,b) => x<a?a:(x>b?b:x);
const tileTxt = (k,v) => k==='tr'?(v===7?'7–10':String(v)):(k==='s7'?String(v):(v?'✓':'✗'));
const cardHtml = (c,cls='',tag='span',attrs='') => `<${tag} class="hc s${c.s} ${cls}" ${attrs} title="${cname(c)}"><b class="cn">${c.v}</b><i class="ci">${ico(c.s)}</i><i class="ci2">${ico(c.s)}</i></${tag}>`;

function recapHtml(){

    <div class="recap-row"><span class="lbl">Ruoli</span><span class="rv">Mazziere, poi in senso orario A, B, C · il mazziere cambia ogni round (a sinistra) · 4 round</span></div>

    <div class="recap-row"><span class="lbl">Punti</span><span class="rv">mazziere: i punti di ogni tessera giusta · A/B: i punti delle proprie tessere giuste, doppi se sono l'unico dei due a indovinare · C: 30 − punti del mazziere</span></div>
    <div class="recap-row"><span class="lbl">Fine</span><span class="rv">dopo 4 round vince il totale più alto (pari merito = vittoria condivisa)</span></div></details>`;
}
const RULES_HTML = `
<details class="rules"><summary>REGOLAMENTO</summary>
<div class="rtext">
<h4>Che gioco è</h4>
<p>10/12 Heart è un gioco di prese per <b>4 giocatori</b>. In ogni round uno di voi fa il <b>mazziere</b>: non ha carte in mano, ma vede quelle degli altri tre e deve prevedere come finirà la mano, piazzando 12 tessere coperte. Gli altri tre giocano la mano e cercano di avverare (o rovinare) quelle previsioni.</p>
<p>Una partita dura 4 round; il mazziere cambia a ogni round. Vince chi ha più punti alla fine.</p>
<h4>Componenti</h4>
<ul><li><b>30 carte</b>: Blu 1–9, Rosso 1–8, Verde 1–7, Giallo 1–6, una per valore.</li>
<li><b>Tessere giocatore</b> «A» e «B» e <b>6 tessere categoria</b>: Prese totali (★★★★), Totale 7 (★★★), Esattamente due 1, Briscola 3/5, Somma 41–50, 9ª/10ª presa (★★ ciascuna).</li>
<li><b>4 tessere briscola</b> (una per seme) e <b>36 tessere previsione</b>: 20 numerate, 8 «✓», 8 «✗». Sulle tessere numerate «7–10» rappresenta un numero da 7 a 10 compreso.</li></ul>
<h4>Preparazione</h4>
<p>Si sceglie a caso il mazziere del primo round. Le 4 tessere briscola si mettono coperte al centro e si mescolano.</p>
<h4>Fasi del round</h4>
<p><b>1. Preparazione.</b> Il mazziere sceglie una tessera briscola coperta dal centro e la gira: quel seme è la briscola del round. Dispone lo spazio tessere: le tessere giocatore A e B nella seconda e terza riga della prima colonna, le sei tessere categoria nella prima riga (dalla colonna 2 alla 7, con le stelle in ordine decrescente). Poi mescola le 30 carte e le distribuisce <i>10 a testa agli altri tre giocatori</i>: i giocatori sono chiamati A, B e C in senso orario a partire da quello alla sinistra del mazziere.</p>
<p><b>2. Piazzamento delle tessere.</b> Dopo aver guardato di nascosto le mani, il mazziere prevede come andrà la presa delle carte e piazza coperte 12 tessere sotto le categorie, 6 per la riga A e 6 per la riga B:</p>
<ul><li><b>Prese totali:</b> un numero, le prese che quel giocatore vincerà.</li>
<li><b>Totale 7:</b> un numero, quanti 7 otterrà.</li>
<li><b>Esattamente due 1:</b> ✓ se otterrà esattamente due carte «1», altrimenti ✗.</li>
<li><b>Briscola 3/5:</b> ✓ se otterrà il 3 della briscola e/o il 5 della briscola, altrimenti ✗.</li>
<li><b>Somma 41–50:</b> ✓ se la somma dei valori di tutte le carte che otterrà è tra 41 e 50 compresi, altrimenti ✗.</li>
<li><b>9ª/10ª presa:</b> ✓ se vincerà la 9ª e/o la 10ª presa, altrimenti ✗.</li></ul>
<p><b>3. Svolgimento delle prese.</b> All'inizio il mazziere sceglie una tessera coperta dalla riga A e una dalla riga B e le gira. Poi si gioca, partendo da A e in senso orario, con l'obbligo di rispondere al seme. Se non si può rispondere si gioca una carta qualsiasi, anche una briscola. Vince la briscola più alta; se non ci sono briscole, la carta più alta del seme di mano. Dalla seconda presa apre chi ha vinto la precedente. Le carte vinte restano coperte accanto al vincitore, che è l'unico a poterle guardare.</p>
<p><b>Importante:</b> quando, in senso orario, tocca al mazziere (che non ha carte) questi sceglie una qualsiasi tessera coperta tra quelle davanti a sé e la gira. Si continua finché le carte sono finite (10 prese): le tessere scoperte sono così 2 + 10 = 12.</p>
<p><b>4. Punteggio.</b></p>
<ul><li><b>Mazziere:</b> per ogni tessera (di A o di B) che corrisponde al risultato prende i punti della categoria: Prese totali 4, Totale 7 3, le altre 2 ciascuna.</li>
<li><b>Giocatori A e B:</b> se il risultato nella propria categoria corrisponde alla tessera ottengono i punti della categoria. Se sono l'unico dei due (A o B) ad aver indovinato quella categoria, i punti sono <b>doppi</b>.</li>
<li><b>Giocatore C:</b> prende 30 meno i punti totali del mazziere.</li></ul>
<p><i>Esempio:</i> A 4, 1, ✗, ✗, ✓, ✓ e B 2, 1, ✗, ✓, ✗, ✓. Il mazziere ha 4×1 + 3×2 + 2×1 + 2×1 = 14 punti; A ne fa 4×2 + 3 + 2×2 = 15; B 3 + 2×2 = 7; C 30 − 14 = 16.</p>
<h4>Round successivo e fine</h4>
<p>Il giocatore alla sinistra del mazziere (A) diventa il nuovo mazziere. Dopo 4 round (ognuno è mazziere una volta) vince il punteggio più alto; in caso di parità la vittoria è condivisa.</p>
<p><i>Nell'app:</i> il primo mazziere è scelto a caso e la briscola di ogni round è una tessera diversa pescata a caso tra le quattro (le tessere usate non tornano al centro). Le tessere numerate sono illimitate. Quando sei il mazziere vedi le mani di tutti e piazzi le tessere con un modulo (contro l'AI puoi chiedere un «Suggerimento»); scopri le tessere toccandole. Quando non sei il mazziere vedi solo la tua mano e le tessere scoperte: sotto ogni tessera scoperta della tua riga vedi a che punto sei. Le tessere coperte sono segrete anche per l'AI: A e B puntano a rendere vere le proprie tessere scoperte, C a rovinarle; l'AI ricorda le carte giocate e i semi mancanti ma non vede mai le carte altrui né le tessere coperte. Il mazziere AI vede tutte le mani e piazza le tessere simulando il round.</p>
<p><i>Nelle stanze online</i> si gioca solo tra persone (4): i posti al tavolo e il primo mazziere sono assegnati a caso, non ci sono AI né suggerimenti per le tessere. Le mani e le tessere coperte stanno nello stato condiviso ma l'interfaccia le mostra solo a chi di dovere. Nelle prese il mazziere scopre la tessera quando tocca a lui; a fine presa apre chi l'ha vinta; chiunque può passare al round successivo.</p>
</div></details>`;

<script type="text/plain" id="src-ai">
// ═════════════════════════ COSTANTI ═════════════════════════
const NAMES = ['Tu','Balil','Mira','Richard'];
const HUM = 0;

// ═════════════════════════ UTILITÀ ═════════════════════════
const rnd = n => Math.floor(Math.random()*n);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
let G = null, PR = null;
const OPT = {undo:true, seeHands:false, memo:false};
try{ const s=localStorage.getItem('hh-undo'); if(s!==null) OPT.undo=s==='1'; OPT.seeHands=localStorage.getItem('hh-seehands')==='1'; OPT.memo=localStorage.getItem('hh-memo')==='1'; }catch(e){}
const roleOf = p => (p-G.dealer+4)%4;                       // 0 mazziere, 1 A, 2 B, 3 C
const seatOfRole = r => (G.dealer+(r==='A'?1:r==='B'?2:3))%4;
const ROLEKEY = ['','A','B','C'];


// ═════════════════════════ AI ═════════════════════════
// L'AI di A/B/C conosce: la propria mano, le carte già giocate (tutte, anche nelle prese vinte), le tessere già scoperte e i semi mancanti.
// Mai le mani altrui né le tessere coperte: per le proprie tessere coperte assume che il mazziere abbia previsto l'esito "naturale" della mano.
// A/B cercano di rendere vere le proprie tessere; C cerca di renderle false. Decisioni: Monte Carlo con mani nascoste campionate e rollout con politica euristica.
// Il mazziere AI conosce tutte le mani e piazza le tessere simulando il round; sceglie quali tessere scoprire confrontando rollout.
const AIP = {ms:140, minW:24, maxW:300, eps:0.04};
const strength = (id,tr) => (((id>>4)===tr?10:0)+(id&15))/19;
function cloneS(S){
  return {d:S.d,sa:S.sa,sb:S.sb,sc:S.sc,tr:S.tr,tn:S.tn,ld:S.ld,
    h:S.h.map(a=>a.slice()),cp:S.cp.slice(),ci:S.ci.slice(),
    n:S.n.slice(),s7:S.s7.slice(),o:S.o.slice(),f35:S.f35.slice(),sm:S.sm.slice(),lst:S.lst.slice(),
    r7:S.r7,r1:S.r1,r35:S.r35,rp:S.rp,bel:S.bel,obj:S.obj,dump:S.dump};
}
// stato di simulazione dallo stato reale G con le mani date (array di id per seggio)
function mkS(hands){
  const d=G.dealer, S={d,sa:(d+1)%4,sb:(d+2)%4,sc:(d+3)%4,tr:G.trump,tn:Math.max(1,G.trickNo),ld:G.T.leader,
    h:hands,cp:G.T.plays.map(x=>x.p),ci:G.T.plays.map(x=>x.c.id),
    n:G.st.n.slice(),s7:G.st.s7.slice(),o:G.st.o.slice(),f35:G.st.f35.slice(),sm:G.st.sm.slice(),lst:G.st.lst.slice(),
    r7:0,r1:0,r35:0,rp:0,bel:null,obj:null,dump:false};
  const cnt=id=>{ const v=id&15; S.rp+=v; if(v===7)S.r7++; if(v===1)S.r1++; if((id>>4)===S.tr&&(v===3||v===5)) S.r35++; };
  hands.forEach(h=>h.forEach(cnt)); S.ci.forEach(cnt);
  return S;
}
const idsOf = hands => hands.map(h=>h.map(c=>c.id));
// utilità (in punti) per il seggio s di prendersi la presa cs, secondo le tessere t (campi mancanti = ignoti)
function U(S,s,t,cs){
  if(!t) return 0;
  const R=TRICKS-S.tn;
  let u=0;

// valore, per il seggio q, dell'esito "vince w": A/B contano solo le proprie tessere; C vuole il contrario di quanto serve ad A e B
function valueFor(S,q,w,cs){
  if(!S.bel) return w===q?1:0;
  const b=S.bel[q];
  if(q===S.sc){
    if(w===S.sa&&b[0]) return -U(S,S.sa,b[0],cs);
    if(w===S.sb&&b[1]) return -U(S,S.sb,b[1],cs);
    return 0;
  }
  if(w!==q) return 0;
  return U(S,q,q===S.sa?b[0]:b[1],cs);
}
function minBy(a,f){ let b=a[0],bv=f(b); for(let i=1;i<a.length;i++){ const v=f(a[i]); if(v<bv){ bv=v; b=a[i]; } } return b; }

function quick(S,r,cs,ps){
  const h=S.h[r], L=cs[0]>>4;
  let lg=h.filter(id=>(id>>4)===L); if(!lg.length) lg=h;
  const bi=winIdx(cs,S.tr), bid=cs[bi], bs=ps[bi];
  const want=S.bel?valueFor(S,r,r,cs)>valueFor(S,r,bs,cs):true;
  const st=id=>strength(id,S.tr);
  if(want){
    const bt=lg.filter(id=>beats(id,bid,L,S.tr));
    return bt.length?minBy(bt,st):minBy(lg,st);
  }
  const non=lg.filter(id=>!beats(id,bid,L,S.tr));
  return non.length?maxBy(non,st):minBy(lg,st);
}
function polCard(S,q,ord,i){
  const h=S.h[q]; let lg=h;
  if(i>0){ const L=S.ci[0]>>4, f=h.filter(id=>(id>>4)===L); if(f.length) lg=f; }
  if(lg.length===1) return lg[0];
  if(Math.random()<AIP.eps) return lg[rnd(lg.length)];
  let best=-1e9, bid=lg[0];
  for(const c of lg){
    const cs=S.ci.slice(), ps=S.cp.slice(); cs.push(c); ps.push(q);
    for(let j=i+1;j<3;j++){ const r=ord[j]; cs.push(quick(S,r,cs,ps)); ps.push(r); }
    const w=ps[winIdx(cs,S.tr)], st=strength(c,S.tr);
    let sc=valueFor(S,q,w,cs);
    sc+=w===q?-0.3*st:(S.dump?0.1:-0.1)*st;
    if(sc>best){ best=sc; bid=c; }

}
function nextSeat(S,p){ p=(p+1)%4; return p===S.d?(p+1)%4:p; }
function playTrick(S){
  const ord=[S.ld,0,0]; ord[1]=nextSeat(S,ord[0]); ord[2]=nextSeat(S,ord[1]);
  for(let i=S.cp.length;i<3;i++){
    const q=ord[i], id=polCard(S,q,ord,i), h=S.h[q];
    h.splice(h.indexOf(id),1); S.cp.push(q); S.ci.push(id);
  }
  const w=S.cp[winIdx(S.ci,S.tr)];

  for(const id of S.ci){ const v=id&15; S.rp-=v; if(v===7)S.r7--; if(v===1)S.r1--; if((id>>4)===S.tr&&(v===3||v===5)) S.r35--; }

function finish(S){ while(S.tn<=TRICKS) playTrick(S); }
const scoreS = S => scoreTiles(S.obj,S,S.d).pts;
function setBel(S,ownA,ownB,cA,cB){
  S.bel=[]; S.bel[S.sa]=[ownA,null]; S.bel[S.sb]=[null,ownB]; S.bel[S.sc]=[cA,cB]; S.dump=true;
}
function modalTiles(res){
  const out={A:{},B:{}};
  for(const r of ['A','B']){
    const tr=Array(8).fill(0), s7=Array(4).fill(0), c={o:0,t:0,b:0,l:0};
    res.forEach(x=>{ const t=x[r]; tr[t.tr]++; s7[t.s7]++; for(const k in c) if(t[k]) c[k]++; });
    const am=a=>{ let bi=0,bv=-1; a.forEach((v,i)=>{ const x=v+Math.random()*0.5; if(x>bv){ bv=x; bi=i; } }); return bi; };
    out[r].tr=am(tr); out[r].s7=am(s7);
    for(const k in c) out[r][k]=c[k]*2+Math.random()-0.5>=res.length;
  }
  return out;
}
// credenze nei rollout del mazziere: A/B conoscono ciascuna propria tessera con prob. pa (altrimenti assumono l'esito naturale g0), C conosce ciascuna tessera con prob. pc
function setBelDealer(S,T,g0,pa,pc){
  const fa={},fb={},ca={},cb={};
  KEYS.forEach(k=>{
    fa[k]=Math.random()<pa?T.A[k]:g0.A[k]; fb[k]=Math.random()<pa?T.B[k]:g0.B[k];
    if(Math.random()<pc) ca[k]=T.A[k];
    if(Math.random()<pc) cb[k]=T.B[k];
  });
  setBel(S,fa,fb,ca,cb); S.obj=T;
}
// piazzamento delle 12 tessere (mazziere AI e «Suggerimento»): conosce tutte le mani
function aiPlaceTiles(){
  const base=mkS(idsOf(G.hands));
  const run=(N,setup,collect)=>{ for(let i=0;i<N;i++){ const S=cloneS(base); setup(S); finish(S); collect(S); } };
  const tl=S=>({A:tileOf(S,S.sa),B:tileOf(S,S.sb)});
  const nat=[]; run(250,S=>{ S.bel=null; S.dump=false; },S=>nat.push(tl(S)));
  const g0=modalTiles(nat), sets=[g0]; let cur=g0;
  for(let it=0;it<4;it++){
    const out=[]; run(200,S=>setBelDealer(S,cur,g0,0.6,0.5),S=>out.push(tl(S)));
    cur=modalTiles(out); sets.push(cur);
  }
  const evalSet=(T,N)=>{ let tot=0; run(N,S=>setBelDealer(S,T,g0,0.6,0.5),S=>{ tot+=scoreS(S)[S.d]; }); return tot/N; };
  let best=g0, bv=-1;
  sets.forEach(T=>{ const v=evalSet(T,250); if(v>bv){ bv=v; best=T; } });
  // rifinitura: prova a ritoccare ogni tessera (±1 per i numeri, ✓/✗ per le altre) e tiene i ritocchi che migliorano chiaramente
  const T={A:{...best.A},B:{...best.B}};
  for(const r of ['A','B']) for(const k of KEYS){
    const o=T[r][k], mx=k==='tr'?7:3;
    const alts=(k==='tr'||k==='s7')?[o-1,o+1].filter(x=>x>=0&&x<=mx):[!o];
    for(const a of alts){
      T[r][k]=a; const v=evalSet(T,250);
      if(v>bv+0.3){ bv=v; break; }
      T[r][k]=o;
    }
  }
  return T;
}
// tessere già note ai giocatori (scoperte): oggetti parziali
function revealed(role){
  const o={}; KEYS.forEach(k=>{ if(G.rev[role+':'+k]) o[k]=G.tiles[role][k]; }); return o;
}
// quale tessera coperta scoprire (mazziere AI): massimizza i punti attesi del mazziere nei rollout
function aiFlip(allowed){
  if(allowed.length===1) return allowed[0];
  const base=mkS(idsOf(G.hands));
  const nat=[]; for(let i=0;i<24;i++){ const S=cloneS(base); S.bel=null; S.dump=false; finish(S); nat.push({A:tileOf(S,S.sa),B:tileOf(S,S.sb)}); }
  const g0=modalTiles(nat), rA=revealed('A'), rB=revealed('B');
  let best=allowed[0], bv=-1e9;
  for(const key of allowed){
    const [r,k]=key.split(':'), cA={...rA}, cB={...rB};
    (r==='A'?cA:cB)[k]=G.tiles[r][k];
    const oA={...g0.A,...cA}, oB={...g0.B,...cB};
    let tot=0; const N=40;
    for(let i=0;i<N;i++){ const S=cloneS(base); setBel(S,oA,oB,cA,cB); S.obj=G.tiles; finish(S); tot+=scoreS(S)[S.d]; }
    const v=tot/N+Math.random()*0.15;

}
// mondo plausibile per il seggio p: le carte non viste si distribuiscono agli altri due giocatori con mano nascosta, rispettando i semi mancanti
function sampleHands(p){
  const hands=[[],[],[],[]]; hands[p]=G.hands[p].map(c=>c.id);
  const known=new Uint8Array(64); G.hands[p].forEach(c=>{ known[c.id]=1; }); G.played.forEach(id=>{ known[id]=1; });
  const pool=ALL.map(c=>c.id).filter(id=>!known[id]);
  const others=[0,1,2,3].filter(q=>q!==p&&q!==G.dealer), sizes=[0,0,0,0];
  others.forEach(q=>{ sizes[q]=G.hands[q].length; });
  const okQ=(q,s)=>sizes[q]>0&&!G.void[q][s];
  const nElig=id=>{ let e=0; others.forEach(q=>{ if(okQ(q,id>>4)) e++; }); return e; };
  shuffle(pool); pool.sort((a,b)=>nElig(a)-nElig(b));
  const cnt=[0,0,0,0];
  for(const id of pool){
    const el=[]; others.forEach(q=>{ if(cnt[q]<sizes[q]&&okQ(q,id>>4)) for(let r=0;r<sizes[q]-cnt[q];r++) el.push(q); });
    let q;
    if(el.length) q=el[rnd(el.length)];
    else{ const any=others.filter(z=>cnt[z]<sizes[z]); if(!any.length) break; q=any[rnd(any.length)]; }
    hands[q].push(id); cnt[q]++;
  }
  return hands;
}
// carta da giocare per il seggio p (non mazziere): ritorna l'indice nella mano
function aiPlay(p){

  const tot=lg.map(()=>0), t0=performance.now(), ms=window.HH_AIMS||AIP.ms, rA=revealed('A'), rB=revealed('B');
  let nW=0;
  while(nW<AIP.minW||(performance.now()-t0<ms&&nW<AIP.maxW)){
    const base=mkS(sampleHands(p));
    const nat=cloneS(base); nat.bel=null; nat.dump=false; finish(nat);
    const oA={...tileOf(nat,base.sa),...rA}, oB={...tileOf(nat,base.sb),...rB};
    setBel(base,oA,oB,rA,rB); base.obj={A:oA,B:oB};
    lg.forEach((ci,k)=>{
      const S=cloneS(base), id=h[ci].id, mh=S.h[p];
      mh.splice(mh.indexOf(id),1); S.cp.push(p); S.ci.push(id);
      finish(S);
      tot[k]+=scoreS(S)[p];
    });

  }
  let bi=0,bv=-1e9; tot.forEach((v,k)=>{ const x=v/nW+Math.random()*0.01; if(x>bv){ bv=x; bi=k; } });
  return lg[bi];
}

        deal();
        const d=g.dealer;
        logMsg(`— Round ${k+1}/${ROUNDS}: mazziere ${P(d).name}, briscola ${SUITS[g.trump].n} · A ${P(seatOfRole('A')).name}, B ${P(seatOfRole('B')).name}, C ${P(seatOfRole('C')).name} —`);
        ckpt();
        if(!k){
          status(`Buona partita a 10/12 Heart, ${P(HUM).name}!`);
          await ask(HUM,`Mazziere: ${d===HUM?'tu':P(d).name} · briscola: ${SUITS[g.trump].n} · sei ${HUM===d?'il mazziere':'il giocatore '+RN[roleOf(HUM)]}`,[{label:'Ok, si parte',value:1}]);
        }
      }
      if(g.phase==='place') await placement();
      for(let t=g.trickNo;t<TRICKS;t++){ ckpt(); await oneTrick(); }
      await scoring();
    }
    const m=Math.max(...g.pl.map(p=>p.total));
    g.over={winners:g.pl.filter(p=>p.total===m).map(p=>p.id)};
    g.turn=-1; g.win=-1; g.show=null; render();
  }catch(e){
    if(e===ABORT||g!==G) return;
    console.error(e); G.log.unshift('Errore: '+e.message); render();
  }
}

// ═════════════════════════ RENDER ═════════════════════════
function tableauHtml(p){
  if(p===G.dealer){
    if(G.lastFlip&&G.phase==='play'){
      const [r,k]=G.lastFlip.split(':');
      return `<div class="tableau"><span class="tile up" style="min-width:56px">${tileTxt(k,G.tiles[r][k])}<span class="sub">${r} · ${CATS[KEYS.indexOf(k)].sh}</span></span></div>`;
    }
    return '<div class="tableau"><span class="cap">senza carte</span></div>';
  }
  const T=G.T, i=T.plays.findIndex(x=>x.p===p);
  if(i<0) return '<div class="tableau"><span class="slot"></span></div>';
  const x=T.plays[i], res=T.res;
  const cls=`mini ${G.fresh===p&&!res?'fresh':''} ${res&&res.winner===p?'win':''}`;
  const cap=res?(res.winner===p?'<span class="cap">vince la presa</span>':''):(T.lead>=0&&x.c.s!==T.lead?'<span class="cap">fuori seme</span>':'');
  return `<div class="tableau">${cardHtml(x.c,cls)}${cap}</div>`;
}
function flagHtml(p){
  if(G.over) return G.over.winners.includes(p)?'<span class="flag win">Vince</span>':'';
  let h='';
  if(p===G.dealer) h+='<span class="flag first">Mazziere</span>';
  else h+=`<span class="flag role">${RN[roleOf(p)]}</span>`;
  if(G.phase==='play'&&p!==G.dealer&&G.leader===p&&G.turn<0) h+='<span class="flag lead">Di mano</span>';
  else if(G.phase==='play'&&p!==G.dealer&&G.T.leader===p&&G.turn>=0) h+='<span class="flag lead">Di mano</span>';
  return h;
}
function handInfo(p){
  const h=G.hands[p];
  let s7=0,s1=0,t35=0,sum=0; h.forEach(c=>{ sum+=c.v; if(c.v===7)s7++; if(c.v===1)s1++; if(c.s===G.trump&&(c.v===3||c.v===5)) t35++; });
  return `<span class="tag">somma <b>${sum}</b></span><span class="tag">7 <b>${s7}</b></span><span class="tag">1 <b>${s1}</b></span><span class="tag">brisc. 3/5 <b>${t35}</b></span>`;
}
const nmHtml = p => `<span class="nm" style="--sc:${SEATC[p]}">${esc(P(p).name)}</span>`;
function seatHtml(p,pos){
  const pl=P(p), active=G.turn===p, hl=G.hands[p].length, d=G.dealer, over=!!G.over;
  let h;
  if(p===d) h='';
  else if(p===HUM){
    h=`<div class="hand">${G.hands[HUM].map((c,i)=>{
      if(PR&&PR.type==='card'){
        const lg=PR.legal.has(i);
        return cardHtml(c,`${lg?'legal':'dim'} ${PR.sel===i?'sel':''}`,'button',`${lg?'':'disabled'} data-p="${i}"`);
      }
      return cardHtml(c);
    }).join('')}</div>`;
  }else if(d===HUM&&(G.phase==='place'||OPT.seeHands)){
    h=`<div class="pchips">${G.hands[p].map(chipHtml).join('')}</div>`;
  }else{
    h=`<div class="backs">${Array.from({length:hl},()=>'<span class="back"></span>').join('')}</div>`;
  }
  const dv=d===HUM&&G.phase==='place'&&p!==d;
  const meta=`<div class="seat-meta">${p===d?'':`<span class="tag">prese <b>${G.st.n[p]}</b></span><span class="tag">carte <b>${hl}</b></span>`}${dv?handInfo(p):''}</div>`;
  const name=`<div class="seat-name">${nmHtml(p)}${flagHtml(p)}</div>`;
  const inner=pos==='bottom'?`${tableauHtml(p)}${name}${meta}${h}`:(pos==='top'?`${h}${name}${meta}${tableauHtml(p)}`:`${name}${meta}${tableauHtml(p)}${h}`);
  const isW=G.win===p&&!over&&G.T.res;
  const ld=G.phase==='play'&&p!==d&&(G.turn>=0?G.T.leader:G.leader)===p&&!over;
  return `<div class="seat ${pos} ${ld?'leader':''} ${active?'active':''} ${over&&G.over.winners.includes(p)?'winner':''} ${isW?'winner':''}">${inner}</div>`;
}
function centerHtml(){
  const T=G.T, res=T.res;
  const lead=T.lead>=0&&!res?`<div>Seme di mano: <b class="sfx">${ico(T.lead)}${SUITS[T.lead].n}</b></div>`:'<div>&nbsp;</div>';
  let top='';

// stato attuale (visibile) di una categoria per un seggio, mostrato sotto le tessere scoperte della propria riga
function nowTxt(k,s){
  const st=G.st;
  if(k==='tr') return `ora ${st.n[s]}`;
  if(k==='s7') return `ora ${st.s7[s]}`;
  if(k==='o') return `ora ${st.o[s]}`;
  if(k==='t') return st.f35[s]?'ottenuta':'non ancora';
  if(k==='b') return `ora ${st.sm[s]}`;
  return st.lst[s]?'vinta':'non vinta';
}
function tileCell(role,k,idx){
  const t=G.tiles&&G.tiles[role];
  if(!t) return '<div class="tile empty"></div>';
  const key=role+':'+k, v=t[k], up=!!G.rev[key]||!!G.show;
  const s=seatOfRole(role), mine=s===HUM&&G.phase!=='score';
  const pickable=PR&&PR.type==='flip'&&PR.allowed.has(key);
  const cls=[];
  let inner, tag='div', attrs='';
  if(up){
    cls.push('up'); if(typeof v==='boolean') cls.push(v?'vy':'vn');
    inner=tileTxt(k,v);
    if(G.show){ const m=(role==='A'?G.show.sc.mA:G.show.sc.mB)[idx]; cls.push(m?'ok':'ko'); inner+=`<span class="sub">→ ${tileTxt(k,G.show.act[role][k])}</span>`; }
    else if(mine) inner+=`<span class="sub">${nowTxt(k,s)}</span>`;
    if(G.lastFlip===key&&G.phase==='play') cls.push('fresh');
  }else{
    cls.push('down');
    inner=G.dealer===HUM?tileTxt(k,v):'';
  }
  if(mine) cls.push('mine');
  if(pickable){ cls.push('pick'); tag='button'; attrs=`data-tile="${key}"`; }

}

function pileHtml(){

function scoreTable(){

function ctl(role,k){

function tileForm(){

    ${CATS.map(c=>`<div class="tfr"><span class="tfl">${c.lab}<small>${c.pts} punti${c.k==='tr'?' · «7–10» vale 7, 8, 9 o 10 prese':''}</small></span>${ctl('A',c.k)}${ctl('B',c.k)}</div>`).join('')}</div>
    <div class="hint">Segna cosa pensi che otterranno A e B a fine round (carte vinte nelle prese). Ogni tessera giusta vale i punti indicati a te; A e B segnano per le proprie tessere giuste (doppi se l'altro sbaglia); C segna 30 − i tuoi punti. «Suggerimento» compila le previsioni dell'AI.</div>
    <div class="opts"><button class="opt" data-tsug="1">Suggerimento (AI)</button><button class="opt" data-trs="1">Resetta</button><button class="opt" data-tok="1">Conferma le 12 tessere</button></div>`;

<script type="text/plain" id="src-room">
// ═════════════════════════ 10/12 HEART · ONLINE ═════════════════════════
// Si gioca solo tra persone (4): niente AI e niente «Suggerimento» per le tessere. Lo stato è un unico oggetto JSON (S) e ogni azione passa da gameReduce().
// Costanti e regole pure (SUITS, CATS, scoreTiles, cardHtml, RULES_HTML…) arrivano dal blocco comune.
var GAME={id:'10-12-heart',logo:LOGO_SVG+'<span>10/12 HEART</span>',counts:[4],
  lobbyNote:'Servono 4 giocatori. Quando la stanza è piena, i posti al tavolo (e il primo mazziere) vengono assegnati a caso.'};
var POSN=['bottom','left','top','right'];
var OPT={undo:true,seeHands:false};
try{var _u=localStorage.getItem('hh-undo');if(_u!==null)OPT.undo=_u==='1';OPT.seeHands=localStorage.getItem('hh-seehands')==='1'}catch(e){}
var ui={sel:null,t:null,tk:-1};
var LOGOPEN=false;

// ─────────────── REGOLE (funzioni pure, usate dentro le transazioni) ───────────────
// ogni distribuzione nasce da un seme numerico passato nell'azione: nessuna casualità dentro il riduttore
function mkRng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function sshuffle(a,rng){for(var i=a.length-1;i>0;i--){var j=Math.floor(rng()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function newSeed(){return Math.floor(Math.random()*4294967296)}
function validSeed(x){return typeof x==='number'&&x%1===0&&x>=0&&x<4294967296}
function roleOfS(S,p){return (p-S.dealer+4)%4}
function seatOfRoleS(S,r){return (S.dealer+(r==='A'?1:r==='B'?2:3))%4}
function lg(S,t){S.log.unshift(t);if(S.log.length>160)S.log.pop()}
function newTile(){return {tr:3,s7:1,o:false,t:false,b:false,l:false}}
function validTile(t){
  return !!t&&typeof t==='object'&&Number.isInteger(t.tr)&&t.tr>=0&&t.tr<=7&&Number.isInteger(t.s7)&&t.s7>=0&&t.s7<=3&&
    ['o','t','b','l'].every(function(k){return typeof t[k]==='boolean'});
}
function cleanTile(t){return {tr:t.tr,s7:t.s7,o:t.o,t:t.t,b:t.b,l:t.l}}
function handCards(S,p){return S.hands[p].map(function(id){return CARD[id]})}
function dealRound(S,rng){
  var k=S.round,d=(S.dealer0+k)%4,q,i=0;
  S.dealer=d;S.trump=S.trumps[k];
  var deck=sshuffle(ALL.map(function(c){return c.id}),rng);
  S.hands=[[],[],[],[]];
  for(q=1;q<=3;q++){S.hands[(d+q)%4]=deck.slice(i,i+10).sort(function(a,b){return a-b});i+=10}
  S.won=[[],[],[],[]];S.st=newStats();S.tiles=null;S.rev={};S.lastFlip=null;S.show=null;
  S.phase='place';S.fl=null;S.trickNo=0;S.leader=(d+1)%4;S.fresh=-1;
  S.T={lead:-1,plays:[],res:null,leader:S.leader,k:0};
  lg(S,'— Round '+(k+1)+'/'+ROUNDS+': mazziere '+S.names[d]+', briscola '+SUITS[S.trump].n+' · A '+S.names[(d+1)%4]+', B '+S.names[(d+2)%4]+', C '+S.names[(d+3)%4]+' —');
}
function newGame(S,rng){
  S.round=0;S.dealer0=Math.floor(rng()*4);S.trumps=sshuffle([0,1,2,3],rng);
  S.total=[0,0,0,0];S.hist=[[],[],[],[]];
  dealRound(S,rng);
}
function gameInitial(players,seed){
  var names=[];
  players.forEach(function(p){var n=String(p.name||'Giocatore').slice(0,18),x=n,c=2;while(names.indexOf(x)>=0)x=n+' '+(c++);names.push(x)});
  var S={uids:players.map(function(p){return p.uid}),names:names,log:[]};
  newGame(S,mkRng(validSeed(seed)?seed:newSeed()));
  return S;
}
function allowedFlips(S){
  var out=[];
  if(!S.fl)return out;
  S.fl.roles.forEach(function(r){KEYS.forEach(function(k){var key=r+':'+k;if(!S.rev[key])out.push(key)})});
  return out;
}
function applyFlip(S,key){
  var r=key.charAt(0),k=key.slice(2),c=CATS[KEYS.indexOf(k)],fl=S.fl;
  S.rev[key]=true;S.lastFlip=key;S.fl=null;
  lg(S,S.names[S.dealer]+' scopre la tessera di '+S.names[seatOfRoleS(S,r)]+' ('+r+'): '+c.lab+' = '+tileTxt(k,S.tiles[r][k])+'.');
  if(fl.ini){
    if(fl.roles[0]==='A')S.fl={roles:['B'],ini:1};
    else S.trickNo=1;                       // le prime due tessere sono girate: si gioca la prima presa
  }else S.T.k++;
}
function resolveTrick(S){
  var T=S.T,ids=T.plays.map(function(x){return x.id}),wi=winIdx(ids,S.trump),w=T.plays[wi].p,wc=CARD[ids[wi]];
  T.res={winner:w,wi:wi};
  takeStats(S.st,w,ids,S.trump,S.trickNo);
  ids.forEach(function(id){S.won[w].push(id)});
  S.leader=w;S.fresh=-1;
  lg(S,S.names[w]+' vince la presa '+S.trickNo+' con '+cname(wc)+(wc.s===S.trump&&T.lead!==S.trump?' (briscola)':'')+'.');
  if(S.trickNo>=TRICKS)endRound(S);
}
function endRound(S){
  var d=S.dealer,sc=scoreTiles(S.tiles,S.st,d),ok=function(a){return a.filter(Boolean).length},p;
  for(p=0;p<4;p++){S.total[p]+=sc.pts[p];S.hist[p].push({pts:sc.pts[p],role:roleOfS(S,p)})}
  S.show={pts:sc.pts,mA:sc.mA,mB:sc.mB,ra:sc.ra,rb:sc.rb};
  S.phase='score';S.fl=null;S.lastFlip=null;
  lg(S,'Round '+(S.round+1)+': '+S.names[seatOfRoleS(S,'A')]+' (A) '+ok(sc.mA)+'/6 giuste, '+S.names[seatOfRoleS(S,'B')]+' (B) '+ok(sc.mB)+'/6 giuste.');
  for(p=0;p<4;p++)lg(S,S.names[p]+' ('+RN[roleOfS(S,p)]+'): +'+sc.pts[p]+' punti, totale '+S.total[p]+'.');
}
// porta avanti da sola le fasi senza scelte: ultima tessera coperta, fine presa
function settle(S){
  for(;;){
    if(S.fl){
      var al=allowedFlips(S);
      if(al.length===1){applyFlip(S,al[0]);continue}
      return;
    }
    if(S.phase!=='play')return;
    var T=S.T;
    if(T.res)return;
    if(T.k>=4){resolveTrick(S);continue}
    if((T.leader+T.k)%4===S.dealer){S.fl={roles:['A','B']};continue}
    return;
  }
}
function turnOf(S){
  if(S.phase==='place')return S.dealer;
  if(S.phase!=='play')return -1;
  if(S.fl)return S.dealer;
  return S.T.res?S.leader:(S.T.leader+S.T.k)%4;
}
function winnersOf(S){var m=Math.max.apply(null,S.total);return [0,1,2,3].filter(function(i){return S.total[i]===m})}
// ritorna il nuovo stato oppure null se l'azione non è valida
function gameReduce(S,seat,a){
  if(!a||typeof a.type!=='string'||!(seat>=0&&seat<4))return null;
  var d=S.dealer;
  if(a.type==='tiles'){
    if(S.phase!=='place'||seat!==d||!a.v||!validTile(a.v.A)||!validTile(a.v.B))return null;
    S.tiles={A:cleanTile(a.v.A),B:cleanTile(a.v.B)};
    S.phase='play';S.fl={roles:['A'],ini:1};
    lg(S,S.names[d]+' ha piazzato le 12 tessere coperte.');
    settle(S);return S;
  }
  if(a.type==='flip'){
    if(S.phase!=='play'||!S.fl||seat!==d||typeof a.key!=='string'||allowedFlips(S).indexOf(a.key)<0)return null;
    applyFlip(S,a.key);settle(S);return S;
  }
  if(a.type==='play'){
    if(S.phase!=='play'||S.fl||seat===d||turnOf(S)!==seat||!Number.isInteger(a.i))return null;
    var T=S.T;
    if(T.res){                              // la presa precedente è finita: comincia la successiva
      S.trickNo++;S.T=T={lead:-1,plays:[],res:null,leader:S.leader,k:0};
    }
    var hand=handCards(S,seat),ok=legalIdx(hand,T.lead);
    if(ok.indexOf(a.i)<0)return null;
    if(!T.plays.length)S.lastFlip=null;
    var c=hand[a.i];
    S.hands[seat].splice(a.i,1);
    T.plays.push({p:seat,id:c.id});T.k++;S.fresh=seat;
    if(T.lead<0)T.lead=c.s;
    lg(S,S.names[seat]+' '+(T.plays.length===1?'apre con':'gioca')+' '+cname(c)+(c.s===S.trump&&T.lead!==S.trump?' (briscola)':'')+'.');
    settle(S);return S;
  }
  if(a.type==='next'){
    if(S.phase!=='score'||!validSeed(a.seed))return null;
    if(S.round>=ROUNDS-1){
      S.phase='over';
      var w=winnersOf(S);
      lg(S,'Partita conclusa: '+(w.length>1?'vittoria condivisa di ':'vince ')+w.map(function(i){return S.names[i]}).join(' e ')+'.');
    }else{S.round++;dealRound(S,mkRng(a.seed))}
    return S;
  }
  if(a.type==='rematch'){
    if(S.phase!=='over'||!validSeed(a.seed))return null;
    lg(S,'— Rivincita —');
    newGame(S,mkRng(a.seed));return S;
  }
  return null;
}

// ─────────────── INTERFACCIA ───────────────
function ordSeats(){return [0,1,2,3].map(function(i){return (me+i)%4})}
function rnm(p){return '<span class="nm" style="--sc:'+SEATC[p]+'">'+esc(S.names[p])+'</span>'}
function ldr(){return S.T.res?S.leader:S.T.leader}
function myPlayable(){
  if(S.phase!=='play'||S.fl||me===S.dealer||turnOf(S)!==me)return null;
  return legalIdx(handCards(S,me),S.T.res?-1:S.T.lead);
}
function flagH(p){
  if(S.phase==='over')return winnersOf(S).indexOf(p)>=0?'<span class="flag win">Vince</span>':'';
  var h=p===S.dealer?'<span class="flag first">Mazziere</span>':'<span class="flag role">'+RN[roleOfS(S,p)]+'</span>';
  if(S.phase==='play'&&p!==S.dealer&&ldr()===p)h+='<span class="flag lead">Di mano</span>';
  return h;
}
function handInfoH(p){
  var s7=0,s1=0,t35=0,sum=0;
  handCards(S,p).forEach(function(c){sum+=c.v;if(c.v===7)s7++;if(c.v===1)s1++;if(c.s===S.trump&&(c.v===3||c.v===5))t35++});
  return '<span class="tag">somma <b>'+sum+'</b></span><span class="tag">7 <b>'+s7+'</b></span><span class="tag">1 <b>'+s1+'</b></span><span class="tag">brisc. 3/5 <b>'+t35+'</b></span>';
}
function tableauH(p){
  if(p===S.dealer){
    if(S.lastFlip&&S.phase==='play'){
      var r=S.lastFlip.charAt(0),k=S.lastFlip.slice(2);
      return '<div class="tableau"><span class="tile up" style="min-width:56px">'+tileTxt(k,S.tiles[r][k])+'<span class="sub">'+r+' · '+CATS[KEYS.indexOf(k)].sh+'</span></span></div>';
    }
    return '<div class="tableau"><span class="cap">senza carte</span></div>';
  }
  var T=S.T,x=null;T.plays.forEach(function(y){if(y.p===p)x=y});
  if(!x)return '<div class="tableau"><span class="slot"></span></div>';
  var res=T.res,c=CARD[x.id];
  var cls='mini '+(S.fresh===p&&!res?'fresh':'')+' '+(res&&res.winner===p?'win':'');
  var cap=res?(res.winner===p?'<span class="cap">vince la presa</span>':''):(T.lead>=0&&c.s!==T.lead?'<span class="cap">fuori seme</span>':'');
  return '<div class="tableau">'+cardHtml(c,cls)+cap+'</div>';
}
function seatH(p,pos){
  var d=S.dealer,hl=S.hands[p].length,over=S.phase==='over',active=turnOf(S)===p,h,lgl=myPlayable();
  if(p===d)h='';
  else if(p===me){
    h='<div class="hand">'+S.hands[me].map(function(id,i){
      var c=CARD[id];
      if(lgl){var ok=lgl.indexOf(i)>=0;return cardHtml(c,(ok?'legal':'dim')+' '+(ui.sel===i?'sel':''),'button',(ok?'':'disabled')+' data-p="'+i+'"')}
      return cardHtml(c);
    }).join('')+'</div>';
  }else if(me===d&&(S.phase==='place'||OPT.seeHands)){
    h='<div class="pchips">'+S.hands[p].map(function(id){return chipHtml(CARD[id])}).join('')+'</div>';
  }else{
    h='<div class="backs">'+Array.apply(null,Array(hl)).map(function(){return '<span class="back"></span>'}).join('')+'</div>';
  }
  var dv=me===d&&S.phase==='place'&&p!==d;
  var meta='<div class="seat-meta">'+(p===d?'':'<span class="tag">prese <b>'+S.st.n[p]+'</b></span><span class="tag">carte <b>'+hl+'</b></span>')+(dv?handInfoH(p):'')+'</div>';
  var name='<div class="seat-name">'+rnm(p)+(p===me?' <span class="cap">(tu)</span>':'')+flagH(p)+'</div>';
  var inner=pos==='bottom'?tableauH(p)+name+meta+h:(pos==='top'?h+name+meta+tableauH(p):name+meta+tableauH(p)+h);
  var isW=S.T.res&&S.T.res.winner===p&&!over&&S.phase==='play';
  var ld=S.phase==='play'&&p!==d&&ldr()===p&&!over;
  return '<div class="seat '+pos+' '+(ld?'leader':'')+' '+(active?'active':'')+' '+(over&&winnersOf(S).indexOf(p)>=0?'winner':'')+' '+(isW?'winner':'')+'">'+inner+'</div>';
}
function centerH(){
  var T=S.T,res=T.res;
  var lead=T.lead>=0&&!res?'<div>Seme di mano: <b class="sfx">'+ico(T.lead)+SUITS[T.lead].n+'</b></div>':'<div>&nbsp;</div>';
  var top='';
  if(S.phase==='over')top='<div><b>Partita conclusa</b></div>';
  else if(res&&S.phase==='play')top='<div>Vince la presa: <b>'+esc(S.names[res.winner])+'</b></div>';
  return '<div class="center">'+top+
    '<span class="trumpchip s'+S.trump+'">'+ico(S.trump)+' Briscola '+SUITS[S.trump].n+'</span>'+
    '<div>Presa <b>'+Math.min(TRICKS,S.trickNo)+'</b>/'+TRICKS+'</div>'+lead+
    '<div class="legend">'+SUITS.map(function(s,i){return '<span class="lg">'+ico(i)+' 1–'+s.max+'</span>'}).join('')+'</div></div>';
}
function nowTxt(k,s){
  var st=S.st;
  if(k==='tr')return 'ora '+st.n[s];
  if(k==='s7')return 'ora '+st.s7[s];
  if(k==='o')return 'ora '+st.o[s];
  if(k==='t')return st.f35[s]?'ottenuta':'non ancora';
  if(k==='b')return 'ora '+st.sm[s];
  return st.lst[s]?'vinta':'non vinta';
}
function tileCellH(role,k,idx){
  var t=S.tiles&&S.tiles[role];
  if(!t)return '<div class="tile empty"></div>';
  var key=role+':'+k,v=t[k],up=!!S.rev[key]||!!S.show,s=seatOfRoleS(S,role),mine=s===me&&S.phase!=='score';
  var pickable=me===S.dealer&&allowedFlips(S).indexOf(key)>=0;
  var cls=[],inner,tag='div',attrs='';
  if(up){
    cls.push('up');if(typeof v==='boolean')cls.push(v?'vy':'vn');
    inner=tileTxt(k,v);
    if(S.show){cls.push((role==='A'?S.show.mA:S.show.mB)[idx]?'ok':'ko');inner+='<span class="sub">→ '+tileTxt(k,(role==='A'?S.show.ra:S.show.rb)[k])+'</span>'}
    else if(mine)inner+='<span class="sub">'+nowTxt(k,s)+'</span>';
    if(S.lastFlip===key&&S.phase==='play')cls.push('fresh');
  }else{
    cls.push('down');
    inner=S.dealer===me?tileTxt(k,v):'';
  }
  if(mine)cls.push('mine');
  if(pickable){cls.push('pick');tag='button';attrs='data-tile="'+key+'"'}
  return '<'+tag+' class="tile '+cls.join(' ')+'" '+attrs+' title="'+esc(CATS[idx].lab)+'">'+inner+'</'+tag+'>';
}
function boardH(){
  var head='<div></div>'+CATS.map(function(c){return '<div class="bh" title="'+esc(c.lab)+'">'+c.sh+'<span class="st">'+'★'.repeat(c.pts===4?4:c.pts===3?3:2)+'</span></div>'}).join('');
  var rows=['A','B'].map(function(r){
    var s=seatOfRoleS(S,r);
    return '<div class="brow"><span>'+r+'</span>'+rnm(s)+'</div>'+KEYS.map(function(k,i){return tileCellH(r,k,i)}).join('');
  }).join('');
  var note,rr=roleOfS(S,me);
  if(!S.tiles)note='Il mazziere sta per piazzare le 12 tessere: una previsione per ognuna delle 6 categorie sulle prese di A e di B.';
  else if(S.show)note='Risultato: verde = tessera giusta, rosso = sbagliata (sotto, → il risultato reale).';
  else if(S.dealer===me)note='Le tue tessere (le vedi solo tu) sono in blu; quelle scoperte diventano bianche.';
  else note='Le tessere coperte restano segrete: se ne scopre una per presa. '+(rr===1||rr===2?'La tua riga ha il bordo giallo.':'');
  return '<div class="board"><h3>TESSERE DEL MAZZIERE</h3><div class="bgrid">'+head+rows+'</div><div class="bnote">'+note+'</div></div>';
}
function pileH(){
  if(me===S.dealer)return '';
  var w=S.won[me].slice().sort(function(a,b){return a-b}),st=S.st;
  return '<div class="scorebox"><h3>LE TUE CARTE VINTE (SOLO TU PUOI GUARDARLE)</h3>'+
    '<div class="prow"><span class="tag">prese <b>'+st.n[me]+'</b></span><span class="tag">7 <b>'+st.s7[me]+'</b></span><span class="tag">1 <b>'+st.o[me]+'</b></span><span class="tag">brisc. 3/5 <b>'+(st.f35[me]?'sì':'no')+'</b></span><span class="tag">somma <b>'+st.sm[me]+'</b></span><span class="tag">9ª/10ª <b>'+(st.lst[me]?'sì':'no')+'</b></span></div>'+
    (w.length?'<div class="pchips" style="justify-content:flex-start">'+w.map(function(id){return chipHtml(CARD[id])}).join('')+'</div>':'<span class="cap">nessuna carta vinta</span>')+'</div>';
}
function scoreTableH(){
  var nr=S.hist[0].length;
  var rows=ordSeats().map(function(p){
    return '<tr class="'+(p===me?'me':'')+'"><td>'+esc(S.names[p])+'</td>'+S.hist[p].map(function(x){return '<td>'+x.pts+' <span class="cap">'+(x.role?RN[x.role]:'M')+'</span></td>'}).join('')+'<td><b>'+S.total[p]+'</b></td></tr>';
  }).join('');
  var th='';for(var i=0;i<nr;i++)th+='<th>R'+(i+1)+'</th>';
  return '<div class="scroll-x"><table class="score"><tr><th>Punteggi</th>'+th+'<th>Totale</th></tr>'+rows+'</table></div>';
}
function roundTableH(){
  var sh=S.show,ok=function(a){return a.filter(Boolean).length};
  var rows=ordSeats().map(function(p){
    var r=roleOfS(S,p);
    var info=r===0?(ok(sh.mA)+ok(sh.mB))+'/12 tessere giuste':(r===3?'30 − '+sh.pts[S.dealer]:ok(r===1?sh.mA:sh.mB)+'/6 tessere giuste');
    return '<tr class="'+(p===me?'me':'')+'"><td>'+esc(S.names[p])+'</td><td>'+RN[r]+'</td><td>'+info+'</td><td class="'+(sh.pts[p]?'pos':'')+'"><b>+'+sh.pts[p]+'</b></td><td>'+S.total[p]+'</td></tr>';
  }).join('');
  return '<div class="scroll-x"><table class="score"><tr><th></th><th>Ruolo</th><th>Calcolo</th><th>Round</th><th>Totale</th></tr>'+rows+'</table></div>';
}
function ctlH(role,k){
  var v=ui.t[role][k];
  if(k==='tr'||k==='s7'){
    var mx=k==='tr'?7:3;
    return '<span class="ctl"><button class="stepb" data-ta="'+role+':'+k+':-1" '+(v<=0?'disabled':'')+' aria-label="meno">−</button><span class="num">'+tileTxt(k,v)+'</span><button class="stepb" data-ta="'+role+':'+k+':1" '+(v>=mx?'disabled':'')+' aria-label="più">+</button></span>';
  }
  return '<span class="ctl"><button class="tog '+(v?'yes':'no')+'" data-tt="'+role+':'+k+'">'+(v?'✓':'✗')+'</button></span>';
}
// modulo delle 12 tessere: nelle stanze non c'è alcun suggerimento (solo «Resetta» e «Conferma»)
function tileFormH(){
  var nA=esc(S.names[seatOfRoleS(S,'A')]),nB=esc(S.names[seatOfRoleS(S,'B')]);
  return '<div class="dock-title">PIAZZA LE TESSERE: COSA FARANNO A E B?</div>'+
    '<div class="tf"><div class="tfr h"><span></span><span style="text-align:center">A · '+nA+'</span><span style="text-align:center">B · '+nB+'</span></div>'+
    CATS.map(function(c){return '<div class="tfr"><span class="tfl">'+c.lab+'<small>'+c.pts+' punti'+(c.k==='tr'?' · «7–10» vale 7, 8, 9 o 10 prese':'')+'</small></span>'+ctlH('A',c.k)+ctlH('B',c.k)+'</div>'}).join('')+'</div>'+
    '<div class="hint">Segna cosa pensi che otterranno A e B a fine round (carte vinte nelle prese). Ogni tessera giusta vale i punti indicati a te; A e B segnano per le proprie tessere giuste (doppi se l\'altro sbaglia); C segna 30 − i tuoi punti.</div>'+
    '<div class="opts"><button class="opt" data-trs="1">Resetta</button><button class="opt" data-tok="1">Conferma le 12 tessere</button></div>';
}
function msgH(){
  var d=S.dealer,dn=esc(S.names[d]),tn=turnOf(S),T=S.T,tr=Math.min(TRICKS,S.trickNo);
  if(S.phase==='over'){var w=winnersOf(S).map(function(i){return esc(S.names[i])}).join(' e ');return '<b>'+(winnersOf(S).length>1?'Vittoria condivisa: ':'Vince ')+w+'!</b>'}
  if(S.phase==='score')return 'Round '+(S.round+1)+' concluso.';
  if(S.phase==='place')return me===d?'Sei il mazziere: guarda le mani dei tre giocatori e piazza le 12 tessere (le tue previsioni sulle prese di '+esc(S.names[seatOfRoleS(S,'A')])+' e '+esc(S.names[seatOfRoleS(S,'B')])+').':dn+' (mazziere) sta piazzando le 12 tessere…';
  if(S.fl){
    var ini=!!S.fl.ini,row=S.fl.roles.length===1?S.fl.roles[0]:'';
    if(me===d)return (ini?'Scopri una tessera della riga '+row+'.':'Presa '+tr+'/'+TRICKS+' · tocca a te, mazziere: scopri una tessera.');
    return ini?dn+' sceglie una tessera da scoprire (riga '+row+')…':'Presa '+tr+'/'+TRICKS+' · tocca al mazziere '+dn+': sceglie una tessera da scoprire…';
  }
  var who=esc(S.names[tn]);
  if(T.res)return who+' ha vinto la presa '+S.trickNo+': '+(tn===me?'apri tu la presa successiva.':'apre lui la presa successiva.');
  return 'Presa '+tr+'/'+TRICKS+' · '+(tn===me?'tocca a te.':'tocca a '+who+'.');
}
function dockH(){
  var h='<div class="dock-msg">'+msgH()+'</div>';
  if(S.phase==='over')return h+scoreTableH()+'<div class="opts"><button class="opt" data-rematch="1">Rivincita</button></div>';

function shuffle(a){for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t}return a}

function setStatus(t){statusText=t;render()}
function setConn(t){connText=t;var c=document.getElementById('conn');if(c)c.textContent=t}
function showErr(t){

  e.textContent=t;e.hidden=false;setConn('Errore');clearTimeout(showErr.t);showErr.t=setTimeout(function(){e.hidden=true},8000);
}
function genCode(){var b=new Uint8Array(12);crypto.getRandomValues(b);return Array.from(b,function(x){return ALPHABET[x%ALPHABET.length]}).join('')}
function withTimeout(p,ms,msg){
  return new Promise(function(res,rej){var t=setTimeout(function(){rej(new Error(msg))},ms);p.then(function(v){clearTimeout(t);res(v)},function(e){clearTimeout(t);rej(e)})});
}
function authMsg(e){
  if(e.code==='auth/operation-not-allowed')return 'Attiva il provider Anonimo in Firebase Authentication.';
  if(e.code==='auth/unauthorized-domain')return 'Dominio non autorizzato: aggiungilo in Authentication > Impostazioni > Domini autorizzati.';
  if(e.code==='auth/network-request-failed')return 'Firebase non raggiungibile: controlla la connessione e che il sito sia in HTTPS.';
  return e.message||'Errore di autenticazione Firebase.';
}
async function connect(){
  if(!window.firebase)throw new Error('Firebase non caricato. Controlla la connessione.');
  if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
  db=firebase.database();
  if(user)return;
  try{user=(await withTimeout(firebase.auth().signInAnonymously(),15000,'Autenticazione scaduta dopo 15 secondi.')).user}
  catch(e){throw new Error(authMsg(e))}
}
function saveLast(name){try{localStorage.setItem(SAVE_KEY,JSON.stringify({code:roomCode,name:name}))}catch(e){}}

// ─────────────── LOBBY ───────────────
async function createRoom(){
  try{
    setStatus('Connessione a Firebase...');await connect();
    var created=false,lastErr=null;
    for(var i=0;i<5&&!created;i++){
      roomCode=genCode();roomRef=db.ref('rooms/'+roomCode);
      try{
        await roomRef.child('hostUid').set(user.uid);
        await roomRef.child('members/'+user.uid).set(true);
        await roomRef.child('lobby').set({game:GAME.id,hostUid:user.uid,playerCount:chosenCount,started:false,closed:false,players:{}});
        created=true;
      }catch(e){lastErr=e;roomRef=null}
    }
    if(!created)throw lastErr||new Error('Impossibile creare la stanza. Verifica le regole del database.');
    await reserveSeat(playerName);
  }catch(e){roomRef=null;connecting=false;setStatus(e.message||'Errore durante la creazione della stanza.')}
}
async function joinRoom(){
  try{
    roomCode=joinVal.toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(roomCode.length!==12)throw new Error('Il codice stanza è di 12 caratteri.');
    setStatus('Connessione...');await connect();
    roomRef=db.ref('rooms/'+roomCode);
    await roomRef.child('members/'+user.uid).set(true);
    await reserveSeat(playerName);
  }catch(e){roomRef=null;connecting=false;setStatus(e.code==='PERMISSION_DENIED'?'Stanza non trovata o non accessibile.':(e.message||'Errore durante l\'accesso alla stanza.'))}
}
function reserveSeat(name){
  var lobbyRef=roomRef.child('lobby');
  return lobbyRef.once('value').then(function(snap){
    if(!snap.exists())throw new Error('Lobby non trovata: controlla il codice.');
    var initial=snap.val();
    if(initial.game!==GAME.id)throw new Error('Questo codice appartiene a un altro gioco.');
    return new Promise(function(resolve,reject){
      lobbyRef.transaction(function(cur){
        if(cur===null)cur=initial;
        if(!cur||!cur.playerCount||cur.closed)return;
        cur.players=cur.players||{};
        if(cur.players[user.uid])return cur;            // rientro: il posto è già tuo
        if(cur.started)return;
        var occ={};Object.keys(cur.players).forEach(function(u){occ[cur.players[u].seat]=true});
        var seat=1;while(seat<=cur.playerCount&&occ[seat])seat++;
        if(seat>cur.playerCount)return;
        cur.players[user.uid]={uid:user.uid,name:name,seat:seat};
        return cur;
      },function(err,committed,snap2){
        if(err){reject(err);return}
        var cur=snap2&&snap2.val();
        if(!cur||!cur.players||!cur.players[user.uid]){
          reject(new Error(cur&&cur.started?'La partita è già iniziata.':'La stanza è piena o non disponibile.'));return;
        }
        lobbyData=cur;saveLast(name);enterRoom();resolve();
      },false);
    });
  });
}
function orderedPlayers(d){
  return Object.keys(d.players||{}).map(function(u){return d.players[u]}).sort(function(a,b){return a.seat-b.seat});
}
function maybeStart(){
  if(!lobbyData||S||startingGame||lobbyData.started||lobbyData.hostUid!==user.uid)return;
  if(orderedPlayers(lobbyData).length===lobbyData.playerCount)startGame();
}
function startGame(){
  startingGame=true;
  var seated=orderedPlayers(lobbyData);   // i posti si assegnano a caso all'avvio
  shuffle(seated);
  var init=gameInitial(seated.map(function(p){return {uid:p.uid,name:p.name}}));
  init.v=0;
  roomRef.child('state').transaction(function(cur){if(cur!==null)return;return {v:0,s:JSON.stringify(init)}},function(err){
    if(err){startingGame=false;showErr('Errore durante l\'avvio: '+err.message);return}
    roomRef.child('lobby/started').set(true).catch(function(e){startingGame=false;showErr(e.message)});
  },false);
}

// ─────────────── STANZA ───────────────
function enterRoom(){
  setConn('Lobby');
  var lobbyRef=roomRef.child('lobby');
  var lh=function(snap){if(!snap.exists())return;lobbyData=snap.val();if(!S){render();maybeStart()}};
  lobbyRef.on('value',lh,function(e){showErr(e.message)});listeners.push({ref:lobbyRef,h:lh});
  var stateRef=roomRef.child('state');
  var sh=function(snap){
    if(!snap.exists())return;
    var raw=snap.val();
    try{S=JSON.parse(raw.s)}catch(e){showErr('Stato della stanza non leggibile.');return}
    me=S.uids.indexOf(user.uid);
    if(me<0){showErr('Non risulti tra i giocatori di questa partita.');return}
    setConn('Connesso');
    render();
  };
  stateRef.on('value',sh,function(e){showErr('Connessione persa: '+e.message)});listeners.push({ref:stateRef,h:sh});
  render();
}
function leave(dest){
  var go=function(){if(dest)window.location.href=dest;else window.location.reload()};
  listeners.forEach(function(l){l.ref.off('value',l.h)});
  if(!roomRef||S||!user){go();return}
  // prima dell'inizio libera il posto; a partita avviata si può rientrare con lo stesso codice
  roomRef.child('lobby').transaction(function(cur){
    if(!cur||cur.started)return;
    cur.players=cur.players||{};delete cur.players[user.uid];
    var rest=orderedPlayers(cur);
    if(cur.hostUid===user.uid&&rest.length)cur.hostUid=rest[0].uid;
    return cur;
  },function(){
    roomRef.child('members/'+user.uid).remove().catch(function(){}).then(go);
  },false);
}

// azioni: ogni azione è una transazione sullo stato, validata da gameReduce() sull'ultima versione
function act(a){
  if(!roomRef||me<0)return;
  var seat=me;
  roomRef.child('state').transaction(function(cur){
    if(!cur||!cur.s)return;
    var st;try{st=JSON.parse(cur.s)}catch(e){return}
    var r=gameReduce(st,seat,a);
    if(!r)return;
    r.v=(st.v||0)+1;
    return {v:r.v,s:JSON.stringify(r)};
  },function(err,committed){
    if(err)showErr('Errore di sincronizzazione: '+err.message);
    else if(!committed)setConn('Azione non più valida');
  },false);
}

  needName=!st.name;   // il nome arriva dalla sessione; il campo compare solo se manca
  // accesso rapido dalla home: #join=CODICE apre direttamente la stanza
  var jm=/^#join=([A-Za-z0-9]{12})$/.exec(location.hash);
  if(jm){st.mode='room';st.sub='join';st.code=jm[1].toUpperCase()}
  // #resume (dal pulsante Riprendi della lista): se c'è una partita salvata di questo gioco si rientra direttamente
  var rsm=null;
  if(location.hash==='#resume'){try{var sd=window.nyloSaveData&&nyloSaveData(P.id);if(sd){var sg=JSON.parse(sd);if(sg&&sg.n)rsm={n:sg.n}}}catch(e){}}
  function btn(attrs,cls,label,on){return '<button type="button" class="sx-opt '+cls+(on?' on':'')+'" '+attrs+'>'+label+'</button>'}
  function draw(){
    var h='<div class="topbar"><div class="logo">'+P.logo+'</div><div class="sx-nav">'+(window.nyloBackBtn?nyloBackBtn():'')+(window.nyloHomeBtn?nyloHomeBtn():'')+'</div></div>';
    h+='<div class="sx-card">';
    if(needName)h+='<label class="sx-label" for="sxName">IL TUO NOME</label><input class="sx-in" id="sxName" maxlength="16" placeholder="Il tuo nome" autocomplete="off" value="'+esc(st.name)+'">';
    if(P.counts.length>1){
      h+='<div class="sx-label">GIOCATORI</div><div class="sx-row">'+P.counts.map(function(n){return btn('data-n="'+n+'"','',n+' giocatori',st.n===n)}).join('')+'</div>';
    }
    h+='<div class="sx-label">MODALITÀ</div><div class="sx-row">'+btn('data-mode="ai"','','Contro l’AI',st.mode==='ai')+btn('data-mode="room"','','A stanze',st.mode==='room')+'</div>';
    if(st.mode==='ai'){
      h+='<div class="sx-sub"><label class="opt-toggle" style="padding-left:0" title="Di regola il mazziere vede le mani solo per piazzare le tessere; con questa opzione le vede anche durante le prese"><input type="checkbox" id="sxSee" '+(st.see?'checked':'')+'> Quando sei il mazziere, vedi le mani anche durante le prese</label><div class="sx-row">'+btn('data-go="ai"','sx-go','Inizia',false)+'</div></div>';
    }else if(st.mode==='room'){
      h+='<div class="sx-label">OPZIONI STANZA</div><div class="sx-sub"><div class="sx-row">'+btn('data-sub="create"','','Crea nuova',st.sub==='create')+btn('data-sub="join"','','Unisciti',st.sub==='join')+'</div>';
      if(st.sub==='create')h+='<div class="sx-row">'+btn('data-go="create"','sx-go','Inizia',false)+'</div>';
      if(st.sub==='join')h+='<input class="sx-in code" id="sxCode" maxlength="12" placeholder="Codice stanza" autocomplete="off" value="'+esc(st.code)+'"><div class="sx-row"><button type="button" class="sx-opt sx-go" id="sxJoin" data-go="join" '+(st.code.length===12?'':'disabled')+'>Inizia</button></div>';
      h+='</div>';
    }
    h+='</div>';
    app.innerHTML=h;
  }
  function loadRoom(){
    var libs=['app','auth','database'].map(function(n){return 'https://www.gstatic.com/firebasejs/10.12.2/firebase-'+n+'-compat.js'});
    (function next(i){
      if(i===libs.length){run('src-room');return}
      var s=document.createElement('script');s.src=libs[i];s.onload=function(){next(i+1)};
      s.onerror=function(){app.innerHTML='<p style="padding:20px;color:#fff">Firebase non raggiungibile: controlla la connessione.</p>'};
      document.head.appendChild(s);
    })(0);
  }
  function go(kind){
    var nm=document.getElementById('sxName'),name=((nm&&nm.value)||st.name||'').trim().slice(0,16);
    window.NYLO_IN_SETUP=false;
    if(name){try{localStorage.setItem('nylo-player-name',name)}catch(e){}}
    var cfg={name:name,n:st.n};
    if(kind==='ai'){cfg.mode='ai';window.NYLO_START=cfg;run('src-ai');return}
    cfg.mode='room';cfg.action=kind;if(kind==='join')cfg.code=st.code;
    window.NYLO_START=cfg;app.innerHTML='';loadRoom();
  }
  app.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b||b.disabled)return;
    var d=b.dataset;
    if(d.n){st.n=Number(d.n);draw()}
    else if(d.mode){st.mode=d.mode;st.sub='';draw()}
    else if(d.sub){st.sub=d.sub;draw();var c=document.getElementById('sxCode');if(c)c.focus()}
    else if(d.go)go(d.go);
  });
  app.addEventListener('change',function(e){
    if(e.target.id==='sxSee'){st.see=e.target.checked;try{localStorage.setItem('hh-seehands',st.see?'1':'0')}catch(x){}}
  });
  app.addEventListener('input',function(e){
    if(e.target.id==='sxName')st.name=e.target.value;
    else if(e.target.id==='sxCode'){
      st.code=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'');e.target.value=st.code;
      var j=document.getElementById('sxJoin');if(j)j.disabled=st.code.length!==12;
    }
  });
  app.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='sxCode'&&st.code.length===12)go('join')});
  if(rsm){window.NYLO_IN_SETUP=false;window.NYLO_START={mode:'ai',name:st.name,n:rsm.n,resume:true};run('src-ai');return}
  draw();
  if(jm&&!needName){try{history.replaceState(null,'',location.pathname+'#stanze')}catch(e){}go('join')}
})();
</script>
</body>
</html>
