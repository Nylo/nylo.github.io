<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#231a0e;
  --bg:#f3a929;
  --surface:#fdf0cc;
  --surface-raised:#f8de9a;
  --accent:#8a3b12;
  --accent-soft:rgba(35,26,14,0.1);
  --text:#231a0e;
  --text-soft:#5b4527;
  --danger:#b3261e;
  --success:#1f7a3d;
  --border:rgba(35,26,14,0.4);
  --radius:10px;
  --s0:#b9548f; --s1:#3f7fc4; --s2:#4f9a3f; --s3:#d27428;
  --cw:46px; --ch:66px;
}
html,body{min-height:100%;color:var(--text);font-family:'Inter',sans-serif;font-size:14px}
body{background:linear-gradient(160deg,#f8b93f 0%,#ee9f20 100%) fixed}
.app{max-width:980px;margin:0 auto;padding:0 12px 48px}

.topbar{display:flex;align-items:center;gap:10px;padding:14px 0;margin-bottom:10px;flex-wrap:wrap}
.logo{font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(22px,6.6vw,30px);line-height:1.05;flex:1;letter-spacing:0.03em;text-transform:uppercase;color:var(--ink)}
.logo small{font-family:'Libre Baskerville',serif;font-weight:700;font-size:11px;letter-spacing:0.16em;color:var(--ink);display:block;margin-bottom:2px}
.badge{background:var(--ink);color:#f8de9a;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700;white-space:nowrap}
.btn{border-radius:7px;padding:8px 14px;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;cursor:pointer;background:transparent;color:var(--text-soft);border:1px solid var(--border)}
.btn:hover{background:var(--surface-raised)}
.btn-sm{padding:5px 10px;font-size:12px}
.opt-toggle{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-soft);cursor:pointer;border:0;border-radius:20px;padding:4px 10px;user-select:none}
.opt-toggle input{accent-color:var(--accent);cursor:pointer}
.menu-wrap{position:relative;margin-left:auto}
.hamb{display:inline-flex;align-items:center;justify-content:center;width:34px;height:30px;border-radius:7px;background:transparent;color:var(--text-soft);border:1px solid var(--border);cursor:pointer}
.hamb:hover{background:var(--surface-raised);color:var(--text)}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);z-index:30;min-width:220px;display:flex;flex-direction:column;gap:4px;padding:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 10px 24px rgba(35,26,14,0.35)}
.menu-pop .opt-toggle{border:0;border-radius:6px;padding:9px 10px;font-size:13px;color:var(--text);white-space:nowrap}
.menu-pop .opt-toggle:hover{background:var(--accent-soft)}

.dock{position:sticky;top:0;z-index:10;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 4px 12px rgba(35,26,14,0.3)}
.dock-msg{font-size:13px;line-height:1.5}
.dock-title{font-size:11px;font-weight:600;color:var(--text-soft);letter-spacing:0.05em}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{background:var(--surface-raised);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px 12px;font-family:'Inter',sans-serif;font-size:12px;font-weight:500;cursor:pointer;transition:all 0.12s;text-align:left}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{opacity:0.35;cursor:not-allowed}
.hint{font-size:12px;color:var(--text-soft)}
table.score{border-collapse:collapse;font-size:12px;width:100%}
table.score td,table.score th{padding:5px 8px;border-bottom:1px solid var(--border);text-align:right}
table.score td:first-child,table.score th:first-child{text-align:left}
table.score .neg{color:var(--danger)}
table.score .pos{color:var(--success)}

.table{display:grid;grid-template-columns:1fr 1.1fr 1fr;grid-template-areas:". top ." "left center right" "bottom bottom bottom";gap:10px;background:radial-gradient(ellipse at center,#fbd26e 0%,#ec9f23 90%);border:2px solid var(--ink);box-shadow:inset 0 0 0 4px #f8b93f,inset 0 0 0 5px var(--ink);border-radius:16px;padding:12px;margin-bottom:12px;min-height:520px}
.table.n5{grid-template-columns:1fr 1fr 1fr 1fr;grid-template-areas:"tl tl tr tr" "left center center right" "bottom bottom bottom bottom"}
.seat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;border-radius:10px;border:1px solid transparent;text-align:center}
.seat.top{grid-area:top}
.seat.tl{grid-area:tl}
.seat.tr{grid-area:tr}
.seat.left{grid-area:left;justify-content:center}
.seat.right{grid-area:right;justify-content:center}
.seat.bottom{grid-area:bottom}
.seat.leader{border-color:rgba(35,26,14,0.5);background:rgba(255,255,255,0.22)}
.seat.active{border-color:var(--ink);border-width:2px;background:rgba(255,255,255,0.45)}
.seat.winner{border-color:var(--success);border-width:2px;background:rgba(31,122,61,0.18)}
.seat-name{font-weight:600;font-size:13px}
.seat-meta{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center;font-size:11px}
.tag{background:rgba(35,26,14,0.12);border-radius:4px;padding:2px 6px}
.tag b{color:var(--accent)}
.piles{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.pile{display:inline-flex;align-items:center;gap:3px;border-radius:5px;padding:2px 6px;font-size:12px;color:#fff;border:1px solid rgba(255,255,255,0.25);opacity:0.55}
.pile b{font-weight:700}
.pile i{font-size:13px}
.pile.has{opacity:1}
.pile.lead{box-shadow:0 0 0 2px var(--ink);opacity:1}
.pile.s0{background-color:var(--s0)} .pile.s1{background-color:var(--s1)} .pile.s2{background-color:var(--s2)} .pile.s3{background-color:var(--s3)}
.backs{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:230px}
.back{width:14px;height:21px;border-radius:3px;background:linear-gradient(135deg,#5b4527,#231a0e);border:1px solid #fdf0cc}
.seat.top .backs,.seat.left .backs,.seat.right .backs{max-width:130px}
.tableau{display:flex;gap:6px;align-items:center;justify-content:center;min-height:62px;padding:4px 6px;border-radius:8px;background:rgba(35,26,14,0.1);min-width:56px}
.tableau .empty{width:38px;height:54px;border:1px dashed rgba(35,26,14,0.45);border-radius:6px}

.pc{width:var(--cw);height:var(--ch);border-radius:7px;border:2px solid #fff6dc;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:'Libre Baskerville',serif;font-weight:700;font-size:22px;line-height:1;color:#fff;position:relative;flex-shrink:0;padding:0;box-shadow:0 0 0 1px var(--ink),0 2px 4px rgba(35,26,14,0.4);text-shadow:0 1px 2px rgba(0,0,0,0.35)}
.pc i{font-size:20px}
.pc.s0{background-color:var(--s0)} .pc.s1{background-color:var(--s1)} .pc.s2{background-color:var(--s2)} .pc.s3{background-color:var(--s3)}
.pc.mini{width:38px;height:54px;font-size:18px;border-width:2px}
.pc.mini i{font-size:16px}
.pc.win{box-shadow:0 0 0 1px var(--ink),0 0 0 4px var(--success)}
.pc.fresh{box-shadow:0 0 0 1px var(--ink),0 0 0 4px #fff}
button.pc{cursor:pointer;transition:transform 0.12s}
button.pc:hover:not(:disabled){transform:translateY(-6px)}
button.pc:disabled{cursor:default}
.pc.dim{opacity:0.4;filter:saturate(0.5)}
.pc.legal{box-shadow:0 0 0 1px var(--ink),0 0 0 4px #fff}
.pc.sel{transform:translateY(-12px);box-shadow:0 0 0 3px #fff,0 0 0 6px var(--ink)}
.hand{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
body.a11y .pc.s0,body.a11y .pile.s0{background-image:radial-gradient(rgba(255,255,255,0.5) 22%,transparent 24%);background-size:9px 9px}
body.a11y .pc.s1,body.a11y .pile.s1{background-image:repeating-linear-gradient(0deg,rgba(255,255,255,0.34) 0 3px,transparent 3px 8px)}
body.a11y .pc.s2,body.a11y .pile.s2{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,0.34) 0 3px,transparent 3px 8px)}
body.a11y .pc.s3,body.a11y .pile.s3{background-image:repeating-linear-gradient(90deg,rgba(255,255,255,0.34) 0 3px,transparent 3px 8px)}

.center{grid-area:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;font-size:12px;line-height:1.5;color:var(--ink)}
.center b{color:var(--ink)}
.sum{font-family:'Playfair Display',serif;font-weight:900;font-size:52px;line-height:1;color:var(--ink)}
.sum small{font-size:22px;font-weight:800;color:var(--text-soft)}
.sum.over{color:var(--success)}

details.rules{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
details.rules summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--text-soft);letter-spacing:0.05em}
details.recap{display:block;padding:14px 16px}
details.recap>summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--text-soft);letter-spacing:0.05em}
details.recap[open]>summary{margin-bottom:10px}
details.recap[open]>:not(summary)+*{margin-top:10px}
.rtext h4{font-family:'Libre Baskerville',serif;font-size:13px;color:var(--accent);margin:14px 0 4px}
.rtext p{font-size:12px;line-height:1.6;color:var(--text-soft);margin-bottom:6px}

@media(max-width:600px){
  :root{--cw:30px;--ch:44px}
  .pc{font-size:14px;border-width:1px;border-radius:5px;gap:0}
  .pc i{font-size:13px}
  .pc.mini{width:30px;height:44px;font-size:14px}
  .pc.mini i{font-size:12px}
  .tableau .empty{width:30px;height:44px}
  .table{padding:8px;gap:6px;grid-template-columns:1fr 1fr 1fr}
  .table.n5{grid-template-columns:1fr 1fr 1fr 1fr}
  .back{width:9px;height:14px}
  .hand{gap:2px}
  .pile{padding:2px 4px;font-size:11px}
  .sum{font-size:40px}
}

.flag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;vertical-align:middle;white-space:nowrap}
.flag.first{background:#ffd54a;color:#2a2000}
.flag.lead{background:#fff;color:#13222b;border:1px solid rgba(0,0,0,0.35)}
.log{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-top:12px;margin-bottom:12px;font-size:12px;color:var(--text-soft);line-height:1.6}
.log summary{cursor:pointer;font-weight:600;letter-spacing:0.05em}
.logbody{margin-top:8px;max-height:260px;overflow-y:auto;padding-right:6px}
.logbody div{border-bottom:1px solid var(--border);padding:1px 0}
.flag.first{background:#231a0e;color:#ffd54a}
.flag.lead{background:#fff6dc;color:#231a0e;border-color:#231a0e}

.recap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.recap h3{font-size:12px;font-weight:600;letter-spacing:0.05em;color:var(--text-soft)}
.recap-row{display:block;font-size:12px;line-height:1.7}
.recap-row > *{margin-right:6px}
.recap-row .lbl{font-weight:600;color:var(--text-soft)}
.recap-row .rv{color:var(--text-soft);margin-left:0 !important;margin-right:0}
.recap-row .rchip,.recap-row .sw{vertical-align:middle}
.rchip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:6px;font-size:12px;font-weight:600;color:#fff;border:1px solid rgba(255,255,255,0.35);background:#59606b;text-shadow:0 1px 1px rgba(0,0,0,0.3)}
.nchip{display:inline-flex;min-width:24px;justify-content:center;padding:2px 6px;border-radius:5px;background:rgba(127,127,127,0.25);font-weight:700;font-size:12px}
.rchip.s0{background-color:var(--s0)} .rchip.s1{background-color:var(--s1)} .rchip.s2{background-color:var(--s2)} .rchip.s3{background-color:var(--s3)}
body.a11y .rchip.s0{background-image:radial-gradient(rgba(255,255,255,0.5) 22%,transparent 24%);background-size:9px 9px}
body.a11y .rchip.s1{background-image:repeating-linear-gradient(0deg,rgba(255,255,255,0.34) 0 3px,transparent 3px 8px)}
body.a11y .rchip.s2{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,0.34) 0 3px,transparent 3px 8px)}
body.a11y .rchip.s3{background-image:repeating-linear-gradient(90deg,rgba(255,255,255,0.34) 0 3px,transparent 3px 8px)}

/* ═════════ LOOK & FEEL: cover della scatola (giallo/arancio, serif nero, doppia cornice con angoli concavi) ═════════ */
:root{

  --frame:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'60'%20height%3D'60'%20viewBox%3D'0%200%2060%2060'%20fill%3D'none'%20stroke%3D'%231b1208'%20stroke-linejoin%3D'round'%3E%3Cpath%20stroke-width%3D'2.4'%20d%3D'M12%203H48A9%209%200%200%200%2057%2012V48A9%209%200%200%200%2048%2057H12A9%209%200%200%200%203%2048V12A9%209%200%200%200%2012%203Z'%2F%3E%3Cpath%20stroke-width%3D'1.1'%20d%3D'M16.08%208H43.92A14%2014%200%200%200%2052%2016.08V43.92A14%2014%200%200%200%2043.92%2052H16.08A14%2014%200%200%200%208%2043.92V16.08A14%2014%200%200%200%2016.08%208Z'%2F%3E%3C%2Fsvg%3E");

}
body{background:radial-gradient(ellipse at 50% 0%,#f9b73a 0%,#f5a623 55%,#ee9a14 100%) fixed}
.logo{text-align:left}
.table{border:var(--fw) solid transparent;border-image:var(--frame) 24 / var(--fw) / 0 stretch;box-shadow:none;border-radius:0;padding:4px 2px 8px;background-origin:border-box}
.dock,details.rules,details.recap,.log{border-color:var(--ink);border-width:1.5px}
.dock{box-shadow:0 3px 0 rgba(27,18,8,0.55)}
.badge{background:var(--ink);color:#f5a623;letter-spacing:0.04em;text-transform:uppercase;font-family:'Libre Baskerville',serif}


.won{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;max-width:250px;padding:3px 4px;border-radius:6px;background:rgba(27,18,8,0.1)}
.seat.left .won,.seat.right .won,.seat.top .won,.seat.tl .won,.seat.tr .won{max-width:150px}
.wc{width:17px;height:24px;border-radius:3px;border:1px solid #fff6dc;box-shadow:0 0 0 1px var(--ink);display:inline-flex;align-items:center;justify-content:center;font-family:'Libre Baskerville',serif;font-weight:700;font-size:11px;line-height:1;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,0.4)}
.wc.s0{background-color:var(--s0)} .wc.s1{background-color:var(--s1)} .wc.s2{background-color:var(--s2)} .wc.s3{background-color:var(--s3)}
body.a11y .wc.s0{background-image:radial-gradient(rgba(255,255,255,0.5) 22%,transparent 24%);background-size:6px 6px}
body.a11y .wc.s1{background-image:repeating-linear-gradient(0deg,rgba(255,255,255,0.34) 0 2px,transparent 2px 6px)}
body.a11y .wc.s2{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,0.34) 0 2px,transparent 2px 6px)}
body.a11y .wc.s3{background-image:repeating-linear-gradient(90deg,rgba(255,255,255,0.34) 0 2px,transparent 2px 6px)}
@media(max-width:600px){
  :root{--fw:14px}
  .table{padding:2px 0 6px}
  .won{max-width:120px;gap:1px}
  .seat.bottom .won{max-width:260px}
  .wc{width:14px;height:20px;font-size:9px;border-radius:2px}
}

/* ═════════ STANZE ONLINE (stesse classi del kit tt/9-lives) ═════════ */
:root{--topc:#231a0e}
[hidden]{display:none!important}
.scroll-x{overflow-x:auto}
.panel{background:var(--surface);border:1.5px solid var(--ink);border-radius:var(--radius);padding:18px;margin-bottom:14px;display:flex;flex-direction:column;gap:12px;color:var(--text)}
.panel h2{font-size:16px;font-weight:700}
.muted{color:var(--text-soft);font-size:12px;line-height:1.5}
body .app>section>p.muted{color:var(--topc,var(--text-soft));margin-bottom:10px}
.status{font-size:13px;min-height:20px;line-height:1.5;color:var(--topc,var(--text))}
.panel input[type=text]{background:#fff;border:1px solid var(--border);color:#222;border-radius:6px;padding:9px 11px;font-family:'Inter',sans-serif;font-size:14px;width:100%;outline:none;letter-spacing:1px}
.panel input[type=text]:focus{border-color:var(--accent)}
.radios{display:flex;gap:18px;flex-wrap:wrap;font-size:13px}
.radios label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.roster{list-style:none;display:flex;flex-direction:column;gap:8px}
.roster li{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface-raised);border:1px solid var(--border);border-radius:8px;font-size:13px}
.roster .seat-n{width:20px;color:var(--text-soft)}
.roster .grow{flex:1}
.roster .soft{color:var(--text-soft)}
.room-code{padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-family:Consolas,monospace;letter-spacing:1px;font-size:12px;color:var(--topc,var(--text));border-color:var(--topc,var(--border))}
.conn{font-size:11px;color:var(--topc,var(--text-soft))}
.err{position:fixed;left:12px;right:12px;bottom:12px;max-width:680px;margin:0 auto;padding:12px 14px;border:1px solid rgba(217,107,107,0.6);border-radius:8px;background:#3a1d22;color:#fff;font-size:13px;line-height:1.4;z-index:200}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt.on:disabled{opacity:1}
.hint+.hint{margin-top:4px}

<script type="text/plain" id="src-ai">
// ═════════════════════════ COSTANTI ═════════════════════════
const SUITS = [
  {n:'Teiera',  book:'Alla ricerca del tempo perduto', icon:'coffee'},
  {n:'Treno',   book:'Notte sulla Via Lattea',          icon:'train'},
  {n:'Pesce',   book:'Il vecchio e il mare',            icon:'fish'},
  {n:'Mulino',  book:'Don Chisciotte',                  icon:'windmill'}
];
const RED = 3;                                         // colore rosso/arancio: tolto in 3 giocatori
const LIMIT = {3:14, 4:16, 5:17};
const ico = n => `<i class="ph-fill ph-${n}"></i>`;
const HUM = 0;
const NAMES = ['Tu','Marcel','Miguel','Kenji','Ernest'];
const POS = {3:['bottom','left','right'], 4:['bottom','left','top','right'], 5:['bottom','left','tl','tr','right']};

// ═════════════════════════ UTILITÀ ═════════════════════════
const rnd = n => Math.floor(Math.random()*n);
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const ABORT = {abort:true};
let G = null, PR = null;
const OPT = {undo:true,a11y:false};
try{ const s=localStorage.getItem('abs-undo'); if(s!==null) OPT.undo=s==='1'; OPT.a11y=localStorage.getItem('abs-a11y')==='1'; }catch(e){}
const delay = ms => new Promise(r=>setTimeout(r,ms));
async function sleep(ms){ const g=G; await delay(ms); if(g!==G) throw ABORT; }
const P = i => G.pl[i];
function logMsg(t){ G.log.unshift(t); if(G.log.length>600) G.log.pop(); render(); }
function status(t){ G.msg=t; render(); }
const cname = c => `${SUITS[c.s].n} ${c.v}`;

// ═════════════════════════ INTERAZIONE ═════════════════════════
async function ask(p,title,options,o={}){
  const ok=options.filter(x=>!x.disabled);
  if(!ok.length) return null;
  if(p!==HUM){
    if(o.pause) await sleep(o.pause);
    return ok[rnd(ok.length)].value;
  }
  const g=G;
  return new Promise((res,rej)=>{ PR={type:'choose',title,options,res,rej}; render(); }).then(v=>{ if(g!==G) throw ABORT; return v; });
}
function askCard(legal,hint){
  const g=G;
  return new Promise((res,rej)=>{ PR={type:'card',legal:new Set(legal),hint,sel:null,res,rej}; render(); }).then(v=>{ if(g!==G) throw ABORT; return v; });
}
function askMulti(hint){
  const g=G;
  return new Promise((res,rej)=>{ PR={type:'multi',hint,sel:new Set(),res,rej}; render(); }).then(v=>{ if(g!==G) throw ABORT; return v; });
}
function answer(i){
  if(!PR||PR.type!=='choose') return;
  const o=PR.options[i]; if(!o||o.disabled) return;
  const r=PR.res; PR=null; render(); r(o.value);
}
function playIdx(i){
  if(PR&&PR.type==='multi'){ if(PR.sel.has(i)) PR.sel.delete(i); else PR.sel.add(i); render(); return; }
  if(!PR||PR.type!=='card'||!PR.legal.has(i)) return;
  if(OPT.undo){ PR.sel=i; render(); return; }
  const r=PR.res; PR=null; render(); r(i);
}
function confirmCard(ok){
  if(!PR||PR.type!=='card'||PR.sel==null) return;
  if(!ok){ PR.sel=null; render(); return; }
  const i=PR.sel, r=PR.res; PR=null; render(); r(i);
}
function confirmMulti(){
  if(!PR||PR.type!=='multi') return;
  const v=[...PR.sel], r=PR.res; PR=null; render(); r(v);
}

// ═════════════════════════ REGOLE (funzioni pure) ═════════════════════════
function fullDeck(n){
  const d=[];
  for(let s=0;s<4;s++){
    if(n===3&&s===RED) continue;
    d.push({s,v:0},{s,v:0});
    for(let v=1;v<=11;v++) d.push({s,v});
  }
  return d;
}
const sortCards = (a,b)=>a.s-b.s||a.v-b.v;               // per colore, poi per numero
const sortHand = h => h.sort(sortCards);
const legalIdx = (hand,led) => {                       // obbligo di rispondere al colore
  const all=hand.map((_,i)=>i);
  if(led==null) return all;
  const same=all.filter(i=>hand[i].s===led);
  return same.length?same:all;
};
function uniqueIdx(hand,idxs){
  const seen=new Set(), out=[];
  idxs.forEach(i=>{ const k=hand[i].s*12+hand[i].v; if(!seen.has(k)){ seen.add(k); out.push(i); } });
  return out;
}
// punteggio di un giocatore: -1 per carta, +1 per carta nei colori in cui ne ha strettamente di più
function colorScore(counts,me){
  let t=0;
  for(let k=0;k<4;k++){
    const c=counts[me][k]; let mx=0;
    counts.forEach((a,q)=>{ if(q!==me&&a[k]>mx) mx=a[k]; });
    t+=c>mx?c:-c;
  }
  return t;
}
// vincitore a somma non raggiunta: carta più alta del colore di mano, a parità (solo 0) la prima giocata
function trickWinner(cards,led){
  let best=-1;
  cards.forEach((x,i)=>{ if(x.c.s===led&&(best<0||x.c.v>cards[best].c.v)) best=i; });
  return cards[best].p;
}

// ═════════════════════════ AI ═════════════════════════
// Ogni carta legale viene valutata simulando il resto della presa (mani altrui pescate a caso tra le carte non viste)
// e misurando la variazione del proprio punteggio colore.
function unseenFor(p){
  const un=fullDeck(G.n);
  const rm=c=>{ const i=un.findIndex(x=>x.s===c.s&&x.v===c.v); if(i>=0) un.splice(i,1); };
  P(p).hand.forEach(rm); G.gone.forEach(rm); G.trick.forEach(x=>rm(x.c));
  return un;
}
function evalCard(me,c,unseen,samples){
  const counts=G.pl.map(q=>q.pile.slice());
  const base=colorScore(counts,me);
  const led=G.led==null?c.s:G.led;
  const idx=G.order.indexOf(me);
  const rest=G.order.slice(idx+1);
  let tot=0;
  for(let s=0;s<samples;s++){
    const deck=shuffle(unseen.slice());
    let sum=G.sum+c.v, win=-1;
    const cards=G.trick.map(x=>({p:x.p,c:x.c})); cards.push({p:me,c});
    if(sum>=G.limit) win=me;
    else{
      let off=0;
      for(const r of rest){
        const hs=P(r).hand.length, h=deck.slice(off,off+hs); off+=hs;
        const same=h.filter(x=>x.s===led), pool=same.length?same:h;
        if(!pool.length) continue;
        const k=pool[rnd(pool.length)];
        cards.push({p:r,c:k}); sum+=k.v;
        if(sum>=G.limit){ win=r; break; }
      }
      if(win<0) win=trickWinner(cards,led);
    }
    const c2=counts.map(a=>a.slice());
    cards.forEach(x=>c2[win][x.c.s]++);
    tot+=colorScore(c2,me)-base;
  }
  return tot/samples;
}
function aiPick(p){
  const hand=P(p).hand;
  const idxs=uniqueIdx(hand,legalIdx(hand,G.led));
  if(idxs.length===1) return idxs[0];
  const un=unseenFor(p);
  let best=idxs[0], bv=-1e9;
  idxs.forEach(i=>{
    const v=evalCard(p,hand[i],un,36)-0.02*hand[i].v+Math.random()*0.05;
    if(v>bv){ bv=v; best=i; }
  });
  return best;
}
// carte rimaste: le scarto coperte solo nei colori dove ho (probabile) la maggioranza
function aiRemaining(p){
  const hand=P(p).hand, un=unseenFor(p), out=[];
  const others=G.pl.filter(q=>q.id!==p), hsum=others.reduce((a,q)=>a+q.hand.length,0);
  for(let k=0;k<4;k++){
    const mine=P(p).pile[k], mh=hand.filter(c=>c.s===k);
    if(!mh.length) continue;
    const uk=un.filter(c=>c.s===k).length;
    let pot=0, exp=0;
    others.forEach(q=>{
      pot=Math.max(pot,q.pile[k]+Math.min(q.hand.length,uk));
      exp=Math.max(exp,q.pile[k]+(hsum?uk*q.hand.length/hsum:0)*0.6);
    });
    if(mine+mh.length>pot||mine+mh.length>exp+0.5) hand.forEach((c,i)=>{ if(c.s===k) out.push(i); });
  }
  return out;
}

// ═════════════════════════ PARTITA ═════════════════════════
function toSetup(){ if(PR){ const r=PR.rej; PR=null; r(ABORT); } location.href=location.pathname+'#ai'; location.reload(); }
function newMatch(n){
  if(PR){ const r=PR.rej; PR=null; r(ABORT); }
  G={n,round:0,first0:rnd(n),first:0,msg:'',log:[],over:null,limit:LIMIT[n],gone:[],aside:0,
     pl:Array.from({length:n},(_,i)=>({id:i,name:NAMES[i],hand:[],pile:[0,0,0,0],won:[],total:0,hist:[],played:null})),
     leader:0,turn:-1,winner:-1,led:null,sum:0,trick:[],order:[],show:null,fresh:-1};
  run();
}
function deal(){
  const deck=shuffle(fullDeck(G.n)), per=Math.floor(deck.length/G.n);
  G.pl.forEach((p,i)=>{ p.hand=sortHand(deck.slice(i*per,(i+1)*per)); p.pile=[0,0,0,0]; p.won=[]; p.played=null; });
  G.aside=deck.length-per*G.n; G.gone=[]; G.trick=[]; G.sum=0; G.led=null; G.winner=-1; G.show=null;
}

async function humanPlay(p){
  const pl=P(p);
  const legal=legalIdx(pl.hand,G.led);
  const hint=G.led==null?'Sei il giocatore di mano: gioca una carta a tua scelta.'
    :(pl.hand.some(c=>c.s===G.led)?`Devi rispondere al colore di mano (${SUITS[G.led].n}).`:`Non hai il colore di mano (${SUITS[G.led].n}): gioca una carta qualsiasi.`);
  const i=await askCard(legal,hint+` Somma attuale: ${G.sum} (limite ${G.limit}).`);
  return i;
}
async function oneTrick(){
  const order=Array.from({length:G.n},(_,i)=>(G.leader+i)%G.n);
  G.order=order; G.trick=[]; G.sum=0; G.led=null; G.winner=-1; G.fresh=-1;
  G.pl.forEach(p=>p.played=null);
  let win=-1;
  for(let i=0;i<G.n;i++){
    const p=order[i]; G.turn=p;
    status(`Giocatore iniziale ${P(G.leader).name}. Tocca a ${P(p).name}. Somma: ${G.sum}/${G.limit}.`);
    let idx;
    if(p===HUM) idx=await humanPlay(p);
    else{ await sleep(700); idx=aiPick(p); }
    const c=P(p).hand.splice(idx,1)[0];
    P(p).played=c; G.trick.push({p,c}); G.sum+=c.v; G.fresh=p;
    if(i===0) G.led=c.s;
    logMsg(`${P(p).name} gioca ${cname(c)} e dice ${G.sum}.`);
    if(G.sum>=G.limit){ win=p; break; }
  }
  G.turn=-1;
  const byLimit=win>=0;
  if(!byLimit) win=trickWinner(G.trick,G.led);
  G.winner=win;
  G.trick.forEach(x=>{ P(win).pile[x.c.s]++; P(win).won.push(x.c); G.gone.push(x.c); });
  P(win).won.sort(sortCards);
  const m=byLimit?`${P(win).name} raggiunge il limite (${G.sum}≥${G.limit}) e vince ${G.trick.length} carte.`
                  :`${P(win).name} vince ${G.trick.length} carte con la carta più alta del colore di mano (somma ${G.sum}).`;
  status(m); logMsg(m);
  await sleep(2200);
  G.leader=win;
}
async function tricks(){
  G.leader=G.first;
  while(true){
    await oneTrick();
    if(G.pl.some(p=>p.hand.length===0)) break;
  }
  G.winner=-1; G.turn=-1; G.trick=[]; G.pl.forEach(p=>p.played=null); G.sum=0; G.led=null;
}
async function remaining(){
  const holders=G.pl.filter(p=>p.hand.length>0);
  if(!holders.length) return;
  status('Carte rimaste: ognuno può giocarne coperte quante vuole per aumentare le proprie maggioranze.');
  const picks={};
  for(const pl of holders){
    if(pl.id===HUM) picks[pl.id]=await askMulti('Seleziona le carte da giocare coperte (anche nessuna). Ogni carta vale −1, ma +1 se ottieni la maggioranza in quel colore.');
    else{ await sleep(500); picks[pl.id]=aiRemaining(pl.id); }
  }
  holders.forEach(pl=>{
    const idxs=picks[pl.id]||[];
    const cards=idxs.map(i=>pl.hand[i]);
    cards.forEach(c=>{ pl.pile[c.s]++; pl.won.push(c); G.gone.push(c); });
    pl.won.sort(sortCards);
    pl.hand=pl.hand.filter((_,i)=>!idxs.includes(i));
    logMsg(`${pl.name} gioca coperte ${cards.length} ${cards.length===1?'carta':'carte'}${cards.length?': '+cards.map(cname).join(', '):''}.`);
  });
  G.pl.forEach(p=>{ p.hand=[]; });
  await sleep(900);
}
function scoreRound(){
  const counts=G.pl.map(p=>p.pile);
  const rows=G.pl.map(p=>{
    const per=[]; let pt=0;
    for(let k=0;k<4;k++){
      const c=p.pile[k]; let mx=0;
      counts.forEach((a,q)=>{ if(q!==p.id&&a[k]>mx) mx=a[k]; });
      const lead=c>mx;
      per.push({c,lead}); pt+=lead?c:-c;
    }
    p.total+=pt; p.hist.push(pt);
    return {p:p.id,per,pt};
  });
  return rows;
}
async function scoring(){
  const rows=scoreRound();
  G.show={rows};
  rows.forEach(r=>logMsg(`Round ${G.round+1}: ${P(r.p).name} ${r.pt>0?'+':''}${r.pt} punti.`));
  status(`Round ${G.round+1} concluso.`);
  const last=G.round===G.n-1;
  await ask(HUM,'Punteggio del round',[{label:last?'Mostra risultato finale':'Prossimo round',value:1}]);
  G.show=null;
  if(last) return;
  // il miglior punteggio del round sceglie il nuovo giocatore iniziale (a parità: il più vicino in senso orario al vecchio)
  const best=Math.max(...rows.map(r=>r.pt));
  let chooser=-1;
  for(let i=0;i<G.n;i++){ const q=(G.first+i)%G.n; if(rows[q].pt===best){ chooser=q; break; } }
  let next=chooser;
  if(chooser===HUM){
    next=await ask(HUM,'Hai il punteggio migliore: scegli chi inizia il prossimo round',G.pl.map(p=>({label:p.id===HUM?'Io':p.name,value:p.id})));
  }
  G.first=next;
  logMsg(`${chooser===HUM?'Tu scegli':P(chooser).name+' sceglie'} ${next===chooser?'sé stesso':P(next).name} come primo giocatore.`);
}

async function run(){
  const g=G;
  try{
    g.first=g.first0;
    for(let k=0;k<g.n;k++){
      g.round=k;
      deal();
      logMsg(`— Round ${k+1}/${g.n}: primo giocatore ${P(g.first).name}${g.aside?` (${g.aside} carte messe da parte)`:''} —`);
      if(k===0){
        status(`Buona partita a American Bookshop, ${P(HUM).name}!`);
        await ask(HUM,g.first===HUM?'Sei tu il primo giocatore':'Primo giocatore: '+P(g.first).name,[{label:'Ok, si parte',value:1}]);
      }
      await tricks();
      await remaining();
      await scoring();
    }
    const m=Math.max(...g.pl.map(p=>p.total));
    g.over={winners:g.pl.filter(p=>p.total===m).map(p=>p.id)};
    render();
  }catch(e){
    if(e===ABORT||g!==G) return;
    console.error(e); G.log.unshift('Errore: '+e.message); render();
  }
}

// ═════════════════════════ RENDER ═════════════════════════
const cardInner = c => `<span>${c.v}</span>${ico(SUITS[c.s].icon)}`;
const cardFace=(c,cls='')=>`<span class="pc s${c.s} ${cls}" title="${cname(c)}">${cardInner(c)}</span>`;
function handBtn(c,i,ok,sel){
  return `<button class="pc s${c.s} ${ok?'legal':'dim'} ${sel?'sel':''}" ${ok?'':'disabled'} data-p="${i}" title="${cname(c)}">${cardInner(c)}</button>`;
}
function pilesHtml(p){
  return `<div class="piles">${[0,1,2,3].filter(k=>G.n!==3||k!==RED).map(k=>{
    const c=P(p).pile[k]; let mx=0;
    G.pl.forEach(q=>{ if(q.id!==p&&q.pile[k]>mx) mx=q.pile[k]; });
    return `<span class="pile s${k} ${c>0?'has':''} ${c>0&&c>mx?'lead':''}" title="${SUITS[k].n}: ${c} carte">${ico(SUITS[k].icon)}<b>${c}</b></span>`;
  }).join('')}</div>`;
}
function wonHtml(p){
  const w=P(p).won;
  if(!w.length) return '';
  return `<div class="won" title="Carte vinte, per colore e numero">${w.map(c=>`<span class="wc s${c.s}" title="${cname(c)}">${c.v}</span>`).join('')}</div>`;
}
function tableauHtml(p){
  const pl=P(p), win=G.winner===p;
  return `<div class="tableau">${pl.played?cardFace(pl.played,`mini ${G.fresh===p?'fresh':''} ${win?'win':''}`):'<span class="empty"></span>'}</div>`;
}
function seatHtml(p,pos){
  const pl=P(p);
  const isLeader=G.turn>=0&&G.leader===p, active=G.turn===p, winner=G.winner===p;
  let hand;
  if(p===HUM){
    hand=`<div class="hand">${pl.hand.map((c,i)=>{
      if(PR&&PR.type==='card') return handBtn(c,i,PR.legal.has(i),PR.sel===i);
      if(PR&&PR.type==='multi') return handBtn(c,i,true,PR.sel.has(i));
      return cardFace(c);
    }).join('')}</div>`;
  }else hand=`<div class="backs">${pl.hand.map(()=>'<span class="back"></span>').join('')}</div>`;
  const meta=`<div class="seat-meta"><span class="tag">carte <b>${pl.hand.length}</b></span><span class="tag">punti <b>${pl.total}</b></span></div>`;
  const name=`<div class="seat-name">${esc(pl.name)}${flagHtml(p)}</div>`;
  const inner=pos==='bottom'?`${tableauHtml(p)}${name}${meta}${pilesHtml(p)}${wonHtml(p)}${hand}`
    :(pos==='top'||pos==='tl'||pos==='tr'?`${hand}${name}${meta}${pilesHtml(p)}${wonHtml(p)}${tableauHtml(p)}`:`${name}${meta}${pilesHtml(p)}${wonHtml(p)}${tableauHtml(p)}${hand}`);
  return `<div class="seat ${pos} ${isLeader?'leader':''} ${active?'active':''} ${winner?'winner':''}">${inner}</div>`;
}
function centerHtml(){
  const over=G.sum>=G.limit;
  const ledTxt=G.led!=null?`<div>Colore di mano: <b>${SUITS[G.led].n}</b> ${ico(SUITS[G.led].icon)}</div>`:'';
  const first=G.turn>=0||G.winner>=0;
  return `<div class="center">
    <div class="sum ${over?'over':''}">${first?G.sum:0}<small> / ${G.limit}</small></div>
    <div>somma della presa (limite ${G.limit})</div>${ledTxt}
    <div>Round <b>${Math.min(G.round+1,G.n)}/${G.n}</b></div></div>`;
}
function scoreTable(){
  const rows=G.pl.map(p=>`<tr><td>${esc(p.name)}</td>${Array.from({length:G.n},(_,i)=>i<p.hist.length?`<td class="${p.hist[i]<0?'neg':'pos'}">${p.hist[i]}</td>`:'<td>–</td>').join('')}<td><b>${p.total}</b></td></tr>`).join('');
  return `<table class="score"><tr><th></th>${Array.from({length:G.n},(_,i)=>`<th>R${i+1}</th>`).join('')}<th>Totale</th></tr>${rows}</table>`;
}
function dockHtml(){
  if(!G) return '';
  if(G.over){
    const w=G.over.winners.map(i=>esc(P(i).name)).join(' e ');
    return `<div class="dock-msg"><b>${G.over.winners.length>1?'Vittoria condivisa: ':'Vince '}${w}!</b> (vince chi ha più punti)</div>${scoreTable()}`;
  }
  let html=`<div class="dock-msg">${esc(G.msg)}</div>`;
  if(G.show){
    const cols=[0,1,2,3].filter(k=>G.n!==3||k!==RED);
    html+=`<table class="score"><tr><th></th>${cols.map(k=>`<th>${SUITS[k].n}</th>`).join('')}<th>Punti round</th></tr>${G.show.rows.map(r=>`<tr><td>${esc(P(r.p).name)}</td>${cols.map(k=>`<td class="${r.per[k].lead?'pos':''}">${r.per[k].c?(r.per[k].lead?'+':'−')+r.per[k].c:'0'}</td>`).join('')}<td class="${r.pt<0?'neg':'pos'}"><b>${r.pt>0?'+':''}${r.pt}</b></td></tr>`).join('')}</table>`;
  }
  if(PR&&PR.type==='choose'){
    html+=`<div class="dock-title">${esc(PR.title).toUpperCase()}</div><div class="opts">${PR.options.map((o,i)=>`<button class="opt" ${o.disabled?'disabled':''} data-i="${i}">${esc(o.label)}</button>`).join('')}</div>`;
  }else if(PR&&PR.type==='card'){
    html+=`<div class="hint">Tocca a te: ${esc(PR.hint)}</div>`;
    if(PR.sel!=null){ const c=P(HUM).hand[PR.sel]; html+=`<div class="opts"><button class="opt" data-cf="1">Conferma: gioca ${cname(c)}</button><button class="opt" data-cf="0">Annulla</button></div>`; }
  }else if(PR&&PR.type==='multi'){
    html+=`<div class="hint">${esc(PR.hint)}</div><div class="opts"><button class="opt" data-mc="1">${PR.sel.size?`Conferma: gioca ${PR.sel.size} ${PR.sel.size===1?'carta':'carte'} coperte`:'Nessuna carta (conferma)'}</button></div>`;
  }
  return html;
}


function recapHtml(){
  const ks=[0,1,2,3].filter(k=>G.n!==3||k!==RED), per=Math.floor(fullDeck(G.n).length/G.n);
  return `<details class="recap"><summary>RIEPILOGO</summary>
    <div class="recap-row"><span class="lbl">Colori</span>${ks.map(k=>`<span class="rchip s${k}">${ico(SUITS[k].icon)} ${SUITS[k].n}</span>`).join('')}<span class="rv">${G.n===3?'Mulino (rosso) tolto · ':''}13 carte per colore</span></div>
    <div class="recap-row"><span class="lbl">Valori</span><span class="nchip">0</span><span class="nchip">0</span>${Array.from({length:11-1+1},(_,i)=>`<span class="nchip">${i+1}</span>`).join('')}<span class="rv">due 0, poi 1–11</span></div>
    <div class="recap-row"><span class="lbl">Briscola</span><span class="rv" style="margin-left:0">nessuna: vince la carta più alta del colore di mano</span></div>
    <div class="recap-row"><span class="lbl">Limite</span><span class="nchip">${G.limit}</span><span class="rv">${per} carte a testa${G.aside?` · ${G.aside} da parte`:''}</span></div></details>`;
}

const RULES_HTML = `
<details class="rules"><summary>REGOLAMENTO</summary>
<div class="rtext">
<h4>Componenti</h4>
<p>52 carte: 4 colori con 13 carte ciascuno (due carte di valore 0 e una per ciascun valore da 1 a 11). Nell'app i colori sono le quattro storie della carta di riferimento: Teiera (rosa), Treno (azzurro), Pesce (verde) e Mulino (arancio/rosso).</p>
<h4>Preparazione</h4>
<p>In 3 giocatori si tolgono le carte rosse (il Mulino) e si mettono da parte. In 4 o 5 giocatori si usano tutte le carte. Si mescolano e si distribuiscono coperte in parti uguali; se non bastano per un'ultima distribuzione, le carte rimanenti si mettono da parte e non si usano in questo round (in 5 giocatori: 10 carte a testa e 2 da parte).</p>
<h4>1. Acquisire carte (presa)</h4>
<p>Il primo giocatore gioca una carta a sua scelta. Gli altri, a turno in senso orario, giocano una carta: se hanno carte del colore del primo giocatore DEVONO giocarne una (seguire il colore), altrimenti possono giocare qualsiasi carta.</p>
<p>Ogni volta che si gioca una carta, si dichiara la somma di tutte le carte giocate nella presa. Se la somma uguaglia o supera il limite (14 in 3 giocatori, 16 in 4, 17 in 5), chi ha giocato quella carta vince la propria carta e tutte le altre carte della presa; chi doveva ancora giocare non gioca.</p>
<p>Se tutti giocano senza raggiungere il limite, vince tutte le carte della presa chi ha la carta di valore più alto del colore del primo giocatore. In caso di parità (possibile solo con gli 0) vince chi l'ha giocata per prima.</p>
<h4>2. Presa successiva</h4>
<p>Le carte vinte si dispongono in file separate, una per colore, in modo che il loro numero sia visibile (nell'app le vedi accanto a ogni giocatore, ordinate per colore e poi per numero). Chi ha vinto diventa il primo giocatore e inizia una nuova presa. Si continua finché un giocatore gioca l'ultima carta dalla sua mano: la presa in corso si conclude normalmente.</p>
<h4>3. Carte rimanenti</h4>
<p>Quando un giocatore ha esaurito la mano, gli altri possono scegliere quante carte vogliono dalla propria mano (anche nessuna) e giocarle coperte. Quando tutti hanno deciso, le rivelano insieme e le sommano alle proprie carte vinte.</p>
<h4>4. Punteggio</h4>
<p>Ogni carta raccolta vale −1 punto. Per ciascun colore, però, chi ne ha raccolte di più (strettamente) guadagna +1 per ogni carta di quel colore. Se più giocatori sono in parità per un colore, quelle carte restano a −1.</p>
<h4>5. Fine del round e della partita</h4>
<p>Se all'inizio erano state messe da parte delle carte, si rimescolano con le altre per formare il mazzo del round successivo. Il giocatore con più punti nel round sceglie il nuovo primo giocatore (anche sé stesso); a parità sceglie, tra i pari, quello più vicino in senso orario al vecchio primo giocatore. Si giocano tanti round quanti sono i giocatori (4 round in 4 giocatori). Vince chi ha il totale di punti più alto.</p>
<p><i>Interpretazioni nell'app:</i> il primo giocatore del primo round è casuale. Quando a scegliere il nuovo primo giocatore è un'AI, sceglie sé stessa. Le AI giocano coperte solo le carte dei colori in cui ritengono di poter ottenere la maggioranza.</p>
</div></details>`;

<script type="text/plain" id="src-room">
const RULES_HTML = `

<p>Se tutti giocano senza raggiungere il limite, vince tutte le carte della presa chi ha la carta di valore più alto del colore del primo giocatore. In caso di parità (possibile solo con gli 0) vince chi l'ha giocata per prima.</p>
<h4>2. Presa successiva</h4>

<h4>3. Carte rimanenti</h4>
<p>Quando un giocatore ha esaurito la mano, gli altri possono scegliere quante carte vogliono dalla propria mano (anche nessuna) e giocarle coperte. Quando tutti hanno deciso, le rivelano insieme e le sommano alle proprie carte vinte.</p>
<h4>4. Punteggio</h4>
<p>Ogni carta raccolta vale −1 punto. Per ciascun colore, però, chi ne ha raccolte di più (strettamente) guadagna +1 per ogni carta di quel colore. Se più giocatori sono in parità per un colore, quelle carte restano a −1.</p>
<h4>5. Fine del round e della partita</h4>
<p>Se all'inizio erano state messe da parte delle carte, si rimescolano con le altre per formare il mazzo del round successivo. Il giocatore con più punti nel round sceglie il nuovo primo giocatore (anche sé stesso); a parità sceglie, tra i pari, quello più vicino in senso orario al vecchio primo giocatore. Si giocano tanti round quanti sono i giocatori (4 round in 4 giocatori). Vince chi ha il totale di punti più alto.</p>
<p><i>Interpretazioni nell'app:</i> il primo giocatore del primo round è casuale. Nelle stanze online si gioca solo tra persone (3–5): le carte rimaste da giocare coperte restano segrete finché tutti hanno scelto, poi vengono rivelate insieme; il giocatore con il punteggio migliore del round sceglie il nuovo primo giocatore dal pannello in alto, e chiunque può passare al round successivo.</p>
</div></details>`;
// ═════════════════════════ AMERICAN BOOKSHOP · ONLINE ═════════════════════════
var GAME={id:'american-bookshop',logo:'American Bookshop · Online',counts:[3,4,5],
  lobbyNote:'Servono da 3 a 5 giocatori (scegli quanti qui sotto). Quando la stanza è piena, i posti al tavolo vengono assegnati a caso.'};
var SUITS=[
  {n:'Teiera',book:'Alla ricerca del tempo perduto',icon:'coffee'},
  {n:'Treno',book:'Notte sulla Via Lattea',icon:'train'},
  {n:'Pesce',book:'Il vecchio e il mare',icon:'fish'},
  {n:'Mulino',book:'Don Chisciotte',icon:'windmill'}
];
var RED=3;                                   // colore rosso/arancio: tolto in 3 giocatori
var LIMIT={3:14,4:16,5:17};
var POS={3:['bottom','left','right'],4:['bottom','left','top','right'],5:['bottom','left','tl','tr','right']};
var ico=function(n){return '<i class="ph-fill ph-'+n+'"></i>'};
var OPT={undo:true,a11y:false};
try{var _s=localStorage.getItem('abs-undo');if(_s!==null)OPT.undo=_s==='1';OPT.a11y=localStorage.getItem('abs-a11y')==='1'}catch(e){}
var ui={sel:null,multi:[]};
var key=function(c){return c.s*12+c.v};
var cname=function(c){return SUITS[c.s].n+' '+c.v};
var plu=function(n,s,p){return n+' '+(n===1?s:p)};

// ─────────────── REGOLE (funzioni pure, usate dentro le transazioni) ───────────────
// una carta è un id 0..51: colore = id/13, j = id%13 (j 0 e 1 = i due zeri, poi valori 1..11)
function fullIds(n){var a=[];for(var s=0;s<4;s++){if(n===3&&s===RED)continue;for(var j=0;j<13;j++)a.push(s*13+j)}return a}
function newDeck(n){return shuffle(fullIds(n))}
function validDeck(d,n){
  var want=fullIds(n),cnt={};
  if(!Array.isArray(d)||d.length!==want.length)return false;
  want.forEach(function(x){cnt[x]=1});
  for(var i=0;i<d.length;i++){var x=d[i];if(cnt[x]!==1)return false;cnt[x]=0}
  return true;
}
function mkCard(id){var j=id%13;return {s:Math.floor(id/13),v:j<2?0:j-1}}
var sortCards=function(a,b){return a.s-b.s||a.v-b.v};
var sortHand=function(h){return h.sort(sortCards)};
function canPlay(hand,led,c){return led<0||c.s===led||!hand.some(function(x){return x.s===led})}
// vincitore a somma non raggiunta: carta più alta del colore di mano, a parità (solo 0) la prima giocata
function trickWinner(cards,led){
  var best=-1;
  cards.forEach(function(x,i){if(x.c.s===led&&(best<0||x.c.v>cards[best].c.v))best=i});
  return cards[best].p;
}
function dealInto(S,deck,pre){
  var n=S.n,per=Math.floor(deck.length/n);
  S.hands=[];S.pile=[];S.won=[];
  for(var i=0;i<n;i++){S.hands.push(sortHand(deck.slice(i*per,(i+1)*per).map(mkCard)));S.pile.push([0,0,0,0]);S.won.push([])}
  S.aside=deck.length-per*n;S.trick=[];S.sum=0;S.led=-1;S.leader=S.first;S.turn=S.first;S.last=null;S.done=0;S.picks=null;S.show=null;S.chooser=-1;S.phase='play';
  S.msg=(pre?pre+' ':'')+'Round '+(S.round+1)+'/'+n+': primo giocatore '+S.names[S.first]+(S.aside?' ('+S.aside+' carte messe da parte)':'')+'.';
}
function gameInitial(players){
  var n=players.length;
  var S={v:0,game:GAME.id,n:n,names:players.map(function(p){return p.name}),uids:players.map(function(p){return p.uid}),
    round:0,first:rnd(n),limit:LIMIT[n],total:[],hist:[],over:null};
  for(var i=0;i<n;i++){S.total.push(0);S.hist.push([])}
  dealInto(S,newDeck(n));
  return S;
}
// punteggio del round: −1 per carta, +1 per carta nei colori in cui si ha strettamente di più di ogni altro giocatore
function scoreRound(S,cov){
  var n=S.n,rows=[],i,k;
  for(i=0;i<n;i++){
    var per=[],pt=0;
    for(k=0;k<4;k++){
      var c=S.pile[i][k],mx=0;
      for(var q=0;q<n;q++)if(q!==i&&S.pile[q][k]>mx)mx=S.pile[q][k];
      var lead=c>mx;per.push({c:c,lead:lead});pt+=lead?c:-c;
    }
    S.total[i]+=pt;S.hist[i].push(pt);
    rows.push({p:i,per:per,pt:pt});
  }
  var best=Math.max.apply(null,rows.map(function(r){return r.pt})),ch=-1;
  for(i=0;i<n;i++){var q2=(S.first+i)%n;if(rows[q2].pt===best){ch=q2;break}}
  S.show={rows:rows,cov:cov||[]};S.chooser=ch;S.phase='scoreRound';S.trick=[];S.last=null;S.picks=null;
  S.msg='Round '+(S.round+1)+' concluso.';
}
function endPlay(S){
  S.picks=S.hands.map(function(h){return h.length?null:[]});
  if(S.picks.every(function(x){return x!==null})){scoreRound(S,[]);return}
  S.phase='remaining';S.turn=-1;
  S.msg='Carte rimaste: ognuno può giocarne coperte quante vuole per aumentare le proprie maggioranze. Si rivelano quando tutti hanno scelto.';
}
function resolveTrick(S,byLimitSeat){
  var win=byLimitSeat>=0?byLimitSeat:trickWinner(S.trick,S.led),cards=S.trick.slice();
  cards.forEach(function(x){S.pile[win][x.c.s]++;S.won[win].push(x.c)});
  S.won[win].sort(sortCards);
  S.last={cards:cards,winner:win,sum:S.sum,led:S.led,byLimit:byLimitSeat>=0};
  S.msg=byLimitSeat>=0?S.names[win]+' raggiunge il limite ('+S.sum+'≥'+S.limit+') e vince '+cards.length+' carte.'
    :S.names[win]+' vince '+cards.length+' carte con la carta più alta del colore di mano (somma '+S.sum+').';
  S.trick=[];S.sum=0;S.led=-1;S.leader=win;S.turn=win;S.done++;
  if(S.hands.some(function(h){return !h.length}))endPlay(S);
}
function revealCovered(S){
  var cov=[];
  for(var p=0;p<S.n;p++){
    var cards=[];
    S.picks[p].forEach(function(k){
      var ix=-1;for(var i=0;i<S.hands[p].length;i++)if(key(S.hands[p][i])===k){ix=i;break}
      cards.push(S.hands[p].splice(ix,1)[0]);
    });
    cards.forEach(function(c){S.pile[p][c.s]++;S.won[p].push(c)});
    S.won[p].sort(sortCards);
    cov.push(sortHand(cards));
  }
  for(var q=0;q<S.n;q++)S.hands[q]=[];
  scoreRound(S,cov);
}

function gameReduce(S,seat,a){
  if(!S||seat<0||seat>=S.n||!a)return null;
  var n=S.n,i;
  switch(a.type){
  case 'play':{
    if(S.phase!=='play'||S.turn!==seat)return null;
    var hand=S.hands[seat],ix=-1;
    for(i=0;i<hand.length;i++)if(key(hand[i])===a.k){ix=i;break}
    if(ix<0)return null;
    var card=hand[ix];
    if(!canPlay(hand,S.led,card))return null;
    hand.splice(ix,1);
    if(!S.trick.length){S.led=card.s;S.last=null}
    S.trick.push({p:seat,c:card});S.sum+=card.v;
    var byLimit=S.sum>=S.limit;
    if(byLimit||S.trick.length>=n)resolveTrick(S,byLimit?seat:-1);
    else{S.turn=(seat+1)%n;S.msg=S.names[seat]+' gioca '+cname(card)+' e dice '+S.sum+'. Tocca a '+S.names[S.turn]+'.'}
    break;}
  case 'cover':{
    if(S.phase!=='remaining'||!S.picks||S.picks[seat]!==null||!Array.isArray(a.ks))return null;
    var pool=S.hands[seat].slice(),sel=[];
    for(i=0;i<a.ks.length;i++){
      var j=-1;for(var m=0;m<pool.length;m++)if(key(pool[m])===a.ks[i]){j=m;break}
      if(j<0)return null;
      sel.push(key(pool.splice(j,1)[0]));
    }
    S.picks[seat]=sel;
    if(S.picks.every(function(x){return x!==null}))revealCovered(S);
    break;}
  case 'next':{
    if(S.phase!=='scoreRound')return null;
    if(S.round>=n-1){
      var mx=Math.max.apply(null,S.total);
      S.over={winners:S.total.map(function(s,q){return s===mx?q:-1}).filter(function(q){return q>=0})};
      S.phase='gameEnd';S.show=null;S.msg='Partita conclusa.';break;
    }
    S.phase='choose';
    S.msg=S.names[S.chooser]+' ha il punteggio migliore del round: sceglie chi inizia il prossimo round.';
    break;}
  case 'choose':{
    if(S.phase!=='choose'||S.chooser!==seat||!validDeck(a.deck,n))return null;
    if(typeof a.who!=='number'||a.who%1!==0||a.who<0||a.who>=n)return null;
    var who=a.who;
    S.round++;S.first=who;
    dealInto(S,a.deck,(seat===who?S.names[seat]+' sceglie sé stesso':S.names[seat]+' sceglie '+S.names[who])+' come primo giocatore.');
    break;}
  case 'rematch':{
    if(S.phase!=='gameEnd'||!validDeck(a.deck,n))return null;
    S.round=0;S.first=rnd(n);S.over=null;
    for(i=0;i<n;i++){S.total[i]=0;S.hist[i]=[]}
    dealInto(S,a.deck);break;}
  default:return null;
  }
  return S;
}

// ─────────────── RENDER ───────────────
function gameBadge(){return S.phase==='gameEnd'?'Partita conclusa':'Round '+(S.round+1)+'/'+S.n}
var cardInner=function(c){return '<span>'+c.v+'</span>'+ico(SUITS[c.s].icon)};
var cardFace=function(c,cls){return '<span class="pc s'+c.s+' '+(cls||'')+'" title="'+cname(c)+'">'+cardInner(c)+'</span>'};
function handBtn(c,i,ok,sel){
  return '<button class="pc s'+c.s+' '+(ok?'legal':'dim')+' '+(sel?'sel':'')+'" '+(ok?'':'disabled')+' data-p="'+i+'" title="'+cname(c)+'">'+cardInner(c)+'</button>';
}
function canPick(){return S.phase==='remaining'&&S.picks&&S.picks[me]===null}
function myTurn(){return S.phase==='play'&&S.turn===me}
function pilesHtml(p){
  var ks=[0,1,2,3].filter(function(k){return S.n!==3||k!==RED});
  return '<div class="piles">'+ks.map(function(k){
    var c=S.pile[p][k],mx=0;
    S.pile.forEach(function(a,q){if(q!==p&&a[k]>mx)mx=a[k]});
    return '<span class="pile s'+k+' '+(c>0?'has':'')+' '+(c>0&&c>mx?'lead':'')+'" title="'+SUITS[k].n+': '+c+' carte">'+ico(SUITS[k].icon)+'<b>'+c+'</b></span>';
  }).join('')+'</div>';
}
function wonHtml(p){
  var w=S.won[p];if(!w.length)return '';
  return '<div class="won" title="Carte vinte, per colore e numero">'+w.map(function(c){return '<span class="wc s'+c.s+'" title="'+cname(c)+'">'+c.v+'</span>'}).join('')+'</div>';
}
function tableauHtml(p){
  var cur=S.trick.filter(function(x){return x.p===p})[0],card=cur?cur.c:null,win=false,fresh=false;
  if(cur)fresh=S.trick[S.trick.length-1].p===p;
  else if(S.last){var lc=S.last.cards.filter(function(x){return x.p===p})[0];if(lc){card=lc.c;win=S.last.winner===p}}
  return '<div class="tableau">'+(card?cardFace(card,'mini '+(fresh?'fresh':'')+' '+(win?'win':'')):'<span class="empty"></span>')+'</div>';
}
function flagHtml(p){
  if(S.phase!=='play')return '';
  if(S.done===0&&!S.trick.length&&S.first===p)return '<span class="flag first">Primo giocatore</span>';
  if(S.leader===p)return '<span class="flag lead">Di mano</span>';
  return '';
}
function seatHtml(p,pos){
  var isLeader=S.phase==='play'&&S.leader===p,active=S.phase==='play'?S.turn===p:(S.phase==='remaining'&&S.picks[p]===null),
      winner=S.phase==='play'&&!S.trick.length&&S.last&&S.last.winner===p;
  var hand;
  if(p===me){
    var mine=S.hands[me];
    if(myTurn()){var ok={};mine.forEach(function(c){ok[key(c)]=canPlay(mine,S.led,c)});
      hand='<div class="hand">'+mine.map(function(c,i){return handBtn(c,i,ok[key(c)],ui.sel===i)}).join('')+'</div>'}
    else if(canPick())hand='<div class="hand">'+mine.map(function(c,i){return handBtn(c,i,true,ui.multi.indexOf(i)>=0)}).join('')+'</div>';
    else hand='<div class="hand">'+mine.map(function(c){return cardFace(c)}).join('')+'</div>';
  }else hand='<div class="backs">'+S.hands[p].map(function(){return '<span class="back"></span>'}).join('')+'</div>';
  var wait=S.phase==='remaining'&&S.hands[p].length?'<span class="tag">'+(S.picks[p]===null?'sta scegliendo…':'<b>ha scelto</b>')+'</span>':'';
  var meta='<div class="seat-meta"><span class="tag">carte <b>'+S.hands[p].length+'</b></span><span class="tag">punti <b>'+S.total[p]+'</b></span>'+wait+'</div>';
  var name='<div class="seat-name">'+esc(S.names[p])+(p===me?' (tu)':'')+flagHtml(p)+'</div>';
  var inner=pos==='bottom'?tableauHtml(p)+name+meta+pilesHtml(p)+wonHtml(p)+hand
    :(pos==='top'||pos==='tl'||pos==='tr'?hand+name+meta+pilesHtml(p)+wonHtml(p)+tableauHtml(p):name+meta+pilesHtml(p)+wonHtml(p)+tableauHtml(p)+hand);
  return '<div class="seat '+pos+' '+(isLeader?'leader':'')+' '+(active?'active':'')+' '+(winner?'winner':'')+'">'+inner+'</div>';
}
function centerHtml(){
  var inTr=S.trick.length>0,showLast=!inTr&&S.phase==='play'&&S.last;
  var sum=inTr?S.sum:(showLast?S.last.sum:0),over=sum>=S.limit&&(inTr||showLast);
  var led=inTr?S.led:-1;
  var ledTxt=led>=0?'<div>Colore di mano: <b>'+SUITS[led].n+'</b> '+ico(SUITS[led].icon)+'</div>':'';
  return '<div class="center"><div class="sum '+(over?'over':'')+'">'+sum+'<small> / '+S.limit+'</small></div>'+
    '<div>somma della presa (limite '+S.limit+')</div>'+ledTxt+'<div>Round <b>'+Math.min(S.round+1,S.n)+'/'+S.n+'</b></div></div>';
}
function scoreTable(){
  var rows=S.names.map(function(nm,p){
    var cells='';for(var i=0;i<S.n;i++)cells+=i<S.hist[p].length?'<td class="'+(S.hist[p][i]<0?'neg':'pos')+'">'+S.hist[p][i]+'</td>':'<td>–</td>';
    return '<tr><td>'+esc(nm)+(p===me?' (tu)':'')+'</td>'+cells+'<td><b>'+S.total[p]+'</b></td></tr>';
  }).join('');
  var hd='';for(var i=0;i<S.n;i++)hd+='<th>R'+(i+1)+'</th>';
  return '<table class="score"><tr><th></th>'+hd+'<th>Totale</th></tr>'+rows+'</table>';
}
function roundTable(){
  var cols=[0,1,2,3].filter(function(k){return S.n!==3||k!==RED});
  var html='<div class="scroll-x"><table class="score"><tr><th></th>'+cols.map(function(k){return '<th>'+SUITS[k].n+'</th>'}).join('')+'<th>Punti round</th></tr>'+
    S.show.rows.map(function(r){
      return '<tr><td>'+esc(S.names[r.p])+(r.p===me?' (tu)':'')+'</td>'+cols.map(function(k){var x=r.per[k];return '<td class="'+(x.lead?'pos':'')+'">'+(x.c?(x.lead?'+':'−')+x.c:'0')+'</td>'}).join('')+
        '<td class="'+(r.pt<0?'neg':'pos')+'"><b>'+(r.pt>0?'+':'')+r.pt+'</b></td></tr>';
    }).join('')+'</table></div>';
  var cov=S.show.cov.map(function(cs,p){
    return cs.length?'<div class="hint"><b>'+esc(S.names[p])+'</b> ha giocato coperte '+plu(cs.length,'carta','carte')+': '+cs.map(cname).join(', ')+'.</div>':'';
  }).join('');
  return html+cov;
}
function dockHtml(){
  var msg='<div class="dock-msg">'+esc(S.msg)+'</div>',i;
  if(S.phase==='gameEnd'){
    var w=S.over.winners.map(function(q){return esc(S.names[q])}).join(' e ');
    return '<div class="dock-msg"><b>'+(S.over.winners.length>1?'Vittoria condivisa: ':'Vince ')+w+'!</b> (vince chi ha più punti)</div>'+scoreTable()+
      '<div class="opts"><button class="opt" data-rematch="1">Rivincita</button></div>';
  }
  if(S.phase==='scoreRound'){
    var last=S.round>=S.n-1;
    return msg+roundTable()+'<div class="opts"><button class="opt" data-next="1">'+(last?'Mostra risultato finale':'Prossimo round')+'</button></div>';
  }
  if(S.phase==='choose'){
    if(S.chooser!==me)return msg+roundTable()+'<div class="hint">'+esc(S.names[S.chooser])+' sta scegliendo il primo giocatore…</div>';
    var b='';for(i=0;i<S.n;i++)b+='<button class="opt" data-choose="'+i+'">'+(i===me?'Io':esc(S.names[i]))+'</button>';
    return msg+roundTable()+'<div class="dock-title">HAI IL PUNTEGGIO MIGLIORE: SCEGLI CHI INIZIA IL PROSSIMO ROUND</div><div class="opts">'+b+'</div>';
  }
  if(S.phase==='remaining'){
    if(!S.hands[me].length)return msg+'<div class="hint">Non hai carte rimaste. Attendi gli altri giocatori…</div>';
    if(S.picks[me]!==null){
      var pend=S.names.filter(function(nm,p){return S.picks[p]===null});
      return msg+'<div class="hint">Hai scelto di giocare coperte '+plu(S.picks[me].length,'carta','carte')+'. Attendi '+pend.map(esc).join(', ')+'…</div>';
    }
    return msg+'<div class="hint">Seleziona le carte da giocare coperte (anche nessuna). Ogni carta vale −1, ma +1 se ottieni la maggioranza in quel colore. Le scelte restano segrete finché tutti hanno deciso.</div>'+
      '<div class="opts"><button class="opt" data-mc="1">'+(ui.multi.length?'Conferma: gioca '+plu(ui.multi.length,'carta','carte')+' coperte':'Nessuna carta (conferma)')+'</button></div>';
  }
  if(S.turn!==me)return msg+'<div class="hint">Tocca a '+esc(S.names[S.turn])+'. Somma attuale: '+S.sum+' (limite '+S.limit+').</div>';
  var mine=S.hands[me];
  var hint=S.led<0?'Sei il giocatore di mano: gioca una carta a tua scelta.'
    :(mine.some(function(c){return c.s===S.led})?'Devi rispondere al colore di mano ('+SUITS[S.led].n+').':'Non hai il colore di mano ('+SUITS[S.led].n+'): gioca una carta qualsiasi.');
  var h=msg+'<div class="hint">Tocca a te: '+hint+' Somma attuale: '+S.sum+' (limite '+S.limit+').</div>';
  if(ui.sel!==null&&mine[ui.sel])h+='<div class="opts"><button class="opt" data-cf="1">Conferma: gioca '+cname(mine[ui.sel])+'</button><button class="opt" data-cf="0">Annulla</button></div>';
  return h;
}
function recapHtml(){
  var ks=[0,1,2,3].filter(function(k){return S.n!==3||k!==RED}),per=Math.floor(fullIds(S.n).length/S.n),i,zero='';
  for(i=1;i<=11;i++)zero+='<span class="nchip">'+i+'</span>';
  return '<details class="recap"><summary>RIEPILOGO</summary>'+
    '<div class="recap-row"><span class="lbl">Colori</span>'+ks.map(function(k){return '<span class="rchip s'+k+'">'+ico(SUITS[k].icon)+' '+SUITS[k].n+'</span>'}).join('')+'<span class="rv">'+(S.n===3?'Mulino (rosso) tolto · ':'')+'13 carte per colore</span></div>'+
    '<div class="recap-row"><span class="lbl">Valori</span><span class="nchip">0</span><span class="nchip">0</span>'+zero+'<span class="rv">due 0, poi 1–11</span></div>'+
    '<div class="recap-row"><span class="lbl">Briscola</span><span class="rv" style="margin-left:0">nessuna: vince la carta più alta del colore di mano</span></div>'+
    '<div class="recap-row"><span class="lbl">Limite</span><span class="nchip">'+S.limit+'</span><span class="rv">'+per+' carte a testa'+(S.aside?' · '+S.aside+' da parte':'')+'</span></div></details>';
}
function gameRender(){
  if(!myTurn())ui.sel=null;
  if(!canPick())ui.multi=[];
  var pos=POS[S.n],seats='';
  for(var r=0;r<S.n;r++)seats+=seatHtml((me+r)%S.n,pos[r]);
  return '<div class="dock">'+dockHtml()+'</div><div class="table '+(S.n===5?'n5':'')+'">'+seats+centerHtml()+'</div>'+
    (S.hist.some(function(h){return h.length})?'<div class="dock" style="position:static">'+scoreTable()+'</div>':'')+recapHtml()+RULES_HTML;
}
function gameMenu(){
  return '<label class="opt-toggle" title="Chiede conferma prima di giocare la carta"><input type="checkbox" id="optUndo" '+(OPT.undo?'checked':'')+'> Abilita annulla</label>'+
    '<label class="opt-toggle" title="Aggiunge una filigrana ai colori (puntini, righe, diagonali) per distinguerli senza i colori"><input type="checkbox" id="optA11y" '+(OPT.a11y?'checked':'')+'> Modalità accessibile</label>';
}
function gameChange(e){
  if(e.target.id==='optA11y'){OPT.a11y=e.target.checked;try{localStorage.setItem('abs-a11y',OPT.a11y?'1':'0')}catch(x){}render()}
  else if(e.target.id==='optUndo'){OPT.undo=e.target.checked;try{localStorage.setItem('abs-undo',OPT.undo?'1':'0')}catch(x){}
    if(!OPT.undo&&ui.sel!==null&&myTurn()&&S.hands[me][ui.sel]){var k=key(S.hands[me][ui.sel]);ui.sel=null;act({type:'play',k:k});return}
    ui.sel=null;render()}
}
function gameClick(b){
  var d=b.dataset;
  if(d.p!==undefined){
    var i=Number(d.p);
    if(canPick()){var at=ui.multi.indexOf(i);if(at>=0)ui.multi.splice(at,1);else ui.multi.push(i);render()}
    else if(myTurn()&&S.hands[me][i]){
      if(OPT.undo){ui.sel=ui.sel===i?null:i;render()}else act({type:'play',k:key(S.hands[me][i])});
    }
  }
  else if(d.cf!==undefined){
    if(d.cf==='1'){if(ui.sel!==null&&myTurn()&&S.hands[me][ui.sel]){var k2=key(S.hands[me][ui.sel]);ui.sel=null;act({type:'play',k:k2})}}
    else{ui.sel=null;render()}
  }
  else if(d.mc!==undefined){
    if(canPick()){var ks=ui.multi.map(function(i2){return key(S.hands[me][i2])});ui.multi=[];act({type:'cover',ks:ks})}
  }
  else if(d.next)act({type:'next'});
  else if(d.choose!==undefined)act({type:'choose',who:Number(d.choose),deck:newDeck(S.n)});
  else if(d.rematch)act({type:'rematch',deck:newDeck(S.n)});
}

// ═════════════════════════ KIT STANZE (Firebase RTDB) ═════════════════════════
// Stesso schema di tt/spy-team/online: rooms/$room con hostUid, members, lobby, state (le regole già pubblicate bastano).
// Lo stato di gioco è un unico oggetto JSON salvato come stringa in state.s (+ contatore state.v); ogni azione è una
// transazione che applica gameReduce() all'ultima versione. Le mani stanno nello stato (nascoste solo dall'interfaccia).
var FIREBASE_CONFIG={
  apiKey:"AIzaSyAoOMLytOqFY9GRXpi2kUGEyzLK-r00nvQ",
  authDomain:"gachapon-trick.firebaseapp.com",
  databaseURL:"https://gachapon-trick-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"gachapon-trick",
  storageBucket:"gachapon-trick.firebasestorage.app",
  messagingSenderId:"869677835302",
  appId:"1:869677835302:web:85768d5a6ac0d94f8372e7"
};
var ALPHABET='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
var SAVE_KEY=GAME.id+'-online-last';
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var rnd=function(n){return Math.floor(Math.random()*n)};
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t}return a}
function getPlayerName(){
  var name='';
  try{
    name=localStorage.getItem('nylo-player-name')||'';
    if(!name){var last=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');name=last&&last.name||''}
  }catch(e){}
  return String(name||'Giocatore').trim().slice(0,18)||'Giocatore';
}
var playerName=getPlayerName();
var db=null,user=null,roomRef=null,roomCode='',lobbyData=null,S=null,me=-1,listeners=[],startingGame=false;
var statusText='',connText='',joinVal='',chosenCount=GAME.counts[0],MENUOPEN=false;
try{var lastRoom=JSON.parse(localStorage.getItem(SAVE_KEY));if(lastRoom)joinVal=lastRoom.code||''}catch(e){}

function setStatus(t){statusText=t;render()}
function setConn(t){connText=t;var c=document.getElementById('conn');if(c)c.textContent=t}
function showErr(t){
  var e=document.getElementById('err');
  if(!e){e=document.createElement('div');e.id='err';e.className='err';e.setAttribute('role','alert');document.body.appendChild(e)}
  e.textContent=t;e.hidden=false;setConn('Errore');clearTimeout(showErr.t);showErr.t=setTimeout(function(){e.hidden=true},8000);
}
function genCode(){var b=new Uint8Array(12);crypto.getRandomValues(b);return Array.from(b,function(x){return ALPHABET[x%ALPHABET.length]}).join('')}
function withTimeout(p,ms,msg){
  return new Promise(function(res,rej){var t=setTimeout(function(){rej(new Error(msg))},ms);p.then(function(v){clearTimeout(t);res(v)},function(e){clearTimeout(t);rej(e)})});
}
function authMsg(e){
  if(e.code==='auth/operation-not-allowed')return 'Attiva il provider Anonimo in Firebase Authentication.';
  if(e.code==='auth/unauthorized-domain')return 'Dominio non autorizzato: aggiungilo in Authentication > Impostazioni > Domini autorizzati.';
  if(e.code==='auth/network-request-failed')return 'Firebase non raggiungibile: controlla la connessione e che il sito sia in HTTPS.';
  return e.message||'Errore di autenticazione Firebase.';
}
async function connect(){
  if(!window.firebase)throw new Error('Firebase non caricato. Controlla la connessione.');
  if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
  db=firebase.database();
  if(user)return;
  try{user=(await withTimeout(firebase.auth().signInAnonymously(),15000,'Autenticazione scaduta dopo 15 secondi.')).user}
  catch(e){throw new Error(authMsg(e))}
}
function saveLast(name){try{localStorage.setItem(SAVE_KEY,JSON.stringify({code:roomCode,name:name}))}catch(e){}}

// ─────────────── LOBBY ───────────────
async function createRoom(){
  try{
    setStatus('Connessione a Firebase...');await connect();
    var created=false,lastErr=null;
    for(var i=0;i<5&&!created;i++){
      roomCode=genCode();roomRef=db.ref('rooms/'+roomCode);
      try{
        await roomRef.child('hostUid').set(user.uid);
        await roomRef.child('members/'+user.uid).set(true);
        await roomRef.child('lobby').set({game:GAME.id,hostUid:user.uid,playerCount:chosenCount,started:false,closed:false,players:{}});
        created=true;
      }catch(e){lastErr=e;roomRef=null}
    }
    if(!created)throw lastErr||new Error('Impossibile creare la stanza. Verifica le regole del database.');
    await reserveSeat(playerName);
  }catch(e){roomRef=null;setStatus(e.message||'Errore durante la creazione della stanza.')}
}
async function joinRoom(){
  try{
    roomCode=joinVal.toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(roomCode.length!==12)throw new Error('Il codice stanza è di 12 caratteri.');
    setStatus('Connessione...');await connect();
    roomRef=db.ref('rooms/'+roomCode);
    await roomRef.child('members/'+user.uid).set(true);
    await reserveSeat(playerName);
  }catch(e){roomRef=null;setStatus(e.code==='PERMISSION_DENIED'?'Stanza non trovata o non accessibile.':(e.message||'Errore durante l\'accesso alla stanza.'))}
}
function reserveSeat(name){
  var lobbyRef=roomRef.child('lobby');
  return lobbyRef.once('value').then(function(snap){
    if(!snap.exists())throw new Error('Lobby non trovata: controlla il codice.');
    var initial=snap.val();
    if(initial.game!==GAME.id)throw new Error('Questo codice appartiene a un altro gioco.');
    return new Promise(function(resolve,reject){
      lobbyRef.transaction(function(cur){
        if(cur===null)cur=initial;
        if(!cur||!cur.playerCount||cur.closed)return;
        cur.players=cur.players||{};
        if(cur.players[user.uid])return cur;            // rientro: il posto è già tuo
        if(cur.started)return;
        var occ={};Object.keys(cur.players).forEach(function(u){occ[cur.players[u].seat]=true});
        var seat=1;while(seat<=cur.playerCount&&occ[seat])seat++;
        if(seat>cur.playerCount)return;
        cur.players[user.uid]={uid:user.uid,name:name,seat:seat};
        return cur;
      },function(err,committed,snap2){
        if(err){reject(err);return}
        var cur=snap2&&snap2.val();
        if(!cur||!cur.players||!cur.players[user.uid]){
          reject(new Error(cur&&cur.started?'La partita è già iniziata.':'La stanza è piena o non disponibile.'));return;
        }
        lobbyData=cur;saveLast(name);enterRoom();resolve();
      },false);
    });
  });
}
function orderedPlayers(d){
  return Object.keys(d.players||{}).map(function(u){return d.players[u]}).sort(function(a,b){return a.seat-b.seat});
}
function maybeStart(){
  if(!lobbyData||S||startingGame||lobbyData.started||lobbyData.hostUid!==user.uid)return;
  if(orderedPlayers(lobbyData).length===lobbyData.playerCount)startGame();
}
function startGame(){
  startingGame=true;
  var seated=orderedPlayers(lobbyData);   // i posti si assegnano a caso all'avvio
  shuffle(seated);
  var init=gameInitial(seated.map(function(p){return {uid:p.uid,name:p.name}}));
  init.v=0;
  roomRef.child('state').transaction(function(cur){if(cur!==null)return;return {v:0,s:JSON.stringify(init)}},function(err){
    if(err){startingGame=false;showErr('Errore durante l\'avvio: '+err.message);return}
    roomRef.child('lobby/started').set(true).catch(function(e){startingGame=false;showErr(e.message)});
  },false);
}

// ─────────────── STANZA ───────────────
function enterRoom(){
  setConn('Lobby');
  var lobbyRef=roomRef.child('lobby');
  var lh=function(snap){if(!snap.exists())return;lobbyData=snap.val();if(!S){render();maybeStart()}};
  lobbyRef.on('value',lh,function(e){showErr(e.message)});listeners.push({ref:lobbyRef,h:lh});
  var stateRef=roomRef.child('state');
  var sh=function(snap){
    if(!snap.exists())return;
    var raw=snap.val();
    try{S=JSON.parse(raw.s)}catch(e){showErr('Stato della stanza non leggibile.');return}
    me=S.uids.indexOf(user.uid);
    if(me<0){showErr('Non risulti tra i giocatori di questa partita.');return}
    setConn('Connesso');
    render();
  };
  stateRef.on('value',sh,function(e){showErr('Connessione persa: '+e.message)});listeners.push({ref:stateRef,h:sh});
  render();
}
function leave(){
  listeners.forEach(function(l){l.ref.off('value',l.h)});
  if(!roomRef||S||!user){window.location.reload();return}
  // prima dell'inizio libera il posto; a partita avviata si può rientrare con lo stesso codice
  roomRef.child('lobby').transaction(function(cur){
    if(!cur||cur.started)return;
    cur.players=cur.players||{};delete cur.players[user.uid];
    var rest=orderedPlayers(cur);
    if(cur.hostUid===user.uid&&rest.length)cur.hostUid=rest[0].uid;
    return cur;
  },function(){
    roomRef.child('members/'+user.uid).remove().catch(function(){}).then(function(){window.location.reload()});
  },false);
}

// azioni: ogni azione è una transazione sullo stato, validata da gameReduce() sull'ultima versione
function act(a){
  if(!roomRef||me<0)return;
  var seat=me;
  roomRef.child('state').transaction(function(cur){
    if(!cur||!cur.s)return;
    var st;try{st=JSON.parse(cur.s)}catch(e){return}
    var r=gameReduce(st,seat,a);
    if(!r)return;
    r.v=(st.v||0)+1;
    return {v:r.v,s:JSON.stringify(r)};
  },function(err,committed){
    if(err)showErr('Errore di sincronizzazione: '+err.message);
    else if(!committed)setConn('Azione non più valida');
  },false);
}

  }).join('');
  return '<section><p class="muted">Sei connesso come <b>'+esc(playerName)+'</b>.</p>'+

    '<button class="opt" type="button" data-join="1">Unisciti</button></div>'+

}
function waitingHtml(){
  var d=lobbyData||{players:{},playerCount:GAME.counts[0]};
  var players=orderedPlayers(d),full=players.length===d.playerCount,html='';
  for(var seat=1;seat<=d.playerCount;seat++){
    var p=players[seat-1];
    html+='<li><span class="seat-n">'+seat+'.</span>'+
      (p?'<span class="grow">'+esc(p.name)+(p.uid===user.uid?' (tu)':'')+'</span>':'<span class="grow soft">In attesa di un giocatore</span>')+
      (p&&p.uid===d.hostUid?'<span class="flag first">HOST</span>':'')+'</li>';
  }
  return '<section><div class="panel"><h2>Stanza '+roomCode+'</h2><p class="muted">'+
    (d.started?'La partita si sta caricando...':players.length+' / '+d.playerCount+' giocatori'+(full?' · avvio in corso':' · condividi il codice con gli altri'))+
    '</p><ul class="roster">'+html+'</ul></div></section>';
}
function kitMenuHtml(){
  var extra=typeof gameMenu==='function'?gameMenu():'';
  return '<div class="menu-wrap"><button class="hamb" type="button" data-menu="1" aria-label="Opzioni" aria-expanded="'+MENUOPEN+'"><svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 1h16M1 7h16M1 13h16"/></svg></button>'+
    (MENUOPEN?'<div class="menu-pop">'+extra+'</div>':'')+'</div>';
}
function render(){
  document.body.classList.toggle('a11y',!!(typeof OPT!=='undefined'&&OPT.a11y));
  var focus=document.activeElement&&document.activeElement.id==='joinCode';
  var badge=S&&typeof gameBadge==='function'?gameBadge():'';
  var top='<div class="topbar"><div class="logo">'+GAME.logo+'</div>'+
    (window.nyloBackBtn?nyloBackBtn():'')+(window.nyloHomeBtn?nyloHomeBtn():'')+
    (badge?'<span class="badge">'+badge+'</span>':'')+
    (roomRef?'<span class="room-code">'+roomCode+'</span><button class="btn btn-sm" type="button" data-copy="1">Copia codice</button><button class="btn btn-sm" type="button" data-leave="1">Esci</button>':'')+
    '<span class="conn" id="conn">'+esc(connText)+'</span>'+kitMenuHtml()+'</div>';
  var body=!roomRef?lobbyHtml():(!S?waitingHtml():gameRender());
  document.getElementById('app').innerHTML=top+body;
  if(focus){var j=document.getElementById('joinCode');if(j){j.focus();j.setSelectionRange(j.value.length,j.value.length)}}
}
var APP=document.getElementById('app');
APP.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b||b.disabled)return;
  var d=b.dataset;
  if(d.menu){MENUOPEN=!MENUOPEN;render();return}
  if(d.ai!==undefined){location.href=location.pathname;return}
  if(d.create!==undefined){createRoom();return}
  if(d.join!==undefined){joinRoom();return}
  if(d.leave!==undefined){if(!S||confirm('Uscire dalla stanza? Potrai rientrare con lo stesso codice.'))leave();return}
  if(d.copy!==undefined){
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(roomCode).then(function(){setConn('Codice copiato')});
    else window.prompt('Copia il codice stanza:',roomCode);
    return;
  }
  if(S&&typeof gameClick==='function')gameClick(b);
});
APP.addEventListener('input',function(e){if(e.target.id==='joinCode'){joinVal=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'');e.target.value=joinVal}});
APP.addEventListener('keydown',function(e){if(e.target.id==='joinCode'&&e.key==='Enter')joinRoom()});
APP.addEventListener('change',function(e){
  if(e.target.name==='pc'){chosenCount=Number(e.target.value);return}
  if(typeof gameChange==='function')gameChange(e);
});
document.addEventListener('click',function(e){if(MENUOPEN&&!e.target.closest('.menu-wrap')){MENUOPEN=false;render()}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&MENUOPEN){MENUOPEN=false;render()}});
render();
if(window.NYLO_START&&NYLO_START.mode==='room'){chosenCount=NYLO_START.n||chosenCount;if(NYLO_START.name)playerName=NYLO_START.name.slice(0,18);if(NYLO_START.action==='join'){joinVal=NYLO_START.code||'';joinRoom()}else createRoom();}
</script>
<style id="sx-css">
.sx-card{background:var(--surface);border:1.5px solid var(--ink);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:12px;color:var(--text)}
.sx-label{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--text-soft);margin-top:2px}
.sx-row{display:flex;gap:8px;flex-wrap:wrap}
.sx-opt{padding:10px 16px;border-radius:7px;border:1px solid var(--border);background:var(--surface-raised);color:var(--text);cursor:pointer;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;transition:border-color .12s,background .12s}
.sx-opt:hover:not(:disabled){border-color:var(--accent)}
.sx-opt.on{border-color:var(--accent);background:var(--accent);color:#fff;font-weight:600}
.sx-opt:disabled{opacity:.4;cursor:not-allowed}
.sx-row .sx-opt{flex:1 1 0;min-width:0}
.sx-go{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;margin-top:1rem}
.sx-go:hover:not(:disabled){filter:brightness(1.1);border-color:var(--accent)}
.sx-in{background:#fff;border:1px solid var(--border);color:#222;border-radius:6px;padding:10px 12px;font-family:'Inter',sans-serif;font-size:14px;width:100%;outline:none}
.sx-in:focus{border-color:var(--accent)}
.sx-in.code{letter-spacing:2px;text-transform:uppercase;font-family:Consolas,monospace}
.sx-nav{display:flex;gap:8px;align-items:center;margin-left:auto}
.sx-nav .nylo-home{background:var(--surface-raised);color:var(--text);border-color:var(--border)}
.sx-nav .nylo-home:hover{border-color:var(--accent)}
.sx-sub{display:flex;flex-direction:column;gap:10px;padding-top:2px}
</style>
<script>
(function(){
  var P=window.NYLO_SETUP={id:'american-bookshop',logo:'American Bookshop',counts:[3,4,5]};
  var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  function run(id){var s=document.createElement('script');s.textContent=document.getElementById(id).textContent;document.body.appendChild(s)}
  window.addEventListener('hashchange',function(){location.reload()});
  window.NYLO_IN_SETUP=true;   // finché si sceglie, Home/Indietro escono senza avviso
  var app=document.getElementById('app');
  var st={n:P.counts[0],mode:location.hash==='#stanze'?'room':(location.hash==='#ai'?'ai':''),sub:'',code:'',name:''};
  var needName=false;
  try{
    st.name=localStorage.getItem('nylo-player-name')||'';
    var last=JSON.parse(localStorage.getItem(P.id+'-online-last')||'null');if(last&&last.code)st.code=last.code;
  }catch(e){}
  needName=!st.name;   // il nome arriva dalla sessione; il campo compare solo se manca
  function btn(attrs,cls,label,on){return '<button type="button" class="sx-opt '+cls+(on?' on':'')+'" '+attrs+'>'+label+'</button>'}
  function draw(){
    var h='<div class="topbar"><div class="logo">'+P.logo+'</div><div class="sx-nav">'+(window.nyloBackBtn?nyloBackBtn():'')+(window.nyloHomeBtn?nyloHomeBtn():'')+'</div></div>';
    h+='<div class="sx-card">';
    if(needName)h+='<label class="sx-label" for="sxName">IL TUO NOME</label><input class="sx-in" id="sxName" maxlength="16" placeholder="Il tuo nome" autocomplete="off" value="'+esc(st.name)+'">';
    if(P.counts.length>1){
      h+='<div class="sx-label">GIOCATORI</div><div class="sx-row">'+P.counts.map(function(n){return btn('data-n="'+n+'"','',n+' giocatori',st.n===n)}).join('')+'</div>';
    }
    h+='<div class="sx-label">MODALITÀ</div><div class="sx-row">'+btn('data-mode="ai"','','Contro l’AI',st.mode==='ai')+btn('data-mode="room"','','A stanze',st.mode==='room')+'</div>';
    if(st.mode==='ai'){
      h+='<div class="sx-sub"><div class="sx-row">'+btn('data-go="ai"','sx-go','Inizia',false)+'</div></div>';
    }else if(st.mode==='room'){
      h+='<div class="sx-label">OPZIONI STANZA</div><div class="sx-sub"><div class="sx-row">'+btn('data-sub="create"','','Crea nuova',st.sub==='create')+btn('data-sub="join"','','Unisciti',st.sub==='join')+'</div>';
      if(st.sub==='create')h+='<div class="sx-row">'+btn('data-go="create"','sx-go','Inizia',false)+'</div>';
      if(st.sub==='join')h+='<input class="sx-in code" id="sxCode" maxlength="12" placeholder="Codice stanza" autocomplete="off" value="'+esc(st.code)+'"><div class="sx-row"><button type="button" class="sx-opt sx-go" id="sxJoin" data-go="join" '+(st.code.length===12?'':'disabled')+'>Inizia</button></div>';
      h+='</div>';
    }
    h+='</div>';
    app.innerHTML=h;
  }
  function loadRoom(){
    var libs=['app','auth','database'].map(function(n){return 'https://www.gstatic.com/firebasejs/10.12.2/firebase-'+n+'-compat.js'});
    (function next(i){
      if(i===libs.length){run('src-room');return}
      var s=document.createElement('script');s.src=libs[i];s.onload=function(){next(i+1)};
      s.onerror=function(){app.innerHTML='<p style="padding:20px;color:#c00">Firebase non raggiungibile: controlla la connessione.</p>'};
      document.head.appendChild(s);
    })(0);
  }
  function go(kind){
    var nm=document.getElementById('sxName'),name=((nm&&nm.value)||st.name||'').trim().slice(0,16);
    window.NYLO_IN_SETUP=false;
    if(name){try{localStorage.setItem('nylo-player-name',name)}catch(e){}}
    var cfg={name:name,n:st.n};
    if(kind==='ai'){cfg.mode='ai';window.NYLO_START=cfg;run('src-ai');return}
    cfg.mode='room';cfg.action=kind;if(kind==='join')cfg.code=st.code;
    window.NYLO_START=cfg;app.innerHTML='';loadRoom();
  }
  app.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b||b.disabled)return;
    var d=b.dataset;
    if(d.n){st.n=Number(d.n);draw()}
    else if(d.mode){st.mode=d.mode;st.sub='';draw()}
    else if(d.sub){st.sub=d.sub;draw();var c=document.getElementById('sxCode');if(c)c.focus()}
    else if(d.go)go(d.go);
  });
  app.addEventListener('input',function(e){
    if(e.target.id==='sxName')st.name=e.target.value;
    else if(e.target.id==='sxCode'){
      st.code=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'');e.target.value=st.code;
      var j=document.getElementById('sxJoin');if(j)j.disabled=st.code.length!==12;
    }
  });
  app.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='sxCode'&&st.code.length===12)go('join')});
  draw();
})();
</script>
</body>
