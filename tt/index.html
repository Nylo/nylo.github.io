        function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
        GAMES.sort(function (a, b) { return a.name.localeCompare(b.name, 'it', { sensitivity: 'base' }); });
                var BADGE_STYLE = {
                        ok: 'border-emerald-500/60 bg-emerald-500/10 text-emerald-300', beta: 'border-amber-500/60 bg-amber-500/10 text-amber-300',
                        alpha: 'border-red-500/60 bg-red-500/10 text-red-400'
                };
                function badge(label, style) {
                        return '<span class="inline-flex rounded border px-1.5 py-0.5 text-[10px] font-semibold uppercase tracking-wide ' + style + '">' + label + '</span>';
                }
                // badge del titolo: Alpha (rosso), Beta (ambra) oppure nessuno
                function betaBadge(g) {
                        if (g.alpha) return badge('Alpha', BADGE_STYLE.alpha);
                        return g.beta ? badge('Beta', BADGE_STYLE.beta) : '';
                }
                var games = document.getElementById('games');
                // preferiti: per utente (nome giocatore salvato nel browser), i preferiti stanno in cima, poi ordine per nome
                // preferiti e statistiche momentaneamente nascosti (metti true per riattivare le icone)
                var SHOW_FAV_STATS = false;
                function favKey() {
                        var n = '';
                        try { n = localStorage.getItem('nylo-player-name') || ''; } catch (e) {}
                        return 'nylo-tt-fav:' + (n.trim().toLowerCase() || 'ospite');
                }
                function loadFavs() {
                        if (!SHOW_FAV_STATS) return [];
                        try { return JSON.parse(localStorage.getItem(favKey()) || '[]'); } catch (e) { return []; }
                }
                function toggleFav(name) {
                        var f = loadFavs(), i = f.indexOf(name);
                        if (i >= 0) f.splice(i, 1); else f.push(name);
                        try { localStorage.setItem(favKey(), JSON.stringify(f)); } catch (e) {}
                }

                // statistiche personali (scritte da /home-btn.js nelle pagine di gioco): chiave nylo-stats:<nome>, per gioco e modalità
                function loadStats(g) {
                        try { var d = JSON.parse(localStorage.getItem(favKey().replace('nylo-tt-fav:', 'nylo-stats:')) || '{}'); return d[g.ai] || {}; } catch (e) { return {}; }
                }
                function statsBtn(g) {
                        if (!SHOW_FAV_STATS) return '';
                        return '<button type="button" data-stats="' + esc(g.name) + '" title="Statistiche" aria-label="Statistiche: ' + esc(g.name) + '" class="inline-flex h-8 w-8 items-center justify-center rounded-md text-lg text-slate-500 transition-colors hover:bg-white/10 hover:text-slate-200"><i class="ph ph-chart-bar" aria-hidden="true"></i></button>';
                }
                function pct(n, tot) { return tot ? Math.round(n * 100 / tot) : 0; }
                function statSection(label, s) {
                        s = s || { p: 0, a: 0, w: 0, l: 0 };
                        var pw = pct(s.w, s.p), pl = pct(s.l, s.p);
                        function row(k, v) { return '<div class="flex justify-between py-1"><dt class="text-slate-400">' + k + '</dt><dd class="font-semibold tabular-nums">' + v + '</dd></div>'; }
                        function bar(k, v, color) { return '<div class="py-1"><div class="flex justify-between"><span class="text-slate-400">' + k + '</span><span class="font-semibold tabular-nums">' + v + '%</span></div><div class="mt-1 h-1.5 overflow-hidden rounded bg-white/10"><div class="h-full rounded ' + color + '" style="width:' + v + '%"></div></div></div>'; }
                        return '<section class="mt-4"><h3 class="text-xs font-semibold uppercase tracking-wide text-slate-400">' + label + '</h3><dl class="mt-1 divide-y divide-slate-800 text-sm">' +
                                row('Partite giocate', s.p) + row('Partite abbandonate', s.a) + row('Vinte', s.w) + row('Perse', s.l) + '</dl>' +
                                '<div class="text-sm">' + bar('% vinte', pw, 'bg-emerald-500') + bar('% perse', pl, 'bg-rose-500') + '</div></section>';
                }
                function openStats(name) {
                        var g = GAMES.filter(function (x) { return x.name === name; })[0]; if (!g) return;
                        var st = loadStats(g), n = '';
                        try { n = localStorage.getItem('nylo-player-name') || ''; } catch (e) {}
                        var ov = document.getElementById('statsModal');
                        if (!ov) { ov = document.createElement('div'); ov.id = 'statsModal'; document.body.appendChild(ov); }
                        ov.className = 'fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4';
                        ov.innerHTML = '<div role="dialog" aria-modal="true" aria-label="Statistiche" class="max-h-full w-full max-w-sm overflow-y-auto rounded-xl border border-slate-700 bg-slate-900 p-5 text-slate-100 shadow-2xl">' +
                                '<div class="flex items-start justify-between gap-3"><div><div class="text-lg font-bold">' + esc(g.name) + '</div><div class="text-xs text-slate-400">Statistiche di ' + esc(n || 'ospite') + '</div></div>' +
                                '<button type="button" data-close="1" aria-label="Chiudi" class="rounded-md p-1 text-slate-400 hover:bg-white/10 hover:text-slate-100"><i class="ph ph-x text-lg" aria-hidden="true"></i></button></div>' +
                                statSection('Contro l\'AI', st.ai) + (st.friends ? statSection('Contro gli amici', st.friends) : '') +
                                '<p class="mt-4 text-[11px] leading-snug text-slate-500">Vinte e perse contano le partite concluse (una vittoria condivisa vale come vinta). Le statistiche sono salvate su questo browser dall\'ultimo aggiornamento.</p></div>';
                        ov.onclick = function (e) { if (e.target === ov || e.target.closest('[data-close]')) ov.remove(); };
                        document.onkeydown = function (e) { if (e.key === 'Escape' && document.getElementById('statsModal')) document.getElementById('statsModal').remove(); };
                        ov.querySelector('[data-close]').focus();
                }
                function favBtn(g, on) {
                        if (!SHOW_FAV_STATS) return '';
                        return '<button type="button" data-fav="' + esc(g.name) + '" aria-pressed="' + on + '" title="' + (on ? 'Rimuovi dai preferiti' : 'Aggiungi ai preferiti') + '" aria-label="' + (on ? 'Rimuovi dai preferiti: ' : 'Aggiungi ai preferiti: ') + esc(g.name) + '" class="inline-flex h-8 w-8 items-center justify-center rounded-md text-lg transition-colors hover:bg-white/10 ' + (on ? 'text-amber-300' : 'text-slate-500 hover:text-slate-200') + '"><i class="' + (on ? 'ph-fill' : 'ph') + ' ph-bookmark-simple" aria-hidden="true"></i></button>';
                }
                // partite salvate contro l'AI (una per gioco, localStorage 'nylo-saves', scritte da /home-btn.js): chiave = cartella del gioco
                function savedFor(g) {
                        return savedInfo(g) && savedInfo(g).s;
                }
                // un gioco può raccogliere più pagine (g.alt, es. Shihou Dealer + Gem's Pyramid): vale il salvataggio più recente
                function savedInfo(g) {
                        var best = null;
                        [g.ai].concat(g.alt || []).forEach(function (u) {
                                var base = u.split('#')[0], id = base.replace(/\/+$/, '').split('/').pop();
                                try { var s = window.nyloSaveInfo ? window.nyloSaveInfo(id) : null; if (s && s.id === id && (!best || (s.ts || 0) > (best.s.ts || 0))) best = { s: s, base: base }; } catch (e) {}
                        });
                        return best;
                }
                function resumeBtn(g) {
                        var si = savedInfo(g);
                        if (!si) return '';
                        var base = si.base;
                        return '<button type="button" data-resume="' + esc(base) + '" title="Riprendi la partita salvata" class="mr-2 inline-flex items-center gap-1 rounded-md border border-teal-500/60 bg-teal-500/10 px-2 py-0.5 align-middle text-[11px] font-semibold uppercase tracking-wide text-teal-300 transition-colors hover:bg-teal-500/20"><i class="ph ph-play" aria-hidden="true"></i>Riprendi</button>';
                }
                function rowHtml(g, on) {
                        return '<tr data-href="' + esc(g.ai) + '" tabindex="0" aria-label="Apri ' + esc(g.name) + '" class="cursor-pointer transition-colors hover:bg-white/[0.04] focus-visible:outline focus-visible:outline-2 focus-visible:outline-teal-500">' +
                                '<th scope="row" class="px-4 py-3 font-semibold text-slate-100"><div class="flex items-center gap-2"><a href="' + esc(g.ai) + '" class="hover:text-teal-300">' + esc(g.name) + '</a>' +
                                '<span class="ml-auto flex shrink-0 items-center gap-1.5">' + resumeBtn(g) + betaBadge(g) + '</span></div></th>' +
                                '<td class="w-px whitespace-nowrap pl-1 pr-3 py-2 text-right">' + statsBtn(g) + favBtn(g, on) + '</td>' +
                                '<td class="w-px whitespace-nowrap pl-1 pr-4 py-3 text-right text-slate-300">' + esc(g.players) + '</td></tr>';
                }
                // ricerca live sul titolo (senza accenti, maiuscole indifferenti)
                function norm(t) { return String(t).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
                // TEMPORANEO (stateFilter): interruttori sì/no; «ok» (verde) mostra solo i giochi senza Alpha né Beta ed è alternativo agli altri due; Beta/Alpha si possono combinare
                var stateOn = { ok: false, beta: false, alpha: false };
                var STATE_BTN = { ok: ['ok', 'ok'], beta: ['Beta', 'beta'], alpha: ['Alpha', 'alpha'] };
                function gameStates(g) {
                        var r = [];
                        if (g.alpha) r.push('alpha');
                        else if (g.beta) r.push('beta'); else r.push('ok');
                        return r;
                }
                function stateMatch(g) {
                        var act = Object.keys(stateOn).filter(function (k) { return stateOn[k]; });
                        return !act.length || gameStates(g).some(function (k) { return stateOn[k]; });
                }
                var IS_ADMIN = false;   // stesso accesso admin della collection (password master → localStorage nylo-admin)
                try { IS_ADMIN = localStorage.getItem('nylo-admin') === '85770706df4d616a498c17a05c1f8fe200d36b219ea00c688d4ac39ee46103c4' || (localStorage.getItem('nylo-player-name') || '').trim().toLowerCase() === 'nylo'; } catch (e) {}
                // i giochi in alpha si vedono solo con accesso admin / giocatore nylo oppure con il Lab sbloccato
                var LAB_OPEN = false;
                try { LAB_OPEN = localStorage.getItem('nylo-tambu-unlocked') === 'c57025ae9174f33c56f41db133f1b855c82502a687de8eddcb9e1d6fa491bdfb'; } catch (e) {}
                var CAN_ALPHA = IS_ADMIN || LAB_OPEN;
                function drawStateFilter() {
                        if (!IS_ADMIN) return;
                        document.getElementById('stateFilter').classList.replace('hidden', 'flex');
                        document.getElementById('stateFilter').innerHTML = Object.keys(STATE_BTN).map(function (k) {
                                var on = stateOn[k], st = BADGE_STYLE[STATE_BTN[k][1]];
                                var fill = { ok: 'bg-emerald-400', beta: 'bg-amber-400', alpha: 'bg-red-400' }[k];
                                return '<button type="button" data-state="' + k + '" aria-pressed="' + on + '" class="inline-flex rounded border px-2.5 py-1 text-[11px] font-semibold uppercase tracking-wide ' + (on ? 'border-transparent text-slate-950 ' + fill : st) + '">' + STATE_BTN[k][0] + '</button>';
                        }).join('');
                }
                document.getElementById('stateFilter').addEventListener('click', function (e) {
                        var b = e.target.closest('button[data-state]'); if (!b) return;
                        var k = b.getAttribute('data-state'), on = !stateOn[k]; if (on) Object.keys(stateOn).forEach(function (o) { if ((o === 'ok') !== (k === 'ok')) stateOn[o] = false; }); stateOn[k] = on;   // «ok» esclude Alpha e Beta (e viceversa)
                        drawStateFilter(); show();
                });
                drawStateFilter();
                var q = document.getElementById('q');
                function show() {
                        var t = norm(q.value).trim();
                        var list = GAMES.filter(function (g) { return (CAN_ALPHA || !g.alpha) && (!t || norm(g.name).indexOf(t) !== -1) && stateMatch(g); });
                        var favs = loadFavs();
                        list = list.filter(function (g) { return favs.indexOf(g.name) >= 0; }).concat(list.filter(function (g) { return favs.indexOf(g.name) < 0; }));
                        var cnt = document.getElementById('count'); if (IS_ADMIN) { cnt.classList.remove('hidden'); cnt.textContent = list.length + '/' + GAMES.length; }
                        games.innerHTML = list.length ? list.map(function (g) { return rowHtml(g, favs.indexOf(g.name) >= 0); }).join('') : '<tr><td colspan="3" class="px-4 py-6 text-center text-slate-400">Nessun titolo trovato.</td></tr>';
                }
                q.addEventListener('input', show);
                show();
                games.addEventListener('click', function (e) {
                        var rb = e.target.closest('button[data-resume]');
                        if (rb) { location.href = rb.getAttribute('data-resume') + '#resume'; return; }
                        var sb = e.target.closest('button[data-stats]');
                        if (sb) { openStats(sb.getAttribute('data-stats')); return; }
                        var fb = e.target.closest('button[data-fav]');
                        if (fb) { toggleFav(fb.getAttribute('data-fav')); show(); return; }
                        var row = e.target.closest('tr[data-href]');
                        if (row && !e.target.closest('a')) location.href = row.getAttribute('data-href');
                });
                games.addEventListener('keydown', function (e) {
                        if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr[data-href]')) {
                                e.preventDefault(); location.href = e.target.getAttribute('data-href');
                        }
                });
    </script>
