<!DOCTYPE html>
<html lang="it" class="h-full">
<head>
<script src="/auth-gate.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trick-taking online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body{font-family:'Inter',sans-serif}
    p.mt-2.text-sm.text-slate-400{display:none}</style>
</head>
<body class="min-h-full m-0 bg-[#0a0c10] text-slate-100">
    <main class="mx-auto max-w-7xl px-4 py-10">
        <a href="/#online" class="mb-4 inline-flex items-center gap-1.5 text-sm text-slate-400 hover:text-slate-200"><i class="ph-fill ph-arrow-left"></i>Indietro</a>
        <h1 class="text-2xl font-bold">Trick-taking online</h1>
        <p class="mt-1 text-sm text-slate-400">Scegli il gioco e come giocarlo: contro l'AI o contro gli amici, in una stanza online.</p>
                <div class="mt-8 overflow-x-auto rounded-xl border border-slate-700/60">
                        <table class="w-full min-w-[360px] border-collapse text-left text-sm">
                                <thead class="bg-white/[0.05] text-xs uppercase tracking-wide text-slate-400">
                                        <tr><th scope="col" class="px-4 py-3">Titolo</th><th scope="col" class="px-4 py-3">N. giocatori</th><th scope="col" class="px-4 py-3"></th></tr>
                                </thead>
                                <tbody id="games" class="divide-y divide-slate-800"></tbody>
                        </table>
                </div>
    </main>
    <script>
        // ai = pagina contro l'AI; online = pagina "a stanze" (null finché non esiste/funziona: il pulsante resta disabilitato)
        var GAMES = [
        {

        },

        {

        },
        {

        {

                "ai": "/tt/vs-ai/apocalypse/",

        },
        {
                "name": "Bid COIN",

                "ai": "/tt/vs-ai/daytime-minutes/",

        {

                "ai": "/tt/vs-ai/woodlanders/",

        {
                "name": "Plotters, Inc.",

        },
        {

                "desc": "Vinci prese e raccogli carte dal centro per arrivare a 10 senza superarlo: vincere troppo ti costa. Rosso: vince il più alto, blu: il più basso.",
                "ai": "/tt/vs-ai/tenbalance/",
                "online": null,
                "badge": "Beta"
        },
        {
                "name": "MergeTake",
                "players": "3–4",
                "desc": "Raccogli più slime possibile, ma numeri uguali o consecutivi si fondono in gruppi: contano i gruppi, e da 5 carte in su si perde punti.",
                "ai": "/tt/vs-ai/mergetake/",
                "online": null,
                "badge": "Beta"
        },
        {
                "name": "Yokai Fuwafuwa",
                "players": "3–4",
                "desc": "Non sai quante prese farai: gioca carte coperte e metti cubi sulla scheda puntata per schiarirti le idee.",
                "ai": "/tt/vs-ai/yokai-fuwafuwa/",
                "online": null,
                "badge": "Beta"
        },
        {
                "name": "Pack Tricks",
                "players": "4",
                "desc": "Scegli una squadra ogni round e raggiungi insieme il numero di prese promesso. Giallo è briscola, i 4 costano punti.",
                "ai": "/tt/vs-ai/pack-tricks/",
                "online": null,
                "badge": "Beta"
        },
        {
                "name": "Otherside Trick",
                "players": "4–5",
                "desc": "Ogni presa ha due vincitori: chi vince il seme di mano si prende una Struttura, chi vince l'altro seme un Kaii. Contieni tutti i Kaii o muori.",
                "ai": "/tt/vs-ai/otherside-trick/",
                "online": null,
                "badge": "Beta"
        },
        {
                "name": "Oboro",
                "players": "3–4",
                "desc": "Dichiara quante prese farai: le tue carte cambiano colore (bianco, rosso, viola) in base alla posizione dei pennelli in mano. Vince chi centra la puntata.",
                "ai": "/tt/vs-ai/oboro/",
                "online": null,
                "badge": "Beta"
        },
        {
                "name": "Cassiopée",
                "players": "4",
                "desc": "Sfida 2 contro 2: la coppia all'attacco sceglie la briscola e scopre parte della mano, la difesa cerca di farla fallire. Prese e stelle fanno punti.",
                "ai": "/tt/vs-ai/cassiopee/",
                "online": null,
                "badge": "Beta"
        },
        {
                "name": "Phantom Trick",
                "players": "3–5",
                "desc": "Le carte con lo stesso valore si annullano nella presa. Chi vince sceglie una carta da tenere: abbinare i valori trasforma le penalità in punti.",
                "ai": "/tt/vs-ai/phantom-trick/",
                "online": null,
                "badge": "Beta"
        },
        {
                "name": "Trick and Trade",
                "players": "3–5",
                "desc": "Prese senza obbligo di seguire il seme: chi vince fissa il valore dei semi, tutti pescano carte Trade. A fine partita contano i moltiplicatori 3×, 2×, 1×, −1×.",
                "ai": "/tt/vs-ai/trick-and-trade/",
                "online": null,
                "badge": "Beta"
        }
];
        function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
        GAMES.sort(function (a, b) { return a.name.localeCompare(b.name, 'it', { sensitivity: 'base' }); });
                var BADGE_STYLE = {
                        beta: 'border-amber-500/60 bg-amber-500/10 text-amber-300',
                        new: 'border-emerald-500/60 bg-emerald-500/10 text-emerald-300',
                        upd: 'border-sky-500/60 bg-sky-500/10 text-sky-300',
                        wip: 'border-slate-500/60 bg-slate-500/10 text-slate-300'
                };
                function status(g) {
                        if (!g.badge) return '';
                        var value = String(g.badge).toLowerCase();
                        var style = BADGE_STYLE[value] || 'border-slate-600 text-slate-300';
                        return '<span class="inline-flex rounded border px-1.5 py-0.5 text-[10px] font-semibold uppercase tracking-wide ' + style + '">' + esc(g.badge) + '</span>';
        }
                var games = document.getElementById('games');
                games.innerHTML = GAMES.map(function (g) {
                        return '<tr data-href="' + esc(g.ai) + '" tabindex="0" aria-label="Apri ' + esc(g.name) + '" class="cursor-pointer transition-colors hover:bg-white/[0.04] focus-visible:outline focus-visible:outline-2 focus-visible:outline-teal-500">' +
                                '<th scope="row" class="px-4 py-3 font-semibold text-slate-100"><a href="' + esc(g.ai) + '" class="hover:text-teal-300">' + esc(g.name) + '</a></th>' +
                                '<td class="whitespace-nowrap px-4 py-3 text-slate-300"><span class="inline-flex items-center gap-1.5"><i class="ph-fill ph-users text-slate-500"></i>' + esc(g.players) + '</span></td>' +
                                '<td class="px-4 py-3">' + status(g) + '</td></tr>';
        }).join('');
                games.addEventListener('click', function (e) {
                        var row = e.target.closest('tr[data-href]');
                        if (row && !e.target.closest('a')) location.href = row.getAttribute('data-href');
                });
                games.addEventListener('keydown', function (e) {
                        if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr[data-href]')) {
                                e.preventDefault(); location.href = e.target.getAttribute('data-href');
                        }
                });
    </script>
</body>
</html>
