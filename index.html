<!DOCTYPE html>
<html lang="it" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nylo HomePage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="h-full m-0 bg-gradient-to-b from-[#142b34] to-[#0e1e25] text-slate-100">

    <header class="fixed top-0 left-0 z-20 p-4">
        <button id="menuToggle" type="button" aria-label="Menu" aria-expanded="false" aria-controls="menu"
                class="flex h-10 w-10 flex-col items-center justify-center gap-[5px] rounded-lg border border-slate-700/50 bg-slate-900/80 backdrop-blur-md hover:border-teal-500/50 hover:bg-slate-800/90 transition-colors">
            <svg id="iconLock" class="h-5 w-5 text-slate-200" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            <span id="iconBars" style="display:none" class="flex flex-col gap-[5px]">
                <span class="block h-0.5 w-5 rounded bg-slate-200"></span>
                <span class="block h-0.5 w-5 rounded bg-slate-200"></span>
                <span class="block h-0.5 w-5 rounded bg-slate-200"></span>
            </span>
        </button>

        <form id="pwForm" hidden autocomplete="off"
              class="mt-2 w-72 rounded-xl border border-slate-700/50 bg-slate-900/95 p-3 text-sm shadow-2xl backdrop-blur-md">
            <label for="pwInput" class="mb-2 block text-slate-300">Password di accesso</label>
            <div class="flex gap-2">
                <input id="pwInput" type="password" autocomplete="off"
                       class="min-w-0 flex-1 rounded-lg border border-slate-700 bg-slate-800 px-3 py-2 text-slate-100 outline-none focus:border-teal-500">
                <button type="submit" class="rounded-lg bg-teal-600 px-3 py-2 font-semibold text-white hover:bg-teal-500 transition-colors">Entra</button>
            </div>
            <p id="pwErr" hidden class="mt-2 text-xs text-red-400">Password errata</p>
        </form>

        <nav id="menu" hidden
             class="mt-2 max-h-[80vh] w-72 overflow-y-auto rounded-xl border border-slate-700/50 bg-slate-900/95 py-1 text-sm shadow-2xl backdrop-blur-md"></nav>
    </header>

    <script>
        (function () {
            // Menu: 1° livello = sezioni, 2° livello = link oppure gruppi (se hanno figli, cliccabili solo i figli)
            var MENU = [
                { label: 'Trick-taking', children: [
                    { label: "Nylo's collection", href: '/trick-taking.html' },
                    { label: 'Gachapon Trick', children: [
                        { label: 'Helper (stesso device)', href: '/gcp_v2.html' },
                        { label: 'Helper (Online, a stanze)', href: '/gcp_v3.html' }
                    ]},
                    { label: 'Spy Team', children: [
                        { label: 'vs AI', href: '/spy-team.html' },
                        { label: 'Online, a stanze', href: '/spy-team-online.html' }
                    ]},
                    { label: '6 Forces', children: [
                        { label: 'vs AI', href: '/six-forces.html' },
                        { label: 'Online, a stanze', href: null }
                    ]},
                    { label: 'Charms', children: [
                        { label: 'vs AI', href: '/charms.html' },
                        { label: 'Online, a stanze', href: null }
                    ]},
                    { label: 'Quashars', children: [
                        { label: 'vs AI', href: '/quashars.html' },
                        { label: 'Online, a stanze', href: null }
                    ]}
                ]},
                { label: 'Altri boardgames', children: [
                    { label: 'Cascadia randomizer', href: '/webapp/index.html' },
                    { label: 'Tir na nóg helper', href: '/tnn_encounter_cards_viewer.html' },
                    { label: 'Solitari', children: [
                        { label: 'The Path of the Priest', href: '/path.html' },
                        { label: 'Florenza Dice Game', href: '/fdg/solitario.html' }
                    ]}
                ]}
            ];

            var CHEV = '<svg class="h-3 w-3 shrink-0 transition-transform group-open:rotate-90" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 2l4 4-4 4"/></svg>';
            var ROW = 'flex w-full items-center gap-2 text-left text-slate-200 hover:bg-slate-800 hover:text-white transition-colors';

            function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
            function link(item, pad) {
                if (!item.href) return '<span class="flex items-center justify-between ' + pad + ' py-2 text-slate-500 cursor-not-allowed" title="In arrivo">' + esc(item.label) + '<span class="text-[10px] uppercase tracking-wide">presto</span></span>';
                return '<a href="' + item.href + '" class="block ' + pad + ' py-2 ' + ROW + '">' + esc(item.label) + '</a>';
            }
            function level2(item) {
                if (!item.children) return '<li>' + link(item, 'pl-8 pr-4') + '</li>';
                return '<li><details class="group"><summary class="' + ROW + ' cursor-pointer list-none py-2 pl-8 pr-4 [&::-webkit-details-marker]:hidden">' + CHEV + esc(item.label) + '</summary>' +
                    '<ul class="border-l border-slate-700/60 ml-9 mb-1">' + item.children.map(function (c) { return '<li>' + link(c, 'pl-4 pr-4') + '</li>'; }).join('') + '</ul></details></li>';
            }
            function level1(item) {
                return '<details class="group"><summary class="' + ROW + ' cursor-pointer list-none px-4 py-2.5 font-semibold [&::-webkit-details-marker]:hidden">' + CHEV + esc(item.label) + '</summary>' +
                    '<ul class="pb-1">' + item.children.map(level2).join('') + '</ul></details>';
            }

            var toggle = document.getElementById('menuToggle');
            var menu = document.getElementById('menu');
            menu.innerHTML = MENU.map(level1).join('');
            var pwForm = document.getElementById('pwForm');
            var pwInput = document.getElementById('pwInput');
            var pwErr = document.getElementById('pwErr');
            var PW_HASH = 'ad2fcdb7122f8f450a8f1c8a9f88a7632b1d5e561b93d66e735564e2e892100d';
            var KEY = 'nylo-unlocked';
            var unlocked = false;
            try { unlocked = localStorage.getItem(KEY) === PW_HASH; } catch (e) {}

            function sha256(s) {
                return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)).then(function (b) {
                    return Array.prototype.map.call(new Uint8Array(b), function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
                });
            }
            function applyState() {
                document.getElementById('iconLock').style.display = unlocked ? 'none' : '';
                document.getElementById('iconBars').style.display = unlocked ? 'flex' : 'none';
                toggle.setAttribute('aria-label', unlocked ? 'Menu' : 'Accedi');
                if (unlocked) pwForm.hidden = true;
            }
            function setOpen(open) {
                menu.hidden = !open;
                toggle.setAttribute('aria-expanded', String(open));
            }
            function setPw(open) {
                pwForm.hidden = !open;
                toggle.setAttribute('aria-expanded', String(open));
                if (open) { pwErr.hidden = true; pwInput.value = ''; pwInput.focus(); }
            }
            toggle.addEventListener('click', function (e) {
                e.stopPropagation();
                if (unlocked) setOpen(menu.hidden); else setPw(pwForm.hidden);
            });
            pwForm.addEventListener('click', function (e) { e.stopPropagation(); });
            pwForm.addEventListener('submit', function (e) {
                e.preventDefault();
                sha256(pwInput.value).then(function (h) {
                    if (h === PW_HASH) {
                        unlocked = true;
                        try { localStorage.setItem(KEY, PW_HASH); } catch (err) {}
                        applyState();
                        setOpen(true);
                    } else {
                        pwErr.hidden = false;
                        pwInput.select();
                    }
                });
            });
            document.addEventListener('click', function (e) {
                if (!menu.hidden && !menu.contains(e.target)) setOpen(false);
                if (!pwForm.hidden) setPw(false);
            });
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') { setOpen(false); if (!pwForm.hidden) setPw(false); }
            });
            applyState();
        })();
    </script>

</body>
</html>
