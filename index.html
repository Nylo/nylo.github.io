<!DOCTYPE html>
<html lang="it" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nylo HomePage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="h-full m-0 bg-gradient-to-b from-[#142b34] to-[#0e1e25] text-slate-100">

    <header class="fixed top-0 left-0 z-20 p-4">
        <button id="menuToggle" type="button" aria-label="Menu" aria-expanded="false" aria-controls="menu"
                class="flex h-10 w-10 flex-col items-center justify-center gap-[5px] rounded-lg border border-slate-700/50 bg-slate-900/80 backdrop-blur-md hover:border-teal-500/50 hover:bg-slate-800/90 transition-colors">
            <span class="block h-0.5 w-5 rounded bg-slate-200"></span>
            <span class="block h-0.5 w-5 rounded bg-slate-200"></span>
            <span class="block h-0.5 w-5 rounded bg-slate-200"></span>
        </button>

        <nav id="menu" hidden
             class="mt-2 w-64 overflow-hidden rounded-xl border border-slate-700/50 bg-slate-900/95 shadow-2xl backdrop-blur-md">
            <ul class="py-1 text-sm">
                <li><a href="/trick-taking.html" class="block px-4 py-2.5 text-slate-200 hover:bg-slate-800 hover:text-white transition-colors">Trick-taking collection</a></li>
                <li><a href="/gcp_v2.html" class="block px-4 py-2.5 text-slate-200 hover:bg-slate-800 hover:text-white transition-colors">Gachapon Trick Basic</a></li>
                <li><a href="/gcp_v3.html" class="block px-4 py-2.5 text-slate-200 hover:bg-slate-800 hover:text-white transition-colors">Gachapon Trick Pro</a></li>
                <li><a href="/webapp/index.html" class="block px-4 py-2.5 text-slate-200 hover:bg-slate-800 hover:text-white transition-colors">Cascadia randomizer</a></li>
                <li><a href="/tnn_encounter_cards_viewer.html" class="block px-4 py-2.5 text-slate-200 hover:bg-slate-800 hover:text-white transition-colors">Tir na nog cards viewer</a></li>
                <li><a href="/path.html" class="block px-4 py-2.5 text-slate-200 hover:bg-slate-800 hover:text-white transition-colors">The Path of the Priest</a></li>
                <li><a href="/fdg/solitario.html" class="block px-4 py-2.5 text-slate-200 hover:bg-slate-800 hover:text-white transition-colors">Florenza Dice Game · Solitario</a></li>
                <li><a href="/spy-team.html" class="block px-4 py-2.5 text-slate-200 hover:bg-slate-800 hover:text-white transition-colors">Spy Team · vs AI</a></li>
                <li><a href="/spy-team-online.html" class="block px-4 py-2.5 text-slate-200 hover:bg-slate-800 hover:text-white transition-colors">Spy Team · Online</a></li>
            </ul>
        </nav>
    </header>

    <script>
        (function () {
            var toggle = document.getElementById('menuToggle');
            var menu = document.getElementById('menu');
            function setOpen(open) {
                menu.hidden = !open;
                toggle.setAttribute('aria-expanded', String(open));
            }
            toggle.addEventListener('click', function (e) {
                e.stopPropagation();
                setOpen(menu.hidden);
            });
            document.addEventListener('click', function (e) {
                if (!menu.hidden && !menu.contains(e.target)) setOpen(false);
            });
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') setOpen(false);
            });
        })();
    </script>

</body>
</html>
