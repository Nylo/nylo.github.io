<!DOCTYPE html>
<html lang="it" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nylo HomePage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* le utility display di Tailwind (flex) altrimenti vincono sull'attributo hidden */
        [hidden] { display: none !important; }
        /* contenuto offuscato finché non viene inserita la password */
        body.locked #app { filter: blur(14px); pointer-events: none; user-select: none; }
    </style>
</head>
<body class="locked min-h-full m-0 bg-[#0a0c10] text-slate-100">

    <main id="app" class="mx-auto flex min-h-screen w-full max-w-3xl flex-col px-4 py-8 sm:py-12"></main>

    <!-- Accesso principale: copre subito la pagina, il contenuto sotto resta sfocato -->
    <div id="gate" class="fixed inset-0 z-50 flex items-center justify-center bg-[#0a0c10]/60 p-4 backdrop-blur-md">
        <form id="gateForm" autocomplete="off"
              class="w-full max-w-xs rounded-xl border border-slate-700/50 bg-[#0a0c10]/95 p-4 text-sm shadow-2xl">
            <label for="gateInput" class="mb-2 block text-slate-300">Accedi</label>
            <div class="flex gap-2">
                <input id="gateInput" type="password" autocomplete="off"
                       class="min-w-0 flex-1 rounded-lg border border-slate-700 bg-white/5 px-3 py-2 text-slate-100 outline-none focus:border-teal-500">
                <button type="submit" class="rounded-lg bg-teal-600 px-3 py-2 font-semibold text-white transition-colors hover:bg-teal-500">Entra</button>
            </div>
            <p id="gateErr" hidden class="mt-2 text-xs text-red-400">Codice errato</p>
        </form>
    </div>

    <div id="nameGate" hidden class="fixed inset-0 z-50 flex items-center justify-center bg-[#0a0c10]/60 p-4 backdrop-blur-md">
        <form id="nameForm" autocomplete="off"
              class="w-full max-w-xs rounded-xl border border-slate-700/50 bg-[#0a0c10]/95 p-4 text-sm shadow-2xl">
            <label for="nameInput" class="mb-2 block text-slate-300">Come vuoi essere chiamato?</label>
            <div class="flex gap-2">
                <input id="nameInput" type="text" maxlength="16" autocomplete="nickname" required
                       class="min-w-0 flex-1 rounded-lg border border-slate-700 bg-white/5 px-3 py-2 text-slate-100 outline-none focus:border-teal-500">
                <button type="submit" class="rounded-lg bg-teal-600 px-3 py-2 font-semibold text-white transition-colors hover:bg-teal-500">Continua</button>
            </div>
        </form>
    </div>

    <!-- Seconda password: area Lab -->
    <div id="labGate" hidden class="fixed inset-0 z-50 flex items-center justify-center bg-[#0a0c10]/60 p-4 backdrop-blur-md">
        <form id="labForm" autocomplete="off"
              class="w-full max-w-xs rounded-xl border border-slate-700/50 bg-[#0a0c10]/95 p-4 text-sm shadow-2xl">
            <label for="labInput" class="mb-2 flex items-center gap-2 text-slate-300"><i class="ph-fill ph-test-tube text-amber-400"></i>Password area Lab</label>
            <div class="flex gap-2">
                <input id="labInput" type="password" autocomplete="off"
                       class="min-w-0 flex-1 rounded-lg border border-slate-700 bg-white/5 px-3 py-2 text-slate-100 outline-none focus:border-teal-500">
                <button type="submit" class="rounded-lg bg-teal-600 px-3 py-2 font-semibold text-white transition-colors hover:bg-teal-500">Entra</button>
            </div>
            <p id="labErr" hidden class="mt-2 text-xs text-red-400">Password errata</p>
            <button type="button" id="labCancel" class="mt-3 text-xs text-slate-400 hover:text-slate-200">Annulla</button>
        </form>
    </div>

    <script>
        (function () {
            // Struttura del menu: 4 schede principali; le schede con "children" aprono una vista con le schede figlie.
            // Figlio = { title, desc, icon, href } oppure { title, desc, icon, links: [{ label, href }] } oppure { ..., soon: true }
            var HOME = [
                { id: 'collection', title: 'Trick Taking collection', desc: 'La collezione di giochi di trick-taking di Nylo', icon: 'cards', href: '/tt/collection/' },
                { id: 'helpers', title: 'Boardgame Helpers', desc: 'Contatori e strumenti di supporto per i giochi da tavolo', icon: 'toolbox', children: [
                    { title: 'Gachapon Trick', desc: 'Contatore di punti per Gachapon Trick', icon: 'cards-three', links: [
                        { label: 'Stesso device', href: '/tt/gachapon/gcp_v2.html' },
                        { label: 'Online, a stanze', href: '/tt/gachapon/gcp_v3.html' }
                    ]},
                    { title: 'Cascadia', desc: 'Generatore di carte punteggio', icon: 'tree', href: '/webapp/index.html' },
                    { title: 'Tir na nóg', desc: 'Visualizzatore delle carte incontro', icon: 'compass', href: '/tnn_encounter_cards_viewer.html' },
                    { title: 'ZenithDex IT', desc: 'Catalogo delle carte di Zenith in italiano, con filtri per pianeta, tipo e costo', icon: 'planet', href: '/zenithdex/' }
                ]},
                { id: 'online', title: 'Online games', desc: "Partite da giocare online contro l'AI o gli amici", icon: 'globe', children: [
                    { title: 'Trick-Taking', desc: 'Giochi di prese contro l\'AI o contro gli amici', icon: 'cards', href: '/tt/' },
                    { title: 'Non-trick-taking', desc: 'Altri giochi online', icon: 'puzzle-piece', href: '/ntt/' }
                ]},
                { id: 'lab', title: 'Lab', desc: 'Giochi e strumenti in sviluppo e sperimentali. Richiede password.', icon: 'flask', locked: true, children: [
                    { title: 'Haru', desc: 'Prototipo per Tambu', icon: 'flower-lotus', href: '/haru.html' },
                    { title: 'Kogge', desc: 'Gioco da tavolo di commercio', icon: 'sailboat', href: '/kogge.html', badge: 'WIP' },
                    { title: 'Florenza Dice Game', desc: 'Versione solitario', icon: 'dice-five', href: '/fdg/solitario.html', badge: 'WIP' }
                ]}
            ];

            var GATE = { hash: 'ad2fcdb7122f8f450a8f1c8a9f88a7632b1d5e561b93d66e735564e2e892100d', key: 'nylo-unlocked' };
            // password "master": sblocca home, area Lab e admin della collection, e imposta il nome "Nylo" senza popup nei giochi vs AI
            var MASTER_HASH = '85770706df4d616a498c17a05c1f8fe200d36b219ea00c688d4ac39ee46103c4';
            function masterUnlock() {
              try {
                localStorage.setItem('nylo-unlocked', 'ad2fcdb7122f8f450a8f1c8a9f88a7632b1d5e561b93d66e735564e2e892100d');
                localStorage.setItem('nylo-tambu-unlocked', 'c57025ae9174f33c56f41db133f1b855c82502a687de8eddcb9e1d6fa491bdfb');
                localStorage.setItem('nylo-admin', MASTER_HASH);
                localStorage.setItem('nylo-skip-name', '1');
                localStorage.setItem('nylo-player-name', 'Nylo');
              } catch (e) {}
            }
            var LAB = { hash: 'c57025ae9174f33c56f41db133f1b855c82502a687de8eddcb9e1d6fa491bdfb', key: 'nylo-tambu-unlocked' };

            var app = document.getElementById('app');

            function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
            function sha256(s) {
                return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)).then(function (b) {
                    return Array.prototype.map.call(new Uint8Array(b), function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
                });
            }
            function isOpen(g) { try { return localStorage.getItem(g.key) === g.hash; } catch (e) { return false; } }
            function remember(g) { try { localStorage.setItem(g.key, g.hash); } catch (e) {} }
            function playerName() { try { return localStorage.getItem('nylo-player-name') || ''; } catch (e) { return ''; } }

            // ----- schede -----
            var CARD = 'group relative flex items-center gap-4 rounded-2xl border border-slate-700/50 bg-white/[0.04] p-4 sm:p-5 text-left transition-colors ';
            var CARD_LINK = CARD + 'hover:border-teal-500/60 hover:bg-white/[0.07]';
            var CARD_OFF = CARD + 'cursor-not-allowed opacity-60';

            function icon(name) {
                return '<span class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-teal-500/15 text-2xl text-teal-400"><i class="ph-fill ph-' + name + '"></i></span>';
            }
            function badgeText(t, cls) {
                return '<span class="rounded border px-1.5 py-0.5 text-[10px] font-semibold uppercase tracking-wide ' + (cls || 'border-amber-500/60 text-amber-400') + '">' + esc(t) + '</span>';
            }
            function body(item) {
                return '<span class="min-w-0 flex-1"><span class="block text-base font-semibold text-slate-100">' + esc(item.title) + '</span>' +
                    '<span class="mt-0.5 block text-sm text-slate-400">' + esc(item.desc) + '</span></span>';
            }
            function topBadges(item) {
                var b = '';
                if (item.badgeIcon) b += '<span class="flex h-6 w-6 items-center justify-center rounded-full border border-amber-500/60 bg-[#0a0c10] text-sm text-amber-400" title="Area protetta"><i class="ph-fill ph-' + item.badgeIcon + '"></i></span>';
                if (item.badge) b += badgeText(item.badge);
                if (item.soon) b += badgeText('In arrivo', 'border-slate-600 text-slate-400');
                return b ? '<span class="absolute right-3 top-3 flex items-center gap-1.5">' + b + '</span>' : '';
            }

            function card(item) {
                if (item.soon) return '<div class="' + CARD_OFF + '" title="In arrivo">' + icon(item.icon) + body(item) + topBadges(item) + '</div>';
                if (item.links) {
                    return '<div class="' + CARD + 'flex-col !items-stretch sm:flex-row sm:!items-center">' +
                        '<div class="flex min-w-0 flex-1 items-center gap-4">' + icon(item.icon) + body(item) + '</div>' +
                        '<div class="flex flex-wrap gap-2">' + item.links.map(function (l) {
                            return '<a href="' + l.href + '" class="rounded-lg border border-slate-600 px-3 py-1.5 text-sm font-medium text-slate-200 transition-colors hover:border-teal-500 hover:bg-teal-600 hover:text-white">' + esc(l.label) + '</a>';
                        }).join('') + '</div>' + topBadges(item) + '</div>';
                }
                if (item.href) return '<a href="' + item.href + '" class="' + CARD_LINK + '">' + icon(item.icon) + body(item) + topBadges(item) + '</a>';
                // scheda che apre una vista figlia
                return '<button type="button" data-view="' + item.id + '" class="' + CARD_LINK + 'w-full">' + icon(item.icon) + body(item) + topBadges(item) + '</button>';
            }

            // ----- viste -----
            function renderHome() {
                var name = playerName() || 'Utente';
                app.innerHTML =
                    '<div class="mb-6 flex items-center gap-3 sm:mb-8"><h1 class="text-2xl font-bold tracking-tight sm:text-3xl">Nylo HomePage</h1>' +
                    (isOpen(GATE) ? '<span class="relative ml-auto inline-flex"><button type="button" data-user aria-label="Account: ' + esc(name) + '" title="' + esc(name) + '" aria-haspopup="menu" aria-expanded="false" aria-controls="userMenu" class="flex h-10 w-10 items-center justify-center rounded-full text-xl text-slate-400 transition-colors hover:bg-white/5 hover:text-teal-300"><i class="ph-fill ph-user-list"></i></button><div id="userMenu" data-user-menu hidden role="menu" class="absolute right-0 top-full z-20 mt-2 min-w-56 rounded-lg border border-slate-700 bg-[#101820] p-3 text-sm text-slate-100 shadow-xl"><p class="mb-3 whitespace-nowrap">Sei connesso come <strong>' + esc(name) + '</strong></p><button type="button" data-logout role="menuitem" class="w-full rounded-md px-2 py-2 text-left text-slate-300 hover:bg-white/5 hover:text-white">Esci</button></div></span>' : '') + '</div>' +
                    '<div class="grid gap-3 sm:grid-cols-2 sm:gap-4 [&>*]:min-h-[96px]">' + HOME.map(card).join('') + '</div>';
            }
            function renderSection(sec) {
                app.innerHTML =
                    '<button type="button" data-view="home" class="mb-4 inline-flex items-center gap-1.5 self-start text-sm text-slate-400 hover:text-slate-200"><i class="ph-fill ph-arrow-left"></i>Home</button>' +
                    '<h1 class="mb-6 flex items-center gap-3 text-2xl font-bold tracking-tight sm:mb-8 sm:text-3xl">' + esc(sec.title) + '</h1>' +
                    '<div class="grid gap-3 sm:gap-4">' + sec.children.map(card).join('') + '</div>';
            }

            function show(id) {
                var sec = HOME.filter(function (s) { return s.id === id && s.children; })[0];
                if (sec && sec.locked && !isOpen(LAB)) { openLab(id); return false; }
                if (sec) renderSection(sec); else renderHome();
                window.scrollTo(0, 0);
                return true;
            }
            function go(id) {
                if (!show(id)) return;
                if (location.hash !== (id === 'home' ? '' : '#' + id)) history.pushState(null, '', id === 'home' ? location.pathname : '#' + id);
            }
            app.addEventListener('click', function (e) {
                if (e.target.closest('[data-logout]')) { logout(); return; }
                var userButton = e.target.closest('[data-user]');
                if (userButton) {
                    var tip = userButton.parentElement.querySelector('[data-user-menu]');
                    tip.hidden = !tip.hidden;
                    userButton.setAttribute('aria-expanded', tip.hidden ? 'false' : 'true');
                    return;
                }
                var openTip = app.querySelector('[data-user-menu]:not([hidden])');
                if (openTip) {
                    openTip.hidden = true;
                    openTip.parentElement.querySelector('[data-user]').setAttribute('aria-expanded', 'false');
                }
                var b = e.target.closest('[data-view]');
                if (b) go(b.getAttribute('data-view'));
            });
            window.addEventListener('popstate', function () { show(location.hash.slice(1) || 'home'); });
            document.addEventListener('keydown', function (e) {
                if (e.key !== 'Escape') return;
                var menu = app.querySelector('[data-user-menu]:not([hidden])');
                if (!menu) return;
                menu.hidden = true;
                menu.parentElement.querySelector('[data-user]').setAttribute('aria-expanded', 'false');
            });

            // esce: cancella tutti gli accessi (home, Lab, admin collection, nome automatico) e richiede di nuovo il codice
            function logout() {
                try {
                    ['nylo-unlocked', 'nylo-tambu-unlocked', 'nylo-admin', 'nylo-skip-name'].forEach(function (k) { localStorage.removeItem(k); });
                    sessionStorage.removeItem('trick-auth-session');
                } catch (e) {}
                if (location.hash) history.replaceState(null, '', location.pathname);
                renderHome();
                document.body.classList.add('locked');
                app.setAttribute('aria-hidden', 'true');
                gate.hidden = false;
                gateErr.hidden = true; gateInput.value = '';
                gateInput.focus();
            }

            // ----- accesso principale -----
            var gate = document.getElementById('gate');
            var gateForm = document.getElementById('gateForm');
            var gateInput = document.getElementById('gateInput');
            var gateErr = document.getElementById('gateErr');
            var nameGate = document.getElementById('nameGate');
            var nameForm = document.getElementById('nameForm');
            var nameInput = document.getElementById('nameInput');

            function askPlayerName() {
                nameInput.value = playerName();
                nameGate.hidden = false;
                app.setAttribute('aria-hidden', 'true');
                document.body.classList.add('locked');
                nameInput.focus();
                nameInput.select();
            }
            nameForm.addEventListener('submit', function (e) {
                e.preventDefault();
                var value = nameInput.value.trim().slice(0, 16);
                if (!value) return;
                try {
                    localStorage.setItem('nylo-player-name', value);
                    localStorage.setItem('nylo-skip-name', '1');
                } catch (x) {}
                nameGate.hidden = true;
                app.removeAttribute('aria-hidden');
                document.body.classList.remove('locked');
                renderHome();
            });

            function unlockHome(askName) {
                document.body.classList.remove('locked');
                gate.hidden = true;
                app.removeAttribute('aria-hidden');
                show(location.hash.slice(1) || 'home');
                if (askName || !playerName()) askPlayerName();
            }
            if (isOpen(GATE)) {
                unlockHome();
            } else {
                app.setAttribute('aria-hidden', 'true');
                renderHome();
                gateInput.focus();
            }
            gateForm.addEventListener('submit', function (e) {
                e.preventDefault();
                sha256(gateInput.value).then(function (h) {
                    if (h === GATE.hash) { remember(GATE); unlockHome(true); }
                    else if (h === MASTER_HASH) { masterUnlock(); unlockHome(true); }
                    else { gateErr.hidden = false; gateInput.select(); }
                });
            });

            // ----- accesso area Lab -----
            var labGate = document.getElementById('labGate');
            var labForm = document.getElementById('labForm');
            var labInput = document.getElementById('labInput');
            var labErr = document.getElementById('labErr');
            var labTarget = null;

            function openLab(id) {
                labTarget = id;
                labErr.hidden = true; labInput.value = '';
                labGate.hidden = false; app.setAttribute('aria-hidden', 'true');
                document.body.classList.add('locked');
                labInput.focus();
            }
            function closeLab() {
                labGate.hidden = true; app.removeAttribute('aria-hidden');
                document.body.classList.remove('locked');
                // se si arrivava da un link diretto (#lab) senza sblocco, torna alla home
                if (location.hash === '#lab' && !isOpen(LAB)) { history.replaceState(null, '', location.pathname); renderHome(); }
            }
            labForm.addEventListener('submit', function (e) {
                e.preventDefault();
                sha256(labInput.value).then(function (h) {
                    if (h === LAB.hash) { remember(LAB); closeLab(); go(labTarget); }
                    else if (h === MASTER_HASH) { masterUnlock(); closeLab(); go(labTarget); }
                    else { labErr.hidden = false; labInput.select(); }
                });
            });
            document.getElementById('labCancel').addEventListener('click', closeLab);
            document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !labGate.hidden) closeLab(); });
        })();
    </script>

</body>
</html>
