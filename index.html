<!DOCTYPE html>
<html lang="it" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nylo HomePage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="h-full flex items-center justify-center m-0 bg-gradient-to-b from-[#142b34] to-[#0e1e25] text-slate-100 p-4">

    <main class="text-center">
        <!-- Glow accent background blur -->
        <div class="relative group">
            <div class="absolute -inset-1 bg-gradient-to-r from-emerald-500 to-teal-400 rounded-2xl blur-lg opacity-30 group-hover:opacity-75 transition duration-500 group-hover:duration-200"></div>
            
            <!-- Main Styled Button / Link -->
            <a href="/trick-taking.html" 
               class="relative inline-flex items-center justify-center gap-3 px-8 py-4 text-lg font-semibold text-white bg-slate-900/80 backdrop-blur-md rounded-xl border border-slate-700/50 shadow-2xl hover:bg-slate-800/90 hover:border-teal-500/50 hover:scale-[1.03] active:scale-[0.98] transition-all duration-300 group">
                
                <!-- Playing Card Icon (SVG) -->
                <svg class="w-6 h-6 text-teal-400 group-hover:rotate-12 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                </svg>

                <span>My Trick-taking collection</span>

                <!-- Arrow Icon (SVG) -->
                <svg style="display:none;" class="w-5 h-5 text-slate-400 group-hover:translate-x-1 group-hover:text-teal-400 transition-all duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                </svg>
            </a>
        </div>

        <a href="/gcp.html" >Gachapon Trick Counter</a>
    </main>

</body>
</html>
