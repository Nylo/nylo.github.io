<!DOCTYPE html>
<html lang="it" class="h-full">
<head>
<script src="/auth-gate.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trick-taking online, a stanze</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body{font-family:'Inter',sans-serif}</style>
</head>
<body class="min-h-full m-0 bg-slate-900 text-slate-100">
    <main class="mx-auto max-w-4xl px-4 py-10">
        <h1 class="text-2xl font-bold">Trick-taking online, a stanze</h1>
        <p class="mt-1 text-sm text-slate-400">Gioca con altre persone creando o entrando in una stanza.</p>
        <div id="games" class="mt-8 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
    </main>
    <script>
        var GAMES = [
                {
                        "name": "Spy Team",
                        "desc": "4 giocatori online, a stanze: squadre assegnate a sorte.",
                        "href": "/spy-team-online.html"
                },
                {
                        "name": "6 Forces",
                        "desc": "Versione online a stanze.",
                        "href": null,
                        "badge": "WIP"
                },
                {
                        "name": "Charms",
                        "desc": "Versione online a stanze.",
                        "href": null,
                        "badge": "WIP"
                },
                {
                        "name": "Quashars",
                        "desc": "Versione online a stanze.",
                        "href": null,
                        "badge": "WIP"
                },
                {
                        "name": "American Bookshop",
                        "desc": "Versione online a stanze.",
                        "href": null,
                        "badge": "WIP"
                },
                    {
                        "name": "Don't Take Me!!!",
                        "desc": "Versione online a stanze.",
                        "href": null,
                        "badge": "WIP"
                    },
                    {
                        "name": "My Own Sunny Day",
                        "desc": "Versione online a stanze.",
                        "href": null,
                        "badge": "WIP"
                    }
        ];
        function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
        document.getElementById('games').innerHTML = GAMES.map(function (g) {
            var inner = '<div class="flex items-start justify-between gap-2"><h2 class="text-lg font-semibold">' + esc(g.name) + '</h2>' +
                (g.badge ? '<span class="rounded border border-amber-500/60 px-1.5 py-0.5 text-[10px] font-semibold uppercase tracking-wide text-amber-400">' + esc(g.badge) + '</span>' : '') + '</div>' +
                '<p class="mt-2 text-sm text-slate-400">' + esc(g.desc) + '</p>';
            if (!g.href) return '<div class="rounded-xl border border-slate-700/50 bg-slate-900/40 p-5 opacity-50 cursor-not-allowed" aria-disabled="true">' + inner + '</div>';
            return '<a href="' + g.href + '" class="block rounded-xl border border-slate-700/50 bg-slate-900/80 p-5 transition-colors hover:border-teal-500/60 hover:bg-slate-800/90">' + inner + '</a>';
        }).join('');
    </script>
</body>
</html>
