*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  color-scheme:light;
  --bg:#ffffff; --panel:#f4f6fa; --panel2:#e8ecf3; --field:#ffffff; --surface-raised:#e8ecf3;
  --text:#1c2431; --text-soft:#576377; --soft:#576377; --line:rgba(20,30,50,.16); --border:rgba(20,30,50,.28); --accent:#6a3fb8; --accent-on:#fff;
  --shadow:0 1px 3px rgba(20,30,50,.12);
  --k-any:#8a5fd6; --k-any-t:#6a3fb8; --k-any-on:#fff;
  --k-les:#3f7fd1; --k-les-t:#2a62ad; --k-les-on:#fff;
  --k-tre:#e6c02e; --k-tre-t:#8a6a00; --k-tre-on:#1b1400;
  --k-all:#6a3fb8; --k-all-t:#6a3fb8; --k-all-on:#fff;
  --tint:10%;
  --c-rosso:#e0555e; --c-arancio:#f19a3e; --c-verde:#58b368; --c-blu:#5aa2e6; --c-viola:#a173d6;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1720; --panel:rgba(255,255,255,.06); --panel2:rgba(255,255,255,.1); --field:#17212d; --surface-raised:rgba(255,255,255,.1);
  --text:#ecf0f6; --text-soft:#a3b0c4; --soft:#a3b0c4; --line:rgba(255,255,255,.14); --border:rgba(255,255,255,.22); --accent:#b9a2e0; --accent-on:#0b1020;
  --shadow:0 2px 10px rgba(0,0,0,.45);
  --k-any:#a98be0; --k-any-t:#c4b0ee; --k-any-on:#0b1020;
  --k-les:#5aa2e6; --k-les-t:#86bdf0; --k-les-on:#0b1020;
  --k-tre:#e2c25a; --k-tre-t:#ecd27a; --k-tre-on:#1b1400;
  --k-all:#b9a2e0; --k-all-t:#b9a2e0; --k-all-on:#0b1020;
  --tint:14%;
}
html,body{min-height:100%}
body{font-family:'Inter',sans-serif;font-size:15px;color:var(--text);background-color:var(--bg)}
:root[data-theme="dark"] body{background:radial-gradient(ellipse at 50% 0%,#1d3a4a 0%,#0f1720 70%) fixed;background-color:var(--bg)}
.app{max-width:1100px;margin:0 auto;padding:6px 12px 36px}
.topbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;padding:10px 0 4px}
.topnav{display:flex;gap:8px;align-items:center;margin-left:auto}
.brand{display:flex;align-items:center;gap:12px;flex:1 1 220px;min-width:0}
.brand img{width:54px;height:54px;border-radius:12px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);flex-shrink:0}
.title{font-family:'Cinzel',serif;font-weight:800;font-size:22px;letter-spacing:.04em;line-height:1.1}
.title span{color:var(--accent)}
.sub{font-size:12px;color:var(--soft);margin:2px 0 0;font-family:'Inter',sans-serif;font-weight:500;letter-spacing:0}
.theme-sw{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--text-soft);font:500 14px 'Inter',sans-serif;cursor:pointer;padding:2px}
.theme-sw .track{position:relative;width:44px;height:24px;border-radius:999px;background:var(--panel2);border:1px solid var(--border);transition:background .15s}
.theme-sw .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--accent);color:var(--accent-on);display:flex;align-items:center;justify-content:center;font-size:11px;transition:transform .15s}
:root[data-theme="dark"] .theme-sw .knob{transform:translateX(20px)}
.theme-sw:focus-visible .track{outline:2px solid var(--accent);outline-offset:2px}
details.filters{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:10px 0 14px 0}
details.filters>summary{cursor:pointer;list-style:none;padding:9px 14px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px}
details.filters>summary::-webkit-details-marker{display:none}
details.filters>summary .cnt{margin-left:auto;color:var(--soft);font-weight:500}
.tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:4px 12px 10px}
.tab{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.tab i{font-size:16px;color:var(--kt)}
.tab small{color:var(--soft);font-weight:500;font-size:12px}
.tab:hover{background:var(--panel2)}
.tab.on{background:var(--kc);border-color:var(--kc);color:var(--ko)}
.tab.on i,.tab.on small{color:var(--ko)}
.tab.on small{opacity:.8}
.filter-bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:4px 12px 12px}
.filter-bar label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--soft);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.filter-bar select,.filter-bar input{min-width:140px;max-width:200px;background:var(--field);color:var(--text);border:1px solid var(--border);border-radius:7px;padding:8px 10px;font:inherit;font-size:14px;text-transform:none;letter-spacing:0}
.filter-bar .reset{align-self:flex-end;background:transparent;color:var(--accent);border:1px solid var(--border);border-radius:7px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer}
.alpha-wrap{padding:0 8px 10px}
.alpha{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;padding:2px 4px}
.alpha button{flex-shrink:0;min-width:32px;height:32px;border:0;border-radius:6px;background:transparent;color:var(--text);font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.alpha button:hover{background:var(--panel2)}
.alpha button.on{background:var(--accent);color:var(--accent-on)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:8px;min-width:0;padding:12px 14px 12px;background:var(--panel);background:color-mix(in srgb,var(--kc) var(--tint),var(--bg));border:1px solid var(--line);border:1px solid color-mix(in srgb,var(--kc) 45%,transparent);border-left:6px solid var(--kc);border-radius:10px;scroll-margin-top:10px;box-shadow:var(--shadow)}
.card.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%{outline:3px solid var(--accent)}100%{outline:3px solid transparent}}
.chead{display:flex;align-items:flex-start;gap:8px}
.cname{flex:1;min-width:0;font-size:17px;font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.cnum{flex-shrink:0;font-size:12px;font-weight:700;color:var(--soft);border:1px solid var(--line);border:1px solid color-mix(in srgb,var(--kc) 35%,transparent);background:transparent;border-radius:6px;padding:2px 7px}
.desc{padding:0;background:transparent;border:0;line-height:1.5;font-size:14px;flex:1}
.note{display:flex;gap:6px;align-items:flex-start;font-size:12.5px;color:var(--soft);line-height:1.45}
.note i{margin-top:2px;flex-shrink:0;color:var(--kt)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--soft);white-space:nowrap}
.chip.kind{border-color:var(--kc);color:var(--kt)}
.cc{font-weight:700;padding:0 4px;border-radius:4px;color:#0b1020;white-space:nowrap}
.cc.rosso{background:var(--c-rosso)}.cc.arancio{background:var(--c-arancio)}.cc.verde{background:var(--c-verde)}.cc.blu{background:var(--c-blu)}.cc.viola{background:var(--c-viola)}
.empty{text-align:center;color:var(--soft);padding:40px 10px}
.footer{text-align:center;color:var(--soft);font-size:12px;margin-top:22px;line-height:1.6}
@media(max-width:600px){
  .title{font-size:17px}
  .brand img{width:44px;height:44px}
  .filter-bar select,.filter-bar input{min-width:0;max-width:none;width:100%}
  .filter-bar label{flex:1 1 40%}
}
</style>

i.","","B",""],["T",109,"Strange Jewelry","Prendi qualsiasi Tesoro Piccolo o paga 1 Pesce per prendere 2 Tesori comuni qualsiasi","","B",""]];
const CARDS = DATA.map(r=>({k:r[0],num:r[1],n:r[2],x:r[3],o:r[4],s:r[5],m:r[6]}));

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const letterOf = n => { const ch=n.normalize('NFD').replace(/[̀-ͯ]/g,'')[0].toUpperCase(); return /[A-Z]/.test(ch)?ch:'#'; };
CARDS.forEach(c=>{ c.L=letterOf(c.n); c.lesson=(c.k==='L'||c.k==='P'); });
const byName = (a,b)=>a.n.localeCompare(b.n,'it',{sensitivity:'base'})||a.num-b.num;
CARDS.sort(byName);

const F = {kind:'',s:'',m:'',pub:'',q:'',sort:'n'};
let list = CARDS.slice();

// tab: Tutte / Anytime / Lesson (personali + Public) / Treasure
const TABS = [{id:'',n:'Tutte',i:'cards',v:'all'},{id:'A',n:'Anytime',i:'lightning',v:'any'},{id:'LP',n:'Lesson',i:'graduation-cap',v:'les'},{id:'T',n:'Treasure',i:'diamond',v:'tre'}];
const inTab = (c,t)=> !t || (t==='LP' ? c.lesson : c.k===t);

function fillSelects(){
  $('fSet').innerHTML += Object.keys(SETS).map(k=>`<option value="${k}">${SETS[k]}</option>`).join('');
  const mods=[...new Set(CARDS.map(c=>c.m).filter(Boolean))].sort();
  $('fMod').innerHTML += '<option value="-">Base</option>' + mods.map(m=>`<option value="${m}">Modulo ${m}</option>`).join('');
}
function renderTabs(){
  $('tabs').innerHTML = TABS.map(t=>`<button type="button" class="tab ${F.kind===t.id?'on':''}" data-tab="${t.id}" style="${kvars(t.v)}"><i class="ph ph-${t.i}"></i>${t.n} <small>${CARDS.filter(c=>inTab(c,t.id)).length}</small></button>`).join('');
}
function matches(c){
  const q=F.q.trim().toLowerCase();
  return inTab(c,F.kind)
    && (!F.s||c.s===F.s)
    && (!F.m||(F.m==='-'?!c.m:c.m===F.m))
    && (!F.pub||c.k===F.pub)
    && (!q||c.n.toLowerCase().includes(q)||c.x.toLowerCase().includes(q)||c.o.toLowerCase().includes(q)||String(c.num)===q);
}
function applyFilter(){
  list=CARDS.filter(matches);
  list.sort(F.sort==='num'?(a,b)=>a.num-b.num:byName);
  render();
}
function hl(txt){
  return esc(txt).replace(/\b(rossi|rosso|arancio|verdi|verde|blu|viola)\b/gi,(m)=>{
    const k={rossi:'rosso',rosso:'rosso',arancio:'arancio',verdi:'verde',verde:'verde',blu:'blu',viola:'viola'}[m.toLowerCase()];
    return `<span class="cc ${k}">${m}</span>`;
  });
}
function renderAlpha(){
  const bar=$('alpha');
  if(F.sort!=='n'){ bar.innerHTML=''; return; }
  const letters=[...new Set(list.map(c=>c.L))];
  bar.innerHTML=letters.map(l=>`<button type="button" data-l="${l}">${l}</button>`).join('');
}
function cardHtml(c){
  const K=KINDS[c.k];
  const note=c.o?`<div class="note"><i class="ph ph-info"></i><span>${hl(c.o)}</span></div>`:'';
  const mod=c.m?`<span class="chip"><i class="ph ph-squares-four"></i>Modulo ${c.m}</span>`:(c.lesson?'<span class="chip"><i class="ph ph-squares-four"></i>Modulo Base</span>':'');
  return `<article class="card" style="${kvars(K.v)}" data-l="${c.L}" data-num="${c.num}">
    <div class="chead"><div class="cname">${esc(c.n)}</div><div class="cnum" title="Numero della carta">N° ${c.num}</div></div>
    <div class="desc">${hl(c.x)}</div>
    ${note}
    <div class="chips"><span class="chip kind"><i class="ph ph-${K.i}"></i>${K.n}</span><span class="chip"><i class="ph ph-package"></i>${SETS[c.s]}</span>${mod}</div>
  </article>`;
}
function render(){
  $('cnt').textContent=list.length+' / '+CARDS.length+' carte';
  renderTabs(); renderAlpha();
  $('main').innerHTML=list.length?`<div class="grid">${list.map(cardHtml).join('')}</div>`:'<div class="empty">Nessuna carta corrisponde ai filtri.</div>';
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.tab!==undefined){ F.kind=b.dataset.tab; if(F.kind&&F.kind!=='LP') F.pub=''; $('fPub').value=F.pub; applyFilter(); }
  else if(b.dataset.l){ const el=document.querySelector('.card[data-l="'+b.dataset.l+'"]'); if(el){ el.scrollIntoView({behavior:'smooth',block:'start'}); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); } }
});
$('fSet').onchange=e=>{ F.s=e.target.value; applyFilter(); };
$('fMod').onchange=e=>{ F.m=e.target.value; applyFilter(); };
$('fPub').onchange=e=>{ F.pub=e.target.value; if(F.pub&&F.kind&&F.kind!=='LP') F.kind='LP'; applyFilter(); };
$('fSort').onchange=e=>{ F.sort=e.target.value; applyFilter(); };
$('fQ').oninput=e=>{ F.q=e.target.value; applyFilter(); };
$('fReset').onclick=()=>{ F.kind=F.s=F.m=F.pub=F.q=''; F.sort='n'; $('fSet').value=$('fMod').value=$('fPub').value=$('fQ').value=''; $('fSort').value='n'; applyFilter(); };

function setTheme(dark,save){
  if(dark) document.documentElement.setAttribute('data-theme','dark'); else document.documentElement.removeAttribute('data-theme');
  $('themeSw').setAttribute('aria-checked',dark?'true':'false');
  const m=document.querySelector('meta[name="theme-color"]'); if(m) m.content=dark?'#0f1720':'#ffffff';
  if(save){ try{ localStorage.setItem('ioc-theme',dark?'dark':'light'); }catch(e){} }
}
$('themeSw').onclick=()=>setTheme(document.documentElement.getAttribute('data-theme')!=='dark',true);
setTheme(document.documentElement.getAttribute('data-theme')==='dark',false);

fillSelects();
applyFilter();
</script>
