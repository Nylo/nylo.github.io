<!DOCTYPE html>
<html lang="it" class="h-full">
<head>
<script src="/auth-gate.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Non-trick-taking online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body{font-family:'Inter',sans-serif}
    p.mt-2.text-sm.text-slate-400{display:none}</style>
</head>
<body class="min-h-full m-0 bg-[#0a0c10] text-slate-100">
    <main class="mx-auto max-w-7xl px-4 py-10">
        <a href="/#online" class="mb-4 inline-flex items-center gap-1.5 text-sm text-slate-400 hover:text-slate-200"><i class="ph-fill ph-arrow-left"></i>Indietro</a>
        <h1 class="text-2xl font-bold">Non-trick-taking online</h1>
        <p class="mt-1 text-sm text-slate-400">Altri giochi da tavolo, senza prese: scegli il gioco e sfida l'AI.</p>
                <div class="mt-8 overflow-x-auto rounded-xl border border-slate-700/60">
                        <table class="w-full min-w-[360px] border-collapse text-left text-sm">
                                <thead class="bg-white/[0.05] text-xs uppercase tracking-wide text-slate-400">
                                        <tr><th scope="col" class="px-4 py-3">Titolo</th><th scope="col" class="w-px whitespace-nowrap px-3 py-3" title="N. giocatori" aria-label="N. giocatori"><i class="ph-fill ph-users text-slate-500" aria-hidden="true"></i></th><th scope="col" colspan="3" class="w-px whitespace-nowrap px-3 py-3 text-right"></th></tr>
                                </thead>
                                <tbody id="games" class="divide-y divide-slate-800"></tbody>
                        </table>
                </div>
    </main>
    <script>
        // ai = pagina contro l'AI; online = pagina "a stanze" (null finché non esiste/funziona)
        var GAMES = [
        {
                "name": "Eggs of Ostrich",
                "players": "3",
                "desc": "Raccogli uova di struzzo nei 4 sacchi senza romperli: carte richiesta giocate in segreto, uova divise tra chi le vuole. Da soli con SKIP si prende l'ambra.",
                "ai": "/ntt/eggs-of-ostrich/",
                "online": null,
                "beta": true,
                "badge": "New"
        }
];
        function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
        GAMES.sort(function (a, b) { return a.name.localeCompare(b.name, 'it', { sensitivity: 'base' }); });
                var BADGE_STYLE = {
                        beta: 'border-amber-500/60 bg-amber-500/10 text-amber-300',
                        new: 'border-sky-500/60 bg-sky-500/10 text-sky-300',
                        updated: 'border-emerald-500/60 bg-emerald-500/10 text-emerald-300'
                };
                function badge(label, style) {
                        return '<span class="inline-flex rounded border px-1.5 py-0.5 text-[10px] font-semibold uppercase tracking-wide ' + style + '">' + label + '</span>';
                }
                // colonna di sinistra: New / Updated
                function stateBadge(g) {
                        var state = String(g.badge || '').toLowerCase();
                        return state === 'new' || state === 'updated' ? badge(state === 'new' ? 'New' : 'UPD', BADGE_STYLE[state]) : '';
                }
                // colonna di destra: Beta (sempre a destra, qualunque altro badge ci sia)
                function betaBadge(g) {
                        return Boolean(g.beta) || String(g.badge || '').toLowerCase() === 'beta' ? badge('Beta', BADGE_STYLE.beta) : '';
                }
                var games = document.getElementById('games');
                // preferiti: per utente (nome giocatore salvato nel browser), in cima, poi ordine per nome (stessa chiave di /tt/)
                function favKey() {
                        var n = '';
                        try { n = localStorage.getItem('nylo-player-name') || ''; } catch (e) {}
                        return 'nylo-tt-fav:' + (n.trim().toLowerCase() || 'ospite');
                }
                function loadFavs() {
                        try { return JSON.parse(localStorage.getItem(favKey()) || '[]'); } catch (e) { return []; }
                }
                function toggleFav(name) {
                        var f = loadFavs(), i = f.indexOf(name);
                        if (i >= 0) f.splice(i, 1); else f.push(name);
                        try { localStorage.setItem(favKey(), JSON.stringify(f)); } catch (e) {}
                }

                // statistiche personali (scritte da /home-btn.js nelle pagine di gioco): chiave nylo-stats:<nome>, per gioco e modalità
                function loadStats(g) {
                        try { var d = JSON.parse(localStorage.getItem(favKey().replace('nylo-tt-fav:', 'nylo-stats:')) || '{}'); return d[g.ai] || {}; } catch (e) { return {}; }
                }
                function statsBtn(g) {
                        return '<button type="button" data-stats="' + esc(g.name) + '" title="Statistiche" aria-label="Statistiche: ' + esc(g.name) + '" class="inline-flex h-8 w-8 items-center justify-center rounded-md text-lg text-slate-500 transition-colors hover:bg-white/10 hover:text-slate-200"><i class="ph ph-chart-bar" aria-hidden="true"></i></button>';
                }
                function pct(n, tot) { return tot ? Math.round(n * 100 / tot) : 0; }
                function statSection(label, s) {
                        s = s || { p: 0, a: 0, w: 0, l: 0 };
                        var pw = pct(s.w, s.p), pl = pct(s.l, s.p);
                        function row(k, v) { return '<div class="flex justify-between py-1"><dt class="text-slate-400">' + k + '</dt><dd class="font-semibold tabular-nums">' + v + '</dd></div>'; }
                        function bar(k, v, color) { return '<div class="py-1"><div class="flex justify-between"><span class="text-slate-400">' + k + '</span><span class="font-semibold tabular-nums">' + v + '%</span></div><div class="mt-1 h-1.5 overflow-hidden rounded bg-white/10"><div class="h-full rounded ' + color + '" style="width:' + v + '%"></div></div></div>'; }
                        return '<section class="mt-4"><h3 class="text-xs font-semibold uppercase tracking-wide text-slate-400">' + label + '</h3><dl class="mt-1 divide-y divide-slate-800 text-sm">' +
                                row('Partite giocate', s.p) + row('Partite abbandonate', s.a) + row('Vinte', s.w) + row('Perse', s.l) + '</dl>' +
                                '<div class="text-sm">' + bar('% vinte', pw, 'bg-emerald-500') + bar('% perse', pl, 'bg-rose-500') + '</div></section>';
                }
                function openStats(name) {
                        var g = GAMES.filter(function (x) { return x.name === name; })[0]; if (!g) return;
                        var st = loadStats(g), n = '';
                        try { n = localStorage.getItem('nylo-player-name') || ''; } catch (e) {}
                        var ov = document.getElementById('statsModal');
                        if (!ov) { ov = document.createElement('div'); ov.id = 'statsModal'; document.body.appendChild(ov); }
                        ov.className = 'fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4';
                        ov.innerHTML = '<div role="dialog" aria-modal="true" aria-label="Statistiche" class="max-h-full w-full max-w-sm overflow-y-auto rounded-xl border border-slate-700 bg-slate-900 p-5 text-slate-100 shadow-2xl">' +
                                '<div class="flex items-start justify-between gap-3"><div><div class="text-lg font-bold">' + esc(g.name) + '</div><div class="text-xs text-slate-400">Statistiche di ' + esc(n || 'ospite') + '</div></div>' +
                                '<button type="button" data-close="1" aria-label="Chiudi" class="rounded-md p-1 text-slate-400 hover:bg-white/10 hover:text-slate-100"><i class="ph ph-x text-lg" aria-hidden="true"></i></button></div>' +
                                statSection('Contro l\'AI', st.ai) + (st.friends ? statSection('Contro gli amici', st.friends) : '') +
                                '<p class="mt-4 text-[11px] leading-snug text-slate-500">Vinte e perse contano le partite concluse (una vittoria condivisa vale come vinta). Le statistiche sono salvate su questo browser dall\'ultimo aggiornamento.</p></div>';
                        ov.onclick = function (e) { if (e.target === ov || e.target.closest('[data-close]')) ov.remove(); };
                        document.onkeydown = function (e) { if (e.key === 'Escape' && document.getElementById('statsModal')) document.getElementById('statsModal').remove(); };
                        ov.querySelector('[data-close]').focus();
                }
                function favBtn(g, on) {
                        return '<button type="button" data-fav="' + esc(g.name) + '" aria-pressed="' + on + '" title="' + (on ? 'Rimuovi dai preferiti' : 'Aggiungi ai preferiti') + '" aria-label="' + (on ? 'Rimuovi dai preferiti: ' : 'Aggiungi ai preferiti: ') + esc(g.name) + '" class="inline-flex h-8 w-8 items-center justify-center rounded-md text-lg transition-colors hover:bg-white/10 ' + (on ? 'text-amber-300' : 'text-slate-500 hover:text-slate-200') + '"><i class="' + (on ? 'ph-fill' : 'ph') + ' ph-bookmark-simple" aria-hidden="true"></i></button>';
                }
                function show() {
                var favs = loadFavs();
                var list = GAMES.filter(function (g) { return favs.indexOf(g.name) >= 0; }).concat(GAMES.filter(function (g) { return favs.indexOf(g.name) < 0; }));
                games.innerHTML = list.map(function (g) {
                        var on = favs.indexOf(g.name) >= 0;
                        return '<tr data-href="' + esc(g.ai) + '" tabindex="0" aria-label="Apri ' + esc(g.name) + '" class="cursor-pointer transition-colors hover:bg-white/[0.04] focus-visible:outline focus-visible:outline-2 focus-visible:outline-teal-500">' +
                                '<th scope="row" class="px-4 py-3 font-semibold text-slate-100"><a href="' + esc(g.ai) + '" class="hover:text-teal-300">' + esc(g.name) + '</a></th>' +
                                '<td class="w-px whitespace-nowrap px-3 py-3 text-slate-300">' + esc(g.players) + '</td>' +
                                '<td class="w-px whitespace-nowrap pl-3 pr-1 py-3 text-right">' + stateBadge(g) + '</td>' +
                                '<td class="w-px whitespace-nowrap pl-1 pr-2 py-3 text-right">' + betaBadge(g) + '</td>' +
                                '<td class="w-px whitespace-nowrap pl-1 pr-3 py-2 text-right">' + statsBtn(g) + favBtn(g, on) + '</td></tr>';
        }).join('');
                }
                show();
                games.addEventListener('click', function (e) {
                        var sb = e.target.closest('button[data-stats]');
                        if (sb) { openStats(sb.getAttribute('data-stats')); return; }
                        var fb = e.target.closest('button[data-fav]');
                        if (fb) { toggleFav(fb.getAttribute('data-fav')); show(); return; }
                        var row = e.target.closest('tr[data-href]');
                        if (row && !e.target.closest('a')) location.href = row.getAttribute('data-href');
                });
                games.addEventListener('keydown', function (e) {
                        if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr[data-href]')) {
                                e.preventDefault(); location.href = e.target.getAttribute('data-href');
                        }
                });
    </script>
</body>
</html>
