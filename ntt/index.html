<!DOCTYPE html>
<html lang="it" class="h-full">
<head>
<script src="/auth-gate.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Non-trick-taking online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body{font-family:'Inter',sans-serif}
    p.mt-2.text-sm.text-slate-400{display:none}</style>
</head>
<body class="min-h-full m-0 bg-[#0a0c10] text-slate-100">
    <main class="mx-auto max-w-7xl px-4 py-10">
        <a href="/#online" class="mb-4 inline-flex items-center gap-1.5 text-sm text-slate-400 hover:text-slate-200"><i class="ph-fill ph-arrow-left"></i>Indietro</a>
        <h1 class="text-2xl font-bold">Non-trick-taking online</h1>
        <p class="mt-1 text-sm text-slate-400">Altri giochi da tavolo, senza prese: scegli il gioco e sfida l'AI.</p>
                <div class="mt-8 overflow-x-auto rounded-xl border border-slate-700/60">
                        <table class="w-full min-w-[360px] border-collapse text-left text-sm">
                                <thead class="bg-white/[0.05] text-xs uppercase tracking-wide text-slate-400">
                                        <tr><th scope="col" class="px-4 py-3">Titolo</th><th scope="col" class="w-px whitespace-nowrap px-3 py-3" title="N. giocatori" aria-label="N. giocatori"><i class="ph-fill ph-users text-slate-500" aria-hidden="true"></i></th><th scope="col" colspan="2" class="w-px whitespace-nowrap px-3 py-3 text-right"></th></tr>
                                </thead>
                                <tbody id="games" class="divide-y divide-slate-800"></tbody>
                        </table>
                </div>
    </main>
    <script>
        // ai = pagina contro l'AI; online = pagina "a stanze" (null finché non esiste/funziona)
        var GAMES = [
        {
                "name": "Eggs of Ostrich",
                "players": "3",
                "desc": "Raccogli uova di struzzo nei 4 sacchi senza romperli: carte richiesta giocate in segreto, uova divise tra chi le vuole. Da soli con SKIP si prende l'ambra.",
                "ai": "/ntt/eggs-of-ostrich/",
                "online": null,
                "beta": true,
                "badge": "New"
        }
];
        function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
        GAMES.sort(function (a, b) { return a.name.localeCompare(b.name, 'it', { sensitivity: 'base' }); });
                var BADGE_STYLE = {
                        beta: 'border-amber-500/60 bg-amber-500/10 text-amber-300',
                        new: 'border-sky-500/60 bg-sky-500/10 text-sky-300',
                        updated: 'border-emerald-500/60 bg-emerald-500/10 text-emerald-300'
                };
                function badge(label, style) {
                        return '<span class="inline-flex rounded border px-1.5 py-0.5 text-[10px] font-semibold uppercase tracking-wide ' + style + '">' + label + '</span>';
                }
                // colonna di sinistra: New / Updated
                function stateBadge(g) {
                        var state = String(g.badge || '').toLowerCase();
                        return state === 'new' || state === 'updated' ? badge(state === 'new' ? 'New' : 'UPD', BADGE_STYLE[state]) : '';
                }
                // colonna di destra: Beta (sempre a destra, qualunque altro badge ci sia)
                function betaBadge(g) {
                        return Boolean(g.beta) || String(g.badge || '').toLowerCase() === 'beta' ? badge('Beta', BADGE_STYLE.beta) : '';
                }
                var games = document.getElementById('games');
                games.innerHTML = GAMES.map(function (g) {
                        return '<tr data-href="' + esc(g.ai) + '" tabindex="0" aria-label="Apri ' + esc(g.name) + '" class="cursor-pointer transition-colors hover:bg-white/[0.04] focus-visible:outline focus-visible:outline-2 focus-visible:outline-teal-500">' +
                                '<th scope="row" class="px-4 py-3 font-semibold text-slate-100"><a href="' + esc(g.ai) + '" class="hover:text-teal-300">' + esc(g.name) + '</a></th>' +
                                '<td class="w-px whitespace-nowrap px-3 py-3 text-slate-300">' + esc(g.players) + '</td>' +
                                '<td class="w-px whitespace-nowrap pl-3 pr-1 py-3 text-right">' + stateBadge(g) + '</td>' +
                                '<td class="w-px whitespace-nowrap pl-1 pr-3 py-3 text-right">' + betaBadge(g) + '</td></tr>';
        }).join('');
                games.addEventListener('click', function (e) {
                        var row = e.target.closest('tr[data-href]');
                        if (row && !e.target.closest('a')) location.href = row.getAttribute('data-href');
                });
                games.addEventListener('keydown', function (e) {
                        if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr[data-href]')) {
                                e.preventDefault(); location.href = e.target.getAttribute('data-href');
                        }
                });
    </script>
</body>
</html>
