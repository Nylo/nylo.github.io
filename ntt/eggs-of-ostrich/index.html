<!DOCTYPE html>
<html lang="it" data-home-inline>
<head>
<script src="/auth-gate.js"></script>
<script src="/home-btn.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eggs of Ostrich</title>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#e4f2ec;
  --surface:#fbfffc;
  --surface-raised:#d3e8de;
  --accent:#d5222d;
  --accent-soft:rgba(213,34,45,0.12);
  --text:#1c2a26;
  --text-soft:#52665f;
  --danger:#b3261e;
  --success:#1e8f55;
  --border:#b8d3c6;
  --radius:10px;
  --gold:#f6d96a;
  --p0:#2f9e3a; --p1:#2a5bd7; --p2:#efd83a;
}
html,body{min-height:100%;color:var(--text);font-family:'Inter',sans-serif;font-size:14px}
body{background:radial-gradient(ellipse at 50% -20%,#f6fffb 0%,var(--bg) 62%,#c9e2d6 100%) fixed;background-color:var(--bg)}
.app{max-width:980px;margin:0 auto;padding:0 12px 48px}

.topbar{display:flex;align-items:center;gap:10px;padding:14px 0;margin-bottom:10px;flex-wrap:wrap}
.logo{font-family:'Fredoka',sans-serif;font-size:30px;font-weight:700;line-height:1.1;flex:1;min-width:190px;color:var(--accent);text-shadow:2px 2px 0 #1b1b1b;letter-spacing:0.01em}
.logo em{font-style:normal;color:#fff;-webkit-text-stroke:1px #d5222d}
.badge{background:var(--accent);color:#fff;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700;white-space:nowrap}
.btn{border-radius:7px;padding:8px 14px;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;cursor:pointer;background:transparent;color:var(--text-soft);border:1px solid var(--border)}
.btn:hover{background:var(--surface-raised)}
.btn-sm{padding:5px 10px;font-size:12px}
.opt-toggle{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-soft);cursor:pointer;border:0;border-radius:20px;padding:4px 10px;user-select:none}
.opt-toggle input{accent-color:var(--accent);cursor:pointer}
.menu-wrap{position:relative;margin-left:auto}
.hamb{display:inline-flex;align-items:center;justify-content:center;width:34px;height:30px;border-radius:7px;background:transparent;color:var(--text-soft);border:1px solid var(--border);cursor:pointer}
.hamb:hover{background:var(--surface-raised);color:var(--text)}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);z-index:30;min-width:220px;display:flex;flex-direction:column;gap:4px;padding:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 10px 24px rgba(0,0,0,0.25)}
.menu-pop .opt-toggle{border:0;border-radius:6px;padding:9px 10px;font-size:13px;color:var(--text);white-space:nowrap}
.menu-pop .opt-toggle:hover{background:var(--accent-soft)}
.flag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;vertical-align:middle;white-space:nowrap}
.flag.out{background:#3a3a3a;color:#fff}
.log{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-top:12px;margin-bottom:12px;font-size:12px;color:var(--text-soft);line-height:1.6}
.log summary{cursor:pointer;font-weight:600;letter-spacing:0.05em}
.logbody{margin-top:8px;max-height:260px;overflow-y:auto;padding-right:6px}
.logbody div{border-bottom:1px solid var(--border);padding:1px 0}
.name-modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.55);padding:16px}
.name-box{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:20px;width:min(340px,100%);display:flex;flex-direction:column;gap:12px;box-shadow:0 14px 40px rgba(0,0,0,0.5)}
.name-box h3{font-family:'Fredoka',sans-serif;font-size:19px}
.name-box p{font-size:12px;color:var(--text-soft)}
.name-box input{padding:9px 11px;border-radius:7px;border:1px solid var(--border);background:#fff;color:var(--text);font-size:14px;font-family:inherit;outline:none}
.name-box input:focus{border-color:var(--accent)}

.dock{position:sticky;top:0;z-index:10;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 18px rgba(20,60,45,0.18)}
.dock-msg{font-size:13px;line-height:1.5}
.dock-title{font-size:11px;font-weight:600;color:var(--text-soft);letter-spacing:0.05em}
.opts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.opt{background:var(--surface-raised);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px 12px;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.12s;text-align:left}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{opacity:0.35;cursor:not-allowed}
.hint{font-size:12px;color:var(--text-soft)}
.fin{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--text-soft)}
.fin b{color:var(--text)}
table.score{border-collapse:collapse;font-size:12px;width:100%}
table.score td,table.score th{padding:5px 8px;border-bottom:1px solid var(--border);text-align:right;vertical-align:middle}
table.score td:first-child,table.score th:first-child{text-align:left}
table.score .neg{color:var(--danger)}
table.score .pos{color:var(--success)}

/* tavolo: panno rosso come nelle foto; i tre giocatori sono impilati perché ognuno ha 4 sacchi e 5 carte */
.table{display:flex;flex-direction:column;gap:10px;background:radial-gradient(ellipse at 50% 30%,#c0272f 0%,#7e141b 100%);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:12px;color:#fff6f0}
.center{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap;padding:4px 0}
.cgroup{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px}
.cinfo{display:flex;flex-direction:column;gap:5px;font-size:12px;line-height:1.5;max-width:300px}
.cinfo b{color:var(--gold)}
.stones{display:inline-flex;gap:4px;vertical-align:middle}
.stone{display:inline-block;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0,#f4c01e 45%,#b9800a);box-shadow:0 1px 2px rgba(0,0,0,0.5)}
.stone.gone{opacity:0.25}
.seat{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.18);background:rgba(0,0,0,0.22);border-left:6px solid var(--pc)}
.seat.active{border-color:var(--gold);background:rgba(246,217,106,0.14);border-left-color:var(--pc)}
.seat.out{opacity:0.7}
.seat-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seat-name{font-weight:600;font-size:14px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--pc);border:1px solid rgba(255,255,255,0.8);vertical-align:middle;margin-right:6px}
.seat-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px}
.tag{background:rgba(0,0,0,0.42);border-radius:4px;padding:2px 6px;color:#fff;display:inline-flex;align-items:center;gap:4px}
.tag b{color:var(--gold)}
.tag i.am{color:#f4c01e}
.seat-body{display:flex;gap:6px 18px;flex-wrap:wrap;align-items:flex-end}
.grp{display:flex;flex-direction:column;gap:3px}
.gl{font-size:10px;letter-spacing:0.06em;text-transform:uppercase;opacity:0.75}
.row{display:flex;gap:4px;align-items:flex-end}
.p0{--pc:var(--p0)} .p1{--pc:var(--p1)} .p2{--pc:var(--p2)}

/* carta sacco: panno colorato col numero e le uova (cerchietti bianchi) */
.bag{position:relative;display:inline-block;width:62px;height:86px;border:3px solid #111;border-radius:7px;background:#d8262d;flex-shrink:0;box-shadow:0 2px 5px rgba(0,0,0,0.5);overflow:hidden}
.bag .cloth{position:absolute;left:7px;right:7px;top:8px;bottom:8px;border-radius:6px 6px 16px 16px;background-color:var(--pc);display:grid;place-items:start center;padding-top:3px}
.bag .cloth b,.cl .bub b,.ec b{font-family:'Fredoka',sans-serif;font-weight:700;line-height:1;color:#111;text-shadow:-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff,1px 1px 0 #fff}
.bag .cloth b{font-size:31px}
.bag .eggs{position:absolute;left:0;right:0;bottom:6px;display:flex;flex-wrap:wrap;gap:2px;justify-content:center;padding:0 8px}
.egg{width:11px;height:11px;border-radius:50%;background:#fff;box-shadow:inset -2px -2px 0 rgba(0,0,0,0.16),0 1px 2px rgba(0,0,0,0.5)}
/* anello fuori dal sacco (il sacco rotto è in grigio col filtro, che altrimenti scolorirebbe anche l'anello):
   oro = sacco pieno, verde = ha appena ricevuto uova, rosso = si è appena rotto */
.bagw{display:inline-block;border-radius:10px;flex-shrink:0;line-height:0}
.bagw.full{box-shadow:0 0 0 3px var(--gold)}
.bagw.hit{box-shadow:0 0 0 3px #88e8bd}
.bagw.full.hit{box-shadow:0 0 0 3px var(--gold),0 0 0 6px #88e8bd}
.bagw.crash{box-shadow:0 0 0 3px #ff5b4d}
.row.bags{gap:7px}
.bag.broken{filter:grayscale(1) brightness(0.65)}
.bag em.x{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-size:56px;font-weight:700;color:#ff3b30;text-shadow:0 0 3px #000}
.bag .cap{position:absolute;right:3px;top:1px;font-size:9px;font-weight:700;color:#fff;font-family:'Inter',sans-serif;opacity:0.9}

/* carta richiesta: fumetto colorato col numero del sacco (o SKIP) */
.cl{position:relative;display:inline-block;width:52px;height:72px;border:3px solid #3d9c33;border-radius:7px;background:linear-gradient(#bfe6f6 0 45%,#b9de8f 45% 78%,#ecd9a0 78%);flex-shrink:0;box-shadow:0 2px 5px rgba(0,0,0,0.45);padding:0;overflow:hidden;font-family:'Fredoka',sans-serif}
.cl .bub{position:absolute;left:4px;right:4px;top:5px;height:46px;background-color:var(--pc);border:2px solid #111;border-radius:7px;display:grid;place-items:center}
.cl .bub b{font-size:30px}
.cl.skip .bub b{font-size:15px;letter-spacing:0.02em}
.cl.back{background:var(--pc);border-color:#fff;display:inline-grid;place-items:center}
.cl.back small{font:700 7px/1.2 'Inter',sans-serif;color:#fff;text-align:center;text-shadow:0 1px 1px rgba(0,0,0,0.6)}
.cl.p2.back small{color:#2b2500;text-shadow:none}
.cl.empty{background:transparent;border:1px dashed rgba(255,255,255,0.4);box-shadow:none}
.cl.rest{opacity:0.55;filter:saturate(0.6)}
button.cl{cursor:pointer;transition:transform 0.12s}
button.cl:hover:not(:disabled){transform:translateY(-6px)}
button.cl:disabled{cursor:default}
.cl.legal{box-shadow:0 0 0 3px var(--gold)}
.cl.dim{opacity:0.4}
.cl.sel{transform:translateY(-10px);box-shadow:0 0 0 3px #fff,0 0 0 6px var(--gold)}

/* carta uovo: paesaggio, numero grande e struzzo */
.ec{position:relative;display:inline-block;width:84px;height:116px;border:4px solid #d92d8e;border-radius:9px;background:linear-gradient(#a9dcf5 0 50%,#c3e29a 50% 82%,#ecd9a0 82%);box-shadow:0 3px 8px rgba(0,0,0,0.5);flex-shrink:0;overflow:hidden}
.ec b{position:absolute;left:0;right:0;top:8px;text-align:center;font-size:44px}
.ec i{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:44px;color:#111;line-height:1}
.ec.back{background:linear-gradient(145deg,#ec5aa8,#b81f78);display:inline-grid;place-items:center}
.ec.back b{position:static;font-size:30px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,0.6)}
.ec.empty{background:transparent;border:2px dashed rgba(255,255,255,0.4);box-shadow:none}
.ec.amber .gem{position:absolute;left:50%;top:30px;width:46px;height:46px;margin-left:-23px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0,#f4c01e 45%,#b9800a);box-shadow:0 2px 5px rgba(0,0,0,0.5)}
.ec.amber small{position:absolute;left:0;right:0;bottom:8px;text-align:center;font:700 11px 'Inter',sans-serif;letter-spacing:0.08em;color:#5a3d00}

.recap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.recap h3{font-size:12px;font-weight:600;letter-spacing:0.05em;color:var(--text-soft)}
.recap-row{display:block;font-size:12px;line-height:1.7}
.recap-row > *{margin-right:6px}
.recap-row b{margin-right:0}
.recap-row .lbl{font-weight:600;color:var(--text-soft)}
details.rules{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
details.rules summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--text-soft);letter-spacing:0.05em}
details.recap{display:block;padding:14px 16px}
details.recap>summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--text-soft);letter-spacing:0.05em}
details.recap[open]>summary{margin-bottom:10px}
details.recap[open]>:not(summary)+*{margin-top:10px}
.rtext h4{font-family:'Fredoka',sans-serif;font-size:15px;color:#a8161f;margin:14px 0 4px}
.rtext p,.rtext li{font-size:12px;line-height:1.6;color:var(--text-soft);margin-bottom:6px}
.rtext ul{padding-left:18px}
.rtext a{color:#a8161f}

/* stanze online (kit condiviso) */
:root{--topc:var(--text)}
.panel{background:var(--surface);border:1px solid var(--border);box-shadow:0 6px 18px rgba(20,60,45,0.12);border-radius:var(--radius);padding:18px;margin-bottom:14px;display:flex;flex-direction:column;gap:12px;color:var(--text)}
.panel h2{font-size:16px;font-weight:700}
.muted{color:var(--text-soft);font-size:12px;line-height:1.5}
body .app>section>p.muted{color:var(--topc,var(--text-soft));margin-bottom:10px}
.status{font-size:13px;min-height:20px;line-height:1.5;color:var(--topc,var(--text))}
.panel input[type=text]{background:#fff;border:1px solid var(--border);color:#222;border-radius:6px;padding:9px 11px;font-family:'Inter',sans-serif;font-size:14px;width:100%;outline:none;letter-spacing:1px}
.panel input[type=text]:focus{border-color:var(--accent)}
.radios{display:flex;gap:18px;flex-wrap:wrap;font-size:13px}
.radios label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.roster{list-style:none;display:flex;flex-direction:column;gap:8px}
.roster li{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface-raised);border:1px solid var(--border);border-radius:8px;font-size:13px}
.roster .seat-n{width:20px;color:var(--text-soft)}
.roster .grow{flex:1}
.roster .soft{color:var(--text-soft)}
.room-code{padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-family:Consolas,monospace;letter-spacing:1px;font-size:12px;color:var(--topc,var(--text));border-color:var(--topc,var(--border))}
.conn{font-size:11px;color:var(--topc,var(--text-soft))}
.room-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.room-bar .room-code,.room-bar .btn{display:inline-flex;align-items:center;justify-content:center;height:30px;padding:0 10px;line-height:1;box-sizing:border-box;white-space:nowrap}
.room-bar .conn{margin-left:auto}
.err{position:fixed;left:12px;right:12px;bottom:12px;max-width:680px;margin:0 auto;padding:12px 14px;border:1px solid rgba(217,107,107,0.6);border-radius:8px;background:#3a1d22;color:#fff;font-size:13px;line-height:1.4;z-index:200}
.sx-card{background:var(--surface);border:1px solid var(--border);box-shadow:0 6px 18px rgba(20,60,45,0.12);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:12px;color:var(--text)}
.sx-label{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--text-soft);margin-top:2px}
.sx-row{display:flex;gap:8px;flex-wrap:wrap}
.sx-opt{padding:10px 16px;border-radius:7px;border:1px solid var(--border);background:#fff;color:var(--text);cursor:pointer;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;transition:border-color .12s,background .12s}
.sx-opt:hover:not(:disabled){background:var(--surface-raised)}
.sx-opt.on{border-color:var(--accent);background:var(--accent);color:#fff;font-weight:600}
.sx-opt.on:hover:not(:disabled){background:var(--accent);filter:brightness(1.1)}
.sx-opt:disabled{opacity:.4;cursor:not-allowed}
.sx-row .sx-opt{flex:1 1 0;min-width:0}
.sx-go{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;margin-top:1rem}
.sx-go:hover:not(:disabled){background:var(--accent);filter:brightness(1.15)}
.sx-in{background:#fff;border:1px solid var(--border);color:#222;border-radius:6px;padding:10px 12px;font-family:'Inter',sans-serif;font-size:14px;width:100%;outline:none}
.sx-in:focus{border-color:var(--accent)}
.sx-in.code{letter-spacing:2px;text-transform:uppercase;font-family:Consolas,monospace}
.sx-nav{display:flex;gap:8px;align-items:center;margin-left:auto}
.sx-sub{display:flex;flex-direction:column;gap:10px;padding-top:2px}
.flag.first{background:var(--accent);color:#fff}
.flag.ok{background:var(--success);color:#fff}

@media(max-width:600px){
  .bag{width:50px;height:70px;border-width:2px}
  .bag .cloth{left:5px;right:5px;top:6px;bottom:6px}
  .bag .cloth b{font-size:24px}
  .bag .eggs{gap:1px;padding:0 5px;bottom:4px}
  .egg{width:9px;height:9px}
  .row.bags{gap:6px}
  .bag em.x{font-size:44px}
  .cl{width:42px;height:58px;border-width:2px}
  .cl .bub{left:3px;right:3px;top:4px;height:36px;border-width:2px}
  .cl .bub b{font-size:23px}
  .cl.skip .bub b{font-size:12px}
  .ec{width:68px;height:94px;border-width:3px}
  .ec b{font-size:36px;top:6px}
  .ec i{font-size:34px}
  .table{padding:8px;gap:8px}
  table.score{font-size:11px}
  table.score td,table.score th{padding:5px 3px}
  .seat{padding:8px 8px}
  .logo{font-size:24px}
}
@media(max-width:380px){
  table.score{font-size:10px}
  table.score td,table.score th{padding:5px 2px}
}

<script src="/tt/shared/core.js"></script>
<script type="text/plain" id="src-common">
// ═════════════════════════ COMUNE (modalità AI e stanze) ═════════════════════════
// Costanti, regole pure (funzionano su un oggetto stato "st": G contro l'AI, S nelle stanze) e pezzi di interfaccia condivisi.
const CAPS = [2,3,5,7];                    // capacità dei 4 sacchi: la carta richiesta ha lo stesso numero
const SKIP = 4;                            // la quinta carta richiesta è SKIP
const EGGS = [4,5,5,6,7,8,9,9,10];         // carte uovo numerate (più 3 ambra)
const AMBERS = 3;
const REMOVED = 2;                         // carte uovo tolte a caso a inizio partita: restano 10 round
const PNAME = ['verde','blu','giallo'];
const ico = n => `<i class="ph-fill ph-${n}"></i>`;
const claimName = c => c===SKIP?'SKIP':`sacco da ${CAPS[c]}`;
const bagPts = b => b.broken?0:(b.x===b.cap?b.cap:Math.floor(b.x/2));
const liveScore = p => p.bags.reduce((a,b)=>a+bagPts(b),0)+4*p.amber;
const cardName = c => c.amber?'ambra':`${c.n} uova`;

// ═════════════════════════ REGOLE ═════════════════════════
function makeDeck(){
  const d=EGGS.map(n=>({n,amber:false}));
  for(let i=0;i<AMBERS;i++) d.push({n:0,amber:true});
  return d;
}
function newPlayer(i,name){
  return {id:i,name,bags:CAPS.map(c=>({cap:c,x:0,broken:false})),hand:[0,1,2,3,4],rest:null,played:null,amber:0,out:false};
}
// a fine round la carta usata resta a riposo (non si può rigiocare subito) e quella del round prima torna in mano
function settleRests(st){
  st.pl.forEach(p=>{
    if(p.out){ p.rest=null; p.played=null; return; }
    if(p.played===null) return;
    if(p.rest!==null) p.hand.push(p.rest);
    p.rest=(p.played<4&&p.bags[p.played].broken)?null:p.played;     // la carta di un sacco rotto non si usa più
    p.played=null;
    p.hand.sort((a,b)=>a-b);
  });
}
// risolve il round dopo la rivelazione: aggiorna sacchi e ambra e restituisce il testo
function resolve(st){
  const cur=st.cur, act=st.pl.filter(p=>!p.out), out=[];
  st.fx={};
  const fx=(p,b,k)=>{ (st.fx[p.id]=st.fx[p.id]||{})[b]=k; };
  out.push('Carte rivelate: '+act.map(p=>`${p.name} ${claimName(p.played)}`).join(' · ')+'.');
  let res;
  if(cur.amber){
    const sk=act.filter(p=>p.played===SKIP);
    if(sk.length===1){
      sk[0].amber++; st.amberLeft--;
      res=`${sk[0].name} è l'unico a giocare SKIP e prende l'ambra (+4 punti).`;
    }else res=sk.length?`${sk.length} giocatori giocano SKIP: nessuno prende l'ambra.`:`Nessuno gioca SKIP: l'ambra non va a nessuno.`;
    out.push(res);
  }else{
    const W=act.filter(p=>p.played!==SKIP);
    if(!W.length){ res='Tutti giocano SKIP: nessuno prende uova.'; out.push(res); }
    else{
      const e=Math.floor(cur.n/W.length);
      res=W.length===1?`${W[0].name} è l'unico a volere le uova e le prende tutte (${cur.n}).`:`${W.length} giocatori vogliono le uova: ${cur.n} ÷ ${W.length} = ${e} a testa.`;
      out.push(res);
      W.forEach(p=>{
        const b=p.bags[p.played]; b.x+=e;
        if(b.x>b.cap){
          out.push(`${p.name}: il sacco da ${b.cap} dovrebbe contenere ${b.x} uova e si rompe! Le uova sono perse e la carta ${b.cap} non si può più usare.`);
          b.lost=b.x; b.x=0; b.broken=true; fx(p,p.played,'crash');
          res+=` ${p.name} rompe il sacco da ${b.cap}!`;
        }else{
          out.push(`${p.name}: sacco da ${b.cap} → ${b.x}/${b.cap}${b.x===b.cap?' (pieno!)':''}.`);
          fx(p,p.played,'hit');
        }
      });
    }
  }
  st.last=res;
  st.pl.forEach(p=>{
    if(!p.out&&p.bags.every(b=>b.broken)){ p.out=true; p.hand=[]; out.push(`${p.name} ha rotto tutti i sacchi: è fuori dalla partita.`); }
  });
  return out;
}
function winnersOf(st){
  const sc=st.pl.map(liveScore), mx=Math.max(...sc);
  return sc.map((s,i)=>s===mx?i:-1).filter(i=>i>=0);
}
// testi del round (uguali contro l'AI e nelle stanze)
function drawMsg(card){ return card.amber?`Ambra! La prende solo chi è l'unico a giocare SKIP.`:`Escono ${card.n} uova: chi gioca un sacco se le divide.`; }
function chooseMsg(card){ return card.amber?'Ambra! Scegli una carta richiesta.':`Escono ${card.n} uova: scegli una carta richiesta.`; }
function claimHint(card,rest){
  const r=rest===null?'':` Il ${claimName(rest)} è a riposo: non puoi usarlo.`;
  return (card.amber
    ?`è ambra: la prende solo chi è l'unico a giocare SKIP, qualsiasi altra carta non fa nulla.`
    :`${card.n} uova: chi gioca un sacco se le divide (per difetto) e le mette in quel sacco; se un sacco ne riceve troppe si rompe. SKIP = non le voglio.`)+r;
}

// ═════════════════════════ RENDER ═════════════════════════
function bagHtml(p,bag,fx){

  const t=bag.broken?`Sacco da ${bag.cap}: rotto`:`Sacco da ${bag.cap}: ${bag.x} ${bag.x===1?'uovo':'uova'}${full?' (pieno)':''}`;

}
function claimHtml(p,c,extra='',tag='span',attrs=''){

}
const claimBack = p => `<span class="cl back p${p}" title="Carta richiesta coperta"><small>EGGS<br>OF<br>OSTRICH</small></span>`;

// v = {me: posto di chi guarda, choose: {legal:Set, sel} se può scegliere ora, pick: true per mostrare «Ha scelto» (stanze)}
function seatHtml(st,p,v){

  if(pl.out) hand='<span class="hint" style="color:inherit">Fuori dalla partita</span>';

    if(choosing){ const lg=v.choose.legal.has(c); return claimHtml(p,c,`${lg?'legal':'dim'} ${v.choose.sel===c?'sel':''}`,'button',`${lg?'':'disabled'} data-c="${c}"`); }
    return claimHtml(p,c);
  }).join('')||claimEmpty();
  else hand=pl.hand.map(()=>claimBack(p)).join('')||claimEmpty();
  const rest=pl.out?claimEmpty():(pl.rest!==null?claimHtml(p,pl.rest,'rest'):claimEmpty());
  const shown=pl.played===null?claimEmpty():(st.revealed||me?claimHtml(p,pl.played):claimBack(p));
  const meta=`<div class="seat-meta"><span class="tag" title="Punteggio attuale (se la partita finisse ora)">${ico('star')} <b>${liveScore(pl)}</b></span><span class="tag" title="Ambra (4 punti ciascuna)"><i class="ph-fill ph-diamond am"></i> <b>${pl.amber}</b></span></div>`;
  const flag=pl.out?'<span class="flag out">Fuori</span>':(v.pick&&st.phase==='choose'&&pl.played!==null?'<span class="flag ok">Ha scelto</span>':'');
  const tu=v.pick&&me?' <span class="hint" style="color:inherit">(tu)</span>':'';
  return `<div class="seat p${p} ${choosing?'active':''} ${pl.out?'out':''}">
    <div class="seat-head"><div class="seat-name"><span class="dot"></span>${esc(pl.name)}${tu}${flag}</div>${meta}</div>
    <div class="seat-body">
      <div class="grp"><div class="gl">Sacchi</div><div class="row bags">${[0,1,2,3].map(b=>bagHtml(p,pl.bags[b],(st.fx[p]&&st.fx[p][b])||'')).join('')}</div></div>
      <div class="grp"><div class="gl">In mano</div><div class="row">${hand}</div></div>
      <div class="grp"><div class="gl">A riposo</div><div class="row">${rest}</div></div>
      <div class="grp"><div class="gl">Giocata</div><div class="row">${shown}</div></div>
    </div></div>`;
}
function centerHtml(st){
  const left=st.deck.length;
  const stones=Array.from({length:AMBERS},(_,i)=>`<span class="stone ${i<st.amberLeft?'':'gone'}"></span>`).join('');
  const state={idle:'',draw:'Si scopre la carta del mazzo',choose:'Si sceglie la carta richiesta',hidden:'Carte coperte',reveal:'Carte rivelate',over:'Fine partita'}[st.phase]||'';
  return `<div class="center">

}
function scoreTable(st){
  const rows=st.pl.map(p=>`<tr><td>${esc(p.name)}${p.out?' <span class="hint">(fuori)</span>':''}</td>${p.bags.map(b=>`<td class="${b.broken?'neg':''}" title="${b.broken?'Sacco rotto':`${b.x}/${b.cap} uova`}">${b.broken?'✕':bagPts(b)}</td>`).join('')}<td>${4*p.amber}</td><td><b>${liveScore(p)}</b></td></tr>`).join('');

}
function finalLines(st){
  return `<div class="fin">${st.pl.map(p=>`<div><b>${esc(p.name)}</b>: ${p.bags.map(bagPts).join(' + ')} + ${4*p.amber} (ambra) = <b>${liveScore(p)}</b> punti</div>`).join('')}</div>`;
}
function logHtml(st){
  return `<details class="log" ${LOGOPEN?'open':''}><summary>LOG DELLA PARTITA (${st.log.length})</summary><div class="logbody">${st.log.map(l=>`<div>${esc(l)}</div>`).join('')}</div></details>`;
}
function recapHtml(){
  return `<details class="recap"><summary>RIEPILOGO</summary>
    <div class="recap-row"><span class="lbl">Mazzo</span>12 carte uovo (4, 5, 5, 6, 7, 8, 9, 9, 10 e 3 ambra): 2 tolte a caso, si giocano 10 round.</div>
    <div class="recap-row"><span class="lbl">Sacchi</span>Ognuno ha 4 sacchi da 2, 3, 5 e 7 uova e 5 carte richiesta: 2, 3, 5, 7 e SKIP.</div>
    <div class="recap-row"><span class="lbl">Round</span>Si scopre una carta uovo; tutti scelgono in segreto una carta richiesta e la rivelano insieme. Un numero = «voglio le uova in quel sacco», SKIP = «non le voglio».</div>
    <div class="recap-row"><span class="lbl">Uova</span>Chi non gioca SKIP si divide le uova in parti uguali (per difetto) e le mette nel sacco scelto. Se un sacco supera la capacità si rompe: uova perse e carta non più utilizzabile.</div>
    <div class="recap-row"><span class="lbl">Ambra</span>Con la carta ambra la prende solo chi gioca SKIP da solo.</div>
    <div class="recap-row"><span class="lbl">Riposo</span>La carta giocata non si può usare nel round dopo; dal secondo round quella del round precedente torna in mano (SKIP compreso).</div>
    <div class="recap-row"><span class="lbl">Punteggio</span>Sacco pieno = tanti punti quanta la capacità · sacco incompleto = metà delle uova (per difetto) · sacco rotto = 0 · ambra = 4 punti. Vince il totale più alto.</div></details>`;
}

const RULES_HTML = `
<details class="rules"><summary>REGOLAMENTO</summary>
<div class="rtext">
<h4>Storia</h4>
<p>Tre fratelli dal cuore buono (?) vanno a raccogliere uova di struzzo. Ognuno ha 4 sacchi che riempie a poco a poco con le uova. Ma le uova sono molto pesanti e la stoffa dei sacchi è sottilissima: con troppe uova i sacchi rischiano di rompersi! Quale fratello raccoglierà più uova?</p>
<h4>Contenuto</h4>
<p>12 carte uovo (4, 5, 5, 6, 7, 8, 9, 9, 10 e 3 ambra), 12 carte sacco (2, 3, 5, 7 in tre colori), 15 carte richiesta (2, 3, 5, 7 e «skip» in tre colori), 50 uova di plastica e 3 pietre d'ambra gialle.</p>
<h4>Obiettivo</h4>
<p>Il punteggio si calcola dopo 10 round. Se un sacco contiene il numero giusto di uova, il giocatore ottiene tanti punti quanti sono le uova che può contenere; se ce ne sono troppo poche i punti si dimezzano, se ce ne sono troppe il sacco si rompe e le uova sono perse. Anche l'ambra dà punti. Vince chi ha il punteggio più alto.</p>
<h4>Preparazione</h4>
<p>Si mescolano le carte uovo e se ne tolgono 2 a caso, rimettendole nella scatola senza guardarle. Le altre 10 formano il mazzo coperto al centro. Ogni giocatore sceglie un colore (verde, blu o giallo) e prende i suoi sacchi e le sue carte richiesta: i sacchi si allineano scoperti davanti a sé, le carte richiesta restano in mano. Uova e ambra si mettono al centro.</p>
<h4>Inizio di un round</h4>
<p>Si scopre la prima carta del mazzo (nel gioco da tavolo lo fa il «rivelatore», chi ha rotto un uovo più di recente; qui è automatico).</p>
<h4>Come raccogliere le uova</h4>
<p>Se la carta è un uovo numerato, il numero indica quante uova ci sono in questo round. Ogni giocatore decide se le vuole e sceglie una carta richiesta, che mette coperta: se le vuole, gioca la carta con il numero del sacco in cui metterle; altrimenti gioca «skip». Quando tutti hanno giocato, le carte si rivelano insieme.</p>
<p>Tutti quelli che hanno giocato una carta numerata si dividono le uova in parti uguali (per difetto). Se tutti giocano «skip» nessuno prende uova. Le uova si prendono dalla riserva e si mettono sul sacco con lo stesso numero della carta richiesta giocata.</p>
<p><i>Esempio:</i> la carta dice 9 uova; i giocatori giocano 7, 5 e «skip». In due vogliono le uova, quindi ne prendono 4 a testa: le uova vanno sul sacco 7 e sul sacco 5.</p>
<h4>Sacchi che si rompono</h4>
<p>Il numero di ogni sacco indica quante uova può contenere. Se, dividendo le uova, un sacco ne riceve più di quante ne contiene, si rompe e tutte le sue uova sono schiacciate! Le uova del sacco rotto tornano nella riserva e la carta richiesta con lo stesso numero si mette coperta sopra la carta sacco: né il sacco né la carta richiesta si possono più usare.</p>
<h4>Come ottenere l'ambra</h4>
<p>Se la carta scoperta è ambra, i giocatori giocano una carta richiesta a piacere, come per un uovo. Dopo la rivelazione, se un solo giocatore ha giocato «skip» prende un'ambra dalla riserva. L'ambra non si mette nei sacchi ma si tiene accanto e non si può perdere. Se due o tre giocatori giocano «skip» nessuno prende l'ambra, e chi ha giocato altro non prende nulla.</p>
<h4>Fine del round</h4>
<p>Quando è stato stabilito chi prende uova o ambra, le carte richiesta usate in questo round restano scoperte davanti a ciascuno e non si possono usare nel round successivo. Dal secondo round in poi, le carte usate nel round precedente tornano in mano.</p>
<h4>Se si rompono tutti i sacchi…</h4>
<p>È improbabile, ma se si rompono tutti i sacchi di un giocatore, quel giocatore è fuori dalla partita (tiene la sua ambra); si continua con gli altri due.</p>
<h4>Vittoria e punteggio</h4>
<p>La partita termina dopo 10 round. Ogni giocatore controlla i sacchi: quelli completamente pieni valgono tanti punti quante sono le uova che possono contenere (il sacco da 7 con 7 uova vale 7 punti). I sacchi con meno uova di quante ne possono contenere valgono la metà dei punti delle uova che hanno, per difetto (il sacco da 5 con 3 uova vale 1 punto). Ogni ambra vale 4 punti. Vince chi ha più punti in totale; in caso di parità la vittoria è condivisa.</p>
<p><i>Esempio:</i> 2 + 0 + 1 + 1 + 4 = 8 punti.</p>
<p><i>Nelle stanze online</i> si gioca in tre persone, senza AI: i posti al tavolo (e quindi i colori) sono assegnati a caso e le carte richiesta scelte restano coperte per gli altri finché non hanno scelto tutti. Le uova e le ambre sono pubbliche. A round concluso chiunque può passare al successivo.</p>
<p>Gioco di Shinpei Sato (conception), illustrazioni di KONOKI. Titolo originale «タマゴリッチ!».</p>
</div></details>`;

<script type="text/plain" id="src-ai">
// ═════════════════════════ AI: COSTANTI ═════════════════════════
const NAMES = ['Tu','AI Amara','AI Kwame'];
const HUM = 0;

// ═════════════════════════ UTILITÀ ═════════════════════════
const rnd = n => Math.floor(Math.random()*n);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
let G = null, PR = null;
const OPT = {undo:true};
try{ const s=localStorage.getItem('eggs-ostrich-undo'); if(s!==null) OPT.undo=s==='1'; }catch(e){}

// ═════════════════════════ INTERAZIONE ═════════════════════════
function askWelcome(title){
  const g=G;
  return new Promise((res,rej)=>{ PR={type:'welcome',title,res,rej}; render(); }).then(v=>{ if(g!==G) throw ABORT; return v; });
}
function askClaim(legal,hint){
  const g=G;
  return new Promise((res,rej)=>{ PR={type:'claim',legal:new Set(legal),hint,sel:null,res,rej}; render(); }).then(v=>{ if(g!==G) throw ABORT; return v; });
}
function pickClaim(c){
  if(!PR||PR.type!=='claim'||!PR.legal.has(c)) return;
  if(OPT.undo){ PR.sel=c; render(); return; }
  const r=PR.res; PR=null; render(); r(c);
}
function confirmClaim(ok){
  if(!PR||PR.type!=='claim'||PR.sel==null) return;
  if(!ok){ PR.sel=null; render(); return; }
  const v=PR.sel, r=PR.res; PR=null; render(); r(v);
}

// ═════════════════════════ AI ═════════════════════════
// Stato di un giocatore = uova nei 4 sacchi (sacco rotto = capacità+1): 4·5·7·9 = 1260 stati.
// Programmazione dinamica: V[r][stato][carta a riposo] = punti attesi a fine partita con r round ancora da giocare,
// contro avversari che chiedono le uova con una probabilità tipica (QCLAIM) e giocano SKIP per l'ambra (SAMB).
// Nel round in corso le AI risolvono il gioco simultaneo tra i giocatori (fictitious play) e pescano la mossa con una logit sui payoff attesi.
const STR = [1,4,20,140], RAD = [4,5,7,9], NS = 1260;
const DIG = new Int8Array(NS*4), BAGPTS = new Float64Array(NS);
(function(){
  for(let s=0;s<NS;s++){
    let t=s, pts=0;
    for(let b=0;b<4;b++){ const d=t%RAD[b]; t=Math.floor(t/RAD[b]); DIG[s*4+b]=d; pts+=d===CAPS[b]?CAPS[b]:(d>CAPS[b]?0:Math.floor(d/2)); }
    BAGPTS[s]=pts;
  }
})();
const addEggs = (s,b,e) => { const d=DIG[s*4+b]; let nd=d+e; if(nd>CAPS[b]) nd=CAPS[b]+1; return s+(nd-d)*STR[b]; };
const stateOf = p => p.bags.reduce((s,b,i)=>s+(b.broken?b.cap+1:b.x)*STR[i],0);
const MODEL = {q:{4:0.6,5:0.6,6:0.6,7:0.6,8:0.6,9:0.6,10:0.6}, samb:0.5};
function buildV(D,R){
  const V=new Float64Array((R+1)*NS*6);
  for(let s=0;s<NS;s++) for(let pv=0;pv<6;pv++) V[s*6+pv]=BAGPTS[s];
  const PK={}; Object.keys(MODEL.q).forEach(n=>{ const q=MODEL.q[n]; PK[n]=[(1-q)*(1-q),2*q*(1-q),q*q]; });
  const pa0=(1-MODEL.samb)*(1-MODEL.samb);
  const qa=new Float64Array(5), acc=new Float64Array(6), al=[false,false,false,false];
  for(let r=1;r<=R;r++){
    const base=r*NS*6, pb=(r-1)*NS*6;
    for(let s=0;s<NS;s++){
      for(let b=0;b<4;b++) al[b]=DIG[s*4+b]<=CAPS[b];
      if(!al[0]&&!al[1]&&!al[2]&&!al[3]){ for(let pv=0;pv<6;pv++) V[base+s*6+pv]=BAGPTS[s]; continue; }
      acc.fill(0);
      for(const t of D){
        qa.fill(-1e9);
        if(t.n===0){
          for(let b=0;b<4;b++) if(al[b]) qa[b]=V[pb+s*6+b];
          qa[4]=V[pb+s*6+4]+4*pa0;
        }else{
          const pk=PK[t.n];
          for(let b=0;b<4;b++) if(al[b]){
            let sum=0;
            for(let k=0;k<3;k++) sum+=pk[k]*V[pb+addEggs(s,b,Math.floor(t.n/(k+1)))*6+b];
            qa[b]=sum;
          }
          qa[4]=V[pb+s*6+4];
        }
        for(let pv=0;pv<6;pv++){
          let best=-1e9;
          for(let a=0;a<5;a++) if(a!==pv&&qa[a]>best) best=qa[a];
          acc[pv]+=t.p*best;
        }
      }
      for(let pv=0;pv<6;pv++) V[base+s*6+pv]=acc[pv];
    }
  }
  return V;
}
// carte uovo non ancora uscite (comprese le 2 tolte a caso): è tutto ciò che si sa del futuro
function unseenDist(){
  const cnt={};
  makeDeck().forEach(c=>{ const k=c.amber?0:c.n; cnt[k]=(cnt[k]||0)+1; });
  G.seen.forEach(c=>{ const k=c.amber?0:c.n; cnt[k]--; });
  const keys=Object.keys(cnt).filter(k=>cnt[k]>0), tot=keys.reduce((a,k)=>a+cnt[k],0);
  return keys.map(k=>({n:Number(k),p:cnt[k]/tot}));
}
// equilibrio approssimato del round in corso: payoff = valore atteso a fine partita meno una frazione (lam) di quello degli avversari,
// perché conta vincere, non fare punti: far rompere i sacchi agli altri (con uno SKIP al momento giusto) vale quasi quanto riempire i propri.
// La scelta finale non è la mossa "pura" dell'equilibrio ma una logit con precisione beta: le mosse quasi equivalenti restano
// possibili, così le due AI non giocano sempre la stessa carta e nessuno può prevederle del tutto.
function solveRound(info,cur,V,r){
  const n=info.length, dims=info.map(x=>x.A.length), total=dims.reduce((a,b)=>a*b,1);
  const vget=(s,pv)=>V[(r*NS+s)*6+pv];
  const U=info.map(()=>new Float64Array(total)), acts=new Array(n), idx=new Array(n), vals=new Array(n);
  for(let k=0;k<total;k++){
    let t=k;
    for(let i=0;i<n;i++){ idx[i]=t%dims[i]; t=Math.floor(t/dims[i]); acts[i]=info[i].A[idx[i]]; }
    if(cur.amber){
      let sk=0; for(let i=0;i<n;i++) if(acts[i]===SKIP) sk++;
      for(let i=0;i<n;i++) vals[i]=vget(info[i].s,acts[i])+(acts[i]===SKIP&&sk===1?4:0);
    }else{
      let w=0; for(let i=0;i<n;i++) if(acts[i]!==SKIP) w++;
      const e=w?Math.floor(cur.n/w):0;
      for(let i=0;i<n;i++) vals[i]=vget(acts[i]===SKIP?info[i].s:addEggs(info[i].s,acts[i],e),acts[i]);
    }
    let sum=0; for(let i=0;i<n;i++) sum+=vals[i];
    for(let i=0;i<n;i++) U[i][k]=vals[i]-(n>1?info[i].lam*(sum-vals[i])/(n-1):0);
  }
  const cnt=dims.map(d=>new Float64Array(d).fill(1/d)), mix=dims.map(d=>new Float64Array(d));
  const setMix=()=>{ for(let i=0;i<n;i++){ let s=0; for(let a=0;a<dims[i];a++) s+=cnt[i][a]; for(let a=0;a<dims[i];a++) mix[i][a]=cnt[i][a]/s; } };
  // payoff atteso di ogni mossa contro le strategie miste degli altri
  const expect=()=>{
    const E=dims.map(d=>new Float64Array(d));
    for(let k=0;k<total;k++){
      let t=k;
      for(let i=0;i<n;i++){ idx[i]=t%dims[i]; t=Math.floor(t/dims[i]); }
      for(let i=0;i<n;i++){ let w=1; for(let j=0;j<n;j++) if(j!==i) w*=mix[j][idx[j]]; E[i][idx[i]]+=w*U[i][k]; }
    }
    return E;
  };
  for(let it=0;it<300;it++){
    setMix();
    const E=expect();
    for(let i=0;i<n;i++){ let b=0; for(let a=1;a<dims[i];a++) if(E[i][a]>E[i][b]) b=a; cnt[i][b]+=1; }
  }
  setMix();
  const E=expect();
  return dims.map((d,i)=>{
    let mx=-Infinity; for(let a=0;a<d;a++) if(E[i][a]>mx) mx=E[i][a];
    const w=Array.from(E[i],e=>Math.exp(info[i].beta*(e-mx))), s=w.reduce((x,y)=>x+y,0);
    return w.map(x=>x/s);
  });
}
// "carattere" delle tre sedie: lam = quanto conta danneggiare gli altri, beta = quanto è netta la scelta (Amara spietata, Kwame prudente)
const PERS = [{lam:1.5,beta:4.5},{lam:2.2,beta:3.5},{lam:0.8,beta:5.5}];
function aiSolve(){
  const act=G.pl.filter(p=>!p.out), cur=G.cur, r=G.total-G.round;
  const V=buildV(r>0?unseenDist():[],r);
  const info=act.map(p=>({id:p.id,A:p.hand.slice(),s:stateOf(p),lam:PERS[p.id].lam,beta:PERS[p.id].beta}));
  return {act,mixes:solveRound(info,cur,V,r),info};
}
function sampleMix(A,mix){
  let x=Math.random(), i=0;
  for(;i<mix.length-1;i++){ x-=mix[i]; if(x<0) break; }
  return A[i];
}
// scelte simultanee delle AI (non vedono la carta del giocatore)
function aiPicks(){
  const picks={};
  try{
    const {act,mixes,info}=aiSolve();
    act.forEach((p,i)=>{ if(p.id!==HUM) picks[p.id]=sampleMix(info[i].A,mixes[i]); });
  }catch(e){
    console.error(e);
    G.pl.forEach(p=>{ if(!p.out&&p.id!==HUM) picks[p.id]=p.hand[rnd(p.hand.length)]; });
  }
  return picks;
}

function toSetup(){ if(PR){ const r=PR.rej; PR=null; r(ABORT); } location.href=location.pathname+'#ai'; location.reload(); }
function newMatch(n){
  if(PR){ const r=PR.rej; PR=null; r(ABORT); }
  NYLO_CK=null;
  G={n:3,round:0,total:0,msg:'',log:[],over:null,phase:'idle',cur:null,deck:[],removed:[],seen:[],amberLeft:AMBERS,revealed:false,fx:{},last:'',
     pl:[0,1,2].map(i=>newPlayer(i,NAMES[i]))};
  run();
}
function deal(){
  const all=shuffle(makeDeck());
  G.removed=all.splice(0,REMOVED); G.deck=all; G.total=G.deck.length;
}
async function playRound(){
  settleRests(G);
  const card=G.deck.shift();
  G.cur=card; G.seen.push(card); G.fx={}; G.revealed=false; G.phase='draw';
  G.pl.forEach(p=>{ p.played=null; });
  logMsg(`— Round ${G.round}/${G.total}: ${card.amber?'esce la carta ambra':`escono ${card.n} uova`} —`);
  status(drawMsg(card));
  await sleep(800);
  G.phase='choose';
  const picks=aiPicks(), me=P(HUM);
  if(!me.out){
    status(chooseMsg(card));
    const hint=claimHint(card,me.rest);
    me.played=await askClaim(me.hand,hint);
    me.hand=me.hand.filter(x=>x!==me.played);
  }
  G.pl.forEach(p=>{ if(!p.out&&p.id!==HUM){ p.played=picks[p.id]; p.hand=p.hand.filter(x=>x!==p.played); } });
  G.phase='hidden';
  status('Tutti hanno scelto: le carte si rivelano insieme…');
  await sleep(900);
  G.revealed=true; G.phase='reveal';
  status('Carte rivelate!');
  await sleep(1100);
  const lines=resolve(G);
  lines.slice().forEach(l=>G.log.unshift(l));
  status(G.last);
  await sleep(1700);
}
async function run(rs){
  const g=G;
  try{
    let r0=1;
    if(rs){ r0=g.round+1; status(`Partita ripresa: round ${r0}/${g.total}.`); }
    else{
      deal(); ckpt();
      await askWelcome(`Buona partita a Eggs of Ostrich, ${P(HUM).name}!`);
      logMsg(`Partita di 3 giocatori: ${EGGS.length+AMBERS} carte uovo, ${REMOVED} tolte a caso senza guardarle: si giocano ${g.total} round.`);
    }
    for(let r=r0;r<=g.total;r++){
      if(g.pl.every(p=>p.out)){ logMsg('Nessun giocatore ha più sacchi utilizzabili: la partita finisce qui.'); break; }
      ckpt();                      // punto di salvataggio: prima di scoprire la carta del round (g.round = round appena concluso)
      g.round=r; await playRound();
    }
    g.phase='over'; g.cur=null;
    g.over={winners:winnersOf(g)};
    logMsg('Punteggi finali: '+g.pl.map(p=>`${p.name} ${liveScore(p)}`).join(' · ')+'.');
    logMsg('Le carte uovo tolte a inizio partita erano: '+g.removed.map(cardName).join(' e ')+'.');
    render();
  }catch(e){
    if(e===ABORT||g!==G) return;
    console.error(e); G.log.unshift('Errore: '+e.message); render();
  }
}

// ═════════════════════════ RENDER ═════════════════════════
function dockHtml(){
  if(!G) return '';
  if(G.over){
    const w=G.over.winners.map(i=>esc(P(i).name)).join(' e ');
    return `<div class="dock-msg"><b>${G.over.winners.length>1?'Vittoria condivisa: ':'Vince '}${w}!</b> (vince il totale più alto)</div>${finalLines(G)}`;
  }
  let html=`<div class="dock-msg">${esc(G.msg)}</div>`;
  if(PR&&PR.type==='welcome'){
    html=`<div class="dock-msg"><b>${esc(PR.title)}</b></div><div class="opts"><button class="opt" data-wl="1">Ok, si parte</button></div>`;
  }else if(PR&&PR.type==='claim'){
    html+=`<div class="hint">Tocca a te: ${esc(PR.hint)}</div>`;
    if(PR.sel!=null) html+=`<div class="opts"><button class="opt" data-cf="1">Conferma: gioca ${claimName(PR.sel)}</button><button class="opt" data-cf="0">Annulla</button></div>`;
  }else if(P(HUM).out){
    html+=`<div class="hint">Hai rotto tutti i sacchi: sei fuori dalla partita, ma i punti dell'ambra restano. Gli altri due continuano.</div>`;
  }
  return html;
}
let LOGOPEN=false;
document.getElementById('app').addEventListener('toggle',e=>{ if(e.target.matches&&e.target.matches('details.log')) LOGOPEN=e.target.open; },true);
let MENUOPEN=false;
function menuHtml(){
  return `<div class="menu-wrap"><button class="hamb" type="button" data-menu="1" aria-label="Opzioni" aria-expanded="${MENUOPEN}"><svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 1h16M1 7h16M1 13h16"/></svg></button>
    ${MENUOPEN?`<div class="menu-pop">
      <label class="opt-toggle" title="Chiede conferma e permette di annullare la carta scelta"><input type="checkbox" id="optUndo" ${OPT.undo?'checked':''}> Abilita annulla</label>
    </div>`:''}</div>`;
}
function render(){
  const app=document.getElementById('app');
  const top=`<div class="topbar"><div class="logo">Eggs of <em>Ostrich</em></div>
    ${window.nyloBackBtn?nyloBackBtn('/ntt/'):""}${nyloHomeBtn()}
    ${G&&!G.over?`<span class="badge">Round ${Math.min(Math.max(G.round,1),G.total||10)}/${G.total||10}</span>`:''}

    ${menuHtml()}</div>`;
  let body='';
  if(G){
    body=`<div class="table">${centerHtml(G)}${[1,2,0].map(p=>seatHtml(G,p,{me:HUM,choose:PR&&PR.type==='claim'?PR:null})).join('')}</div>

      ${logHtml(G)}
      ${recapHtml()}
      ${RULES_HTML}`;
  }
  app.innerHTML=top+`<div class="dock">${dockHtml()}</div>`+body;
}

document.getElementById('app').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||b.disabled) return;
  if(b.dataset.menu){ MENUOPEN=!MENUOPEN; render(); return; }
  if(b.dataset.new){ if(confirm('Iniziare una nuova partita?')) toSetup(); }
  else if(b.dataset.wl!==undefined){ if(PR&&PR.type==='welcome'){ const r=PR.res; PR=null; render(); r(1); } }
  else if(b.dataset.c!==undefined) pickClaim(Number(b.dataset.c));

});
document.getElementById('app').addEventListener('change',e=>{
  if(e.target.id!=='optUndo') return;
  OPT.undo=e.target.checked;
  try{ localStorage.setItem('eggs-ostrich-undo',OPT.undo?'1':'0'); }catch(err){}

  render();
});
document.addEventListener('click',e=>{ if(MENUOPEN&&!e.target.closest('.menu-wrap')){ MENUOPEN=false; render(); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&MENUOPEN){ MENUOPEN=false; render(); } });
render();
if(window.NYLO_START&&NYLO_START.mode==='ai'){
  nyloSaveInit('eggs-of-ostrich',snap=>{ G=snap; PR=null; MENUOPEN=false; render(); run(true); });
  if(!NYLO_START.resume){ NAMES[0]=NYLO_START.name||'Tu'; newMatch(NYLO_START.n); }
}

<script type="text/plain" id="src-room">
// ═════════════════════════ EGGS OF OSTRICH · ONLINE ═════════════════════════
// Si gioca in 3 persone, senza AI. Stato = un unico oggetto JSON (S, stessa forma di G contro l'AI); ogni azione passa da gameReduce().
// Costanti e regole pure (settleRests, resolve, ...) arrivano dal blocco comune. Le carte scelte stanno nello stato ma l'interfaccia
// le mostra coperte agli altri finché non hanno scelto tutti.
var GAME={id:'eggs-of-ostrich',logo:'Eggs of <em>Ostrich</em>',counts:[3],
  lobbyNote:'Servono 3 giocatori. Quando la stanza è piena, i posti al tavolo (e i colori) vengono assegnati a caso.'};
var OPT={undo:true};
try{var _u=localStorage.getItem('eggs-ostrich-undo');if(_u!==null)OPT.undo=_u==='1'}catch(e){}
var ui={sel:null,selR:-1};
var LOGOPEN=false;

// ─────────────── REGOLE (funzioni pure, usate dentro le transazioni) ───────────────
function mkRng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function sshuffle(a,rng){for(var i=a.length-1;i>0;i--){var j=Math.floor(rng()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function newSeed(){return Math.floor(Math.random()*4294967296)}
function validSeed(x){return typeof x==='number'&&x%1===0&&x>=0&&x<4294967296}
function lg(S,t){S.log.unshift(t);if(S.log.length>160)S.log.pop()}
// scopre la carta del mazzo e apre la scelta (la carta usata il round prima va a riposo, quella ancora prima torna in mano)
function startRound(S){
  settleRests(S);
  var card=S.deck.shift();
  S.round++;S.cur=card;S.seen.push(card);S.fx={};S.revealed=false;S.rl=[];S.phase='choose';
  S.pl.forEach(function(p){p.played=null});
  lg(S,'— Round '+S.round+'/'+S.total+': '+(card.amber?'esce la carta ambra':'escono '+card.n+' uova')+' —');
}
function newGame(S,rng){
  var all=sshuffle(makeDeck(),rng);
  S.removed=all.splice(0,REMOVED);S.deck=all;S.total=S.deck.length;
  S.round=0;S.seen=[];S.amberLeft=AMBERS;S.cur=null;S.fx={};S.last='';S.rl=[];S.revealed=false;S.over=null;
  S.pl=S.names.map(function(n,i){return newPlayer(i,n)});
  lg(S,'Partita di '+S.n+' giocatori: '+(EGGS.length+AMBERS)+' carte uovo, '+REMOVED+' tolte a caso senza guardarle: si giocano '+S.total+' round.');
  startRound(S);
}
function gameInitial(players,seed){
  var names=[];
  players.forEach(function(p){var n=String(p.name||'Giocatore').slice(0,18),x=n,c=2;while(names.indexOf(x)>=0)x=n+' '+(c++);names.push(x)});
  var S={n:players.length,uids:players.map(function(p){return p.uid}),names:names,log:[],phase:'choose'};
  newGame(S,mkRng(validSeed(seed)?seed:newSeed()));
  return S;
}
function lastRound(S){return S.round>=S.total||S.pl.every(function(p){return p.out})}
function finishGame(S){
  S.phase='over';S.cur=null;
  S.over={winners:winnersOf(S)};
  lg(S,'Punteggi finali: '+S.pl.map(function(p){return p.name+' '+liveScore(p)}).join(' · ')+'.');
  lg(S,'Le carte uovo tolte a inizio partita erano: '+S.removed.map(cardName).join(' e ')+'.');
}
// ritorna il nuovo stato oppure null se l'azione non è valida
function gameReduce(S,seat,a){
  if(!a||typeof a.type!=='string'||!(seat>=0&&seat<S.n))return null;
  if(a.type==='pick'){
    var pl=S.pl[seat];
    if(S.phase!=='choose'||pl.out||pl.played!==null||!Number.isInteger(a.c)||pl.hand.indexOf(a.c)<0)return null;
    pl.played=a.c;pl.hand=pl.hand.filter(function(x){return x!==a.c});
    if(S.pl.every(function(p){return p.out||p.played!==null})){
      // l'ultima carta è stata scelta: si rivelano tutte insieme e si risolve il round
      S.revealed=true;S.phase='reveal';
      var lines=resolve(S);S.rl=lines.slice();
      lines.forEach(function(l){lg(S,l)});
    }
    return S;
  }
  if(a.type==='next'){
    // a.round evita il doppio avanzamento se due giocatori premono insieme
    if(S.phase!=='reveal'||a.round!==S.round)return null;
    if(lastRound(S)){
      if(S.pl.every(function(p){return p.out}))lg(S,'Nessun giocatore ha più sacchi utilizzabili: la partita finisce qui.');
      finishGame(S);
    }else startRound(S);
    return S;
  }
  if(a.type==='rematch'){
    if(S.phase!=='over'||!validSeed(a.seed))return null;
    lg(S,'— Rivincita —');
    newGame(S,mkRng(a.seed));return S;
  }
  return null;
}

// ─────────────── INTERFACCIA ───────────────
function ordSeats(){var o=[],i;for(i=1;i<S.n;i++)o.push((me+i)%S.n);o.push(me);return o}   // gli altri sopra, tu in basso
function myChoose(){
  if(S.phase!=='choose')return null;
  var pl=S.pl[me];
  if(pl.out||pl.played!==null)return null;
  return {legal:new Set(pl.hand),sel:ui.sel};
}
function waitNames(){return S.pl.filter(function(p){return !p.out&&p.played===null}).map(function(p){return esc(p.name)})}
function dockH(ch){
  var pl=S.pl[me],h;
  if(S.phase==='over'){
    var w=S.over.winners.map(function(i){return esc(S.names[i])}).join(' e ');
    return '<div class="dock-msg"><b>'+(S.over.winners.length>1?'Vittoria condivisa: ':'Vince ')+w+'!</b> (vince il totale più alto)</div>'+finalLines(S)+
      '<div class="opts"><button class="opt" data-rematch="1">Rivincita</button></div>';
  }
  if(S.phase==='reveal'){
    return '<div class="dock-msg"><b>'+esc(S.rl[0])+'</b></div><div class="fin">'+S.rl.slice(1).map(function(l){return '<div>'+esc(l)+'</div>'}).join('')+'</div>'+
      '<div class="opts"><button class="opt" data-next="1">'+(lastRound(S)?'Mostra risultato finale':'Prossimo round')+'</button></div>';
  }
  h='<div class="dock-msg">'+(ch?esc(chooseMsg(S.cur)):esc(drawMsg(S.cur)))+'</div>';
  if(ch){
    h+='<div class="hint">Tocca a te: '+esc(claimHint(S.cur,pl.rest))+'</div>';
    if(ch.sel!==null)h+='<div class="opts"><button class="opt" data-cf="1">Conferma: gioca '+claimName(ch.sel)+'</button><button class="opt" data-cf="0">Annulla</button></div>';
  }else if(pl.out){
    h+='<div class="hint">Hai rotto tutti i sacchi: sei fuori dalla partita, ma i punti dell\'ambra restano. Gli altri continuano.</div>';
  }else{
    var w2=waitNames();
    h+='<div class="hint">Hai scelto '+claimName(pl.played)+'. Si rivelano insieme quando hanno scelto tutti'+(w2.length?': aspetto '+w2.join(' e ')+'.':'.')+'</div>';
  }
  return h;
}
function gameBadge(){return S.phase==='over'?'':'Round '+Math.min(Math.max(S.round,1),S.total)+'/'+S.total}
function gameMenu(){
  return '<label class="opt-toggle" title="Chiede conferma e permette di annullare la carta scelta"><input type="checkbox" id="optUndo" '+(OPT.undo?'checked':'')+'> Abilita annulla</label>';
}
function gameChange(e){
  if(e.target.id==='optUndo'){OPT.undo=e.target.checked;try{localStorage.setItem('eggs-ostrich-undo',OPT.undo?'1':'0')}catch(x){}if(!OPT.undo)ui.sel=null;render()}
}
function gameRender(){
  if(ui.selR!==S.round){ui.sel=null;ui.selR=S.round}
  var ch=myChoose();
  if(ui.sel!==null&&!(ch&&ch.legal.has(ui.sel))){ui.sel=null;if(ch)ch.sel=null}
  var lb=document.querySelector('.logbody'),lbTop=lb?lb.scrollTop:0;
  if(lbTop)setTimeout(function(){var n=document.querySelector('.logbody');if(n)n.scrollTop=lbTop},0);
  var v={me:me,choose:ch,pick:true};
  return '<div class="dock">'+dockH(ch)+'</div>'+
    '<div class="table">'+centerHtml(S)+ordSeats().map(function(p){return seatHtml(S,p,v)}).join('')+'</div>'+
    '<div class="dock" style="position:static">'+scoreTable(S)+'</div>'+
    logHtml(S)+recapHtml()+RULES_HTML;
}
function gameClick(b){
  var d=b.dataset;
  if(d.c!==undefined){
    var c=Number(d.c),ch=myChoose();
    if(ch&&ch.legal.has(c)){if(OPT.undo){ui.sel=ui.sel===c?null:c;render()}else act({type:'pick',c:c})}
  }
  else if(d.cf!==undefined){
    if(d.cf==='1'){if(ui.sel!==null&&myChoose()){var c2=ui.sel;ui.sel=null;act({type:'pick',c:c2})}}
    else{ui.sel=null;render()}
  }
  else if(d.next!==undefined)act({type:'next',round:S.round});
  else if(d.rematch!==undefined)act({type:'rematch',seed:newSeed()});
}
document.getElementById('app').addEventListener('toggle',function(e){if(e.target.matches&&e.target.matches('details.log'))LOGOPEN=e.target.open},true);

var SAVE_KEY=GAME.id+'-online-last';
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var rnd=function(n){return Math.floor(Math.random()*n)};
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t}return a}
function getPlayerName(){
  var name='';
  try{
    name=localStorage.getItem('nylo-player-name')||'';
    if(!name){var last=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');name=last&&last.name||''}
  }catch(e){}
  return String(name||'Giocatore').trim().slice(0,18)||'Giocatore';
}
var playerName=getPlayerName();
var db=null,user=null,roomRef=null,roomCode='',lobbyData=null,S=null,me=-1,listeners=[],startingGame=false;
var statusText='',connText='',joinVal='',chosenCount=GAME.counts[0],MENUOPEN=false,connecting=false;
try{var lastRoom=JSON.parse(localStorage.getItem(SAVE_KEY));if(lastRoom)joinVal=lastRoom.code||''}catch(e){}

function setStatus(t){statusText=t;render()}
function setConn(t){connText=t;var c=document.getElementById('conn');if(c)c.textContent=t}
function showErr(t){
  var e=document.getElementById('err');
  if(!e){e=document.createElement('div');e.id='err';e.className='err';e.setAttribute('role','alert');document.body.appendChild(e)}
  e.textContent=t;e.hidden=false;setConn('Errore');clearTimeout(showErr.t);showErr.t=setTimeout(function(){e.hidden=true},8000);
}
function genCode(){var b=new Uint8Array(12);crypto.getRandomValues(b);return Array.from(b,function(x){return ALPHABET[x%ALPHABET.length]}).join('')}
function withTimeout(p,ms,msg){
  return new Promise(function(res,rej){var t=setTimeout(function(){rej(new Error(msg))},ms);p.then(function(v){clearTimeout(t);res(v)},function(e){clearTimeout(t);rej(e)})});
}
function authMsg(e){
  if(e.code==='auth/operation-not-allowed')return 'Attiva il provider Anonimo in Firebase Authentication.';
  if(e.code==='auth/unauthorized-domain')return 'Dominio non autorizzato: aggiungilo in Authentication > Impostazioni > Domini autorizzati.';
  if(e.code==='auth/network-request-failed')return 'Firebase non raggiungibile: controlla la connessione e che il sito sia in HTTPS.';
  return e.message||'Errore di autenticazione Firebase.';
}
async function connect(){
  if(!window.firebase)throw new Error('Firebase non caricato. Controlla la connessione.');
  if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
  db=firebase.database();
  if(user)return;
  try{user=(await withTimeout(firebase.auth().signInAnonymously(),15000,'Autenticazione scaduta dopo 15 secondi.')).user}
  catch(e){throw new Error(authMsg(e))}
}
function saveLast(name){try{localStorage.setItem(SAVE_KEY,JSON.stringify({code:roomCode,name:name}))}catch(e){}}

// ─────────────── LOBBY ───────────────
async function createRoom(){
  try{
    setStatus('Connessione a Firebase...');await connect();
    var created=false,lastErr=null;
    for(var i=0;i<5&&!created;i++){
      roomCode=genCode();roomRef=db.ref('rooms/'+roomCode);
      try{
        await roomRef.child('hostUid').set(user.uid);
        await roomRef.child('members/'+user.uid).set(true);
        await roomRef.child('lobby').set({game:GAME.id,hostUid:user.uid,playerCount:chosenCount,started:false,closed:false,players:{}});
        created=true;
      }catch(e){lastErr=e;roomRef=null}
    }
    if(!created)throw lastErr||new Error('Impossibile creare la stanza. Verifica le regole del database.');
    await reserveSeat(playerName);
  }catch(e){roomRef=null;connecting=false;setStatus(e.message||'Errore durante la creazione della stanza.')}
}
async function joinRoom(){
  try{
    roomCode=joinVal.toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(roomCode.length!==12)throw new Error('Il codice stanza è di 12 caratteri.');
    setStatus('Connessione...');await connect();
    roomRef=db.ref('rooms/'+roomCode);
    await roomRef.child('members/'+user.uid).set(true);
    await reserveSeat(playerName);
  }catch(e){roomRef=null;connecting=false;setStatus(e.code==='PERMISSION_DENIED'?'Stanza non trovata o non accessibile.':(e.message||'Errore durante l\'accesso alla stanza.'))}
}
function reserveSeat(name){
  var lobbyRef=roomRef.child('lobby');
  return lobbyRef.once('value').then(function(snap){
    if(!snap.exists())throw new Error('Lobby non trovata: controlla il codice.');
    var initial=snap.val();
    if(initial.game!==GAME.id)throw new Error('Questo codice appartiene a un altro gioco.');
    return new Promise(function(resolve,reject){
      lobbyRef.transaction(function(cur){
        if(cur===null)cur=initial;
        if(!cur||!cur.playerCount||cur.closed)return;
        cur.players=cur.players||{};
        if(cur.players[user.uid])return cur;            // rientro: il posto è già tuo
        if(cur.started)return;
        var occ={};Object.keys(cur.players).forEach(function(u){occ[cur.players[u].seat]=true});
        var seat=1;while(seat<=cur.playerCount&&occ[seat])seat++;
        if(seat>cur.playerCount)return;
        cur.players[user.uid]={uid:user.uid,name:name,seat:seat};
        return cur;
      },function(err,committed,snap2){
        if(err){reject(err);return}
        var cur=snap2&&snap2.val();
        if(!cur||!cur.players||!cur.players[user.uid]){
          reject(new Error(cur&&cur.started?'La partita è già iniziata.':'La stanza è piena o non disponibile.'));return;
        }
        lobbyData=cur;saveLast(name);enterRoom();resolve();
      },false);
    });
  });
}
function orderedPlayers(d){
  return Object.keys(d.players||{}).map(function(u){return d.players[u]}).sort(function(a,b){return a.seat-b.seat});
}
function maybeStart(){
  if(!lobbyData||S||startingGame||lobbyData.started||lobbyData.hostUid!==user.uid)return;
  if(orderedPlayers(lobbyData).length===lobbyData.playerCount)startGame();
}
function startGame(){
  startingGame=true;
  var seated=orderedPlayers(lobbyData);   // i posti si assegnano a caso all'avvio
  shuffle(seated);
  var init=gameInitial(seated.map(function(p){return {uid:p.uid,name:p.name}}));
  init.v=0;
  roomRef.child('state').transaction(function(cur){if(cur!==null)return;return {v:0,s:JSON.stringify(init)}},function(err){
    if(err){startingGame=false;showErr('Errore durante l\'avvio: '+err.message);return}
    roomRef.child('lobby/started').set(true).catch(function(e){startingGame=false;showErr(e.message)});
  },false);
}

// ─────────────── STANZA ───────────────
function enterRoom(){
  setConn('Lobby');
  var lobbyRef=roomRef.child('lobby');
  var lh=function(snap){if(!snap.exists())return;lobbyData=snap.val();if(!S){render();maybeStart()}};
  lobbyRef.on('value',lh,function(e){showErr(e.message)});listeners.push({ref:lobbyRef,h:lh});
  var stateRef=roomRef.child('state');
  var sh=function(snap){
    if(!snap.exists())return;
    var raw=snap.val();
    try{S=JSON.parse(raw.s)}catch(e){showErr('Stato della stanza non leggibile.');return}
    me=S.uids.indexOf(user.uid);
    if(me<0){showErr('Non risulti tra i giocatori di questa partita.');return}
    setConn('Connesso');
    render();
  };
  stateRef.on('value',sh,function(e){showErr('Connessione persa: '+e.message)});listeners.push({ref:stateRef,h:sh});
  render();
}
function leave(dest){
  var go=function(){if(dest)window.location.href=dest;else window.location.reload()};
  listeners.forEach(function(l){l.ref.off('value',l.h)});
  if(!roomRef||S||!user){go();return}
  // prima dell'inizio libera il posto; a partita avviata si può rientrare con lo stesso codice
  roomRef.child('lobby').transaction(function(cur){
    if(!cur||cur.started)return;
    cur.players=cur.players||{};delete cur.players[user.uid];
    var rest=orderedPlayers(cur);
    if(cur.hostUid===user.uid&&rest.length)cur.hostUid=rest[0].uid;
    return cur;
  },function(){
    roomRef.child('members/'+user.uid).remove().catch(function(){}).then(go);
  },false);
}

// azioni: ogni azione è una transazione sullo stato, validata da gameReduce() sull'ultima versione
function act(a){
  if(!roomRef||me<0)return;
  var seat=me;
  roomRef.child('state').transaction(function(cur){
    if(!cur||!cur.s)return;
    var st;try{st=JSON.parse(cur.s)}catch(e){return}
    var r=gameReduce(st,seat,a);
    if(!r)return;
    r.v=(st.v||0)+1;
    return {v:r.v,s:JSON.stringify(r)};
  },function(err,committed){
    if(err)showErr('Errore di sincronizzazione: '+err.message);
    else if(!committed)setConn('Azione non più valida');
  },false);
}

// ─────────────── RENDER ───────────────
function lobbyHtml(){
  var radios=GAME.counts.length<2?'':GAME.counts.map(function(n){
    return '<label><input type="radio" name="pc" value="'+n+'" '+(chosenCount===n?'checked':'')+'> '+n+' giocatori'+(GAME.countNote&&GAME.countNote[n]?' · '+GAME.countNote[n]:'')+'</label>';
  }).join('');
  return '<section><p class="muted">Sei connesso come <b>'+esc(playerName)+'</b>.</p>'+
    '<div class="panel"><h2>Crea una stanza</h2><p class="muted">'+GAME.lobbyNote+'</p>'+
    (radios?'<div class="radios" role="radiogroup" aria-label="Numero di giocatori">'+radios+'</div>':'')+
    '<button class="opt" id="createRoom" type="button" data-create="1">Crea stanza</button></div>'+
    '<div class="panel"><h2>Unisciti a una stanza</h2>'+
    '<input type="text" id="joinCode" maxlength="12" placeholder="Codice stanza" autocomplete="off" value="'+esc(joinVal)+'">'+
    '<button class="opt" type="button" data-join="1">Unisciti</button></div>'+
    '<p class="status" role="status" aria-live="polite">'+esc(statusText)+'</p>'+
    '<button class="btn btn-sm" type="button" data-ai="1">← Torna alla scelta</button></section>';
}
function connectingHtml(){
  return '<section><div class="panel"><p class="muted" role="status" aria-live="polite">'+esc(statusText||'Connessione alla stanza...')+'</p></div></section>';
}
function waitingHtml(){
  var d=lobbyData||{players:{},playerCount:GAME.counts[0]};
  var players=orderedPlayers(d),full=players.length===d.playerCount,html='';
  for(var seat=1;seat<=d.playerCount;seat++){
    var p=players[seat-1];
    html+='<li><span class="seat-n">'+seat+'.</span>'+
      (p?'<span class="grow">'+esc(p.name)+(p.uid===user.uid?' (tu)':'')+'</span>':'<span class="grow soft">In attesa di un giocatore</span>')+
      (p&&p.uid===d.hostUid?'<span class="flag first">HOST</span>':'')+'</li>';
  }
  return '<section><div class="panel"><h2>Stanza '+roomCode+'</h2><p class="muted">'+
    (d.started?'La partita si sta caricando...':players.length+' / '+d.playerCount+' giocatori'+(full?' · avvio in corso':' · condividi il codice con gli altri'))+
    '</p><ul class="roster">'+html+'</ul></div></section>';
}
function kitMenuHtml(){
  var extra=typeof gameMenu==='function'?gameMenu():'';
  return '<div class="menu-wrap"><button class="hamb" type="button" data-menu="1" aria-label="Opzioni" aria-expanded="'+MENUOPEN+'"><svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 1h16M1 7h16M1 13h16"/></svg></button>'+
    (MENUOPEN?'<div class="menu-pop">'+extra+'</div>':'')+'</div>';
}
function render(){
  document.body.classList.toggle('a11y',!!(typeof OPT!=='undefined'&&OPT.a11y));
  var focus=document.activeElement&&document.activeElement.id==='joinCode';
  var badge=S&&typeof gameBadge==='function'?gameBadge():'';
  var top='<div class="topbar"><div class="logo">'+GAME.logo+'</div>'+
    (window.nyloBackBtn?nyloBackBtn(location.pathname,'alle opzioni del gioco'):'')+(window.nyloHomeBtn?nyloHomeBtn():'')+
    (badge?'<span class="badge">'+badge+'</span>':'')+kitMenuHtml()+'</div>'+
    (roomRef?'<div class="room-bar"><span class="room-code">'+roomCode+'</span><button class="btn btn-sm" type="button" data-copy="1">Copia codice</button><button class="btn btn-sm" type="button" data-leave="1">Esci</button><span class="conn" id="conn">'+esc(connText)+'</span></div>':'');
  var body=!roomRef?(connecting?connectingHtml():lobbyHtml()):(!S?waitingHtml():gameRender());
  document.getElementById('app').innerHTML=top+body;
  if(focus){var j=document.getElementById('joinCode');if(j){j.focus();j.setSelectionRange(j.value.length,j.value.length)}}
}
var APP=document.getElementById('app');
APP.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b||b.disabled)return;
  var d=b.dataset;
  if(d.back!==undefined){e.stopPropagation();if(!S||confirm('Tornare alle opzioni del gioco? Potrai rientrare nella stanza con lo stesso codice.'))leave(location.pathname);return}
  if(d.menu){MENUOPEN=!MENUOPEN;render();return}
  if(d.ai!==undefined){location.href=location.pathname;return}
  if(d.create!==undefined){createRoom();return}
  if(d.join!==undefined){joinRoom();return}
  if(d.leave!==undefined){if(!S||confirm('Uscire dalla stanza? Potrai rientrare con lo stesso codice.'))leave();return}
  if(d.copy!==undefined){
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(roomCode).then(function(){setConn('Codice copiato')});
    else window.prompt('Copia il codice stanza:',roomCode);
    return;
  }
  if(S&&typeof gameClick==='function')gameClick(b);
});
APP.addEventListener('input',function(e){if(e.target.id==='joinCode'){joinVal=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'');e.target.value=joinVal}});
APP.addEventListener('keydown',function(e){if(e.target.id==='joinCode'&&e.key==='Enter')joinRoom()});
APP.addEventListener('change',function(e){
  if(e.target.name==='pc'){chosenCount=Number(e.target.value);return}
  if(typeof gameChange==='function')gameChange(e);
});
document.addEventListener('click',function(e){if(MENUOPEN&&!e.target.closest('.menu-wrap')){MENUOPEN=false;render()}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&MENUOPEN){MENUOPEN=false;render()}});
connecting=!!(window.NYLO_START&&NYLO_START.mode==='room');
render();
if(window.NYLO_START&&NYLO_START.mode==='room'){chosenCount=NYLO_START.n||chosenCount;if(NYLO_START.name)playerName=NYLO_START.name.slice(0,18);if(NYLO_START.action==='join'){joinVal=NYLO_START.code||'';joinRoom()}else createRoom();}
</script>
<script>
(function(){
  run('src-common');
  var P=window.NYLO_SETUP={id:'eggs-of-ostrich',logo:'Eggs of <em>Ostrich</em>',counts:[3]};
  var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  function run(id){var s=document.createElement('script');s.textContent=document.getElementById(id).textContent;document.body.appendChild(s)}
  window.addEventListener('hashchange',function(){location.reload()});
  window.NYLO_IN_SETUP=true;   // finché si sceglie, Home/Indietro escono senza avviso
  var app=document.getElementById('app');
  var st={n:P.counts[0],mode:location.hash==='#stanze'?'room':(location.hash==='#ai'?'ai':''),sub:'',code:'',name:'',see:false};
  var needName=false;
  try{
    st.name=localStorage.getItem('nylo-player-name')||'';
    var last=JSON.parse(localStorage.getItem(P.id+'-online-last')||'null');if(last&&last.code)st.code=last.code;
  }catch(e){}
  needName=!st.name;   // il nome arriva dalla sessione; il campo compare solo se manca
  // accesso rapido dalla home: #join=CODICE apre direttamente la stanza
  var jm=/^#join=([A-Za-z0-9]{12})$/.exec(location.hash);
  if(jm){st.mode='room';st.sub='join';st.code=jm[1].toUpperCase()}
  // #resume (dal pulsante Riprendi della lista): se c'è una partita salvata di questo gioco si rientra direttamente
  var rsm=null;
  if(location.hash==='#resume'){try{var sd=window.nyloSaveData&&nyloSaveData(P.id);if(sd){var sg=JSON.parse(sd);if(sg&&sg.n)rsm={n:sg.n}}}catch(e){}}
  function btn(attrs,cls,label,on){return '<button type="button" class="sx-opt '+cls+(on?' on':'')+'" '+attrs+'>'+label+'</button>'}
  function draw(){
    var h='<div class="topbar"><div class="logo">'+P.logo+'</div><div class="sx-nav">'+(window.nyloBackBtn?nyloBackBtn('/ntt/'):'')+(window.nyloHomeBtn?nyloHomeBtn():'')+'</div></div>';
    h+='<div class="sx-card">';
    if(needName)h+='<label class="sx-label" for="sxName">IL TUO NOME</label><input class="sx-in" id="sxName" maxlength="16" placeholder="Il tuo nome" autocomplete="off" value="'+esc(st.name)+'">';
    if(P.counts.length>1){
      h+='<div class="sx-label">GIOCATORI</div><div class="sx-row">'+P.counts.map(function(n){return btn('data-n="'+n+'"','',n+' giocatori',st.n===n)}).join('')+'</div>';
    }
    h+='<div class="sx-label">MODALITÀ</div><div class="sx-row">'+btn('data-mode="ai"','','Contro l’AI',st.mode==='ai')+btn('data-mode="room"','','A stanze',st.mode==='room')+'</div>';
    if(st.mode==='ai'){
      h+='<div class="sx-sub"><div class="sx-row">'+btn('data-go="ai"','sx-go','Inizia',false)+'</div></div>';
    }else if(st.mode==='room'){
      h+='<div class="sx-label">OPZIONI STANZA</div><div class="sx-sub"><div class="sx-row">'+btn('data-sub="create"','','Crea nuova',st.sub==='create')+btn('data-sub="join"','','Unisciti',st.sub==='join')+'</div>';
      if(st.sub==='create')h+='<div class="sx-row">'+btn('data-go="create"','sx-go','Inizia',false)+'</div>';
      if(st.sub==='join')h+='<input class="sx-in code" id="sxCode" maxlength="12" placeholder="Codice stanza" autocomplete="off" value="'+esc(st.code)+'"><div class="sx-row"><button type="button" class="sx-opt sx-go" id="sxJoin" data-go="join" '+(st.code.length===12?'':'disabled')+'>Inizia</button></div>';
      h+='</div>';
    }
    h+='</div>';
    app.innerHTML=h;
  }
  function loadRoom(){
    var libs=['app','auth','database'].map(function(n){return 'https://www.gstatic.com/firebasejs/10.12.2/firebase-'+n+'-compat.js'});
    (function next(i){
      if(i===libs.length){run('src-room');return}
      var s=document.createElement('script');s.src=libs[i];s.onload=function(){next(i+1)};
      s.onerror=function(){app.innerHTML='<p style="padding:20px;color:#fff">Firebase non raggiungibile: controlla la connessione.</p>'};
      document.head.appendChild(s);
    })(0);
  }
  function go(kind){
    var nm=document.getElementById('sxName'),name=((nm&&nm.value)||st.name||'').trim().slice(0,16);
    window.NYLO_IN_SETUP=false;
    if(name){try{localStorage.setItem('nylo-player-name',name)}catch(e){}}
    var cfg={name:name,n:st.n};
    if(kind==='ai'){cfg.mode='ai';window.NYLO_START=cfg;run('src-ai');return}
    cfg.mode='room';cfg.action=kind;if(kind==='join')cfg.code=st.code;
    window.NYLO_START=cfg;app.innerHTML='';loadRoom();
  }
  app.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b||b.disabled)return;
    var d=b.dataset;
    if(d.n){st.n=Number(d.n);draw()}
    else if(d.mode){st.mode=d.mode;st.sub='';draw()}
    else if(d.sub){st.sub=d.sub;draw();var c=document.getElementById('sxCode');if(c)c.focus()}
    else if(d.go)go(d.go);
  });
  app.addEventListener('input',function(e){
    if(e.target.id==='sxName')st.name=e.target.value;
    else if(e.target.id==='sxCode'){
      st.code=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'');e.target.value=st.code;
      var j=document.getElementById('sxJoin');if(j)j.disabled=st.code.length!==12;
    }
  });
  app.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='sxCode'&&st.code.length===12)go('join')});
  if(rsm){window.NYLO_IN_SETUP=false;window.NYLO_START={mode:'ai',name:st.name,n:rsm.n,resume:true};run('src-ai');return}
  draw();
  if(jm&&!needName){try{history.replaceState(null,'',location.pathname+'#stanze')}catch(e){}go('join')}
})();
</script>
