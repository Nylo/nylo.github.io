<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Gachapon Trick — Counter v2</title>
<style>
  :root{
    --red:#d91f2b; --red-dark:#a91520; --felt:#202126; --panel:#2a2b31;
    --ink:#171717; --muted:#8f929a; --green:#39b86a; --green-dark:#1d7e45;
    --gray:#b9bbc0; --gray-dark:#8b8e95; --white:#fff; --gold:#e5c04a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:var(--felt);font-family:Arial,Helvetica,sans-serif;color:#f5f5f5;overscroll-behavior:none}
  button,input,select{font:inherit}
  button{cursor:pointer;touch-action:manipulation}
  .app{min-height:100dvh;padding:12px;display:flex;flex-direction:column;gap:12px}
  .topbar{position:sticky;top:0;z-index:20;background:rgba(32,33,38,.96);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 2px 4px}
  .brand{font-weight:900;letter-spacing:.04em;font-size:clamp(16px,3vw,24px)}
  .round{font-size:12px;color:#c9cbd0;text-align:center}
  .round strong{display:block;color:#fff;font-size:15px}
  .top-actions{display:flex;gap:7px}
  .btn{border:0;border-radius:10px;padding:9px 12px;font-weight:800;font-size:12px;color:#fff;background:#4b4e57;box-shadow:0 2px 0 rgba(0,0,0,.25)}
  .btn:active{transform:translateY(1px)}
  .btn-new{background:var(--green-dark)}
  .btn-reset{background:#8e2f37}
  #players{display:grid;grid-template-columns:repeat(var(--cols,1),minmax(0,1fr));gap:12px;align-items:start}
  .player-card{background:#f8f8f8;color:var(--ink);border-radius:16px;overflow:hidden;box-shadow:0 5px 18px rgba(0,0,0,.35);min-width:0}
  .player-head{padding:11px 12px 9px;display:grid;grid-template-columns:1fr auto;gap:5px 10px;align-items:center;border-bottom:1px solid #ddd}
  .player-name{font-weight:900;font-size:clamp(15px,2.6vw,22px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .money{text-align:right;font-size:clamp(18px,3vw,25px);font-weight:900;white-space:nowrap}
  .money small{font-size:.58em;color:#777;font-weight:800}
  .pv-row{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .round-pv{font-size:12px;color:#666;font-weight:800}.total-pv{font-size:13px;color:#222;font-weight:900}.total-pv span{font-size:20px;color:var(--red)}
  .grid-wrap{padding:8px;background:#eee}
  .toy-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:#d8d8d8;padding:4px;border-radius:10px}
  .cell{position:relative;aspect-ratio:1;background:#fff;border:1px solid #e4e4e4;border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:3px;transition:.12s;min-width:0}
  .cell img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
  .cell.available:hover{box-shadow:inset 0 0 0 2px #aaa}
  .cell.mine{background:#4fe27f;border-color:#198d4c;box-shadow:inset 0 0 0 2px rgba(16,101,50,.35)}
  .cell.taken{background:#c8c9cc;filter:grayscale(.2);cursor:not-allowed;opacity:.75}
  .cell .yen{position:absolute;right:3px;bottom:2px;font-size:clamp(7px,1.1vw,10px);font-weight:900;color:#333;background:rgba(255,255,255,.78);border-radius:4px;padding:1px 2px;line-height:1}
  .cell.mine .yen{background:rgba(255,255,255,.82)}
  .legend{padding:8px 10px 11px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:10px;color:#777}
  .legend span{display:flex;align-items:center;gap:4px}.dot{width:10px;height:10px;border-radius:3px;border:1px solid #aaa;background:#fff}.dot.g{background:#4fe27f;border-color:#198d4c}.dot.x{background:#c8c9cc}
  .score-breakdown{padding:0 10px 11px;font-size:11px;color:#666;display:flex;gap:8px;flex-wrap:wrap}.score-breakdown b{color:#222}
  .empty{padding:35px;text-align:center;color:#aaa}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;display:none;align-items:center;justify-content:center;padding:18px}
  .overlay.open{display:flex}
  .modal{width:min(560px,100%);background:#f7f7f7;color:#171717;border-radius:20px;box-shadow:0 20px 70px rgba(0,0,0,.5);padding:20px}
  .modal h1{margin:0 0 5px;font-size:22px}.modal p{margin:0 0 18px;color:#666;font-size:13px;line-height:1.4}
  .player-setup{display:grid;gap:10px}
  .setup-row{display:grid;grid-template-columns:100px 105px 1fr;gap:8px;align-items:center}
  .setup-row label{font-weight:900;font-size:13px}.setup-row select,.setup-row input{height:40px;border:1px solid #c9c9c9;border-radius:9px;padding:0 10px;background:#fff;min-width:0}.setup-row select:disabled{color:#555;background:#eee}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.primary{background:var(--red);color:#fff;border:0;border-radius:10px;padding:11px 17px;font-weight:900}.secondary{background:#ddd;color:#222;border:0;border-radius:10px;padding:11px 17px;font-weight:900}
  .confirm-text{font-size:15px;line-height:1.45;margin:6px 0 0}
  @media(min-width:720px){#players{--cols:2}.player-card{max-width:none}}
  @media(min-width:1180px){#players{--cols:4}.app{padding:14px 18px}.toy-grid{gap:5px}}
  @media(max-width:650px){.topbar{align-items:flex-start}.brand{max-width:145px}.top-actions .btn{padding:8px 9px}.setup-row{grid-template-columns:78px 92px 1fr}.app{padding:8px}.player-head{padding:9px}.grid-wrap{padding:6px}.toy-grid{gap:3px;padding:3px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">GACHAPON TRICK</div>
    <div class="round">ROUND <strong id="roundLabel">1 / 3</strong></div>
    <div class="top-actions">
      <button class="btn btn-new" id="newRoundBtn">Nuovo round</button>
      <button class="btn btn-reset" id="resetBtn">Reset</button>
    </div>
  </header>
  <main id="players"></main>
</div>

<div class="overlay open" id="setupOverlay">
  <div class="modal">
    <h1>Nuova partita</h1>
    <p>Imposta i giocatori. I primi tre sono sempre presenti; il quarto può essere attivo oppure assente.</p>
    <div class="player-setup">
      <div class="setup-row"><label>Giocatore 1</label><select disabled><option>Presente</option></select><input id="name1" maxlength="18" placeholder="Nome"></div>
      <div class="setup-row"><label>Giocatore 2</label><select disabled><option>Presente</option></select><input id="name2" maxlength="18" placeholder="Nome"></div>
      <div class="setup-row"><label>Giocatore 3</label><select disabled><option>Presente</option></select><input id="name3" maxlength="18" placeholder="Nome"></div>
      <div class="setup-row"><label>Giocatore 4</label><select id="status4"><option>Attivo</option><option>Assente</option></select><input id="name4" maxlength="18" placeholder="Nome"></div>
    </div>
    <div class="modal-actions"><button class="primary" id="startBtn">Inizia partita</button></div>
  </div>
</div>

<div class="overlay" id="confirmOverlay">
  <div class="modal">
    <h1 id="confirmTitle">Conferma</h1>
    <p class="confirm-text" id="confirmText"></p>
    <div class="modal-actions"><button class="secondary" id="confirmNo">Annulla</button><button class="primary" id="confirmYes">Conferma</button></div>
  </div>
</div>

  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function makeEmptyCards(){return Array.from({length:49},function(){return null;})}
  function newState(players){return {players:players.map(function(name){return {name:name,money:START_MONEY,roundPV:0,totalPV:0,cards:makeEmptyCards()};}),round:1,maxRounds:players.length}}
  function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){}}
  function load(){try{var s=JSON.parse(localStorage.getItem(STORAGE));if(s&&s.players&&s.players.length>=3&&s.players.length<=4)return s}catch(e){}return null}
  function ownerOf(cardId){for(var p=0;p<state.players.length;p++)if(state.players[p].cards[cardId])return p;return null}
  function calcPV(p){
    var counts=Array(7).fill(0), yen=0;
    p.cards.forEach(function(v,id){if(v){var r=Math.floor(id/7),c=id%7,t=(c-r+7)%7;counts[t]++;yen+=VALUES[c]}});
    var set=counts.reduce(function(a,n){return a+n*n},0);
    return {set:set,yen:Math.floor(yen/200),total:set+Math.floor(yen/200)};
  }
  function refreshPlayerPV(p){var x=calcPV(p);p.roundPV=x.total;return x}
  function render(){
    document.documentElement.style.setProperty('--cols',state.players.length);
    document.getElementById('roundLabel').textContent=state.round+' / '+state.maxRounds;
    var root=document.getElementById('players');root.innerHTML='';
    state.players.forEach(function(p,pi){
      var pv=calcPV(p);p.roundPV=pv.total;
      var card=document.createElement('section');card.className='player-card';
      var head=document.createElement('div');head.className='player-head';
      head.innerHTML='<div class="player-name">'+esc(p.name||('Giocatore '+(pi+1)))+'</div><div class="money">'+p.money.toLocaleString('it-IT')+'<small> ¥</small></div><div class="pv-row"><span class="round-pv">PV round: <b>'+pv.total+'</b></span><span class="total-pv">Totale PV: <span>'+p.totalPV+'</span></span></div>';
      card.appendChild(head);
      var wrap=document.createElement('div');wrap.className='grid-wrap';
      var grid=document.createElement('div');grid.className='toy-grid';
      for(var r=0;r<7;r++)for(var c=0;c<7;c++){
        var id=r*7+c, owner=ownerOf(id), cell=document.createElement('button');cell.className='cell';cell.type='button';
        var img=document.createElement('img');img.src=IMAGES[id];img.alt=TYPE_LABELS[(c-r+7)%7]+' '+VALUES[c]+' Yen';cell.appendChild(img);
        var yen=document.createElement('span');yen.className='yen';yen.textContent='¥'+VALUES[c];cell.appendChild(yen);
        if(owner===null){cell.classList.add('available');cell.addEventListener('click',function(id,pi){return function(){takeCard(pi,id)}}(id,pi))}
        else if(owner===pi){cell.classList.add('mine');cell.addEventListener('click',function(id,pi){return function(){releaseCard(pi,id)}}(id,pi))}
        else{cell.classList.add('taken');cell.disabled=true}
        grid.appendChild(cell);
      }
      wrap.appendChild(grid);card.appendChild(wrap);
      var breakdown=document.createElement('div');breakdown.className='score-breakdown';breakdown.innerHTML='<span>Set: <b>'+pv.set+'</b></span><span>Yen/200: <b>'+pv.yen+'</b></span><span>Carte: <b>'+p.cards.filter(Boolean).length+'</b></span>';
      card.appendChild(breakdown);
      var legend=document.createElement('div');legend.className='legend';legend.innerHTML='<span><i class="dot g"></i> mio</span><span><i class="dot"></i> disponibile</span><span><i class="dot x"></i> altro giocatore</span>';
      card.appendChild(legend);root.appendChild(card);
    });
    document.getElementById('newRoundBtn').disabled=state.round>=state.maxRounds;
    document.getElementById('newRoundBtn').style.opacity=state.round>=state.maxRounds?.45:1;
  }
  function takeCard(pi,id){
    var p=state.players[pi],value=VALUES[id%7];
    if(ownerOf(id)!==null)return;
    if(p.money<value){alert('Soldi insufficienti per questo gachapon.');return}
    p.cards[id]=true;p.money-=value;refreshPlayerPV(p);save();render();
  }
  function releaseCard(pi,id){
    var p=state.players[pi];if(!p.cards[id])return;p.cards[id]=false;p.money+=VALUES[id%7];refreshPlayerPV(p);save();render();
  }
  function ask(title,text,fn){document.getElementById('confirmTitle').textContent=title;document.getElementById('confirmText').textContent=text;confirmAction=fn;document.getElementById('confirmOverlay').classList.add('open')}
  function closeConfirm(){confirmAction=null;document.getElementById('confirmOverlay').classList.remove('open')}
  document.getElementById('confirmNo').onclick=closeConfirm;
  document.getElementById('confirmYes').onclick=function(){var fn=confirmAction;closeConfirm();if(fn)fn()};
  document.getElementById('resetBtn').onclick=function(){ask('Reset partita','Vuoi davvero resettare la partita? Il reset impatterà tutti i giocatori, tutti i gachapon, i PV e il round corrente.',function(){localStorage.removeItem(STORAGE);state=null;document.getElementById('setupOverlay').classList.add('open');})};
  document.getElementById('newRoundBtn').onclick=function(){
    if(state.round>=state.maxRounds)return;
    ask('Nuovo round','Vuoi chiudere il round '+state.round+'? I PV del round verranno aggiunti al totale di ogni giocatore e i soldi/gachapon del round saranno azzerati.',function(){
      state.players.forEach(function(p){p.totalPV+=calcPV(p).total;p.money=START_MONEY;p.cards=makeEmptyCards();p.roundPV=0});state.round++;save();render();
    });
  };
  document.getElementById('status4').addEventListener('change',function(){document.getElementById('name4').disabled=this.value==='Assente';if(this.value==='Assente')document.getElementById('name4').value=''})
  document.getElementById('startBtn').onclick=function(){
    var names=[1,2,3].map(function(i){return document.getElementById('name'+i).value.trim()||('Giocatore '+i)});
    if(document.getElementById('status4').value==='Attivo')names.push(document.getElementById('name4').value.trim()||'Giocatore 4');
    state=newState(names);save();document.getElementById('setupOverlay').classList.remove('open');render();
  };
  document.getElementById('name4').disabled=false;
  var loaded=load();
  if(loaded){state=loaded;document.getElementById('setupOverlay').classList.remove('open');render()}
  else{document.getElementById('name4').disabled=false}
})();
</script>
