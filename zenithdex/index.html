<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0e1118; --panel:rgba(255,255,255,.06); --panel2:rgba(255,255,255,.1);
  --text:#e8ecf4; --soft:#9aa5bb; --line:rgba(255,255,255,.14); --accent:#7aa7ff;
  --mercurio:#9b8cc9; --venere:#f28c28; --terra:#1ea0d8; --marte:#cf4f5a; --giove:#4fa58f;
}
html,body{min-height:100%}
body{font-family:'Inter',sans-serif;font-size:15px;color:var(--text);background:radial-gradient(ellipse at 50% 0%,#1d2740 0%,#0e1118 70%) fixed;background-color:var(--bg)}
.app{max-width:1040px;margin:0 auto;padding:6px 12px 36px}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 0 4px}
.topnav{display:flex;gap:8px;align-items:center}
.title{font-family:'Orbitron',sans-serif;font-weight:800;font-size:22px;letter-spacing:.06em;flex:1}
.title span{color:var(--accent)}
.nylo-home{color:#fff}
.sub{font-size:12px;color:var(--soft);margin:0 0 8px}
details.filters{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:8px 0 24px 0}
details.filters>summary{cursor:pointer;list-style:none;padding:9px 14px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px}
details.filters>summary::-webkit-details-marker{display:none}
details.filters>summary .cnt{margin-left:auto;color:var(--soft);font-weight:500}
.filter-bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:4px 12px 12px}
.filter-bar label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--soft);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.filter-bar select,.filter-bar input{min-width:140px;max-width:200px;background:#171d2b;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:8px 10px;font:inherit;font-size:14px;text-transform:none;letter-spacing:0}
.filter-bar .reset{align-self:flex-end;background:transparent;color:var(--accent);border:1px solid var(--line);border-radius:7px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer}
.alpha-wrap{position:relative;padding:0 8px 10px}
.alpha{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;padding:2px 4px}
.alpha button{flex-shrink:0;min-width:32px;height:32px;border:0;border-radius:6px;background:transparent;color:var(--text);font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.alpha button:hover{background:var(--panel2)}
.alpha button.on{background:var(--accent);color:#0b1020}
.display{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;margin-top:6px}
.card-row{display:flex;align-items:center;gap:8px}
.navb{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.navb:hover{background:var(--panel2)}
.mobile-nav{display:none}
.cardimg{width:200px;height:313px;background:url(cards.webp) no-repeat;background-size:2400px 2817px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.5);flex-shrink:0;touch-action:pan-y}
.details{flex:1;min-width:0;max-width:440px;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;border-left:6px solid var(--pc,#888)}
.cname{font-size:20px;font-weight:800;margin-bottom:6px}
.stats{display:flex;flex-wrap:wrap;gap:6px 12px;margin-bottom:8px;font-size:13px}
.stat{display:inline-flex;align-items:center;gap:5px;color:var(--soft)}
.stat b{color:var(--text)}
.pdot{width:12px;height:12px;border-radius:50%;background:var(--pc);display:inline-block}
.desc{padding:8px 10px;background:var(--panel);border-radius:6px;line-height:1.5;font-size:14px}
.desc.na{font-style:italic;color:var(--soft)}
.pl{font-weight:700;padding:0 4px;border-radius:4px;color:#0b1020;white-space:nowrap}
.pl.mercurio{background:var(--mercurio)}.pl.venere{background:var(--venere)}.pl.terra{background:var(--terra)}.pl.marte{background:var(--marte)}.pl.giove{background:var(--giove)}
.pos{margin-top:8px;font-size:12px;color:var(--soft)}
.empty{text-align:center;color:var(--soft);padding:40px 10px}
.footer{text-align:center;color:var(--soft);font-size:12px;margin-top:22px;line-height:1.6}
@media(max-width:600px){
  .display{flex-direction:column}
  .details{width:100%;max-width:none}
  .navb.desk{display:none}
  .mobile-nav{display:flex;gap:10px;justify-content:center;width:100%}
  .title{font-size:18px}
}
</style>

": 7, "row": 6}, {"n": "Simmons", "p": "M", "t": "R", "c": 0, "x": "Entrambi i giocatori portano i propri crediti fino a 8.", "col": 8, "row": 6}, {"n": "Princess Uxmal", "p": "M", "t": "H", "c": 5, "x": "Se il tuo avversario ha il distintivo Leader, ottieni 1 influenza su 2 pianeti adiacenti.", "col": 9, "row": 6}, {"n": "Célestin Petit", "p": "T", "t": "H", "c": 0, "x": "Sviluppa una delle tue tecnologie di livello più basso pagandone il costo.", "col": 10, "row": 6}, {"n": "Mungo", "p": "T", "t": "A", "c": 5, "x": "Ottieni 1 influenza su MERCURIO e VENERE OPPURE ottieni 1 influenza su MARTE e GIOVE.", "col": 11, "row": 6}, {"n": "Geta", "p": "G", "t": "A", "c": 3, "x": "Ottieni il distintivo Leader dal lato oro OPPURE ottieni 8 crediti.", "col": 0, "row": 7}, {"n": "Captain Andreev", "p": "G", "t": "H", "c": 4, "x": "Trasferisci 1 carta avversaria e ottieni il suo costo in crediti.", "col": 1, "row": 7}, {"n": "Lisa Charity", "p": "G", "t": "H", "c": 2, "x": "Il tuo avversario guadagna 3 crediti, tu guadagni 2 Zenithium.", "col": 2, "row": 7}, {"n": "Ivan", "p": "G", "t": "A", "c": 1, "x": "Ottieni 2 crediti per ogni tracciato in cui l'avversario ha almeno una carta.", "col": 3, "row": 7}, {"n": "GIBSØN", "p": "G", "t": "R", "c": 4, "x": "Trasferisci 2 carte dell'avversario e trasferisci altre 2 carte se cedi il distintivo Leader.", "col": 4, "row": 7}, {"n": "Arnulf", "p": "G", "t": "A", "c": 3, "x": "Esilia 2/4/7 delle tue carte GIOVE e ottieni rispettivamente 1/2/3 influenze su GIOVE.", "col": 5, "row": 7}, {"n": "Ragnar", "p": "R", "t": "A", "c": 0, "x": "Entrambi i giocatori portano i propri Zenithium fino a 2.", "col": 6, "row": 7}, {"n": "Willis", "p": "R", "t": "R", "c": 5, "x": "Cedi 2 influenze su un pianeta diverso da MARTE. Ottieni 2 influenze su un pianeta diverso e il distintivo Leader dal lato oro.", "col": 7, "row": 7}, {"n": "Démétrios", "p": "G", "t": "A", "c": 0, "x": "Scarta tutta la tua mano e ottieni 5 crediti.", "col": 8, "row": 7}, {"n": "Admiral Jack", "p": "G", "t": "H", "c": 5, "x": "Ottieni 1 influenza. Se il tuo avversario ha almeno 3 Zenithium, ottieni 1 influenza su un tracciato diverso.", "col": 9, "row": 7}, {"n": "Milady Jones", "p": "G", "t": "H", "c": 6, "x": "Ottieni 1 punto influenza su TERRA e ottieni il distintivo Leader.", "col": 0, "row": 8}, {"n": "P.K.D1CK", "p": "G", "t": "R", "c": 5, "x": "Ottieni 1 punto influenza e 1 Zenithium se possiedi il distintivo Leader.", "col": 1, "row": 8}, {"n": "CH4MB3RS", "p": "G", "t": "R", "c": 8, "x": "Ottieni 3 Zenithium. Ottieni 1 Zenithium aggiuntivo se possiedi il distintivo Leader.", "col": 2, "row": 8}, {"n": "M4RT1N", "p": "G", "t": "R", "c": 4, "x": "Se possiedi il distintivo Leader, ottieni 1 influenza su GIOVE.", "col": 3, "row": 8}, {"n": "Donald Smooth", "p": "G", "t": "H", "c": 2, "x": "Scarta 1 carta dalla tua mano e ottieni il suo costo in crediti.", "col": 4, "row": 8}, {"n": "Suleiman", "p": "G", "t": "A", "c": 1, "x": "Spendi 3/7/12 crediti per ottenere rispettivamente 1/2/3 influenze su un tracciato diverso da GIOVE.", "col": 5, "row": 8}];      // {n,p,t,c,x,col,row,txt}

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const letterOf = n => { const ch=n.normalize('NFD').replace(/[̀-ͯ]/g,'')[0].toUpperCase(); return /[A-Z]/.test(ch)?ch:'#'; };
CARDS.forEach(c=>{ c.L=letterOf(c.n); });
CARDS.sort((a,b)=>a.n.localeCompare(b.n,'it',{sensitivity:'base'}));

const EXP = new Set(["Dandy Müller", "Boull3", "Simmons", "Princess Uxmal", "Célestin Petit", "Mungo", "Ragnar", "Willis", "Démétrios", "Admiral Jack"]);   // le 10 carte dell'espansione (una per pianeta con costo 0 e una con costo 5)
CARDS.forEach(c=>{ c.e=EXP.has(c.n); });
const F = {p:'',t:'',c:'',q:'',e:'si'};
let list = CARDS.slice(), idx = 0;

function fillSelects(){
  $('fPl').innerHTML += Object.keys(PLANETS).map(k=>`<option value="${k}">${PLANETS[k].n}</option>`).join('');
  $('fTy').innerHTML += Object.keys(TYPES).map(k=>`<option value="${k}">${TYPES[k].n}</option>`).join('');
  const costs=[...new Set(CARDS.map(c=>c.c))].sort((a,b)=>a-b);
  $('fCo').innerHTML += costs.map(v=>`<option value="${v}">${v}</option>`).join('');
}
function applyFilter(keepName){
  const q=F.q.trim().toLowerCase();
  list=CARDS.filter(c=>(!F.p||c.p===F.p)&&(!F.t||c.t===F.t)&&(F.c===''||c.c===Number(F.c))&&(F.e==='si'||(F.e==='solo'?c.e:!c.e))&&(!q||c.n.toLowerCase().includes(q)||(c.x||'').toLowerCase().includes(q)));
  const k=keepName?list.findIndex(c=>c.n===keepName):-1;
  idx=k>=0?k:0;
  render();
}
function hl(txt){
  let s=esc(txt);
  return s.replace(/\b(MERCURIO|VENERE|TERRA|MARTE|GIOVE)\b/g,(m)=>{ const k={MERCURIO:'mercurio',VENERE:'venere',TERRA:'terra',MARTE:'marte',GIOVE:'giove'}[m]; return `<span class="pl ${k}">${m}</span>`; });
}
function renderAlpha(){
  const cur=list[idx]&&list[idx].L;
  const letters=[...new Set(list.map(c=>c.L))];
  $('alpha').innerHTML=letters.map(l=>`<button type="button" data-l="${l}" class="${l===cur?'on':''}">${l}</button>`).join('');
}
function render(){
  $('cnt').textContent=list.length+' / '+CARDS.length+' carte';
  renderAlpha();
  const m=$('main');
  if(!list.length){ m.innerHTML='<div class="empty">Nessuna carta corrisponde ai filtri.</div>'; return; }
  const c=list[idx], P=PLANETS[c.p], T=TYPES[c.t];
  const txt=c.x?`<div class="desc">${hl(c.x)}</div>`:'<div class="desc na">Testo non incluso nella traduzione: consulta la carta.</div>';
  m.innerHTML=`<div class="display" style="--pc:${P.c}">
    <div class="card-row">
      <button class="navb desk" type="button" data-nav="-1" aria-label="Precedente"><i class="ph ph-caret-left"></i></button>
      <div class="cardimg" id="cimg" style="background-position:${-200*c.col}px ${-313*c.row}px" role="img" aria-label="${esc(c.n)}"></div>
      <button class="navb desk" type="button" data-nav="1" aria-label="Successiva"><i class="ph ph-caret-right"></i></button>
    </div>
    <div class="details">
      <div class="cname">${esc(c.n)}</div>
      <div class="stats">
        <span class="stat"><span class="pdot"></span><b>${P.n}</b></span>
        <span class="stat"><i class="ph ph-coins"></i> Costo <b>${c.c}</b></span>
        <span class="stat"><i class="ph ph-${T.i}"></i> <b>${T.n}</b></span>
      </div>
      ${txt}
      <div class="pos">${idx+1} di ${list.length}</div>
    </div>
    <div class="mobile-nav">
      <button class="navb" type="button" data-nav="-1" aria-label="Precedente"><i class="ph ph-caret-left"></i></button>
      <button class="navb" type="button" data-nav="1" aria-label="Successiva"><i class="ph ph-caret-right"></i></button>
    </div>
  </div>`;
  const img=$('cimg'); let x0=null;
  img.addEventListener('touchstart',e=>{ x0=e.touches[0].clientX; },{passive:true});
  img.addEventListener('touchend',e=>{ if(x0==null) return; const dx=e.changedTouches[0].clientX-x0; x0=null; if(Math.abs(dx)>40) go(dx<0?1:-1); });
  try{ history.replaceState(null,'','#'+encodeURIComponent(c.n)); }catch(e){}
}
function go(d){ if(!list.length) return; idx=(idx+d+list.length)%list.length; render(); }

document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.nav) go(Number(b.dataset.nav));
  else if(b.dataset.l){ const k=list.findIndex(c=>c.L===b.dataset.l); if(k>=0){ idx=k; render(); } }
});
document.addEventListener('keydown',e=>{
  if(/INPUT|SELECT|TEXTAREA/.test((e.target||{}).tagName||'')) return;
  if(e.key==='ArrowLeft') go(-1); else if(e.key==='ArrowRight') go(1);
});
$('fPl').onchange=e=>{ F.p=e.target.value; applyFilter(); };
$('fTy').onchange=e=>{ F.t=e.target.value; applyFilter(); };
$('fCo').onchange=e=>{ F.c=e.target.value; applyFilter(); };
$('fEx').onchange=e=>{ F.e=e.target.value; applyFilter(); };
$('fQ').oninput=e=>{ F.q=e.target.value; applyFilter(); };
$('fReset').onclick=()=>{ F.p=F.t=F.c=F.q=''; F.e='si'; $('fPl').value=$('fTy').value=$('fCo').value=$('fQ').value=''; $('fEx').value='si'; applyFilter(); };

fillSelects();
let start=''; try{ start=decodeURIComponent(location.hash.slice(1)); }catch(e){}
applyFilter(start);
</script>
