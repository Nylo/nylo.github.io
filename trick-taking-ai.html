<!DOCTYPE html>
<html lang="it" class="h-full">
<head>
<script src="/auth-gate.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trick-taking vs AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body{font-family:'Inter',sans-serif}</style>
</head>
<body class="min-h-full m-0 bg-slate-900 text-slate-100">
    <main class="mx-auto max-w-7xl px-4 py-10">
        <h1 class="text-2xl font-bold">Trick-taking vs AI</h1>
        <p class="mt-1 text-sm text-slate-400">Gioca contro l'intelligenza artificiale.</p>
        <div id="games" class="mt-8 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4"></div>
    </main>
    <script>
        var GAMES = [
                {
                        "name": "Spy Team",
                        "players": "4",
                        "desc": "2 contro 2: tu e un compagno AI contro due avversari.",
                        "href": "/spy-team.html"
                },
                {
                        "name": "6 Forces",
                        "players": "3–4",
                        "desc": "Previsione delle prese e Briscola Personale.",
                        "href": "/six-forces.html"
                },
                {
                        "name": "Charms",
                        "players": "3–4",
                        "desc": "Carte seme e numero, 4 mani, vince chi ha meno punti.",
                        "href": "/charms.html"
                },
                {
                        "name": "Quashars",
                        "players": "3–4",
                        "desc": "Carte Contratto e gettoni di previsione.",
                        "href": "/quashars.html"
                },
                {
                        "name": "American Bookshop",
                        "players": "3–5",
                        "desc": "Somma limite e maggioranze di colore.",
                        "href": "/american-bookshop.html"
                },
                    {
                        "name": "Don't Take Me!!!",
                        "players": "3–5",
                        "desc": "Evita le prese con i tuoi numeri Keep Out. Run Away!",
                        "href": "/dont-take-me.html"
                    },
                    {
                        "name": "My Own Sunny Day",
                        "players": "3–4",
                        "desc": "Apri e chiudi l'ombrello e pareggia le prese. Uscita e Ritorno a casa.",
                        "href": "/my-own-sunny-day.html"
                    },
                    {
                        "name": "Hearts and Minds",
                        "players": "3–4",
                        "desc": "Scegli un Obiettivo a ogni round, briscola opposta al seme di mano. 4 round.",
                        "href": "/hearts-and-minds.html",
                        "badge": "Beta"
                    },
                    {
                        "name": "David & Goliath",
                        "players": "3–5",
                        "desc": "La carta più bassa prende la più alta, la più alta prende il resto. Pochi colori valgono tanto.",
                        "href": "/david-and-goliath.html"
                    },
                    {
                        "name": "Apocalypse",
                        "players": "2–6",
                        "desc": "Segnalini Apocalisse, vince la carta più alta… finché tutti i segnalini sono neri. Meno punti vince.",
                        "href": "/apocalypse.html"
                    }
        ];
        function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
        document.getElementById('games').innerHTML = GAMES.map(function (g) {
            var inner = '<div class="flex items-start justify-between gap-2"><div class="flex flex-wrap items-center gap-x-2 gap-y-1"><h2 class="text-lg font-semibold">' + esc(g.name) + '</h2>' +
                (g.badge ? '<span class="rounded border border-amber-500/60 px-1.5 py-0.5 text-[10px] font-semibold uppercase tracking-wide text-amber-400">' + esc(g.badge) + '</span>' : '') + '</div>' +
                '<span class="shrink-0 whitespace-nowrap rounded-full bg-slate-700/60 px-2 py-0.5 text-xs font-medium text-slate-300" title="Numero di giocatori">' + esc(g.players) + ' giocatori</span></div>' +
                '<p class="mt-2 text-sm text-slate-400">' + esc(g.desc) + '</p>';
            if (!g.href) return '<div class="rounded-xl border border-slate-700/50 bg-slate-900/40 p-5 opacity-50 cursor-not-allowed" aria-disabled="true">' + inner + '</div>';
            return '<a href="' + g.href + '" class="block rounded-xl border border-slate-700/50 bg-slate-900/80 p-5 transition-colors hover:border-teal-500/60 hover:bg-slate-800/90">' + inner + '</a>';
        }).join('');
    </script>
</body>
</html>
